name: Build TI report

# Regenerates ti-report.html from ti-output-config.json + report-template.html.
#
# NOTE: the build is deterministic - the same config and template always produce
# the same HTML. The scheduled run therefore only produces a commit when the
# config (or template) has actually changed since the last build. It refreshes
# the *rendering*, not the threat data; nothing here fetches new intelligence or
# touches report.check_performed_at.

on:
  schedule:
    # GitHub's cron is UTC-only and has no DST awareness, so both candidate
    # times are registered and the guard job drops whichever is wrong for the
    # current UK offset. Net effect: 11:30 Europe/London all year round.
    - cron: "30 10 * * *" # 11:30 UK while on BST (UTC+1)
    - cron: "30 11 * * *" # 11:30 UK while on GMT (UTC+0)
  # Rebuild immediately when an input changes, so the report never lags the data.
  push:
    branches: [main]
    paths:
      - "ti-output-config.json"
      - "report-template.html"
      - "build-report.py"
      - ".github/workflows/build-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ti-report
  cancel-in-progress: false

jobs:
  guard:
    name: Is this the 11:30 UK run?
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Triggered by '$EVENT_NAME' - no schedule guard needed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset="$(TZ=Europe/London date +%z)"
          case "$offset" in
            +0100) want="30 10 * * *" ; season="BST (UTC+1)" ;;
            +0000) want="30 11 * * *" ; season="GMT (UTC+0)" ;;
            *) echo "::error::Unexpected Europe/London UTC offset '$offset'" ; exit 1 ;;
          esac

          now_uk="$(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')"
          if [ "$FIRED_CRON" = "$want" ]; then
            echo "UK is on $season, so cron '$FIRED_CRON' is the live trigger. Now: $now_uk"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "UK is on $season, so cron '$FIRED_CRON' is the off-season trigger. Skipping. Now: $now_uk"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Rebuild ti-report.html
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: pip install --quiet jsonschema

      - name: Validate config against schema
        run: |
          python - <<'PY'
          import json
          import jsonschema

          with open("ti-output-config.json", encoding="utf-8") as fh:
              cfg = json.load(fh)
          with open("ti-output.schema.json", encoding="utf-8") as fh:
              jsonschema.validate(cfg, json.load(fh))

          report = cfg["report"]
          print(f"config valid: {len(cfg['vulnerabilities'])} entries, "
                f"check performed {report['check_performed_at']}")
          PY

      - name: Build report
        run: python3 build-report.py

      - name: Commit the rebuilt report
        run: |
          set -euo pipefail

          if git diff --quiet -- ti-report.html; then
            echo "ti-report.html is already up to date - nothing to commit."
            echo "No change: the report already matched the current config." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          check_date="$(python3 -c "import json;print(json.load(open('ti-output-config.json'))['report']['check_performed_at'])")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ti-report.html
          git commit -m "Rebuild ti-report.html for TI check ${check_date}" \
                     -m "Generated by the scheduled Build TI report workflow."

          # main can move between checkout and push; rebase and retry a few times.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Rebuilt ti-report.html for check ${check_date}." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto the latest ${GITHUB_REF_NAME}."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the rebuilt report after 3 attempts."
          exit 1
