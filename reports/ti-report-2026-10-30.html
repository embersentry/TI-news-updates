<!doctype html>
<html lang="en" data-palette="#FF5A1F,#FF8C1A,#9A958C">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat Intelligence Brief</title>
<meta name="description" content="Daily threat intelligence brief: ranked vulnerabilities with analyst summaries, KQL hunting queries and IOCs.">
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --raised:#1C1C1A;
    --border:#2E2E2B;
    --border-strong:#403F3A;
    --ink:#F4F0E6;
    --ink-dim:#C9C4B8;
    --muted:#9A958C;
    --accent:#FF6A1A;
    --accent-hot:#FF5A1F;
    --accent-soft:rgba(255,106,26,.12);
    --accent-line:rgba(255,106,26,.32);
    --bar:rgba(255,106,26,.5);
    --radius:4px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- masthead ---------- */
  header.mast{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#121211 0%,var(--bg) 100%)}
  .mast-in{max-width:var(--maxw);margin:0 auto;padding:28px 16px 24px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{width:30px;height:30px;flex:none}
  .brand-txt h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .brand-txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .stamp{display:flex;flex-wrap:wrap;gap:22px}
  .stamp div{min-width:0}
  .stamp dt{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .stamp dd{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap}
  .stamp dd b{color:var(--accent);font-weight:600}

  /* ---------- priority banner ---------- */
  .alert{margin:22px 0 0;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-left:3px solid var(--accent-hot);border-radius:var(--radius);padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start}
  .alert svg{flex:none;margin-top:2px}
  .alert .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
    font-weight:650;margin:0 0 3px}
  .alert p{margin:0;font-size:14px;color:var(--ink)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:var(--radius);margin:22px 0 0;overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .tile{background:var(--surface);padding:14px 16px 13px}
  .tile .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;display:block}
  .tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
  .tile.hot .n{color:var(--accent-hot)}
  .tile.warn .n{color:var(--accent)}

  /* ---------- posture bar ---------- */
  .posture{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 14px}
  .posture h2{margin:0 0 11px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .pbar{display:flex;gap:2px;height:12px;border-radius:2px;overflow:hidden;background:var(--bg)}
  .pseg{min-width:3px}
  .pseg.s-exploited{background:var(--accent-hot)}
  .pseg.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .pseg.s-none{background:var(--muted)}
  .plegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px}
  .plegend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-dim)}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none}
  .swatch.s-exploited{background:var(--accent-hot)}
  .swatch.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .swatch.s-none{background:var(--muted)}
  .plegend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 0;
    padding-bottom:18px;border-bottom:1px solid var(--border)}
  .search{position:relative;flex:1 1 230px;min-width:0}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:var(--radius);padding:9px 11px 9px 34px;font-size:14px;font-family:var(--sans)}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);
    border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
    transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
  .chip:hover{border-color:var(--border-strong);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A;font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{background:transparent;border:1px solid var(--border);color:var(--ink-dim);border-radius:var(--radius);
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

  /* ---------- entry cards ---------- */
  .entries{margin:0;padding:0;list-style:none}
  .card{border-bottom:1px solid var(--border)}
  .card.is-open{background:var(--surface)}
  .chead{display:flex;gap:16px;padding:20px 4px;cursor:pointer;align-items:flex-start;
    width:100%;background:none;border:0;text-align:left;font-family:inherit;color:inherit}
  .chead:hover .ctitle{color:var(--accent)}
  .chead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{flex:none;width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;
    font-family:var(--mono);font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
    background:var(--raised);border:1px solid var(--border);color:var(--muted)}
  .card[data-status="exploited_in_the_wild"] .rank{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .cbody{flex:1;min-width:0}
  .ctitle{margin:0;font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;
    transition:color .12s}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
  .teaser{margin:10px 0 0;font-size:14px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.is-open .teaser{display:none}
  .caret{flex:none;color:var(--muted);transition:transform .15s;margin-top:7px}
  .card.is-open .caret{transform:rotate(90deg);color:var(--accent)}

  /* pills: status differentiated by WEIGHT + always a text label, never hue alone */
  .pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
    padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;
    align-items:center;gap:5px;line-height:1.5}
  .pill.st-exploited{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.st-attempts{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.st-none{background:transparent;border-color:var(--border-strong);color:var(--muted)}
  .pill.kev{background:transparent;border-color:var(--accent-line);color:var(--accent)}
  .pill.nopatch{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.partial{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.plain{background:transparent;border-color:var(--border);color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:500;
    white-space:normal;max-width:100%;overflow-wrap:anywhere}
  .cve{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);background:var(--raised);
    border:1px solid var(--border);border-radius:3px;padding:2px 7px;white-space:nowrap}
  .cve.more{color:var(--muted);background:transparent}

  /* ---------- detail ---------- */
  .detail{display:none;padding:0 4px 30px 54px}
  .card.is-open .detail{display:block}
  .sec{margin-top:26px}
  .sec:first-child{margin-top:6px}
  .sec > h3{margin:0 0 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:650;display:flex;align-items:center;gap:9px}
  .sec > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .prose{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.72;max-width:76ch}
  .facts{display:flex;flex-wrap:wrap;border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden}
  .facts div{flex:1 1 168px;background:var(--bg);padding:10px 13px;
    border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .card.is-open .facts div{background:var(--raised)}
  .facts dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .facts dd{margin:0;font-size:13px;font-family:var(--mono);color:var(--ink-dim)}
  ul.list{margin:0;padding-left:0;list-style:none}
  ul.list li{position:relative;padding-left:20px;margin-bottom:8px;font-size:14px;color:var(--ink-dim);max-width:78ch}
  ul.list li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;
    background:var(--accent);border-radius:1px}
  ul.list.num{counter-reset:a}
  ul.list.num li{counter-increment:a;padding-left:26px}
  ul.list.num li::before{content:counter(a);background:none;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);top:0;left:2px;width:auto;height:auto;font-weight:600}

  /* KQL */
  .kql{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;background:var(--bg);overflow:hidden}
  .kql-head{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
    border-bottom:1px solid var(--border);background:var(--raised);flex-wrap:wrap}
  .kql-head .kn{flex:1;min-width:140px}
  .kql-head h4{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .kql-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}
  .plat{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:3px;padding:2px 7px;
    white-space:nowrap;flex:none}
  .kql pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:var(--ink-dim);tab-size:2}
  .kql pre .k{color:var(--accent)}
  .kql pre .s{color:#C9C4B8}
  .kql pre .c{color:#6E6A63;font-style:italic}
  .copy{flex:none;background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:3px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.ok{border-color:var(--accent-hot);color:var(--accent-hot)}

  /* IOC table */
  .tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:9px 13px;background:var(--raised);color:var(--muted);
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-dim)}
  tbody tr:last-child td{border-bottom:0}
  td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere;min-width:120px}
  td.t{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
  td.ctx{min-width:220px;line-height:1.55}
  td.src{font-size:12px;color:var(--muted);min-width:130px}
  .cf{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;padding:2px 7px;
    border-radius:999px;border:1px solid;white-space:nowrap}
  .cf.high{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .cf.medium{background:transparent;border-color:var(--border-strong);color:var(--ink-dim)}
  .cf.low{background:transparent;border-color:var(--border);color:var(--muted)}
  tr.is-note td{background:rgba(255,106,26,.05)}
  .note-row{font-size:12.5px;color:var(--muted);font-style:italic}
  .refs{margin:0;padding:0;list-style:none}
  .refs li{margin-bottom:7px}
  .refs a{color:var(--accent);text-decoration:none;font-size:13px;font-family:var(--mono);
    overflow-wrap:anywhere;border-bottom:1px solid transparent}
  .refs a:hover{border-bottom-color:var(--accent)}

  /* ---------- provenance ---------- */
  .prov{margin:40px 0 0;border:1px solid var(--border);border-left:3px solid var(--border-strong);
    border-radius:var(--radius);background:var(--surface)}
  .prov > summary{cursor:pointer;padding:15px 18px;font-size:13px;font-weight:600;color:var(--ink);
    list-style:none;display:flex;align-items:center;gap:10px}
  .prov > summary::-webkit-details-marker{display:none}
  .prov > summary:hover{color:var(--accent)}
  .prov > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .prov[open] > summary{border-bottom:1px solid var(--border)}
  .prov-body{padding:18px}
  .prov-body h4{margin:20px 0 9px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .prov-body h4:first-child{margin-top:0}
  .prov-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}
  .prov-body dt{font-weight:650;color:var(--accent);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding-top:3px}
  .prov-body dd{margin:0;color:var(--ink-dim)}

  footer.foot{margin:44px 0 0;border-top:1px solid var(--border);padding:20px 0 50px;
    display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  footer.foot p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .drop-hint{font-size:12px;color:var(--muted)}

  .empty{padding:60px 4px;text-align:center;color:var(--muted);font-size:14px}
  body.dragging::after{content:"Drop a TI JSON file to load it";position:fixed;inset:14px;
    border:2px dashed var(--accent);border-radius:8px;background:rgba(10,10,10,.9);color:var(--accent);
    display:grid;place-items:center;font-size:17px;font-weight:600;z-index:99;pointer-events:none}

  @media (max-width:720px){
    .brand{align-items:flex-start}
    .detail{padding-left:4px}
    .stamp{gap:16px}
    .mast-in{padding-top:22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- report archive timeline ---------- */
  .timeline{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 16px}
  .tl-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;
    justify-content:space-between;margin-bottom:14px}
  .tl-head h2{margin:0;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .tl-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-meta b{color:var(--ink);font-weight:600}
  .tl-latest{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;
    border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .tl-latest:hover{background:var(--accent-soft)}
  .tl-chart{position:relative}
  .tl-bars{display:flex;align-items:flex-end;gap:3px;height:62px;overflow-x:auto;
    overflow-y:hidden;padding-bottom:1px}
  .tl-bar{flex:1 1 0;min-width:5px;height:100%;background:none;border:0;
    padding:0;cursor:pointer;display:flex;align-items:flex-end}
  .tl-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tl-fill{width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--bar);
    transition:background .12s}
  .tl-bar:hover .tl-fill,.tl-bar:focus-visible .tl-fill{background:var(--accent)}
  .tl-bar.is-current .tl-fill{background:var(--accent-hot)}
  .tl-axis{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tl-tip{position:absolute;top:calc(100% + 8px);z-index:5;pointer-events:none;
    background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:9px 11px;min-width:190px;max-width:330px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .tl-tip[hidden]{display:none}
  .tl-tip .t-d{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 5px}
  .tl-tip .t-h{margin:0 0 7px;font-size:12.5px;color:var(--ink);line-height:1.45}
  .tl-tip .t-c{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tl-list{list-style:none;margin:17px 0 0;padding:0;border-top:1px solid var(--border)}
  .tl-list li{margin:0}
  .tl-row{display:flex;gap:14px;align-items:baseline;padding:9px 4px;
    border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
  .tl-row:hover{background:var(--raised)}
  .tl-row:hover .tl-h{color:var(--accent)}
  .tl-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tl-d{flex:none;width:86px;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .tl-h{flex:1;min-width:0;font-size:13.5px;color:var(--ink-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tl-c{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .tl-now{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:1px 7px}
  .tl-more{margin-top:13px}
  @media (max-width:720px){
    .tl-c{display:none}
    .tl-d{width:72px}
    /* Keep the caption - it is what names the series - but give it its own
       line instead of letting it wrap between the two date labels. */
    .tl-axis{flex-wrap:wrap}
    .tl-axis span:nth-child(2){order:3;flex:1 0 100%;text-align:center;margin-top:4px}
  }

  /* ---------- print ---------- */
  @media print{
    :root{--bg:#fff;--surface:#fff;--raised:#f4f2ee;--border:#d5d2cb;--border-strong:#b5b1a8;
          --ink:#111;--ink-dim:#2a2a28;--muted:#5d5a54;--accent:#B83F00;--accent-hot:#B83F00;
          --accent-soft:#faeee6;--accent-line:#e0b79e}
    body{font-size:10.5pt}
    .controls,.caret,.copy,footer.foot,.drop-hint{display:none!important}
    .detail{display:block!important;padding-left:0;page-break-inside:avoid}
    .teaser{display:none!important}
    .card{page-break-inside:avoid;border-bottom:1px solid var(--border)}
    .chead{cursor:default;padding:14px 0}
    .card[data-status="exploited_in_the_wild"] .rank{background:#B83F00;color:#fff}
    .pill.st-exploited,.pill.nopatch{background:#B83F00;color:#fff}
    .kql pre{white-space:pre-wrap;word-break:break-word}
    .tl-row[hidden]{display:flex!important}
    .tl-more,.tl-tip{display:none!important}
    .tl-bars{overflow:visible}

26-109619) - NCSC Patch-or-Isolate Alert Forces UK Councils, NHS Boards and Met Police Sites Offline","cve_ids":["CVE-2026-109618","CVE-2026-109619"],"vendor":"PHP Group","affected_products":["PHP (unpatched supported branches; check php.net advisory for exact versions)"],"category":"vulnerability","cvss_v3":9.2,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-10-21","last_updated":"2026-10-30","confidence":"medium","summary":"UK government and public sector. Press reports (STV News, Insurance Business, Lancashire Evening Post) say the NCSC, with EU and Australian counterparts, urged immediate patching of two critical PHP flaws nicknamed 'PHP2Shell' (CVE-2026-109618/109619, both reported at CVSS 9.2) that can allow unauthenticated remote takeover of a web server. NCSC advice: patch at once; if not possible apply PHP's temporary mitigations; if that is also not quick, consider taking affected systems offline. In response, at least seven of Scotland's 32 councils and six NHS health boards pulled public websites, and Edinburgh and Oxford councils, South Ribble Borough Council, the Met Police and Golden Jubilee Hospital were reported affected. Most sites were restored within hours to the next morning after patching. No confirmed in-the-wild exploitation was found in the sources; the takedowns were precautionary. NHS England Digital also lists PHP advisories dated 20-21 Oct. Details are from secondary reporting; NCSC primary text and PHP advisory were not retrieved. UPDATE 23 Oct: multiple security vendors now report in-the-wild exploitation - watchTowr (honeypot sightings), Patchstack (multiple confirmed incidents), Aikido and Cloudflare (early attack attempts); the Dutch NCSC says it is receiving partner signals of active weaponisation, while CISA had not observed exploitation as of its 21 Oct alert and the CVEs were not seen in KEV. Datadog states the widely circulated config workaround does not protect; only patching fixes it. No UK-specific compromise confirmed. UPDATE 24 Oct: fixed releases reported as PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 (PHP 8.1 and older unsupported; use vendor backports). Wiz, Tanium, Bitsight and Canada's Cyber Centre (AL26-026) have published guidance; KEV listing still not confirmed. UPDATE 25 Oct: SecurityWeek reports Mirai botnet operators joining PHP2Shell attacks and ASLR-bypass exploits emerging; Amazon threat intelligence reports first attempts from 17 Oct, ahead of the fix; joint NSA/CISA guidance urges immediate patching or taking unpatchable systems offline. Vendor accounts conflict on exploit reliability. KEV listing not confirmed. UPDATE 26 Oct: no new UK-specific compromise reported; NCSC guidance unchanged (patch to fixed releases or take unpatchable systems offline). KEV listing not confirmed. UPDATE 27 Oct: CISA added CVE-2026-109618 and CVE-2026-109619 to the KEV catalog on 26 Oct (alert 'CISA Adds Two Known Exploited Vulnerabilities to Catalog'), formally confirming in-the-wild exploitation (earlier 23 Oct CISA text said none observed). KEV due date not retrieved. VulnCheck reports an ASLR-aware x86-64 exploit against CVE-2026-109618 (customers only). No new UK-specific compromise confirmed; NCSC guidance unchanged. UPDATE 28 Oct: no new UK-specific compromise reported; NCSC CTO weekly summary (w/e 25 Oct) still urges immediate PHP mitigation. UPDATE 29 Oct: search summaries cite a Lords statement (Baroness Lloyd) that 32 central government services were unavailable and four partly affected, mostly precautionary, with no confirmed compromise of central government or wider public sector systems; some early compromise claims withdrawn. Amazon and honeypot reports of wider exploitation (incl. 35 live shells) remain unconfirmed by UK officials. UPDATE 30 Oct: no new UK-specific compromise reported; press (Irish News) cites a minister saying there was no breach of Budget security after the PHP flaw; NCSC guidance unchanged.","recommended_actions":["Upgrade to PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 or a vendor-backported fix; replace unsupported 8.1 and older.","Inventory all PHP-based web servers (CMS, intranets, legacy portals, third-party hosted council/NHS sites) and patch to the fixed PHP releases from php.net immediately.","Do not rely on the circulated config-only workaround (reported ineffective); prioritise patching.","Where patching is delayed, apply PHP's published temporary mitigations and restrict exposure via WAF/reverse proxy; isolate if neither is possible.","Hunt for webshells and unexpected child processes from PHP handlers; review web logs for anomalous requests since 2026-10-20.","Confirm suppliers and hosting providers have patched before restoring sites."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Web server PHP process spawning shell","description":"Possible PHP2Shell post-exploitation: PHP/Apache/nginx parents spawning shells or download tools. Untested; tune.","query":"DeviceProcessEvents\n| where Timestamp > ago(7d)\n| where InitiatingProcessFileName in~ (\"php\",\"php-fpm\",\"php-cgi\",\"php-fpm8\",\"apache2\",\"httpd\",\"nginx\",\"w3wp.exe\")\n| where FileName in~ (\"sh\",\"bash\",\"dash\",\"cmd.exe\",\"powershell.exe\",\"curl\",\"wget\",\"nc\")\n| project Timestamp, DeviceName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine"},{"platform":"sentinel","table":"DeviceFileEvents","name":"New PHP files written in web roots","description":"Hunts newly created .php files in common web directories (possible webshells).","query":"DeviceFileEvents\n| where TimeGenerated > ago(7d)\n| where ActionType == \"FileCreated\"\n| where FileName endswith \".php\"\n| where FolderPath has_any (\"/var/www\",\"/usr/share/nginx\",\"\\\\inetpub\\\\wwwroot\",\"htdocs\")\n| project TimeGenerated, DeviceName, FolderPath, FileName, InitiatingProcessFileName, InitiatingProcessCommandLi Schools IT Network Hit by Second Cyber Attack - Records Exported (Bristol)","cve_ids":[],"vendor":"Local authority schools network","affected_products":["Primary school / council-run IT network"],"category":"incident","cvss_v3":null,"severity":"medium","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-09-21","last_updated":"2026-10-15","confidence":"low","summary":"Bristol24/7 reports a primary school served by a council schools IT network suffered a second cyber attack, with records exported in a data breach. Suspicious activity was spotted on 21 September when the first attack hit, but the network was not shut down until 25 September, which opposition councillors called 'very worrying'. The same actors are believed responsible for both attacks, though this is unconfirmed. Local-authority education is a recurring UK public-sector target. Single-source, secondary summary; scope and actor unconfirmed.","recommended_actions":["Local authorities and MATs: review containment timelines and isolate school networks faster on suspicious activity.","Reset credentials after a first incident and confirm persistence is removed before restoring service.","Report to ICO, DfE and NCSC as required; check backups for offline copies."],"kql":[{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Large outbound transfers to file-sharing/cloud storage from school servers","description":"Exfiltration hunt; tune hostnames and thresholds.","query":"DeviceNetworkEvents\n| where Timestamp > ago(14d)\n| where RemoteUrl has_any (\"mega.nz\",\"mega.io\",\"anonfiles\",\"transfer.sh\",\"file.io\")\n| summarize Hits=count(), Hosts=dcount(DeviceName) by RemoteUrl, InitiatingProcessFileName\n| order by Hits desc"}],"iocs":[{"type":"note","value":"No technical indicators published.","context":"Provenance statement, not an indicator.","confidence":"high"},{"type":"ttp","value":"Repeat intrusion with data exfiltration after delayed containment","context":"Reported pattern for the schools network.","confidence":"low","source":"bristol247.com"}],"references":["https://bristol247.com/news-and-features/news/primary-school-hit-by-second-cyber-attack-as-records-exported-in-data-breach"],"rank":5},{"rank":6,"id":"TI-2026-10-21-004","title":"Citrix NetScaler ADC/Gateway Zero-Days Under Active Exploitation - NCSC and NHS England Alerts; UK Follow-on SAML Flaw Pending (CVE-2026-88771, CVE-2026-88772, CVE-2026-107406)","cve_ids":["CVE-2026-88771","CVE-2026-88772","CVE-2026-107406"],"vendor":"Citrix / Cloud Software Group","affected_products":["NetScaler ADC and Gateway 14.1 before 14.1-73.37","NetScaler ADC and Gateway 13.1 before 13.1-64.23","FIPS / NDcPP variants","Hybrid Secure Private Access deployments using NetScaler"],"category":"vulnerability","cvss_v3":9.5,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-09-30","patch_available":"yes","first_reported":"2026-09-27","last_updated":"2026-10-15","confidence":"medium","summary":"UPDATE 2026-10-15: No NCSC update newer than the September advisory was found in the window; the NCSC continues to urge prompt mitigation, says it is still assessing UK impact, and warned that exploitation attempts would rise once patches and technical details were public (which has now happened: public PoC and mass 'spray and pray' scanning reported 2026-10-14). Mandiant says exploitation began in early September and affected North America and Europe. Sophos warns patching alone does not evict an attacker already on an appliance. Prior detail: UPDATE 2026-10-14: Help Net Security reports NetScaler exploitation has escalated from stealthy zero-day targeting into widespread 'spray and pray' attacks, fuelled by a published root-cause analysis and a public proof-of-concept exploit; Citrix and CISA confirm active exploitation and note patching alone may not remove access from an already-compromised appliance. No UK-specific victims were identified in search. The UK NCSC has told UK organisations to mitigate Citrix NetScaler ADC and Gateway flaws promptly after confirming reports of active exploitation of CVE-2026-88771 (unauthenticated command execution, CVSS 9.5, affects default configurations) and CVE-2026-88772 (memory overflow leading to code execution or DoS, CVSS 9.5, requires DTLS, which is on by default for VPN virtual servers). Citrix disclosed them on 2026-09-27 (bulletin CTX697096) and CISA added both to KEV the same day with a 2026-09-30 federal deadline, but researchers report webshell deployment since early September, i.e. exploitation preceded disclosure. NHS England's National CSOC issued alert CC-4858 (2026-09-28) rating further exploitation 'almost certain', and a follow-on alert CC-4865 (updated 2026-10-09) covers a separate critical SAML memory-overflow flaw, CVE-2026-107406, which NHS CSOC assesses as likely to be exploited but which is not reported exploited. NetScaler is common in UK central government, NHS trusts, councils and corporate remote-access estates; no UK-specific exposure count was found (global counts range from ~21,000 to ~50,000 exposed instances depending on scanner). Post-exploitation reporting describes web shells (WHIPSHOT), a Python tunneller (SLAPSHOT) and a custom remote-management implant (Platypus) with a replaced customsnmpd. Patching alone does not evict an implant: appliances exposed since early September should be treated as potentially compromised. NOTE: this item is a carry-over/escalation from late September rather than a first report inside the 24h window; it is included because it is the only confirmed, actively exploited issue with direct NCSC and NHS England UK advisories and a pending follow-on CVE. Indicator detail comes from secondary vendor blogs - verify against Citrix's IoC scanner and the NCSC page. Primary pages could not be fetched directly in this run.","recommended_actions":["Treat public PoC availability as raising urgency: patch internet-facing NetScaler now, and rebuild/replace any appliance exposed since early September rather than only patching.","Upgrade to 14.1-73.37 / 13.1-64.23 or later and then apply the fix for CVE-2026-107406 as it lands; do not rely on mitigation alone.","Run Citrix's IoC checker and review appliances for the listed file paths, unexpected .deb files and replaced customsnmpd; treat hits as full compromise.","Rotate credentials and secrets stored on or reachable from the appliance, and invalidate VPN sessions.","Restrict management and gateway exposure; forward NetScaler logs to Sentinel.","Follow NCSC and NHS England Digital cyber alerts CC-4858/CC-4865 for updates."],"kql":[{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Citrix NetScaler - exploitation artefact file paths","description":"Applies if NetScaler/Linux telemetry or file-integrity logs reach MDE. Otherwise port to FIM or syslog.","query":"DeviceFileEvents\n| where Timestamp > ago(45d)\n| where FolderPath has_any (\"/vpn/scripts/linux/\",\"/var/netscaler/logon/LogonPoint/custom/\")\n| where FileName in~ (\"nsgclient18.deb\",\"nsg64.deb\",\".ctxs.receiver\") or FileName endswith \".deb\"\n| project Timestamp, DeviceName, FolderPath, FileName, SHA256, InitiatingProcessFileName, InitiatingProcessCommandLine\n| sort by Timestamp desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Citrix NetScaler - post-patch outbound connections from appliances","description":"Populate ns_ips. Flags appliance-originated outbound connections to non-allow-listed public destinations (implant C2 / tunnelling).","query":"let ns_ips = dynamic([\"\u003cNETSCALER_SNIP_OR_NSIP>\"]);\nlet allowed = dynamic([\"\u003cNTP/DNS/UPDATE_IPs>\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(45d)\n| where SourceIP in (ns_ips)\n| where DestinationIP !in (allowed) and not(ipv4_is_private(DestinationIP))\n| summarize Connections=count(), Ports=make_set(DestinationPort,20), FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated) by SourceIP, DestinationIP\n| sort by Connections desc"},{"platform":"sentinel","table":"Syslog","name":"Citrix NetScaler - suspicious activity in appliance syslog","description":"Looks for shell/webshell keywords in NetScaler syslog. Field names vary by build; tune.","query":"Syslog\n| where TimeGenerated > ago(45d)\n| where Computer has_any (\"netscaler\",\"ns\") or ProcessName has \"nsppe\"\n| where SyslogMessage has_any (\"WHIPSHOT\",\"SLAPSHOT\",\"customsnmpd\",\".ctxs.receiver\",\"nsgclient18\",\"/bin/sh -c\")\n| project TimeGenerated, Computer, ProcessName, SyslogMessage\n| sort by TimeGenerated desc"}],"iocs":[{"type":"filepath","value":"/vpn/scripts/linux/nsgclient18.deb","context":"Unexpected package staged on appliance.","confidence":"medium","source":"Unit 42 (as relayed)"},{"type":"filepath","value":"/vpn/scripts/linux/nsg64.deb","context":"Unexpected package staged on appliance.","confidence":"medium","source":"Unit 42 (as relayed)"},{"type":"filepath","value":"/var/netscaler/logon/LogonPoint/custom/.ctxs.receiver","context":"Hidden artefact in LogonPoint custom directory.","confidence":"medium","source":"Unit 42 (as relayed)"},{"type":"malware","value":"Platypus","context":"Custom remote-management implant delivered after exploitation; replaced customsnmpd.","confidence":"medium","source":"Binary Defense / eSentire (as relayed)"},{"type":"malware","value":"WHIPSHOT (PHP webshell); SLAPSHOT (Python tunneller)","context":"Post-exploitation tooling.","confidence":"low","source":"Secondary reporting"},{"type":"note","value":"Full IP/hash lists (58 attacker IPs, webshell SHA-256) exist in Citrix IoC checker v1.4 / vendor reports and were not transcribed.","context":"Provenance statement - filter before ingestion.","confidence":"high","source":"analyst note"}],"references":["https://www.ncsc.gov.uk/news/exploitation-of-vulnerabilities-affecting-citrix-netscaler-adc-and-citrix-netscaler-gateway","https://digital.nhs.uk/cyber-alerts/2026/cc-4858","https://digital.nhs.uk/cyber-alerts/2026/cc-4865","https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/","https://www.computerweekly.com/news/366651460/Cyber-authorities-issue-alert-over-exploitation-of-Citrix-vulns","https://www.helpnetsecurity.com/?p=386203","https://www.bleepingcomputer.com/news/security/citrix-admins-warned-to-shut-down-netscalers-over-2-exploited-zero-days/"]},{"rank":7,"id":"TI-2026-10-24-001","title":"Collabora Online Built-in CODE Server OS Command Injection (CVE-2026-110447) Added to CISA KEV - Nextcloud Deployments at Risk","cve_ids":["CVE-2026-110447"],"vendor":"Collabora / Nextcloud","affected_products":["Nextcloud richdocumentscode (built-in CODE server) before 26.4.303"],"category":"vulnerability","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-10-26","patch_available":"yes","first_reported":"2026-10-23","last_updated":"2026-10-24","confidence":"medium","summary":"CISA added CVE-2026-110447, an unauthenticated OS command injection in the Collabora Online built-in CODE server bundled with Nextcloud, to KEV on 23 Oct with a federal due date of 26 Oct. Exploitation allows arbitrary command execution, so web shells should be sought on unpatched hosts. Nextcloud is widely used for document collaboration by UK councils, universities and NHS suppliers, but no UK-specific compromise was reported. Details from search snippets and third-party reports; CISA page not retrieved.","recommended_actions":["Update richdocumentscode to 26.4.303 or later, or remove the built-in CODE server.","Inventory Nextcloud instances (including supplier-hosted) and restrict Collabora endpoints from the internet where possible.","Hunt for web shells and unexpected child processes from the web server or CODE server."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Collabora CODE server spawning shells","description":"Possible CVE-2026-110447 exploitation. Untested; tune.","query":"DeviceProcessEvents\n| where Timestamp > ago(7d)\n| where InitiatingProcessCommandLine has_any (\"coolwsd\",\"richdocumentscode\",\"collabora\")\n| where FileName in~ (\"sh\",\"bash\",\"dash\",\"curl\",\"wget\",\"nc\",\"python3\")\n| project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessCommandLine, AccountName"}],"iocs":[{"type":"filepath","value":"richdocumentscode (Nextcloud app, version \u003c 26.4.303)","context":"Vulnerable component","confidence":"medium","source":"search-result summary"},{"type":"note","value":"No network IOCs published in sources seen","context":"Provenance statement","confidence":"low"}],"references":["https://www.cisa.gov/news-events/alerts/2026/10/23/cisa-adds-one-known-exploited-vulnerability-catalog-0","https://windowsforum.com/news/cisa-kev-flags-cve-2026-110447-patch-nextcloud-built-in-collabora-code-command-injection.449798/"]},{"rank":8,"id":"TI-2026-10-21-011","title":"BeyondTrust Remote Support Authentication Bypass Exploited as Zero-Day by Suspected China-Nexus Actor - Added to CISA KEV 16 Oct (CVE-2026-102764)","cve_ids":["CVE-2026-102764"],"vendor":"BeyondTrust (vendor attribution disputed in one KEV snippet - Fortinet)","affected_products":["BeyondTrust Remote Support (formerly Bomgar) 26.2.3 and earlier"],"category":"vulnerability","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-10-19","patch_available":"yes","first_reported":"2026-10-16","last_updated":"2026-10-16","confidence":"medium","summary":"New in window. CISA added CVE-2026-102764, a critical authentication bypass in BeyondTrust Remote Support (versions 26.2.3 and earlier), to the KEV catalog on 2026-10-16 with a 2026-10-19 federal due date. A KLM security brief cites Mandiant as saying a suspected China-nexus espionage group exploited it as a zero-day from late August. Remote-support tooling is widely used by UK public sector bodies, MSPs and corporates and gives privileged access to endpoints, so exposure is relevant to UK government supply chains. Caveats: one KEV catalog snippet lists the entry under Fortinet rather than BeyondTrust, and the CISA alert itself could not be retrieved; CVSS not confirmed. Verify against the CISA catalog and vendor advisory.","recommended_actions":["Upgrade BeyondTrust Remote Support to the fixed release per the vendor advisory; for cloud tenants confirm vendor patching.","Restrict internet exposure of the appliance and review session/admin logs since late August for unauthorised access.","Check MSP and third-party suppliers for BeyondTrust use and ask for assurance."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Child processes spawned by BeyondTrust Remote Support services","description":"Hunts for shells launched from Bomgar/BeyondTrust processes. Untested; tune process names.","query":"DeviceProcessEvents\n| where Timestamp > ago(60d)\n| where InitiatingProcessFileName has_any (\"bomgar\",\"beyondtrust\",\"sra-pin\",\"bgrs\")\n| where FileName in~ (\"cmd.exe\",\"powershell.exe\",\"pwsh.exe\",\"bash\",\"sh\",\"curl\",\"wget\")\n| project Timestamp, DeviceName, InitiatingProcessFileName, FileName, ProcessCommandLine"}],"iocs":[{"type":"actor","value":"Suspected China-nexus espionage group (per Mandiant, as relayed)","context":"Zero-day exploitation since late August 2026.","confidence":"low","source":"KLM Security Monitor 2026-10-16"},{"type":"note","value":"No technical indicators published in sources reviewed.","context":"Provenance statement - filter before ingestion.","confidence":"high","source":"analyst note"}],"references":["https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://klminnovation.com/briefs/published/2026-10-16-KLM-security-monitor"]},{"rank":9,"id":"TI-2026-10-21-005","title":"Ivanti Connect Secure Chained Zero-Days (Auth Bypass + RCE + Root Privilege Escalation) Exploited by UTA0576 - Added to CISA KEV (CVE-2026-104935)","cve_ids":["CVE-2026-104935"],"vendor":"Ivanti","affected_products":["Ivanti Connect Secure before 25.1.3.0 (22.7R2.14 and earlier reported unaffected)"],"category":"vulnerability","cvss_v3":8.6,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-10-16","patch_available":"partial","first_reported":"2026-10-13","last_updated":"2026-10-15","confidence":"medium","summary":"Volexity reports an actor it tracks as UTA0576 chained three Ivanti Connect Secure zero-days from 2026-10-03: an authentication bypass and RCE (tracked together as CVE-2026-104935) giving code execution as the cgi-server user, then a privilege escalation to root. Ivanti acknowledges 'limited exploitation in the wild'; CISA added CVE-2026-104935 to KEV on 2026-10-13 (federal due date reported as 2026-10-16). Fixes reported in 25.1.3.0/25.1.3.1/22.8R2.5 for two flaws; the third fix is reportedly still pending and no workaround is listed. Ivanti Connect Secure is widely deployed in UK government, NHS and corporate remote access and has a history of NCSC alerts (2024, 2025); no UK-specific victim was identified, but UK edge-VPN exposure makes this a priority hunt. Details come from search summaries (Hacker News/Forkast) and are unverified against Ivanti/CISA primary pages.","recommended_actions":["Patch Connect Secure to the fixed builds immediately and apply any interim guidance for the unpatched third flaw.","Run Ivanti's Integrity Checker Tool (noting past bypasses) and compare against known-good; if compromise suspected factory reset/rebuild and rotate all credentials and certificates.","Review appliance logs for unauthenticated requests to the API/auth endpoints from 2026-10-03.","Follow NCSC guidance on Ivanti exploitation."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"Ivanti Connect Secure - new outbound or admin changes","description":"Surfaces Ivanti appliance syslog showing config/admin changes or unexpected outbound flows since 2026-10-03.","query":"CommonSecurityLog\n| where TimeGenerated > ago(14d)\n| where DeviceVendor has \"Ivanti\" or DeviceProduct has \"Connect Secure\"\n| where Activity has_any (\"admin\",\"configuration\",\"integrity\",\"upload\") or Message has_any (\"cgi-server\",\"setuid\")\n| project TimeGenerated, DeviceName, SourceIP, Activity, Message\n| sort by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connections from Ivanti appliance management range","description":"Hunt for appliance-sourced connections to rare external hosts (set IvantiIPs).","query":"let IvantiIPs = dynamic([]); // populate with appliance IPs\nDeviceNetworkEvents\n| where Timestamp > ago(14d)\n| where LocalIP in (IvantiIPs)\n| summarize Conns=count(), Ports=make_set(RemotePort) by RemoteIP\n| where Conns \u003c 5\n| sort by Conns asc"}],"iocs":[{"type":"actor","value":"UTA0576","context":"Volexity-tracked cluster exploiting the Ivanti chain from 2026-10-03.","confidence":"medium","source":"Hacker News/Volexity (as relayed)"},{"type":"ttp","value":"Chained auth bypass + RCE + local privilege escalation on VPN appliance","context":"ATT&CK T1190, T1068.","confidence":"medium","source":"Hacker News (as relayed)"},{"type":"note","value":"No network or file indicators were obtained for this entry in this run; consult Volexity's publication.","context":"Provenance statement - filter before ingestion.","confidence":"high","source":"analyst note"}],"references":["https://thehackernews.com/2026/10/attacker-chains-three-ivanti-connect.html","https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-adds-two-known-exploited-vulnerabilities-catalog","https://www.scworld.com/news/cisa-adds-chained-ivanti-connect-secure-bug-to-its-exploited-list"]},{"rank":10,"id":"TI-2026-10-21-007","title":"TFG London (Hobbs, Whistles, Phase Eight) Cyber Incident Disrupts UK Retail IT Systems; Second UK Retailer Incident in a Week","cve_ids":[],"vendor":"The Foschini Group (TFG London)","affected_products":["TFG London corporate IT and e-commerce systems supporting Phase Eight, Hobbs and Whistles"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-10-11","last_updated":"2026-10-15","confidence":"medium","summary":"UPDATE 2026-10-15: Coverage on 2026-10-13/14 (ITV, Yorkshire Post, The Register) adds that TFG has reported the incident to the relevant UK authorities, is working with external cyber specialists, says it has no reason to believe payment data is at risk (card processing is via a third-party provider), and that TFG Africa/Australia are unaffected. Online orders placed after 11 Oct may be delayed and postal returns are unavailable. Data impact is still unconfirmed; no later statement found. Prior detail: No new development found in the 2026-10-14 window (carry-over). TFG London, the UK arm of South Africa's Foschini Group, disclosed on 2026-10-13 that it detected a cyber incident on Sunday 2026-10-11 affecting IT systems for the Phase Eight, Hobbs and Whistles brands. Stores remain open but several systems are down, some websites are impaired and online orders placed since 2026-10-11 may be delayed; customers have been asked not to resubmit orders. The company has engaged external specialists, activated incident-response and continuity plans, notified UK authorities and says it has no reason to believe payment details are at risk, but has not yet determined whether customer or other data was taken. Inside Story and White Stuff run on separate systems and were not affected. Press describes it as the second attack on a UK retailer in about a week (ASOS disclosed unauthorised access to personal data the previous week). Some outlets link the activity to the ShinyHunters group; TFG has not confirmed attribution, so treat that as an unverified lead. No CVE, initial access vector or IOCs have been published. Relevance to UK corporates: continued targeting of UK retail via help-desk social engineering, third-party and SaaS access has been the pattern since the 2025 M&S/Co-op/Harrods wave.","recommended_actions":["Retail and consumer brands: review help-desk identity-verification and MFA reset procedures and privileged-access paths.","Monitor for phishing/smishing impersonating the affected brands; customers should not resubmit orders or follow links in unsolicited messages.","Review third-party/SaaS (CRM, ticketing, data-warehouse) tokens and OAuth grants for anomalous access.","Watch ICO and TFG statements for confirmation of data impact."],"kql":[{"platform":"sentinel","table":"AuditLogs","name":"Help-desk driven MFA/password resets followed by risky sign-in","description":"Generic hunt for the social-engineering pattern used against UK retailers. Not specific to TFG; no IOCs published.","query":"let resets = AuditLogs\n| where TimeGenerated > ago(14d)\n| where OperationName in (\"Reset password (by admin)\",\"Reset user password\",\"User registered security info\",\"Admin registered security info\")\n| extend Target = tostring(TargetResources[0].userPrincipalName)\n| project ResetTime=TimeGenerated, Target, OperationName, Actor=tostring(InitiatedBy.user.userPrincipalName);\nSigninLogs\n| where TimeGenerated > ago(14d) and RiskLevelDuringSignIn in (\"medium\",\"high\")\n| join kind=inner resets on $left.UserPrincipalName == $right.Target\n| where TimeGenerated between (ResetTime .. ResetTime + 4h)\n| project TimeGenerated, UserPrincipalName, IPAddress, Location, AppDisplayName, OperationName, Actor, RiskLevelDuringSignIn"}],"iocs":[{"type":"actor","value":"ShinyHunters (unconfirmed attribution)","context":"Some media link the incident to this group; TFG has not confirmed.","confidence":"low","source":"Press reports (as relayed)"},{"type":"note","value":"No technical indicators have been published for the T     /* detail */
    var det = el("div","detail");

    var facts = sec("At a glance");
    var fl = el("dl","facts");
    if (e.id) kv(fl, "Entry ID", e.id);
    if (e.category) kv(fl, "Category", CATEGORY[e.category] || label(e.category));
    if (S) kv(fl, "Exploitation", S.full);
    kv(fl, "Patch available", label(e.patch_available));
    if (e.first_reported) kv(fl, "First reported", e.first_reported);
    if (e.last_updated) kv(fl, "Last updated", e.last_updated);
    if (e.confidence) kv(fl, "Entry confidence", label(e.confidence));
    if (e.kev_due_date) kv(fl, "KEV due date", e.kev_due_date);
    facts.appendChild(fl);
    det.appendChild(facts);

    if (e.summary){
      var s1 = sec("Analyst summary");
      s1.appendChild(el("p","prose", e.summary));
      det.appendChild(s1);
    }
    if ((e.affected_products || []).length){
      var s2 = sec("Affected products");
      var u2 = el("ul","list");
      e.affected_products.forEach(function(p){ u2.appendChild(el("li", null, p)); });
      s2.appendChild(u2); det.appendChild(s2);
    }
    if ((e.recommended_actions || []).length){
      var s3 = sec("Recommended actions");
      var u3 = el("ul","list num");
      e.recommended_actions.forEach(function(a){ u3.appendChild(el("li", null, a)); });
      s3.appendChild(u3); det.appendChild(s3);
    }

    /* KQL */
    if ((e.kql || []).length){
      var s4 = sec("Detection — KQL for Sentinel / Defender XDR (" + e.kql.length + ")");
      e.kql.forEach(function(q){
        var box = el("div","kql"), h = el("div","kql-head");
        var kn = el("div","kn");
        kn.appendChild(el("h4", null, q.name || "Query"));
        if (q.description) kn.appendChild(el("p", null, q.description));
        h.appendChild(kn);
        var plat = el("span","plat",
          (PLATFORM[q.platform] || q.platform || "") + (q.table ? " · " + q.table : ""));
        h.appendChild(plat);
        h.appendChild(copyBtn(function(){ return q.query || ""; }, "Copy KQL"));
        box.appendChild(h);
        var pre = el("pre"), code = el("code");
        code.appendChild(highlight(q.query || ""));
        pre.appendChild(code); box.appendChild(pre);
        s4.appendChild(box);
      });
      det.appendChild(s4);
    }

    /* IOCs */
    var iocs = e.iocs || [];
    if (iocs.length){
      var real = iocs.filter(function(i){ return i.type !== "note"; });
      var notes = iocs.filter(function(i){ return i.type === "note"; });
      var s5 = sec("Indicators of compromise (" + real.length + ")");
      if (real.length){
        s5.querySelector("h3").appendChild(copyBtn(function(){
          return real.map(function(i){ return i.value; }).join("\n");
        }, "Copy values"));
      }
      notes.forEach(function(n){
        var np = el("p","note-row", "⚠ " + n.context);
        np.style.margin = "0 0 13px"; s5.appendChild(np);
      });
      if (real.length){
        var wrap = el("div","tbl-wrap"), tb = el("table");
        var thead = el("thead"), tr = el("tr");
        ["Type","Value","Confidence","Context","Source"].forEach(function(h2){
          tr.appendChild(el("th", null, h2));
        });
        thead.appendChild(tr); tb.appendChild(thead);
        var tbody = el("tbody");
        real.forEach(function(i){
          var r = el("tr");
          r.appendChild(el("td","t", i.type));
          r.appendChild(el("td","v", i.value));
          var cd = el("td");
          cd.appendChild(el("span","cf " + (i.confidence || "low"), i.confidence || "—"));
          r.appendChild(cd);
          r.appendChild(el("td","ctx", i.context || "—"));
          r.appendChild(el("td","src", i.source || "—"));
          tbody.appendChild(r);
        });
        tb.appendChild(tbody); wrap.appendChild(tb); s5.appendChild(wrap);
      }
      det.appendChild(s5);
    }

    if ((e.references || []).length){
      var s6 = sec("References");
      var u6 = el("ul","refs");
      e.references.forEach(function(r){
        var li6 = el("li"), a = el("a", null, r);
        a.href = r; a.target = "_blank"; a.rel = "noopener noreferrer";
        li6.appendChild(a); u6.appendChild(li6);
      });
      s6.appendChild(u6); det.appendChild(s6);
    }

    li.appendChild(det);

    head.addEventListener("click", function(){
      var open = li.classList.toggle("is-open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
    });
    return li;
  }

  /* ---------- filtering ---------- */
  function haystack(e){
    var parts = [e.title, e.summary, e.vendor, e.id, e.category, e.severity, e.exploitation_status];
    parts = parts.concat(e.cve_ids || [], e.affected_products || [], e.recommended_actions || []);
    (e.iocs || []).forEach(function(i){ parts.push(i.value, i.type, i.context); });
    (e.kql || []).forEach(function(q){ parts.push(q.name, q.table, q.description); });
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function apply(){
    var v = DATA.vulnerabilities || [];
    var q = FILTER.q.trim().toLowerCase();
    var shown = 0;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li, idx){
      var e = v[idx], ok = true;
      if (FILTER.status !== "all" && e.exploitation_status !== FILTER.status) ok = false;
      if (ok && FILTER.kev && !e.kev_listed) ok = false;
      if (ok && FILTER.nopatch && e.patch_available === "yes") ok = false;
      if (ok && q && li._hay.indexOf(q) === -1) ok = false;
      li.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById("count").textContent = shown + " of " + v.length + " shown";
    document.getElementById("empty").hidden = shown !== 0;
  }

  function renderChips(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];
    var counts = {};
    v.forEach(function(e){ counts[e.exploitation_status] = (counts[e.exploitation_status]||0)+1; });
    var box = document.getElementById("status-chips"); box.textContent = "";
    var defs = [["all","All",v.length]];
    order.forEach(function(k){ if (counts[k]) defs.push([k, STATUS[k].short, counts[k]]); });
    defs.forEach(function(d){
      var b = el("button","chip", d[1] + " (" + d[2] + ")");
      b.type = "button";
      b.setAttribute("aria-pressed", FILTER.status === d[0] ? "true" : "false");
      b.addEventListener("click", function(){
        FILTER.status = d[0];
        Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        apply();
      });
      box.appendChild(b);
    });
  }

  /* ---------- provenance ---------- */
  function renderProv(){
    var cm = DATA.collection_metadata || {};
    var box = document.getElementById("prov-body"); box.textContent = "";
    if (cm.collection_method){
      box.appendChild(el("h4", null, "Collection method"));
      box.appendChild(el("p","prose", cm.collection_method));
    }
    if ((cm.limitations || []).length){
      box.appendChild(el("h4", null, "Limitations"));
      var u = el("ul","list");
      cm.limitations.forEach(function(l){ u.appendChild(el("li", null, l)); });
      box.appendChild(u);
    }
    if (cm.confidence_legend){
      box.appendChild(el("h4", null, "Confidence legend"));
      var dl = el("dl");
      Object.keys(cm.confidence_legend).forEach(function(k){
        dl.appendChild(el("dt", null, k));
        dl.appendChild(el("dd", null, cm.confidence_legend[k]));
      });
      box.appendChild(dl);
    }
    var w = (DATA.report || {}).coverage_window || {};
    if (w.note){
      box.appendChild(el("h4", null, "Coverage window note"));
      box.appendChild(el("p","prose", w.note));
    }
    if ((cm.ioc_types_present || []).length){
      box.appendChild(el("h4", null, "IOC types present"));
      box.appendChild(el("p","prose", cm.ioc_types_present.join(", ")));
    }
  }

  /* ---------- report archive timeline ---------- */
  var TL_SHOWN = 10;

  function shortDate(iso){
    var p = String(iso).split("-");
    if (p.length !== 3) return String(iso);
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1];
    return (+p[2]) + " " + mon;
  }
  function longDate(iso){
    var p = String(iso).split("-");
    return p.length === 3 ? shortDate(iso) + " " + p[0] : String(iso);
  }
  /* A dated report sits in reports/; the stable copy sits at the repo root.
     Work out which, so archive links resolve from either location. */
  function archivePrefix(){
    return location.pathname.indexOf("/reports/") > -1 ? "" : "reports/";
  }

  function renderTimeline(index){
    var box = document.getElementById("timeline");
    box.textContent = "";
    var reports = (index && index.reports) || [];
    if (!reports.length){ box.hidden = true; return; }
    box.hidden = false;

    var current = index.generated_for;
    var prefix  = archivePrefix();
    var peak    = Math.max.apply(null, reports.map(function(r){ return r.actively_exploited || 0; }));
    if (!peak) peak = 1;

    /* header */
    var head = el("div","tl-head");
    head.appendChild(el("h2", null, "Report archive"));
    var meta = el("span","tl-meta");
    meta.appendChild(el("b", null, reports.length));
    meta.appendChild(document.createTextNode(
      " reports · " + longDate(reports[0].date) +
      " – " + longDate(reports[reports.length-1].date)));
    head.appendChild(meta);
    /* A dated report's index stops at its own date, so it can never name a
       later report. The stable root copy is always the newest, so offer that
       as the way forward. Omitted at the root, where it is the current page. */
    if (!prefix){
      var latest = el("a","tl-latest","Latest report \u2192");
      latest.href = "../ti-report.html";
      head.appendChild(latest);
    }
    box.appendChild(head);

    /* bars - one series (actively exploited per report), so no legend box;
       the caption names it. Hover and keyboard focus both open the tooltip. */
    var chart = el("div","tl-chart");
    var bars  = el("div","tl-bars");
    var tip   = el("div","tl-tip"); tip.hidden = true;

    reports.forEach(function(r){
      var b = el("button","tl-bar" + (r.date === current ? " is-current" : ""));
      b.type = "button";
      b.setAttribute("aria-label",
        longDate(r.date) + ": " + (r.actively_exploited||0) + " actively exploited of " +
        r.entries + " entries");
      var fill = el("span","tl-fill");
      fill.style.height = Math.max(4, Math.round((r.actively_exploited||0) / peak * 100)) + "%";
      b.appendChild(fill);

      function show(){
        tip.textContent = "";
        tip.appendChild(el("p","t-d", longDate(r.date) + (r.date === current ? "  (this report)" : "")));
        if (r.headline) tip.appendChild(el("p","t-h", r.headline));
        tip.appendChild(el("p","t-c",
          r.entries + " entries · " + (r.actively_exploited||0) + " exploited · " +
          (r.kev_listed||0) + " KEV · " + (r.cves||0) + " CVEs"));
        tip.hidden = false;
        /* clamp the tooltip inside the chart */
        var left = b.offsetLeft + b.offsetWidth/2 - bars.scrollLeft;
        var w = tip.offsetWidth || 200;
        var maxLeft = chart.clientWidth - w;
        tip.style.left = Math.max(0, Math.min(left - w/2, maxLeft < 0 ? 0 : maxLeft)) + "px";
      }
      function hide(){ tip.hidden = true; }
      b.addEventListener("mouseenter", show);
      b.addEventListener("focus", show);
      b.addEventListener("mouseleave", hide);
      b.addEventListener("blur", hide);
      b.addEventListener("click", function(){ location.href = prefix + r.file; });
      bars.appendChild(b);
    });

    chart.appendChild(tip);
    chart.appendChild(bars);
    var axis = el("div","tl-axis");
    axis.appendChild(el("span", null, shortDate(reports[0].date)));
    axis.appendChild(el("span", null, "actively exploited per report · peak " + peak));
    axis.appendChild(el("span", null, shortDate(reports[reports.length-1].date)));
    chart.appendChild(axis);
    box.appendChild(chart);

    /* newest-first list - this doubles as the chart's table view */
    var list = el("ol","tl-list");
    var ordered = reports.slice().reverse();
    ordered.forEach(function(r, i){
      var li = el("li");
      if (i >= TL_SHOWN) li.hidden = true;
      var a = el("a","tl-row" + (r.date === current ? " is-current" : ""));
      a.href = prefix + r.file;
      a.appendChild(el("span","tl-d", shortDate(r.date)));
      a.appendChild(el("span","tl-h", r.headline || "—"));
      if (r.date === current) a.appendChild(el("span","tl-now","viewing"));
      a.appendChild(el("span","tl-c",
        r.entries + "e · " + (r.actively_exploited||0) + "x · " + (r.kev_listed||0) + "k"));
      li.appendChild(a);
      list.appendChild(li);
    });
    box.appendChild(list);

    if (ordered.length > TL_SHOWN){
      var more = el("button","btn tl-more", "Show all " + ordered.length + " reports");
      more.type = "button";
      var open = false;
      more.addEventListener("click", function(){
        open = !open;
        Array.prototype.forEach.call(list.children, function(li, i){
          li.hidden = open ? false : i >= TL_SHOWN;
        });
        more.textContent = open ? "Show recent only" : "Show all " + ordered.length + " reports";
      });
      box.appendChild(more);
    }
  }

  /* ---------- boot ---------- */
  function render(data){
    DATA = data;
    renderHead(); renderTiles(); renderPosture(); renderChips(); renderProv();
    var list = document.getElementById("entries"); list.textContent = "";
    (DATA.vulnerabilities || []).forEach(function(e){
      var li = renderEntry(e);
      li._hay = haystack(e);
      list.appendChild(li);
    });
    ALL_OPEN = false;
    document.getElementById("toggle-all").textContent = "Expand all";
    apply();
  }

  document.getElementById("q").addEventListener("input", function(ev){
    FILTER.q = ev.target.value; apply();
  });
  ["f-kev","f-nopatch"].forEach(function(id){
    document.getElementById(id).addEventListener("click", function(){
      var b = document.getElementById(id);
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      FILTER[id === "f-kev" ? "kev" : "nopatch"] = on;
      apply();
    });
  });
  document.getElementById("toggle-all").addEventListener("click", function(){
    ALL_OPEN = !ALL_OPEN;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li){
      li.classList.toggle("is-open", ALL_OPEN);
      var h = li.querySelector(".chead");
      if (h) h.setAttribute("aria-expanded", ALL_OPEN ? "true" : "false");
    });
    this.textContent = ALL_OPEN ? "Collapse all" : "Expand all";
  });

  /* drag & drop any TI JSON */
  var dragDepth = 0;
  window.addEventListener("dragenter", function(ev){ ev.preventDefault(); if (++dragDepth) document.body.classList.add("dragging"); });
  window.addEventListener("dragover",  function(ev){ ev.preventDefault(); });
  window.addEventListener("dragleave", function(){ if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("drop", function(ev){
    ev.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var parsed = JSON.parse(fr.result);
        if (!parsed || !parsed.vulnerabilities) throw new Error("not a TI output config");
        render(parsed);
        window.scrollTo(0,0);
      } catch(err){
        alert("Could not load that file: " + err.message);
      }
    };
    fr.readAsText(f);
  });

  /* embedded data first (works offline from file://); refresh from the sibling
     JSON when served over http(s) so a hosted copy always shows today's feed */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("ti-data").textContent); } catch(e){}
  if (embedded && embedded.vulnerabilities) render(embedded);

  /* The archive index describes the reports/ directory, not the data on show,
     so it is rendered once and left alone when another config is loaded. */
  try { renderTimeline(JSON.parse(document.getElementById("ti-index").textContent)); }
  catch(e){ document.getElementById("timeline").hidden = true; }

  if (location.protocol === "http:" || location.protocol === "https:"){
    fetch("ti-output-config.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      if (j && j.vulnerabilities){
        var a = (j.report||{}).check_performed_at, b = (embedded&&embedded.report||{}).check_performed_at;
        if (a !== b) render(j);
      }
    }).catch(function(){ /* offline or no sibling file - embedded copy stands */ });
  }
})();
</script>
</body>
</html>
