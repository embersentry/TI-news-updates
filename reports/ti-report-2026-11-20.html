5 rating and the existence of a PoC - these are consistent across The Hacker News, Techzine, University of Toronto's advisory relay, Aviatrix, Cyber Kendra and several others. The NCSC's 'moderate likelihood, significant damage' phrasing is reported via secondary coverage and was not retrieved from ncsc.gov.uk in this run, because direct page fetches were blocked. No CVSS score was available. The CVE-2026-118539 exploitation claim is single-source and unverified.","recommended_actions":["Patch to Drupal 10.6.22, 11.3.22 or 11.4.13 out of cycle. The NCSC's assessment - moderate likelihood, significant damage - on a platform this common in UK government and NHS estates is grounds for an emergency change, not a scheduled one.","Independently of patching, block /core/install.php at the web server, reverse proxy, WAF or CDN, and do it for every Drupal site you operate including development and staging. Advisory-linked guidance recommends this regardless of patch status, and there is no legitimate public need to reach a production installer.","Add the deny rule to your standard web server template, covering /core/install.php, /core/rebuild.php and /core/authorize.php, so that the next site you deploy is not exposed by default. This removes a recurring class of exposure rather than one CVE.","Check whether the installer has already been reached. Search access logs for requests to /core/install.php over the last 60 days and look at the response codes - a 200 to that path on a live site is an incident, not a finding.","Verify settings.php integrity and the administrator account list on every internet-facing Drupal site. The exploitation path runs through the installer's legitimate ability to write configuration and create an initial admin, so those are the artefacts that would show a successful attempt.","If you run Drupal behind Nginx, combine this change with the NGINX2Root patching at rank 5 - the same hosts, the same maintenance window, the same change ticket.","Do not merge this with CVE-2026-118539. One outlet reports that separate Drupal access-bypass flaw as actively abused; it is unverified, it is a different issue, and treating them as one item will misprioritise both. Verify it against the Drupal security advisories on its own.","Where a supplier or agency hosts your Drupal site - common for local authority and NHS trust web estates - put the version question and the install.php block to them in writing this week, and keep the answer."],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Requests to the Drupal core installer - CVE-2026-132165","description":"The primary detection. Any request to /core/install.php on a live site is suspicious; a 200 response is an incident. Includes the adjacent core maintenance scripts.","query":"let installerPaths = dynamic([\"/core/install.php\", \"/core/rebuild.php\", \"/core/authorize.php\", \"/core/update.php\"]);\nW3CIISLog\n| where TimeGenerated > ago(60d)\n| where csUriStem has_any (installerPaths)\n| project TimeGenerated, cIP, csMethod, csUriStem, csUriQuery, scStatus, csUserAgent, sSiteName\n| extend Severity = case(scStatus == 200, \"CRITICAL - installer responded successfully\", scStatus in (301, 302, 403, 404), \"informational - blocked or redirected\", \"review\")\n| sort by TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"WAF and reverse proxy view of installer probing","description":"For estates fronted by a WAF, CDN or load balancer rather than IIS. Separates blocked probes from requests that reached the origin.","query":"CommonSecurityLog\n| where TimeGenerated > ago(60d)\n| where RequestURL has_any (\"core/install.php\", \"core/rebuild.php\", \"core/authorize.php\")\n| summarize Requests = count(), Blocked = countif(DeviceAction in (\"block\", \"deny\", \"drop\")), Allowed = countif(DeviceAction !in (\"block\", \"deny\", \"drop\")), Sources = dcount(SourceIP), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by DestinationHostName, RequestURL\n| where Allowed > 0\n| sort by Allowed desc"},{"platform":"sentinel","table":"Syslog","name":"Nginx and Apache access log hunt for installer reach","description":"Where Drupal sits behind Nginx or Apache with syslog forwarding, parse the access line directly. Most UK Drupal hosting is on this stack rather than IIS.","query":"Syslog\n| where TimeGenerated > ago(60d)\n| where ProcessName has_any (\"nginx\", \"httpd\", \"apache2\")\n| where SyslogMessage has \"install.php\" or SyslogMessage has \"rebuild.php\"\n| extend SourceIP = extract(@\"^(\\d+\\.\\d+\\.\\d+\\.\\d+)\", 1, SyslogMessage)\n| extend StatusCode = extract(@\"\\\"\\s(\\d{3})\\s\", 1, SyslogMessage)\n| project TimeGenerated, Computer, SourceIP, StatusCode, SyslogMessage\n| summarize Requests = count(), Statuses = make_set(StatusCode, 10) by Computer, SourceIP\n| sort by Requests desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"settings.php and Drupal configuration file modification","description":"Successful exploitation drives the installer, which legitimately writes settings.php. Modification of that file outside a deployment is the strongest post-exploitation artefact.","query":"DeviceFileEvents\n| where Timestamp > ago(30d)\n| where FileName in~ (\"settings.php\", \"settings.local.php\", \"services.yml\")\n| where ActionType in (\"FileCreated\", \"FileModified\")\n| where not(InitiatingProcessFileName in~ (\"git\", \"git.exe\", \"drush\", \"composer\", \"ansible-playbook\", \"rsync\"))\n| project Timestamp, DeviceName, FolderPath, FileName, ActionType, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| sort by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Web server process spawning a shell or interpreter on a Drupal host","description":"Generic but decisive. PHP-FPM, nginx or apache spawning sh, bash, curl, wget or python on a web host is post-exploitation regardless of which flaw was used.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where InitiatingProcessFileName has_any (\"php-fpm\", \"php\", \"nginx\", \"httpd\", \"apache2\", \"w3wp.exe\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"python3\", \"perl\", \"nc\", \"ncat\", \"cmd.exe\", \"powershell.exe\")\n| project Timestamp, DeviceName, InitiatingProcessFileName, FileName, ProcessCommandLine, AccountName\n| sort by Timestamp desc"},{"platform":"sentinel","table":"DeviceTvmSoftwareInventory","name":"Drupal version inventory against the fixed releases","description":"Builds the patch worklist. Anything below 10.6.22, or in the 11.0.0-11.3.21 or 11.4.0-11.4.12 bands, is affected.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has \"drupal\" or SoftwareVendor has \"drupal\"\n| extend Major = toint(split(SoftwareVersion, \".\")[0]), Minor = toint(split(SoftwareVersion, \".\")[1]), Patch = toint(split(SoftwareVersion, \".\")[2])\n| extend Affected = case(\n    Major \u003c 10, true,\n    Major == 10 and (Minor \u003c 6 or (Minor == 6 and Patch \u003c 22)), true,\n    Major == 11 and Minor \u003c 3, true,\n    Major == 11 and Minor == 3 and Patch \u003c 22, true,\n    Major == 11 and Minor == 4 and Patch \u003c 13, true,\n    false)\n| where Affected\n| project DeviceName, SoftwareName, SoftwareVersion, EndOfSupportStatus\n| sort by DeviceName asc"},{"platform":"sentinel","table":"W3CIISLog","name":"Mass scanning for the installer across your web estate","description":"Public PoC plus universal file presence rewards mass scanning. This surfaces single sources sweeping many hostnames for the same path - the precursor to targeted exploitation.","query":"W3CIISLog\n| where TimeGenerated > ago(14d)\n| where csUriStem has \"install.php\"\n| summarize HostsProbed = dcount(csHost), Requests = count(), Statuses = make_set(scStatus, 10), UserAgents = make_set(csUserAgent, 5) by cIP\n| where HostsProbed > 3\n| sort by HostsProbed desc"}],"iocs":[{"type":"uri_path","value":"/core/install.php","context":"The vulnerable endpoint for CVE-2026-132165. Present in every copy of Drupal core, retained after installation, and not blocked by core's default .htaccess. Any 200 response on a live site is an incident.","confidence":"high","source":"Drupal SA-CORE-2026-017 via The Hacker News, Techzine"},{"type":"uri_path","value":"/core/rebuild.php","context":"Adjacent core maintenance script worth blocking in the same change. Not the vulnerable path for this CVE.","confidence":"medium","source":"Analyst assessment"},{"type":"uri_path","value":"/core/authorize.php","context":"Adjacent core script worth blocking in the same change. Not the vulnerable path for this CVE.","confidence":"medium","source":"Analyst assessment"},{"type":"filepath","value":"settings.php","context":"Written legitimately by the installer. Modification outside a deployment pipeline is the strongest post-exploitation artefact for this flaw.","confidence":"high","source":"Analyst assessment based on the installer mechanism"},{"type":"ttp","value":"Unauthenticated attacker drives a web application's own installer into a reinstall to obtain configuration write access and an administrator account","context":"The mechanism. No second bug is needed for persistence because the installer legitimately writes configuration and creates an initial admin.","confidence":"high","source":"Drupal advisory coverage"},{"type":"behaviour","value":"Single source address probing /core/install.php across many distinct hostnames","context":"Mass-scanning precursor. The combination of a public PoC and a universally present file makes this the expected first observable.","confidence":"medium","source":"Analyst assessment"},{"type":"behaviour","value":"Web server process (php-fpm, nginx, httpd) spawning a shell, curl, wget or python","context":"Generic post-exploitation indicator on a Drupal host, valid for this flaw and for the gadget chain CVE-2026-132166.","confidence":"high","source":"Analyst assessment"},{"type":"note","value":"No exploitation in the wild reported; not in CISA KEV as at 19 November 2026; no NVD CVSS score as at 20 November 2026","context":"Current state. A public proof of concept exists, so the absence of exploitation is a timing statement rather than a safety statement. Provenance statement, not an indicator.","confidence":"high","source":"The Hacker News, Aviatrix"},{"type":"note","value":"NCSC commented on 19 November 2026, assessing likelihood of exploitation as moderate and potential damage as significant, urging immediate update","context":"The UK government input that justifies out-of-cycle patching. Retrieved via secondary coverage, not from ncsc.gov.uk. Provenance statement, not an indicator.","confidence":"medium","source":"Techzine, 19 November 2026"},{"type":"note","value":"Drupal rates the issue 18 of 25, describes it as complex to exploit, and says vulnerable configurations are uncommon","context":"The vendor's honest qualifiers. Read alongside the universal reachability of the file rather than instead of it. Provenance statement, not an indicator.","confidence":"high","source":"Drupal SA-CORE-2026-017 via coverage"},{"type":"note","value":"CORRECTION / SEPARATION: CVE-2026-118539 is a different Drupal access-bypass flaw reported by one outlet as actively abused. It is NOT this installer flaw and the exploitation claim is unverified.","context":"Keep the two in separate change tickets. Conflating an exploited access bypass with an unexploited installer RCE misprioritises both. Provenance statement, not an indicator.","confidence":"low","source":"Single-outlet claim surfaced during this run"},{"type":"note","value":"DISCLOSURE OF INTEREST: the flaw was identified by Anthropic's OSS Scanner, an automated service for opt-in open-source projects. The advisory and fix are the Drupal Security Team's.","context":"Declared because this report is produced by an Anthropic model. It is not a reason to weight the finding differently. Provenance statement, not an indicator.","confidence":"high","source":"The Hacker News, 18-19 November 2026"}],"references":["https://thehackernews.com/2026/11/drupal-patches-critical-installer-flaw.html","https://www.techzine.eu/news/security/145932/critical-drupal-vulnerability-allows-attackers-to-take-over-sites-via-the-installer/","https://security.utoronto.ca/advisories/security-advisory-critical-remote-code-execution-in-the-drupal-core-installer/","https://aviatrix.ai/threat-research-center/drupal-patches-critical-installer-flaw-2026-cve-2026-132165/","https://www.cyberkendra.com/2026/11/cve-2026-132165-drupal-installer-rce.html","https://dev.to/epifive/drupal-sa-core-2026-017-rce-check-your-site-and-update-to-fixed-versions-4m0m","https://techbytes.app/posts/drupal-patches-critical-rce-flaw-warns-exploits-may-surface-quickly/"]},{"rank":4,"id":"TI-2026-11-20-004","title":"PHP's 19 November Security Release Fixes 18 CVEs Including Seven Critical - CVE-2026-129289 Is an Unauthenticated PHP-FPM Request Smuggling Flaw at CVSS 9.2, and CVE-2026-129481 Is Officially an Incomplete Fix for CVE-2026-109619, the PHP2Shell Bug Already Being Exploited Against Check Point Gateways","cve_ids":["CVE-2026-129289","CVE-2026-129481","CVE-2026-109619","CVE-2026-109618","CVE-2026-115560","CVE-2026-126714","CVE-2026-129474","CVE-2026-129182","CVE-2026-129496","CVE-2026-123039"],"vendor":"The PHP Group","affected_products":["PHP all supported branches - fixed in PHP 8.5.13, 8.4.28, 8.3.37 and 8.2.36, released Thursday 19 November 2026; PHP 8.6.0 also carries the fixes","CVE-2026-129289 - PHP-FPM request smuggling, CVSS 9.2. Unauthenticated code execution as the FPM worker where the web server reuses connections to PHP-FPM and an application opens php://input without fully reading it","CVE-2026-129481 - listed by PHP as an INCOMPLETE FIX for CVE-2026-109619, meaning October's PHP2Shell patch did not fully close the hole","CVE-2026-115560 - session upload progress serializer mismatch, critical, RCE class; upload progress now off by default","CVE-2026-126714 - interrupted session writes, critical, RCE class","CVE-2026-129474 and CVE-2026-129182 - use-after-free, PHP 8.5 only","CVE-2026-129496 - date extension use-after-free, remotely reachable without credentials under specific conditions","Downstream relevance: CVE-2026-109618 / CVE-2026-109619 ('PHP2Shell') are the initial-access flaws chained with Check Point Gaia local privilege escalation CVE-2026-123039 in confirmed in-the-wild attacks"],"category":"vulnerability_bundle","cvss_v3":9.2,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-16","patch_available":"yes","first_reported":"2026-11-19","last_updated":"2026-11-20","confidence":"high","summary":"Two things happened in PHP's 19 November release and they need separating, because one is a new critical vulnerability and the other is an admission that a patch many organisations have already closed off as done did not work.\n\nThe new critical: CVE-2026-129289, PHP-FPM request smuggling, CVSS 9.2. A single request lets an unauthenticated attacker execute PHP code as the FPM worker. It requires two conditions that are both common rather than exotic: the web server reuses connections to PHP-FPM (persistent FastCGI backend connections, which is a performance default in many Nginx and Apache deployments), and an application somewhere on the host opens php://input without reading it to completion. The second condition is an application-code property, which means you cannot determine your exposure from your infrastructure configuration alone - any one framework, plugin, legacy endpoint or webhook handler on a shared FPM pool can supply it. The interim mitigation is to disable persistent backend connections between the web server and PHP-FPM so that connections terminate after each request. That is a latency cost you can accept for a week; it is the right bridging control where patching within 72 hours is not achievable. The patch is the real answer: 8.5.13, 8.4.28, 8.3.37, 8.2.36, or 8.6.0.\n\nThe admission, and the reason this entry ranks above several items with more press coverage: CVE-2026-129481 is listed by PHP itself as an incomplete fix for CVE-2026-109619. CVE-2026-109618 and CVE-2026-109619 are PHP2Shell - the October PHP flaws that are not a theoretical risk but the confirmed initial-access leg of in-the-wild attacks on Check Point Security Gateways. Check Point's own advisory confirms attackers chained PHP2Shell with Gaia local privilege escalation CVE-2026-123039 to reach root, deploy the TSGA backdoor and, in some cases, wipe ESXi files; the activity dates from 30 October and was observed active until 4 November, against a couple of dozen customers in Check Point's telling, with a second wave on 2 November and destructive activity against some Israeli organisations in the first. CISA added CVE-2026-123039 to KEV on 13 November with a 16 November federal deadline, which has passed. So the sequence for any organisation that patched PHP in October is: you applied a fix for an actively exploited flaw, you recorded it as remediated, and PHP has now told you that fix was incomplete. Your remediation record is wrong and your scanner, matching the October CVE, agrees with the record rather than with reality.\n\nThat makes this the third separate instance of the same governance failure inside two weeks in this feed - after the Zyxel KEV entry naming CVE-2026-7273 while the exploited flaw is CVE-2026-107441, and Apache stating that Roller's September fix for CVE-2026-82384 does not address the same bug under CVE-2026-129448. Three independent cases is no longer a coincidence; it is a measurement of how unreliable identifier-matching has become as a remediation control in 2026. The practical consequence is a change to how you verify: for exploited vulnerabilities, confirm the installed version against the vendor's current fixed-version list on the day you close the ticket, and re-check the advisory for 'incomplete fix' language, rather than confirming that a CVE identifier appears in a patch report.\n\nThe rest of the release, briefly. CVE-2026-115560 (session upload progress serializer mismatch) and CVE-2026-126714 (interrupted session writes) are both critical and both in the RCE class; upload progress is now off by default, which is a behaviour change to note in your own testing. CVE-2026-129474 and CVE-2026-129182 are use-after-free bugs affecting PHP 8.5 only. CVE-2026-129496 is a date-extension use-after-free reachable by a remote unauthenticated attacker where its conditions are met. PHP maintainers say the critical issues affect installations with non-default configuration or uncommon setups - which is true, and is the same qualifier that applies to every PHP flaw that has subsequently been mass-exploited, because 'non-default' in a twenty-year-old ecosystem describes most production estates.\n\nUK relevance. PHP is the substrate under a very large share of UK local authority, NHS trust, university, charity and SME web estates - WordPress, Drupal (see rank 3), Moodle, Laravel applications and the long tail of bespoke sites built by agencies that have since closed. Most of those sites are patched by a hosting provider on a schedule the site owner does not control. The question to put to your host this week is not 'are we patched' but 'which PHP point release are we on today, and do you terminate FPM connections per request'.\n\nConfidence and caveats. Confidence is high on the release date, the version numbers, the 18-CVE count and the seven criticals, which are consistent across BleepingComputer, Techzine, Aikido, Chainguard, phparch and Palo Alto Unit 42's updated threat brief. CVE-2026-129289's CVSS 9.2, its mechanism and the persistent-connection mitigation are consistently reported. The incomplete-fix relationship between CVE-2026-129481 and CVE-2026-109619 is reported as PHP's own listing. One outlet (Exploitr) describes the release as fixing eight vulnerabilities rather than 18, and sources differ on fixed-in versions for individual CVEs - check the official PHP advisories before mapping a specific CVE to a specific release. The Check Point exploitation facts come from Check Point Research and its blog advisory via trade press; one dev.to guide disputes the 13 November KEV date and is outweighed by the rest. No pages were fetched directly in this run.","recommended_actions":["Patch PHP to 8.5.13, 8.4.28, 8.3.37, 8.2.36 or 8.6.0. Treat it as an out-of-cycle change on anything internet-facing because of CVE-2026-129289's CVSS 9.2 and unauthenticated reach.","Where you cannot patch within 72 hours, disable persistent backend connections between your web server and PHP-FPM so connections terminate after each request. Accept the latency cost; it closes the smuggling precondition that you control.","RE-OPEN YOUR OCTOBER PHP2SHELL TICKET. CVE-2026-129481 is listed by PHP as an incomplete fix for CVE-2026-109619. If you patched in October and closed the item, your remediation record is wrong and your scanner will not tell you, because the October CVE matches.","If you run Check Point Gaia, confirm you are on the November Jumbo Hotfix (reported as R81.20 Take 174, R82 Take 132, R82.10 Take 52, R82.20 Take 14) and treat any gateway that was internet-reachable with Mobile Access enabled between 30 October and 4 November as potentially compromised rather than merely exposed. The CISA KEV deadline for CVE-2026-123039 was 16 November and has passed.","Change how you verify remediation of exploited vulnerabilities: confirm the installed version against the vendor's current fixed-version list on the day you close the ticket, and search the advisory for 'incomplete fix'. Three cases in two weeks - PHP2Shell, Zyxel's wrong KEV CVE, Apache Roller's reissued bug - show identifier matching is no longer a sufficient control.","Audit your own application code for php://input opened and not fully read. This is the precondition you cannot see from infrastructure configuration, and a single legacy webhook handler on a shared FPM pool supplies it for every site in that pool.","Separate FPM pools per application where you host multiple sites on one server. The smuggling flaw executes as the FPM worker, so pool separation limits which sites a successful attack reaches.","Ask your hosting provider, in writing, which PHP point release your sites are running today and whether FPM connections are terminated per request. For most UK local authority, NHS trust, university and charity web estates the patch decision belongs to the host, not the site owner.","Note the behaviour change: session upload progress is now disabled by default. Test any application that relies on upload progress reporting before you roll the patch to production."],"kql":[{"platform":"sentinel","table":"Syslog","name":"PHP-FPM worker anomalies consistent with request smuggling - CVE-2026-129289","description":"Smuggling against FPM tends to produce protocol errors, unexpected worker terminations and 'child exited' messages. Hunt for a rate change rather than a single event.","query":"Syslog\n| where TimeGenerated > ago(30d)\n| where ProcessName has \"php-fpm\" or SyslogMessage has \"php-fpm\"\n| where SyslogMessage has_any (\"child exited\", \"exited on signal\", \"malformed\", \"protocol error\", \"unexpected end\", \"invalid request\", \"terminating\")\n| summarize Events = count(), Messages = make_set(substring(SyslogMessage, 0, 160), 10) by Computer, bin(TimeGenerated, 1h)\n| where Events > 10\n| sort by Events desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Request smuggling signatures at the proxy - conflicting length and encoding headers","description":"Smuggling requires header desynchronisation. Hunt for requests carrying both Content-Length and Transfer-Encoding, duplicated length headers, or anomalously large bodies to PHP endpoints.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where RequestURL has \".php\" or RequestURL has \"/index.php\"\n| where AdditionalExtensions has_any (\"Transfer-Encoding\", \"transfer-encoding\") and AdditionalExtensions has_any (\"Content-Length\", \"content-length\")\n| project TimeGenerated, SourceIP, DestinationHostName, RequestURL, RequestMethod, DeviceAction, AdditionalExtensions\n| sort by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"PHP-FPM worker spawning a shell or network tool","description":"The decisive post-exploitation signal for CVE-2026-129289: code executes as the FPM worker, so the worker becomes the parent of anything the attacker runs.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where InitiatingProcessFileName has_any (\"php-fpm\", \"php-fpm7\", \"php-fpm8\", \"php\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"nc\", \"ncat\", \"socat\", \"python3\", \"perl\", \"chmod\", \"base64\")\n| project Timestamp, DeviceName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, AccountName\n| sort by Timestamp desc"},{"platform":"sentinel","table":"DeviceTvmSoftwareInventory","name":"PHP version inventory against the 19 November fixed releases","description":"Builds the patch worklist and - more importantly - identifies hosts whose October PHP2Shell remediation is now known to be incomplete.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has \"php\" and SoftwareVendor has_any (\"php\", \"the php group\")\n| extend Major = toint(split(SoftwareVersion, \".\")[0]), Minor = toint(split(SoftwareVersion, \".\")[1]), Patch = toint(split(SoftwareVersion, \".\")[2])\n| extend Affected = case(\n    Major == 8 and Minor == 5 and Patch \u003c 13, true,\n    Major == 8 and Minor == 4 and Patch \u003c 28, true,\n    Major == 8 and Minor == 3 and Patch \u003c 37, true,\n    Major == 8 and Minor == 2 and Patch \u003c 36, true,\n    Major \u003c 8, true,\n    Major == 8 and Minor \u003c 2, true,\n    false)\n| where Affected\n| project DeviceName, SoftwareName, SoftwareVersion, EndOfSupportStatus\n| sort by SoftwareVersion asc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Check Point Mobile Access portal exploitation window - PHP2Shell initial access","description":"Retrospective sweep of the 30 October to 4 November activity window against Check Point gateways. Treat reachable gateways with Mobile Access enabled as potentially compromised rather than exposed.","query":"let activityWindow = datetime(2026-10-28) .. datetime(2026-11-06);\nCommonSecurityLog\n| where TimeGenerated between (activityWindow)\n| where DeviceVendor has \"Check Point\"\n| where RequestURL has_any (\"/sslvpn\", \"/Login\", \"/clients\", \".php\") or Activity has_any (\"Mobile Access\", \"Portal\")\n| summarize Requests = count(), DistinctUris = dcount(RequestURL), Uris = make_set(RequestURL, 25) by SourceIP, DestinationIP\n| where Requests > 20\n| sort by Requests desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"TSGA backdoor and ESXi wiper activity following PHP2Shell chaining","description":"Post-exploitation of the confirmed Check Point campaign: root-level persistence and destructive activity against ESXi. Tune the process and file names to your environment.","query":"DeviceProcessEvents\n| where Timestamp > ago(60d)\n| where ProcessCommandLine has_any (\"vmfs/volumes\", \"esxcli\", \"vim-cmd\", \"vmdk\", \"/dev/urandom\", \"shred\", \"dd if=\")\n   or ProcessCommandLine has_any (\"DynamicCLI\", \"cpshell\", \"clish -c\")\n| project Timestamp, DeviceName, FileName, ProcessCommandLine, AccountName, InitiatingProcessFileName\n| sort by Timestamp desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Session and upload-progress endpoints - CVE-2026-115560 and CVE-2026-126714","description":"Both session-related criticals are reachable through upload and session handling. Hunt for abnormal multipart upload patterns and session-file manipulation attempts.","query":"W3CIISLog\n| where TimeGenerated > ago(30d)\n| where csUriStem has \".php\"\n| where csUriQuery has_any (\"PHP_SESSION_UPLOAD_PROGRESS\", \"session_upload_progress\", \"upload_progress\")\n   or csMethod == \"POST\" and toint(csBytes) > 10000000\n| project TimeGenerated, cIP, csMethod, csUriStem, csUriQuery, scStatus, csBytes, csUserAgent\n| sort by TimeGenerated desc"}],"iocs":[{"type":"ttp","value":"HTTP request smuggling across a reused FastCGI connection to PHP-FPM, yielding unauthenticated code execution as the FPM worker","context":"CVE-2026-129289, CVSS 9.2. Preconditions: web server reuses connections to PHP-FPM, and an application opens php://input without fully reading it.","confidence":"high","source":"BleepingComputer, Aikido, phparch, 19 November 2026"},{"type":"behaviour","value":"Application code opening php://input without reading it to completion","context":"The precondition you cannot see from infrastructure configuration. A single legacy webhook or framework endpoint on a shared FPM pool supplies it for every site in that pool.","confidence":"high","source":"PHP release coverage"},{"type":"behaviour","value":"Persistent (keep-alive) backend connections between web server and PHP-FPM","context":"The other precondition, and the one you control. Disabling it is the interim mitigation: connections terminate after each request.","confidence":"high","source":"PHP release coverage, 19 November 2026"},{"type":"behaviour","value":"php-fpm child processes repeatedly exiting on signal, or logging malformed / protocol error / unexpected end of request","context":"Expected log artefact of smuggling attempts against FPM. Hunt for a rate change rather than individual events.","confidence":"medium","source":"Analyst assessment"},{"type":"behaviour","value":"php-fpm worker process as the parent of sh, bash, curl, wget, nc, socat, python3 or base64","context":"Decisive post-exploitation indicator: CVE-2026-129289 executes as the FPM worker, so the worker parents everything the attacker runs.","confidence":"high","source":"Analyst assessment"},{"type":"behaviour","value":"Requests carrying both Content-Length and Transfer-Encoding headers, or duplicated length headers, to .php endpoints","context":"Classic header desynchronisation signature at the proxy or WAF layer.","confidence":"medium","source":"Analyst assessment"},{"type":"uri_path","value":"PHP_SESSION_UPLOAD_PROGRESS","context":"Parameter associated with the session upload progress mechanism behind CVE-2026-115560. Upload progress is now disabled by default in the fixed releases.","confidence":"medium","source":"PHP release coverage"},{"type":"malware","value":"TSGA backdoor","context":"Deployed in the confirmed in-the-wild campaign that chained PHP2Shell (CVE-2026-109618 / CVE-2026-109619) with Check Point Gaia LPE CVE-2026-123039 to reach root.","confidence":"medium","source":"The Hacker News, Check Point Research"},{"type":"ttp","value":"Destructive wiping of ESXi files following gateway compromise","context":"Observed in the Check Point campaign, including against Israeli organisations in the first wave. Raises this from a data-theft to a destructive threat model.","confidence":"medium","source":"The Hacker News, Check Point blog advisory"},{"type":"ttp","value":"Privilege escalation to root via missing authorisation in the Gaia DynamicCLI process","context":"CVE-2026-123039, CVSS reported 7.8. Affected Gaia versions reported as R82.20, R82.10, R82 and R81.20; Spark firewalls and Smart-1 Cloud reported not affected.","confidence":"high","source":"Check Point advisory via trade press; CISA KEV 13 November 2026"},{"type":"note","value":"CVE-2026-129481 is listed by PHP as an INCOMPLETE FIX for CVE-2026-109619 - October's PHP2Shell patch did not fully close the hole","context":"The central finding of this entry. Any organisation that patched in October and closed the ticket holds a remediation record that is affirmatively wrong, and identifier-matching scanners will agree with the record. Provenance statement, not an indicator.","confidence":"high","source":"PHP advisory listing via BleepingComputer, Chainguard"},{"type":"note","value":"Third instance in two weeks of identifier-matching failing as a remediation control: PHP2Shell incomplete fix, Zyxel KEV naming CVE-2026-7273 instead of CVE-2026-107441, Apache Roller's September fix for CVE-2026-82384 not addressing CVE-2026-129448","context":"Three independent cases. The control change is to verify installed version against the vendor's current fixed-version list and check for 'incomplete fix' language. Provenance statement, not an indicator.","confidence":"high","source":"This feed, 6-20 November 2026"},{"type":"note","value":"Check Point exploitation observed from 30 October, active until 4 November, against 'a couple of dozen' customers per Check Point, with a second wave on 2 November. CISA KEV added 13 November, federal deadline 16 November - now passed.","context":"Timeline for retrospective hunting on Check Point gateways. Provenance statement, not an indicator.","confidence":"high","source":"Check Point Research; CISA KEV"},{"type":"note","value":"SOURCE CONFLICT: one outlet (Exploitr) reports the release as fixing eight vulnerabilities rather than 18, and sources differ on fixed-in versions for individual CVEs","context":"Check the official PHP advisories before mapping a specific CVE to a specific release. Provenance statement, not an indicator.","confidence":"medium","source":"Search comparison, 20 November 2026"}],"references":["https://www.bleepingcomputer.com/news/security/php-security-updates-fix-18-flaws-including-critical-rce-bugs/","https://thehackernews.com/2026/11/php-fixes-7-critical-flaws-including.html","https://www.aikido.dev/blog/php-security-release-19-november-2026-cve-2026-115560","https://phparch.com/blog/phps-november-security-release-seven-critical-fixes-explained","https://www.chainguard.dev/unchained/phps-november-security-release-what-it-is-and-what-to-update","https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/","https://www.techzine.eu/news/security/145948/php-security-updates-fix-18-vulnerabilities/","https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/","https://blog.checkpoint.com/security/security-advisory-active-exploitation-of-php2shell-and-local-privilege-escalation/","https://thehackernews.com/2026/11/hackers-exploit-php2shell-flaws-in.html"]},{"rank":5,"id":"TI-2026-11-20-005","title":"UK Government: NHS England Issued Its Own Cyber Alert on 19 November for the Critical F5 NGINX Vulnerabilities - NGINX2Root CVE-2026-123007 Now Has Public Rapid7 Exploit Code and a Censys Exposure Tracker, Exploitation Still Not Confirmed, and the Practical Barrier Is About 128 GB of HTTP/2 Traffic","cve_ids":["CVE-2026-123007","CVE-2026-114938"],"vendor":"F5 (NGINX Open Source and NGINX Plus); alert issued by NHS England Digital","affected_products":["NGINX 1.9.5 through 1.31.8 with HTTP/2 enabled - essentially every NGINX build with HTTP/2 since 2015","Fixed: NGINX 1.31.9 (mainline) and 1.30.7 (stable), plus distribution backports","NHS England Digital cyber alert: 'F5 Releases Security Advisory for Critical Vulnerabilities in NGINX Open Source and NGINX Plus', dated and updated 19 November 2026","Also on the same NHS England alert page: 'Oracle Releases November 2026 Critical Patch Update Advisory' (18 November, updated 19 November) and the 18 November Java4Shell alert for CVE-2026-114938","Highest residual risk: embedded NGINX - ingress-nginx controllers, API gateways, WAF appliances and container base images patched on a third party's release cycle"],"category":"vulnerability","cvss_v3":null,"severity":"critical","exploitation_status":"public_poc_available","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-18","last_updated":"2026-11-20","confidence":"high","summary":"This entry carries two things: the UK government alert dated inside the window, and a material revision to how urgent NGINX2Root actually is. The revision cuts the urgency down from where this feed put it yesterday, and that is worth stating plainly rather than quietly.\n\nThe UK government item. NHS England Digital's cyber alerts page lists an alert dated and updated 19 November 2026: 'F5 Releases Security Advisory for Critical Vulnerabilities in NGINX Open Source and NGINX Plus'. The same page carries an Oracle November Critical Patch Update alert dated 18 November and updated 19 November, and the 18 November Java4Shell alert for CVE-2026-114938. NHS England issuing its own alert - rather than relaying the NCSC's - is the signal that matters for UK health and care organisations, because those alerts carry internal compliance weight within the NHS in a way that vendor advisories do not. If you are an NHS trust, ICB, CSU or supplier under the Data Security and Protection Toolkit, this is now an item you will be asked about.\n\nThe revision to urgency, and why it is a downgrade. CVE-2026-123007 is a ten-year-old HTTP/2 flow-control integer underflow in NGINX, unauthenticated, affecting 1.9.5 through 1.31.8 where HTTP/2 is enabled, and reachable by design on every public web listener. Yesterday this feed ranked it first on that exposure profile and the five-hour PoC-to-exploitation interval measured twice this month in comparable components. The new evidence changes the calculation in both directions. Against: a public proof of concept appeared on GitHub on 18 November, the day of disclosure, published by Rapid7; Xint and Wiz both hold working exploits they are not releasing; and Censys has launched a live exposure tracker counting services on an affected version with HTTP/2 actually enabled, which means target lists are now trivially available to anyone. In favour of calm: Rapid7 states that successful exploitation for remote code execution requires a significant amount of network traffic - reported as approximately 128 GB of HTTP/2 traffic - and depends on a specific glibc EVEX/YMM memcpy implementation. As at 19 November no exploitation in the wild has been reported, the CVE is not in CISA's KEV catalogue, and CERT-EU's advisory records no in-the-wild exploitation.\n\nWhat 128 GB actually means operationally, because it is easy to over- or under-read. It does not mean the flaw is unexploitable. It means a successful RCE attempt is loud: sustained, very high-volume HTTP/2 traffic against a single virtual host, which is visible in any netflow, CDN or load balancer telemetry you already have, and which rate limiting and per-connection flow-control limits degrade. It also means mass opportunistic exploitation across the internet is expensive in a way that scanning is not, so the realistic early threat is targeted use against a specific high-value host rather than a spray. And it means the glibc dependency makes exploitability estate-specific: the same NGINX version is exploitable on one distribution build and not another. The correct posture is therefore patch promptly on a normal emergency change footing, and in the meantime instrument for the traffic signature - which is cheap, and which you would want anyway.\n\nThe part that will still be vulnerable in February. Not the servers your team patches. The embedded instances: ingress-nginx controllers inside Kubernetes clusters, API gateways, WAF and load balancer appliances that ship NGINX internally, and container base images baked into pipelines nobody re-runs. Those are patched by somebody else's release cycle. The action is to put the question to your suppliers and platform teams in writing this week and keep the answers, because in three months the honest answer to 'are we patched' will depend on a vendor release you have no visibility of.\n\nJava4Shell, briefly, since it sits on the same NHS England alert page. CVE-2026-114938 remains at probing and exploit-shaped requests rather than confirmed successful exploitation: GreyNoise has reported exploitation attempts without confirming success against its sensors, and the CVE is not in KEV. Reports conflict on public exploit availability - Tenable's FAQ, updated 18 November, mentions a working exploit, while OX Security states there is no publicly available RCE exploit and estimates under 0.12% of JVMs are genuinely at risk of RCE. Calif, the disclosing firm, reports demonstrating RCE in its own testing with no universal exploit. Qualys updated its guidance on 20 November with expanded product coverage for detection, with no new exploitation data. The reclassification test from yesterday still holds and is still the best five minutes available: grep /proc/cpuinfo for avx512_vbmi on internet-facing Java hosts, because the vulnerable path is reported to run only on CPUs with AVX-512 VBMI. Where the flag is absent this drops to a denial-of-service item for the normal cycle. For hosts that cannot be patched yet, Cycode suggests starting the JVM with -XX:-UseBASE64Intrinsics as a stopgap.\n\nConfidence and caveats. Confidence is high on the NGINX affected and fixed versions, the public Rapid7 PoC dated 18 November, the Censys tracker, the absence of confirmed exploitation as at 19 November and the non-KEV status - consistent across Tenable, Help Net Security, SecurityWeek, StepSecurity, SOCRadar and Security Boulevard. The approximately 128 GB figure and the glibc EVEX/YMM memcpy dependency are Rapid7's and are reported consistently but were not verified against Rapid7 directly. The NHS England alert's existence and 19 November date come from the NHS England Digital alerts listing surfaced in search; the alert text, severity rating and recommended actions were not retrieved, because direct page fetches were blocked in this environment. Java4Shell public-exploit availability is genuinely disputed between Tenable and OX Security and is recorded here as disputed.","recommended_actions":["Patch NGINX to 1.31.9 (mainline) or 1.30.7 (stable), or the current distribution backport, on an emergency change footing for internet-facing hosts. The urgency is lower than it looked yesterday - approximately 128 GB of traffic is needed for RCE - but a public exploit plus a public exposure tracker is still the pre-exploitation window, not the safe side of it.","Where you cannot patch within 72 hours, set 'http2 off;' and reload - but check for grpc_pass first, because gRPC upstreams will break, and expect a latency regression on asset-heavy pages.","Instrument for the traffic signature now, because it is cheap and it works: sustained very high-volume HTTP/2 traffic to a single virtual host, and nginx worker processes exiting on a signal. Grep /var/log/nginx/error.log for 'exited on signal'.","Apply or tighten HTTP/2 flow-control and per-connection limits (http2_max_concurrent_streams, client body and request rate limits) as a compensating control. The exploit's volume requirement means rate limiting genuinely degrades it, unlike most RCE flaws.","Put the embedded-NGINX question to suppliers and platform teams in writing this week: ingress-nginx controllers, API gateways, WAF and load balancer appliances, and container base images. Keep the written answers - these are the instances that will still be vulnerable in February.","NHS organisations: NHS England Digital issued its own alert on 19 November, so this now carries internal compliance weight under the Data Security and Protection Toolkit. Record your position against it rather than against F5's advisory alone.","Check the glibc build on your affected hosts. Exploitability depends on a specific EVEX/YMM memcpy implementation, so the same NGINX version is exploitable on one distribution build and not another - which makes exploitability estate-specific and worth determining before you decide the order of patching.","For Java4Shell (CVE-2026-114938), grep /proc/cpuinfo for avx512_vbmi on internet-facing Java hosts before spending another day on it. Where the flag is absent, this drops to a denial-of-service item for the normal patch cycle. Where it is present, patch the identity plane first.","Where a Java host cannot be patched, start the JVM with -XX:-UseBASE64Intrinsics as a stopgap, and remove the flag once patched."],"kql":[{"platform":"sentinel","table":"Syslog","name":"NGINX worker process crashes - the NGINX2Root exploitation artefact","description":"The documented hunting indicator. Worker processes exiting on a signal accompany exploitation attempts against the HTTP/2 flow-control flaw.","query":"Syslog\n| where TimeGenerated > ago(30d)\n| where ProcessName has \"nginx\" or SyslogMessage has \"nginx\"\n| where SyslogMessage has_any (\"exited on signal\", \"worker process\", \"signal 11\", \"SIGSEGV\", \"signal 6\", \"SIGABRT\")\n| summarize Crashes = count(), Messages = make_set(substring(SyslogMessage, 0, 200), 8), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Computer, bin(TimeGenerated, 1h)\n| where Crashes > 2\n| sort by Crashes desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Sustained high-volume HTTP/2 traffic to a single virtual host - the 128 GB signature","description":"RCE reportedly needs around 128 GB of HTTP/2 traffic, which makes a successful attempt loud. This is the single most valuable detection for this flaw and it uses telemetry you already collect.","query":"let volumeThresholdBytes = 10000000000;\nCommonSecurityLog\n| where TimeGenerated > ago(14d)\n| where isnotempty(DestinationHostName)\n| summarize TotalBytes = sum(toreal(SentBytes) + toreal(ReceivedBytes)), Sessions = count(), DistinctSources = dcount(SourceIP) by DestinationHostName, SourceIP, bin(TimeGenerated, 1h)\n| where TotalBytes > volumeThresholdBytes\n| extend GigabytesInHour = round(TotalBytes / 1000000000.0, 2)\n| sort by TotalBytes desc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"HTTP/2 stream and flow-control anomalies at the application gateway","description":"For estates fronted by Azure Application Gateway or an equivalent. Hunt for excessive concurrent streams, protocol errors and connection resets consistent with flow-control abuse.","query":"AzureDiagnostics\n| where TimeGenerated > ago(14d)\n| where Category has_any (\"ApplicationGatewayAccessLog\", \"ApplicationGatewayFirewallLog\")\n| where tostring(parse_json(tostring(properties_s)).httpVersion) has \"2\"\n   or Message has_any (\"HTTP/2\", \"h2\", \"PROTOCOL_ERROR\", \"FLOW_CONTROL_ERROR\", \"ENHANCE_YOUR_CALM\")\n| summarize Events = count(), Sources = dcount(clientIP_s) by host_s, bin(TimeGenerated, 1h)\n| where Events > 1000\n| sort by Events desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"NGINX worker spawning a shell - successful NGINX2Root exploitation","description":"Code execution occurs as the worker process. Any shell, interpreter or network tool parented by nginx is a confirmed compromise.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where InitiatingProcessFileName has \"nginx\"\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"nc\", \"ncat\", \"socat\", \"python3\", \"perl\", \"chmod\", \"base64\", \"id\", \"whoami\")\n| project Timestamp, DeviceName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, AccountName\n| sort by Timestamp desc"},{"platform":"sentinel","table":"DeviceTvmSoftwareInventory","name":"NGINX version inventory against the fixed releases","description":"Everything from 1.9.5 to 1.31.8 is affected where HTTP/2 is enabled. Fixed at 1.31.9 and 1.30.7.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has \"nginx\" or SoftwareVendor has_any (\"nginx\", \"f5\")\n| extend Major = toint(split(SoftwareVersion, \".\")[0]), Minor = toint(split(SoftwareVersion, \".\")[1]), Patch = toint(split(SoftwareVersion, \".\")[2])\n| extend Affected = case(\n    Major == 1 and Minor == 31 and Patch \u003c 9, true,\n    Major == 1 and Minor == 30 and Patch \u003c 7, true,\n    Major == 1 and Minor >= 9 and Minor \u003c 30, true,\n    false)\n| where Affected\n| project DeviceName, SoftwareName, SoftwareVersion, EndOfSupportStatus\n| sort by SoftwareVersion asc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Java4Shell exploitability triage - AVX-512 VBMI capability check","description":"The reclassification test. The Java4Shell RCE path is reported to run only on CPUs with AVX-512 VBMI. Use this to find hosts where the check has been run, and run it on the rest.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where ProcessCommandLine has_any (\"avx512_vbmi\", \"/proc/cpuinfo\", \"lscpu\")\n| project Timestamp, DeviceName, AccountName, ProcessCommandLine, InitiatingProcessFileName\n| sort by Timestamp desc\n// Then run on every internet-facing Java host: grep -o avx512_vbmi /proc/cpuinfo | head -1\n// Absent  => Java4Shell drops to a denial-of-service item for the normal patch cycle\n// Present => patch the identity plane first (Keycloak, PingFederate reported pre-auth in default configuration)"},{"platform":"sentinel","table":"DeviceTvmSoftwareInventory","name":"Embedded NGINX - ingress controllers, gateways and appliances","description":"The instances that will still be vulnerable in February, because they are patched on a supplier's release cycle. This builds the list of written questions to send.","query":"let embeddedIndicators = dynamic([\"ingress-nginx\", \"nginx-ingress\", \"kong\", \"apisix\", \"openresty\", \"tengine\", \"nginx plus\", \"f5 nginx\", \"gateway\"]);\nDeviceTvmSoftwareInventory\n| where SoftwareName has_any (embeddedIndicators) or SoftwareVendor has_any (embeddedIndicators)\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion, EndOfSupportStatus\n| sort by SoftwareVendor asc"}],"iocs":[{"type":"behaviour","value":"nginx worker process 'exited on signal' entries in /var/log/nginx/error.log","context":"The documented hunting indicator for NGINX2Root exploitation attempts. Command: grep 'exited on signal' /var/log/nginx/error.log","confidence":"high","source":"StepSecurity, SOCRadar hunting guidance"},{"type":"filepath","value":"/var/log/nginx/error.log","context":"Where the worker crash evidence lands. Retain it - the default rotation on many distributions will discard the exploitation window.","confidence":"high","source":"Hunting guidance via coverage"},{"type":"behaviour","value":"Sustained HTTP/2 traffic of approximately 128 GB against a single virtual host","context":"Rapid7's stated volume requirement for successful RCE. Makes a real attempt loud in netflow, CDN and load balancer telemetry, and means rate limiting genuinely degrades the exploit.","confidence":"medium","source":"Rapid7 via SecurityWeek, Tenable"},{"type":"behaviour","value":"Dependence on a specific glibc EVEX/YMM memcpy implementation","context":"Makes exploitability estate-specific: the same NGINX version is exploitable on one distribution build and not another. Check the glibc build before deciding patch order.","confidence":"medium","source":"Rapid7 via Tenable, Security Boulevard"},{"type":"ttp","value":"HTTP/2 flow-control integer underflow driven to remote code execution as the nginx worker process","context":"CVE-2026-123007. Unauthenticated, affects 1.9.5 through 1.31.8 with HTTP/2 enabled - effectively every NGINX with HTTP/2 since 2015.","confidence":"high","source":"F5 advisory via Help Net Security, Tenable"},{"type":"behaviour","value":"nginx process as the parent of sh, bash, curl, wget, nc, socat or python3","context":"Confirmed compromise. Code execution occurs as the worker process, so the worker parents everything the attacker runs.","confidence":"high","source":"Analyst assessment"},{"type":"behaviour","value":"Public proof-of-concept exploit published on GitHub on 18 November 2026 by Rapid7, the day of disclosure","context":"Target lists are also public via the Censys exposure tracker. Treat the current absence of exploitation as a timing statement.","confidence":"high","source":"SecurityWeek, Tenable"},{"type":"note","value":"Third-party repository arkrwn/NGINX2Root-CVE-2026-123007 is an unverified exploit client - do not run it outside a lab","context":"Flagged because it appears high in search results for this CVE. Provenance statement, not an indicator.","confidence":"medium","source":"Search results, 20 November 2026"},{"type":"note","value":"No exploitation in the wild reported as at 19 November 2026; not in CISA KEV; CERT-EU advisory records no in-the-wild exploitation","context":"Current state, with working exploits held privately by Xint and Wiz and a public one from Rapid7. Provenance statement, not an indicator.","confidence":"high","source":"Tenable, Help Net Security, CERT-EU via coverage"},{"type":"note","value":"NHS England Digital cyber alert 'F5 Releases Security Advisory for Critical Vulnerabilities in NGINX Open Source and NGINX Plus', dated and updated 19 November 2026","context":"The UK government item inside the window. NHS alerts carry internal compliance weight under the Data Security and Protection Toolkit. Alert text and severity not retrieved. Provenance statement, not an indicator.","confidence":"medium","source":"NHS England Digital cyber alerts listing, surfaced via search"},{"type":"note","value":"Java4Shell CVE-2026-114938: GreyNoise reports exploitation attempts with no confirmed success; not in KEV; public exploit availability DISPUTED between Tenable (working exploit) and OX Security (none publicly available)","context":"Recorded as disputed rather than resolved. OX Security estimates under 0.12% of JVMs are genuinely at RCE risk. Provenance statement, not an indicator.","confidence":"medium","source":"Tenable, OX Security, watchtowr, 18-19 November 2026"},{"type":"behaviour","value":"Absence of the avx512_vbmi CPU flag in /proc/cpuinfo","context":"Reclassifies a Java host from RCE risk to denial-of-service risk for Java4Shell, because the vulnerable path is reported to require AVX-512 VBMI. The most valuable five-minute check available.","confidence":"medium","source":"VulnCheck via coverage; OX Security"},{"type":"behaviour","value":"JVM started with -XX:-UseBASE64Intrinsics","context":"Cycode's recommended stopgap for Java4Shell where patching is not yet possible. Also a useful inventory marker for which hosts have the mitigation applied.","confidence":"medium","source":"Cycode"}],"references":["https://digital.nhs.uk/cyber-alerts/year/2026","https://www.helpnetsecurity.com/2026/11/19/nginx2root-nginx-vulnerabilities/","https://www.securityweek.com/f5-patches-critical-nginx2root-flaws-as-poc-exploits-go-public/","https://www.tenable.com/blog/nginx2root-cve-2026-123007-frequently-asked-questions-about-five-critical-nginx","https://www.stepsecurity.io/blog/cve-2026-123007-nginx-http2-rce","https://socradar.io/blog/nginx2root-nginx-cve-2026-123007/","https://securityboulevard.com/2026/11/nginx2root-cve-2026-123007-frequently-asked-questions-about-five-critical-nginx-vulnerabilities/","https://censys.com/advisory/cve-2026-114938/","https://www.ox.security/blog/java4shell-cve-2026-114938-rce-risk/","https://watchtowr.com/intelligence/java4shell-cve-2026-114938-faq/","https://cycode.com/blog/java4shell-cve-2026-114938/"]},{"rank":6,"id":"TI-2026-11-20-006","title":"UK Government Regulation: FCA, PRA and the Bank of England Opened a Joint Consultation on Cyber Risk and Resilience Management on 19 November (CP17/26 / GC26/9) - Driven by October Being the Second-Highest Month for FCA-Reported Cyber Incidents in Five Years, 52% Above the Previous Peak, Responses Due 26 February 2027","cve_ids":[],"vendor":"Financial Conduct Authority, Prudential Regulation Authority, Bank of England; Information Commissioner's Office (supporting data)","affected_products":["PRA Consultation Paper CP17/26 and FCA Guidance Consultation GC26/9, published 19 November 2026 - joint, principles-based, outcome-focused expectations for cyber risk and resilience management","Draft supervisory statement / finalised guidance text at Annex 1 of the consultation","Consultation closes 26 February 2027; final guidance expected in the first half of 2027, to be published as a joint PRA/Bank supervisory statement and an FCA finalised guidance document","Stated to apply regardless of the technology firms use - deliberately technology-neutral","Reported to add no new rules, but to expect a NAMED SENIOR MANAGER accountable for cyber risk at in-scope firms","Companion effective-practice papers on AI and quantum computing published alongside, not formally open for consultation","Driver data: October 2026 was the second-highest month for cyber incidents reported to the FCA in five years, 52% above the previous 18-month peak of May 2025","Supporting data: ICO recorded 1,371 cyber incident reports in Q3 2026 (July-September), a quarterly record, within 4,604 total data security incident reports - also a record"],"category":"incident","cvss_v3":null,"severity":"informational","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-19","last_updated":"2026-11-20","confidence":"high","summary":"This is the UK government action with the longest reach of anything in this window, and it is included despite having no CVE, no IOC and nothing to patch, because it changes what UK firms will be held to and it publishes the incident numbers that explain why.\n\nWhat was published. On 19 November 2026 the PRA and the FCA jointly opened a consultation - PRA CP17/26 and FCA GC26/9 - on cyber risk and resilience management, with the Bank of England. The draft guidance is principles-based and outcome-focused and is explicitly stated to apply regardless of the technology a firm uses, which is the drafting choice that lets it survive the next decade of technology change. The draft text sits at Annex 1. Responses are due by 26 February 2027, final guidance is expected in the first half of 2027, and it will be issued as a joint PRA/Bank supervisory statement and an FCA finalised guidance document. Separate effective-practice papers on AI and quantum computing were published alongside; those are not formally open for consultation, though the regulators want feedback on whether the format is useful.\n\nThe one provision that will change behaviour. Reporting indicates the draft adds no new rules but expects a named senior manager to be accountable for cyber risk at in-scope firms. That is the whole substance for most readers. 'No new rules' means your obligations under existing operational resilience requirements are unchanged; a named accountable individual means the supervisory conversation acquires a person. In a Senior Managers and Certification Regime environment, naming an accountable individual is not an administrative step - it determines who is questioned after an incident, whose judgement is examined, and whose record carries it. Firms that have run cyber risk through a committee, a CISO without SMF designation, or an outsourced provider will need to decide who holds it, and the honest version of that decision is uncomfortable in a way the committee version was not. Firms should make that decision during the consultation window rather than after the final guidance, because the choice has implications for job descriptions, insurance, delegation and the depth of reporting the named person needs to be able to defend.\n\nThe numbers behind it, and why they are the most useful part of the publication. The FCA says October 2026 was the second-highest month for cyber incidents reported to it in five years, more than 50% higher - reported as 52% - than the previous peak of 18 months earlier in May 2025. The Bank's Systemic Risk Survey continues to rank cyber among the risks with greatest impact on the UK financial system. Alongside that, the Information Commissioner's Office recorded 1,371 cyber incident reports in the third quarter of 2026, a quarterly record beating the previous high set in 2023, within 4,604 total data security incident reports - also the highest quarterly total recorded. The sector detail in the ICO data is the part worth taking to a board: retail and manufacturing reported the most incidents, rising from 205 in Q2 to 296 in Q3, and reports involving charities and voluntary organisations nearly doubled, from 79 to 145. Charities doubling is the single most alarming number in this report, because the charity sector has the least capacity to respond and the most sensitive beneficiary data per pound of revenue.\n\nTwo analytical cautions on the numbers, so they are not misused. First, these are reporting figures, not incident figures. A rise can reflect better detection, more conservative notification, or regulatory pressure to report, and the ICO's own pattern illustrates it: ransomware reports to the ICO have fallen every year since 2023 while leak-site data shows extortion of UK organisations rising, because ICO reports are generally classified as 'other cyber incidents' rather than specifically as ransomware. Any analysis that reads the ICO's ransomware line as a measure of ransomware is wrong. Second, enforcement remains rare: the ICO pursued investigations in 18 of the 1,371 cyber incidents - about 1 in 76 - and closed most cases with informal action. A firm that treats breach reporting as primarily an enforcement risk is mispricing it by roughly two orders of magnitude; the real costs are the incident, the notification and the customers.\n\nWhat to do with this if you are not a financial services firm. Read the draft anyway. Financial services guidance is where UK cyber expectations are drafted first and then propagate - into supplier questionnaires, into insurer underwriting questions, into procurement requirements for anyone selling to a regulated firm, and eventually into the Cyber Security and Resilience Bill's implementing framework. If you supply a UK bank, insurer or payments firm, the questions in this draft will reach you through a contract in 2027 whether or not you are in scope today.\n\nAnd the standing correction, carried because it has not been resolved: the 24 November Commons date for the Cyber Security and Resilience Bill reported in some coverage is not confirmed on Parliament's own pages. Do not build an internal timeline on it.\n\nConfidence and caveats. Confidence is high. The publication date, the CP17/26 and GC26/9 references, the 26 February 2027 deadline, the first-half-2027 expectation, the technology-neutral framing, the Annex 1 draft and the companion AI and quantum papers are consistent across the Bank of England's own publication page, Norton Rose's Regulation Tomorrow, Insurance Business, Neopay, The Paypers and LeapRate. The FCA October figure and the 52% comparison are consistently reported. The named-senior-manager expectation is reported by one commentator summarising the draft and should be confirmed against Annex 1 before any firm acts on it. The ICO Q3 figures come from The Record's analysis published 13 November, corroborated by gblock and CySecurity News; one lower-authority site cites a conflicting 3,600 figure for a different quarter and is disregarded. No pages were fetched directly in this run.","recommended_actions":["Read CP17/26 / GC26/9 Annex 1 and decide now who your named accountable senior manager for cyber risk would be. The decision has implications for SMF designation, job descriptions, insurance, delegation and the depth of reporting that person must be able to defend - make it during the consultation window, not after the final guidance in 2027.","Respond to the consultation by 26 February 2027 if you are in scope. Joint PRA/FCA/Bank guidance drafted now sets the supervisory baseline for the second half of the decade, and the respondents are who shape it.","If you are not in financial services but supply it, read the draft anyway. These questions will reach you through supplier questionnaires, insurer underwriting and procurement requirements in 2027 regardless of your regulatory status.","Take the ICO sector numbers to your board rather than the headline: retail and manufacturing up from 205 to 296 incident reports quarter on quarter, and charities and voluntary organisations nearly doubling from 79 to 145. If you are a charity trustee, that last figure is the agenda item.","Stop using ICO ransomware report counts as a measure of ransomware. ICO cyber reports are generally classified as 'other cyber incidents', so its ransomware line has fallen every year since 2023 while leak-site data shows UK extortion rising. Use leak-site and incident-response data for that question.","Re-price breach reporting internally. The ICO pursued investigations in about 1 in 76 reported cyber incidents and mostly closed with informal action. The dominant costs are the incident, the notification and the customer relationship - not the regulator.","Compare your own detection-to-notification interval against the two cases in this feed: TfL detected 16 November and notified customers 18 November; Wellington IT's October attack was notified to credit unions on 17 November. That contrast is what a regulator will draw, and you should know which side of it you are on before you need to.","Review the companion effective-practice papers on AI and quantum computing. They are not formally open for consultation, but they signal the direction of supervisory interest, and the regulators have asked for feedback on whether the format is useful.","Do not build an internal timeline on the reported 24 November Commons date for the Cyber Security and Resilience Bill. It remains unconfirmed on Parliament's own pages."],"kql":[{"platform":"sentinel","table":"SecurityIncident","name":"Your own reportable incident trend - the number the regulator will ask for","description":"Produces the metric CP17/26 expectations run on: incident volume and severity over time, with the quarter-on-quarter comparison the FCA and ICO publish. Run it before someone asks for it.","query":"SecurityIncident\n| where TimeGenerated > ago(730d)\n| summarize Incidents = count(), High = countif(Severity == \"High\"), Medium = countif(Severity == \"Medium\"), Low = countif(Severity == \"Low\") by Quarter = startofmonth(TimeGenerated)\n| extend QuarterLabel = format_datetime(Quarter, \"yyyy-MM\")\n| sort by Quarter asc\n| extend PrevIncidents = prev(Incidents, 1)\n| extend MoMChangePct = iff(isnotnull(PrevIncidents) and PrevIncidents > 0, round(100.0 * (Incidents - PrevIncidents) / PrevIncidents, 1), todouble(0))"},{"platform":"sentinel","table":"SecurityIncident","name":"Detection-to-containment and detection-to-notification intervals","description":"The two intervals a UK regulator compares across firms. TfL managed detection to customer notification in about two days; Wellington IT took weeks. Measure your own before you are asked.","query":"SecurityIncident\n| where TimeGenerated > ago(365d)\n| where Status == \"Closed\"\n| extend DetectedAt = coalesce(FirstActivityTime, CreatedTime), ClosedAt = ClosedTime\n| where isnotempty(DetectedAt) and isnotempty(ClosedAt)\n| extend HoursToClose = datetime_diff(\"hour\", ClosedAt, DetectedAt)\n| summarize Incidents = count(), MedianHours = percentile(HoursToClose, 50), P90Hours = percentile(HoursToClose, 90), WorstHours = max(HoursToClose) by Severity\n| sort by Severity asc"},{"platform":"sentinel","table":"SecurityIncident","name":"Named-accountability mapping - which incidents reached an owner","description":"If the final guidance expects a named accountable senior manager, that person needs evidence that incidents reach a defined owner. This finds the incidents that did not.","query":"SecurityIncident\n| where TimeGenerated > ago(365d)\n| extend HasOwner = isnotempty(tostring(Owner.userPrincipalName)) or isnotempty(tostring(Owner.email))\n| summarize Total = count(), Unowned = countif(not(HasOwner)), Owned = countif(HasOwner) by Severity\n| extend UnownedRate = round(todouble(Unowned) / Total, 3)\n| sort by Severity asc"},{"platform":"sentinel","table":"SecurityAlert","name":"Third-party and supplier-origin alerts - the operational resilience question","description":"Both the consultation and this window's incidents (Wellington IT, Optimizely, N-able) turn on supplier compromise. Quantify how much of your alert volume originates outside your perimeter.","query":"SecurityAlert\n| where TimeGenerated > ago(180d)\n| extend SupplierRelated = iff(AlertName has_any (\"third party\", \"supplier\", \"vendor\", \"supply chain\", \"partner\", \"managed service\", \"MSP\") or Description has_any (\"third party\", \"supply chain\", \"vendor\"), true, false)\n| summarize Alerts = count(), Supplier = countif(SupplierRelated) by bin(TimeGenerated, 30d)\n| extend SupplierShare = round(todouble(Supplier) / Alerts, 3)\n| sort by TimeGenerated asc"},{"platform":"sentinel","table":"SecurityRecommendation","name":"Control coverage evidence pack for a supervisory conversation","description":"Outcome-focused guidance is answered with outcome evidence. This pulls current secure-score and recommendation state into something a named accountable manager can present.","query":"SecurityRecommendation\n| summarize arg_max(TimeGenerated, *) by RecommendationName\n| project RecommendationName, RecommendationState, Severity = RemediationType, HealthyResourceCount, UnhealthyResourceCount, NotApplicableResourceCount\n| extend CoverageRate = round(todouble(HealthyResourceCount) / (HealthyResourceCount + UnhealthyResourceCount + 1), 3)\n| where UnhealthyResourceCount > 0\n| sort by UnhealthyResourceCount desc"},{"platform":"defender_xdr","table":"DeviceTvmSecureConfigurationAssessment","name":"Technology-neutral control posture by configuration benchmark","description":"The draft guidance applies regardless of technology, so the evidence should be benchmark-based rather than product-based. This summarises configuration compliance across the estate.","query":"DeviceTvmSecureConfigurationAssessment\n| summarize Devices = dcount(DeviceId), Compliant = dcountif(DeviceId, IsCompliant == 1), NonCompliant = dcountif(DeviceId, IsCompliant == 0) by ConfigurationCategory, ConfigurationSubcategory\n| extend ComplianceRate = round(todouble(Compliant) / Devices, 3)\n| where ComplianceRate \u003c 0.9\n| sort by ComplianceRate asc"}],"iocs":[{"type":"note","value":"PRA CP17/26 and FCA GC26/9 - joint consultation on cyber risk and resilience management, published 19 November 2026, responses due 26 February 2027","context":"The UK government regulatory action of the window. Final guidance expected H1 2027 as a joint PRA/Bank supervisory statement and an FCA finalised guidance document. Provenance statement, not an indicator.","confidence":"high","source":"Bank of England publication page; Regulation Tomorrow"},{"type":"note","value":"Draft reported to add no new rules but to expect a NAMED SENIOR MANAGER accountable for cyber risk at in-scope firms","context":"The one provision that will change behaviour. In an SMCR environment, naming an accountable individual determines who is questioned after an incident. Reported by a single commentator - confirm against Annex 1. Provenance statement, not an indicator.","confidence":"medium","source":"Regulatory commentary summarising CP17/26"},{"type":"note","value":"October 2026 was the second-highest month for cyber incidents reported to the FCA in five years, 52% above the previous 18-month peak of May 2025","context":"The driver data for the consultation, and a usable external figure for a board paper. Provenance statement, not an indicator.","confidence":"high","source":"FCA via Insurance Business, Mezha"},{"type":"note","value":"ICO recorded 1,371 cyber incident reports in Q3 2026 (July-September), a quarterly record, within 4,604 total data security incident reports - also a record","context":"The ICO's own figures, analysed by The Record on 13 November 2026. Provenance statement, not an indicator.","confidence":"high","source":"The Record; gblock; CySecurity News"},{"type":"note","value":"ICO sector detail: retail and manufacturing rose from 205 to 296 reports quarter on quarter; charities and voluntary organisations nearly doubled from 79 to 145","context":"The charity figure is the most alarming number in this report - least capacity to respond, most sensitive beneficiary data per pound of revenue. Provenance statement, not an indicator.","confidence":"high","source":"The Record analysis of ICO data"},{"type":"note","value":"ANALYTICAL CAUTION: ICO ransomware reports have fallen every year since 2023 while leak-site data shows UK extortion rising, because ICO cyber reports are generally classified as 'other cyber incidents' rather than as ransomware","context":"Any analysis reading the ICO's ransomware line as a measure of ransomware is wrong. Use leak-site and IR data for that question. Provenance statement, not an indicator.","confidence":"high","source":"The Record; mallory.ai analysis"},{"type":"note","value":"ICO pursued investigations in 18 of 1,371 reported cyber incidents - about 1 in 76 - and closed most cases with informal action","context":"Firms treating breach reporting primarily as enforcement risk are mispricing it. The dominant costs are the incident, the notification and the customer relationship. Provenance statement, not an indicator.","confidence":"high","source":"The Record analysis of ICO data"},{"type":"note","value":"Bank of England Systemic Risk Survey continues to rank cyber among the risks with greatest impact on the UK financial system","context":"Supporting context for the consultation's framing. Provenance statement, not an indicator.","confidence":"high","source":"Bank of England via consultation coverage"},{"type":"note","value":"Companion effective-practice papers on AI and quantum computing published alongside, not formally open for consultation, but feedback sought on the format","context":"Signals the direction of supervisory interest for 2027-2028. Provenance statement, not an indicator.","confidence":"high","source":"Regulation Tomorrow; regreportingdesk"},{"type":"note","value":"STANDING CORRECTION: the 24 November 2026 Commons date for the Cyber Security and Resilience Bill reported in some coverage is NOT confirmed on Parliament's own pages","context":"Carried from earlier runs and still unresolved. Do not build an internal timeline on it. Provenance statement, not an indicator.","confidence":"medium","source":"This feed, carried forward"},{"type":"note","value":"NCSC separately warned of the 'real prospect of an unprecedented rise in cyber incidents in the coming months', on the same day it reported a fall in the most serious attacks","context":"The 'unprecedented' framing widely attributed to the ICO actually originates with the NCSC. Attribute it correctly in internal papers. Provenance statement, not an indicator.","confidence":"medium","source":"Insurance Business; NCSC via coverage"}],"references":["https://www.bankofengland.co.uk/prudential-regulation/publication/2026/november/cyber-risk-and-resilience-management-consultation-paper","https://www.regulationtomorrow.com/2026/11/fca-and-pra-issue-papers-on-cyber-risk/","https://www.insurancebusinessmag.com/uk/news/cyber/uk-regulators-consult-on-cyber-resilience-guidance-as-fca-incidents-hit-secondhighest-level-598028.aspx","https://www.neopay.co.uk/fca-consults-on-new-cyber-risk-and-resilience-guidance-for-financial-firms/","https://thepaypers.com/regulations/news/fca-boe-and-pra-issue-cyber-resilience-guidance-for-financial-firms","https://www.leaprate.com/regulation/fca-pra-and-bank-of-england-seek-views-on-cyber-guidance-by-26-february","https://therecord.media/record-number-of-cyber-incidents-reported-to-uk-regulator","https://www.cysecurity.news/2026/11/uk-data-protection-regulator-sees.html","https://regreportingdesk.com/pra-cp17-26-cyber-risk-resilience-ai-quantum/"]},{"rank":7,"id":"TI-2026-11-20-007","title":"CISA KEV Deadline Board as at 20 November 2026: Apache Axis CVE-2026-90436, Vanderbilt REDCap and Synology DSM All Fall Tomorrow, Saturday 21 November - N-able Has Now Shipped HF3 Which Permanently Removes the Legacy API and Patches 17 Further N-central Zero-Days, and No New KEV Additions Were Identified on 19 or 20 November","cve_ids":["CVE-2026-90436","CVE-2026-90817","CVE-2024-10441","CVE-2026-40217","CVE-2026-115731","CVE-2026-124194","CVE-2026-123039","CVE-2026-114713","CVE-2026-107441","CVE-2026-7273"],"vendor":"Multiple - consolidated CISA KEV remediation deadline view","affected_products":["DUE TOMORROW, SATURDAY 21 NOVEMBER: Apache Axis CVE-2026-90436 (all Apache Axis 1.x through 1.4; Apache does NOT plan an Axis 1.x fix), Vanderbilt REDCap CVE-2026-90817 (CVSS 9.8), Synology DiskStation Manager CVE-2024-10441 (ransomware-linked; patch available since November 2024)","DUE MONDAY 24 NOVEMBER: Microsoft Outlook CVE-2026-124194 - actively exploited spoofing zero-day used to steal NTLMv2 hashes, fixed in November Patch Tuesday, KEV-added 10 November","DUE 1 DECEMBER: Perforce Puppet Enterprise CVE-2026-115731 - deserialization; any CA-signed agent certificate yields code execution on the Puppet Server. KEV-added 17 November","DUE 2 DECEMBER: BerriAI LiteLLM CVE-2026-40217 - LLMjacking","DEADLINE PASSED 16 NOVEMBER: Check Point Gaia CVE-2026-123039 (see rank 4) and UnrealIRCd CVE-2026-114713, both KEV-added 13 November","N-able N-central: HF3 released - permanently removes the Legacy API configuration option, blocking 4EverAble2Shell, and patches 17 further N-central zero-days. Agents and Probes must be upgraded on N-central 2026.4 HF1 or later","OVERDUE GOVERNANCE DEFECT, STILL UNRESOLVED: the Zyxel GS1900 KEV entry names CVE-2026-7273 while Binarly's research shows the exploited flaw is CVE-2026-107441. Fix is firmware 2.90 Patch 3"],"category":"vulnerability_bundle","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-21","patch_available":"partial","first_reported":"2026-11-06","last_updated":"2026-11-20","confidence":"medium","summary":"This entry is the operational calendar rather than a news item: every CISA KEV deadline in the next two weeks in date order, plus the one substantive change inside the window. UK organisations have no obligation to CISA. The deadlines are useful anyway, because they are published, dated and backed by evidence of exploitation rather than by a vendor's severity rating, which makes them the most defensible available input to an internal patching argument.\n\nTomorrow, Saturday 21 November: three deadlines, three days after addition. The one that matters is Apache Axis CVE-2026-90436, and it is unusual in two ways. First, there is no fixed Axis release - Apache states the flaw affects all Axis 1.x versions through 1.4 and that it does not plan an Axis 1.x release to fix it, because the library is end of life. A KEV deadline against a component with no vendor fix is an instruction to remove or isolate, not to patch. Second, it is the initial-access leg of the 4EverAble2Shell chain against N-able N-central. The other two: Vanderbilt REDCap CVE-2026-90817 at CVSS 9.8, which sits inside hundreds of UK university and NHS research estates and is frequently maintained by a research group rather than by IT; and Synology DiskStation Manager CVE-2024-10441, under ransomware attack, with a patch available since November 2024 - a two-year-old fix, which tells you the exploited population is unmanaged NAS boxes in branch offices, under desks and in school server cupboards.\n\nThe substantive change inside the window: N-able has shipped HF3. This is good news with a catch. HF3 removes the configuration option for legacy APIs entirely, so legacy APIs are now permanently blocked, which effectively closes 4EverAble2Shell; it
