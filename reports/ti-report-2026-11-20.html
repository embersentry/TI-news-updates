ely project and served from Optimizely's own CDN","context":"The OPTIMJACK mechanism. Because delivery was from the vendor's CDN inside a snippet the site invites, browsers treated it as trusted first-party content and subresource integrity did not apply.","confidence":"high","source":"Report URI, Help Net Security, SecurityWeek"},{"type":"behaviour","value":"Content Security Policy permitting 'unsafe-eval', allowing an inline copy of a blocked external script to execute","context":"The HSBC finding and the most instructive control failure of the month. A CSP is only as strong as the weakest allowance any third-party vendor asks you to make.","confidence":"high","source":"Report URI / Scott Helme; BigGo Finance"},{"type":"ttp","value":"Cryptocurrency address swapping in the browser (clipboard and DOM substitution of wallet addresses)","context":"One of the two OPTIMJACK payload objectives. The loss lands on your visitors, not on your infrastructure.","confidence":"high","source":"Security Affairs, Latin Times, Breitbart Tech"},{"type":"ttp","value":"Payment card skimming via injected client-side JavaScript (Magecart-class)","context":"The second OPTIMJACK objective. Some reports also reference possible iOS targeting; that element is less well corroborated.","confidence":"high","source":"Help Net Security, SecurityWeek"},{"type":"behaviour","value":"First injection observed at 04:21 UTC on 16 November 2026 in the BBC's Optimizely snippet","context":"Anchor time for building your own exposure window from your logs rather than from the vendor's statement.","confidence":"medium","source":"Report URI via Security Affairs"},{"type":"behaviour","value":"188 of 1,611 Optimizely snippets found infected, belonging to 178 organisations","context":"Report URI's measured scope. UK-linked named victims: HSBC, the BBC, Equifax UK.","confidence":"high","source":"Report URI; Newsweek victim list"},{"type":"ttp","value":"Exploitation of an authorisation flaw in a shared financial services platform to harvest saved payee records across many member institutions","context":"Wellington IT / CU Online: roughly 40 credit unions, approximately 1.4 million malicious requests, potentially 1.8 million people. Carried from earlier runs in this feed.","confidence":"medium","source":"The Register, 19 November 2026; this feed"},{"type":"ttp","value":"Compromise of a booking engine provider's administrative system and export of a reservation data file","context":"The Gleneagle Hotel, Killarney (Ireland), 15 November 2026: names, email addresses, booking references, arrival and departure times. Irish DPC notified.","confidence":"medium","source":"Irish Examiner"},{"type":"note","value":"CORRECTION / SEPARATION: Gleneagles near Auchterarder in SCOTLAND (incident detected around 16 November, payment cards reported unaffected, no official statement on scope) is a DIFFERENT business from The Gleneagle Hotel in Killarney, IRELAND (booking engine provider breach 15 November).","context":"These two are routinely conflated in aggregator coverage. Correct your records if you have logged one as the other. Provenance statement, not an indicator.","confidence":"high","source":"ScottishNews vs Irish Examiner comparison"},{"type":"note","value":"Optimizely states it has fixed the vulnerability and removed the injected code. One outlet attributes the entry point to the Experimentation account signup flow - SINGLE SOURCE, UNVERIFIED.","context":"Treat the signup-flow detail as unconfirmed. Provenance statement, not an indicator.","confidence":"low","source":"Optimizely statement; single-outlet entry-point claim"},{"type":"note","value":"NOTIFICATION TIMELINESS CONTRAST: TfL detected 16 November and notified customers 18 November. Wellington IT's October attack reached credit unions on 17 November, which Irish ministers called unacceptable.","context":"Both ends of the same regulatory judgement inside one week. This is the gap the Cyber Security and Resilience Bill and the FCA/PRA consultation at rank 6 are written to close. Provenance statement, not an indicator.","confidence":"high","source":"This feed, ranks 1, 6 and 10"},{"type":"note","value":"LOW CONFIDENCE: no credible link between a named UK retailer and the 'n0n' extortion brand was established in this window. Aggregator listings reference ShinyHunters-branded claims against Zara, 7-Eleven and Pitney Bowes; Landmark Group (Middle East, not UK) confirmed a loyalty data breach with an n0n listing; Expedia attributes an intrusion to a compromised third-party data platform provider.","context":"Treat leak-site listings as marketing until the victim confirms. Bitdefender earlier assessed n0n's real victim count at roughly twenty of fifty-nine listed. Provenance statement, not an indicator.","confidence":"low","source":"BreachNews-style aggregators; databreaches.net"},{"type":"note","value":"A ShinyHunters-branded claim of 335 million Binance records was rejected by Binance, which found no evidence of a breach to its systems, KYC data or wallet infrastructure; the post may be impersonation","context":"Example of why leak-site branding is unreliable. Provenance statement, not an indicator.","confidence":"medium","source":"databreaches.net, 9 November 2026"},{"type":"note","value":"TFG London (UK arm of The Foschini Group; owner of Phase Eight, Hobbs and Whistles) reported a cyber incident affecting IT systems on 11 October 2026 - still UNATTRIBUTED","context":"Carried for completeness of the UK retail picture. No attribution to any extortion brand has been established. Provenance statement, not an indicator.","confidence":"medium","source":"Insurance Business UK"}],"references":["https://www.helpnetsecurity.com/2026/11/17/optimizely-vulnerability-malicious-javascript/","https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/","https://www.securityweek.com/optimizely-vulnerability-exploited-to-serve-malware-on-major-websites/","https://securityaffairs.com "TI-2026-11-20-002","related_cves":[],"confidence":"low"},{"value":"502, 1911, 4911, 47808","related_entry":"TI-2026-11-20-002","related_cves":[],"confidence":"low"}],"uri_path":[{"value":"/core/install.php","related_entry":"TI-2026-11-20-003","related_cves":["CVE-2026-132165","CVE-2026-132166"],"confidence":"high"},{"value":"/core/rebuild.php","related_entry":"TI-2026-11-20-003","related_cves":["CVE-2026-132165","CVE-2026-132166"],"confidence":"medium"},{"value":"/core/authorize.php","related_entry":"TI-2026-11-20-003","related_cves":["CVE-2026-132165","CVE-2026-132166"],"confidence":"medium"},{"value":"PHP_SESSION_UPLOAD_PROGRESS","related_entry":"TI-2026-11-20-004","related_cves":["CVE-2026-129289","CVE-2026-129481","CVE-2026-109619","CVE-2026-109618","CVE-2026-115560","CVE-2026-126714","CVE-2026-129474","CVE-2026-129182","CVE-2026-129496","CVE-2026-123039"],"confidence":"medium"},{"value":"/plugins/servlet/soap-axis1/confluenceservice-v2","related_entry":"TI-2026-11-20-007","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2024-10441","CVE-2026-40217","CVE-2026-115731","CVE-2026-124194","CVE-2026-123039","CVE-2026-114713","CVE-2026-107441","CVE-2026-7273"],"confidence":"high"},{"value":"/servlet/AxisServlet, /axis/services, AdminService","related_entry":"TI-2026-11-20-007","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2024-10441","CVE-2026-40217","CVE-2026-115731","CVE-2026-124194","CVE-2026-123039","CVE-2026-114713","CVE-2026-107441","CVE-2026-7273"],"confidence":"medium"}],"filepath":[{"value":"settings.php","related_entry":"TI-2026-11-20-003","related_cves":["CVE-2026-132165","CVE-2026-132166"],"confidence":"high"},{"value":"/var/log/nginx/error.log","related_entry":"TI-2026-11-20-005","related_cves":["CVE-2026-123007","CVE-2026-114938"],"confidence":"high"}],"malware":[{"value":"TSGA backdoor","related_entry":"TI-2026-11-20-004","related_cves":["CVE-2026-129289","CVE-2026-129481","CVE-2026-109619","CVE-2026-109618","CVE-2026-115560","CVE-2026-126714","CVE-2026-129474","CVE-2026-129182","CVE-2026-129496","CVE-2026-123039"],"confidence":"medium"},{"value":"XMRig / Monero cryptominer","related_entry":"TI-2026-11-20-007","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2024-10441","CVE-2026-40217","CVE-2026-115731","CVE-2026-124194","CVE-2026-123039","CVE-2026-114713","CVE-2026-107441","CVE-2026-7273"],"confidence":"medium"}],"filename":[{"value":"Narrator.exe","related_entry":"TI-2026-11-20-008","related_cves":["CVE-2026-45585"],"confidence":"high"}]},"summary_statistics":{"total_entries":10,"actively_exploited":4,"public_poc_available":3,"exploitation_reported_unconfirmed":0,"no_known_exploitation":3,"kev_listed":2,"no_patch_available":4,"partial_patch_available":2,"total_cves_referenced":24,"cves_referenced":["CVE-2024-10441","CVE-2026-107441","CVE-2026-109618","CVE-2026-109619","CVE-2026-114713","CVE-2026-114938","CVE-2026-115560","CVE-2026-115731","CVE-2026-123007","CVE-2026-123039","CVE-2026-124194","CVE-2026-126714","CVE-2026-129182","CVE-2026-129289","CVE-2026-129474","CVE-2026-129481","CVE-2026-129496","CVE-2026-132165","CVE-2026-132166","CVE-2026-40217","CVE-2026-45585","CVE-2026-7273","CVE-2026-90436","CVE-2026-90817"],"total_kql_queries":68,"total_iocs":124,"kev_deadlines_passed_or_due":["2026-11-16","2026-11-21","2026-11-24","2026-12-01","2026-12-02"],"new_entries_this_run":9,"carry_over_entries":1,"uk_government_entries":5,"uk_corporate_entries":2,"corrections_this_run":3,"highest_priority_action":"Five things, and the first one costs nothing. (1) PUT A RATE ALERT ON YOUR OWN TRANSACTIONAL EMAIL VOLUME TODAY. Transport for London's compromise was surfaced by customers receiving account-creation emails they had not asked for - the attacker drove a legitimate workflow at scale from inside TfL's own platform and nothing internal flagged it. Around 265,000 Oyster photocard holders had names, home addresses, dates of birth and SECURITY QUESTION ANSWERS exposed. If your platform can send a quarter of a million account emails without raising an alert, you have the same gap, and closing it is a configuration change. Then do the harder half: stop accepting static security answers, dates of birth and addresses as telephone identity proof, because those answers cannot be rotated and the consequence of their loss lands on everyone else who serves the same Londoners. And if you are a public body, your lost-device and incident risk assessments both need re-reading this week - see item 4. (2) ASK YOUR REFRIGERATION CONTRACTOR, IN WRITING, WHETHER ANY CONTROLLER IS REACHABLE FROM THE INTERNET. The NCSC, Defra and the Food Standards Agency spent three weeks from late October quietly taking thousands of Resource Data Management controllers - governing tens of thousands of supermarket fridges - off the open internet, with staff at some sites unplugging cables and checking temperatures by hand, over a weak-password flaw with no CVE. The major grocers were in that programme. Convenience retail, wholesale, hospitality, catering, pharmacy cold chain, vaccine storage and food manufacturing were not, and most of them cannot answer this question from their own records because a contractor commissioned the equipment and it never entered the IT asset inventory. Scan your own external address space rather than trusting the inventory, change every commissioning password, and verify that your temperature alarms terminate somewhere outside the controller. The attack objective is a raised setpoint with the alarm silenced, which produces stock loss and a food safety incident with no IT indicator at all. (3) RE-OPEN YOUR OCTOBER PHP TICKET, AND STOP VERIFYING REMEDIATION BY MATCHING A CVE. PHP's 19 November release lists CVE-2026-129481 as an INCOMPLETE FIX for CVE-2026-109619 - PHP2Shell, the flaw already confirmed as the initial-access leg of in-the-wild attacks that chained into Check Point Gaia CVE-2026-123039 to reach root, deploy the TSGA backdoor and wipe ESXi files. If you patched in October and closed the item, your remediation record is affirmatively wrong and your scanner agrees with the record, not with reality. That is the third case in two weeks: the Zyxel KEV entry names CVE-2026-7273 while the exploited flaw is CVE-2026-107441, and Apache says Roller's September fix for CVE-2026-82384 does not address CVE-2026-129448. Three independent cases is a measurement, not a coincidence. From now on, verify by confirming the installed version against the vendor's current fixed-version list on the day you close the ticket, and search the advisory for 'incomplete fix'. While you are in PHP: patch to 8.5.13 / 8.4.28 / 8.3.37 / 8.2.36 for CVE-2026-129289, the CVSS 9.2 PHP-FPM request smuggling flaw, or disable persistent FPM backend connections as the interim control. (4) BLOCK TWO PATHS AND ENABLE ONE PIN. Block /core/install.php on every Drupal site you operate, patched or not - it ships in every copy of core, core's own .htaccess does not block it, an unauthenticated attacker can drive it into a reinstall (CVE-2026-132165), a PoC exists and the NCSC assessed exploitation likelihood as moderate with significant damage on 19 November. Patch to 10.6.22, 11.3.22 or 11.4.13 out of cycle, and put the deny rule in your standard web server template so the next site is not exposed by default. Then enable a BitLocker PRE-BOOT PIN on devices that leave your premises. FastUnlock, published on GitHub on 19 November with no CVE and no Microsoft fix and verified by ThreatLocker the same day, uses the Narrator screen reader and the Microsoft account recovery link to run code from the lock screen. It does not break BitLocker; it makes TPM-only BitLocker irrelevant, because the volume is already decrypted by the time the lock screen appears. Which means every 'encrypted at rest, screen locked, low risk, not notifiable' lost-device assessment you have signed off was made on a false premise. (5) TOMORROW IS SATURDAY AND THREE KEV DEADLINES FALL ON IT. Apache Axis CVE-2026-90436 - and note there is NO fixed Axis 1.x release and Apache does not plan one, so the instruction is remove or isolate, not patch. On Confluence: disable the Remote API, confirm /plugins/servlet/soap-axis1/confluenceservice-v2 returns 403, upgrade to Data Center 9.2.28, and for anything internet-reachable between 13 and 19 November assume compromise and search pages and attachments for stored credentials first. Vanderbilt REDCap CVE-2026-90817 at CVSS 9.8 also falls tomorrow and in UK universities and NHS research estates it is usually maintained by a research group that has seen none of this - find them today. Synology DSM CVE-2024-10441 is under ransomware attack with a patch that has existed since November 2024, so the work is finding the NAS boxes, not patching them. Then Outlook CVE-2026-124194 on Monday, Puppet on 1 December, LiteLLM on 2 December - and re-open the Zyxel ticket. And one thing to check that takes five minutes: audit your Content Security Policy for 'unsafe-eval'. HSBC had a CSP, it blocked the malicious external script served through Optimizely to 178 organisations including the BBC and Equifax UK, and an inline copy executed anyway because Optimizely's own recommended setting permits eval. A Content Security Policy is only as strong as the weakest allowance a third-party vendor asked you to make. Find out which vendor asked for each one, put the question back to them in writing, and send your CSP violation reports somewhere a human actually reads."}}</script>

  /* ---------- dom helpers (textContent only - no HTML injection) ---------- */
  function el(tag, cls, text){

    return n;
  }
  function kv(dl, key, val, accent){
    var d = el("div"), dt = el("dt", null, key), dd = el("dd");
    if (accent){ var b = el("b", null, val); dd.appendChild(b); } else { dd.textContent = val; }
    d.appendChild(dt); d.appendChild(dd); dl.appendChild(d); return d;
  }
  function sec(title){
    var s = el("section","sec"); s.appendChild(el("h3", null, title)); return s;
  }
  function fmtDate(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var day = String(d.getUTCDate()).padStart(2,"0");
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    var out = day + " " + mon + " " + d.getUTCFullYear();
    if (String(iso).indexOf("T") > -1){
      out += " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + "Z";
    }
    return out;
  }
  function label(s){
    if (!s) return "—";
    return String(s).replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
  }

  /* ---------- minimal KQL highlighter (safe: builds text nodes only) ---------- */
  var KQL_KW = ("let|where|project|summarize|extend|sort|order|by|join|union|take|limit|distinct|"
    + "count|dcount|countif|sum|make_set|make_list|min|max|any|avg|bin|ago|now|datetime|dynamic|"
    + "todouble|tostring|toint|tolong|strcat|strlen|extract|extract_all|parse_json|coalesce|"
    + "set_intersection|isnotempty|isempty|has|has_any|has_all|has_cs|contains|startswith|"
    + "endswith|in|and|or|not|asc|desc|on|datetime_part|dayofweek|column_ifexists|"
    + "ipv4_is_in_any_range|iff|case|print|top").split("|");
  var KQL_RE = new RegExp("(//[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b("
    + KQL_KW.join("|") + ")\\b", "g");
  function highlight(code){
    var frag = document.createDocumentFragment(), last = 0, m;
    KQL_RE.lastIndex = 0;
    while ((m = KQL_RE.exec(code)) !== null){
      if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
      var span = el("span", m[1] ? "c" : (m[2] ? "s" : "k"), m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
    return frag;
  }

  function copyBtn(getText, labelText){
    var b = el("button","copy", labelText || "Copy");
    b.type = "button";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = getText();
      function done(){
        var old = b.textContent;
        b.textContent = "Copied"; b.classList.add("ok");
        setTimeout(function(){ b.textContent = old; b.classList.remove("ok"); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
      } else { fallback(txt, done); }
    });
    return b;
  }
  function fallback(txt, done){
    var ta = el("textarea"); ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  /* ---------- render: masthead / tiles / posture ---------- */
  function renderHead(){

      c.setAttribute("cx","8"); c.setAttribute("cy","11.6"); c.setAttribute("r",".95");

      svg.appendChild(p1); svg.appendChild(p2); svg.appendChild(c);

  function renderTiles(){
    var st = DATA.summary_statistics || {}, v = DATA.vulnerabilities || [];

      ["Entries", st.total_entries != null ? st.total_entries : v.length, ""],

  function renderPosture(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];
    var counts = {};
    v.forEach(function(e){ counts[e.exploitation_status] = (counts[e.exploitation_status]||0) + 1; });
    var present = order.filter(function(k){ return counts[k]; });
    var box = document.getElementById("posture"); box.textContent = "";
    if (!present.length || !v.length){ box.hidden = true; return; }
    box.hidden = false;
    box.appendChild(el("h2", null, "Exploitation posture across " + v.length + " entries"));
    var bar = el("div","pbar");
    present.forEach(function(k){
      var s = el("div","pseg " + STATUS[k].seg);
      s.style.flex = counts[k];
      s.setAttribute("title", STATUS[k].full + ": " + counts[k]);
      bar.appendChild(s);
    });
    box.appendChild(bar);
    var lg = el("div","plegend");
    present.forEach(function(k){
      var s = el("span");
      s.appendChild(el("i","swatch " + STATUS[k].seg));
      s.appendChild(el("b", null, counts[k]));
      s.appendChild(document.createTextNode(STATUS[k].full));
      lg.appendChild(s);
    });
    box.appendChild(lg);
  }

  /* ---------- render: one entry ---------- */
  function renderEntry(e){
    var li = el("li","card");
    li.setAttribute("data-status", e.exploitation_status || "");

    /* header (button for keyboard access) */
    var head = el("button","chead");
    head.type = "button";
    head.setAttribute("aria-expanded","false");
    head.appendChild(el("div","rank", e.rank != null ? e.rank : "·"));

    var body = el("div","cbody");
    body.appendChild(el("h2","ctitle", e.title || "Untitled"));

    var meta = el("div","meta");
    var S = STATUS[e.exploitation_status];
    if (S) meta.appendChild(el("span","pill " + S.cls, S.short));
    if (e.kev_listed) meta.appendChild(el("span","pill kev",
      "KEV" + (e.kev_due_date ? " · due " + e.kev_due_date : "")));
    var P = PATCH[e.patch_available];
    if (P) meta.appendChild(el("span","pill " + P.cls, P.t));
    if (e.severity) meta.appendChild(el("span","pill plain",
      label(e.severity) + (e.cvss_v3 != null ? " · CVSS " + e.cvss_v3 : "")));
    if (e.vendor) meta.appendChild(el("span","pill plain", e.vendor));
    (e.cve_ids || []).slice(0,4).forEach(function(c){ meta.appendChild(el("span","cve", c)); });
    if ((e.cve_ids || []).length > 4)
      meta.appendChild(el("span","cve more", "+" + (e.cve_ids.length - 4) + " more"));
    body.appendChild(meta);
    if (e.summary) body.appendChild(el("p","teaser", e.summary));
    head.appendChild(body);

    var caret = document.createElementNS("http://www.w3.org/2000/svg","svg");
    caret.setAttribute("class","caret"); caret.setAttribute("width","11");
    caret.setAttribute("height","11"); caret.setAttribute("viewBox","0 0 12 12");
    caret.setAttribute("fill","none"); caret.setAttribute("aria-hidden","true");
    var cp = document.createElementNS("http://www.w3.org/2000/svg","path");
    cp.setAttribute("d","m3 1 5 5-5 5"); cp.setAttribute("stroke","currentColor");
    cp.setAttribute("stroke-width","1.8"); cp.setAttribute("stroke-linecap","round");
    cp.setAttribute("stroke-linejoin","round");
    caret.appendChild(cp); head.appendChild(caret);
    li.appendChild(head);

    /* detail */
    var det = el("div","detail");

    var facts = sec("At a glance");
    var fl = el("dl","facts");
    if (e.id) kv(fl, "Entry ID", e.id);
    if (e.category) kv(fl, "Category", CATEGORY[e.category] || label(e.category));
    if (S) kv(fl, "Exploitation", S.full);
    kv(fl, "Patch available", label(e.patch_available));
    if (e.first_reported) kv(fl, "First reported", e.first_reported);
    if (e.last_updated) kv(fl, "Last updated", e.last_updated);
    if (e.confidence) kv(fl, "Entry confidence", label(e.confidence));
    if (e.kev_due_date) kv(fl, "KEV due date", e.kev_due_date);
    facts.appendChild(fl);
    det.appendChild(facts);

    if (e.summary){
      var s1 = sec("Analyst summary");
      s1.appendChild(el("p","prose", e.summary));
      det.appendChild(s1);
    }
    if ((e.affected_products || []).length){
      var s2 = sec("Affected products");
      var u2 = el("ul","list");
      e.affected_products.forEach(function(p){ u2.appendChild(el("li", null, p)); });
      s2.appendChild(u2); det.appendChild(s2);
    }
    if ((e.recommended_actions || []).length){
      var s3 = sec("Recommended actions");
      var u3 = el("ul","list num");
      e.recommended_actions.forEach(function(a){ u3.appendChild(el("li", null, a)); });
      s3.appendChild(u3); det.appendChild(s3);
    }

    /* KQL */
    if ((e.kql || []).length){
      var s4 = sec("Detection — KQL for Sentinel / Defender XDR (" + e.kql.length + ")");
      e.kql.forEach(function(q){
        var box = el("div","kql"), h = el("div","kql-head");
        var kn = el("div","kn");
        kn.appendChild(el("h4", null, q.name || "Query"));
        if (q.description) kn.appendChild(el("p", null, q.description));
        h.appendChild(kn);
        var plat = el("span","plat",
          (PLATFORM[q.platform] || q.platform || "") + (q.table ? " · " + q.table : ""));
        h.appendChild(plat);
        h.appendChild(copyBtn(function(){ return q.query || ""; }, "Copy KQL"));
        box.appendChild(h);
        var pre = el("pre"), code = el("code");
        code.appendChild(highlight(q.query || ""));
        pre.appendChild(code); box.appendChild(pre);
        s4.appendChild(box);
      });
      det.appendChild(s4);
    }

    /* IOCs */
    var iocs = e.iocs || [];
    if (iocs.length){
      var real = iocs.filter(function(i){ return i.type !== "note"; });
      var notes = iocs.filter(function(i){ return i.type === "note"; });
      var s5 = sec("Indicators of compromise (" + real.length + ")");
      if (real.length){
        s5.querySelector("h3").appendChild(copyBtn(function(){
          return real.map(function(i){ return i.value; }).join("\n");
        }, "Copy values"));
      }
      notes.forEach(function(n){
        var np = el("p","note-row", "⚠ " + n.context);
        np.style.margin = "0 0 13px"; s5.appendChild(np);
      });
      if (real.length){
        var wrap = el("div","tbl-wrap"), tb = el("table");
        var thead = el("thead"), tr = el("tr");
        ["Type","Value","Confidence","Context","Source"].forEach(function(h2){
          tr.appendChild(el("th", null, h2));
        });
        thead.appendChild(tr); tb.appendChild(thead);
        var tbody = el("tbody");
        real.forEach(function(i){
          var r = el("tr");
          r.appendChild(el("td","t", i.type));
          r.appendChild(el("td","v", i.value));
          var cd = el("td");
          cd.appendChild(el("span","cf " + (i.confidence || "low"), i.confidence || "—"));
          r.appendChild(cd);
          r.appendChild(el("td","ctx", i.context || "—"));
          r.appendChild(el("td","src", i.source || "—"));
          tbody.appendChild(r);
        });
        tb.appendChild(tbody); wrap.appendChild(tb); s5.appendChild(wrap);
      }
      det.appendChild(s5);
    }

    if ((e.references || []).length){
      var s6 = sec("References");
      var u6 = el("ul","refs");
      e.references.forEach(function(r){
        var li6 = el("li"), a = el("a", null, r);
        a.href = r; a.target = "_blank"; a.rel = "noopener noreferrer";
        li6.appendChild(a); u6.appendChild(li6);
      });
      s6.appendChild(u6); det.appendChild(s6);
    }

    li.appendChild(det);

    head.addEventListener("click", function(){
      var open = li.classList.toggle("is-open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
    });
    return li;
  }

  /* ---------- filtering ---------- */
  function haystack(e){
    var parts = [e.title, e.summary, e.vendor, e.id, e.category, e.severity, e.exploitation_status];
    parts = parts.concat(e.cve_ids || [], e.affected_products || [], e.recommended_actions || []);
    (e.iocs || []).forEach(function(i){ parts.push(i.value, i.type, i.context); });
    (e.kql || []).forEach(function(q){ parts.push(q.name, q.table, q.description); });
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function apply(){
    var v = DATA.vulnerabilities || [];
    var q = FILTER.q.trim().toLowerCase();
    var shown = 0;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li, idx){
      var e = v[idx], ok = true;
      if (FILTER.status !== "all" && e.exploitation_status !== FILTER.status) ok = false;
      if (ok && FILTER.kev && !e.kev_listed) ok = false;
      if (ok && FILTER.nopatch && e.patch_available === "yes") ok = false;
      if (ok && q && li._hay.indexOf(q) === -1) ok = false;
      li.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById("count").textContent = shown + " of " + v.length + " shown";
    document.getElementById("empty").hidden = shown !== 0;
  }

  function renderChips(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];
    var counts = {};
    v.forEach(function(e){ counts[e.exploitation_status] = (counts[e.exploitation_status]||0)+1; });
    var box = document.getElementById("status-chips"); box.textContent = "";
    var defs = [["all","All",v.length]];
    order.forEach(function(k){ if (counts[k]) defs.push([k, STATUS[k].short, counts[k]]); });
    defs.forEach(function(d){
      var b = el("button","chip", d[1] + " (" + d[2] + ")");
      b.type = "button";
      b.setAttribute("aria-pressed", FILTER.status === d[0] ? "true" : "false");
      b.addEventListener("click", function(){
        FILTER.status = d[0];
        Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        apply();
      });
      box.appendChild(b);
    });
  }

  /* ---------- provenance ---------- */
  function renderProv(){
    var cm = DATA.collection_metadata || {};
    var box = document.getElementById("prov-body"); box.textContent = "";
    if (cm.collection_method){
      box.appendChild(el("h4", null, "Collection method"));
      box.appendChild(el("p","prose", cm.collection_method));
    }
    if ((cm.limitations || []).length){
      box.appendChild(el("h4", null, "Limitations"));
      var u = el("ul","list");
      cm.limitations.forEach(function(l){ u.appendChild(el("li", null, l)); });
      box.appendChild(u);
    }
    if (cm.confidence_legend){
      box.appendChild(el("h4", null, "Confidence legend"));
      var dl = el("dl");
      Object.keys(cm.confidence_legend).forEach(function(k){
        dl.appendChild(el("dt", null, k));
        dl.appendChild(el("dd", null, cm.confidence_legend[k]));
      });
      box.appendChild(dl);
    }
    var w = (DATA.report || {}).coverage_window || {};
    if (w.note){
      box.appendChild(el("h4", null, "Coverage window note"));
      box.appendChild(el("p","prose", w.note));
    }
    if ((cm.ioc_types_present || []).length){
      box.appendChild(el("h4", null, "IOC types present"));
      box.appendChild(el("p","prose", cm.ioc_types_present.join(", ")));
    }
  }

  /* ---------- report archive timeline ---------- */
  var TL_SHOWN = 10;

  function shortDate(iso){
    var p = String(iso).split("-");
    if (p.length !== 3) return String(iso);
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1];
    return (+p[2]) + " " + mon;
  }
  function longDate(iso){
    var p = String(iso).split("-");
    return p.length === 3 ? shortDate(iso) + " " + p[0] : String(iso);
  }
  /* A dated report sits in reports/; the stable copy sits at the repo root.
     Work out which, so archive links resolve from either location. */
  function archivePrefix(){
    return location.pathname.indexOf("/reports/") > -1 ? "" : "reports/";
  }

  function renderTimeline(index){
    var box = document.getElementById("timeline");
    box.textContent = "";
    var reports = (index && index.reports) || [];
    if (!reports.length){ box.hidden = true; return; }
    box.hidden = false;

    var current = index.generated_for;
    var prefix  = archivePrefix();
    var peak    = Math.max.apply(null, reports.map(function(r){ return r.actively_exploited || 0; }));
    if (!peak) peak = 1;

    /* header */
    var head = el("div","tl-head");
    head.appendChild(el("h2", null, "Report archive"));
    var meta = el("span","tl-meta");
    meta.appendChild(el("b", null, reports.length));
    meta.appendChild(document.createTextNode(
      " reports · " + longDate(reports[0].date) +
      " – " + longDate(reports[reports.length-1].date)));
    head.appendChild(meta);
    /* A dated report's index stops at its own date, so it can never name a
       later report. The stable root copy is always the newest, so offer that
       as the way forward. Omitted at the root, where it is the current page. */
    if (!prefix){
      var latest = el("a","tl-latest","Latest report \u2192");
      latest.href = "../ti-report.html";
      head.appendChild(latest);
    }
    box.appendChild(head);

    /* bars - one series (actively exploited per report), so no legend box;
       the caption names it. Hover and keyboard focus both open the tooltip. */
    var chart = el("div","tl-chart");
    var bars  = el("div","tl-bars");
    var tip   = el("div","tl-tip"); tip.hidden = true;

    reports.forEach(function(r){
      var b = el("button","tl-bar" + (r.date === current ? " is-current" : ""));
      b.type = "button";
      b.setAttribute("aria-label",
        longDate(r.date) + ": " + (r.actively_exploited||0) + " actively exploited of " +
        r.entries + " entries");
      var fill = el("span","tl-fill");
      fill.style.height = Math.max(4, Math.round((r.actively_exploited||0) / peak * 100)) + "%";
      b.appendChild(fill);

      function show(){
        tip.textContent = "";
        tip.appendChild(el("p","t-d", longDate(r.date) + (r.date === current ? "  (this report)" : "")));
        if (r.headline) tip.appendChild(el("p","t-h", r.headline));
        tip.appendChild(el("p","t-c",
          r.entries + " entries · " + (r.actively_exploited||0) + " exploited · " +
          (r.kev_listed||0) + " KEV · " + (r.cves||0) + " CVEs"));
        tip.hidden = false;
        /* clamp the tooltip inside the chart */
        var left = b.offsetLeft + b.offsetWidth/2 - bars.scrollLeft;
        var w = tip.offsetWidth || 200;
        var maxLeft = chart.clientWidth - w;
        tip.style.left = Math.max(0, Math.min(left - w/2, maxLeft < 0 ? 0 : maxLeft)) + "px";
      }
      function hide(){ tip.hidden = true; }
      b.addEventListener("mouseenter", show);
      b.addEventListener("focus", show);
      b.addEventListener("mouseleave", hide);
      b.addEventListener("blur", hide);
      b.addEventListener("click", function(){ location.href = prefix + r.file; });
      bars.appendChild(b);
    });

    chart.appendChild(tip);
    chart.appendChild(bars);
    var axis = el("div","tl-axis");
    axis.appendChild(el("span", null, shortDate(reports[0].date)));
    axis.appendChild(el("span", null, "actively exploited per report · peak " + peak));
    axis.appendChild(el("span", null, shortDate(reports[reports.length-1].date)));
    chart.appendChild(axis);
    box.appendChild(chart);

    /* newest-first list - this doubles as the chart's table view */
    var list = el("ol","tl-list");
    var ordered = reports.slice().reverse();
    ordered.forEach(function(r, i){
      var li = el("li");
      if (i >= TL_SHOWN) li.hidden = true;
      var a = el("a","tl-row" + (r.date === current ? " is-current" : ""));
      a.href = prefix + r.file;
      a.appendChild(el("span","tl-d", shortDate(r.date)));
      a.appendChild(el("span","tl-h", r.headline || "—"));
      if (r.date === current) a.appendChild(el("span","tl-now","viewing"));
      a.appendChild(el("span","tl-c",
        r.entries + "e · " + (r.actively_exploited||0) + "x · " + (r.kev_listed||0) + "k"));
      li.appendChild(a);
      list.appendChild(li);
    });
    box.appendChild(list);

    if (ordered.length > TL_SHOWN){
      var more = el("button","btn tl-more", "Show all " + ordered.length + " reports");
      more.type = "button";
      var open = false;
      more.addEventListener("click", function(){
        open = !open;
        Array.prototype.forEach.call(list.children, function(li, i){
          li.hidden = open ? false : i >= TL_SHOWN;
        });
        more.textContent = open ? "Show recent only" : "Show all " + ordered.length + " reports";
      });
      box.appendChild(more);
    }
  }

  /* ---------- boot ---------- */
  function render(data){
    DATA = data;
    renderHead(); renderTiles(); renderPosture(); renderChips(); renderProv();
    var list = document.getElementById("entries"); list.textContent = "";
    (DATA.vulnerabilities || []).forEach(function(e){
      var li = renderEntry(e);
      li._hay = haystack(e);
      list.appendChild(li);
    });
    ALL_OPEN = false;
    document.getElementById("toggle-all").textContent = "Expand all";
    apply();
  }

  document.getElementById("q").addEventListener("input", function(ev){
    FILTER.q = ev.target.value; apply();
  });
  ["f-kev","f-nopatch"].forEach(function(id){
    document.getElementById(id).addEventListener("click", function(){
      var b = document.getElementById(id);
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      FILTER[id === "f-kev" ? "kev" : "nopatch"] = on;
      apply();
    });
  });
  document.getElementById("toggle-all").addEventListener("click", function(){
    ALL_OPEN = !ALL_OPEN;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li){
      li.classList.toggle("is-open", ALL_OPEN);
      var h = li.querySelector(".chead");
      if (h) h.setAttribute("aria-expanded", ALL_OPEN ? "true" : "false");
    });
    this.textContent = ALL_OPEN ? "Collapse all" : "Expand all";
  });

  /* drag & drop any TI JSON */
  var dragDepth = 0;
  window.addEventListener("dragenter", function(ev){ ev.preventDefault(); if (++dragDepth) document.body.classList.add("dragging"); });
  window.addEventListener("dragover",  function(ev){ ev.preventDefault(); });
  window.addEventListener("dragleave", function(){ if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("drop", function(ev){
    ev.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var parsed = JSON.parse(fr.result);
        if (!parsed || !parsed.vulnerabilities) throw new Error("not a TI output config");
        render(parsed);
        window.scrollTo(0,0);
      } catch(err){
        alert("Could not load that file: " + err.message);
      }
    };
    fr.readAsText(f);
  });

  /* embedded data first (works offline from file://); refresh from the sibling
     JSON when served over http(s) so a hosted copy always shows today's feed */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("ti-data").textContent); } catch(e){}
  if (embedded && embedded.vulnerabilities) render(embedded);

  /* The archive index describes the reports/ directory, not the data on show,
     so it is rendered once and left alone when another config is loaded. */
  try { renderTimeline(JSON.parse(document.getElementById("ti-index").textContent)); }
  catch(e){ document.getElementById("timeline").hidden = true; }

  if (location.protocol === "http:" || location.protocol === "https:"){
    fetch("ti-output-config.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      if (j && j.vulnerabilities){
        var a = (j.report||{}).check_performed_at, b = (embedded&&embedded.report||{}).check_performed_at;
        if (a !== b) render(j);
      }
    }).catch(function(){ /* offline or no sibling file - embedded copy stands */ });
  }
})();
</script>
</body>
