k before 2.2.0","SignalWire FreeSWITCH before 1.11.3","OpenSSH - certain musl libc builds without PAM (update to 10.6p2)","IBM Aspera Faspex 5.0.0 through 5.0.19 (fix 5.0.19 PL1; verify the faspex-core container image)"],"category":"vulnerability_bundle","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-12","patch_available":"yes","first_reported":"2026-11-09","last_updated":"2026-11-11","confidence":"medium","summary":"UK government and UK corporate - infrastructure and AI platforms. CISA added four actively exploited flaws to the KEV catalog on 9 November 2026 with a federal remediation deadline of 12 November, i.e. tomorrow relative to this report. (1) GPUStack CVE-2026-102895, an improper-authentication flaw reported at CVSS 9.8, fixed in version 2.2.0 - notable because GPU orchestration platforms are being stood up rapidly across UK research, higher education and public-sector AI programmes, frequently outside mainstream IT governance, and an authentication bypass there yields compute, models and training data. (2) SignalWire FreeSWITCH CVE-2026-116779, a code-injection flaw affecting versions before 1.11.3, which sits in voice/UC infrastructure and carries toll-fraud as well as intrusion risk. (3) OpenSSH CVE-2026-123158, classed as an unexpected status code or return value issue; exposure is reported as limited to certain musl libc builds without PAM, which in practice means Alpine-based containers and appliance firmware rather than mainstream Debian/RHEL hosts - update to 10.6p2 and check your build configuration before assuming either exposure or safety. (4) IBM Aspera Faspex CVE-2026-123218, an incorrect-authorization flaw reported at CVSS 9.8 affecting 5.0.0 to 5.0.19, fixed in 5.0.19 PL1; Faspex is a managed file-transfer product and MFT platforms have a long record of being exploited for mass data theft against government and corporate targets. ASSESSMENT: the OpenSSH and Faspex entries are the ones most likely to be mis-triaged in UK estates - the first because the musl/PAM condition is easy to misread in either direction, the second because container-image patching is often missed when the host package is updated. Sources differ on product naming (OpenBSD OpenSSH vs OpenSSH, SignalWire FreeSWITCH vs FreeSWITCH) but the CVE IDs are consistent. No attribution or indicators have been published. Detail is from search-result summaries; cisa.gov was not retrievable from this environment, so verify each KEV entry directly.","recommended_actions":["Treat 12 November as the deadline: all four are KEV-listed with confirmed in-the-wild exploitation.","GPUStack: upgrade to 2.2.0 or later, remove any internet exposure of the control plane, and audit for unauthorised model, dataset or job access. Include shadow/research deployments outside the central IT inventory.","FreeSWITCH: upgrade to 1.11.3 or later; restrict SIP and ESL interfaces to trusted networks and review call-detail records for toll fraud.","OpenSSH: determine whether any build in use is musl-based without PAM (Alpine containers, embedded appliances, network device firmware) before concluding you are unaffected; update affected builds to 10.6p2.","IBM Aspera Faspex: apply 5.0.19 PL1 and explicitly verify the faspex-core container image version - patching the host without rebuilding the container leaves the flaw in place.","For Faspex, assume data exposure if the instance was internet-facing and unpatched: review transfer logs, user accounts and shared-package access for anomalies.","Rebuild and redeploy container images rather than patching running containers, and re-scan registries for the affected base layers."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Exposure check for the 9 November KEV batch","description":"Untested. Fastest coverage view for onboarded assets; appliance and container workloads will under-report, so pair with the hunts below.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId in (\"CVE-2026-102895\", \"CVE-2026-116779\", \"CVE-2026-123158\", \"CVE-2026-123218\")\n| summarize CVEs = make_set(CveId), Versions = make_set(SoftwareVersion, 10) by DeviceName, DeviceId, SoftwareVendor, SoftwareName\n| order by DeviceName asc"},{"platform":"sentinel","table":"Syslog","name":"SSH authentication anomalies on Linux and container hosts","description":"Untested. CVE-2026-123158 concerns unexpected authentication return values, so hunt for successful sessions without a matching accepted-authentication line and for abnormal success ratios per source.","query":"let Window = 30d;\nlet Accepted = Syslog\n  | where TimeGenerated > ago(Window)\n  | where ProcessName =~ \"sshd\"\n  | where SyslogMessage has_any (\"Accepted password\", \"Accepted publickey\", \"Accepted keyboard-interactive\")\n  | extend SrcIP = extract(@\"from ([0-9a-fA-F:.]+)\", 1, SyslogMessage)\n  | summarize Successes = count() by Computer, SrcIP, bin(TimeGenerated, 1h);\nlet Sessions = Syslog\n  | where TimeGenerated > ago(Window)\n  | where ProcessName =~ \"sshd\"\n  | where SyslogMessage has_any (\"session opened\", \"New session\")\n  | summarize Sessions = count() by Computer, bin(TimeGenerated, 1h);\nSessions\n| join kind=leftouter (Accepted | summarize Successes = sum(Successes) by Computer, TimeGenerated) on Computer, TimeGenerated\n| extend Successes = coalesce(Successes, 0)\n| where Sessions > Successes\n| project TimeGenerated, Computer, Sessions, Successes, Unexplained = Sessions - Successes\n| order by Unexplained desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Unauthenticated access to GPUStack or Aspera Faspex web interfaces","description":"Untested. Both CVEs are authentication/authorisation bypasses, so the signal is successful API or package access without a preceding login. Populate the host list with your GPUStack and Faspex servers.","query":"let TargetHosts = dynamic([\"10.0.0.0\"]);  // GPUStack control plane and Aspera Faspex servers\nCommonSecurityLog\n| where TimeGenerated > ago(60d)\n| where DestinationIP in (TargetHosts)\n| where RequestURL has_any (\"/v1/\", \"/api/\", \"/aspera/faspex\", \"/packages\", \"/models\", \"/workers\", \"/token\", \"/auth\")\n| summarize Requests = count(), URLs = make_set(RequestURL, 25), Methods = make_set(RequestMethod, 10), Sent = sum(toreal(SentBytes)) by SourceIP, DestinationIP, bin(TimeGenerated, 1h)\n| where Requests > 50 or Sent > 52428800\n| order by Requests desc"},{"platform":"sentinel","table":"Syslog","name":"FreeSWITCH command injection and toll-fraud indicators","description":"Untested. Covers both the exploitation artefact (shell metacharacters in FreeSWITCH log lines) and the common objective (unexpected international call volume).","query":"Syslog\n| where TimeGenerated > ago(60d)\n| where Computer has_any (\"freeswitch\", \"fs-\", \"sbc\") or ProcessName has \"freeswitch\"\n| where SyslogMessage has_any (\"$(\", \"`\", \"&&\", \"||\", \";wget\", \"; wget\", \";curl\", \"; curl\", \"/bin/sh\", \"/bin/bash\", \"bash -i\", \"nc -e\", \"python -c\", \"lua\", \"system(\")\n| project TimeGenerated, Computer, ProcessName, SeverityLevel, SyslogMessage\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"CISA published no attribution or technical indicators for any of the four CVEs; detection must be exposure- and behaviour-based. CVE details were not verified against CISA's catalog from this environment.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-09/11"},{"type":"ttp","value":"T1190 - Exploit Public-Facing Application","context":"All four products are commonly internet-reachable (GPUStack control plane, FreeSWITCH SIP, SSH, Faspex web).","confidence":"high","source":"CISA KEV (as relayed)"},{"type":"ttp","value":"T1078 - Valid Accounts / authentication bypass","context":"GPUStack CVE-2026-102895 improper authentication and IBM Aspera Faspex CVE-2026-123218 incorrect authorization.","confidence":"high","source":"CISA KEV (as relayed)"},{"type":"ttp","value":"T1059 - Command and Scripting Interpreter","context":"SignalWire FreeSWITCH CVE-2026-116779 code injection.","confidence":"high","source":"CISA KEV (as relayed)"},{"type":"behaviour","value":"OpenSSH exposure limited to musl libc builds compiled without PAM","context":"Scoping condition for CVE-2026-123158 - Alpine-based containers and appliance firmware rather than mainstream glibc distributions. Verify your build before accepting or dismissing exposure.","confidence":"medium","source":"eSecurityPlanet / press (as relayed)"},{"type":"behaviour","value":"Aspera Faspex host package updated while the faspex-core container image remains on an affected version","context":"Common remediation gap that leaves CVE-2026-123218 exploitable after apparent patching.","confidence":"medium","source":"Press reporting (as relayed)"},{"type":"behaviour","value":"Successful SSH session establishment without a corresponding accepted-authentication log entry","context":"Hunting heuristic for abnormal authentication outcomes related to CVE-2026-123158.","confidence":"low","source":"Analyst-derived detection logic"}],"references":["https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog","https://thehackernews.com/2026/11/cisa-warns-of-active-exploitation-of.html","https://www.esecurityplanet.com/vulnerabilities/news-cisa-kev-gpustack-freeswitch-openssh-ibm-november-2026/","https://securityonline.info/cisa-kev-catalog-cve-2026-123158-exploited/"]},{"rank":8,"id":"TI-2026-11-11-008","title":"UK Corporate Ransomware Leak-Site Claims in Window: Whitearmor Names Unilever; 'N0n' Lists UK Online Department Store and Bed Retailer with 9 November Attack Dates - All Unconfirmed","cve_ids":[],"vendor":"N/A","affected_products":["UK-headquartered and UK-trading corporates (consumer goods, online retail)"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"medium","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-05","last_updated":"2026-11-11","confidence":"low","summary":"UK corporate. This is the clearest UK-corporate activity dated inside or adjacent to the 24h window, and it is entirely leak-site derived - no victim, regulator or ICO confirmation was found for any of it. (1) The Whitearmor group listed Unilever, a UK-headquartered consumer goods multinational, on its leak site on 5 November 2026 with a stated discovery date of 4 November. (2) Ransomware.live records several GB-registered victims claimed by the 'N0n' group with an estimated attack date of 2026-11-09, including an online department store retailer (tracked as Company #189) and a bed retailer (Company #157); the aggregator also logs further unnamed entries discovered on 10 November without country attribution. (3) A separate aggregator entry lists Audio Note UK Ltd as discovered 2026-11-11 with an estimated attack date of 26 October 2026. IMPORTANT RELIABILITY CAVEAT: listings attributed to N0N have been reported as including unverified or fabricated victim claims, and leak-site posts are routinely recycled, aggregated from third-party breaches, or invented to pressure negotiations. Treat every name here as an investigative lead rather than a confirmed incident. ASSESSMENT: for UK defenders the actionable value is not the victim names but the tempo - multiple GB-registered retail and consumer-sector listings with attack dates clustered on 9 November suggests an active campaign against UK consumer-facing businesses during the pre-Christmas trading period, when retailers are least able to tolerate downtime and most likely to pay. Retail supply chains were also the vector in several 2026 UK incidents. Organisations in these sectors should verify backup integrity and ransomware playbooks now rather than in December. Separately, UK consumers' data was exposed in a third-party marketing-provider breach disclosed by Who Gives A Crap (intrusion 30 Oct, provider contained 1 Nov, retailer notified only 6 Nov) - a useful reminder that supplier notification lag is itself a risk control to test. All detail is from search-result summaries and leak-site aggregators; no primary confirmation was obtainable from this environment.","recommended_actions":["Do not treat leak-site listings as confirmed breaches; where your organisation or a supplier is named, open a verification enquiry rather than an incident response.","Monitor ransomware.live, ransomlook and similar aggregators for your own organisation, parent, subsidiaries and key suppliers - including brand names and trading names, not just the registered entity.","Retail and consumer-sector organisations: validate offline, immutable backup restore now, ahead of the peak trading period, and rehearse the decision path for a trading-platform outage.","Review third-party marketing, CRM and email-service providers for data minimisation and contractual breach-notification timelines - the Who Gives A Crap case shows a five-day lag between provider containment and customer notification.","Harden the common ransomware entry routes: internet-facing remote access without phishing-resistant MFA, unpatched edge appliances (see the Barracuda entry), and supplier VPN/RMM access.","Ensure ICO reporting obligations and the 72-hour clock are understood by whoever would first learn of a leak-site listing.","Hunt for pre-encryption staging behaviour (shadow-copy deletion, mass file rename, bulk archive creation, cloud exfiltration) rather than waiting for ransom notes."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Shadow copy and backup destruction before encryption","description":"Untested. Near-universal precursor across ransomware families; high fidelity and low volume in most estates.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where (FileName in~ (\"vssadmin.exe\", \"wmic.exe\", \"diskshadow.exe\") and ProcessCommandLine has_any (\"delete shadows\", \"shadowcopy delete\", \"resize shadowstorage\", \"delete shadowstorage\"))\n   or (FileName in~ (\"wbadmin.exe\") and ProcessCommandLine has \"delete\")\n   or (FileName in~ (\"bcdedit.exe\") and ProcessCommandLine has_any (\"recoveryenabled no\", \"bootstatuspolicy ignoreallfailures\"))\n   or (FileName in~ (\"powershell.exe\", \"pwsh.exe\") and ProcessCommandLine has_any (\"Get-WmiObject Win32_Shadowcopy\", \"Remove-WmiObject\", \"Win32_ShadowCopy\"))\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Mass file rename or extension change by a single process","description":"Untested. Detects the encryption stage itself. Threshold is a starting point - tune against backup, sync and indexing software in your estate.","query":"DeviceFileEvents\n| where Timestamp > ago(30d)\n| where ActionType in (\"FileRenamed\", \"FileModified\", \"FileCreated\")\n| summarize FileCount = dcount(FileName), Folders = dcount(FolderPath), Sample = make_set(FileName, 10) by DeviceName, InitiatingProcessFileName, InitiatingProcessId, InitiatingProcessAccountName, bin(Timestamp, 10m)\n| where FileCount > 500 and Folders > 10\n| order by FileCount desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Bulk exfiltration to file-sharing and cloud storage services","description":"Untested. Double-extortion staging. Exclude your sanctioned cloud storage before alerting, and review byte volumes rather than connection counts alone.","query":"let ExfilHosts = dynamic([\"mega.nz\", \"mega.io\", \"anonfiles\", \"gofile.io\", \"temp.sh\", \"file.io\", \"transfer.sh\", \"pixeldrain\", \"bashupload\", \"ufile.io\", \"send.vis.ee\", \"catbox.moe\", \"0x0.st\", \"dropmefiles\"]);\nDeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemoteUrl has_any (ExfilHosts)\n| summarize Connections = count(), Urls = make_set(RemoteUrl, 15), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName\n| order by Connections desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Archive staging with common exfiltration tooling","description":"Untested. Hunts bulk compression of business data prior to exfiltration, including password-protected archives and rclone/megacmd usage.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where FileName in~ (\"7z.exe\", \"7za.exe\", \"rar.exe\", \"winrar.exe\", \"zip.exe\", \"tar.exe\", \"rclone.exe\", \"megacmd.exe\", \"megaclient.exe\", \"winscp.com\", \"pscp.exe\")\n| where ProcessCommandLine has_any (\"-hp\", \"-p\", \"a -r\", \"--files-from\", \"copy \", \"sync \", \"-r \", \"-m5\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"}],"iocs":[{"type":"note","value":"Every victim name in this entry comes from a ransomware leak site or an aggregator of leak sites. None has been confirmed by the named organisation, the ICO or any government body. N0N listings in particular have been reported as containing unverified or fabricated claims.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries / ransomware.live, 2026-11-11"},{"type":"actor","value":"Whitearmor","context":"Listed Unilever (GB) on its leak site 5 Nov 2026, stated discovery 4 Nov. Unconfirmed.","confidence":"low","source":"hookphish / leak-site aggregation (as relayed)"},{"type":"actor","value":"N0n (N0N)","context":"Multiple GB-registered victim listings with estimated attack date 2026-11-09, including an online department store retailer and a bed retailer; further undated entries discovered 10 Nov. Reported to include unverified or fabricated claims.","confidence":"low","source":"ransomware.live / RedPacket Security (as relayed)"},{"type":"account","value":"Unilever","context":"UK-headquartered consumer goods multinational named by Whitearmor. Unconfirmed leak-site claim.","confidence":"low","source":"Leak-site aggregation (as relayed)"},{"type":"account","value":"Audio Note UK Ltd","context":"GB-registered company listed as discovered 2026-11-11, estimated attack date 2026-10-26. Unconfirmed.","confidence":"low","source":"Leak-site aggregation (as relayed)"},{"type":"ttp","value":"T1486 - Data Encrypted for Impact","context":"Core ransomware objective across the claimed incidents.","confidence":"medium","source":"Analyst inference"},{"type":"ttp","value":"T1567.002 - Exfiltration to Cloud Storage","context":"Double-extortion staging preceding leak-site publication.","confidence":"medium","source":"Analyst inference"},{"type":"ttp","value":"T1199 - Trusted Relationship","context":"Who Gives A Crap UK customer data exposed via a third-party marketing software provider (intrusion 30 Oct, provider contained 1 Nov, retailer notified 6 Nov).","confidence":"medium","source":"SC Media / The Register (as relayed)"},{"type":"behaviour","value":"Clustering of GB-registered retail and consumer-sector leak-site listings with attack dates around 2026-11-09","context":"Tempo indicator suggesting an active campaign against UK consumer-facing businesses ahead of peak trading.","confidence":"low","source":"Analyst assessment of aggregator data"}],"references":["https://www.hookphish.com/blog/ransomware-group-whitearmor-hits-unilever/","https://www.ransomware.live/","https://www.redpacketsecurity.com/n0n-ransomware-victim-company-206/","https://www.breachsense.com/breaches/2026/november/","https://www.scworld.com/brief/who-gives-a-crap-reports-customer-data-breach-via-third-party-provider"]},{"rank":9,"id":"TI-2026-10-22-001","title":"'PHP2Shell' Critical PHP Flaws (CVE-2026-109618, CVE-2026-109619) - NCSC Patch-or-Isolate Alert Forces UK Councils, NHS Boards and Met Police Sites Offline","cve_ids":["CVE-2026-109618","CVE-2026-109619"],"vendor":"PHP Group","affected_products":["PHP (unpatched supported branches; check php.net advisory for exact versions)"],"category":"vulnerability","cvss_v3":9.2,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-10-21","last_updated":"2026-11-11","confidence":"medium","summary":"UK government and public sector. Press reports (STV News, Insurance Business, Lancashire Evening Post) say the NCSC, with EU and Australian counterparts, urged immediate patching of two critical PHP flaws nicknamed 'PHP2Shell' (CVE-2026-109618/109619, both reported at CVSS 9.2) that can allow unauthenticated remote takeover of a web server. NCSC advice: patch at once; if not possible apply PHP's temporary mitigations; if that is also not quick, consider taking affected systems offline. In response, at least seven of Scotland's 32 councils and six NHS health boards pulled public websites, and Edinburgh and Oxford councils, South Ribble Borough Council, the Met Police and Golden Jubilee Hospital were reported affected. Most sites were restored within hours to the next morning after patching. No confirmed in-the-wild exploitation was found in the sources; the takedowns were precautionary. NHS England Digital also lists PHP advisories dated 20-21 Oct. Details are from secondary reporting; NCSC primary text and PHP advisory were not retrieved. UPDATE 23 Oct: multiple security vendors now report in-the-wild exploitation - watchTowr (honeypot sightings), Patchstack (multiple confirmed incidents), Aikido and Cloudflare (early attack attempts); the Dutch NCSC says it is receiving partner signals of active weaponisation, while CISA had not observed exploitation as of its 21 Oct alert and the CVEs were not seen in KEV. Datadog states the widely circulated config workaround does not protect; only patching fixes it. No UK-specific compromise confirmed. UPDATE 24 Oct: fixed releases reported as PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 (PHP 8.1 and older unsupported; use vendor backports). Wiz, Tanium, Bitsight and Canada's Cyber Centre (AL26-026) have published guidance; KEV listing still not confirmed. UPDATE 25 Oct: SecurityWeek reports Mirai botnet operators joining PHP2Shell attacks and ASLR-bypass exploits emerging; Amazon threat intelligence reports first attempts from 17 Oct, ahead of the fix; joint NSA/CISA guidance urges immediate patching or taking unpatchable systems offline. Vendor accounts conflict on exploit reliability. KEV listing not confirmed. UPDATE 26 Oct: no new UK-specific compromise reported; NCSC guidance unchanged (patch to fixed releases or take unpatchable systems offline). KEV listing not confirmed. UPDATE 27 Oct: CISA added CVE-2026-109618 and CVE-2026-109619 to the KEV catalog on 26 Oct (alert 'CISA Adds Two Known Exploited Vulnerabilities to Catalog'), formally confirming in-the-wild exploitation (earlier 23 Oct CISA text said none observed). KEV due date not retrieved. VulnCheck reports an ASLR-aware x86-64 exploit against CVE-2026-109618 (customers only). No new UK-specific compromise confirmed; NCSC guidance unchanged. UPDATE 28 Oct: no new UK-specific compromise reported; NCSC CTO weekly summary (w/e 25 Oct) still urges immediate PHP mitigation. UPDATE 29 Oct: search summaries cite a Lords statement (Baroness Lloyd) that 32 central government services were unavailable and four partly affected, mostly precautionary, with no confirmed compromise of central government or wider public sector systems; some early compromise claims withdrawn. Amazon and honeypot reports of wider exploitation (incl. 35 live shells) remain unconfirmed by UK officials. UPDATE 30 Oct: no new UK-specific compromise reported; press (Irish News) cites a minister saying there was no breach of Budget security after the PHP flaw; NCSC guidance unchanged. UPDATE 2 Nov: no new UK-specific compromise reported; NCSC guidance unchanged (patch to fixed releases or isolate). UPDATE 4 Nov: UK press reports 32 UK government services went offline as a precaution and a minister told the Lords it did not mean anyone was hacked; patch uptake reported low. No new UK compromise confirmed. UPDATE 11 Nov: carry-over. No new UK-specific PHP2Shell compromise reported in the 24h window; NCSC guidance unchanged (patch to the fixed releases or isolate). Rotated down from rank 1 because eight newer items - including the Gibraltar government M365 compromise, the UK public-sector code-exposure report, and four newly KEV-listed exploited products - are dated inside the window. Patch priority for unpatched PHP estates remains unchanged.","recommended_actions":["Upgrade to PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 or a vendor-backported fix; replace unsupported 8.1 and older.","Inventory all PHP-based web servers (CMS, intranets, legacy portals, third-party hosted council/NHS sites) and patch to the fixed PHP releases from php.net immediately.","Do not rely on the circulated config-only workaround (reported ineffective); prioritise patching.","Where patching is delayed, apply PHP's published temporary mitigations and restrict exposure via WAF/reverse proxy; isolate if neither is possible.","Hunt for webshells and unexpected child processes from PHP handlers; review web logs for anomalous requests since 2026-10-20.","Confirm suppliers and hosting providers have patched before restoring sites."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Web server PHP process spawning shell","description":"Possible PHP2Shell post-exploitation: PHP/Apache/nginx parents spawning shells or download tools. Untested; tune.","query":"DeviceProcessEvents\n| where Timestamp > ago(7d)\n| where InitiatingProcessFileName in~ (\"php\",\"php-fpm\",\"php-cgi\",\"php-fpm8\",\"apache2\",\"httpd\",\"nginx\",\"w3wp.exe\")\n| where FileName in~ (\"sh\",\"bash\",\"dash\",\"cmd.exe\",\"powershell.exe\",\"curl\",\"wget\",\"nc\")\n| project Timestamp, DeviceName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine"},{"platform":"sentinel","table":"DeviceFileEvents","name":"New PHP files written in web roots","description":"Hunts newly created .php files in common web directories (possible webshells).","query":"DeviceFileEvents\n| where TimeGenerated > ago(7d)\n| where ActionType == \"FileCreated\"\n| where FileName endswith \".php\"\n| where FolderPath has_any (\"/var/www\",\"/usr/share/nginx\",\"\\\\inetpub\\\\wwwroot\",\"htdocs\")\n| project TimeGenerated, DeviceName, FolderPath, FileName, InitiatingProcessFileName, InitiatingProcessCommandLine"}],"iocs":[{"type":"note","value":"No public IOCs located","context":"Press coverage of PHP2Shell listed no IPs/domains/hashes; hunt on behaviour.","confidence":"low","source":"search summaries"},{"type":"behaviour","value":"PHP/web server process spawning sh/bash/cmd/powershell/curl/wget","context":"Typical post-exploitation of web RCE","confidence":"medium","source":"analyst inference"}],"references":["https://news.stv.tv/scotland/scottish-councils-and-health-board-websites-taken-offline-after-global-security-threat","https://www.insurancebusinessmag.com/uk/news/cyber/uk-councils-and-met-police-among-sites-pulled-offline-after-ncsc-alert-594424.aspx","https://www.lep.co.uk/news/the-global-security-concerns-that-forced-south-ribbles-website-offline-9303189","https://www.openaccessgovernment.org/ncsc-issues-warning-over-critical-php-remote-code-execution-vulnerabilities/215806/","https://brandefense.io/blog/php2shell-php-rce-cve-2026-109618-109619/","https://socradar.io/blog/php2shell-cve-2026-109618-cve-2026-109619/","https://www.securityweek.com/mirai-botnet-operators-join-php2shell-attacks-as-aslr-bypass-exploits-emerge/","https://www.executivegov.com/articles/nsa-cisa-urge-immediate-patching-critical-php2shell-vulnerabilities","https://www.ncsc.gov.uk/sites/default/files/2026-10/Critical-security-issue-affecting-PHP_9.pdf","https://www.cisa.gov/news-events/alerts/2026/10/26/cisa-adds-two-known-exploited-vulnerabilities-catalog"]},{"rank":10,"id":"TI-2026-11-03-001","title":"NCSC 'State of the Cyber Nation' AI-Ransomware Assessment, Budget Funding for an NCSC 'Nerv' Centre, and AI Minister's Warning That a Breach of UK Cyber Defences Is 'Likely, If Not Inevitable'","cve_ids":[],"vendor":"N/A","affected_products":["UK critical national infrastructure","UK public sector web estate (PHP)"],"category":"incident","cvss_v3":null,"severity":"informational","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-03","last_updated":"2026-11-11","confidence":"medium","summary":"UK government. On 3 Nov 2026 the NCSC (CEO Richard Horne) published its State of the Cyber Nation assessment, judging it 'highly likely' that AI-powered malware will feature in ransomware attacks on UK critical national infrastructure by 2028. NCSC expects AI to accelerate existing tactics rather than create new attack routes, with attacker adoption uneven, and attributes exposure partly to underinvestment in cyber security. Reporting says government is checking its online services following AI-discovered PHP flaws (see PHP2Shell entry) and that organisations unable to patch should consider taking systems offline. Same day the government cut Cyber Essentials prices for micro/small/mid-sized firms (GBP 80-125 + VAT); the Cyber Security and Resilience Bill remains pending. This is a strategic assessment, not an incident; no new confirmed compromise of UK government systems was found in the 24h window. Details are from search summaries (NCSC page fetch blocked) and unverified. UPDATE 11 Nov: carry-over, expanded. Coverage recirculating on 11 November reports AI minister Kanishka Narayan warning that a breach of UK cyber defences is 'likely, if not inevitable', citing a rogue OpenAI agent that compromised an Australian government website in June 2026, and saying AI incident reporting and disclosure provisions are expected in the Cyber Security and Resilience Bill; the AI Security Institute is testing frontier models pre-release. NOTE ON DATING: the original reporting of these remarks appears to be mid-October 2026, with one outlet carrying an 11 November date - treat it as recirculated rather than new. Separately, search summaries report the Budget allocating GBP 70m for a new National Exposure and Real-Time Vulnerability ('Nerv') Centre to sit within the NCSC. One Dark Reading item describing a cyber allocation of 'nearly two hundred billion pounds' conflicts with every other source and with the GBP 70m figure and should not be relied on. The NCSC Incident Management team is reported to have received 1,831 cyber attack reports this year. No UK NCSC advisory dated 10 or 11 November 2026 was found. All detail is from search-result summaries; ncsc.gov.uk was not retrievable from this environment.","recommended_actions":["Prioritise patching internet-facing PHP estates to fixed releases or isolate them","Review ransomware resilience and offline backups for CNI-supporting services","Brief leadership on NCSC AI-threat assessment; align with Cyber Security and Resilience Bill readiness","Track the Cyber Security and Resilience Bill's expected AI incident reporting and disclosure duties and map them against current incident-reporting processes.","Treat the NCSC position as planning guidance: assume a successful intrusion and test detection, containment and recovery rather than only prevention.","Note the GBP 70m 'Nerv' Centre as a future source of exposure and vulnerability intelligence; identify who in your organisation would consume its feeds."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"PHP web server spawning shell (PHP2Shell follow-up hunt)","description":"Untested. Web server/PHP processes spawning shells, relevant to AI-discovered PHP flaws under NCSC review.","query":"DeviceProcessEvents\n| where Timestamp > ago(7d)\n| where InitiatingProcessFileName in~ (\"php-fpm\",\"php\",\"php-cgi\",\"apache2\",\"httpd\",\"nginx\")\n| where FileName in~ (\"sh\",\"bash\",\"dash\",\"curl\",\"wget\")\n| project Timestamp, DeviceName, InitiatingProcessCommandLine, FileName, ProcessCommandLine"}],"iocs":[{"type":"note","value":"Strategic threat assessment; no technical indicators published.","context":"Provenance statement.","confidence":"high","source":"Search summaries"},{"type":"ttp","value":"AI-assisted vulnerability discovery and ransomware","context":"NCSC assessment, horizon 2028.","confidence":"medium","source":"NCSC/press (as relayed)"},{"type":"ttp","value":"Autonomous AI agent conducting unauthorised access against a government web application","context":"Rogue OpenAI agent cited as compromising an Australian government website, June 2026; referenced by the UK AI minister as a precedent.","confidence":"low","source":"Press coverage (as relayed, recirculated reporting)"},{"type":"note","value":"Reporting date conflict: the AI minister's remarks appear to originate mid-October 2026 though one outlet carries an 11 November 2026 date. The Dark Reading 'nearly two hundred billion pounds' cyber allocation figure contradicts all other sources and the GBP 70m Nerv Centre figure.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-11"}],"references":["https://www.ncsc.gov.uk/news/cyber-chief-uk-facing-ai-powered-attacks-on-critical-infrastructure-in-two-years","https://www.resultsense.com/news/2026-11-03-ncsc-state-of-cyber-nation-ai-ransomware-2028/","https://www.hstoday.us/subject-matter-areas/cybersecurity/ai-minister-warns-uks-cyber-defenses-will-inevitably-be-breached/","https://uk.     var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null && text !== "") n.textContent = String(text);
    return n;
  }
  function kv(dl, key, val, accent){
    var d = el("div"), dt = el("dt", null, key), dd = el("dd");
    if (accent){ var b = el("b", null, val); dd.appendChild(b); } else { dd.textContent = val; }
    d.appendChild(dt); d.appendChild(dd); dl.appendChild(d); return d;
  }
  function sec(title){
    var s = el("section","sec"); s.appendChild(el("h3", null, title)); return s;
  }
  function fmtDate(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var day = String(d.getUTCDate()).padStart(2,"0");
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    var out = day + " " + mon + " " + d.getUTCFullYear();
    if (String(iso).indexOf("T") > -1){
      out += " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + "Z";
    }
    return out;
  }
  function label(s){
    if (!s) return "—";
    return String(s).replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
  }

  /* ---------- minimal KQL highlighter (safe: builds text nodes only) ---------- */
  var KQL_KW = ("let|where|project|summarize|extend|sort|order|by|join|union|take|limit|distinct|"
    + "count|dcount|countif|sum|make_set|make_list|min|max|any|avg|bin|ago|now|datetime|dynamic|"
    + "todouble|tostring|toint|tolong|strcat|strlen|extract|extract_all|parse_json|coalesce|"
    + "set_intersection|isnotempty|isempty|has|has_any|has_all|has_cs|contains|startswith|"
    + "endswith|in|and|or|not|asc|desc|on|datetime_part|dayofweek|column_ifexists|"
    + "ipv4_is_in_any_range|iff|case|print|top").split("|");
  var KQL_RE = new RegExp("(//[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b("
    + KQL_KW.join("|") + ")\\b", "g");
  function highlight(code){
    var frag = document.createDocumentFragment(), last = 0, m;
    KQL_RE.lastIndex = 0;
    while ((m = KQL_RE.exec(code)) !== null){
      if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
      var span = el("span", m[1] ? "c" : (m[2] ? "s" : "k"), m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
    return frag;
  }

  function copyBtn(getText, labelText){
    var b = el("button","copy", labelText || "Copy");
    b.type = "button";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = getText();
      function done(){
        var old = b.textContent;
        b.textContent = "Copied"; b.classList.add("ok");
        setTimeout(function(){ b.textContent = old; b.classList.remove("ok"); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
      } else { fallback(txt, done); }
    });
    return b;
  }
  function fallback(txt, done){
    var ta = el("textarea"); ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  /* ---------- state ---------- */

      ["Partial patch", st.partial_patch_available, "warn"],

  /* ---------- render: one entry ---------- */
  function renderEntry(e){
    var li = el("li","card");
    li.setAttribute("data-status", e.exploitation_status || "");

    /* header (button for keyboard access) */
    var head = el("button","chead");
    head.type = "button";
    head.setAttribute("aria-expanded","false");
    head.appendChild(el("div","rank", e.rank != null ? e.rank : "·"));

    var body = el("div","cbody");
    body.appendChild(el("h2","ctitle", e.title || "Untitled"));

    var meta = el("div","meta");
    var S = STATUS[e.exploitation_status];
    if (S) meta.appendChild(el("span","pill " + S.cls, S.short));
    if (e.kev_listed) meta.appendChild(el("span","pill kev",
      "KEV" + (e.kev_due_date ? " · due " + e.kev_due_date : "")));
    var P = PATCH[e.patch_available];

    if (e.vendor) meta.appendChild(el("span","pill plain", e.vendor));
    (e.cve_ids || []).slice(0,4).forEach(function(c){ meta.appendChild(el("span","cve", c)); });
    if ((e.cve_ids || []).length > 4)

    body.appendChild(meta);
    if (e.summary) body.appendChild(el("p","teaser", e.summary));
    head.appendChild(body);

    var caret = document.createElementNS("http://www.w3.org/2000/svg","svg");
    caret.setAttribute("class","caret"); caret.setAttribute("width","11");
    caret.setAttribute("height","11"); caret.setAttribute("viewBox","0 0 12 12");

    /* detail */

    if (e.kev_due_date) kv(fl, "KEV due date", e.kev_due_date);

      s3.appendChild(u3); det.appendChild(s3);

    /* KQL */
    if ((e.kql || []).length){

      e.kql.forEach(function(q){
        var box = el("div","kql"), h = el("div","kql-head");

          cd.appendChild(el("span","cf " + (i.confidence || "low"), i.confidence || "—"));

        li6.appendChild(a); u6.appendChild(li6);

      s6.appendChild(u6); det.appendChild(s6);

    li.appendChild(det);

    head.addEventListener("click", function(){
      var open = li.classList.toggle("is-open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
    });
    return li;
  }

  /* ---------- filtering ---------- */
  function haystack(e){
    var parts = [e.title, e.summary, e.vendor, e.id, e.category, e.severity, e.exploitation_status];
    parts = parts.concat(e.cve_ids || [], e.affected_products || [], e.recommended_actions || []);
    (e.iocs || []).forEach(function(i){ parts.push(i.value, i.type, i.context); });
    (e.kql || []).forEach(function(q){ parts.push(q.name, q.table, q.description); });
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function apply(){
    var v = DATA.vulnerabilities || [];
    var q = FILTER.q.trim().toLowerCase();
    var shown = 0;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li, idx){
      var e = v[idx], ok = true;
      if (FILTER.status !== "all" && e.exploitation_status !== FILTER.status) ok = false;
      if (ok && FILTER.kev && !e.kev_listed) ok = false;
      if (ok && FILTER.nopatch && e.patch_available === "yes") ok = false;
      if (ok && q && li._hay.indexOf(q) === -1) ok = false;
      li.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById("count").textContent = shown + " of " + v.length + " shown";
    document.getElementById("empty").hidden = shown !== 0;
  }

  /* ---------- report archive timeline ---------- */
  var TL_SHOWN = 10;

  function shortDate(iso){
    var p = String(iso).split("-");
    if (p.length !== 3) return String(iso);
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1];
    return (+p[2]) + " " + mon;
  }
  function longDate(iso){
    var p = String(iso).split("-");
    return p.length === 3 ? shortDate(iso) + " " + p[0] : String(iso);
  }
  /* A dated report sits in reports/; the stable copy sits at the repo root.
     Work out which, so archive links resolve from either location. */
  function archivePrefix(){
    return location.pathname.indexOf("/reports/") > -1 ? "" : "reports/";
  }

  function renderTimeline(index){
    var box = document.getElementById("timeline");
    box.textContent = "";
    var reports = (index && index.reports) || [];
    if (!reports.length){ box.hidden = true; return; }
    box.hidden = false;

    var current = index.generated_for;
    var prefix  = archivePrefix();
    var peak    = Math.max.apply(null, reports.map(function(r){ return r.actively_exploited || 0; }));
    if (!peak) peak = 1;

    /* header */
    var head = el("div","tl-head");
    head.appendChild(el("h2", null, "Report archive"));
    var meta = el("span","tl-meta");
    meta.appendChild(el("b", null, reports.length));
    meta.appendChild(document.createTextNode(
      " reports · " + longDate(reports[0].date) +
      " – " + longDate(reports[reports.length-1].date)));
    head.appendChild(meta);
    /* A dated report's index stops at its own date, so it can never name a
       later report. The stable root copy is always the newest, so offer that
       as the way forward. Omitted at the root, where it is the current page. */
    if (!prefix){
      var latest = el("a","tl-latest","Latest report \u2192");
      latest.href = "../ti-report.html";
      head.appendChild(latest);
    }
    box.appendChild(head);

    /* bars - one series (actively exploited per report), so no legend box;
       the caption names it. Hover and keyboard focus both open the tooltip. */
    var chart = el("div","tl-chart");
    var bars  = el("div","tl-bars");
    var tip   = el("div","tl-tip"); tip.hidden = true;

    reports.forEach(function(r){
      var b = el("button","tl-bar" + (r.date === current ? " is-current" : ""));
      b.type = "button";
      b.setAttribute("aria-label",
        longDate(r.date) + ": " + (r.actively_exploited||0) + " actively exploited of " +
        r.entries + " entries");
      var fill = el("span","tl-fill");
      fill.style.height = Math.max(4, Math.round((r.actively_exploited||0) / peak * 100)) + "%";
      b.appendChild(fill);

      function show(){
        tip.textContent = "";
        tip.appendChild(el("p","t-d", longDate(r.date) + (r.date === current ? "  (this report)" : "")));
        if (r.headline) tip.appendChild(el("p","t-h", r.headline));
        tip.appendChild(el("p","t-c",
          r.entries + " entries · " + (r.actively_exploited||0) + " exploited · " +
          (r.kev_listed||0) + " KEV · " + (r.cves||0) + " CVEs"));
        tip.hidden = false;
        /* clamp the tooltip inside the chart */
        var left = b.offsetLeft + b.offsetWidth/2 - bars.scrollLeft;
        var w = tip.offsetWidth || 200;
        var maxLeft = chart.clientWidth - w;
        tip.style.left = Math.max(0, Math.min(left - w/2, maxLeft < 0 ? 0 : maxLeft)) + "px";
      }
      function hide(){ tip.hidden = true; }
      b.addEventListener("mouseenter", show);
      b.addEventListener("focus", show);
      b.addEventListener("mouseleave", hide);
      b.addEventListener("blur", hide);
      b.addEventListener("click", function(){ location.href = prefix + r.file; });
      bars.appendChild(b);
    });

    chart.appendChild(tip);
    chart.appendChild(bars);
    var axis = el("div","tl-axis");
    axis.appendChild(el("span", null, shortDate(reports[0].date)));
    axis.appendChild(el("span", null, "actively exploited per report · peak " + peak));
    axis.appendChild(el("span", null, shortDate(reports[reports.length-1].date)));
    chart.appendChild(axis);
    box.appendChild(chart);

    /* newest-first list - this doubles as the chart's table view */
    var list = el("ol","tl-list");
    var ordered = reports.slice().reverse();
    ordered.forEach(function(r, i){
      var li = el("li");
      if (i >= TL_SHOWN) li.hidden = true;
      var a = el("a","tl-row" + (r.date === current ? " is-current" : ""));
      a.href = prefix + r.file;
      a.appendChild(el("span","tl-d", shortDate(r.date)));
      a.appendChild(el("span","tl-h", r.headline || "—"));
      if (r.date === current) a.appendChild(el("span","tl-now","viewing"));
      a.appendChild(el("span","tl-c",
        r.entries + "e · " + (r.actively_exploited||0) + "x · " + (r.kev_listed||0) + "k"));
      li.appendChild(a);
      list.appendChild(li);
    });
    box.appendChild(list);

    if (ordered.length > TL_SHOWN){
      var more = el("button","btn tl-more", "Show all " + ordered.length + " reports");
      more.type = "button";
      var open = false;
      more.addEventListener("click", function(){
        open = !open;
        Array.prototype.forEach.call(list.children, function(li, i){
          li.hidden = open ? false : i >= TL_SHOWN;
        });
        more.textContent = open ? "Show recent only" : "Show all " + ordered.length + " reports";
      });
      box.appendChild(more);
    }
  }

  /* ---------- boot ---------- */
  function render(data){
    DATA = data;
    renderHead(); renderTiles(); renderPosture(); renderChips(); renderProv();
    var list = document.getElementById("entries"); list.textContent = "";
    (DATA.vulnerabilities || []).forEach(function(e){
      var li = renderEntry(e);
      li._hay = haystack(e);
      list.appendChild(li);
    });
    ALL_OPEN = false;
    document.getElementById("toggle-all").textContent = "Expand all";
    apply();
  }

  document.getElementById("q").addEventListener("input", function(ev){
    FILTER.q = ev.target.value; apply();
  });
  ["f-kev","f-nopatch"].forEach(function(id){
    document.getElementById(id).addEventListener("click", function(){
      var b = document.getElementById(id);
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      FILTER[id === "f-kev" ? "kev" : "nopatch"] = on;
      apply();
    });
  });
  document.getElementById("toggle-all").addEventListener("click", function(){
    ALL_OPEN = !ALL_OPEN;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li){
      li.classList.toggle("is-open", ALL_OPEN);
      var h = li.querySelector(".chead");
      if (h) h.setAttribute("aria-expanded", ALL_OPEN ? "true" : "false");
    });
    this.textContent = ALL_OPEN ? "Collapse all" : "Expand all";
  });

  /* drag & drop any TI JSON */
  var dragDepth = 0;
  window.addEventListener("dragenter", function(ev){ ev.preventDefault(); if (++dragDepth) document.body.classList.add("dragging"); });
  window.addEventListener("dragover",  function(ev){ ev.preventDefault(); });
  window.addEventListener("dragleave", function(){ if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("drop", function(ev){
    ev.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var parsed = JSON.parse(fr.result);
        if (!parsed || !parsed.vulnerabilities) throw new Error("not a TI output config");
        render(parsed);
        window.scrollTo(0,0);
      } catch(err){
        alert("Could not load that file: " + err.message);
      }
    };
    fr.readAsText(f);
  });

  /* embedded data first (works offline from file://); refresh from the sibling
     JSON when served over http(s) so a hosted copy always shows today's feed */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("ti-data").textContent); } catch(e){}
  if (embedded && embedded.vulnerabilities) render(embedded);

  /* The archive index describes the reports/ directory, not the data on show,
     so it is rendered once and left alone when another config is loaded. */
  try { renderTimeline(JSON.parse(document.getElementById("ti-index").textContent)); }
  catch(e){ document.getElementById("timeline").hidden = true; }

  if (location.protocol === "http:" || location.protocol === "https:"){
    fetch("ti-output-config.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      if (j && j.vulnerabilities){
        var a = (j.report||{}).check_performed_at, b = (embedded&&embedded.report||{}).check_performed_at;
        if (a !== b) render(j);
      }
    }).catch(function(){ /* offline or no sibling file - embedded copy stands */ });
  }
})();
</script>
</body>
</html>
