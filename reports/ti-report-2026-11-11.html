<!doctype html>
<html lang="en" data-palette="#FF5A1F,#FF8C1A,#9A958C">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat Intelligence Brief</title>
<meta name="description" content="Daily threat intelligence brief: ranked vulnerabilities with analyst summaries, KQL hunting queries and IOCs.">
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --raised:#1C1C1A;
    --border:#2E2E2B;
    --border-strong:#403F3A;
    --ink:#F4F0E6;
    --ink-dim:#C9C4B8;
    --muted:#9A958C;
    --accent:#FF6A1A;
    --accent-hot:#FF5A1F;
    --accent-soft:rgba(255,106,26,.12);
    --accent-line:rgba(255,106,26,.32);
    --bar:rgba(255,106,26,.5);
    --radius:4px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- masthead ---------- */
  header.mast{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#121211 0%,var(--bg) 100%)}
  .mast-in{max-width:var(--maxw);margin:0 auto;padding:28px 16px 24px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{width:30px;height:30px;flex:none}
  .brand-txt h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .brand-txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .stamp{display:flex;flex-wrap:wrap;gap:22px}
  .stamp div{min-width:0}
  .stamp dt{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .stamp dd{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap}
  .stamp dd b{color:var(--accent);font-weight:600}

  /* ---------- priority banner ---------- */
  .alert{margin:22px 0 0;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-left:3px solid var(--accent-hot);border-radius:var(--radius);padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start}
  .alert svg{flex:none;margin-top:2px}
  .alert .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
    font-weight:650;margin:0 0 3px}
  .alert p{margin:0;font-size:14px;color:var(--ink)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:var(--radius);margin:22px 0 0;overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .tile{background:var(--surface);padding:14px 16px 13px}
  .tile .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;display:block}
  .tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
  .tile.hot .n{color:var(--accent-hot)}
  .tile.warn .n{color:var(--accent)}

  /* ---------- posture bar ---------- */
  .posture{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 14px}
  .posture h2{margin:0 0 11px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .pbar{display:flex;gap:2px;height:12px;border-radius:2px;overflow:hidden;background:var(--bg)}
  .pseg{min-width:3px}
  .pseg.s-exploited{background:var(--accent-hot)}
  .pseg.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .pseg.s-none{background:var(--muted)}
  .plegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px}
  .plegend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-dim)}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none}
  .swatch.s-exploited{background:var(--accent-hot)}
  .swatch.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .swatch.s-none{background:var(--muted)}
  .plegend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 0;
    padding-bottom:18px;border-bottom:1px solid var(--border)}
  .search{position:relative;flex:1 1 230px;min-width:0}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:var(--radius);padding:9px 11px 9px 34px;font-size:14px;font-family:var(--sans)}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);
    border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
    transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
  .chip:hover{border-color:var(--border-strong);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A;font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{background:transparent;border:1px solid var(--border);color:var(--ink-dim);border-radius:var(--radius);
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

  /* ---------- entry cards ---------- */
  .entries{margin:0;padding:0;list-style:none}
  .card{border-bottom:1px solid var(--border)}
  .card.is-open{background:var(--surface)}
  .chead{display:flex;gap:16px;padding:20px 4px;cursor:pointer;align-items:flex-start;
    width:100%;background:none;border:0;text-align:left;font-family:inherit;color:inherit}
  .chead:hover .ctitle{color:var(--accent)}
  .chead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{flex:none;width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;
    font-family:var(--mono);font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
    background:var(--raised);border:1px solid var(--border);color:var(--muted)}
  .card[data-status="exploited_in_the_wild"] .rank{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .cbody{flex:1;min-width:0}
  .ctitle{margin:0;font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;
    transition:color .12s}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
  .teaser{margin:10px 0 0;font-size:14px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.is-open .teaser{display:none}
  .caret{flex:none;color:var(--muted);transition:transform .15s;margin-top:7px}
  .card.is-open .caret{transform:rotate(90deg);color:var(--accent)}

  /* pills: status differentiated by WEIGHT + always a text label, never hue alone */
  .pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
    padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;
    align-items:center;gap:5px;line-height:1.5}
  .pill.st-exploited{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.st-attempts{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.st-none{background:transparent;border-color:var(--border-strong);color:var(--muted)}
  .pill.kev{background:transparent;border-color:var(--accent-line);color:var(--accent)}
  .pill.nopatch{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.partial{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.plain{background:transparent;border-color:var(--border);color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:500;
    white-space:normal;max-width:100%;overflow-wrap:anywhere}
  .cve{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);background:var(--raised);
    border:1px solid var(--border);border-radius:3px;padding:2px 7px;white-space:nowrap}
  .cve.more{color:var(--muted);background:transparent}

  /* ---------- detail ---------- */
  .detail{display:none;padding:0 4px 30px 54px}
  .card.is-open .detail{display:block}
  .sec{margin-top:26px}
  .sec:first-child{margin-top:6px}
  .sec > h3{margin:0 0 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:650;display:flex;align-items:center;gap:9px}
  .sec > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .prose{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.72;max-width:76ch}
  .facts{display:flex;flex-wrap:wrap;border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden}
  .facts div{flex:1 1 168px;background:var(--bg);padding:10px 13px;
    border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .card.is-open .facts div{background:var(--raised)}
  .facts dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .facts dd{margin:0;font-size:13px;font-family:var(--mono);color:var(--ink-dim)}
  ul.list{margin:0;padding-left:0;list-style:none}
  ul.list li{position:relative;padding-left:20px;margin-bottom:8px;font-size:14px;color:var(--ink-dim);max-width:78ch}
  ul.list li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;
    background:var(--accent);border-radius:1px}
  ul.list.num{counter-reset:a}
  ul.list.num li{counter-increment:a;padding-left:26px}
  ul.list.num li::before{content:counter(a);background:none;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);top:0;left:2px;width:auto;height:auto;font-weight:600}

  /* KQL */
  .kql{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;background:var(--bg);overflow:hidden}
  .kql-head{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
    border-bottom:1px solid var(--border);background:var(--raised);flex-wrap:wrap}
  .kql-head .kn{flex:1;min-width:140px}
  .kql-head h4{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .kql-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}
  .plat{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:3px;padding:2px 7px;
    white-space:nowrap;flex:none}
  .kql pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:var(--ink-dim);tab-size:2}
  .kql pre .k{color:var(--accent)}
  .kql pre .s{color:#C9C4B8}
  .kql pre .c{color:#6E6A63;font-style:italic}
  .copy{flex:none;background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:3px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.ok{border-color:var(--accent-hot);color:var(--accent-hot)}

  /* IOC table */
  .tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:9px 13px;background:var(--raised);color:var(--muted);
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-dim)}
  tbody tr:last-child td{border-bottom:0}
  td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere;min-width:120px}
  td.t{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
  td.ctx{min-width:220px;line-height:1.55}
  td.src{font-size:12px;color:var(--muted);min-width:130px}
  .cf{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;padding:2px 7px;
    border-radius:999px;border:1px solid;white-space:nowrap}
  .cf.high{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .cf.medium{background:transparent;border-color:var(--border-strong);color:var(--ink-dim)}
  .cf.low{background:transparent;border-color:var(--border);color:var(--muted)}
  tr.is-note td{background:rgba(255,106,26,.05)}
  .note-row{font-size:12.5px;color:var(--muted);font-style:italic}
  .refs{margin:0;padding:0;list-style:none}
  .refs li{margin-bottom:7px}
  .refs a{color:var(--accent);text-decoration:none;font-size:13px;font-family:var(--mono);
    overflow-wrap:anywhere;border-bottom:1px solid transparent}
  .refs a:hover{border-bottom-color:var(--accent)}

  /* ---------- provenance ---------- */
  .prov{margin:40px 0 0;border:1px solid var(--border);border-left:3px solid var(--border-strong);
    border-radius:var(--radius);background:var(--surface)}
  .prov > summary{cursor:pointer;padding:15px 18px;font-size:13px;font-weight:600;color:var(--ink);
    list-style:none;display:flex;align-items:center;gap:10px}
  .prov > summary::-webkit-details-marker{display:none}
  .prov > summary:hover{color:var(--accent)}
  .prov > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .prov[open] > summary{border-bottom:1px solid var(--border)}
  .prov-body{padding:18px}
  .prov-body h4{margin:20px 0 9px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .prov-body h4:first-child{margin-top:0}
  .prov-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}
  .prov-body dt{font-weight:650;color:var(--accent);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding-top:3px}
  .prov-body dd{margin:0;color:var(--ink-dim)}

  footer.foot{margin:44px 0 0;border-top:1px solid var(--border);padding:20px 0 50px;
    display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  footer.foot p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .drop-hint{font-size:12px;color:var(--muted)}

  .empty{padding:60px 4px;text-align:center;color:var(--muted);font-size:14px}
  body.dragging::after{content:"Drop a TI JSON file to load it";position:fixed;inset:14px;
    border:2px dashed var(--accent);border-radius:8px;background:rgba(10,10,10,.9);color:var(--accent);
    display:grid;place-items:center;font-size:17px;font-weight:600;z-index:99;pointer-events:none}

  @media (max-width:720px){
    .brand{align-items:flex-start}
    .detail{padding-left:4px}
    .stamp{gap:16px}
    .mast-in{padding-top:22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- report archive timeline ---------- */
  .timeline{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 16px}
  .tl-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;
    justify-content:space-between;margin-bottom:14px}
  .tl-head h2{margin:0;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .tl-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-meta b{color:var(--ink);font-weight:600}
  .tl-latest{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;
    border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .tl-latest:hover{background:var(--accent-soft)}
  .tl-chart{position:relative}
  .tl-bars{display:flex;align-items:flex-end;gap:3px;height:62px;overflow-x:auto;
    overflow-y:hidden;padding-bottom:1px}
  .tl-bar{flex:1 1 0;min-width:5px;height:100%;background:none;border:0;
    padding:0;cursor:pointer;display:flex;align-items:flex-end}
  .tl-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tl-fill{width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--bar);
    transition:background .12s}
  .tl-bar:hover .tl-fill,.tl-bar:focus-visible .tl-fill{background:var(--accent)}
  .tl-bar.is-current .tl-fill{background:var(--accent-hot)}
  .tl-axis{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tl-tip{position:absolute;top:calc(100% + 8px);z-index:5;pointer-events:none;
    background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:9px 11px;min-width:190px;max-width:330px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .tl-tip[hidden]{display:none}
  .tl-tip .t-d{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 5px}
  .tl-tip .t-h{margin:0 0 7px;font-size:12.5px;color:var(--ink);line-height:1.45}
  .tl-tip .t-c{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tl-list{list-style:none;margin:17px 0 0;padding:0;border-top:1px solid var(--border)}
  .tl-list li{margin:0}
  .tl-row{display:flex;gap:14px;align-items:baseline;padding:9px 4px;
    border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
  .tl-row:hover{background:var(--raised)}
  .tl-row:hover .tl-h{color:var(--accent)}
  .tl-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tl-d{flex:none;width:86px;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .tl-h{flex:1;min-width:0;font-size:13.5px;color:var(--ink-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tl-c{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .tl-now{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:1px 7px}
  .tl-more{margin-top:13px}
  @media (max-width:720px){
    .tl-c{display:none}
    .tl-d{width:72px}
    /* Keep the caption - it is what names the series - but give it its own
       line instead of letting it wrap between the two date labels. */
    .tl-axis{flex-wrap:wrap}
    .tl-axis span:nth-child(2){order:3;flex:1 0 100%;text-align:center;margin-top:4px}
  }

  /* ---------- print ---------- */
  @media print{
    :root{--bg:#fff;--surface:#fff;--raised:#f4f2ee;--border:#d5d2cb;--border-strong:#b5b1a8;
          --ink:#111;--ink-dim:#2a2a28;--muted:#5d5a54;--accent:#B83F00;--accent-hot:#B83F00;
          --accent-soft:#faeee6;--accent-line:#e0b79e}
    body{font-size:10.5pt}
    .controls,.caret,.copy,footer.foot,.drop-hint{display:none!important}
    .detail{display:block!important;padding-left:0;page-break-inside:avoid}
    .teaser{display:none!important}
    .card{page-break-inside:avoid;border-bottom:1px solid var(--border)}
    .chead{cursor:default;padding:14px 0}
    .card[data-status="exploited_in_the_wild"] .rank{background:#B83F00;color:#fff}
    .pill.st-exploited,.pill.nopatch{background:#B83F00;color:#fff}
    .kql pre{white-space:pre-wrap;word-break:break-word}
    .tl-row[hidden]{display:flex!important}
    .tl-more,.tl-tip{display:none!important}
    .tl-bars{overflow:visible}

ry-overs and remain secondary-source and unverified.","2026-11-08 run: search-result summaries only; searches surfaced nothing new dated within the window (weekend), so entries are carry-overs and remain secondary-source and unverified.","2026-11-09 run: search-result summaries only (computing.co.uk not reachable from this environment); nothing new dated within the window, so entries are carry-overs and remain secondary-source and unverified.","2026-11-10 run: search-result summaries only; nothing new dated within the window was found, so entries are carry-overs and remain secondary-source and unverified. KEV additions dated 10 Nov could not be confirmed.","2026-11-11 run: search-result summaries only - direct fetches of cisa.gov, gibraltar.gov.gi and securityweek.com failed DNS resolution under this session's network policy, so no primary advisory text was retrieved. KEV CVE lists, CVSS values, patch versions and remediation due dates are relayed from secondary reporting and must be verified against CISA's catalog and vendor advisories. Microsoft November 2026 Patch Tuesday CVE totals conflict between outlets (1,093 vs 1,235). The Outlook fix being delivered via the Office update channel rather than Windows Update is single-sourced. Openwave CVE-2026-111793 fix version conflicts between sources (1.1.22.0 in 2021 vs an October 2026 remediation update). The Chinese-speaking actor and jailbroken-LLM attribution for Cisco BroadWorks is a single uncorroborated vendor claim (Malbear Labs). Gibraltar data exfiltration is neither confirmed nor excluded by the Government; press claims of confirmed theft exceed the official statement. All UK corporate entries at rank 8 are unconfirmed leak-site claims, and N0N listings are reported to include fabricated victims. The AI minister's remarks appear to be mid-October reporting recirculated with an 11 November date."],"confidence_legend":{"high":"Corroborated by the vendor advisory or by multiple independent reputable sources.","medium":"Reported by a single reputable source, or by secondary coverage of a primary source not directly accessible.","low":"Single-sourced and uncorroborated; treat as an investigative lead only."},"exploitation_status_values":["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed","public_poc_available","no_known_exploitation"],"kql_platform_values":["sentinel","defender_xdr"],"ioc_types_present":["account","actor","behaviour","filename","note","port","service_name","ttp"]},"vulnerabilities":[{"rank":1,"id":"TI-2026-11-11-001","title":"HM Government of Gibraltar Microsoft 365 Cloud Environment Compromised - UK NCSC Partner Team Deployed, Incident Declared Contained but Exfiltration Unresolved","cve_ids":[],"vendor":"Microsoft","affected_products":["Microsoft 365 (Exchange Online / Outlook)","Microsoft Teams","SharePoint Online","OneDrive for Business","Entra ID tenant (Gibraltar Government)"],"category":"incident","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-06","last_updated":"2026-11-11","confidence":"medium","summary":"UK government (British Overseas Territory; UK NCSC-coordinated response). HM Government of Gibraltar has confirmed a cyber security incident involving unauthorised access to its cloud environment, specifically the Microsoft 365 estate hosting Outlook, Teams, SharePoint and OneDrive. Per official statements relayed through Gibraltar outlets (gibraltar.gov.gi press release 865/2026, Chronicle, GBC, YGTV), Microsoft alerted the Government to a potential data breach and the Information Technology and Logistics Department (ITLD) began containment; access is reported to have persisted for several weeks before detection. A team of experts from UK NCSC partner organisations travelled to Gibraltar on Monday 2 November to work alongside ITLD on investigation and response, and the UK NCSC has coordinated specialist support. On Friday 6 November the Government suspended some services to permit forensic work and additional hardening. The latest statements (9-10 Nov) say the incident is contained and that ongoing attempts to access the accounts are being blocked, but the forensic investigation has NOT yet established whether information was accessed or extracted without authorisation. Government states the principal databases of residents' records are held separately from the compromised cloud tenant and are believed unaffected. No threat actor has been publicly identified and no attribution has been offered. Press speculation (Olive Press, 9 Nov) of confirmed data theft goes beyond the official line and should be treated as unverified. ASSESSMENT: this is the most materially significant UK-government-adjacent incident in the 24h window. The pattern - weeks of undetected access to a government M365 tenant, detected by the cloud provider rather than the tenant, with service suspension needed for forensics - is directly applicable to UK central and local government tenants. Compare the ConnectWise M365 tenant compromises (Oct 2026) and the Microsoft SharePoint exploitation wave: identity-layer persistence (app registrations, OAuth consent grants, delegated mail permissions, token theft) is the common thread and is the priority hunting ground. All detail is from search-result summaries; gibraltar.gov.gi fetch was blocked by this environment's network policy and the primary press release text was not retrieved.","recommended_actions":["Hunt your own M365/Entra tenant for the same tradecraft: review all enterprise applications and service principals for recently added credentials (secrets/certificates), consent grants to Mail.Read/Mail.ReadWrite/Files.Read.All, and unexpected owners.","Review Exchange Online for new or altered inbox rules, mailbox delegate/FullAccess grants, mail forwarding, and eDiscovery/Compliance Search activity by non-standard accounts.","Audit SharePoint/OneDrive for anonymous sharing links created in the last 90 days and for abnormal file-download volumes per user.","Verify MFA strength on all privileged roles; enforce phishing-resistant methods and revoke all refresh tokens for any account under suspicion.","Confirm Microsoft's own tenant-security notifications are routed to a monitored mailbox - detection here came from the provider, not the tenant.","Ensure Unified Audit Log (OfficeActivity) and MailItemsAccessed events are enabled and retained for at least 180 days; without them exfiltration cannot be proven or excluded.","For UK public bodies with Gibraltar/Overseas Territory data-sharing links, review what Gibraltar-held data could transit the affected tenant and prepare recipient-side phishing warnings."],"kql":[{"platform":"sentinel","table":"AuditLogs","name":"New credential or consent added to an enterprise application","description":"Untested. The primary identity-persistence route in M365 tenant compromises: attacker adds a secret/certificate to an existing service principal, or consents a new app to mail/file scopes.","query":"AuditLogs\n| where TimeGenerated > ago(90d)\n| where OperationName in (\"Add service principal credentials\", \"Update application - Certificates and secrets management\", \"Consent to application\", \"Add app role assignment to service principal\", \"Add delegated permission grant\")\n| extend Actor = tostring(InitiatedBy.user.userPrincipalName)\n| extend AppDisplayName = tostring(TargetResources[0].displayName)\n| extend ModifiedProps = tostring(TargetResources[0].modifiedProperties)\n| where ModifiedProps has_any (\"Mail.Read\", \"Mail.ReadWrite\", \"Mail.Send\", \"Files.Read.All\", \"Sites.Read.All\", \"full_access_as_app\", \"KeyDescription\", \"PasswordCredential\")\n| project TimeGenerated, OperationName, Actor, AppDisplayName, ModifiedProps, Result\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"OfficeActivity","name":"Mailbox delegation, forwarding or inbox rule changes by non-owner","description":"Untested. Hunts the mailbox-persistence stage. ActorIsTarget=false means someone other than the mailbox owner made the change - review those first. Baseline your legitimate delegation administrators and exclude them before use.","query":"OfficeActivity\n| where TimeGenerated > ago(90d)\n| where RecordType in (\"ExchangeAdmin\", \"ExchangeItem\", \"ExchangeItemGroup\")\n| where Operation in (\"Add-MailboxPermission\", \"Add-RecipientPermission\", \"Set-Mailbox\", \"New-InboxRule\", \"Set-InboxRule\", \"UpdateInboxRules\", \"New-TransportRule\", \"Set-TransportRule\")\n| extend Params = tostring(Parameters)\n| where Params has_any (\"FullAccess\", \"ForwardingSmtpAddress\", \"ForwardingAddress\", \"DeliverToMailboxAndForward\", \"RedirectTo\", \"BlindCopyTo\")\n   or Operation in (\"Add-MailboxPermission\", \"Add-RecipientPermission\")\n| extend TargetMailbox = tolower(tostring(OfficeObjectId))\n| extend Actor = tolower(tostring(UserId))\n| extend ActorIsTarget = isnotempty(TargetMailbox) and TargetMailbox has Actor\n| project TimeGenerated, Operation, Actor, TargetMailbox, ActorIsTarget, UserType, ClientIP, Params\n| order by ActorIsTarget asc, TimeGenerated desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"High-volume mailbox item access or file download per principal","description":"Untested. Volumetric exfiltration hunt across Exchange Online and SharePoint/OneDrive. Thresholds are starting points - tune to your tenant baseline before alerting.","query":"let Window = 90d;\nlet MailBurst = CloudAppEvents\n  | where Timestamp > ago(Window)\n  | where ActionType in (\"MailItemsAccessed\", \"Send\", \"SendAs\", \"SendOnBehalf\")\n  | extend Principal = tostring(RawEventData.UserId), ClientIP = tostring(RawEventData.ClientIPAddress)\n  | summarize MailEvents = count(), IPs = dcount(ClientIP), SampleIPs = make_set(ClientIP, 10) by Principal, bin(Timestamp, 1d)\n  | where MailEvents > 1000;\nlet FileBurst = CloudAppEvents\n  | where Timestamp > ago(Window)\n  | where ActionType in (\"FileDownloaded\", \"FileSyncDownloadedFull\", \"FileAccessed\")\n  | extend Principal = tostring(RawEventData.UserId)\n  | summarize FileEvents = count(), Files = dcount(tostring(RawEventData.ObjectId)) by Principal, bin(Timestamp, 1d)\n  | where Files > 500;\nMailBurst\n| join kind=fullouter FileBurst on Principal, Timestamp\n| project Timestamp = coalesce(Timestamp, Timestamp1), Principal = coalesce(Principal, Principal1), MailEvents, IPs, SampleIPs, FileEvents, Files\n| order by Timestamp desc"},{"platform":"sentinel","table":"SigninLogs","name":"Successful sign-in from new ASN with legacy auth or token replay indicators","description":"Untested. Looks for interactive and non-interactive sign-ins from autonomous systems never previously seen for that principal - the detection gap that allowed weeks of undetected access.","query":"let Lookback = 90d;\nlet Baseline = SigninLogs\n  | where TimeGenerated between (ago(Lookback) .. ago(14d))\n  | summarize KnownASNs = make_set(tostring(AutonomousSystemNumber), 200) by UserPrincipalName;\nSigninLogs\n| where TimeGenerated > ago(14d)\n| where ResultType == 0\n| extend ASN = tostring(AutonomousSystemNumber)\n| join kind=leftouter Baseline on UserPrincipalName\n| where isnull(KnownASNs) or ASN !in (KnownASNs)\n| project TimeGenerated, UserPrincipalName, AppDisplayName, ClientAppUsed, IPAddress, ASN, Location, UserAgent, ResourceDisplayName\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"No technical indicators (IPs, domains, hashes) have been published by HM Government of Gibraltar, Microsoft or the UK NCSC for this incident.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-11"},{"type":"ttp","value":"T1078.004 - Valid Accounts: Cloud Accounts","context":"Unauthorised access to a government Microsoft 365 tenant sustained over several weeks.","confidence":"medium","source":"Gibraltar Government statements (as relayed)"},{"type":"ttp","value":"T1114.002 - Email Collection: Remote Email Collection","context":"Outlook/Exchange Online named among the affected services; collection not yet confirmed or excluded.","confidence":"low","source":"Analyst inference from affected-service list"},{"type":"behaviour","value":"Cloud provider (Microsoft) notified the tenant owner of the breach before tenant-side detection","context":"Detection-gap indicator: tenant audit logging and alerting did not surface weeks of unauthorised access.","confidence":"medium","source":"Gibraltar Government statements (as relayed)"},{"type":"behaviour","value":"Continuing blocked authentication attempts against cloud accounts after containment","context":"Government reports ongoing access attempts being blocked - indicates actor retains credential material or is re-probing.","confidence":"medium","source":"Gibraltar Government statements (as relayed)"}],"references":["https://www.gibraltar.gov.gi/press-releases/government-confirms-cyber-security-incident-contained-following-extensive-security-measures-8652026-12551","https://www.chronicle.gi/govt-says-cyber-security-incident-contained-as-investigation-continues/","https://www.gbc.gi/news/there-have-been-attempts-to-hack-the-governments-it-cloud-system-government-confirms","https://www.yourgibraltartv.com/daily/government-says-cyber-security-incident-has-been-contained","https://www.theolivepress.es/spain-news/2026/11/09/gibraltar-data-hack-government/"]},{"rank":2,"id":"TI-2026-11-11-002","title":"100+ Serious Flaws Found Across 349 UK Public-Sector Code Repositories - Live Planning Inspectorate Credentials and a Scottish Government Admin Token Exposed in Public Code","cve_ids":[],"vendor":"N/A (UK public sector software estate)","affected_products":["UK public-sector public code repositories (349 reviewed)","Planning Inspectorate systems","Scottish Government open-data portal"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-10","last_updated":"2026-11-11","confidence":"medium","summary":"UK government. A report published 10 November 2026 and covered by WIRED details an AI-assisted review by UK technologist Chris Nesbitt-Smith of 349 publicly accessible UK public-sector code repositories. Serious problems were found in roughly two-thirds of them - more than 100 serious vulnerabilities in total - including live credentials committed to public code, weak access controls and insecure defaults. The most serious single finding was a working Planning Inspectorate login described in coverage as giving 'god-tier' access to planning data. The Planning Inspectorate states that its own monitoring detected the researcher's activity, that it treated the disclosure as a cyber incident, that the exposed credentials were revoked within 20 minutes, and that it found no evidence of a data breach. A second named finding is a long-lived administrator token embedded in JavaScript served to visitors of a Scottish Government open-data portal - i.e. exposed to every site visitor, not only to those reading the repository. ASSESSMENT: this is a direct, UK-central-government exposure of the most readily weaponised class of initial access - valid credentials in public code - and it is the second-most significant UK-government item in the window. Secret sprawl in public repositories is trivially discoverable at scale (and now cheaply at scale with LLM assistance), requires no exploit, and bypasses perimeter controls entirely. The figures describe one researcher's survey of public repositories, not a census of the UK government estate, so the true exposure is plausibly larger rather than smaller. There is no public evidence that UK government data was stolen via these flaws, and the researcher is reported to have worked only on public code rather than breaching protected networks. Detail is from search-result summaries of WIRED and secondary coverage; the WIRED original and the researcher's report were not retrieved from this environment.","recommended_actions":["Run secret scanning across every public and internal repository your organisation owns, including archived repos, forks, GitHub Gists, CI configuration and container images - and scan full git history, not just HEAD.","Treat any credential that has ever been committed as compromised: rotate it, do not merely delete the commit.","Enable GitHub push protection / secret scanning (or the equivalent in GitLab, Azure DevOps, Bitbucket) in blocking mode on all public repositories.","Audit client-delivered JavaScript for embedded API keys and bearer tokens - the Scottish Government finding was exposed to ordinary site visitors, not just code readers.","Replace long-lived static tokens with short-lived, workload-identity-based credentials and apply least privilege; cap token lifetimes.","Review authentication logs for every exposed credential for the entire period it was public, not just since disclosure.","Establish or publicise a vulnerability disclosure policy so researcher contact does not have to be handled as an intrusion."],"kql":[{"platform":"sentinel","table":"SigninLogs","name":"Service or application account sign-in from outside known infrastructure","description":"Untested. Credentials leaked in public code are typically service/automation accounts; the giveaway is authentication from an IP or ASN outside the estate. Populate the account list from your secret-scanning results.","query":"let LeakedAccounts = dynamic([\"svc-\", \"sa-\", \"api-\", \"automation\", \"deploy\", \"ci-\"]);\nlet CorporateASNs = dynamic([\"12345\", \"67890\"]);  // replace with your own ASNs as bare numbers (AutonomousSystemNumber is numeric, not \"AS1234\")\nSigninLogs\n| where TimeGenerated > ago(180d)\n| where ResultType == 0\n| where UserPrincipalName has_any (LeakedAccounts) or AppDisplayName has_any (LeakedAccounts)\n| extend ASN = tostring(AutonomousSystemNumber)\n| where ASN !in (CorporateASNs)\n| summarize Attempts = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), IPs = make_set(IPAddress, 20), UAs = make_set(UserAgent, 10) by UserPrincipalName, AppDisplayName, ASN, Location\n| order by LastSeen desc"},{"platform":"sentinel","table":"AADNonInteractiveUserSignInLogs","name":"Non-interactive token use for an account after credential rotation","description":"Untested. After rotating a leaked secret, surviving refresh tokens can still authenticate until revoked. Set RotationTime to when you revoked the credential and populate RotatedAccounts; any hit means tokens were not revoked.","query":"let RotationTime = datetime(2026-11-10T00:00:00Z);\nlet RotatedAccounts = dynamic([\"svc-example@contoso.gov.uk\"]);  // replace with the accounts whose leaked secrets you rotated\nAADNonInteractiveUserSignInLogs\n| where TimeGenerated > RotationTime\n| where ResultType == 0\n| where tolower(UserPrincipalName) in~ (RotatedAccounts)\n| summarize Events = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), IPs = make_set(IPAddress, 20), Apps = make_set(AppDisplayName, 20) by UserPrincipalName\n| order by LastSeen desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"API or data-portal access with an administrative token from unexpected sources","description":"Untested. Targets the Scottish Government pattern - an admin token shipped in client-side JavaScript and therefore usable by any visitor. Replace the app filter with your own portal/API app name.","query":"CloudAppEvents\n| where Timestamp > ago(180d)\n| where isnotempty(AccountObjectId)\n| extend UA = tostring(RawEventData.UserAgent), IP = tostring(RawEventData.ClientIPAddress)\n| where UA has_any (\"python-requests\", \"curl\", \"Go-http-client\", \"axios\", \"node-fetch\", \"okhttp\", \"Java/\", \"PostmanRuntime\")\n| summarize Events = count(), Actions = make_set(ActionType, 20), IPs = make_set(IP, 20) by AccountDisplayName, Application, UA\n| order by Events desc"}],"iocs":[{"type":"note","value":"No attacker indicators exist for this item - the exposure was found and reported by a security researcher, not observed in an intrusion.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries of WIRED coverage, 2026-11-10/11"},{"type":"ttp","value":"T1552.001 - Unsecured Credentials: Credentials In Files","context":"Live credentials committed to publicly accessible UK public-sector repositories.","confidence":"high","source":"Researcher report (as relayed)"},{"type":"ttp","value":"T1593.003 - Search Open Websites/Domains: Code Repositories","context":"Public code repositories as the reconnaissance surface; AI assistance used to scale the search.","confidence":"high","source":"Researcher report (as relayed)"},{"type":"behaviour","value":"Long-lived administrator bearer token embedded in client-side JavaScript served to all site visitors","context":"Scottish Government open-data portal finding; exposure is to every visitor, not only repository readers.","confidence":"medium","source":"Press coverage (as relayed)"},{"type":"behaviour","value":"Valid Planning Inspectorate login exposed in public code; revoked within 20 minutes of disclosure, no evidence of breach found","context":"Most serious individual finding; Planning Inspectorate handled it as a cyber incident.","confidence":"medium","source":"Planning Inspectorate statement (as relayed)"}],"references":["https://mlq.ai/news/researcher-finds-exposed-credentials-and-other-serious-flaws-across-uk-government-code-including-a-planning-inspectorate-login-wired-reports/","https://www.zetik.com/news/article/story_id-p008-231046","https://www.techbooky.com/ai-audit-finds-serious-flaws-in-uk-government-code/"]},{"rank":3,"id":"TI-2026-11-11-003","title":"Microsoft November 2026 Patch Tuesday: Exploited Outlook Zero-Day CVE-2026-124194 Leaks NTLMv2 Hashes - CISA KEV-Listed Same Day, Due 24 November","cve_ids":["CVE-2026-124194","CVE-2026-110043","CVE-2026-110068","CVE-2026-111309"],"vendor":"Microsoft","affected_products":["Microsoft Outlook (Microsoft 365 Apps / Office; patched via Office update channels)","Microsoft Office (November 2026 security release)"],"category":"vulnerability","cvss_v3":6.5,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-24","patch_available":"yes","first_reported":"2026-11-10","last_updated":"2026-11-11","confidence":"high","summary":"UK government and UK corporate - cross-cutting. Microsoft's November 2026 Patch Tuesday (10 Nov) shipped an exceptionally large release and one zero-day already under exploitation: CVE-2026-124194, an Outlook spoofing/information-disclosure flaw. Per Rapid7, The Register, Tenable, CSO Online and Windows Report, opening or previewing a crafted message file causes Outlook to reach out to an attacker-controlled location and leak the current user's NTLMv2 hash, which can then be relayed or cracked offline for lateral movement. CVSS is only 6.5 and Microsoft lists no critical rating, but the exploited status and the near-universal deployment of Outlook across UK central government, local authorities, NHS and UK corporates make this the highest-practical-priority patch in the window. CISA added CVE-2026-124194 to the Known Exploited Vulnerabilities catalog on 10 November with a federal remediation due date of 24 November 2026; UK organisations should treat that as the outside limit, not the target. IMPORTANT DEPLOYMENT NOTE: at least one outlet reports the fix arrives through the Office/Microsoft 365 Apps update channel rather than Windows Update, so estates that patch only via WSUS/Windows Update may remain exposed - verify Office build numbers, not just OS patch level. This detail was not confirmed against Microsoft's own advisory. Three further Outlook remote-code-execution flaws rated critical were fixed in the same release (CVE-2026-110043, CVE-2026-110068, CVE-2026-111309); none is reported as exploited. Total CVE counts differ markedly between outlets - Tenable and GBHackers report 1,093, BleepingComputer 1,235, CSO Online cites 63 rated critical - so treat the headline number as unsettled and work from your own vulnerability-management feed. Detail is from search-result summaries; msrc.microsoft.com and the vendor advisory were not retrieved from this environment.","recommended_actions":["Patch Outlook / Microsoft 365 Apps via the Office update channel now; confirm by Office build number rather than OS patch level, and verify Click-to-Run and MSI estates separately.","Block outbound SMB (TCP/445) and WebDAV from user workstations to the internet at the perimeter - this neutralises the NTLM-leak primitive even where patching lags.","Enforce SMB signing and Extended Protection for Authentication (EPA) on domain controllers, LDAP and internal services to defeat NTLM relay.","Enable NetNTLMv1 blocking and begin NTLM auditing with a view to restricting NTLM outbound to remote servers via Group Policy.","Disable the Outlook reading/preview pane for untrusted mail and force plain-text rendering where operationally tolerable until patched.","Hunt back 90 days for Outlook-initiated SMB/WebDAV connections to external hosts (see KQL below) - exploitation predates the patch.","Apply the three critical Outlook RCE fixes (CVE-2026-110043, CVE-2026-110068, CVE-2026-111309) in the same change window."],"kql":[{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outlook initiating SMB or WebDAV to an external host (NTLM leak)","description":"Untested. Core detection for CVE-2026-124194 exploitation: OUTLOOK.EXE should never make SMB connections to public IP space. Excludes RFC1918/CGNAT ranges.","query":"DeviceNetworkEvents\n| where Timestamp > ago(90d)\n| where InitiatingProcessFileName =~ \"outlook.exe\"\n| where RemotePort in (445, 139)\n| where isnotempty(RemoteIP)\n| where not(ipv4_is_private(RemoteIP)) and not(ipv4_is_in_any_range(RemoteIP, dynamic([\"100.64.0.0/10\", \"127.0.0.0/8\", \"169.254.0.0/16\"])))\n| project Timestamp, DeviceName, AccountName = InitiatingProcessAccountName, RemoteIP, RemoteUrl, RemotePort, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceEvents","name":"WebDAV client activity triggered from Outlook or Office processes","description":"Untested. Where SMB egress is blocked, the forced-authentication primitive commonly falls back to WebDAV over HTTP(S) via the WebClient service. Two branches: WebClient/named-pipe activity initiated by Office processes, and Office processes referencing UNC or WebDAV paths. Expect benign hits from legitimate file shares - baseline first.","query":"let OfficeProcs = dynamic([\"outlook.exe\", \"winword.exe\", \"excel.exe\", \"powerpnt.exe\"]);\nlet WebDavMarkers = dynamic([\"@SSL\", \"DavWWWRoot\", \"http://\", \"https://\"]);\nlet OfficeWebClient =\n    DeviceEvents\n    | where Timestamp > ago(90d)\n    | where InitiatingProcessFileName in~ (OfficeProcs)\n    | where ActionType has_any (\"Service\", \"NamedPipe\") or tostring(AdditionalFields) has \"WebClient\"\n    | project Timestamp, DeviceName, Source = \"DeviceEvents\", ActionType, Process = InitiatingProcessFileName, Detail = strcat(FileName, \" | \", tostring(AdditionalFields)), Account = InitiatingProcessAccountName;\nlet OfficeUncChild =\n    DeviceProcessEvents\n    | where Timestamp > ago(90d)\n    | where InitiatingProcessFileName in~ (OfficeProcs)\n    | where ProcessCommandLine has @\"\\\\\" or ProcessCommandLine has_any (WebDavMarkers)\n    | project Timestamp, DeviceName, Source = \"DeviceProcessEvents\", ActionType = \"ProcessCreated\", Process = InitiatingProcessFileName, Detail = ProcessCommandLine, Account = InitiatingProcessAccountName;\nunion OfficeWebClient, OfficeUncChild\n| order by Timestamp desc"},{"platform":"sentinel","table":"SecurityEvent","name":"NTLM relay indicators - same account authenticating from multiple hosts in a short window","description":"Untested. Post-leak relay hunt on Windows Security event 4624 type 3 with NTLM. Noisy in large estates; narrow to privileged accounts first.","query":"SecurityEvent\n| where TimeGenerated > ago(30d)\n| where EventID == 4624 and LogonType == 3\n| where AuthenticationPackageName =~ \"NTLM\"\n| where TargetUserName !endswith \"$\" and TargetUserName !in~ (\"ANONYMOUS LOGON\", \"SYSTEM\")\n| summarize SourceHosts = dcount(IpAddress), Hosts = make_set(IpAddress, 25), Targets = make_set(Computer, 25), Logons = count() by TargetUserName, bin(TimeGenerated, 1h)\n| where SourceHosts >= 5\n| order by SourceHosts desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Devices still missing the November 2026 Outlook fix","description":"Untested. Patch-coverage view for the exploited CVE and the three critical Outlook RCEs shipped alongside it.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId in (\"CVE-2026-124194\", \"CVE-2026-110043\", \"CVE-2026-110068\", \"CVE-2026-111309\")\n| summarize CVEs = make_set(CveId), SoftwareVersion = any(SoftwareVersion) by DeviceName, DeviceId, SoftwareName\n| order by DeviceName asc"}],"iocs":[{"type":"note","value":"Microsoft has not published attacker infrastructure for CVE-2026-124194; no IPs, domains or hashes are available. Detection must be behavioural.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-10/11"},{"type":"ttp","value":"T1187 - Forced Authentication","context":"Crafted message file causes Outlook to authenticate to an attacker-controlled host, leaking the NTLMv2 hash.","confidence":"high","source":"Rapid7 / Windows Report (as relayed)"},{"type":"ttp","value":"T1557.001 - Adversary-in-the-Middle: LLMNR/NBT-NS Poisoning and SMB Relay","context":"Typical follow-on use of a captured NTLMv2 hash is relay to internal services.","confidence":"medium","source":"Analyst inference"},{"type":"ttp","value":"T1110.002 - Brute Force: Password Cracking","context":"Alternative follow-on: offline cracking of the captured NTLMv2 hash.","confidence":"medium","source":"Analyst inference"},{"type":"behaviour","value":"outlook.exe establishing TCP/445 or TCP/139 sessions to non-RFC1918 destinations","context":"High-fidelity exploitation indicator; Outlook has no legitimate reason to do this.","confidence":"high","source":"Analyst-derived detection logic"},{"type":"port","value":"445","context":"SMB egress abused to carry the forced NTLM authentication. Block outbound at the perimeter.","confidence":"high","source":"Analyst-derived detection logic"},{"type":"behaviour","value":"Office fix delivered via Microsoft 365 Apps / Office update channel rather than Windows Update","context":"Estates patching only via WSUS/Windows Update may show as compliant while remaining vulnerable. Unconfirmed against the vendor advisory.","confidence":"low","source":"TechHacker (as relayed)"}],"references":["https://www.rapid7.com/blog/post/em-patch-tuesday-november-2026/","https://www.tenable.com/blog/microsoft-november-2026-patch-tuesday-addresses-1093-cves-cve-2026-124194","https://www.theregister.com/security/2026/11/10/november-patch-tuesday-boasts-over-1000-bugs-but-only-one-zero-day-so-far/5308946","https://www.csoonline.com/article/4247015/november-2026-patch-tuesday-63-critical-microsoft-fixes-plus-an-outlook-zero-day-that-allows-theft-of-hashed-credentials.html","https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/","https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog"]},{"rank":4,"id":"TI-2026-11-11-004","title":"Barracuda Email Security Gateway Pre-Auth Remote Root Chain (CVE-2026-116606 + CVE-2026-111560) Exploited in the Wild - CISA KEV 10 Nov with Three-Day Remediation Deadline","cve_ids":["CVE-2026-116606","CVE-2026-111560"],"vendor":"Barracuda Networks","affected_products":["Barracuda Email Security Gateway (ESG) - firmware 9.4.017 and later (BNSF-40425), earlier versions (BNSF-40430)","Barracuda Load Balancer ADC","Barracuda Message Archiver","Barracuda Web Application Firewall","Barracuda WAF Control Center","Barracuda Web Security Gateway"],"category":"vulnerability","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-13","patch_available":"yes","first_reported":"2026-11-09","last_updated":"2026-11-11","confidence":"high","summary":"UK government and UK corporate - edge appliance. Barracuda confirmed in an update posted 9 November (21:00 EST) that attackers are actively exploiting two vulnerabilities patched roughly a week earlier which, chained, yield remote root on Email Security Gateway appliances. CVE-2026-111560 is an OS command injection in the appliance's timezone field that executes commands as root; alone it requires administrative access. CVE-2026-116606, detailed publicly by watchTowr Labs, supplies the pre-authentication step, so the pair together gives unauthenticated attackers full control of an affected gateway. CISA added both to the KEV catalog on 10 November with an unusually aggressive remediation window - reported as three days, i.e. by 13 November - which is itself a signal of observed severity. The command-injection flaw is not confined to ESG: the same timezone-field defect is reported in Barracuda Load Balancer ADC, Message Archiver, WAF, WAF Control Center and Web Security Gateway, so a patch programme scoped to ESG alone will leave exposure behind. Fixes shipped on 2 November as BNSF-40425 (ESG firmware 9.4.017 and later) and BNSF-40430 (earlier versions). ASSESSMENT: Barracuda ESG has prior form as a mass-exploitation target against government and corporate mail flows, and an appliance that terminates inbound email with root-level compromise is both a persistent foothold and a position from which to read, alter and send mail for the whole organisation. Appliances sit outside normal EDR coverage, so detection falls to syslog, egress monitoring and vendor-supplied integrity checks. Vendor advisory pages and CISA's alert were not retrievable from this environment; CVE-2026-111560 was recorded as NOT KEV-listed in sources dated 2-3 November, which those sources now predate - the 10 November addition supersedes them.","recommended_actions":["Apply BNSF-40425 (ESG firmware 9.4.017+) or BNSF-40430 (earlier firmware) immediately; verify the patch applied rather than trusting the appliance's auto-update state.","Patch BOTH CVEs together - any ESG fixed only for CVE-2026-111560 remains exposed via the chain, and vice versa.","Extend scope beyond ESG to Load Balancer ADC, Message Archiver, WAF, WAF Control Center and Web Security Gateway, which share the timezone-field defect.","Remove the appliance management interface from internet exposure; restrict it to a management VLAN with source-IP allow-listing.","Assume compromise for any appliance that was internet-exposed and unpatched between 2 and 10 November: engage Barracuda support for an integrity check, and treat appliance rebuild/replacement as the safe remediation rather than patch-in-place.","Rotate every credential the appliance held or could observe - LDAP/AD bind accounts, SMTP relay credentials, API keys, admin passwords - and any credential that traversed it in plaintext.","Review appliance mail logs and configuration history for unauthorised mail routing rules, new admin accounts, journaling/BCC rules and archive exports.","Monitor egress from appliance management IPs: an ESG should not initiate outbound connections to arbitrary internet hosts."],"kql":[{"platform":"sentinel","table":"Syslog","name":"Command-injection patterns in Barracuda appliance syslog","description":"Untested. Hunts shell metacharacters and command substitution in appliance log lines, consistent with timezone-field injection. Replace the facility/host filter with your own appliance identifiers.","query":"Syslog\n| where TimeGenerated > ago(60d)\n| where Computer has_any (\"barracuda\", \"esg\", \"bese\") or ProcessName has \"barracuda\"\n| where SyslogMessage has_any (\"$(\", \"`\", \"&&\", \"||\", \";wget\", \"; wget\", \";curl\", \"; curl\", \"/bin/sh\", \"/bin/bash\", \"nc -e\", \"bash -i\", \"python -c\", \"perl -e\", \"TimeZone\", \"timezone\")\n| project TimeGenerated, Computer, Facility, ProcessName, SeverityLevel, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Outbound connections initiated by Barracuda appliance management addresses","description":"Untested. An email gateway makes predictable outbound connections (SMTP, DNS, vendor update and reputation services). Anything else from the appliance's own IP is a strong compromise signal. Populate ApplianceIPs.","query":"let ApplianceIPs = dynamic([\"10.0.0.0\"]);  // replace with your Barracuda appliance management IPs\nCommonSecurityLog\n| where TimeGenerated > ago(60d)\n| where SourceIP in (ApplianceIPs)\n| where DestinationPort !in (25, 53, 443, 465, 587, 123)\n| summarize Connections = count(), Ports = make_set(DestinationPort, 25), Dests = make_set(DestinationIP, 50), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP, DeviceVendor\n| order by Connections desc"},{"platform":"sentinel","table":"Syslog","name":"New administrative account or configuration change on a Barracuda appliance","description":"Untested. Post-exploitation persistence hunt on appliance admin and configuration events.","query":"Syslog\n| where TimeGenerated > ago(60d)\n| where Computer has_any (\"barracuda\", \"esg\") or ProcessName has \"barracuda\"\n| where SyslogMessage has_any (\"admin added\", \"user created\", \"role changed\", \"password changed\", \"config change\", \"firmware\", \"ssh enabled\", \"support tunnel\", \"backup downloaded\", \"export\")\n| project TimeGenerated, Computer, ProcessName, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"SigninLogs","name":"Authentication using an appliance LDAP or service bind account from an unexpected source","description":"Untested. A rooted mail gateway surrenders its directory bind credentials. Replace BindAccounts with the service accounts your Barracuda appliances use.","query":"let BindAccounts = dynamic([\"svc-barracuda\", \"ldap-bind-esg\"]);  // replace with your own\nSigninLogs\n| where TimeGenerated > ago(60d)\n| where tolower(UserPrincipalName) has_any (BindAccounts)\n| summarize Signins = count(), IPs = make_set(IPAddress, 25), Apps = make_set(AppDisplayName, 25), Results = make_set(ResultType, 10) by UserPrincipalName, bin(TimeGenerated, 1d)\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"Neither Barracuda nor CISA has published attacker IPs, domains or file hashes for this campaign in the sources available; indicators below are behavioural and configuration-based.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-09/11"},{"type":"ttp","value":"T1190 - Exploit Public-Facing Application","context":"Pre-authentication exploitation of an internet-facing email security gateway.","confidence":"high","source":"Barracuda / watchTowr (as relayed)"},{"type":"ttp","value":"T1059.004 - Command and Scripting Interpreter: Unix Shell","context":"CVE-2026-111560 executes OS commands as root via the appliance timezone field.","confidence":"high","source":"Barracuda advisory (as relayed)"},{"type":"ttp","value":"T1068 - Exploitation for Privilege Escalation","context":"Chaining CVE-2026-116606 with CVE-2026-111560 to reach root without credentials.","confidence":"high","source":"watchTowr Labs (as relayed)"},{"type":"behaviour","value":"Shell metacharacters or command substitution submitted in the appliance timezone configuration field","context":"Direct exploitation artefact for CVE-2026-111560; look for it in appliance configuration and audit logs.","confidence":"medium","source":"Barracuda advisory (as relayed)"},{"type":"behaviour","value":"Barracuda appliance initiating outbound connections on ports other than 25/53/443/465/587/123","context":"Egress from a mail gateway to arbitrary internet hosts indicates root-level compromise.","confidence":"medium","source":"Analyst-derived detection logic"},{"type":"service_name","value":"BNSF-40425 / BNSF-40430","context":"Barracuda patch identifiers shipped 2 Nov 2026 - presence confirms remediation, absence confirms exposure.","confidence":"high","source":"Barracuda / press (as relayed)"}],"references":["https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/","https://www.bleepingcomputer.com/news/security/hackers-exploit-barracuda-email-security-gateway-flaws-to-get-root-access/","https://www.securityweek.com/recently-patched-barracuda-vulnerabilities-exploited-in-attacks/","https://www.suped.com/blog/cisa-lists-two-actively-exploited-barracuda-email-gateway-flaws","https://www.rescana.com/post/barracuda-esg-cve-2026-116606-111560-root-prepare-now","https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog"]},{"rank":5,"id":"TI-2026-11-11-005","title":"Cisco BroadWorks Unauthenticated XXE (CVE-2026-20320) and Openwave Webtop Media Transcoder (CVE-2026-111793) Exploited Against Telecoms - KEV 10 Nov, Due 24 Nov","cve_ids":["CVE-2026-20320","CVE-2026-111793"],"vendor":"Cisco; Openwave Mobility","affected_products":["Cisco BroadWorks (fixed in release RI.2026.07, August 2026)","Openwave Webtop Media Transcoder (reported fixed in 1.1.22.0; separate remediation update reported October 2026)"],"category":"vulnerability_bundle","cvss_v3":7.5,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-24","patch_available":"yes","first_reported":"2026-11-08","last_updated":"2026-11-11","confidence":"medium","summary":"UK critical national infrastructure (telecoms) and UK corporate. CISA added two telecoms-platform flaws to the KEV catalog on 10 November 2026 with a federal remediation deadline of 24 November. CVE-2026-20320 is an unauthenticated XML External Entity (XXE) vulnerability in Cisco BroadWorks, rated CVSS 7.5, which exposes configuration data to a remote attacker without credentials; Cisco fixed it in release RI.2026.07 in August 2026 and, per BleepingComputer, its original security bulletin made no mention of exploitation. CVE-2026-111793 affects the Openwave Webtop Media Transcoder and involves improper resource handling across a security boundary. Sources conflict on the Openwave fix timeline - one reports the defect addressed in version 1.1.22.0 (2021), another a remediation update in October 2026 - so confirm the required build with the vendor rather than from press reporting. Malbear Labs reported on 8 November that a Chinese-speaking threat actor has been exploiting the Cisco BroadWorks flaw in a broad campaign, reportedly using a jailbroken 'DeepSeek Flash' model to assist, and targeting a European telecom together with thirteen organisations hosted in that telecom's data centres. CISA has published no attribution, no independent corroboration of the Malbear Labs account was found, and the AI-assistance claim in particular should be treated as a single-source vendor assertion. ASSESSMENT: UK relevance is indirect but material - BroadWorks underpins hosted voice and UC services sold to UK enterprises and public bodies, so the exposure is largely supplier-side, and the reported targeting of a telecom's co-located tenants is a textbook service-provider-to-customer pivot. Configuration disclosure from a voice platform typically yields credentials, SIP trunk detail and subscriber data usable for toll fraud and vishing. Vendor and CISA pages were not retrievable from this environment.","recommended_actions":["Inventory Cisco BroadWorks deployments and confirm release RI.2026.07 or later; where BroadWorks is consumed as a hosted service, obtain written confirmation of the provider's patch level and exposure window.","Confirm the required Openwave Webtop Media Transcoder build directly with Openwave Mobility - press reports of the fix version conflict.","Treat configuration data as disclosed on any BroadWorks instance internet-exposed and unpatched since August 2026: rotate administrative and SIP trunk credentials, API keys and shared secrets.","Restrict BroadWorks provisioning, OCI and XSI interfaces to management networks; do not expose them to the internet.","Review voice platforms for toll-fraud indicators - unusual international destinations, out-of-hours call volume spikes, new trunk or dial-plan entries.","Brief staff on vishing risk: disclosed subscriber and extension data is directly usable for convincing internal-caller pretexts.","Ask hosted-UC and data-centre providers whether they were affected by the reported campaign against a European telecom's co-located tenants."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"XXE payload patterns against BroadWorks web interfaces","description":"Untested. Hunts XML external-entity payload markers in WAF, proxy and firewall URL/request logs reaching voice-platform hosts. Populate BroadWorksHosts.","query":"let BroadWorksHosts = dynamic([\"10.0.0.0\"]);  // replace with your BroadWorks server IPs\nCommonSecurityLog\n| where TimeGenerated > ago(120d)\n| where DestinationIP in (BroadWorksHosts) or DeviceCustomString1 has \"broadworks\"\n| where RequestURL has_any (\"\u003c!DOCTYPE\", \"\u003c!ENTITY\", \"SYSTEM \\\"file:\", \"SYSTEM \\\"http\", \"php://filter\", \"expect://\", \"/etc/passwd\", \"xxe\")\n   or AdditionalExtensions has_any (\"\u003c!ENTITY\", \"SYSTEM \\\"file:\")\n| project TimeGenerated, SourceIP, DestinationIP, DestinationPort, RequestMethod, RequestURL, DeviceAction, DeviceVendor\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"Syslog","name":"Unauthenticated access to BroadWorks provisioning and configuration endpoints","description":"Untested. XXE in BroadWorks is pre-auth, so look for configuration/provisioning endpoint hits with no preceding successful authentication from the same source.","query":"Syslog\n| where TimeGenerated > ago(120d)\n| where Computer has_any (\"broadworks\", \"bw-\", \"xsp\", \"appserver\")\n| where SyslogMessage has_any (\"/webapp\", \"OCIRequest\", \"ProvisioningService\", \"/xsi-actions\", \"/xsi-events\", \"DeviceManagement\", \"configuration\")\n| where SyslogMessage !has \"AuthenticationSuccess\"\n| summarize Hits = count(), Messages = make_set(substring(SyslogMessage, 0, 200), 10) by Computer, bin(TimeGenerated, 1h)\n| where Hits > 20\n| order by Hits desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Outbound data transfer from voice platform or transcoder hosts","description":"Untested. XXE and resource-handling flaws are used to read and remove configuration; this surfaces unexpected egress volume from the affected platforms. Populate the host list.","query":"let VoiceHosts = dynamic([\"10.0.0.0\"]);  // BroadWorks and Openwave Webtop/Transcoder hosts\nCommonSecurityLog\n| where TimeGenerated > ago(120d)\n| where SourceIP in (VoiceHosts)\n| where isnotempty(SentBytes)\n| summarize TotalSentMB = round(sum(toreal(SentBytes)) / 1048576, 2), Sessions = count(), Dests = dcount(DestinationIP), TopDests = make_set(DestinationIP, 25) by SourceIP, bin(TimeGenerated, 1d)\n| where TotalSentMB > 100\n| order by TotalSentMB desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Exposure check for the 10 November KEV telecoms CVEs","description":"Untested. Only covers assets onboarded to Defender Vulnerability Management - appliance-style voice platforms usually are not, so pair with the syslog hunts above.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId in (\"CVE-2026-20320\", \"CVE-2026-111793\")\n| summarize CVEs = make_set(CveId), Versions = make_set(SoftwareVersion, 10) by DeviceName, DeviceId, SoftwareVendor, SoftwareName\n| order by DeviceName asc"}],"iocs":[{"type":"note","value":"CISA published no attribution or indicators for either CVE. The threat-actor and AI-assistance detail below comes from a single vendor report (Malbear Labs, 8 Nov 2026) with no independent corroboration found.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-10/11"},{"type":"ttp","value":"T1190 - Exploit Public-Facing Application","context":"Unauthenticated exploitation of internet-reachable BroadWorks and Openwave Webtop interfaces.","confidence":"high","source":"CISA KEV / press (as relayed)"},{"type":"ttp","value":"T1213 - Data from Information Repositories","context":"XXE in CVE-2026-20320 exposes platform configuration data.","confidence":"high","source":"BleepingComputer / SecurityWeek (as relayed)"},{"type":"ttp","value":"T1199 - Trusted Relationship","context":"Reported targeting of thirteen organisations co-located in a compromised European telecom's data centres.","confidence":"low","source":"Malbear Labs (as relayed, uncorroborated)"},{"type":"actor","value":"Unnamed Chinese-speaking threat actor","context":"Attributed by Malbear Labs to a broad campaign exploiting CVE-2026-20320. No CISA or government attribution exists; treat as an investigative lead only.","confidence":"low","source":"Malbear Labs (as relayed, uncorroborated)"},{"type":"behaviour","value":"XML external-entity payload markers (\u003c!DOCTYPE, \u003c!ENTITY, SYSTEM \"file:) in requests to BroadWorks web endpoints","context":"Direct exploitation artefact for CVE-2026-20320.","confidence":"medium","source":"Analyst-derived detection logic"},{"type":"ttp","value":"Use of a jailbroken large language model to assist exploitation","context":"Single-source claim (jailbroken 'DeepSeek Flash'); unverified and not independently reported.","confidence":"low","source":"Malbear Labs (as relayed, uncorroborated)"}],"references":["https://www.bleepingcomputer.com/news/security/cisa-flags-cisco-broadworks-flaw-as-actively-exploited-in-attacks/","https://www.securityweek.com/threat-actors-exploit-openwave-cisco-broadworks-vulnerabilities/","https://thehackernews.com/2026/11/cisco-broadworks-and-openwave-flaws.html","https://securityonline.info/cisa-kev-six-vulnerabilities-november-2026/","https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog"]},{"rank":6,"id":"TI-2026-11-11-006","title":"Chrome/Chromium Zero-Day CVE-2026-125350 (libxslt Use-After-Free) Exploited in the Wild - Eighth Chrome Zero-Day of 2026, KEV 10 Nov, Due 24 Nov","cve_ids":["CVE-2026-125350"],"vendor":"Google","affected_products":["Google Chrome before 157.0.8103.50 (Linux)","Google Chrome before 157.0.8103.50/157.0.8103.51 (Windows, macOS)","Chromium-based browsers sharing the affected libxslt code (Edge, Brave, Opera, Vivaldi - await vendor builds)","Other software embedding libxslt"],"category":"vulnerability","cvss_v3":8.8,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-24","patch_available":"yes","first_reported":"2026-11-09","last_updated":"2026-11-11","confidence":"high","summary":"UK government and UK corporate - endpoint estate. Google has patched CVE-2026-125350, a high-severity use-after-free in Chrome's XML component, and states it is aware of an exploit existing in the wild. It is reported as the eighth Chrome zero-day known to be exploited in 2026. The public Chromium patch points at libxslt: a flaw in libxslt's pattern-matching cache allows a nested XML evaluation to free and replace a cached object while an earlier operation still holds the stale memory address. The Hacker News rates it CVSS 8.8 and reports an anonymous researcher credited with the 6 November 2026 report. Fixed in 157.0.8103.50 for Linux and 157.0.8103.50/157.0.8103.51 for Windows and macOS; a browser restart is required for the update to take effect, which is the usual reason patched estates stay vulnerable in practice. The release fixes nine flaws in total, of which only CVE-2026-125350 is known to be exploited. CISA added it to the KEV catalog on 10 November with a federal due date of 24 November 2026. Google has published no detail on the attackers, the targets, the delivery method or the exploit's capability, which is its standard practice while exploitation is ongoing and typically indicates targeted rather than commodity use. ASSESSMENT: because the defect is in libxslt rather than Chrome-specific code, exposure extends beyond Chrome to other Chromium-based browsers and to any product embedding the library; UK organisations should track vendor builds for Edge and other Chromium derivatives, and check server-side and tooling dependencies on libxslt. For a government or enterprise estate the practical risk is drive-by compromise of a browsing user, usually chained with a sandbox escape for code execution outside the renderer. Sources differ on the release date (9 vs 10 November). Detail is from search-result summaries; chromereleases.googleblog.com and CISA were not retrievable from this environment.","recommended_actions":["Force Chrome to 157.0.8103.50/.51 or later across the estate and, critically, force a browser relaunch - use the Chrome RelaunchNotification and RelaunchNotificationPeriod policies rather than relying on users.","Report on actual running Chrome versions, not assigned policy, to find devices that updated but were never restarted.","Track and apply equivalent builds for Microsoft Edge and any other Chromium-based browsers permitted in the estate - the libxslt defect is shared code.","Inventory non-browser software and server-side tooling that links libxslt (XSLT processors, document pipelines, CMS plug-ins) and patch those dependencies.","Verify Chrome site isolation and sandbox policies are enforced, and that Enhanced Safe Browsing or equivalent is on.","Hunt for post-exploitation behaviour: chrome.exe spawning script interpreters or LOLBins, and unexpected writes outside normal browser paths.","Remove or restrict any remaining unmanaged/portable browser installations, which will not receive the policy-driven update."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"Chrome installations below the fixed build","description":"Untested. Version comparison against the fixed build using parsed version components, so it does not rely on string ordering.","query":"DeviceTvmSoftwareInventory\n| where SoftwareVendor =~ \"google\" and SoftwareName has \"chrome\"\n| extend Parts = split(SoftwareVersion, \".\")\n| extend Major = toint(Parts[0]), Minor = toint(Parts[1]), Build = toint(Parts[2]), Patch = toint(Parts[3])\n| extend VersionScore = Major * 1000000000 + Minor * 10000000 + Build * 1000 + Patch\n| extend FixedScore = 157 * 1000000000 + 0 * 10000000 + 8103 * 1000 + 50\n| where isnotnull(VersionScore) and VersionScore \u003c FixedScore\n| project DeviceName, DeviceId, SoftwareName, SoftwareVersion, OSPlatform\n| order by SoftwareVersion asc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Chrome renderer spawning interpreters or LOLBins (sandbox escape follow-on)","description":"Untested. Chrome legitimately spawns only its own helper processes; a shell, script host or LOLBin child is a strong post-exploitation signal.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where InitiatingProcessFileName in~ (\"chrome.exe\", \"msedge.exe\", \"brave.exe\", \"opera.exe\", \"vivaldi.exe\", \"chrome\", \"chromium\")\n| where FileName in~ (\"powershell.exe\", \"pwsh.exe\", \"cmd.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\", \"rundll32.exe\", \"regsvr32.exe\", \"certutil.exe\", \"bitsadmin.exe\", \"curl.exe\", \"msiexec.exe\", \"sh\", \"bash\", \"python\", \"python3\", \"osascript\")\n| project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, FolderPath\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Executable or script written by a browser process outside download paths","description":"Untested. Separates ordinary downloads from writes to startup, temp and user-profile locations typical of exploit payload staging.","query":"DeviceFileEvents\n| where Timestamp > ago(30d)\n| where InitiatingProcessFileName in~ (\"chrome.exe\", \"msedge.exe\", \"brave.exe\", \"opera.exe\", \"vivaldi.exe\")\n| where ActionType in (\"FileCreated\", \"FileModified\", \"FileRenamed\")\n| where FileName endswith \".exe\" or FileName endswith \".dll\" or FileName endswith \".ps1\" or FileName endswith \".scr\" or FileName endswith \".hta\" or FileName endswith \".js\" or FileName endswith \".vbs\" or FileName endswith \".lnk\"\n| where not(FolderPath has_any (@\"\\Downloads\\\", @\"\\AppData\\Local\\Google\\Chrome\\User Data\\\", @\"\\AppData\\Local\\Microsoft\\Edge\\User Data\\\", @\"\\Google\\Chrome\\Application\\\", @\"\\Microsoft\\Edge\\Application\\\"))\n| project Timestamp, DeviceName, InitiatingProcessFileName, ActionType, FileName, FolderPath, SHA256, InitiatingProcessAccountName\n| order by Timestamp desc"}],"iocs":[{"type":"note","value":"Google has deliberately withheld exploitation detail (actors, targets, delivery, capability) while attacks are ongoing. No attacker IPs, domains or hashes are available.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-10/11"},{"type":"ttp","value":"T1203 - Exploitation for Client Execution","context":"Browser use-after-free exploited in the wild via crafted content.","confidence":"high","source":"Google / The Hacker News (as relayed)"},{"type":"ttp","value":"T1189 - Drive-by Compromise","context":"Expected delivery route for a Chrome renderer zero-day.","confidence":"medium","source":"Analyst inference"},{"type":"behaviour","value":"Nested XML/XSLT evaluation triggering use-after-free in libxslt pattern-matching cache","context":"Root cause per the public Chromium patch; relevant to any product embedding libxslt, not only Chrome.","confidence":"medium","source":"Chromium patch analysis (as relayed)"},{"type":"behaviour","value":"Chrome running a version below 157.0.8103.50 after a policy-driven update, indicating the browser was never relaunched","context":"Primary residual-exposure condition in managed estates.","confidence":"high","source":"Analyst-derived detection logic"},{"type":"filename","value":"libxslt","context":"Affected library; inventory non-browser software and server-side XSLT pipelines that link it.","confidence":"medium","source":"Chromium patch analysis (as relayed)"}],"references":["https://thehackernews.com/2026/11/google-issues-chrome-security-update.html","https://cyberinsider.com/chrome-xml-zero-day-exploited-in-attacks/","https://www.malwarebytes.com/blog/bugs/2026/11/update-chrome-now-to-fix-a-flaw-attackers-are-exploiting","https://cypro.co.uk/insights/cyber-bulletins/chrome-zero-day-cve-2026-125350-exploited/","https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog"]},{"rank":7,"id":"TI-2026-11-11-007","title":"CISA KEV 9 November Batch Exploited in the Wild: GPUStack (CVE-2026-102895), SignalWire FreeSWITCH (CVE-2026-116779), OpenSSH (CVE-2026-123158) and IBM Aspera Faspex (CVE-2026-123218) - Due 12 November","cve_ids":["CVE-2026-102895","CVE-2026-116779","CVE-2026-123158","CVE-2026-123218"],"vendor":"GPUStack; SignalWire; OpenSSH/OpenBSD; IBM","affected_products":["GPUStac
