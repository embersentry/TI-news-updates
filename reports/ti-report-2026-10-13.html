der Labs"},{"type":"md5","value":"4a171f62d1bab01827b06ae73d4caafa","context":"com.mobile.applock.wt ad-fraud / remote-code-loading payload.","confidence":"high","source":"Bitdefender Labs"},{"type":"hardware","value":"Wi-Fi MAC OUI A0:53:94","context":"Zediel-registered block seen on affected devices - hunting signal, not proof of infection.","confidence":"medium","source":"Bitdefender Labs"},{"type":"note","value":"Bitdefender's report lists ~120 MD5 hashes; only a subset is reproduced here - pull the full table from the source.","context":"Provenance statement - filter before ingestion.","confidence":"high","source":"analyst note"}],"references":["https://bitdefender.com/en-us/blog/labs/midnight-mimosa-malware","https://securityaffairs.com/"]},{"rank":8,"id":"TI-2026-10-12-008","title":"Working Public Exploit ('AnyPwn') for Pre-Auth AnyDesk Linux Heap Overflow Yielding Root on TCP 7070 (No CVE Assigned)","cve_ids":[],"vendor":"AnyDesk","affected_products":["AnyDesk for Linux 8.0.2 (confirmed); earlier 8.0.x likely (unconfirmed)","Windows and macOS not affected"],"category":"vulnerability","cvss_v3":null,"severity":"high","exploitation_status":"public_poc_available","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-10-08","last_updated":"2026-10-09","confidence":"high","summary":"V12 Security published 'AnyPwn' on 2026-10-08, a working exploit for a pre-authentication heap buffer overflow in AnyDesk for Linux that gives root code execution before the user approves a connection. The bug is in the session protocol handler for mode-5 stream packets, where unchecked 32-bit size arithmetic under-allocates the backing buffer; it is reachable over direct connections on TCP 7070. AnyDesk quietly fixed it in 8.0.3 in June 2026 (changelog: 'fixed a bug that could lead to a crash'), has issued no advisory and no CVE has been assigned, so vulnerability scanners keyed on CVEs will not flag it. The public exploit is probabilistic and offset-tuned for 8.0.2 - failed attempts crash the service, which is itself a useful detection signal. Researchers also reached the vulnerable path through AnyDesk relay servers with a Frida trigger but did not demonstrate a full relay exploit, so 'direct connections only' should not be read as a guarantee. No in-the-wild exploitation is reported yet, but remote-access tools are a favoured ransomware entry point and a weaponised PoC is now public. Ranked for its broad footprint on Linux admin workstations and servers where AnyDesk is often installed outside patch management.","recommended_actions":["Inventory AnyDesk on Linux hosts and upgrade to 8.0.3 or later (8.1.0 current); detect by version, not CVE.","Block inbound TCP 7070 at host and network firewalls; disable direct connections where not needed.","Alert on repeated AnyDesk service crashes/restarts on Linux, a side-effect of failed exploitation.","Review whether AnyDesk is sanctioned at all; remove unsanctioned installs."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"AnyDesk Linux - vulnerable versions (\u003c 8.0.3)","description":"Lists Linux devices with AnyDesk below 8.0.3. No CVE exists, so version comparison is the only TVM route.","query":"DeviceTvmSoftwareInventory\n| where OSPlatform has \"Linux\"\n| where SoftwareName has \"anydesk\"\n| extend v = parse_version(SoftwareVersion)\n| where v \u003c parse_version(\"8.0.3\")\n| project DeviceName, DeviceId, OSPlatform, OSVersion, SoftwareVendor, SoftwareName, SoftwareVersion"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"AnyDesk Linux - inbound direct connections on TCP 7070 from external addresses","description":"Direct-connection attack surface. Accepted inbound 7070 from public IPs on Linux hosts should be rare.","query":"DeviceNetworkEvents\n| where Timestamp > ago(14d)\n| where LocalPort == 7070 and ActionType in (\"InboundConnectionAccepted\",\"ListeningConnectionCreated\")\n| where RemoteIPType == \"Public\" or ActionType == \"ListeningConnectionCreated\"\n| join kind=inner (DeviceInfo | where OSPlatform has \"Linux\" | distinct DeviceId) on DeviceId\n| project Timestamp, DeviceName, ActionType, LocalPort, RemoteIP, InitiatingProcessFileName, InitiatingProcessAccountName\n| sort by Timestamp desc"},{"platform":"sentinel","table":"Syslog","name":"AnyDesk Linux - service crashes (possible failed exploitation)","description":"Failed AnyPwn attempts crash the AnyDesk service; repeated segfaults/restarts are a lead.","query":"Syslog\n| where TimeGenerated > ago(14d)\n| where SyslogMessage has \"anydesk\"\n| where SyslogMessage has_any (\"segfault\",\"core dumped\",\"SIGSEGV\",\"SIGABRT\",\"Main process exited\",\"Failed with result\")\n| summarize Crashes = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Sample = any(SyslogMessage)\n          by Computer\n| where Crashes >= 2\n| sort by Crashes desc"}],"iocs":[{"type":"port","value":"7070/tcp","context":"AnyDesk direct-connection listener reachable pre-auth.","confidence":"high","source":"V12 Security (as relayed by The Hacker News)"},{"type":"behaviour","value":"Repeated AnyDesk service crashes on Linux","context":"Failed probabilistic exploitation crashes the service.","confidence":"medium","source":"V12 Security (as relayed)"},{"type":"note","value":"Public PoC: github.com/v12-security/pocs ('AnyPwn'). No in-the-wild IOCs published.","context":"Provenance statement - filter before ingestion.","confidence":"high","source":"analyst note"}],"references":["https://thehackernews.com/2026/10/researchers-publish-working-exploit-for.html"]},{"rank":9,"id":"TI-2026-10-12-009","title":"Ledger Confirms Unauthorized Hardware Implant in Wallet Sold via Reseller CryptoBilis Amid Reported $86M+ Theft","cve_ids":[],"vendor":"Ledger (via third-party reseller CryptoBilis)","affected_products":["Ledger hardware wallets purchased through CryptoBilis (Southeast Asia) in the last 90 days"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-10-09","last_updated":"2026-10-11","confidence":"medium","summary":"Hardware supply-chain incident confirmed inside this window: on 2026-10-11 Ledger stated it had found an unauthorized hardware implant in one device sold through the reseller CryptoBilis, following reports of drained wallets among Southeast Asian buyers. Ledger describes the affected population as 'limited' and says every confirmed case involves CryptoBilis-sold devices; it has paused sales through the reseller, which has in turn halted all hardware wallet sales pending investigation. On-chain investigator Specter estimates losses above $86 million - a figure Ledger has not confirmed. No technical description of the implant, attacker wallet addresses or transaction hashes have been published, so there are no network IOCs. Enterprise relevance is narrow (treasury/crypto operations and executive personal devices) but the lesson is general: devices bought through non-authorised channels or restocked returns can be tampered with before first use. Ledger advises anyone who bought from this reseller in the last 90 days not to set the device up, and anyone who has to move funds to a new device with a newly generated seed.","recommended_actions":["If your organisation holds digital assets, confirm hardware wallets were bought direct from the vendor or an authorised reseller.","Treat any CryptoBilis-sourced Ledger device bought in the last 90 days as compromised: move assets to a new device with a fresh seed.","Reject any device that arrives with a pre-printed recovery phrase; neither vendor nor reseller will ask for a seed or PIN.","Warn staff about follow-on 'fund recovery' scams targeting victims."],"kql":[{"platform":"sentinel","table":"EmailEvents","name":"Ledger/CryptoBilis - follow-on recovery-scam and phishing lures to staff","description":"Victims of wallet theft are targeted by 'fund recovery' scams. Surfaces inbound mail themed on Ledger/CryptoBilis recovery; tune keywords and exclude legitimate vendor mail.","query":"EmailEvents\n| where Timestamp > ago(14d)\n| where EmailDirection == \"Inbound\"\n| where Subject has_any (\"Ledger\",\"CryptoBilis\") and Subject has_any (\"recover\",\"recovery phrase\",\"seed\",\"refund\",\"compensation\",\"verify\")\n| where SenderFromDomain !in~ (\"ledger.com\")\n| project Timestamp, RecipientEmailAddress, SenderFromAddress, SenderFromDomain, Subject, DeliveryAction, ThreatTypes\n| sort by Timestamp desc"}],"iocs":[{"type":"behaviour","value":"Hardware implant in Ledger device sold via CryptoBilis","context":"Supply-chain tampering; implant details unpublished.","confidence":"high","source":"Ledger statement (as relayed by The Hacker News)"},{"type":"note","value":"No attacker wallet addresses, hashes or network indicators published; $86M loss figure is from investigator Specter and unconfirmed by Ledger.","context":"Provenance statement - filter before ingestion.","confidence":"high","source":"analyst note"}],"references":["https://thehackernews.com/2026/10/ledger-finds-unauthorized-hardware.html"]},{"rank":10,"id":"TI-2026-10-12-010","title":"Malware Infection at Contractor Nippon Columbia Exposes ~8.7 Million Daiichi Kosho (Big Echo) Karaoke Customer and Employee Records","cve_ids":[],"vendor":"Nippon Columbia Group (data processor for Daiichi Kosho)","affected_products":["Daiichi Kosho customer data: BIG ECHO, MEGA BIG, Karaoke CLUB DAM, Banana Club, B-GARAGE, DK Dining"],"category":"incident","cvss_v3":null,"severity":"medium","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-10-09","last_updated":"2026-10-11","confidence":"medium","summary":"Third-party data incident reported on 2026-10-11: Nippon Columbia Group, which processes customer personal data for Daiichi Kosho (Japan's largest karaoke operator, 521 venues including Big Echo), found malware on an employee computer on 2026-10-05 and isolated the system the next day. Data potentially exposed covers about 8,631,000 customer and 93,000 employee records (~8.7M total; headlines citing 8.6M count customers only): names, genders, dates of birth, email addresses and phone numbers, but reportedly no passwords. Daiichi Kosho says its own systems were not breached and it has not confirmed exfiltration or leak; the malware family and any threat actor are undisclosed. Included primarily as a supplier-risk case study - a single infected processor endpoint holding a client's full customer database - and because the exposed fields are ideal for targeted smishing and payment-fraud lures, which Daiichi Kosho has warned customers about. No technical IOCs have been released.","recommended_actions":["Review which of your processors hold bulk customer PII on general-purpose employee endpoints and require segregated, monitored environments.","Confirm contractual breach-notification timelines with data processors (here: 4 days from detection to public statement).","For organisations with Japanese customer bases, prepare for karaoke-/loyalty-themed phishing and smishing lures."],"kql":[{"platform":"defender_xdr","table":"EmailEvents","name":"Daiichi Kosho breach - themed phishing lures","description":"Generic hunt for lures using the affected brands. Adjust to Japanese-language subjects if relevant.","query":"EmailEvents\n| where Timestamp > ago(30d)\n| where EmailDirection == \"Inbound\"\n| where Subject has_any (\"Big Echo\",\"BIG ECHO\",\"Daiichi Kosho\",\"Club DAM\",\"ビッグエコー\",\"第一興商\")\n| project Timestamp, RecipientEmailAddress, SenderFromAddress, SenderFromDomain, Subject, DeliveryAction, ThreatTypes, UrlCount\n| sort by Timestamp desc"}],"iocs":[{"type":"note","value":"No malware family, actor or technical indicators published.","context":"Provenance statement - filter before ingestion.","confiden <script>
(function(){

    exploitation_attempts_reported_unconfirmed:{short:"Attempts seen",    full:"Exploitation attempts reported (unconfirmed)", cls:"st-attempts", seg:"s-attempts"},

  /* ---------- dom helpers (textContent only - no HTML injection) ---------- */
  function el(tag, cls, text){

  function kv(dl, key, val, accent){
    var d = el("div"), dt = el("dt", null, key), dd = el("dd");

    if (!iso) return "—";

    var day = String(d.getUTCDate()).padStart(2,"0");
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    var out = day + " " + mon + " " + d.getUTCFullYear();
    if (String(iso).indexOf("T") > -1){
      out += " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + "Z";
    }
    return out;
  }
  function label(s){
    if (!s) return "—";
    return String(s).replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
  }

  /* ---------- minimal KQL highlighter (safe: builds text nodes only) ---------- */
  var KQL_KW = ("let|where|project|summarize|extend|sort|order|by|join|union|take|limit|distinct|"
    + "count|dcount|countif|sum|make_set|make_list|min|max|any|avg|bin|ago|now|datetime|dynamic|"
    + "todouble|tostring|toint|tolong|strcat|strlen|extract|extract_all|parse_json|coalesce|"
    + "set_intersection|isnotempty|isempty|has|has_any|has_all|has_cs|contains|startswith|"
    + "endswith|in|and|or|not|asc|desc|on|datetime_part|dayofweek|column_ifexists|"
    + "ipv4_is_in_any_range|iff|case|print|top").split("|");
  var KQL_RE = new RegExp("(//[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b("
    + KQL_KW.join("|") + ")\\b", "g");
  function highlight(code){
    var frag = document.createDocumentFragment(), last = 0, m;
    KQL_RE.lastIndex = 0;
    while ((m = KQL_RE.exec(code)) !== null){
      if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
      var span = el("span", m[1] ? "c" : (m[2] ? "s" : "k"), m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
    return frag;
  }

  function copyBtn(getText, labelText){
    var b = el("button","copy", labelText || "Copy");
    b.type = "button";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = getText();
      function done(){
        var old = b.textContent;
        b.textContent = "Copied"; b.classList.add("ok");
        setTimeout(function(){ b.textContent = old; b.classList.remove("ok"); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
      } else { fallback(txt, done); }
    });
    return b;
  }
  function fallback(txt, done){
    var ta = el("textarea"); ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  function renderTiles(){
    var st = DATA.summary_statistics || {}, v = DATA.vulnerabilities || [];

      ["Entries", st.total_entries != null ? st.total_entries : v.length, ""],

  function renderPosture(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];

    var box = document.getElementById("posture"); box.textContent = "";
    if (!present.length || !v.length){ box.hidden = true; return; }

          r.appendChild(el("td","v", i.value));
          var cd = el("td");
          cd.appendChild(el("span","cf " + (i.confidence || "low"), i.confidence || "—"));
          r.appendChild(cd);
          r.appendChild(el("td","ctx", i.context || "—"));
          r.appendChild(el("td","src", i.source || "—"));
          tbody.appendChild(r);
        });
        tb.appendChild(tbody); wrap.appendChild(tb); s5.appendChild(wrap);
      }
      det.appendChild(s5);
    }

    if ((e.references || []).length){
      var s6 = sec("References");
      var u6 = el("ul","refs");
      e.references.forEach(function(r){
        var li6 = el("li"), a = el("a", null, r);
        a.href = r; a.target = "_blank"; a.rel = "noopener noreferrer";
        li6.appendChild(a); u6.appendChild(li6);
      });
      s6.appendChild(u6); det.appendChild(s6);
    }

    li.appendChild(det);

    head.addEventListener("click", function(){
      var open = li.classList.toggle("is-open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
    });
    return li;
  }

  /* ---------- filtering ---------- */
  function haystack(e){
    var parts = [e.title, e.summary, e.vendor, e.id, e.category, e.severity, e.exploitation_status];
    parts = parts.concat(e.cve_ids || [], e.affected_products || [], e.recommended_actions || []);
    (e.iocs || []).forEach(function(i){ parts.push(i.value, i.type, i.context); });
    (e.kql || []).forEach(function(q){ parts.push(q.name, q.table, q.description); });
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function apply(){
    var v = DATA.vulnerabilities || [];
    var q = FILTER.q.trim().toLowerCase();
    var shown = 0;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li, idx){
      var e = v[idx], ok = true;
      if (FILTER.status !== "all" && e.exploitation_status !== FILTER.status) ok = false;
      if (ok && FILTER.kev && !e.kev_listed) ok = false;
      if (ok && FILTER.nopatch && e.patch_available === "yes") ok = false;
      if (ok && q && li._hay.indexOf(q) === -1) ok = false;
      li.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById("count").textContent = shown + " of " + v.length + " shown";
    document.getElementById("empty").hidden = shown !== 0;
  }

  function renderChips(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];
    var counts = {};
    v.forEach(function(e){ counts[e.exploitation_status] = (counts[e.exploitation_status]||0)+1; });
    var box = document.getElementById("status-chips"); box.textContent = "";
    var defs = [["all","All",v.length]];
    order.forEach(function(k){ if (counts[k]) defs.push([k, STATUS[k].short, counts[k]]); });
    defs.forEach(function(d){
      var b = el("button","chip", d[1] + " (" + d[2] + ")");
      b.type = "button";
      b.setAttribute("aria-pressed", FILTER.status === d[0] ? "true" : "false");
      b.addEventListener("click", function(){
        FILTER.status = d[0];
        Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        apply();
      });
      box.appendChild(b);
    });
  }

  /* ---------- provenance ---------- */
  function renderProv(){
    var cm = DATA.collection_metadata || {};
    var box = document.getElementById("prov-body"); box.textContent = "";
    if (cm.collection_method){
      box.appendChild(el("h4", null, "Collection method"));
      box.appendChild(el("p","prose", cm.collection_method));
    }
    if ((cm.limitations || []).length){
      box.appendChild(el("h4", null, "Limitations"));
      var u = el("ul","list");
      cm.limitations.forEach(function(l){ u.appendChild(el("li", null, l)); });
      box.appendChild(u);
    }
    if (cm.confidence_legend){
      box.appendChild(el("h4", null, "Confidence legend"));
      var dl = el("dl");
      Object.keys(cm.confidence_legend).forEach(function(k){
        dl.appendChild(el("dt", null, k));
        dl.appendChild(el("dd", null, cm.confidence_legend[k]));
      });
      box.appendChild(dl);
    }
    var w = (DATA.report || {}).coverage_window || {};
    if (w.note){
      box.appendChild(el("h4", null, "Coverage window note"));
      box.appendChild(el("p","prose", w.note));
    }
    if ((cm.ioc_types_present || []).length){
      box.appendChild(el("h4", null, "IOC types present"));
      box.appendChild(el("p","prose", cm.ioc_types_present.join(", ")));
    }
  }

  /* ---------- boot ---------- */
  function render(data){
    DATA = data;
    renderHead(); renderTiles(); renderPosture(); renderChips(); renderProv();
    var list = document.getElementById("entries"); list.textContent = "";
    (DATA.vulnerabilities || []).forEach(function(e){
      var li = renderEntry(e);
      li._hay = haystack(e);
      list.appendChild(li);
    });
    ALL_OPEN = false;
    document.getElementById("toggle-all").textContent = "Expand all";
    apply();
  }

  document.getElementById("q").addEventListener("input", function(ev){
    FILTER.q = ev.target.value; apply();
  });
  ["f-kev","f-nopatch"].forEach(function(id){
    document.getElementById(id).addEventListener("click", function(){
      var b = document.getElementById(id);
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      FILTER[id === "f-kev" ? "kev" : "nopatch"] = on;
      apply();
    });
  });
  document.getElementById("toggle-all").addEventListener("click", function(){
    ALL_OPEN = !ALL_OPEN;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li){
      li.classList.toggle("is-open", ALL_OPEN);
      var h = li.querySelector(".chead");
      if (h) h.setAttribute("aria-expanded", ALL_OPEN ? "true" : "false");
    });
    this.textContent = ALL_OPEN ? "Collapse all" : "Expand all";
  });

  /* drag & drop any TI JSON */
  var dragDepth = 0;
  window.addEventListener("dragenter", function(ev){ ev.preventDefault(); if (++dragDepth) document.body.classList.add("dragging"); });
  window.addEventListener("dragover",  function(ev){ ev.preventDefault(); });
  window.addEventListener("dragleave", function(){ if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("drop", function(ev){
    ev.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var parsed = JSON.parse(fr.result);
        if (!parsed || !parsed.vulnerabilities) throw new Error("not a TI output config");
        render(parsed);
        window.scrollTo(0,0);
      } catch(err){
        alert("Could not load that file: " + err.message);
      }
    };
    fr.readAsText(f);
  });

  /* embedded data first (works offline from file://); refresh from the sibling
     JSON when served over http(s) so a hosted copy always shows today's feed */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("ti-data").textContent); } catch(e){}
  if (embedded && embedded.vulnerabilities) render(embedded);

  if (location.protocol === "http:" || location.protocol === "https:"){
    fetch("ti-output-config.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      if (j && j.vulnerabilities){
        var a = (j.report||{}).check_performed_at, b = (embedded&&embedded.report||{}).check_performed_at;
        if (a !== b) render(j);
      }
    }).catch(function(){ /* offline or no sibling file - embedded copy stands */ });
  }
})();
</script>
</body>
</html>
