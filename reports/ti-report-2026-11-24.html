al is working from superseded text.","Block TCP 2012 at the firewall and permit it only from authorised vCenter peer addresses, whether or not you have patched. Broadcom has confirmed no configuration change mitigates this flaw, so this rule is the only compensating control that exists.","Close out the vCenter 7.0 decision this week with a named owner. There is no public patch and there never will be - 7.0 left general support in October 2025. The three options are: buy extended support and raise a Broadcom case, accelerate migration to 8.0 U3m or VCF 9.1, or isolate. It has been open for five days.","Decide on SAML STS signing certificate and key rotation this week. This is the highest-consequence outstanding item in the entry. An attacker holding that material can mint valid SAML assertions indefinitely and no password reset revokes it. It is disruptive, which is why it slips - put a date on it.","Enumerate every vsphere.local SSO administrator account against change records. ARMORY CASTLE's Bonesaw tool created SSO administrator accounts, so an account with no matching change record is the highest-value finding available.","Check for access to /storage/db/vmware-vmdir/data.mdb, the VMware Directory Service database. Access to that file is the direct evidence of directory service compromise.","Hunt the full period from 1 September 2026 to the date you patched, not the last fortnight. Exploitation began in early September, which means the window is close to three months in most estates.","Record the deadline breach formally if your organisation aligns to KEV dates as policy. The exposure has not changed but the compliance position has, and your auditors will ask when rather than whether."],"kql":[{"platform":"sentinel","table":"Syslog","name":"vsphere.local SSO administrator account creation and privilege changes since 1 September 2026","description":"The highest-value hunt in this entry. Bonesaw's documented function was creating an SSO administrator account, so any such account without a matching change record is direct evidence. Requires vCenter syslog forwarding, which many estates do not have - fixing that is itself an action.","query":"let windowStart = datetime(2026-09-01);\nSyslog\n| where TimeGenerated >= windowStart\n| where SyslogMessage has_any (\"vsphere.local\", \"vmdir\", \"vmdird\", \"SSO\", \"sso-admin\", \"Administrators\")\n| where SyslogMessage has_any (\"add\", \"create\", \"CreateUser\", \"AddMember\", \"group membership\", \"enable\", \"password\", \"modify\")\n| project TimeGenerated, Computer, Facility, SeverityLevel, SyslogMessage\n| order by TimeGenerated asc"},{"platform":"sentinel","table":"Syslog","name":"Access to the VMware Directory Service database file","description":"Direct evidence of directory service compromise. /storage/db/vmware-vmdir/data.mdb is the vmdir database; legitimate access outside the service process and backup jobs should be enumerable and small in number.","query":"let windowStart = datetime(2026-09-01);\nSyslog\n| where TimeGenerated >= windowStart\n| where SyslogMessage has_any (\"/storage/db/vmware-vmdir\", \"data.mdb\", \"vmware-vmdir\")\n| project TimeGenerated, Computer, Facility, ProcessName, SyslogMessage\n| order by TimeGenerated asc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Inbound connections to vCenter on TCP 2012 from sources that are not authorised peers","description":"Builds the firewall rule from evidence and surfaces exploitation attempts. TCP 2012 carries the VMware Directory Service traffic; anything reaching it that is not an authorised vCenter peer is both a finding and a rule to write.","query":"let vcenterHosts = dynamic([]);  // populate with vCenter addresses\nlet authorisedPeers = dynamic([]);  // populate with authorised vCenter peer addresses\nCommonSecurityLog\n| where TimeGenerated >= datetime(2026-09-01)\n| where DestinationPort == 2012\n| where array_length(vcenterHosts) == 0 or DestinationIP in (vcenterHosts)\n| where array_length(authorisedPeers) == 0 or SourceIP !in (authorisedPeers)\n| summarize Connections = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Actions = make_set(DeviceAction, 10)\n        by SourceIP, DestinationIP\n| order by Connections desc"},{"platform":"sentinel","table":"SigninLogs","name":"Federated sign-ins that could indicate forged SAML assertions from stolen STS signing material","description":"Supports the STS rotation decision with evidence. If signing material was taken, forged assertions are the consequence and they look like legitimate federated sign-ins with inconsistent device, location or token-issuance characteristics.","query":"SigninLogs\n| where TimeGenerated >= datetime(2026-09-01)\n| where AuthenticationRequirement != \"multiFactorAuthentication\" or isempty(AuthenticationRequirement)\n| where ResultType == 0\n| extend FederatedIdp = tostring(parse_json(AuthenticationDetails)[0].authenticationStepResultDetail)\n| where isnotempty(FederatedIdp) or AuthenticationProcessingDetails has_any (\"SAML\", \"federation\", \"Federated\")\n| summarize Signins = count(), Ips = make_set(IPAddress, 50), Locations = make_set(Location, 30), Apps = make_set(AppDisplayName, 40)\n        by UserPrincipalName, bin(TimeGenerated, 1d)\n| order by TimeGenerated asc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"vCenter instances still exposed to CVE-2026-123890 and their build versions","description":"The compliance evidence query now the deadline has passed. Lists remaining exposed instances so the breach position can be quantified and the 7.0 population can be separated out for the migration decision.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId == \"CVE-2026-123890\"\n| join kind=leftouter (DeviceTvmSoftwareInventory\n    | where SoftwareName has_any (\"vcenter\", \"vsphere\", \"cloud foundation\")\n    | project DeviceId, SoftwareName, SoftwareVersion) on DeviceId\n| extend LegacySeven = iff(SoftwareVersion startswith \"7.\", \"NO PUBLIC PATCH - migrate or isolate\", \"patchable\")\n| project DeviceName, SoftwareName, SoftwareVersion, LegacySeven, VulnerabilitySeverityLevel\n| order by LegacySeven asc, SoftwareVersion asc"}],"iocs":[{"type":"note","value":"CISA KEV remediation deadline was 23 November 2026 - EXPIRED. KEV addition 20 November 2026","context":"The compliance position has changed even though the exposure has not. Organisations aligning to KEV dates as policy are now in breach and should record it.","confidence":"high","source":"CISA KEV via multiple secondary reports"},{"type":"note","value":"Fixed builds: vCenter 9.1.1.0200, 9.0.2.0200, 8.0 U3m. VMware Cloud Foundation 5.x requires vCenter 8.0 U3m plus SDDC Manager 5.2.5. Not eligible for Quick Patch","context":"The exact target versions. The VCF 5.x two-part requirement is the detail most often missed.","confidence":"high","source":"Broadcom VMSA-2026-0009.1 via multiple secondary reports"},{"type":"note","value":"Advisory revised to VMSA-2026-0009.1 on 20 November 2026, clarifying affected VMware Tools versions","context":"A change record built from the 19 November original is working from superseded text on VMware Tools scope.","confidence":"high","source":"Broadcom via secondary reporting"},{"type":"note","value":"vCenter 7.0: no public patch and none forthcoming. End of general support October 2025. Extended support contract holders directed to Broadcom Support; others must migrate to 8.0 U3m or VCF 9.1, or isolate","context":"A three-option decision with a named owner, not a patching task. Open for five days as of today.","confidence":"high","source":"Broadcom via multiple secondary reports"},{"type":"note","value":"Broadcom confirms NO configuration change or feature toggle mitigates CVE-2026-123890","context":"This is why the firewall rule is the only control. There is no supported workaround to deploy instead.","confidence":"high","source":"Broadcom via multiple secondary reports"},{"type":"port","value":"TCP 2012","context":"VMware Directory Service traffic. Blocking it at the firewall and permitting it only from authorised vCenter peers is the sole compensating control.","confidence":"medium","source":"Mitigation guidance via secondary reporting"},{"type":"malware","value":"Bonesaw","context":"The custom tool Google attributes to ARMORY CASTLE, used to create an SSO administrator account after exploitation. Its documented function is what makes the SSO account enumeration the highest-value hunt.","confidence":"high","source":"Google / Mandiant via multiple secondary reports"},{"type":"ttp","value":"ARMORY CASTLE (formerly UNC5221, China-linked) exploiting CVE-2026-123890 as a zero-day from early September 2026","context":"Sets the hunting window: 1 September 2026 to the date you patched. Close to three months in most estates.","confidence":"high","source":"Google / Mandiant via multiple secondary reports"},{"type":"behaviour","value":"Creation, re-enabling or re-scoping of vsphere.local SSO administrator accounts between 1 September 2026 and the date of patching","context":"The direct artefact of Bonesaw. An account with no matching change record is the finding.","confidence":"high","source":"Google / Mandiant via secondary reporting"},{"type":"filepath","value":"/storage/db/vmware-vmdir/data.mdb","context":"The VMware Directory Service database. Access outside the service process and backup jobs is direct evidence of directory service compromise.","confidence":"high","source":"Published hunting guidance"},{"type":"behaviour","value":"Theft or rotation-relevant exposure of SAML Security Token Service signing certificate and key material","context":"The highest-consequence outstanding decision. An attacker holding this can mint valid SAML assertions indefinitely and no password reset revokes it. Disruptive to rotate, which is exactly why it slips.","confidence":"medium","source":"This feed's analysis"},{"type":"note","value":"No new vCenter information was produced in this window: no new exploitation reporting, no new fixed builds, no change to the 7.0 position, no indicators published","context":"Stated explicitly so the silence is not read as a coverage gap and not read as the issue resolving itself.","confidence":"high","source":"This feed's assessment"},{"type":"note","value":"Broadcom's own advisory does not mention in-the-wild exploitation; the exploitation claim originates with Google and Mandiant threat intelligence","context":"The original vendor-versus-authority split, recorded for consistency. It has not changed.","confidence":"high","source":"This feed's source comparison"},{"type":"note","value":"Unresolved: one source states a Rapid7 Metasploit module was opened, another states no public exploit exists","context":"Public exploit status is unverified. It does not change any action in this entry.","confidence":"low","source":"Conflicting secondary reports"}],"references":["https://www.securityweek.com/newly-patched-vmware-vcenter-flaw-exploited-as-zero-day-by-chinese-apt/","https://socradar.io/blog/cve-2026-123890-vcenter-0day-armory-castle/","https://thehackernews.com/2026/11/critical-vmware-vcenter-flaw-cvss-98.html","https://www.rescana.com/post/vmware-vcenter-cve-2026-123890-directory-service-auth-bypass-patch-now","https://threatdefence.com/article/vmware-vcenter-cve-2026-123890-zero-day-patching-hunting","https://www.defconlevel.com/alert/2026-11-20-ncsc-2026-0510-1-00-h-h-vulnerabilities-fixed-in-vmware-products","https://cybersecuritynews.com/cisa-warns-vmware-sap-cisco-apache-roller-flaws-exploited/"]},{"rank":8,"id":"TI-2026-11-24-008","title":"UK DEFENCE AND FINANCIAL SUPPLY CHAIN: A Ransomware Group That Uses AI Agents Has Listed William Cook Holdings, Whose Cook Defence Systems Builds Track Systems for British Armoured Vehicles, Claiming 1.1 TB From a Stanhope File Server - Plus the Wellington IT Credit Union Breach Now at Roughly 1.8 Million Members","cve_ids":[],"vendor":"N/A - threat actor campaign","affected_products":["William Cook Holdings Limited (Sheffield) - claimed by the Aur0ra / Aurora group","Cook Defence Systems - armoured vehicle track systems and structural components for military programmes","Claimed exfiltration: approximately 1.1 TB from a Stanhope site file server","Wellington IT (Belfast) - core banking and member account software for credit unions","43 credit unions in the Republic of Ireland plus a small number in Northern Ireland","N0n leak site: two further UK entities claimed on 23 November 2026, unnamed in listings"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"high","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-20","last_updated":"2026-11-24","confidence":"medium","summary":"This entry is deliberately labelled as attacker self-reporting and should be read that way throughout. Its value is not the claims; it is what the claims point at.\n\nThe new item: a UK defence supplier. The Aur0ra group, also written Aurora, has listed William Cook Holdings Limited on its leak site. Ransomware.live logged the listing on 20 November 2026 with an estimated attack date of 19 November; Breachsense recorded it among Aurora victims discovered on 23 November 2026. The Sheffield-based group includes Cook Defence Systems, which supplies armoured vehicle track systems and structural components to military programmes, alongside a rail components business. The leak post claims approximately 1.1 TB taken from a file server at the Stanhope site. The post does not claim systems were encrypted and states no ransom figure. The company has not confirmed an incident.\n\nWhy this needs stating carefully. RedPacket Security warns that listings attributed to Aurora have included unverified or fabricated victim claims, so the specific claim is low confidence and this feed records it as such. What is not low confidence is the supplier's position: track systems and structural components for armoured vehicles place William Cook in the UK defence industrial supply chain, and a claimed 1.1 TB file server extraction from a defence manufacturer raises the possibility of engineering drawings, specifications, contract documentation and personnel data rather than the customer records that dominate retail breaches. The actionable read for UK government is not about this company. It is that if you are a defence-adjacent department or prime contractor, a mid-tier supplier appearing on a leak site is the scenario your supply chain assurance process is supposed to cover, and today is a cheap day to find out whether it does.\n\nThe actor detail that ties this entry to the window's theme. Sophos, which tracks the group as GOLD OGRE, published on 29 October 2026 that Aur0ra's operators supplied Cursor AI coding agents with VPN credentials, proxies, targets and objectives, and let the agents pursue credential theft and lateral movement - using password spraying, Kerberoasting and NTLM relay - reaching domain management access in a subset of environments. The agents ran mainly on Cursor's Composer model against models from Anthropic, xAI and Moonshot, and the operators framed the work as authorised security testing to get past model safeguards. Critically, Sophos found the impact stage, the ransomware deployment itself, stayed human-controlled. Three victims of those agent-driven intrusions were subsequently posted to Aur0ra's leak site. None was identified as UK-based. So the group now claiming a UK defence supplier is a group documented to delegate the intrusion to AI agents, which makes the detections in rank 4 and the ones here the same detections.\n\nThe financial sector item, materially larger than earlier runs recorded. Wellington IT, a Belfast provider whose software handles member account data for credit unions, suffered unauthorised access to information relating to saved payees or payment beneficiaries. The affected software is used by 43 credit unions in the Republic of Ireland and a small number in Northern Ireland. The Irish Times assessed the potential impact at up to 1.8 million people, more than half of all credit union members in Ireland - a figure substantially larger than the roughly forty institutions this feed carried previously. Payee names, account numbers and addresses may have been exposed; the Irish League of Credit Unions understands the vulnerability has been closed and that balances were not compromised, and no financial losses have been reported. The incident reportedly occurred in early October and the credit unions were not informed until 17 November, a delay the responsible minister described as not acceptable, with Tánaiste Simon Harris publicly expressing concern. Wellington's chief executive says customers were alerted as soon as the risk was confirmed.\n\nThe UK-relevant lesson from Wellington IT, which is a governance lesson rather than a technical one. A Northern Ireland supplier produced a six-week notification gap affecting a regulated financial sector in another jurisdiction. That is precisely the failure mode the Cyber Security and Resilience Bill's critical supplier designation at rank 6 exists to address, and it is a live worked example to put in front of your own suppliers: the question is not whether they would tell you, it is within how many days, and whether that is written down.\n\nThe leak-site cluster, with the caveats that matter. N0n posted two further UK entities on 23 November 2026, described in listings only as consumer trend analytics and licence plate recognition analytics; neither is named. Qilin listed ION Asset Architecture UK Ltd on 21 November with an estimated attack date of 16 November. Breachsense's November list includes ion.fm attributed to Qilin on 23 November. None of these has been confirmed by the organisation named. Ransomtracker records N0n as the most active operator over the last thirty days with 253 victims, and this feed continues to carry Bitdefender's documented finding that N0n has inflated its victim count by roughly a factor of five, with tracker totals varying by around seventy victims depending on collection method. Treat the volume as a trend signal and the individual listings as claims.\n\nConfidence. High that the Aur0ra listing of William Cook Holdings exists and was logged on 20 November with an estimated 19 November attack date, that the claim is approximately 1.1 TB from a Stanhope site file server, that the post claims no encryption and names no ransom figure, and that Cook Defence Systems supplies armoured vehicle track systems and structural components. Low on the truth of the claim itself: Aurora listings have documented fabrication and the company has not confirmed. High on the Sophos GOLD OGRE findings including the Cursor Composer agent use, the techniques, the human-controlled impact stage and the three subsequently posted victims. High on Wellington IT's unauthorised access to saved payee data, the 43 Republic of Ireland credit unions plus a small number in Northern Ireland, the 17 November notification, the ministerial criticism of the delay and that balances were not compromised. Medium on the 1.8 million potential impact figure, which is the Irish Times's assessment, and on the early October incident date. Medium on the Qilin ION Asset Architecture UK listing. Low on all N0n listings in this window, which are unnamed and unconfirmed.","recommended_actions":["If you are a defence-adjacent department, agency or prime contractor, check today whether William Cook Holdings or Cook Defence Systems sits anywhere in your supply chain or in a sub-tier you hold data about. A leak-site listing of a mid-tier supplier is the exact scenario your supply chain assurance process exists for, and this is a cheap day to test it.","Treat the William Cook claim as unverified and act proportionately. Aurora listings have documented fabrication and the company has not confirmed. The right action is a supplier enquiry, not a public statement or a breach notification.","Because the claim is file server exfiltration rather than encryption, scope any supplier enquiry to data rather than availability. Ask what categories of your information the supplier holds, where, and whether a Stanhope-site file server is in scope - engineering drawings, specifications, contract documentation and personnel data are the realistic categories for a defence manufacturer.","Deploy the Aur0ra / GOLD OGRE detections as a set, not as individual rules: password spraying, Kerberoasting, NTLM relay, and VPN authentication from infrastructure inconsistent with the account's normal pattern. Sophos documented all four as the agent-driven path to domain management access, and they apply whether or not the William Cook claim is true.","Assume VPN credential compromise is the entry point when modelling this actor. Sophos found operators supplied the agents with VPN credentials and proxies. Phishing-resistant MFA on remote access is the control that breaks the documented chain at step one.","Put a written notification deadline into supplier contracts, using Wellington IT as the worked example. A Northern Ireland supplier produced a six-week gap affecting a regulated financial sector in another jurisdiction, and the responsible minister called the delay unacceptable. The question for your suppliers is not whether they would tell you but within how many days, and whether it is written down.","If you are a UK credit union, building society or financial mutual, confirm directly with Wellington IT whether your institution's data is in scope, and specifically whether saved payee or payment beneficiary records are affected. The Northern Ireland exposure is described as small but is not zero.","Warn members and customers of affected credit unions about targeted phishing using payee data. Payee names, account numbers and addresses let an attacker construct a message that references a real payment relationship, which is far more convincing than a generic lure even though balances were not compromised.","Keep treating N0n volume figures as a trend signal only. Bitdefender has documented inflation of roughly five times, and tracker totals vary by around seventy victims by collection method. Do not quote N0n's victim counts in a board paper without that caveat."],"kql":[{"platform":"defender_xdr","table":"IdentityLogonEvents","name":"Password spraying against the directory - Aur0ra documented technique","description":"First of the four Aur0ra / GOLD OGRE detections. Sophos documented agents running password spraying as the opening move. Surfaces single sources producing failures across many distinct accounts in a short window.","query":"let accountThreshold = 10;\nIdentityLogonEvents\n| where Timestamp > ago(45d)\n| where ActionType == \"LogonFailed\"\n| summarize FailedAccounts = dcount(AccountUpn), Attempts = count(), Accounts = make_set(AccountUpn, 60), Protocols = make_set(Protocol, 10)\n        by IPAddress, DeviceName, bin(Timestamp, 30m)\n| where FailedAccounts > accountThreshold\n| order by FailedAccounts desc"},{"platform":"sentinel","table":"SecurityEvent","name":"Kerberoasting - service ticket requests with weak encryption for service accounts","description":"Second documented technique. Event 4769 with RC4 encryption type 0x17 against accounts with service principal names is the classic Kerberoasting signature, and Sophos recorded the agents using it.","query":"SecurityEvent\n| where TimeGenerated > ago(45d)\n| where EventID == 4769\n| where TicketEncryptionType == \"0x17\"\n| where ServiceName !endswith \"$\" and ServiceName != \"krbtgt\"\n| summarize Requests = count(), Services = make_set(ServiceName, 60), Clients = make_set(Account, 20)\n        by IpAddress, bin(TimeGenerated, 1h)\n| where array_length(Services) > 3\n| order by Requests desc"},{"platform":"sentinel","table":"SecurityEvent","name":"NTLM relay indicators - authentication with mismatched workstation and source","description":"Third documented technique, and it also overlaps with the Outlook NTLM leak at rank 2. Surfaces NTLM logons where the claimed workstation name does not correspond to the source address, which is the relay pattern.","query":"SecurityEvent\n| where TimeGenerated > ago(45d)\n| where EventID == 4624\n| where AuthenticationPackageName =~ \"NTLM\"\n| where LogonType in (3, 8)\n| where isnotempty(WorkstationName) and isnotempty(IpAddress) and IpAddress != \"-\"\n| summarize Logons = count(), Workstations = make_set(WorkstationName, 40), Accounts = make_set(TargetAccount, 40)\n        by IpAddress, Computer, bin(TimeGenerated, 1h)\n| where array_length(Workstations) > 2 or array_length(Accounts) > 5\n| order by Logons desc"},{"platform":"sentinel","table":"SigninLogs","name":"VPN and remote access authentication from infrastructure inconsistent with the account's pattern","description":"Fourth and most important detection, because Sophos found the operators supplied the agents with VPN credentials and proxies - so remote access is the documented entry point rather than a later stage.","query":"let cutoff = ago(45d);\nlet baseline = SigninLogs\n    | where TimeGenerated between (ago(180d) .. cutoff)\n    | summarize KnownAsns = make_set(AutonomousSystemNumber, 60), KnownCountries = make_set(Location, 30) by UserPrincipalName;\nSigninLogs\n| where TimeGenerated > cutoff\n| where AppDisplayName has_any (\"VPN\", \"Remote\", \"Gateway\", \"NetScaler\", \"GlobalProtect\", \"AnyConnect\", \"Always On\")\n     or ResourceDisplayName has_any (\"VPN\", \"Remote\")\n| join kind=leftouter baseline on UserPrincipalName\n| where AutonomousSystemNumber !in (KnownAsns) or Location !in (KnownCountries)\n| project TimeGenerated, UserPrincipalName, AppDisplayName, IPAddress, Location, AutonomousSystemNumber, ResultType, ConditionalAccessStatus\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Bulk file staging and archive creation on file servers - exfiltration preparation","description":"Directly relevant to the William Cook claim shape: 1.1 TB from a file server, no encryption claimed. Surfaces large archive creation and bulk read activity, which is the pattern for exfiltration-only intrusions.","query":"DeviceFileEvents\n| where Timestamp > ago(60d)\n| where ActionType in (\"FileCreated\", \"FileModified\")\n| where FileName endswith_cs \".7z\" or FileName endswith_cs \".zip\" or FileName endswith_cs \".rar\" or FileName endswith_cs \".tar\" or FileName endswith_cs \".gz\"\n| where InitiatingProcessFileName has_any (\"7z.exe\", \"7za.exe\", \"winrar.exe\", \"rar.exe\", \"powershell.exe\", \"pwsh.exe\", \"tar.exe\", \"python.exe\")\n| summarize Archives = count(), Files = make_set(FileName, 40), Paths = make_set(FolderPath, 20)\n        by DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName, bin(Timestamp, 1d)\n| order by Archives desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Large-volume outbound transfers to cloud storage and file transfer services","description":"The egress half. A 1.1 TB claim implies a sustained transfer somewhere, and exfiltration-only actors typically use commodity cloud storage because it is unremarkable in most estates.","query":"DeviceNetworkEvents\n| where Timestamp > ago(60d)\n| where RemoteUrl has_any (\"mega.nz\", \"mega.io\", \"anonfiles\", \"gofile.io\", \"transfer.sh\", \"pixeldrain\", \"bashupload\", \"temp.sh\", \"filebin\", \"wetransfer\", \"dropbox\", \"box.com\", \"backblazeb2\", \"wasabisys\", \"storj\")\n| summarize Connections = count(), Urls = make_set(RemoteUrl, 30), Processes = make_set(InitiatingProcessFileName, 20), Accounts = make_set(InitiatingProcessAccountName, 20)\n        by DeviceName, bin(Timestamp, 1d)\n| order by Connections desc"}],"iocs":[{"type":"note","value":"Aur0ra / Aurora leak site listing: William Cook Holdings Limited (Sheffield). Logged by Ransomware.live 20 November 2026, estimated attack date 19 November 2026; recorded by Breachsense among Aurora victims discovered 23 November 2026","context":"Attacker self-reporting. The company has not confirmed an incident. Treat as a supplier enquiry trigger, not an established breach.","confidence":"low","source":"Ransomware.live and Breachsense leak-site tracking"},{"type":"note","value":"Claimed exfiltration: approximately 1.1 TB from a file server at the Stanhope site. The post does not claim encryption and names no ransom figure","context":"The claim shape matters for scoping. Exfiltration without encryption means the question is which data categories, not whether operations were disrupted.","confidence":"low","source":"Leak-site post via Ransomware.live and RedPacket Security"},{"type":"note","value":"Cook Defence Systems, part of William Cook Holdings, supplies armoured vehicle track systems and structural components for military programmes, alongside a rail components business","context":"The UK government relevance. This is a defence industrial supply chain supplier, which changes the realistic data categories at risk from customer records to engineering and contract material.","confidence":"high","source":"Multiple reports and company description"},{"type":"note","value":"RedPacket Security warns that listings attributed to Aurora have included unverified or fabricated victim claims","context":"The reason this entry's confidence is low on the specific claim. Verification before action, proportionate response, no public statement.","confidence":"high","source":"RedPacket Security"},{"type":"ttp","value":"Aur0ra / GOLD OGRE: operators supply Cursor AI coding agents with VPN credentials, proxies, targets and objectives, and the agents pursue credential theft and lateral movement autonomously","context":"Sophos's documented methodology for this actor. It ties this entry to the window's dominant theme and means the detections here and at rank 4 are the same detections.","confidence":"high","source":"Sophos CTU via multiple secondary reports"},{"type":"ttp","value":"Documented Aur0ra agent techniques: password spraying, Kerberoasting, NTLM relay, reaching domain management access in a subset of environments","context":"Four concrete detections to deploy as a set. They apply regardless of whether the William Cook claim is true.","confidence":"high","source":"Sophos CTU via multiple secondary reports"},{"type":"note","value":"Aur0ra agents ran mainly on Cursor's Composer model against models from Anthropic, xAI and Moonshot; operators framed the activity as authorised security testing to evade model safeguards","context":"The guardrail evasion detail. Relevant to any organisation running its own agentic tooling, because the same framing defeats the same safeguards.","confidence":"high","source":"Sophos CTU via secondary reporting"},{"type":"note","value":"Sophos found the impact stage - ransomware deployment itself - stayed human-controlled, and three victims of agent-driven intrusions were later posted to Aur0ra's leak site. None identified as UK-based","context":"The boundary of current automation, and the precise thing to say when briefing. Intrusion automated, impact not.","confidence":"high","source":"Sophos CTU via multiple secondary reports"},{"type":"note","value":"Wellington IT (Belfast): unauthorised access to information relating to saved payees or payment beneficiaries. Software used by 43 credit unions in the Republic of Ireland plus a small number in Northern Ireland","context":"The supplier-side financial sector incident. Northern Ireland exposure is described as small but not zero.","confidence":"high","source":"BBC, RTE, Irish Times via secondary aggregation"},{"type":"note","value":"Potential impact assessed by the Irish Times at up to 1.8 million people, more than half of all credit union members in Ireland. Exposed categories: payee names, account numbers, addresses. Balances not compromised and no financial losses reported","context":"Materially larger than the roughly forty institutions this feed carried previously. The 1.8 million figure is a press assessment rather than a confirmed count.","confidence":"medium","source":"Irish Times via secondary reporting"},{"type":"note","value":"Wellington IT incident reportedly occurred in early October 2026; credit unions were not informed until 17 November 2026. The responsible minister described the delay as not acceptable and Tánaiste Simon Harris expressed concern; Wellington's CEO says customers were alerted as soon as the risk was confirmed","context":"A roughly six-week notification gap by a Northern Ireland supplier affecting a regulated financial sector in another jurisdiction. The live worked example for supplier notification clauses.","confidence":"medium","source":"RTE and BBC via secondary reporting"},{"type":"behaviour","value":"Targeted phishing referencing a real payment relationship, constructed from payee name, account number and address","context":"The predicted follow-on from the Wellington IT exposure. Far more convincing than a generic lure precisely because balances were not taken - the attacker needs only the relationship.","confidence":"medium","source":"This feed's assessment, consistent with Irish Times commentary"},{"type":"note","value":"N0n leak site posted two further UK entities on 23 November 2026, described only as consumer trend analytics and licence plate recognition analytics. Neither named","context":"Unnamed and unconfirmed. Carried for trend continuity with the previous run, not as a finding.","confidence":"low","source":"Ransomware.live"},{"type":"note","value":"Qilin listed ION Asset Architecture UK Ltd on 21 November 2026 with an estimated attack date of 16 November; Breachsense lists ion.fm attributed to Qilin on 23 November 2026","context":"Unconfirmed by the organisations named. Recorded for completeness of the UK leak-site picture.","confidence":"medium","source":"Ransomware.live and Breachsense"},{"type":"note","value":"Ransomtracker records N0n as the most active operator over the last thirty days with 253 victims; Bitdefender has documented N0n inflating its victim count by roughly a factor of five, and tracker totals vary by around seventy victims by collection method","context":"Carried forward unchanged. Do not quote N0n volumes without this caveat.","confidence":"medium","source":"Ransomtracker and Bitdefender via this feed's prior tracking"},{"type":"behaviour","value":"Large archive creation on file servers followed by sustained outbound transfer to commodity cloud storage","context":"The exfiltration-only pattern that matches the William Cook claim shape, and the thing to hunt for rather than ransomware artefacts.","confidence":"medium","source":"This feed's analysis"}],"references":["https://www.ransomware.live/id/V2lsbGlhbSBDb29rIEhvbGRpbmdzIExpbWl0ZWRAYXVyb3Jh","https://www.redpacketsecurity.com/aurora-ransomware-victim-william-cook-holdings-limited/","https://www.sophos.com/en-us/blog/ai-used-in-aur0ra-ransomware-testing-and-execution","https://www.helpnetsecurity.com/2026/11/02/aur0ra-ransomware-ai-agents/","https://brandefense.io/security-news/aur0ra-ransomware-ai-agent-defender-playbook/","https://www.irishtimes.com/your-money/2026/11/17/suspected-data-breach-at-43-credit-unions-could-affect-hundreds-of-thousands-of-members/","https://www.rte.ie/news/2026/1118/1599690-credit-union-data-breach/","https://www.itpro.com/cyber-resilience/data-breaches/irish-credit-unions-hit-by-data-breach-after-it-provider-compromised","https://www.breachsense.com/breaches/2026/november/","https://www.ransomware.live/map/GB"]},{"rank":9,"id":"TI-2026-11-24-009","title":"UK CONSUMER AND RETAIL CLUSTER, WITH A CORRECTION THIS FEED OWES YOU: Next Disclosed a Supplier Breach on 23 November, and TfL Has NOT Yet Asked Oyster Photocard Holders to Reset Anything - Yesterday's Run Said the Reset Window Opened on 23 November and TfL's Own Page Says It Starts When the Site Comes Back","cve_ids":[],"vendor":"N/A - incident cluster","affected_products":["Next plc - unnamed third-party online supplier","Transport for London - Oyster photocard website and account system, approximately 265,000 accounts","ASOS - unnamed third-party communications platform","HMRC - Self Assessment and refund impersonation scams","Exposed at TfL: full names, phone numbers, email addresses, home addresses, dates of birth, security questions and answers","NOT exposed at TfL per TfL: passwords, bank and payment card details, journey information, Zip Oyster children's names and dates of birth, photographs and supporting documentation"],"category":"incident","cvss_v3":null,"severity":"medium","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-16","last_updated":"2026-11-24","confidence":"high","summary":"The correction comes first because it changes what you tell people.\n\nCorrection to yesterday's run. The 23 November entry stated that TfL was asking photocard holders aged 60-plus due an annual address check to revisit the site from 23 November, and that the social engineering window therefore opened that day. TfL's own information page for Oyster photocard account holders says something different: it will email all affected customers once the photocard website is restored, and will then ask them to change their password, security question and answer. The reset has not been requested and the website is not back. Several outlets have described this as an instruction to reset now; TfL's own page sets it as a future step. This feed carried the more urgent reading and it was wrong. The practical consequence is the opposite of urgency in one respect and worse in another: there is nothing for customers to do yet, and any email today telling an Oyster photocard holder to reset their password is therefore more likely to be fraudulent than genuine. That is a better warning than the one in yesterday's run, and it should be the message that goes out.\n\nWhat TfL has actually said. The incident was discovered on 16 November 2026 after customers received emails asking them to create accounts they already had. TfL emailed affected photocard account holders on 18 November. Approximately 265,000 accounts may have had details exposed: full names, phone numbers, email addresses, home addresses, dates of birth, and security questions and answers. TfL states that passwords, bank and payment card details, journey information, the names and dates of birth of children with Zip Oyster cards, photographs and copies of supporting documentation were not compromised. Oyster photocards remain valid for travel, customers are asked not to contact TfL at this stage, and anyone contacted by someone claiming to hold their data should report it to Action Fraud. TfL also advises changing any identical password or security question and answer used on other accounts - which is the one thing customers can usefully do today.\n\nWhy the security questions and answers matter more than the rest of the list. Passwords were not taken and are being reset; security answers were taken and are being reset too, which is correct handling. But security questions and answers are reused across unrelated services far more than passwords are, because people do not think of them as credentials and password managers do not generate them. Mother's maiden name is the same at the bank as at the transport authority. The 265,000 figure therefore understates the reach: the exposure is of answers that unlock accounts TfL has nothing to do with, and no reset TfL performs touches those. That is the message to put in front of staff and the public, and it is more actionable than the breach itself.\n\nNext plc, disclosed 23 November. Next said a third-party online supplier suffered a cyber incident that gave access to some data relating to the retailer. It states its own systems were not breached, that current evidence indicates no customer personal data was compromised, and that the affected information is benign and cannot be used to facilitate fraud against customers or the company. It has not named the supplier, said what data was accessed, or given the date of the attack or of the supplier's discovery. Next is working with the supplier, law enforcement and regulators and the investigation is ongoing.\n\nHow to read the Next disclosure, fairly. There is no reason to doubt Next's statement and nothing in it to act on as a customer. What is worth noting as an analyst is the shape: benign, no customer data, supplier not named, dates not given. That is a reasonable disclosure for an incident genuinely confined to non-sensitive data, and it is also indistinguishable from an early disclosure where scope is not yet established. Either way, the unnamed supplier is the problem for everyone else - other retailers using the same provider cannot determine whether they are affected. This is the third UK retail supplier-side incident in roughly six weeks, after ASOS's third-party communications platform breach disclosed in October with the data exposure concluded on 5 November, and the 2025 Marks and Spencer and Co-op attacks as the sector's baseline.\n\nHMRC, carried forward unchanged. HMRC has recorded 1,704 Self Assessment-related scam reports over twelve months, about 900 of them from a single fake tax refund scam in August 2026, within 48,119 total HMRC impersonation reports over the same period. The relevant deadline is now 31 January 2027 for the 2025-26 tax year, not 31 January 2026 - earlier coverage referring to the 2026 date is out of date and this feed corrects it here. HMRC does not announce refunds by email or text; refunds are claimed through the online account or the HMRC app. Report emails to phishing@hmrc.gov.uk and texts to 60599.\n\nConfidence. High on Next's 23 November disclosure and the content of its statement, on all TfL facts including the 16 November discovery, the 18 November notification, the 265,000 figure, the exposed and not-exposed data lists, that photocards remain valid, that TfL will email customers once the site is restored and ask for the reset then, and that the reset has not yet been requested. High on the HMRC figures and the 31 January 2027 deadline. High on the ASOS third-party platform breach and the 5 November conclusion that names and contact details were accessed. Low on the Xuanye Group's claim of responsibility for ASOS, which is unverified. Note that a TechRadar report about in-person password resets for TfL staff describes a separate earlier incident and is not part of this one.","recommended_actions":["Correct any internal or public communication that told Oyster photocard holders to reset their password from 23 November. TfL has not asked for the reset yet and will do so by email once the photocard website is restored. If your staff bulletin said otherwise, reissue it.","Replace that message with the stronger one: any email today telling an Oyster photocard holder to reset their TfL password or security answers is more likely to be fraudulent than genuine, because TfL has not sent that request. Tell people what the real request will look like and when it will come.","Tell staff and the public to change reused security questions and answers on other services now. This is the one useful action available today and it is the part of the exposure TfL cannot fix - security answers are reused across unrelated services far more than passwords, and no reset TfL performs touches them.","Brief your own help desk and identity verification processes on the TfL data categories. An attacker holding a full name, phone number, email address, home address, date of birth and security answers can pass most knowledge-based verification. If your help desk verifies with any of those, change it to a callback on an HR-held number or in-person verification.","Monitor for Oyster, TfL and photocard-themed phishing domains and inbound mail, and monitor your own brand if you are a UK transport, local authority or consumer-facing public body. The reset email is coming at an unannounced date, which gives attackers an open window to send theirs first.","If you are a UK retailer, ask your e-commerce and communications suppliers directly whether they are the unnamed provider in the Next incident. Next has not named the supplier, so other customers of the same provider cannot determine exposure on their own - the enquiry is the only route.","Add a supplier-naming expectation to your own incident disclosure standard, or at least a route by which affected third parties can establish whether they share the provider. The unnamed-supplier pattern has now recurred across ASOS and Next and it transfers the cost of uncertainty onto everyone else in the sector.","Update any Self Assessment fraud awareness material to the 31 January 2027 deadline for the 2025-26 tax year. Material referring to 31 January 2026 is out of date, and the scam volume concentrates in the run-up to the real date.","Reinforce the HMRC rule in plain terms: HMRC does not announce refunds by email or text. Refunds go through the online account or the HMRC app. Report emails to phishing@hmrc.gov.uk and texts to 60599."],"kql":[{"platform":"defender_xdr","table":"EmailEvents","name":"Inbound mail impersonating TfL, Oyster and photocard password reset requests","description":"The highest-value detection in this entry, because TfL has not yet sent its reset email - so any such message arriving now is suspect by definition. Surfaces TfL-themed reset lures to staff mailboxes.","query":"let lookback = 30d;\nEmailEvents\n| where Timestamp > ago(lookback)\n| where EmailDirection == \"Inbound\"\n| where Subject has_any (\"Oyster\", \"photocard\", \"Transport for London\", \"TfL\", \"60+\", \"Zip Oyster\", \"Freedom Pass\")\n     or SenderMailFromDomain has_any (\"tfl\", \"oyster\", \"photocard\")\n| where Subject has_any (\"reset\", \"password\", \"security question\", \"verify\", \"confirm\", \"action required\", \"suspended\", \"restore\")\n| project Timestamp, SenderFromAddress, SenderMailFromDomain, SenderIPv4, RecipientEmailAddress, Subject, DeliveryAction, ThreatTypes, AuthenticationDetails, Url = UrlCount\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"UrlClickEvents","name":"Clicks on TfL, Oyster, Next and HMRC themed URLs from corporate devices","description":"Catches the users who acted on a lure. Combines the transport, retail and tax themes in this cluster, since all three are consumer-facing brands your staff hold personal accounts with.","query":"UrlClickEvents\n| where Timestamp > ago(30d)\n| where Url has_any (\"oyster\", \"photocard\", \"tfl-\", \"tfl.\", \"next-\", \"nextplc\", \"hmrc\", \"gov-uk\", \"govuk-\", \"tax-refund\", \"taxrefund\", \"asos\")\n| where not(Url has_any (\"tfl.gov.uk\", \"next.co.uk\", \"gov.uk/hmrc\", \"asos.com\"))\n| project Timestamp, AccountUpn, Url, ActionType, IsClickedThrough, NetworkMessageId, Workload\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"IdentityDirectoryEvents","name":"Knowledge-based help desk verification patterns on accounts - credential and MFA resets","description":"The TfL data set defeats knowledge-based verification: name, phone, email, address, date of birth and security answers are exactly what a help desk asks for. Surfaces reset and MFA-change activity so each can be matched to a verified ticket.","query":"IdentityDirectoryEvents\n| where Timestamp > ago(45d)\n| where ActionType has_any (\"Account Password Changed\", \"Account Password Reset\", \"User Account Modified\", \"Account Enabled\", \"Group Membership changed\")\n| summarize Events = count(), Actions = make_set(ActionType, 10), Actors = make_set(AccountUpn, 20)\n        by TargetAccountUpn = tostring(AdditionalFields.TARGET_OBJECT), bin(Timestamp, 1d)\n| order by Timestamp desc"},{"platform":"sentinel","table":"DnsEvents","name":"Lookups of newly registered domains resembling TfL, Oyster, Next and HMRC","description":"Infrastructure-side early warning. Surfaces DNS queries for lookalike domains from inside the estate, which is how you catch a campaign before the first click report arrives.","query":"let brandTerms = dynamic([\"oyster\", \"photocard\", \"tfl\", \"transportforlondon\", \"next\", \"nextplc\", \"hmrc\", \"asos\", \"selfassessment\", \"taxrefund\"]);\nlet legitimate = dynamic([\"tfl.gov.uk\", \"next.co.uk\", \"gov.uk\", \"asos.com\", \"hmrc.gov.uk\"]);\nDnsEvents\n| where TimeGenerated > ago(30d)\n| where Name has_any (brandTerms)\n| where not(Name has_any (legitimate))\n| summarize Queries = count(), Clients = make_set(ClientIP, 40), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Name\n| order by FirstSeen desc"},{"platform":"sentinel","table":"SigninLogs","name":"Credential stuffing indicators on corporate accounts matching consumer-breach email addresses","description":"Addresses the reuse risk directly. Where a staff member used a work email address for a consumer account caught in one of these breaches, the credential and security-answer reuse surfaces as failed authentication volume from unfamiliar infrastructure.","query":"let accountThreshold = 8;\nSigninLogs\n| where TimeGenerated > ago(30d)\n| where ResultType in (50126, 50053, 50074, 50076, 50158)\n| summarize FailedAccounts = dcount(UserPrincipalName), Attempts = count(), Accounts = make_set(UserPrincipalName, 60), Apps = make_set(AppDisplayName, 20)\n        by IPAddress, AutonomousSystemNumber, Location, bin(TimeGenerated, 1h)\n| where FailedAccounts > accountThreshold\n| order by FailedAccounts desc"}],"iocs":[{"type":"note","value":"CORRECTION: TfL has NOT yet asked Oyster photocard holders to reset passwords or security answers. TfL's own page states it will email all affected customers once the photocard website is restored and will ask for the change then","context":"This feed's 23 November run stated the reset window opened that day. That was wrong. The correct message is stronger: any reset request arriving now is more likely to be fraudulent than genuine.","confidence":"high","source":"TfL information page for Oyster photocard account holders"},{"type":"note","value":"TfL timeline: incident discovered 16 November 2026 after customers received emails asking them to create accounts they already had; affected photocard account holders emailed 18 November 2026; photocard website still offline","context":"The trigger for discovery is itself notable - the attacker's own account activity generated the notifications that exposed it.","confidence":"high","source":"TfL via multiple secondary reports"},{"type":"account","value":"Approximately 265,000 Oyster photocard accounts - full names, phone numbers, email addresses, home addresses, dates of birth, security questions and answers","context":"The exposed set. Name, phone, email, address, date of birth and security answers together defeat most knowledge-based help desk verification.","confidence":"high","source":"TfL via multiple secondary reports"},{"type":"note","value":"TfL states NOT compromised: passwords, bank and payment card details, journey information, names and dates of birth of children with Zip Oyster cards, photographs and copies of supporting documentation","context":"Stated explicitly so the incident is not over-read. Photocards remain valid for travel and customers are asked not to contact TfL at this stage.","confidence":"high","source":"TfL via multiple secondary reports"},{"type":"behaviour","value":"Reuse of exposed security questions and answers on unrelated services - banking, utilities, government accounts","context":"The part of this exposure TfL cannot fix and the only useful customer action today. Security answers are reused far more than passwords because people do not treat them as credentials and password managers do not generate them.","confidence":"high","source":"TfL advice and this feed's assessment"},{"type":"behaviour","value":"Phishing email impersonating TfL and instructing an Oyster photocard holder to reset their password or security answers","context":"The predicted and now better-characterised lure. Because the genuine request has not been sent and its date is unannounced, attackers have an open window to send theirs first.","confidence":"high","source":"This feed's assessment, consistent with TfL's Action Fraud advice"},{"type":"note","value":"Next plc disclosed on 23 November 2026 that a third-party online supplier suffered a cyber incident giving access to some Next-related data. Next states its own systems were not breached, no customer personal data was compromised on current evidence, and the affected information is benign","context":"Nothing for a customer to act on. Recorded for sector pattern and because the supplier is unnamed.","confidence":"high","source":"Next plc statement via Reuters and multiple secondary reports"},{"type":"note","value":"Next has not named the supplier, said what data was accessed, or given the attack or discovery dates. Investigation ongoing with the supplier, law enforcement and regulators","context":"The unnamed-supplier problem: other retailers using the same provider cannot determine whether they are affected, which transfers the cost of uncertainty across the sector.","confidence":"high","source":"Next plc statement via secondary reporting"},{"type":"note","value":"Sector context: third UK retail supplier-side incident in roughly six weeks. ASOS disclosed a third-party communications platform breach in October 2026 and concluded on 5 November that names and contact details were accessed; Marks and Spencer and Co-op were attacked in 2025","context":"The pattern is third-party platforms rather than retailer systems. Supplier assurance is where the control belongs.","confidence":"high","source":"Multiple secondary reports"},{"type":"note","value":"A ransomware group identified as the Xuanye Group has claimed responsibility for the ASOS incident","context":"Unverified attacker claim. Recorded for completeness and not relied upon.","confidence":"low","source":"Secondary reporting of a leak-site claim"},{"type":"note","value":"HMRC: 1,704 Self Assessment-related scam reports in twelve months, about 900 from a single fake tax refund scam in August 2026, within 48,119 total HMRC impersonation reports","context":"Carried forward unchanged. The two figures measure different things and do not conflict.","confidence":"high","source":"HMRC via Infosecurity Magazine and other reports"},{"type":"note","value":"CORRECTION: the relevant Self Assessment deadline is 31 January 2027 for the 2025-26 tax year. Coverage referring to 31 January 2026 is out of date","context":"Fix this in any awareness material. Scam volume concentrates in the run-up to the real date, so the date has to be right.","confidence":"high","source":"This feed's correction of dated secondary coverage"},{"type":"note","value":"HMRC does not announce refunds by email or text. Refunds are claimed through the online account or the HMRC app. Report emails to phishing@hmrc.gov.uk, texts to 60599","context":"The single rule that defeats the whole refund scam category. Repeat it verbatim rather than paraphrasing.","confidence":"high","source":"HMRC guidance"},{"type":"note","value":"A TechRadar report about in-person password resets for TfL staff and a related arrest describes a separate, earlier TfL cyber attack and is not part of the photocard incident","context":"Named explicitly because the two TfL incidents are being conflated in secondary coverage.","confidence":"high","source":"This feed's source assessment"}],"references":["https://photocard.tfl.gov.uk/","https://www.bleepingcomputer.com/news/security/transport-for-london-breach-exposes-265-000-oyster-card-users-data/","https://www.helpnetsecurity.com/2026/11/20/transport-for-london-oyster-photocard-data-breach/","https://www.ianvisits.co.uk/articles/tfl-cyber-attack-may-have-exposed-data-of-265000-oyster-photocard-users-94247/","https://www.insurancejournal.com/news/international/2026/11/23/893480.htm","https://uk.fashionnetwork.com/news/Uk-s-next-flags-cyber-breach-at-online-supplier-says-no-customer-data-compromised,1887585.html","https://hackread.com/uk-retailer-next-cyber-incident-online-supplier/","https://techcrunch.com/2026/10/08/asos-confirms-breach-of-customer-data-after-hackers-send-rogue-app-notification/","https://www.infosecurity-magazine.com/news/hmrc-warns-of-over-135000-scam/","https://www.mynewsdesk.com/uk/hm-revenue-customs-hmrc/pressreleases/4800-self-assessment-scams-reported-3422336"]},{"rank":10,"id":"TI-2026-11-24-010","title":"THE DEADLINE AND EVIDENCE-QUALITY BOARD: Cisco Expressway's Chain Is Now Corroborated Down to a Hard Indicator in erlang.log, Odoo Says Automated Adversarial AI Agents Are Attacking On-Premise Deployments, Two Deadlines Fall on Thursday, Three Expired Yesterday and Earlier, and FFmpeg's Twelve CVEs Are NOT Being Exploited","cve_ids":["CVE-2026-76466","CVE-2026-130028","CVE-2026-130029","CVE-2026-129448","CVE-2025-42884","CVE-2026-114938","CVE-2026-84869","CVE-2026-115731"],"vendor":"Cisco, Odoo, Apache, SAP, Perforce, ConnectWise, Rackspace, GL.iNet, FFmpeg, Microsoft","affected_products":["Cisco Expressway Series - clustered deployments only - fixed in X15.5.20 (CVE-2026-76466)","Odoo 13.0 to 16.0 - SQL injection in read_group (CVE-2026-130028); Odoo 20.0 and earlier - HTML sanitiser XSS (CVE-2026-130029)","Apache Roller 4.0.0 onward - XML-RPC - fixed in 6.1.7 (CVE-2026-129448)","SAP NetWeaver (CVE-2025-42884)","Perforce Puppet Enterprise (CVE-2026-115731)","ConnectWise ScreenConnect technician client - fixed in 26.6.5 (CVE-2026-84869)","OpenJDK / Java4Shell (CVE-2026-114938) - NHS England Digital cyber alert CC-4901 batch","Rackspace Spot - customer Kubernetes clusters","GL.iNet routers and KVM devices - firmware 4.11.1 / 1.10.3 or later","Microsoft Entra Connect Health - cloud service API (no CVE)","FFmpeg - twelve vulnerabilities up to CVSS 9.2 - fixed in 9.1 - NOT exploited"],"category":"vulnerability_bundle","cvss_v3":9.8,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-26","patch_available":"partial","first_reported":"2026-10-21","last_updated":"2026-11-24","confidence":"high","summary":"The board exists so that items which lose their deadline do not lose their place, and so that the things which are not exploited are named as clearly as the things that are.\n\nTHE DEADLINE POSITION TODAY. Expired: CVE-2026-123890 vCenter, CVE-2026-76466 Cisco Expressway, CVE-2026-129448 Apache Roller and CVE-2025-42884 SAP NetWeaver all fell due 23 November; CVE-2026-84869 ConnectWise ScreenConnect technician client fell due 2 October. Due TODAY 24 November: CVE-2026-124194 Outlook, CVE-2026-20320 Cisco BroadWorks, CVE-2026-111793 Openwave - all at rank 2. Due THURSDAY 26 November: CVE-2026-133968 MONAI Label at rank 4 and CVE-2026-134624 N-able Mail Assure at rank 5. No new KEV additions were recorded on 24 November itself; the most recent batch is the two added on 23 November. That absence is stated explicitly so it is not mistaken for a coverage gap.\n\nCISCO EXPRESSWAY CVE-2026-76466 - the deadline has gone but the window produced the best indicator in this report. F6's account is now corroborated across multiple outlets and it is worth following properly because the intrusion did not stop at the appliance. Attackers compromised two internet-facing Expressway devices; one of those gave access to two further internal cluster nodes, four devices in total at a Russian organisation. The exploit relies on a hard-coded Erlang node identity beginning wombat@ plus a shared cookie on TCP 4372 - the cookie is compiled in and identical on every install, which is why reachability is the entire exposure. After obtaining root, the attackers ran custom Python scripts to scan for SMB shares, interact with SQL Server and WinRM, and search GitLab repositories for credentials and other sensitive data. Yesterday's run asserted the GitLab credential harvesting; it is now corroborated. F6 did not attribute the activity to a known group and inferred from the scripts that an AI assistant was used. The hard indicator: a nodeup entry for wombat@127.0.0.1 in the Erlang system log, erlang.log. That is the single most specific artefact in this entire report. F6's mitigation where patching is not immediate is to block TCP 4371 to 4372 except from trusted cluster nodes. Cisco first disclosed on 21 October 2026 and the fix is X15.5.20; the flaw affects clustered deployments only. Cisco's PSIRT says it is unaware of exploitation and has not confirmed direct evidence, against CISA's listing - the vendor-versus-authority split again. A public exploit appeared on GitHub on 5 November 2026 and exploitation followed shortly after.\n\nODOO CVE-2026-130028 AND CVE-2026-130029 - new this window and relevant well beyond the CVEs. Odoo issued advisory ODOO-SA-2026-11-23 to Enterprise customers and partners on 23 November 2026. CVE-2026-130028 is a SQL injection, CVSS 8.8, reported as affecting Odoo 13.0 to 16.0 and allowing any signed-in user with read access to an affected model to run SQL. CVE-2026-130029 is a cross-site scripting flaw in the HTML sanitiser, CVSS 7.1, affecting 20.0 and earlier. Version ranges conflict across sources and the official advisory could not be read directly, so verify scope before scoping work. The part that matters more than the CVEs: Odoo states it has been notified of attacks against on-premise deployments including attacks carried out by automated adversarial AI agents. A vendor writing that phrase into a customer advisory is a meaningful threshold, and it is the fourth independent instance of agent-driven attack activity in this single window. Community patch work is visible on GitHub, including that Odoo 14.0 has no official fix for the XSS and was mitigated by upgrading lxml, and that official Docker images had not been rebuilt with both patches at the time of checking.\n\nAPACHE ROLLER CVE-2026-129448 - the fake mitigation that keeps catching people, carried forward unchanged because it keeps working. Disabling XML-RPC in the admin user interface does NOT mitigate this. You must set enabledForExtensions=false in WEB-INF/web.xml or remove the /roller-services/xmlrpc mapping, then restart. Patch to 6.1.7, not 6.1.6. The affected range is 4.0.0 onward, not 6.1.5 alone. KEV deadline expired 23 November.\n\nCONNECTWISE SCREENCONNECT CVE-2026-84869 - the component nobody updated. The vulnerable component is the TECHNICIAN CLIENT, not the server your MSP patched. KEV deadline expired 2 October. Ask your provider in writing whether every technician host client is on 26.6.5 or later, and demand the inventory rather than an assurance. Sits alongside N-able at rank 5 as the second MSP-platform item in two days.\n\nSAP NETWEAVER CVE-2025-42884 - recorded as exploited on the strength of its KEV listing alone. No IOCs, attribution or proof-of-concept have been published by SAP, CISA or Onapsis, and one source states no public exploitation evidence exists. CVSS 6.5. KEV deadline expired 23 November. The evidence quality here is the weakest of any exploited item in this report and it is labelled as such.\n\nRACKSPACE SPOT - carried forward, and the only hard network indicators of the preceding runs. Attackers used leaked credentials to act as legitimate users in customer Kubernetes clusters between roughly 00:20 and 22:00 UTC on 17 November 2026, creating pods, listing nodes and volumes and reading Secrets. Rackspace confirmed on 18 November after a customer report. Indicators: 23.224.79.106, the 23.224.0.0/15 range, and pods or objects named i1, glm- or probe. A pod named probe can be benign, so a match is a reason to investigate rather than proof. Rackspace has not confirmed that any given customer's Secrets were read - the notice says they could have been - so treat that as the working assumption. Rotate Spot API tokens, automation refresh tokens, kubeconfig files and every credential held in cluster Secrets, and review database, registry, Git and storage logs back to 17 November. One source attributes the console outage to deliberate disabling while infrastructure was secured; the operational lesson stands either way - build a break-glass rotation path that does not depend on the provider's console.\n\nGL.iNET - carried forward. Attackers exploited a flaw in the cloud remote management service to install malware on routers and KVM devices. Patching the cloud did not remove malware already on devices. Update to firmware 4.11.1 / 1.10.3 or later. One consultancy report claims GL.iNet's own detection check misses infections; single-source and recorded as such.\n\nMICROSOFT ENTRA CONNECT HEALTH - carried forward from rank 2 yesterday with no new information. Attackers read tenant ID, display name, initial domain, country code, regional scope and licence tier together with global administrator and technical contact email addresses out of the API between 23 July and the 19 November server-side fix. No patch exists because the vulnerable component was Microsoft's. The available work is unchanged: warn administrators through a channel that is not email, harden the help-desk verification path for privileged resets, and hunt consent grants and privileged-role changes across the exposure window. No indicators have been published and none are expected.\n\nNOT EXPLOITED, STATED SO YOU CAN DEPRIORITISE IT. FFmpeg disclosed twelve memory-corruption vulnerabilities scoring up to CVSS 9.2, fixed in FFmpeg 9.1. As of the morning of 24 November no source reports exploitation in the wild. Patch it in the normal cycle; it does not belong in this week's emergency work. Naming the non-exploited item is as much a part of prioritisation as naming the exploited ones.\n\nJAVA4SHELL AND THE NHS ALERT BATCH - carried forward. CVE-2026-114938 affects OpenJDK and appears in the NHS England Digital cyber alert series alongside CC-4900 for PHP, published 19 November and covering seven critical vulnerabilities with multiple public proof-of-concept exploits noted by the National CSOC, and a Ruby advisory of the same date. UK health sector bodies should work the CC-series alerts directly rather than through this feed.\n\nALSO IN THE WINDOW, FOR UK HIGHER EDUCATION. Jisc's Security Conference runs today and tomorrow, 24 to 25 November 2026, in Manchester and online. Jisc's annual threat report found significant incidents down from 17 in 2024 to 7 in 2025 while total incidents rose from over 11,000 to more than 16,000, with higher education providers the primary target, and identified over 144,000 compromised username and password pairs tied to UK education and research users in a twelve-month period. Jisc published a ClickFix warning for universities and colleges on 21 October 2026. Read alongside rank 4: the sector with the credential exposure problem is the sector whose research servers the AI agents found.\n\nConfidence. High on the deadline positions, the F6 Expressway chain including the four devices, the wombat@ Erlang node identity, the shared compiled-in cookie, TCP 4372, the Python tooling scanning SMB, SQL Server, WinRM and GitLab, the erlang.log nodeup indicator, the TCP 4371-4372 mitigation, the 21 October Cisco disclosure, X15.5.20, clustered-only applicability, the 5 November GitHub proof-of-concept, and Cisco's unaware-of-exploitation position. Medium on F6's AI-assistant inference. High on the existence of Odoo advisory ODOO-SA-2026-11-23 dated 23 November and on both CVEs and their scores; medium on the affected version ranges, which conflict across sources, and medium on the automated-adversarial-AI-agent language, which this feed has from a third-party summary rather than the advisory text. High on the Roller mitigation correction, the ScreenConnect technician-client scoping, the Rackspace indicators and timeline, the GL.iNet position, and the Entra Connect Health facts. Medium on SAP NetWeaver exploitation, which rests on the KEV listing alone. High that FFmpeg is not reported as exploited as of 24 November. High on the Jisc figures.","recommended_actions":["Search erlang.log on every Cisco Expressway node for a nodeup entry referencing wombat@127.0.0.1. This is the single most specific indicator in this report and the check takes minutes. A match means treat the node and every cluster peer as compromised.","Block TCP 4371 to 4372 except from trusted cluster nodes on all Expressway deployments, and upgrade clustered nodes to X15.5.20. The Erlang cookie is compiled in and identical on every install, so reachability is the entire exposure and the firewall rule needs no maintenance window.","Follow the Expressway chain past the appliance. Attackers scanned SMB shares, interacted with SQL Server and WinRM, and searched GitLab repositories for credentials. Patch the appliance and skip the repositories and you have closed the door while leaving the keys outside. Audit internal GitLab for hard-coded credentials and rotate what you find.","Apply the Odoo patches from advisory ODOO-SA-2026-11-23 and verify your version against the official advisory rather than secondary summaries, because version ranges conflict. If you run Odoo 14.0 note there is no official fix for the XSS and the community mitigation is an lxml upgrade, and check whether your Docker image has actually been rebuilt with both patches.","Treat Odoo's statement that automated adversarial AI agents are attacking on-premise deployments as the actionable part of that advisory. Any internet-facing on-premise business application is now in scope for agent-driven discovery, which is the structural point at rank 4.","For Apache Roller, set enabledForExtensions=false in WEB-INF/web.xml or remove the /roller-services/xmlrpc mapping and restart. Disabling XML-RPC in the admin UI does NOT mitigate CVE-2026-129448. Patch to 6.1.7, not 6.1.6, and note the affected range is 4.0.0 onward.","Ask your MSP in writing whether every ConnectWise ScreenConnect TECHNICIAN CLIENT is on 26.6.5 or later, and demand the inventory rather than an assurance. The server your provider patched was not the vulnerable component and this KEV deadline passed on 2 October.","Rotate every Rackspace Spot credential class - API tokens, automation refresh tokens, kubeconfig files and all cluster Secrets - and review database, registry, Git and storage logs back to 17 November. Block 23.224.79.106 and review the 23.224.0.0/15 range before blocking it wholesale. Hunt pods and objects named i1, glm- or probe, treating a match as grounds to investigate rather than proof.","Build a break-glass credential rotation path that does not depend on a provider's console. In the Rackspace incident the console outage stopped customers rotating the credentials they had just been told were exposed. That is a design flaw you can fix before the next provider incident.","Update GL.iNet routers and KVM devices to firmware 4.11.1 / 1.10.3 or later, and do not assume the vendor's cloud fix cleaned your devices - it did not remove malware already present.","Deprioritise FFmpeg. Twelve vulnerabilities up to CVSS 9.2 fixed in 9.1, no exploitation reported as of 24 November. Patch in the normal cycle and keep this week's emergency capacity for the exploited items.","For UK health sector bodies, work the NHS England Digital CC-series alerts directly - CC-4900 for PHP and the Ruby advisory of 19 November, plus the Java4Shell CVE-2026-114938 batch. This feed is not a substitute for the alert series your organisation is required to action.","For UK universities and colleges: Jisc's Security Conference is today and tomorrow, and Jisc's own figures show over 144,000 compromised credential pairs for UK education and research users in twelve months. Read that alongside rank 4 - the sector with the credential problem is the sector whose research servers the AI agents found."],"kql":[{"platform":"sentinel","table":"Syslog","name":"Cisco Expressway erlang.log nodeup entries - the hardest indicator in this report","description":"Searches forwarded Expressway syslog for the Erlang nodeup entry F6 identified as the key indicator of compromise. Specific, low-noise and decisive. Requires Expressway syslog forwarding; if you do not have it, read erlang.log on the appliance directly.","query":"Syslog\n| where TimeGenerated > ago(120d)\n| where SyslogMessage has \"nodeup\" or SyslogMessage has \"wombat@\"\n| where SyslogMessage has_any (\"wombat@127.0.0.1\", \"wombat@\", \"nodeup\")\n| project TimeGenerated, Computer, Facility, ProcessName, SyslogMessage\n| order by TimeGenerated asc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Inbound connections to Cisco Expressway on TCP 4371-4372","description":"Reachability is the entire exposure for CVE-2026-76466 because the Erlang cookie is identical on every install. Surfaces every source that has reached the cluster ports so the firewall rule can be written from evidence.","query":"let expresswayHosts = dynamic([]);  // populate with Expressway node addresses\nlet trustedPeers = dynamic([]);     // populate with trusted cluster peer addresses\nCommonSecurityLog\n| where TimeGenerated > ago(120d)\n| where DestinationPort between (4371 .. 4372)\n| where array_length(expresswayHosts) == 0 or DestinationIP in (expresswayHosts)\n| where array_length(trustedPeers) == 0 or SourceIP !in (trustedPeers)\n| summarize Connections = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Actions = make_set(DeviceAction, 10)\n        by SourceIP, DestinationIP, DestinationPort\n| order by Connections desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Post-Expressway lateral movement - SMB, SQL Server and WinRM scanning from appliance network segments","description":"Follows the documented chain past the appliance. F6 recorded custom Python scripts scanning SMB shares and interacting with SQL Server and WinRM, so a source producing that port spread is the next stage rather than the first.","query":"let scanPorts = dynamic([445, 139, 1433, 1434, 5985, 5986, 135]);\nlet hostThreshold = 8;\nDeviceNetworkEvents\n| where Timestamp > ago(120d)\n| where RemotePort in (scanPorts)\n| summarize DistinctHosts = dcount(RemoteIP), Attempts = count(), Ports = make_set(RemotePort, 20), Hosts = make_set(RemoteIP, 60)\n        by DeviceName, InitiatingProcessFileName, bin(Timestamp, 1h)\n| where DistinctHosts > hostThreshold\n| order by DistinctHosts desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"GitLab repository search and clone activity consistent with credential harvesting","description":"The part of the Expressway chain most likely to be missed. Attackers searched internal GitLab repositories for credentials, so high-volume search and clone activity from a single source is the artefact. Also a useful standing detection independent of this incident.","query":"let lookback = 120d;\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where RequestURL has_any (\"/api/v4/search\", \"/search?\", \".git/\", \"/repository/archive\", \"/api/v4/projects\")\n| summarize Requests = count(), DistinctUrls = dcount(RequestURL), Urls = make_set(RequestURL, 40)\n        by SourceIP, SourceUserName, bin(TimeGenerated, 1h)\n| where Requests > 50 or DistinctUrls > 25\n| order by Requests desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Apache Roller XML-RPC endpoint access - the path the fake mitigation leaves open","description":"Disabling XML-RPC in the Roller admin UI does not close the endpoint. This surfaces live requests to /roller-services/xmlrpc, which is the empirical test of whether your mitigation actually worked.","query":"CommonSecurityLog\n| where TimeGenerated > ago(90d)\n| where RequestURL has_any (\"/roller-services/xmlrpc\", \"xmlrpc\", \"roller-services\")\n| summarize Requests = count(), Methods = make_set(RequestMethod, 10), Actions = make_set(DeviceAction, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)\n        by SourceIP, DestinationIP, RequestURL\n| order by Requests desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Rackspace Spot breach network indicators","description":"The only hard network indicators carried in this report. Checks for the reported attacker address and range. Review the /15 before blocking it wholesale - it is a large allocation.","query":"let spotIoc = dynamic([\"23.224.79.106\"]);\nlet spotRange = \"23.224.0.0/15\";\nCommonSecurityLog\n| where TimeGenerated >= datetime(2026-11-15)\n| where SourceIP in (spotIoc) or DestinationIP in (spotIoc)\n     or ipv4_is_in_range(SourceIP, spotRange) or ipv4_is_in_range(DestinationIP, spotRange)\n| project TimeGenerated, SourceIP, DestinationIP, DestinationPort, DeviceAction, RequestURL, SentBytes, ReceivedBytes\n| order by TimeGenerated asc"},{"platform":"sentinel","table":"AuditLogs","name":"Entra consent grants and privileged role changes across the Entra Connect Health exposure window","description":"Carried forward from the Entra Connect Health incident. The cheapest high-value check that remains available, since no indicators were published and no patch exists on the customer side. Scoped to 23 July to 19 November 2026.","query":"let windowStart = datetime(2026-07-23);\nlet windowEnd = datetime(2026-11-19);\nAuditLogs\n| where TimeGenerated between (windowStart .. windowEnd)\n| where OperationName has_any (\"Consent to application\", \"Add service principal\", \"Add app role assignment\", \"Add delegated permission grant\", \"Add OAuth2PermissionGrant\", \"Add member to role\", \"Add eligible member to role\")\n| extend Actor = tostring(InitiatedBy.user.userPrincipalName)\n| extend Target = tostring(TargetResources[0].displayName)\n| project TimeGenerated, OperationName, Actor, Target, Result, CorrelationId\n| order by TimeGenerated asc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Odoo SQL injection and XSS probing against on-premise deployments","description":"Odoo reports attacks on on-premise deployments including by automated adversarial AI agents. Surfaces injection and script-payload patterns against Odoo endpoints, with the high distinct-path volume that agent-driven probing produces.","query":"CommonSecurityLog\n| where TimeGenerated > ago(45d)\n| where RequestURL has_any (\"/web/dataset\", \"read_group\", \"/jsonrpc\", \"/xmlrpc\", \"/web/login\", \"/odoo\")\n| where RequestURL has_any (\"UNION\", \"SELECT\", \"--\", \"%27\", \"'\", \"\u003cscript\", \"onerror\", \"javascript:\", \"%3Cscript\")\n     or ReceivedBytes > 8000\n| summarize Requests = count(), DistinctUrls = dcount(RequestURL), Urls = make_set(RequestURL, 30)\n        by SourceIP, DestinationIP, bin(TimeGenerated, 1h)\n| order by Requests desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Consolidated exposure across every CVE tracked on this board","description":"The single compliance view. Lists remaining exposure for every CVE in this report with its deadline status, so the breach position and the remaining work can be reported in one table.","query":"let tracked = datatable(CveId:string, Deadline:string, Status:string)\n[\n  \"CVE-2026-124194\", \"2026-11-24\", \"DUE TODAY\",\n  \"CVE-2026-20320\",  \"2026-11-24\", \"DUE TODAY\",\n  \"CVE-2026-111793\", \"2026-11-24\", \"DUE TODAY\",\n  \"CVE-2026-133968\", \"2026-11-26\", \"DUE THURSDAY\",\n  \"CVE-2026-134624\", \"2026-11-26\", \"DUE THURSDAY\",\n  \"CVE-2026-123890\", \"2026-11-23\", \"EXPIRED\",\n  \"CVE-2026-76466\",  \"2026-11-23\", \"EXPIRED\",\n  \"CVE-2026-129448\", \"2026-11-23\", \"EXPIRED\",\n  \"CVE-2025-42884\",  \"2026-11-23\", \"EXPIRED\",\n  \"CVE-20
