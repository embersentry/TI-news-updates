26-84869\",  \"2026-10-02\", \"EXPIRED\",\n  \"CVE-2026-115731\", \"\",           \"KEV listed\",\n  \"CVE-2026-131914\", \"\",           \"EXPLOITED - NO PATCH EVER\",\n  \"CVE-2026-114938\", \"\",           \"NHS alert batch\",\n  \"CVE-2026-130028\", \"\",           \"new 23 Nov advisory\",\n  \"CVE-2026-130029\", \"\",           \"new 23 Nov advisory\"\n];\nDeviceTvmSoftwareVulnerabilities\n| join kind=inner tracked on CveId\n| summarize ExposedDevices = dcount(DeviceId), Software = make_set(SoftwareName, 20) by CveId, Deadline, Status\n| order by Status asc, ExposedDevices desc"}],"iocs":[{"type":"account","value":"wombat@127.0.0.1","context":"THE HARDEST INDICATOR IN THIS REPORT. F6 identifies a nodeup entry for this Erlang node identity in erlang.log as the key indicator of Cisco Expressway CVE-2026-76466 compromise. A match means treat the node and every cluster peer as compromised.","confidence":"high","source":"F6 via multiple secondary reports"},{"type":"filepath","value":"erlang.log","context":"The Erlang system log on Cisco Expressway, and the file to search for the nodeup entry. Check it directly on the appliance if you do not forward Expressway syslog.","confidence":"high","source":"F6 via multiple secondary reports"},{"type":"port","value":"TCP 4371-4372","context":"Cisco Expressway cluster ports. The exploit uses a hard-coded Erlang node identity plus a shared cookie on 4372; the cookie is compiled in and identical on every install, so blocking these ports except from trusted cluster nodes removes the exposure.","confidence":"high","source":"F6 and Cisco mitigation guidance via secondary reporting"},{"type":"ttp","value":"Post-root custom Python scripts scanning for SMB shares, interacting with SQL Server and WinRM, and searching GitLab repositories for credentials and sensitive data","context":"The documented Expressway chain past the appliance, now corroborated across multiple outlets. Patching the appliance without auditing internal GitLab closes the door and leaves the keys outside.","confidence":"high","source":"F6 via multiple secondary reports"},{"type":"note","value":"Cisco Expressway: two internet-facing devices compromised, one giving access to two further internal cluster nodes - four devices total at a Russian organisation. Public proof-of-concept appeared on GitHub 5 November 2026; exploitation followed shortly after. Cisco disclosed 21 October 2026; fix X15.5.20; clustered deployments only. F6 did not attribute the activity to a known group","context":"The full case detail. If any node was reachable, treat every cluster peer as compromised rather than just the exposed one.","confidence":"high","source":"F6, Cisco and CISA via multiple secondary reports"},{"type":"note","value":"F6 inferred from the attackers' script artefacts that an AI assistant was used","context":"Single-source inference rather than observation. Recorded because it is the fifth independent AI-agent datapoint in this window.","confidence":"medium","source":"F6 via secondary reporting"},{"type":"note","value":"Odoo advisory ODOO-SA-2026-11-23, issued 23 November 2026 to Enterprise customers and partners. CVE-2026-130028 SQL injection in read_group, CVSS 8.8, reported as affecting 13.0 to 16.0, exploitable by any signed-in user with read access to an affected model. CVE-2026-130029 HTML sanitiser XSS, CVSS 7.1, affecting 20.0 and earlier","context":"Version ranges conflict across sources and the official advisory could not be read directly. Verify scope against odoo.com before scoping work.","confidence":"medium","source":"Odoo advisory via third-party summary and GitHub patch activity"},{"type":"note","value":"Odoo states it has been notified of attacks against on-premise deployments INCLUDING attacks carried out by automated adversarial AI agents","context":"A vendor writing that phrase into a customer advisory is a threshold moment, and the fourth independent instance of agent-driven attack activity in this window. The actionable read: any internet-facing on-premise business application is now in scope for agent-driven discovery.","confidence":"medium","source":"Odoo advisory via third-party summary"},{"type":"note","value":"Odoo 14.0 has no official fix for the XSS and was mitigated in community patches by upgrading lxml; official Docker images had not been rebuilt with both patches at the time of checking","context":"Two traps for anyone assuming an upstream fix exists for their version or that pulling the image is sufficient.","confidence":"medium","source":"GitHub pull requests and issues on Odoo community and official repositories"},{"type":"uri_path","value":"/roller-services/xmlrpc","context":"The Apache Roller endpoint that CVE-2026-129448 is reached through, and the thing to remove. Live requests to it are the empirical test of whether your mitigation actually worked.","confidence":"high","source":"Apache advisory via prior tracking"},{"type":"note","value":"Apache Roller: disabling XML-RPC in the admin UI does NOT mitigate CVE-2026-129448. Set enabledForExtensions=false in WEB-INF/web.xml or remove the /roller-services/xmlrpc mapping and restart. Patch to 6.1.7, not 6.1.6. Affected range is 4.0.0 onward, not 6.1.5 alone. KEV deadline expired 23 November 2026","context":"Carried forward unchanged because the fake mitigation keeps catching people. Four separate corrections in one item.","confidence":"high","source":"Apache advisory and CISA KEV via prior tracking"},{"type":"note","value":"ConnectWise ScreenConnect CVE-2026-84869: the vulnerable component is the TECHNICIAN CLIENT, not the server. Fixed in 26.6.5. KEV deadline expired 2 October 2026","context":"The scoping error that leaves estates exposed after the MSP reports the server patched. Ask for the technician client inventory in writing.","confidence":"high","source":"ConnectWise advisory and CISA KEV via prior tracking"},{"type":"note","value":"SAP NetWeaver CVE-2025-42884 is recorded as exploited on the strength of its "CVE-2026-134624 (one tracker still records no evidence of exploitation, predating the KEV addition)"],"ai_agent_attack_reports_this_window":["Amazon Threat Intelligence - Cairn agents autonomously discovered and exploited MONAI Label CVE-2026-133968, approximately 11 minutes from API mapping to arbitrary file write (rank 4)","Malbear Labs - an AI agent exploited Cisco BroadWorks CVE-2026-20320 against a telecommunications provider (rank 2)","Odoo advisory ODOO-SA-2026-11-23 - attacks on on-premise deployments including by automated adversarial AI agents (rank 10)","F6 - post-intrusion Python tooling in the Cisco Expressway case inferred to have been written with an AI assistant (rank 10)","Sophos CTU - Aur0ra / GOLD OGRE supplied Cursor coding agents with VPN credentials and objectives; agents reached domain management access; impact stage stayed human-controlled (rank 8)","Gambit Security (prior, September 2026) - Strix/Cairn/Hermes chained against online retailers; 105 attack projects, 27-plus compromised companies, 600,000-plus card records at roughly 3 to 80 US dollars per completed target (rank 4)","Bitdefender (prior, 3 November 2026) - suspected AI-generated commands in the 3AM ransomware attack on a UK school estate; agentic loop unconfirmed (closed this run, folded into rank 4)"],"window_assessment":"The busiest window in a fortnight and the first in which a structural shift, rather than a vulnerability, was the main finding. Five of ten entries are new. Three KEV deadlines expire today and two more on Thursday. The dominant structural fact is convergence: five separate, unrelated reports in twenty-four hours placed AI agents in the operator role of real attacks, across a medical imaging research server, a carrier voice platform, an ERP system, a video conferencing appliance and a ransomware intrusion - and the boundary is consistent in every case, with discovery, exploitation and lateral movement automated while the impact stage remains human-controlled. The second structural theme, now in its second week, is that remediation keeps failing to cover the vulnerable component: Microsoft's APIM fix does not invalidate stolen credentials, Idunno.AntiCsrf has no patch at all, Outlook's fix bypasses Windows Update reporting, GL.iNet's cloud fix did not remove malware already on devices, Roller's admin-UI toggle does not disable XML-RPC, and ScreenConnect's server patch was not the vulnerable component. The third is the vendor-versus-authority exploitation split, which appeared five times in one day. For UK government specifically, the highest-consequence item has no CVE, no log and no detection path, and the most likely hidden exposure is an abandoned security library that was added to applications precisely because they were security-reviewed.","highest_priority_action":"Seven things, and the first has no alternative. (1) FIND OUT TODAY WHETHER YOU RUN AZURE API MANAGEMENT CLASSIC, AND IF YOU DO, ROTATE EVERYTHING. Attackers exploited a management-plane flaw to read customer secrets out of APIM Classic - Named Values, identity provider and OpenID Connect client secrets, subscription keys and direct management API tokens. Developer, Basic, Standard and Premium Classic are affected; Consumption Classic and all v2 tiers are not. Microsoft identified it on 18 November and closed the path on 19 November, and has stated plainly that the fix does NOT invalidate credentials already stolen. There is no CVE, the advisory MZK9-GH0 is visible only in your own Azure Service Health blade, and the exploited API produced no customer-visible logging - so you cannot confirm access and you cannot rule it out. Norway's NSM has tied the flaw to attacks on its energy sector and its guidance is to assume exposure and rotate. Start with Named Values holding database credentials, service account passwords and signing keys, then identity provider secrets, then subscription keys, then management tokens - and keep the Named Value to backend dependency map the rotation forces you to build, because you do not have one and it is the most valuable thing that will come out of this. (2) CHECK OUTLOOK BUILD NUMBERS, NOT YOUR PATCH COMPLIANCE REPORT. CVE-2026-124194's KEV deadline is today and its fix ships through the Office update channel, so WSUS, Intune Windows rings and SCCM will report your estate green while every Outlook client stays vulnerable. It is only CVSS 6.5, it leaks NTLMv2 hashes, and it suppresses the external-content warning so user training has nothing to act on. Block outbound SMB on 445 as the compensating control and fix the reporting gap permanently. (3) BLOCK TCP 2208 AND UPGRADE BROADWORKS TO RI.2026.07 - ALSO DUE TODAY. CVE-2026-20320 is an unauthenticated XXE in the Open Client Interface that reads arbitrary files off the server including configuration containing keys, and Malbear Labs reports an AI agent exploiting it against a telecoms provider. Cisco disclosed it on 19 August, so the fix has existed for three months. Find out who owns your BroadWorks estate today, because in most organisations it is a voice team outside the security patching process - and rotate the keys that were in the configuration, because the patch does not undo disclosure. Openwave Webtop CVE-2026-111793 also expires today; 1.1.22.0 is the fixed build. (4) SEARCH EVERY IIS SERVER FOR Idunno.AntiCsrf.dll. CVE-2026-131914 is being exploited per Mandiant, a single unauthenticated HTTP POST gives code execution as w3wp.exe, and there will NEVER be a patch because the project is abandoned - the only fix is deleting the DLL and the Web.config module registration and replacing the protection. Do not rotate ASP.NET machine keys and think you have fixed it; reporting is explicit that it changes nothing here. And note the inversion: the applications most likely to carry this library are the ones that were security-reviewed, because a reviewer told a developer to add CSRF protection. Internet-facing first. (5) TWO DEADLINES ON THURSDAY, BOTH NEW. MONAI Label CVE-2026-133968 is CVSS 9.8 with authentication off by default - patch to 0.8.6 and check sitecustomize.py on every server for a planted reverse shell, because that is the specific persistence Amazon documented. Ask research computing and imaging teams directly; these servers are not in your asset inventory, which is the actual finding. N-able Mail Assure CVE-2026-134624 is a CVSS 9.3 SSRF that N-able found while investigating its own 16 November breach; if your mail security comes from an MSP, ask in writing today for the build number, whether your tenant was in scope, and whether the flaw was the entry vector - and do not accept 'exploitation was confined to a single N-able hosted server' as an answer to the second question. (6) SEARCH erlang.log FOR wombat@127.0.0.1. One command, and it is the hardest indicator in this report. F6's account of the Cisco Expressway intrusion is now corroborated: four devices compromised, then custom Python scripts scanning SMB, SQL Server and WinRM and searching GitLab repositories for credentials. Block TCP 4371-4372, upgrade clustered nodes to X15.5.20, treat every cluster peer as compromised if any node was reachable, and then audit internal GitLab and rotate what you find - patch the appliance and skip the repositories and you have closed the door while leaving the keys outside. (7) AND THE EXPIRED ONES DO NOT GO AWAY. vCenter CVE-2026-123890's deadline fell yesterday; ARMORY CASTLE held access from early September to the 19 November fix, so enumerate vsphere.local SSO administrators against change records, check access to /storage/db/vmware-vmdir/data.mdb, and DECIDE THIS WEEK on SAML STS signing key rotation, because an attacker holding that material can mint valid assertions indefinitely and no password reset revokes it. Close the vCenter 7.0 decision too - no public patch exists and none will. One governance item: the Cyber Security and Resilience Bill is in the Commons TODAY for consideration of Lords amendments, so hold your gap analysis until Wednesday, but build the third-party vendor criticality inventory now, because the vendor-direction powers in clauses 44 to 47 are already settled and most UK public bodies cannot currently say which suppliers sit in their critical path. One correction to pass on: TfL has NOT yet asked Oyster photocard holders to reset anything, so any email telling them to is more likely to be fraudulent than genuine - and the useful advice today is to change reused security questions and answers on other services, which is the part of that exposure TfL cannot fix. And one thing to deprioritise: FFmpeg's twelve CVEs up to 9.2 are NOT being exploited. Patch them in the normal cycle and keep this week's emergency capacity for the five items above with deadlines inside 48 hours."}}</script>

<script>
(function(){
  "use strict";

  /* ---------- labels ---------- */
  var STATUS = {
    exploited_in_the_wild:                     {short:"Exploited",        full:"Exploited in the wild",                  cls:"st-exploited", seg:"s-exploited"},
    exploitation_attempts_reported_unconfirmed:{short:"Attempts seen",    full:"Exploitation attempts reported (unconfirmed)", cls:"st-attempts", seg:"s-attempts"},
    public_poc_available:                      {short:"Public PoC",       full:"Public PoC available",                   cls:"st-attempts", seg:"s-attempts"},
    no_known_exploitation:                     {short:"No known exploit", full:"No known exploitation",                   cls:"st-none",      seg:"s-none"}
  };
  var PATCH = {yes:null, partial:{t:"Partial patch",cls:"partial"}, no:{t:"No patch",cls:"nopatch"}};
  var PLATFORM = {sentinel:"Sentinel", defender_xdr:"Defender XDR"};
  var CATEGORY = {vulnerability:"Vulnerability", vulnerability_bundle:"Vulnerability bundle",
                  threat_actor_campaign:"Threat actor campaign", incident:"Incident"};

  /* ---------- dom helpers (textContent only - no HTML injection) ---------- */
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null && text !== "") n.textContent = String(text);
    return n;
  }
  function kv(dl, key, val, accent){
    var d = el("div"), dt = el("dt", null, key), dd = el("dd");
    if (accent){ var b = el("b", null, val); dd.appendChild(b); } else { dd.textContent = val; }
    d.appendChild(dt); d.appendChild(dd); dl.appendChild(d); return d;
  }
  function sec(title){
    var s = el("section","sec"); s.appendChild(el("h3", null, title)); return s;
  }
  function fmtDate(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var day = String(d.getUTCDate()).padStart(2,"0");
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    var out = day + " " + mon + " " + d.getUTCFullYear();
    if (String(iso).indexOf("T") > -1){
      out += " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + "Z";
    }
    return out;
  }
  function label(s){
    if (!s) return "—";
    return String(s).replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
  }

  /* ---------- minimal KQL highlighter (safe: builds text nodes only) ---------- */
  var KQL_KW = ("let|where|project|summarize|extend|sort|order|by|join|union|take|limit|distinct|"
    + "count|dcount|countif|sum|make_set|make_list|min|max|any|avg|bin|ago|now|datetime|dynamic|"
    + "todouble|tostring|toint|tolong|strcat|strlen|extract|extract_all|parse_json|coalesce|"
    + "set_intersection|isnotempty|isempty|has|has_any|has_all|has_cs|contains|startswith|"
    + "endswith|in|and|or|not|asc|desc|on|datetime_part|dayofweek|column_ifexists|"
    + "ipv4_is_in_any_range|iff|case|print|top").split("|");
  var KQL_RE = new RegExp("(//[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b("
    + KQL_KW.join("|") + ")\\b", "g");
  function highlight(code){
    var frag = document.createDocumentFragment(), last = 0, m;
    KQL_RE.lastIndex = 0;
    while ((m = KQL_RE.exec(code)) !== null){
      if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
      var span = el("span", m[1] ? "c" : (m[2] ? "s" : "k"), m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
    return frag;
  }

  function copyBtn(getText, labelText){
    var b = el("button","copy", labelText || "Copy");
    b.type = "button";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = getText();
      function done(){
        var old = b.textContent;
        b.textContent = "Copied"; b.classList.add("ok");
        setTimeout(function(){ b.textContent = old; b.classList.remove("ok"); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
      } else { fallback(txt, done); }
    });
    return b;
  }
  function fallback(txt, done){
    var ta = el("textarea"); ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  /* ---------- state ---------- */
  var DATA = null, FILTER = {q:"", status:"all", kev:false, nopatch:false}, ALL_OPEN = false;

  /* ---------- render: masthead / tiles / posture ---------- */
  function renderHead(){
    var r = DATA.report || {}, w = r.coverage_window || {};
    document.getElementById("feed-name").textContent = DATA.feed_name || "Threat Intelligence Brief";

    document.title = (DATA.feed_name || "Threat Intelligence Brief") + " — " + (r.check_performed_at_local || "");

    var dl = document.getElementById("stamp"); dl.textContent = "";
    kv(dl, "Check performed", fmtDate(r.check_performed_at), true);
    kv(dl, "Coverage window", fmtDate(w.start) + " → " + fmtDate(w.end));
    if (w.duration_hours) kv(dl, "Window", w.duration_hours + " hours");
    if (r.next_check_due) kv(dl, "Next check due", fmtDate(r.next_check_due));

    var fm = [];
    if (r.generated_by) fm.push("Generated by " + r.generated_by);

      fm.push(DATA.collection_metadata.collection_method);
    document.getElementById("foot-meta").textContent = fm.join("  ·  ");

    var slot = document.getElementById("alert-slot"); slot.textContent = "";
    var st = DATA.summary_statistics || {};
    if (st.highest_priority_action){
      var a = el("div","alert");
      var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("width","17"); svg.setAttribute("height","17");
      svg.setAttribute("viewBox","0 0 16 16"); svg.setAttribute("fill","none");
      svg.setAttribute("aria-hidden","true");
      var p1 = document.createElementNS("http://www.w3.org/2000/svg","path");
      p1.setAttribute("d","M8 1.6 15 14H1L8 1.6Z");
      p1.setAttribute("stroke","#FF5A1F"); p1.setAttribute("stroke-width","1.5");
      p1.setAttribute("stroke-linejoin","round");
      var p2 = document.createElementNS("http://www.w3.org/2000/svg","path");
      p2.setAttribute("d","M8 6v3.2"); p2.setAttribute("stroke","#FF5A1F");
      p2.setAttribute("stroke-width","1.7"); p2.setAttribute("stroke-linecap","round");
      var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx","8"); c.setAttribute("cy","11.6"); c.setAttribute("r",".95");
      c.setAttribute("fill","#FF5A1F");
      svg.appendChild(p1); svg.appendChild(p2); svg.appendChild(c);
      var box = el("div");
      box.appendChild(el("p","lbl","Highest priority action"));
      box.appendChild(el("p", null, st.highest_priority_action));
      if (st.kev_deadlines_passed_or_due && st.kev_deadlines_passed_or_due.length){
        var d = el("p", null, "KEV deadlines in scope: " + st.kev_deadlines_passed_or_due.join(", "));
        d.style.marginTop = "7px"; d.style.fontSize = "13px"; d.style.color = "var(--muted)";
        d.style.fontFamily = "var(--mono)";
        box.appendChild(d);
      }
      a.appendChild(svg); a.appendChild(box); slot.appendChild(a);
    }
  }

  function renderTiles(){
    var st = DATA.summary_statistics || {}, v = DATA.vulnerabilities || [];
    var defs = [
      ["Entries", st.total_entries != null ? st.total_entries : v.length, ""],
      ["Actively exploited", st.actively_exploited, "hot"],
      ["KEV listed", st.kev_listed, "warn"],
      ["No patch", st.no_patch_available, "hot"],
      ["Partial patch", st.partial_patch_available, "warn"],
      ["CVEs tracked", st.total_cves_referenced, ""],
      ["KQL queries", st.total_kql_queries, ""],
      ["IOCs", st.total_iocs, ""]
    ];
    var box = document.getElementById("tiles"); box.textContent = "";
    defs.forEach(function(d){
      if (d[1] === undefined || d[1] === null) return;
      var t = el("div","tile" + (d[2] ? " " + d[2] : ""));
      t.appendChild(el("span","n", d[1]));
      t.appendChild(el("span","k", d[0]));
      box.appendChild(t);
    });
  }

  function renderPosture(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];
    var counts = {};
    v.forEach(function(e){ counts[e.exploitation_status] = (counts[e.exploitation_status]||0) + 1; });
    var present = order.filter(function(k){ return counts[k]; });
    var box = document.getElementById("posture"); box.textContent = "";
    if (!present.length || !v.length){ box.hidden = true; return; }
    box.hidden = false;
    box.appendChild(el("h2", null, "Exploitation posture across " + v.length + " entries"));
    var bar = el("div","pbar");
    present.forEach(function(k){
      var s = el("div","pseg " + STATUS[k].seg);
      s.style.flex = counts[k];
      s.setAttribute("title", STATUS[k].full + ": " + counts[k]);
      bar.appendChild(s);
    });
    box.appendChild(bar);
    var lg = el("div","plegend");
    present.forEach(function(k){
      var s = el("span");
      s.appendChild(el("i","swatch " + STATUS[k].seg));
      s.appendChild(el("b", null, counts[k]));
      s.appendChild(document.createTextNode(STATUS[k].full));
      lg.appendChild(s);
    });
    box.appendChild(lg);
  }

  /* ---------- render: one entry ---------- */
  function renderEntry(e){
    var li = el("li","card");
    li.setAttribute("data-status", e.exploitation_status || "");

    /* header (button for keyboard access) */
    var head = el("button","chead");
    head.type = "button";
    head.setAttribute("aria-expanded","false");
    head.appendChild(el("div","rank", e.rank != null ? e.rank : "·"));

    var body = el("div","cbody");
    body.appendChild(el("h2","ctitle", e.title || "Untitled"));

    var meta = el("div","meta");
    var S = STATUS[e.exploitation_status];
    if (S) meta.appendChild(el("span","pill " + S.cls, S.short));
    if (e.kev_listed) meta.appendChild(el("span","pill kev",
      "KEV" + (e.kev_due_date ? " · due " + e.kev_due_date : "")));
    var P = PATCH[e.patch_available];
    if (P) meta.appendChild(el("span","pill " + P.cls, P.t));
    if (e.severity) meta.appendChild(el("span","pill plain",
      label(e.severity) + (e.cvss_v3 != null ? " · CVSS " + e.cvss_v3 : "")));
    if (e.vendor) meta.appendChild(el("span","pill plain", e.vendor));
    (e.cve_ids || []).slice(0,4).forEach(function(c){ meta.appendChild(el("span","cve", c)); });
    if ((e.cve_ids || []).length > 4)
      meta.appendChild(el("span","cve more", "+" + (e.cve_ids.length - 4) + " more"));
    body.appendChild(meta);
    if (e.summary) body.appendChild(el("p","teaser", e.summary));
    head.appendChild(body);

    var caret = document.createElementNS("http://www.w3.org/2000/svg","svg");
    caret.setAttribute("class","caret"); caret.setAttribute("width","11");
    caret.setAttribute("height","11"); caret.setAttribute("viewBox","0 0 12 12");
    caret.setAttribute("fill","none"); caret.setAttribute("aria-hidden","true");
    var cp = document.createElementNS("http://www.w3.org/2000/svg","path");
    cp.setAttribute("d","m3 1 5 5-5 5"); cp.setAttribute("stroke","currentColor");
    cp.setAttribute("stroke-width","1.8"); cp.setAttribute("stroke-linecap","round");
    cp.setAttribute("stroke-linejoin","round");
    caret.appendChild(cp); head.appendChild(caret);
    li.appendChild(head);

    /* detail */
    var det = el("div","detail");

    var facts = sec("At a glance");
    var fl = el("dl","facts");
    if (e.id) kv(fl, "Entry ID", e.id);
    if (e.category) kv(fl, "Category", CATEGORY[e.category] || label(e.category));
    if (S) kv(fl, "Exploitation", S.full);
    kv(fl, "Patch available", label(e.patch_available));
    if (e.first_reported) kv(fl, "First reported", e.first_reported);
    if (e.last_updated) kv(fl, "Last updated", e.last_updated);
    if (e.confidence) kv(fl, "Entry confidence", label(e.confidence));
    if (e.kev_due_date) kv(fl, "KEV due date", e.kev_due_date);
    facts.appendChild(fl);
    det.appendChild(facts);

    if (e.summary){
      var s1 = sec("Analyst summary");
      s1.appendChild(el("p","prose", e.summary));
      det.appendChild(s1);
    }
    if ((e.affected_products || []).length){
      var s2 = sec("Affected products");
      var u2 = el("ul","list");
      e.affected_products.forEach(function(p){ u2.appendChild(el("li", null, p)); });
      s2.appendChild(u2); det.appendChild(s2);
    }
    if ((e.recommended_actions || []).length){
      var s3 = sec("Recommended actions");
      var u3 = el("ul","list num");
      e.recommended_actions.forEach(function(a){ u3.appendChild(el("li", null, a)); });
      s3.appendChild(u3); det.appendChild(s3);
    }

    /* KQL */
    if ((e.kql || []).length){
      var s4 = sec("Detection — KQL for Sentinel / Defender XDR (" + e.kql.length + ")");
      e.kql.forEach(function(q){
        var box = el("div","kql"), h = el("div","kql-head");
        var kn = el("div","kn");
        kn.appendChild(el("h4", null, q.name || "Query"));
        if (q.description) kn.appendChild(el("p", null, q.description));
        h.appendChild(kn);
        var plat = el("span","plat",
          (PLATFORM[q.platform] || q.platform || "") + (q.table ? " · " + q.table : ""));
        h.appendChild(plat);
        h.appendChild(copyBtn(function(){ return q.query || ""; }, "Copy KQL"));
        box.appendChild(h);
        var pre = el("pre"), code = el("code");
        code.appendChild(highlight(q.query || ""));
        pre.appendChild(code); box.appendChild(pre);
        s4.appendChild(box);
      });
      det.appendChild(s4);
    }

    /* IOCs */
    var iocs = e.iocs || [];
    if (iocs.length){
      var real = iocs.filter(function(i){ return i.type !== "note"; });
      var notes = iocs.filter(function(i){ return i.type === "note"; });
      var s5 = sec("Indicators of compromise (" + real.length + ")");
      if (real.length){
        s5.querySelector("h3").appendChild(copyBtn(function(){
          return real.map(function(i){ return i.value; }).join("\n");
        }, "Copy values"));
      }
      notes.forEach(function(n){
        var np = el("p","note-row", "⚠ " + n.context);
        np.style.margin = "0 0 13px"; s5.appendChild(np);
      });
      if (real.length){
        var wrap = el("div","tbl-wrap"), tb = el("table");
        var thead = el("thead"), tr = el("tr");
        ["Type","Value","Confidence","Context","Source"].forEach(function(h2){
          tr.appendChild(el("th", null, h2));
        });
        thead.appendChild(tr); tb.appendChild(thead);
        var tbody = el("tbody");
        real.forEach(function(i){
          var r = el("tr");
          r.appendChild(el("td","t", i.type));
          r.appendChild(el("td","v", i.value));
          var cd = el("td");
          cd.appendChild(el("span","cf " + (i.confidence || "low"), i.confidence || "—"));
          r.appendChild(cd);
          r.appendChild(el("td","ctx", i.context || "—"));
          r.appendChild(el("td","src", i.source || "—"));
          tbody.appendChild(r);
        });
        tb.appendChild(tbody); wrap.appendChild(tb); s5.appendChild(wrap);
      }
      det.appendChild(s5);
    }

    if ((e.references || []).length){
      var s6 = sec("References");
      var u6 = el("ul","refs");
      e.references.forEach(function(r){
        var li6 = el("li"), a = el("a", null, r);
        a.href = r; a.target = "_blank"; a.rel = "noopener noreferrer";
        li6.appendChild(a); u6.appendChild(li6);
      });
      s6.appendChild(u6); det.appendChild(s6);
    }

    li.appendChild(det);

    head.addEventListener("click", function(){
      var open = li.classList.toggle("is-open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
    });
    return li;
  }

  /* ---------- filtering ---------- */
  function haystack(e){
    var parts = [e.title, e.summary, e.vendor, e.id, e.category, e.severity, e.exploitation_status];
    parts = parts.concat(e.cve_ids || [], e.affected_products || [], e.recommended_actions || []);
    (e.iocs || []).forEach(function(i){ parts.push(i.value, i.type, i.context); });
    (e.kql || []).forEach(function(q){ parts.push(q.name, q.table, q.description); });
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function apply(){
    var v = DATA.vulnerabilities || [];
    var q = FILTER.q.trim().toLowerCase();
    var shown = 0;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li, idx){
      var e = v[idx], ok = true;
      if (FILTER.status !== "all" && e.exploitation_status !== FILTER.status) ok = false;
      if (ok && FILTER.kev && !e.kev_listed) ok = false;
      if (ok && FILTER.nopatch && e.patch_available === "yes") ok = false;
      if (ok && q && li._hay.indexOf(q) === -1) ok = false;
      li.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById("count").textContent = shown + " of " + v.length + " shown";
    document.getElementById("empty").hidden = shown !== 0;
  }

  function renderChips(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];
    var counts = {};
    v.forEach(function(e){ counts[e.exploitation_status] = (counts[e.exploitation_status]||0)+1; });
    var box = document.getElementById("status-chips"); box.textContent = "";
    var defs = [["all","All",v.length]];
    order.forEach(function(k){ if (counts[k]) defs.push([k, STATUS[k].short, counts[k]]); });
    defs.forEach(function(d){
      var b = el("button","chip", d[1] + " (" + d[2] + ")");
      b.type = "button";
      b.setAttribute("aria-pressed", FILTER.status === d[0] ? "true" : "false");
      b.addEventListener("click", function(){
        FILTER.status = d[0];
        Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        apply();
      });
      box.appendChild(b);
    });
  }

  /* ---------- provenance ---------- */
  function renderProv(){
    var cm = DATA.collection_metadata || {};
    var box = document.getElementById("prov-body"); box.textContent = "";
    if (cm.collection_method){
      box.appendChild(el("h4", null, "Collection method"));
      box.appendChild(el("p","prose", cm.collection_method));
    }
    if ((cm.limitations || []).length){
      box.appendChild(el("h4", null, "Limitations"));
      var u = el("ul","list");
      cm.limitations.forEach(function(l){ u.appendChild(el("li", null, l)); });
      box.appendChild(u);
    }
    if (cm.confidence_legend){
      box.appendChild(el("h4", null, "Confidence legend"));
      var dl = el("dl");
      Object.keys(cm.confidence_legend).forEach(function(k){
        dl.appendChild(el("dt", null, k));
        dl.appendChild(el("dd", null, cm.confidence_legend[k]));
      });
      box.appendChild(dl);
    }
    var w = (DATA.report || {}).coverage_window || {};
    if (w.note){
      box.appendChild(el("h4", null, "Coverage window note"));
      box.appendChild(el("p","prose", w.note));
    }
    if ((cm.ioc_types_present || []).length){
      box.appendChild(el("h4", null, "IOC types present"));
      box.appendChild(el("p","prose", cm.ioc_types_present.join(", ")));
    }
  }

  /* ---------- report archive timeline ---------- */
  var TL_SHOWN = 10;

  function shortDate(iso){
    var p = String(iso).split("-");
    if (p.length !== 3) return String(iso);
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1];
    return (+p[2]) + " " + mon;
  }
  function longDate(iso){
    var p = String(iso).split("-");
    return p.length === 3 ? shortDate(iso) + " " + p[0] : String(iso);
  }
  /* A dated report sits in reports/; the stable copy sits at the repo root.
     Work out which, so archive links resolve from either location. */
  function archivePrefix(){
    return location.pathname.indexOf("/reports/") > -1 ? "" : "reports/";
  }

  function renderTimeline(index){
    var box = document.getElementById("timeline");
    box.textContent = "";
    var reports = (index && index.reports) || [];
    if (!reports.length){ box.hidden = true; return; }
    box.hidden = false;

    var current = index.generated_for;
    var prefix  = archivePrefix();
    var peak    = Math.max.apply(null, reports.map(function(r){ return r.actively_exploited || 0; }));
    if (!peak) peak = 1;

    /* header */
    var head = el("div","tl-head");
    head.appendChild(el("h2", null, "Report archive"));
    var meta = el("span","tl-meta");
    meta.appendChild(el("b", null, reports.length));
    meta.appendChild(document.createTextNode(
      " reports · " + longDate(reports[0].date) +
      " – " + longDate(reports[reports.length-1].date)));
    head.appendChild(meta);
    /* A dated report's index stops at its own date, so it can never name a
       later report. The stable root copy is always the newest, so offer that
       as the way forward. Omitted at the root, where it is the current page. */
    if (!prefix){
      var latest = el("a","tl-latest","Latest report \u2192");
      latest.href = "../ti-report.html";
      head.appendChild(latest);
    }
    box.appendChild(head);

    /* bars - one series (actively exploited per report), so no legend box;
       the caption names it. Hover and keyboard focus both open the tooltip. */
    var chart = el("div","tl-chart");
    var bars  = el("div","tl-bars");
    var tip   = el("div","tl-tip"); tip.hidden = true;

    reports.forEach(function(r){
      var b = el("button","tl-bar" + (r.date === current ? " is-current" : ""));
      b.type = "button";
      b.setAttribute("aria-label",
        longDate(r.date) + ": " + (r.actively_exploited||0) + " actively exploited of " +
        r.entries + " entries");
      var fill = el("span","tl-fill");
      fill.style.height = Math.max(4, Math.round((r.actively_exploited||0) / peak * 100)) + "%";
      b.appendChild(fill);

      function show(){
        tip.textContent = "";
        tip.appendChild(el("p","t-d", longDate(r.date) + (r.date === current ? "  (this report)" : "")));
        if (r.headline) tip.appendChild(el("p","t-h", r.headline));
        tip.appendChild(el("p","t-c",
          r.entries + " entries · " + (r.actively_exploited||0) + " exploited · " +
          (r.kev_listed||0) + " KEV · " + (r.cves||0) + " CVEs"));
        tip.hidden = false;
        /* clamp the tooltip inside the chart */
        var left = b.offsetLeft + b.offsetWidth/2 - bars.scrollLeft;
        var w = tip.offsetWidth || 200;
        var maxLeft = chart.clientWidth - w;
        tip.style.left = Math.max(0, Math.min(left - w/2, maxLeft < 0 ? 0 : maxLeft)) + "px";
      }
      function hide(){ tip.hidden = true; }
      b.addEventListener("mouseenter", show);
      b.addEventListener("focus", show);
      b.addEventListener("mouseleave", hide);
      b.addEventListener("blur", hide);
      b.addEventListener("click", function(){ location.href = prefix + r.file; });
      bars.appendChild(b);
    });

    chart.appendChild(tip);
    chart.appendChild(bars);
    var axis = el("div","tl-axis");
    axis.appendChild(el("span", null, shortDate(reports[0].date)));
    axis.appendChild(el("span", null, "actively exploited per report · peak " + peak));
    axis.appendChild(el("span", null, shortDate(reports[reports.length-1].date)));
    chart.appendChild(axis);
    box.appendChild(chart);

    /* newest-first list - this doubles as the chart's table view */
    var list = el("ol","tl-list");
    var ordered = reports.slice().reverse();
    ordered.forEach(function(r, i){
      var li = el("li");
      if (i >= TL_SHOWN) li.hidden = true;
      var a = el("a","tl-row" + (r.date === current ? " is-current" : ""));
      a.href = prefix + r.file;
      a.appendChild(el("span","tl-d", shortDate(r.date)));
      a.appendChild(el("span","tl-h", r.headline || "—"));
      if (r.date === current) a.appendChild(el("span","tl-now","viewing"));
      a.appendChild(el("span","tl-c",
        r.entries + "e · " + (r.actively_exploited||0) + "x · " + (r.kev_listed||0) + "k"));
      li.appendChild(a);
      list.appendChild(li);
    });
    box.appendChild(list);

    if (ordered.length > TL_SHOWN){
      var more = el("button","btn tl-more", "Show all " + ordered.length + " reports");
      more.type = "button";
      var open = false;
      more.addEventListener("click", function(){
        open = !open;
        Array.prototype.forEach.call(list.children, function(li, i){
          li.hidden = open ? false : i >= TL_SHOWN;
        });
        more.textContent = open ? "Show recent only" : "Show all " + ordered.length + " reports";
      });
      box.appendChild(more);
    }
  }

  /* ---------- boot ---------- */
  function render(data){
    DATA = data;
    renderHead(); renderTiles(); renderPosture(); renderChips(); renderProv();
    var list = document.getElementById("entries"); list.textContent = "";
    (DATA.vulnerabilities || []).forEach(function(e){
      var li = renderEntry(e);
      li._hay = haystack(e);
      list.appendChild(li);
    });
    ALL_OPEN = false;
    document.getElementById("toggle-all").textContent = "Expand all";
    apply();
  }

  document.getElementById("q").addEventListener("input", function(ev){
    FILTER.q = ev.target.value; apply();
  });
  ["f-kev","f-nopatch"].forEach(function(id){
    document.getElementById(id).addEventListener("click", function(){
      var b = document.getElementById(id);
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      FILTER[id === "f-kev" ? "kev" : "nopatch"] = on;
      apply();
    });
  });
  document.getElementById("toggle-all").addEventListener("click", function(){
    ALL_OPEN = !ALL_OPEN;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li){
      li.classList.toggle("is-open", ALL_OPEN);
      var h = li.querySelector(".chead");
      if (h) h.setAttribute("aria-expanded", ALL_OPEN ? "true" : "false");
    });
    this.textContent = ALL_OPEN ? "Collapse all" : "Expand all";
  });

  /* drag & drop any TI JSON */
  var dragDepth = 0;
  window.addEventListener("dragenter", function(ev){ ev.preventDefault(); if (++dragDepth) document.body.classList.add("dragging"); });
  window.addEventListener("dragover",  function(ev){ ev.preventDefault(); });
  window.addEventListener("dragleave", function(){ if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("drop", function(ev){
    ev.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var parsed = JSON.parse(fr.result);
        if (!parsed || !parsed.vulnerabilities) throw new Error("not a TI output config");
        render(parsed);
        window.scrollTo(0,0);
      } catch(err){
        alert("Could not load that file: " + err.message);
      }
    };
    fr.readAsText(f);
  });

  /* embedded data first (works offline from file://); refresh from the sibling
     JSON when served over http(s) so a hosted copy always shows today's feed */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("ti-data").textContent); } catch(e){}
  if (embedded && embedded.vulnerabilities) render(embedded);

  /* The archive index describes the reports/ directory, not the data on show,
     so it is rendered once and left alone when another config is loaded. */
  try { renderTimeline(JSON.parse(document.getElementById("ti-index").textContent)); }
  catch(e){ document.getElementById("timeline").hidden = true; }

  if (location.protocol === "http:" || location.protocol === "https:"){
    fetch("ti-output-config.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      if (j && j.vulnerabilities){
        var a = (j.report||{}).check_performed_at, b = (embedded&&embedded.report||{}).check_performed_at;
        if (a !== b) render(j);
      }
    }).catch(function(){ /* offline or no sibling file - embedded copy stands */ });
  }
})();
</script>
</body>
</html>
