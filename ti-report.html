eeded, but the guest account must be enabled for it to work. It is version-independent, it takes minutes, and it is the one action that matters most in this entry.","RESTRICT THE CACTI WEB INTERFACE TO TRUSTED MANAGEMENT NETWORKS. A network monitoring console has no business being reachable from the internet. If yours is, fix that today rather than waiting for a patch that does not exist yet.","SEARCH YOUR CACTI LOGS AND DATABASE FOR NON-NUMERIC VALUES IN GRAPH DISPLAY SETTINGS. This is the most specific detection available and it searches directly for the stored payload: a graph display preference is supposed to hold a number, so a non-numeric value in that field is the injection itself. Check the user settings and preference tables for the guest user in particular.","REVIEW POLLER CONFIGURATION FOR UNEXPECTED COMMANDS. The exploit works by altering the commands Cacti's real-time poller executes. Compare your poller, data input method and script definitions against a known-good baseline or a fresh installation, and look for anything that invokes a shell, an interpreter, curl, wget or an encoded string.","INVENTORY CACTI, INCLUDING THE INSTANCES THAT WERE NEVER FORMALLY PROVISIONED. Look for /cacti/ paths in web server configuration, cacti database schemas, poller cron entries, and TCP 80/443 listeners on hosts with monitoring, nms, cacti or graph in their names. Open-source monitoring is commonly stood up by a network team outside the standard asset process, which is exactly how it ends up unmanaged.","TREAT THE CREDENTIALS CACTI HOLDS AS POTENTIALLY EXPOSED IF YOU FIND EVIDENCE OF COMPROMISE, AND PLAN THE ROTATION NOW EVEN IF YOU DO NOT. By design Cacti stores SNMP community strings, SNMPv3 credentials and often device or SSH credentials for data collection. A foothold there is a credential store for your whole network estate, and rotating SNMP credentials across an estate takes planning you do not want to start during an incident.","DO NOT REPEAT THE 'UNAUTHENTICATED ROOT' FRAMING AS THE DEFAULT CASE. The researcher demonstrated root only in a lab where Cacti already ran as root; typical deployments run as www-data or apache, so the realistic default outcome is command execution as the web server user. Overstating it costs you credibility and understates the thing that actually matters, which is the credential store.","WATCH FOR A CACTI RELEASE AND APPLY IT AS AN EMERGENCY CHANGE WHEN IT APPEARS. The flaw was published without disclosure to the project, so the project started from the same position as everyone else. Expect a fix on a short timeline and have the change pre-approved rather than queued behind a normal cycle.","DO NOT WAIT FOR A CVE IDENTIFIER OR A KEV LISTING TO JUSTIFY ACTION. There is no CVE, no official severity rating and no KEV entry, and there correctly will not be a KEV entry until exploitation is reported. If your process cannot raise an emergency change without a CVE number, that is the finding to escalate out of this entry - because this is the second item in this report whose remediation is configuration rather than a patch.","MONITOR FOR OUTBOUND CONNECTIONS AND CHILD PROCESSES FROM THE CACTI HOST. A monitoring server talks to the devices it polls and to its own database. A web server process on that host spawning a shell, or the host connecting outbound to an unfamiliar address, is the signal that command execution succeeded."],"references":["https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/","https://intel.threadlinqs.com/threat/TL-2026-6953","https://mezha.net/eng/news/mezha-52e553ac2d26b0bfc2c0de7d_cacti_zero-day_disclosed","https://windowsforum.com/news/cacti-4http2shell-zero-day-poc-enables-rce-via-guest-access-mitigation-guide.454357/","https://mlq.ai/news/unpatched-cacti-zero-day-gets-a-public-exploit-for-remote-code-execution/","https://hitechub.com/unpatched-cacti-zero-day-exploit-with-public-poc-enables-remote-code-execution/","https://gazewire.com/technology-innovation/cybersecurity/unpatched-cacti-zero-day-flaw-exposes-infrastructure"],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Unauthenticated access to Cacti graph and user settings paths","description":"The front door for this exploit. The payload is written into a guest user's graph display preferences, so requests to the graph and settings paths from unauthenticated or guest sessions are the delivery surface. Any such request from outside your management network is urgent regardless of this CVE.","query":"W3CIISLog\n| where TimeGenerated > datetime(2026-11-24)\n| where csUriStem has_any (\"/cacti/\", \"graph_view.php\", \"graph.php\", \"graph_settings.php\", \"user_admin.php\", \"auth_login.php\", \"graph_image.php\")\n| summarize Requests = count(), Paths = make_set(csUriStem, 20), Statuses = make_set(scStatus, 10), Agents = make_set(csUserAgent, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by cIP, csHost, Computer\n| extend ExternalSource = not(ipv4_is_private(cIP))\n| order by ExternalSource desc, Requests desc"},{"platform":"sentinel","table":"W3CIISLog","name":"SQL injection syntax in Cacti graph settings parameters - the stored payload in flight","description":"Catches the injection at delivery. The flaw is a stored second-order SQL injection written through graph display preferences, so SQL syntax appearing in those parameters is the payload itself rather than a generic scanner artefact.","query":"let SqlSyntax = dynamic([\"union select\",\"union all select\",\"' or \",\"\\\" or \",\"sleep(\",\"benchmark(\",\"concat(\",\"load_file\",\"into outfile\",\"information_schema\",\"0x\",\"char(\",\"--\",\"/*\"]);\nW3CIISLog\n| where TimeGenerated > datetime(2026-11-24)\n| where csUriStem has_any (\"/cacti/\", \"graph_settings.php\", \"graph_view.php\", \"graph.php\")\n| extend Payload = url_decode(strcat(tostring(csUriQuery), \" \", tostring(csUriStem)))\n| where Payload has_any (SqlSyntax)\n| project TimeGenerated, cIP, csHost, csMethod, csUriStem, Payload, scStatus, csUserAgent, Computer\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Cacti poller or web process spawning a shell - command execution achieved","description":"THE QUERY THAT ANSWERS WHETHER YOU WERE COMPROMISED RATHER THAN PROBED. The exploit alters the commands Cacti's real-time poller executes. A poller or web server process spawning a shell, interpreter or download tool is the exploitation outcome.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-11-24)\n| where InitiatingProcessCommandLine has_any (\"poller.php\", \"poller_\", \"cmd_realtime.php\", \"cacti\", \"spine\")\n   or (InitiatingProcessFileName in~ (\"php\", \"php-fpm\", \"httpd\", \"apache2\", \"nginx\") and DeviceName has_any (\"cacti\", \"nms\", \"monitor\", \"graph\"))\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"curl\", \"wget\", \"python\", \"python3\", \"perl\", \"nc\", \"ncat\", \"base64\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Unexpected outbound connections from a Cacti or monitoring host","description":"A monitoring server talks to the devices it polls and to its own database. Outbound connections to unfamiliar external addresses, especially on non-standard ports, indicate either a reverse shell or data movement.","query":"DeviceNetworkEvents\n| where Timestamp > datetime(2026-11-24)\n| where DeviceName has_any (\"cacti\", \"nms\", \"monitor\", \"graph\", \"spine\")\n| where ActionType == \"ConnectionSuccess\"\n| where not(ipv4_is_private(RemoteIP))\n| where RemotePort !in (80, 443, 53, 123, 161, 162)\n| summarize Connections = count(), Ports = make_set(RemotePort, 20), Processes = make_set(InitiatingProcessFileName, 10), FirstSeen = min(Timestamp) by DeviceName, RemoteIP, RemoteUrl\n| order by Connections desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"New script or web-accessible files written into a Cacti installation","description":"Persistence check. A Cacti webroot or scripts directory acquiring new PHP or shell files outside a package update is a web shell or a poisoned data input script.","query":"DeviceFileEvents\n| where Timestamp > datetime(2026-11-24)\n| where FolderPath has_any (\"/cacti\", \"\\\\cacti\", \"/cacti/scripts\", \"/cacti/resource\")\n| where ActionType in (\"FileCreated\", \"FileModified\")\n| where FileName endswith \".php\" or FileName endswith \".sh\" or FileName endswith \".pl\" or FileName endswith \".py\"\n| where InitiatingProcessFileName !in~ (\"apt\", \"dpkg\", \"yum\", \"dnf\", \"rpm\", \"git\", \"rsync\")\n| project Timestamp, DeviceName, FolderPath, FileName, ActionType, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| order by Timestamp desc"}],"iocs":[{"type":"behaviour","value":"A NON-NUMERIC VALUE in a Cacti graph display setting or user graph preference","context":"THE MOST SPECIFIC DETECTION AVAILABLE FOR THIS FLAW AND IT SEARCHES FOR THE PAYLOAD DIRECTLY. A graph display preference is supposed to hold a number. The exploit stores malicious SQL in that field. Explicitly recommended in the reporting as a log and database check.","confidence":"high","source":"Mitigation guidance published alongside the 4HTTP2SHELL disclosure, 26-27 November 2026"},{"type":"behaviour","value":"Cacti GUEST ACCOUNT ENABLED on a reachable installation","context":"NOT an indicator of compromise - it is THE PRECONDITION for the exploit. No credentials and no API key are required, but the guest account must be enabled. Disabling it removes the attack entirely and is the single most valuable action in this entry.","confidence":"high","source":"Researcher's published exploit requirements via BleepingComputer and secondary reporting"},{"type":"behaviour","value":"Unexpected commands in Cacti poller, data input method or script definitions compared to a known-good baseline","context":"The exploit achieves execution by altering the commands the real-time poller runs. Explicitly recommended in the reporting as a configuration review. Look for shells, interpreters, curl, wget or encoded strings.","confidence":"high","source":"Mitigation guidance published alongside the disclosure, 26-27 November 2026"},{"type":"behaviour","value":"SQL syntax - union select, sleep(, benchmark(, load_file, into outfile, information_schema, concat( - appearing in Cacti graph settings or graph view parameters","context":"The injection in flight rather than at rest. Because the flaw is a stored second-order SQL injection delivered through graph preferences, SQL syntax in those specific parameters is the payload rather than generic scanner noise.","confidence":"medium","source":"Analyst assessment based on the published root cause"},{"type":"behaviour","value":"A Cacti poller (poller.php, cmd_realtime.php, spine) or web server process spawning sh, bash, curl, wget, python, perl or nc","context":"The exploitation outcome. Distinguishes probing from compromise. Note that on a typical deployment this runs as www-data or apache, not root.","confidence":"medium","source":"Analyst assessment based on the published execution path"},{"type":"malware","value":"4HTTP2SHELL (earlier named 4HTTP2ROOT) - the public exploit name","context":"Useful as a search term across threat intelligence feeds, vendor advisories and the Cacti project's own channels while tracking whether a patch or in-the-wild exploitation is reported.","confidence":"high","source":"Researcher 'ek0ms savi0r' / Church of Malware, via BleepingComputer and secondary reporting"},{"type":"note","value":"NO PATCH, NO CVE, NO OFFICIAL SEVERITY RATING, AND NOT DISCLOSED TO THE CACTI PROJECT BEFORE PUBLIC RELEASE on THANKSGIVING DAY, 26 NOVEMBER 2026","context":"The project started from the same position as everyone else. The exploitation window opened before anyone could close it. Have an emergency change pre-approved for when a release appears.","confidence":"high","source":"BleepingComputer and multiple secondary reports, 26-27 November 2026"},{"type":"note","value":"ROOT CAUSE: a STORED, SECOND-ORDER SQL INJECTION. The exploit writes malicious SQL into a guest user's graph display preferences; that stored value later alters the commands executed by Cacti's REAL-TIME POLLER, producing command execution","context":"Understanding the mechanism is what makes the two recommended checks - non-numeric graph settings, and unexpected poller commands - searchable rather than generic.","confidence":"high","source":"Researcher's disclosure via BleepingComputer and threat intelligence write-ups"},{"type":"note","value":"THE PRIVILEGE CLAIM IS OVERSTATED IN SOME COVERAGE: root was demonstrated only IN A LAB WHERE CACTI ALREADY RAN AS ROOT. Typical deployments run as www-data or apache, so the realistic default outcome is command execution as the WEB SERVER USER","context":"Still a serious compromise - a foothold in monitoring infrastructure - but 'unauthenticated root' is not the baseline. Do not repeat the stronger framing.","confidence":"high","source":"BleepingComputer and secondary reporting, 26-27 November 2026"},{"type":"note","value":"VERSION SCOPE IS UNKNOWN: tested against Cacti Core 1.2.31. NO source establishes whether earlier versions are affected","context":"Do not assume an older version is safe and do not assert that it is vulnerable. The guest account check is version-independent, which is why it is the right action while scope is unresolved.","confidence":"high","source":"Researcher's testing scope via BleepingComputer and secondary reporting"},{"type":"note","value":"EXPLOITATION STATUS: as of 27 November there were NO REPORTS of this being exploited in attacks, and it is correctly NOT in CISA KEV","context":"Not comfort. A public, tested, unauthenticated exploit against an internet-reachable monitoring platform with no available patch is the configuration that produces mass exploitation within days, and the holiday release means the clock started while defenders were away.","confidence":"high","source":"BleepingComputer and CISA KEV absence, 27 November 2026"},{"type":"note","value":"WHAT A CACTI COMPROMISE ACTUALLY COSTS: by design Cacti holds SNMP community strings and SNMPv3 credentials for the network estate, often device or SSH credentials for collection, a database of topology, inventory, interface naming and addressing, and a poller that executes commands on a schedule","context":"An attacker who reaches execution gets a network credential store, a network map and a legitimate scheduled execution mechanism to hide in. This is why the entry ranks where it does despite no confirmed exploitation.","confidence":"high","source":"Analyst assessment based on documented Cacti architecture"},{"type":"note","value":"PROCESS FINDING: this is the SECOND item in this report whose remediation is NOT a patch - CVE-2026-131914 (Idunno.AntiCsrf, rank 4) has no patch and never will, and this flaw has no patch yet. Both are closed by configuration change or dependency removal","context":"A vulnerability management process built as a patch-deployment pipeline will tend to leave both open while reporting green on everything patchable. Worth raising with whoever owns that pipeline.","confidence":"high","source":"Analyst assessment"}]},{"rank":6,"id":"TI-2026-11-28-006","title":"A LLOYD'S OF LONDON SPECIALTY INSURER LISTED ON A LEAK SITE YESTERDAY: INC Ransom Named Brit Ltd / Brit Insurance on 27 November With a Roughly 33-DAY Countdown - Brit Has Published NOTHING, Sources CONTRADICT Each Other on Whether Proof Was Posted, and the Group's Listings Have a DOCUMENTED History of Fabricated Victims","cve_ids":[],"vendor":"Brit Ltd / Brit Insurance (Fairfax-owned Lloyd's specialty insurer); INC Ransom (extortion group)","affected_products":["Brit Insurance corporate systems (claimed, unverified)","britinsurance.com (the domain named in the listing)"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-27","last_updated":"2026-11-28","confidence":"low","summary":"THIS IS THE NEWEST UK CORPORATE ITEM IN THE WINDOW AND IT CARRIES THE WEAKEST EVIDENCE CLASS THIS FEED HANDLES - AN ATTACKER'S OWN LEAK-SITE POST. It is ranked here because of WHO is named, not because the claim is established. On 27 NOVEMBER 2026 the INC Ransom extortion group listed 'Brit Ltd / Brit Insurance' on its leak site, naming the domain britinsurance.com, with a countdown reported at approximately 33 DAYS. Brit is a Fairfax-owned LLOYD'S OF LONDON SPECIALTY INSURER. Brit had published nothing on its own news page as of Friday afternoon, and no Brit or Lloyd's statement confirming or denying a breach was found anywhere in this window.\n\nTHE SOURCES DIRECTLY CONTRADICT EACH OTHER ON THE ONE THING THAT WOULD MATTER, AND THIS REPORT WILL NOT PICK A SIDE. One tracker states the listing carried 22 IMAGES presented as proof of access. Another states the opposite in explicit terms: that the entry provides NO details about the alleged data, NO volume, NO ransom demand and INCLUDES NO SCREENSHOTS OR OTHER IMAGES. Those two accounts cannot both be true of the same listing. Either one tracker is describing a later revision of the post, or one of them is wrong. The practical consequence is that NOBODY READING SECONDARY SOURCES CAN CURRENTLY SAY WHETHER INC RANSOM HAS SHOWN ANY PROOF AT ALL, and the presence or absence of proof images is the main thing that separates a real intrusion from a fabricated listing. Anyone relying on this entry for a decision should treat the proof question as OPEN.\n\nTHE GROUP'S CREDIBILITY PROBLEM IS DOCUMENTED, NOT ASSUMED. At least one tracker carries an explicit warning that listings attributed to INCRANSOM have been reported as including UNVERIFIED OR FABRICATED VICTIM CLAIMS. Independent trackers are labelling this entry as a claim rather than a breach - one records it as 'Claim, unrated'. That caveat is central to how this entry should be read: a leak-site listing is an advertisement by a criminal enterprise, and the incentive to inflate is structural. This feed records such listings because they are leading indicators and because the countdown creates a real date, not because they are evidence.\n\nWHY A LLOYD'S SPECIALTY INSURER IS NONETHELESS A HIGH-CONSEQUENCE NAME. If this claim is real, the data class involved is unusually sensitive even by breach standards. A specialty insurer and Lloyd's market participant holds underwriting submissions and risk surveys describing OTHER ORGANISATIONS' vulnerabilities and control weaknesses; claims files containing incident detail, forensic reports and settlement figures; reinsurance and broker correspondence; and - specifically relevant to this feed - CYBER INSURANCE UNDERWRITING AND CLAIMS MATERIAL, which is in effect a curated database of its insureds' security postures and their worst days. That is why insurer compromises matter beyond the insurer: the SECOND-ORDER population is the insureds, the brokers and the reinsurers, none of whom will be notified by the attacker and many of whom have no idea their data sits there. If you hold a Brit policy, or you broke business to Brit, or you submitted a cyber underwriting questionnaire to Brit, you are in that population. This is an ASSESSMENT OF THE DATA CLASS a specialty insurer typically holds, NOT a statement about what INC Ransom has - no data categories, volumes or samples have been established.\n\nTHE REGULATORY CLOCK IS THE ONE OBJECTIVE THING HERE. Under UK data protection law, if personal data was taken, Brit would generally have to notify the ICO WITHIN 72 HOURS of becoming aware. The listing appeared 27 November. If the claim is genuine and personal data is involved, that window closes around 30 NOVEMBER. The absence of any Brit statement today tells you nothing either way - companies properly take time to establish facts, and the 72-hour clock runs from awareness, not from a leak-site post. But it does mean that the NEXT FEW DAYS are when this resolves, in one direction or the other. A Brit statement, an ICO reference, or the publication of sample data are the three things to watch for.\n\nTHE BROADER PATTERN THIS SITS IN, AND IT IS THE REASON THIS ENTRY IS WORTH READING EVEN IF THE CLAIM IS FALSE. This is now the FOURTH UK organisation in roughly one week to appear on an extortion leak site or disclose a third-party compromise: the University of Liverpool on 25 November (rank 7), Next plc's supplier on 23 November and hmv and others via N0n on 25 November (rank 10), Gatwick's AutoPay supplier on 24-25 November (rank 10), and now Brit on 27 November. Three of those four involve either a THIRD PARTY or an UNVERIFIED CRIMINAL CLAIM rather than a confirmed intrusion at the named brand's own perimeter. The UK financial services sector has not featured in this feed's recent windows; its appearance now, in the Lloyd's market, is the development worth noting even while the specific claim remains unproven.\n\nWHAT CAN ACTUALLY BE DONE TODAY. Nothing can be done ABOUT Brit by anyone outside Brit. What can be done is the thing that is useful whether or not this claim is real: establish whether YOUR organisation has data sitting inside Brit or inside your other insurers and brokers, and decide in advance what you would do if an insurer told you your underwriting submissions had been published. That question has no good answer improvised during an incident. INC Ransom is also a known ransomware operator with documented tradecraft, so the generic hunting in this entry - credential access, lateral movement, exfiltration staging - is worth running on its own merits by anyone in the UK insurance or broking sector this weekend. NO ATTACKER IP ADDRESSES, DOMAINS, FILE HASHES OR MALWARE SAMPLES SPECIFIC TO THIS LISTING HAVE BEEN PUBLISHED by any source reviewed, so the detection content here is behavioural and sector-generic rather than incident-specific, and it is labelled as such.","recommended_actions":["IF YOU ARE A BRIT POLICYHOLDER, A BROKER WHO PLACED BUSINESS WITH BRIT, OR A REINSURER WITH BRIT EXPOSURE: ask Brit directly, in writing, today, whether your data is implicated. Do not wait for a public statement. The second-order population in an insurer compromise is the insureds and brokers, and the attacker will not notify them.","IF YOU EVER SUBMITTED A CYBER INSURANCE UNDERWRITING QUESTIONNAIRE OR RISK SURVEY TO BRIT, TREAT THAT CONTENT AS POTENTIALLY SENSITIVE EXPOSURE. Those documents describe your own control weaknesses, architecture and incident history in detail. Identify what you submitted and when, so that you can assess impact quickly if data is published rather than starting from scratch.","DO NOT REPEAT THIS AS A CONFIRMED BREACH IN ANY INTERNAL OR EXTERNAL COMMUNICATION. Brit has published nothing, trackers label it a claim, the group has a documented history of unverified or fabricated victim listings, and sources contradict each other on whether any proof images exist. The accurate formulation is: INC Ransom has listed Brit Insurance; the claim is unverified; Brit has not commented.","TREAT THE PROOF QUESTION AS OPEN AND DO NOT RESOLVE IT FROM SECONDARY SOURCES. One tracker reports 22 proof images; another explicitly reports no screenshots or images and no stated data volume or ransom demand. These accounts are mutually exclusive. The presence or absence of proof is the main discriminator between a real intrusion and a fabricated listing, so leaving it open is the honest position.","SET A REVIEW POINT FOR MONDAY 30 NOVEMBER, which is roughly when a 72-hour ICO notification window from the listing date would close if personal data is involved and if awareness coincided with the listing. Watch for three specific things: a Brit statement, an ICO reference, and the publication of sample data. Any of the three resolves this entry.","UK INSURANCE AND BROKING SECTOR: RUN THE GENERIC EXTORTION-PRECURSOR HUNTING THIS WEEKEND ON ITS OWN MERITS. INC Ransom is an established operator with documented tradecraft. Look for anomalous volumes of data read by a single account, archive creation on file servers, cloud storage utility execution in unusual places, and new remote access tooling. None of this is specific to this listing and all of it is worth doing.","CHECK YOUR OWN SUPPLY CHAIN FOR BRIT AND FOR OTHER INSURERS AS DATA PROCESSORS. Insurers, brokers, loss adjusters and claims handlers hold concentrated, sensitive data about their corporate clients and are rarely mapped as suppliers in the way a SaaS vendor would be. If your third-party risk register does not list your insurers, that is a gap this entry should prompt you to close.","DECIDE NOW, IN ADVANCE, WHAT YOU WOULD DO IF AN INSURER TOLD YOU YOUR UNDERWRITING SUBMISSIONS HAD BEEN PUBLISHED. That question has no good answer improvised during an incident. A short written position - who is notified, what is reassessed, whether disclosed control weaknesses require remediation - is cheap today and expensive later.","DO NOT INGEST ANY 'BRIT INSURANCE IOCS' OFFERED THIS WEEKEND. No attacker IP addresses, domains, URLs, file hashes or malware samples specific to this listing have been published by any source reviewed. Anything presented as incident-specific indicators for this claim is fabricated or mislabelled."],"references":["https://breachnews.com/ransomware/brit-insurance-inc-ransom-leak-site-claim/","https://www.redpacketsecurity.com/incransom-ransomware-victim-brit-ltd-brit-insurance-britinsurance-com/","https://www.dexpose.io/incransom-attacks-brit-insurance-in-uk-ransomware-incident/","https://zerohour.day/group/inc%20ransom","https://recentbreaches.com/"],"kql":[{"platform":"defender_xdr","table":"CloudAppEvents","name":"Anomalous bulk data access by a single account - the exfiltration precursor","description":"Sector-generic and worth running regardless of whether this listing is genuine. Extortion without encryption depends on bulk collection, and a single identity reading far more than its baseline is the earliest reliable signal. Tune the threshold to your own environment.","query":"CloudAppEvents\n| where Timestamp > ago(30d)\n| where ActionType has_any (\"FileDownloaded\", \"FileSyncDownloadedFull\", \"FileAccessed\", \"FilePreviewed\")\n| summarize Events = count(), Files = dcount(ObjectName), Apps = make_set(Application, 5) by AccountDisplayName, bin(Timestamp, 1d)\n| summarize Baseline = avg(Events), Peak = max(Events), PeakDay = arg_max(Events, Timestamp), TotalFiles = sum(Files) by AccountDisplayName\n| where Peak > (Baseline * 5) and Peak > 500\n| order by Peak desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Archive staging on file servers - collection before exfiltration","description":"The step between collection and exfiltration. Large archives appearing in temporary, public or user-profile directories on a file server, created by something other than a backup product, are the classic staging artefact for data-theft extortion.","query":"DeviceFileEvents\n| where Timestamp > ago(30d)\n| where ActionType == \"FileCreated\"\n| where FileName endswith \".7z\" or FileName endswith \".zip\" or FileName endswith \".rar\" or FileName endswith \".tar.gz\" or FileName endswith \".tar\"\n| where FolderPath has_any (\"\\\\Temp\", \"\\\\Windows\\\\Temp\", \"\\\\Users\\\\Public\", \"\\\\ProgramData\", \"/tmp\", \"/var/tmp\")\n| where InitiatingProcessFileName !in~ (\"veeam.exe\", \"backup.exe\", \"7z.exe\", \"winrar.exe\", \"explorer.exe\")\n| project Timestamp, DeviceName, FolderPath, FileName, FileSize, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| order by FileSize desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Cloud storage and transfer utilities executed outside IT administration","description":"Exfiltration channel detection. rclone, megasync, filezilla and similar tools are legitimate in a few hands and almost never legitimate on a file server or a claims workstation. This is among the highest-signal queries for data-theft extortion.","query":"let TransferTools = dynamic([\"rclone.exe\",\"rclone\",\"megasync.exe\",\"megacmd.exe\",\"filezilla.exe\",\"winscp.exe\",\"psftp.exe\",\"pscp.exe\",\"aws.exe\",\"azcopy.exe\",\"gsutil\",\"mc.exe\"]);\nDeviceProcessEvents\n| where Timestamp > ago(30d)\n| where FileName in~ (TransferTools)\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"IdentityDirectoryEvents","name":"Privilege escalation and group changes in the run-up to an extortion listing","description":"INC Ransom and comparable operators escalate before they collect. Additions to privileged directory groups, especially of accounts that are not normally privileged, are the pivot point worth reviewing by hand.","query":"IdentityDirectoryEvents\n| where Timestamp > ago(45d)\n| where ActionType has_any (\"Group Membership changed\", \"Member added to group\", \"Account password changed\", \"Account enabled\")\n| extend TargetGroup = tostring(parse_json(AdditionalFields).[\"TO.GROUP\"])\n| where TargetGroup has_any (\"Domain Admins\", \"Enterprise Admins\", \"Administrators\", \"Backup Operators\", \"Account Operators\", \"Remote Desktop\")\n| project Timestamp, ActionType, AccountDisplayName, TargetAccountDisplayName, TargetGroup, TargetDeviceName, AdditionalFields\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Remote access tooling newly introduced into the estate","description":"Extortion operators routinely install legitimate remote access software for persistence because it survives endpoint controls and looks like IT. New appearances of these tools on hosts that have never run them are worth a same-day question.","query":"let RemoteTools = dynamic([\"anydesk.exe\",\"teamviewer.exe\",\"screenconnect.clientservice.exe\",\"connectwisecontrol.client.exe\",\"atera\",\"splashtop\",\"ngrok.exe\",\"rustdesk.exe\",\"supremo.exe\",\"netsupport\"]);\nDeviceProcessEvents\n| where Timestamp > ago(45d)\n| where FileName has_any (RemoteTools) or ProcessCommandLine has_any (RemoteTools)\n| summarize FirstSeen = min(Timestamp), LastSeen = max(Timestamp), Executions = count(), Accounts = make_set(AccountName, 10) by DeviceName, FileName\n| where FirstSeen > ago(45d)\n| order by FirstSeen desc"}],"iocs":[{"type":"note","value":"LISTING: INC Ransom listed 'Brit Ltd / Brit Insurance' (britinsurance.com) on 27 NOVEMBER 2026 with a countdown reported at approximately 33 DAYS","context":"The entire factual basis of this entry is an attacker's own leak-site post - the weakest evidence class this feed carries. Brit is a Fairfax-owned Lloyd's of London specialty insurer.","confidence":"medium","source":"INC Ransom leak site via BreachNews, RedPacket Security, DeXpose and Recent Breaches"},{"type":"note","value":"SOURCES DIRECTLY CONTRADICT EACH OTHER ON PROOF: one tracker states the listing carried 22 IMAGES as proof; another states explicitly that the entry provides NO details on the alleged data, NO volume, NO ransom demand and NO screenshots or images","context":"These accounts cannot both be true of the same listing. The presence or absence of proof is the main discriminator between a real intrusion and a fabricated claim, so this question must be treated as OPEN rather than resolved from secondary sources.","confidence":"high","source":"BreachNews versus RedPacket Security, 27-28 November 2026"},{"type":"note","value":"ACTOR CREDIBILITY CAVEAT IS DOCUMENTED: at least one tracker explicitly warns that listings attributed to INCRANSOM have been reported as including UNVERIFIED OR FABRICATED VICTIM CLAIMS. Independent trackers label this entry a claim, one recording it as 'Claim, unrated'","context":"A leak-site listing is an advertisement by a criminal enterprise and the incentive to inflate is structural. Recorded here as a leading indicator with a real countdown date, not as evidence.","confidence":"high","source":"RedPacket Security, Recent Breaches and ismalicious tracker labelling"},{"type":"note","value":"BRIT HAS PUBLISHED NOTHING: no Brit or Lloyd's statement confirming or denying a breach was found in any source reviewed; Brit's own news page carried nothing as of Friday afternoon","context":"Silence on day one tells you nothing either way. Companies properly take time to establish facts and the ICO's 72-hour clock runs from awareness, not from a leak-site post.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"note","value":"REGULATORY CLOCK: under UK data protection law, if personal data was taken Brit would generally have to notify the ICO WITHIN 72 HOURS of becoming aware. The listing appeared 27 November, so a window running from that date would close around 30 NOVEMBER","context":"The one objective date in this entry. Three things would resolve it: a Brit statement, an ICO reference, or publication of sample data.","confidence":"high","source":"UK GDPR notification requirement noted in BreachNews coverage"},{"type":"note","value":"DATA CLASS ASSESSMENT - NOT A CLAIM ABOUT WHAT THE ATTACKER HOLDS: a Lloyd's specialty insurer typically holds underwriting submissions and risk surveys describing other organisations' control weaknesses, claims files with incident detail and forensic reports, reinsurance and broker correspondence, and CYBER INSURANCE underwriting and claims material","context":"Why insurer compromises matter beyond the insurer: the second-order population is the insureds, brokers and reinsurers, who will not be notified by the attacker. NO data categories, volumes or samples have been established for this listing.","confidence":"medium","source":"Analyst assessment based on the business model of a Lloyd's specialty insurer"},{"type":"note","value":"NO ATTACKER IP ADDRESSES, DOMAINS, URLS, FILE HASHES OR MALWARE SAMPLES SPECIFIC TO THIS LISTING have been published by any source reviewed","context":"Detection content in this entry is behavioural and sector-generic, not incident-specific, and is labelled as such. Anything offered as 'Brit Insurance IOCs' this weekend is fabricated or mislabelled.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"ttp","value":"Data-theft extortion without confirmed encryption - leak-site listing with a fixed countdown as the pressure mechanism","context":"The pattern across all three extortion entries in this report (ranks 6, 7 and 10). The countdown is the only hard date and it is set by the attacker, which is also why it is the attacker's most effective lever.","confidence":"high","source":"Analyst assessment across INC Ransom, ScarlettGroup and N0n listings in this window"},{"type":"behaviour","value":"Anomalous bulk file access by a single identity, archive staging in temporary or public directories on file servers, execution of rclone, megasync, filezilla, winscp or azcopy outside IT administration, and newly introduced remote access tooling such as AnyDesk, ScreenConnect, Atera or ngrok","context":"Sector-generic extortion precursors worth hunting this weekend by any UK insurance or broking organisation, on their own merits rather than because of this specific listing.","confidence":"medium","source":"Analyst assessment based on documented INC Ransom and comparable operator tradecraft"},{"type":"note","value":"PATTERN: this is the FOURTH UK organisation in roughly one week to appear on an extortion leak site or disclose a third-party compromise - University of Liverpool (25 Nov), Next plc supplier (23 Nov) and hmv via N0n (25 Nov), Gatwick's AutoPay supplier (24-25 Nov), and now Brit (27 Nov). THREE of the four involve a THIRD PARTY or an UNVERIFIED CRIMINAL CLAIM rather than a confirmed intrusion at the named brand's own perimeter","context":"UK financial services had not featured in this feed's recent windows. Its appearance now, in the Lloyd's market, is the development worth noting even while the specific claim remains unproven.","confidence":"high","source":"Analyst aggregation across this and prior windows of this feed"}]},{"rank":7,"id":"TI-2026-11-28-007","title":"THE LEAK CLOCK ON A RUSSELL GROUP UNIVERSITY RUNS OUT WITHIN DAYS, AND A NEW FACT MAKES THE CLAIM HARDER TO DISMISS: The University of Liverpool Ordered ALL STAFF AND STUDENTS TO RESET PASSWORDS BY 1PM ON 25 NOVEMBER Citing a 'POTENTIAL THREAT TO OUR SYSTEMS' After EMERGENCY SYSTEM RESETS on 24 November - the Same Day ScarlettGroup Listed It Claiming PATIENT, Student, Staff, Financial and Research Data, With Publication Intended Around 1-2 DECEMBER","cve_ids":[],"vendor":"University of Liverpool; ScarlettGroup (data-extortion group)","affected_products":["University of Liverpool systems and identity estate (liverpool.ac.uk)","Claimed data categories: patient, student, staff, financial and research data (attacker claim, unverified)"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-25","last_updated":"2026-11-28","confidence":"medium","summary":"YESTERDAY THIS ENTRY RESTED ENTIRELY ON AN ATTACKER'S LEAK-SITE LISTING AND CARRIED THE EXPLICIT WARNING THAT THE UNIVERSITY HAD PUBLISHED NOTHING. THAT HAS CHANGED, AND THE CHANGE MATTERS. Reporting in this window establishes that on 25 NOVEMBER 2026 the University of Liverpool ORDERED ALL STAFF AND STUDENTS TO RESET THEIR PASSWORDS BY 1PM UK TIME, citing a 'POTENTIAL THREAT TO OUR SYSTEMS', and that this followed EMERGENCY SYSTEM RESETS ON 24 NOVEMBER. The university has NOT linked that action to ScarlettGroup and has NOT confirmed any data theft. But the sequence is now a matter of record: emergency resets on the 24th, a universal mandatory password reset with a same-day deadline on the 25th, and a ScarlettGroup leak-site listing on the 25th.\n\nWHY THAT SEQUENCE CHANGES THE CONFIDENCE AND NOT THE VERDICT. A university does not order its entire staff and student population to change passwords within hours, on a Tuesday, for a hypothetical. A forced estate-wide credential reset with a same-day deadline is what an organisation does when it believes credentials are in hostile hands RIGHT NOW. That is an institution acting on a live concern, and it is independent corroboration that SOMETHING happened - it is not corroboration of ScarlettGroup's specific claims about what was taken. This entry's confidence therefore moves from LOW to MEDIUM: there is now credible evidence of a security event, while the data-theft claims remain entirely unverified. Both halves of that sentence should survive into any onward reporting.\n\nTHE CLOCK IS THE REASON THIS IS RANKED WHERE IT IS. FalconFeeds reported the group intends to publish WITHIN 6-7 DAYS of the 25 November listing, and another tracker recorded roughly 6 DAYS AND 19 HOURS remaining at the time it was indexed. That places the intended publication around 1-2 DECEMBER 2026 - Tuesday or Wednesday NEXT WEEK. A threat-actor quote carried on one tracker reads: 'The full leak will be published soon, unless a university representative contacts us via the channels provided.' The timing detail is SINGLE-SOURCED from one threat intelligence feed and is INDICATIVE ONLY, but it is the only date available and it is close.\n\nTHE 'PATIENT DATA' CLAIM IS WHAT ELEVATES THIS ENTRY AND IT IS ALSO THE CLAIM MOST LIKELY TO BE INFLATED. ScarlettGroup alleges access to PATIENT, student, staff, financial and RESEARCH data. Liverpool is a Russell Group institution established in 1881 with a substantial medical school and clinical research footprint, so patient data is PLAUSIBLE in a way it would not be at many universities - which is exactly why an extortion group has every incentive to assert it. No volume has been disclosed, no samples have been shown, no data categories have been independently confirmed, and Ransomware.live states plainly that its listings reflect unverified criminal claims. If patient data is genuinely involved, the regulatory and ethical position changes substantially - NHS data governance, research ethics approvals, possible joint controllership with NHS trusts - which is why the claim should be neither repeated as fact nor dismissed.\n\nONE FURTHER UNVERIFIED DATA POINT, RECORDED WITH ITS WEAKNESS ATTACHED. One report ties the listing to infostealer intelligence citing 535 EMPLOYEES and 774 USERS affected by infostealer activity, attributed to Hudson Rock. This is unverified and, importantly, infostealer counts are a measure of general credential hygiene across a large population over time - they are NOT evidence of this intrusion's entry vector. Infostealer logs are nonetheless the most common initial access route into university estates, and a mandatory estate-wide password reset is consistent with credential compromise as the starting point. That is a reasonable hypothesis, explicitly labelled as such, not a finding.\n\nTHE ADVICE THE UNIVERSITY'S OWN ACTION CREATES, WHICH NOBODY ELSE WILL GIVE. A publicised mandatory password reset is itself a phishing opportunity, and the reporting notes this directly: staff and students should expect phishing that USES THE PASSWORD RESET AS A LURE and should use only official university pages. That is the actionable item for the Liverpool community this weekend and for every other UK university watching this, because the pretext - 'your password reset failed, complete it here' - is near-perfect and arrives with institutional authority behind it. Note the structural parallel with rank 1: in both cases the defensive action taken by the organisation becomes the fraud pretext against its users.\n\nTHE UK HIGHER EDUCATION CONTEXT THAT MAKES THIS MORE THAN ONE INSTITUTION'S PROBLEM. UK universities sit on an unusually attractive combination: large transient user populations with weak credential hygiene, federated identity across Jisc and eduroam, extensive research collaboration estates, commercially and strategically valuable research data, and in the case of medical schools, clinical and patient data. Rank 4 of this report records that Project MONAI Label CVE-2026-133968 was FOUND AND EXPLOITED BY AI AGENTS to reach a root shell ON UNIVERSITY SERVERS IN ELEVEN MINUTES, per Amazon Threat Intelligence, and that CVE is OVERDUE and still exploited. A UK university with a live extortion clock in one entry and an AI-agent-exploited research-tooling flaw overdue in another is not a coincidence of layout; it is the same sector being probed from two directions in the same week.\n\nWHAT HAPPENS NEXT, AND THE THREE THINGS TO WATCH. First, whether the university publishes a substantive statement - it has so far published only the password reset notice, which did not characterise the incident. Second, whether an ICO notification is referenced; none has been reported. Third, whether ScarlettGroup publishes around 1-2 December, and if so whether the published material supports the patient-data claim. Until one of those three happens, this entry is an institution that acted decisively on a live concern and a criminal group making unverified claims about what it holds, and it should be recorded exactly that way. NO ATTACKER INFRASTRUCTURE, IP ADDRESSES, DOMAINS, FILE HASHES, MALWARE SAMPLES OR TTPS SPECIFIC TO THIS INTRUSION HAVE BEEN PUBLISHED.","recommended_actions":["UK UNIVERSITIES: WARN YOUR COMMUNITY THAT A PASSWORD RESET NOTICE IS NOW A PHISHING PRETEXT. The Liverpool reset was publicised, which means 'your password reset failed, complete it here' arrives this weekend carrying institutional authority. Tell staff and students to reach password changes only by typing the official URL or using a bookmark, never from a link in a message - and say it before the weekend ends.","IF YOU ARE AT LIVERPOOL OR WORK WITH IT: follow the university's own instructions and nothing else. Everything below is for other UK institutions and for organisations with research or clinical collaborations.","IF YOU HOLD A RESEARCH COLLABORATION, DATA SHARING AGREEMENT OR JOINT CLINICAL ARRANGEMENT WITH THE UNIVERSITY OF LIVERPOOL: identify today what data you have placed there and under what agreement, and raise it through your normal contact rather than waiting for a broadcast. If any of it is patient or participant data, involve your own information governance lead now, before publication rather than after.","UK UNIVERSITIES - HUNT INFOSTEALER-SOURCED CREDENTIAL ACCESS THIS WEEKEND. Infostealer logs are the most common initial access route into university estates and a mandatory estate-wide reset is consistent with credential compromise as the entry point. Check for successful logins from residential VPN and hosting ASNs, impossible-travel sequences, MFA fatigue patterns, and successful authentications by accounts that appear in commercial infostealer feeds.","RUN THE MONAI LABEL CHECK FROM RANK 4 IF YOU HAVE ANY MEDICAL IMAGING OR AI RESEARCH TOOLING. CVE-2026-133968 is OVERDUE in KEV and Amazon Threat Intelligence reports AI agents used it to reach a root shell on university servers in ELEVEN MINUTES. Hunt traversal sequences against /datastore, /upload, /annotation, /infer and /train. The same sector is being probed from two directions this week.","DO NOT REPEAT THE PATIENT DATA CLAIM AS ESTABLISHED FACT. It is an extortion group's assertion, unverified, with no samples and no volume. It is plausible given Liverpool's medical school footprint, which is precisely why the group has an incentive to make it. The accurate formulation names the claim and its source and states that the university has not confirmed data theft.","DO NOT DISMISS IT EITHER - THE CONFIDENCE HAS GENUINELY MOVED. An institution-wide forced password reset with a same-day deadline, following emergency resets the day before, is not something done for a hypothetical. There is now credible evidence of a security event, independent of the attacker's claims about what was taken. Record both halves.","SET A REVIEW POINT FOR 1-2 DECEMBER, which is the reported intended publication window. Watch three things: a substantive university statement, any reference to an ICO notification, and whether published material supports the patient-data claim. Any of the three resolves this entry.","TREAT THE REPORTED INFOSTEALER FIGURES AS CONTEXT, NOT EVIDENCE. The cited 535 employees and 774 users affected by infostealer activity is unverified and, more importantly, measures general credential hygiene across a large population over time - it is not evidence of this intrusion's entry vector.","REVIEW YOUR OWN CAPACITY TO FORCE AN ESTATE-WIDE CREDENTIAL RESET AT SHORT NOTICE, AND TIME IT. Liverpool did it with a same-day deadline. Could you? If the answer is no, or unknown, that is a concrete resilience finding to take out of this entry - and it is a cheaper lesson than the one Liverpool is currently learning.","DO NOT INGEST ANY 'UNIVERSITY OF LIVERPOOL IOCS'. No attacker infrastructure, IP addresses, domains, file hashes, malware samples or TTPs specific to this intrusion have been published by any source reviewed."],"references":["https://www.ransomware.live/id/bGl2ZXJwb29sLmFjLnVrQFNjYXJsZXR0Z3JvdXA","https://ransomware.socradar.io/groups/scarlettgroup","https://www.dexpose.io/scarlettgroup-compromises-university-of-liverpool/","https://www.hookphish.com/blog/ransomware-group-scarlettgroup-hits-liverpool-ac-uk/","https://zerohour.day/group/scarlettgroup","https://qpulse.quasarcybertech.com/news/9188/scarlettgroup-ransomware-gang-claims-attack-on-university-of-liverpool","https://undercodenews.com/university-of-liverpool-faces-cybersecurity-alert-as-scarlettgroup-claims-university-on-dark-web-leak-site-video/","https://x.com/FalconFeedsio/status/2125666624619659275","https://x.com/DarkWebInformer/status/2125702961011524046","https://x.com/DailyDarkWeb/status/2125658155879203277"],"kql":[{"platform":"defender_xdr","table":"UrlClickEvents","name":"Clicks on password-reset themed links that are not your own identity provider","description":"THE MOST URGENT QUERY IN THIS ENTRY FOR ANY UK UNIVERSITY. A publicised mandatory password reset is a near-perfect phishing pretext carrying institutional authority. Replace the allow-list with your own identity provider and SSO hostnames.","query":"let ResetTerms = dynamic([\"password-reset\",\"passwordreset\",\"reset-password\",\"password-expiry\",\"account-verify\",\"verify-account\",\"reactivate\",\"re-activate\",\"credential-update\",\"mfa-reset\"]);\nlet OwnDomains = dynamic([\"login.microsoftonline.com\",\"sts.yourorg.ac.uk\",\"idp.yourorg.ac.uk\",\"yourorg.ac.uk\"]);\nUrlClickEvents\n| where Timestamp > datetime(2026-11-24)\n| where Url has_any (ResetTerms)\n| extend IsOwn = Url has_any (OwnDomains)\n| where not(IsOwn)\n| project Timestamp, AccountUpn, Url, ActionType, IsClickedThrough, Workload, NetworkMessageId, ThreatTypes\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Inbound mail impersonating an institutional password reset or IT service desk","description":"The delivery side of the same campaign. Display-name impersonation of IT services, the service desk or 'Account Security' from an external sending domain is the dominant pattern in university credential phishing.","query":"let ResetTerms = dynamic([\"password reset\",\"password will expire\",\"password expiry\",\"verify your account\",\"account suspended\",\"reactivate your account\",\"mandatory password\",\"it service desk\",\"account security\",\"mfa reset\"]);\nEmailEvents\n| where Timestamp > datetime(2026-11-24)\n| where (Subject has_any (ResetTerms)) or (SenderDisplayName has_any (dynamic([\"IT Service\",\"Service Desk\",\"Helpdesk\",\"Account Security\",\"IT Support\"])))\n| where SenderFromDomain !endswith \".ac.uk\"\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 15), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderFromAddress, SenderIPv4\n| order by Messages desc"},{"platform":"sentinel","table":"SigninLogs","name":"Successful authentication from hosting and residential proxy ASNs - infostealer credential replay","description":"Infostealer logs are the most common initial access route into UK university estates, and stolen credentials are replayed from hosting or residential proxy infrastructure rather than from a student's actual device. Successful logins from these networks deserve individual review.","query":"SigninLogs\n| where TimeGenerated > ago(45d)\n| where ResultType == 0\n| extend ASN = tostring(parse_json(tostring(AutonomousSystemNumber)))\n| extend Country = tostring(LocationDetails.countryOrRegion), City = tostring(LocationDetails.city)\n| summarize Logins = count(), Users = dcount(UserPrincipalName), UserList = make_set(UserPrincipalName, 25), Apps = make_set(AppDisplayName, 10), FirstSeen = min(TimeGenerated) by IPAddress, ASN, Country, City\n| where Users >= 3\n| order by Users desc, Logins desc"},{"platform":"sentinel","table":"SigninLogs","name":"Impossible travel and MFA fatigue patterns across the identity estate","description":"Catches credential compromise where the attacker holds the password but not the second factor. Repeated MFA denials followed by an eventual success is the signature of a push-fatigue campaign against a large user population.","query":"SigninLogs\n| where TimeGenerated > ago(45d)\n| where ResultType in (0, 50074, 50076, 50158, 500121)\n| extend Country = tostring(LocationDetails.countryOrRegion)\n| summarize Attempts = count(), MfaDenials = countif(ResultType in (500121, 50074, 50076)), Successes = countif(ResultType == 0), Countries = make_set(Country, 10), DistinctCountries = dcount(Country), IPs = make_set(IPAddress, 15) by UserPrincipalName, bin(TimeGenerated, 1d)\n| where (MfaDenials >= 5 and Successes >= 1) or DistinctCountries >= 3\n| order by MfaDenials desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Bulk access to research, clinical or student record repositories","description":"The exfiltration question for the specific data categories ScarlettGroup claims. Scope the path filter to your own research data, clinical research and student record locations rather than running it estate-wide.","query":"CloudAppEvents\n| where Timestamp > ago(45d)\n| where ActionType has_any (\"FileDownloaded\", \"FileSyncDownloadedFull\", \"FileAccessed\")\n| where ObjectName has_any (\"research\", \"clinical\", \"trial\", \"patient\", \"participant\", \"ethics\", \"student-record\", \"finance\", \"payroll\", \"hr-\")\n| summarize Events = count(), Objects = dcount(ObjectName), Samples = make_set(ObjectName, 20), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by AccountDisplayName, IPAddress\n| where Objects >= 50\n| order by Objects desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Path traversal against MONAI Label and medical imaging research endpoints","description":"Carried from rank 4 because it belongs to this sector. CVE-2026-133968 is OVERDUE in KEV and Amazon Threat Intelligence reports AI agents exploited it to reach a root shell on university servers in eleven minutes.","query":"W3CIISLog\n| where TimeGenerated > ago(45d)\n| where csUriStem has_any (\"/datastore\", \"/upload\", \"/annotation\", \"/infer\", \"/train\", \"/model\", \"/session\")\n| extend Payload = strcat(tostring(csUriStem), \" \", tostring(csUriQuery))\n| where Payload has_any (\"..\", \"%2e%2e\", \"%252e\", \"..%2f\", \"..\\\\\")\n| summarize Requests = count(), Paths = make_set(csUriStem, 20), Statuses = make_set(scStatus, 10), FirstSeen = min(TimeGenerated) by cIP, csHost, Computer\n| order by Requests desc"}],"iocs":[{"type":"note","value":"NEW AND DECISIVE FOR CONFIDENCE: on 25 NOVEMBER 2026 the University of Liverpool ordered ALL staff and students to reset passwords BY 1PM UK TIME, citing a 'POTENTIAL THREAT TO OUR SYSTEMS', following EMERGENCY SYSTEM RESETS on 24 NOVEMBER. The university has NOT linked this to ScarlettGroup and has NOT confirmed data theft","context":"An institution-wide forced reset with a same-day deadline is not done for a hypothetical. This is independent corroboration that a security EVENT occurred - it is NOT corroboration of the attacker's claims about what was taken. Confidence moves from low to medium on that basis.","confidence":"high","source":"University of Liverpool notice via secondary reporting, 25 November 2026"},{"type":"ttp","value":"Phishing that uses the publicised institutional password reset as the lure - 'your password reset failed, complete it here'","context":"THE ACTIONABLE ITEM FOR EVERY UK UNIVERSITY THIS WEEKEND. Explicitly flagged in the reporting. Note the structural parallel with rank 1: in both cases the defensive action the organisation took becomes the fraud pretext against its own users.","confidence":"high","source":"Secondary reporting advising staff and students to use only official university pages"},{"type":"note","value":"LEAK CLOCK: ScarlettGroup listed the university on 25 NOVEMBER and is reported to intend publication within 6-7 DAYS; one tracker recorded roughly 6 days and 19 hours remaining when indexed. That places intended publication around 1-2 DECEMBER 2026","context":"SINGLE-SOURCED from one threat intelligence feed and INDICATIVE ONLY, but it is the only date available and it is next Tuesday or Wednesday. A threat-actor quote reads: 'The full leak will be published soon, unless a university representative contacts us via the channels provided.'","confidence":"low","source":"FalconFeeds and tracker countdown records via secondary reporting"},{"type":"note","value":"CLAIMED DATA CATEGORIES - ATTACKER ASSERTION ONLY: PATIENT, student, staff, financial and RESEARCH data. NO volume disclosed, NO samples shown, NO category independently confirmed. Ransomware.live states plainly that its listings reflect unverified criminal claims","context":"The patient data claim is what elevates this entry's ranking and is precisely the claim an extortion group has most incentive to make. Plausible given Liverpool's medical school and clinical research footprint - which is the reason for the incentive, not evidence for the claim.","confidence":"low","source":"ScarlettGroup leak-site listing via Ransomware.live, SOCRadar, DeXpose, HookPhish and dark web trackers"},{"type":"note","value":"UNVERIFIED CONTEXT, RECORDED WITH ITS WEAKNESS: one report cites infostealer intelligence attributed to Hudson Rock of 535 EMPLOYEES and 774 USERS affected by infostealer activity","context":"Unverified, and more importantly a measure of general credential hygiene across a large population over time - NOT evidence of this intrusion's entry vector. Infostealer logs are nonetheless the most common initial access route into university estates, and an estate-wide forced reset is consistent with credential compromise as the starting point. Hypothesis, explicitly labelled.","confidence":"low","source":"Hudson Rock figures cited in a single secondary report"},{"type":"behaviour","value":"Successful authentication from hosting or residential proxy ASNs, impossible-travel sequences, and repeated MFA denials followed by a success","context":"Infostealer credential replay patterns. Stolen university credentials are replayed from hosting or residential proxy infrastructure rather than from the legitimate user's device. The highest-value generic hunting for the UK HE sector this weekend.","confidence":"medium","source":"Analyst assessment based on documented initial access patterns against UK universities"},{"type":"behaviour","value":"Bulk access by a single identity to repositories named for research, clinical, trial, patient, participant, ethics, student-record, finance, payroll or HR data","context":"The exfiltration question for the specific categories claimed. Scope to your own repository locations rather than running estate-wide, or the result is unusable noise.","confidence":"medium","source":"Analyst assessment based on the claimed data categories"},{"type":"note","value":"THE UNIVERSITY HAS PUBLISHED NO SUBSTANTIVE STATEMENT about the incident - only the password reset notice, which did NOT characterise it. NO ICO notification has been reported","context":"Three things would resolve this entry: a substantive statement, an ICO reference, or publication around 1-2 December that either supports or undermines the patient-data claim.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"note","value":"NO ATTACKER INFRASTRUCTURE, IP ADDRESSES, DOMAINS, FILE HASHES, MALWARE SAMPLES OR INTRUSION-SPECIFIC TTPS have been published for this incident","context":"Detection content here is sector-generic and behavioural. Anything offered as 'University of Liverpool IOCs' is fabricated or mislabelled.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"note","value":"SECTOR CONTEXT: rank 4 of this report records Project MONAI Label CVE-2026-133968 as OVERDUE in CISA KEV and reportedly FOUND AND EXPLOITED BY AI AGENTS to reach a root shell ON UNIVERSITY SERVERS IN ELEVEN MINUTES, per Amazon Threat Intelligence","context":"A UK university with a live extortion clock in one entry and an AI-agent-exploited research-tooling flaw overdue in another is the same sector being probed from two directions in the same week. UK HE sits on transient user populations, federated identity across Jisc and eduroam, valuable research data and - in medical schools - clinical data.","confidence":"high","source":"Amazon Threat Intelligence via secondary reporting, and analyst assessment"}]},{"rank":8,"id":"TI-2026-11-28-008","title":"A PASSWORD MANAGER BREACHED THROUGH ONE EMPLOYEE'S GITHUB ACCOUNT: 1Password Confirmed an Attacker Hijacked a Corporate GitHub Account, PUSHED MALICIOUS CODE TO BACKEND SERVICES and Pulled Customer Names, Emails, Account IDs and Sign-in Timestamps Plus INVITATION AND RECOVERY EMAIL TOKENS - Vaults Not Accessed, but Sources DISAGREE on Whether SRP VERIFIERS Were Taken","cve_ids":[],"vendor":"1Password (AgileBits)","affected_products":["1Password backend systems and account provisioning services","1Password customer account metadata","1Password internal source code","Invitation and recovery email tokens"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-25","last_updated":"2026-11-28","confidence":"high","summary":"THIS IS IN THE REPORT BECAUSE OF WHAT 1PASSWORD IS, NOT BECAUSE OF HOW MUCH DATA MOVED. It is a confirmed, vendor-disclosed compromise of a credential-management provider used across UK government suppliers, UK corporates, universities and small businesses, and it is one of TWO items in this report where the entry point was A HIJACKED EMPLOYEE GITHUB ACCOUNT (see rank 9). That repetition inside a single 48-hour window is the finding worth taking away.\n\nTHE TIMELINE AND THE MECHANISM, WHICH IS WORSE THAN A SIMPLE DATA PULL. 1Password began investigating on 19 NOVEMBER and disclosed on 25 NOVEMBER, with a further update published around 26 November. An attacker took over AN EMPLOYEE'S CORPORATE GITHUB ACCOUNT, and - this is the part that distinguishes this from an ordinary credential-theft incident - USED IT TO PUSH MALICIOUS CODE TO BACKEND SERVICES, and then used that access to pull customer records. Read that sequence carefully: this was not read-only repository theft. It was a SOURCE-CONTROL-TO-PRODUCTION PATH. The attacker's route from a developer's personal account into a running service was a code push, which means the control that failed was not only authentication on GitHub but whatever stands between a commit and a deployment.\n\nWHAT WAS TAKEN, AS STATED. Customer NAMES, EMAIL ADDRESSES, ACCOUNT AND USER IDS, and SIGN-IN TIMESTAMPS. Non-secret internal account metadata. Tokens present in SOME INVITATION AND RECOVERY EMAILS. 1Password's internal SOURCE CODE. 1Password's own characterisation of the metadata is that it is non-secret.\n\nWHAT WAS NOT TAKEN, ALSO AS STATED, AND THIS IS THE LOAD-BEARING CLAIM. 'At no time were customer vault contents accessed by, or available to, the attacker.' Vault data, the items inside vaults, and the keys protecting them were not affected. This is the claim that matters most and 1Password has made it unambiguously. The architecture reason this is credible is that in a correctly implemented zero-knowledge design the provider cannot decrypt vaults at all - but CREDIBLE IS NOT THE SAME AS INDEPENDENTLY VERIFIED, and nobody outside 1Password has verified it.\n\nTHERE IS A DIRECT CONFLICT BETWEEN SOURCES ON THE MOST SECURITY-RELEVANT QUESTION, AND IT IS NOT RESOLVED. One report states that stolen SRP (Secure Remote Password) PARAMETERS CANNOT BE USED TO ACCESS AN ACCOUNT, attributing that to 1Password. Another, citing a company representative on 1Password's community forum, states that the stolen data INCLUDED SECURE REMOTE PASSWORD VERIFIERS DERIVED FROM USER ACCOUNT PASSWORDS AND SECRET KEYS. Those are materially different statements. An SRP verifier derived from a user's account password is not a usable credential and cannot be replayed against the service, but it IS a value against which an offline attack can in principle be attempted, and its sensitivity depends entirely on the key derivation parameters involved. THIS REPORT DOES NOT RESOLVE THE CONFLICT and flags it as the single thing a security team should want clarified from 1Password directly. Note also that 1Password's design combines the account password with a SECRET KEY held only on the user's devices, which is the specific property that makes offline attack against 1Password verifiers much harder than against a conventional password hash - but that is an architectural observation, not a statement about what was taken.\n\n1PASSWORD'S OWN NEGATIVE FINDING IS WORTH RECORDING PRECISELY. The company says it validated NO INTERNAL EVIDENCE OF USER ACCOUNT TAKEOVERS OR COMPROMISE USING ANY EXPOSED ACCOUNT PROVISIONING TOKENS. That is a useful and specific statement - it addresses the invitation and recovery tokens directly - and it is also a statement about what their telemetry shows, which is the normal and appropriate limit of such a claim.\n\nTHE REAL RISK TO UK ORGANISATIONS IS PHISHING, AND 1PASSWORD SAYS SO ITSELF. The stolen set - name, email, account ID, sign-in timestamp - is close to an ideal targeting list for credential phishing against exactly the population that uses a password manager. The company's own guidance is that users need not change settings but should be PARTICULARLY WARY OF EMAILS CLAIMING THEY NEED TO SECURE THEIR ACCOUNTS IN RESPONSE TO THE BREACH, reset their passwords, or verify their account information. That is the third time in this single report that an organisation's own incident response creates the phishing pretext against its users - DWP's outage in rank 1, Liverpool's password reset in rank 7, and now a password manager's breach notification. The pattern is consistent enough to be a planning assumption: WHATEVER AN ORGANISATION TELLS ITS USERS TO DO DURING AN INCIDENT WILL BE IMPERSONATED WITHIN DAYS.\n\nAND THE INVITATION AND RECOVERY TOKENS DESERVE SEPARATE ATTENTION FROM ANY UK ORGANISATION RUNNING 1PASSWORD BUSINESS OR TEAMS. Account provisioning tokens in invitation and recovery emails are the mechanism by which a new user joins a tenant or an existing user regains access. 1Password reports no evidence of their abuse. But if your organisation issued invitations or recovery emails in the period concerned, the correct action is to invalidate and reissue rather than to rely on an absence of evidence, because the cost of reissuing an invitation is trivial and the cost of a successful recovery-token abuse is a tenant foothold.\n\nTHE LESSON THAT APPLIES TO ORGANISATIONS THAT DO NOT USE 1PASSWORD AT ALL. Two separate confirmed incidents in this report began at a developer's source-control account: this one and SAP's in rank 9. In both, the attacker's path ran from an individual's version control access toward production - here explicitly through a code push to backend services. The controls that matter are therefore not primarily about secrets in repositories: they are PHISHING-RESISTANT MFA ON SOURCE CONTROL, SHORT-LIVED AND SCOPED TOKENS, BRANCH PROTECTION AND MANDATORY REVIEW ON ANY BRANCH THAT CAN REACH A DEPLOYMENT, SIGNED COMMITS, AND SEPARATION BETWEEN THE IDENTITY THAT WRITES CODE AND THE IDENTITY THAT SHIPS IT. If an engineer's hijacked account can push code that reaches a production service without a second human and a second credential, the breach is already written.","recommended_actions":["WARN YOUR USERS TODAY, AND NAME THE PRETEXT. 1Password's own guidance is that customers should be particularly wary of emails claiming they must secure their account in response to the breach, reset their password, or verify account information. Tell your 1Password users that no action is required and that any message asking them to act on the breach is to be treated as hostile. This is the highest-value action in the entry.","IF YOU RUN 1PASSWORD BUSINESS OR TEAMS, INVALIDATE AND REISSUE ANY OUTSTANDING INVITATIONS AND RECOVERY EMAILS issued around the incident period. Tokens were present in SOME invitation and recovery emails. 1Password reports no evidence of abuse, but reissuing an invitation is trivial and a successful recovery-token abuse is a tenant foothold. Do not rely on an absence of evidence where the remedy is this cheap.","ASK 1PASSWORD DIRECTLY TO CLARIFY THE SRP VERIFIER QUESTION, because the public sources contradict each other. One report says stolen SRP parameters cannot be used to access an account; another, citing a company representative on the community forum, says the stolen data included Secure Remote Password verifiers derived from user account passwords and Secret Keys. Get the answer in writing before you decide whether a password rotation campaign is warranted.","DO NOT LAUNCH A PANIC-DRIVEN MASTER PASSWORD ROTATION ON THE STRENGTH OF THE CONFLICTING REPORTS ALONE - but do prepare the communications for one. 1Password's design combines the account password with a Secret Key held only on user devices, which materially raises the cost of any offline attack. Decide on evidence, not on the louder of two secondary sources.","REVIEW YOUR 1PASSWORD TENANT AUDIT LOG for the period from mid-November: unexpected recovery events, new device authorisations, vault access from unfamiliar locations, and administrative changes you did not request. 1Password reports no evidence of account takeovers; your own tenant log is where you confirm that for yourself.","RUN THE GENERIC PHISHING HUNT FOR 1PASSWORD-THEMED MAIL regardless of whether you are a customer. The stolen set - name, email, account ID, sign-in timestamp - is close to an ideal targeting list, and attackers will send to lists that include non-customers.","NOW THE PART THAT APPLIES TO EVERYONE: AUDIT YOUR OWN SOURCE-CONTROL-TO-PRODUCTION PATH THIS WEEKEND. Two confirmed incidents in this single report began at a hijacked developer account. Ask the specific question: could one compromised engineering identity push code that reaches a production service without a second human and a second credential? If the answer is yes, you have the same exposure 1Password had, and it is not a theoretical one.","ENFORCE PHISHING-RESISTANT MFA ON SOURCE CONTROL, not app-based push or SMS. Require hardware-backed or passkey authentication for GitHub, GitLab and your CI provider for every account with write access to anything that can deploy. This is the control whose absence produced both incidents in this report.","APPLY BRANCH PROTECTION AND MANDATORY REVIEW TO EVERY BRANCH THAT CAN REACH A DEPLOYMENT, require signed commits, and separate the identity that writes code from the identity that ships it. A code push that reaches production unreviewed is the mechanism named explicitly in 1Password's disclosure.","INVENTORY AND SHORTEN YOUR PERSONAL ACCESS TOKENS AND CI CREDENTIALS. Long-lived, broadly scoped tokens held in a developer's account are what converts an account hijack into a production compromise. Scope them narrowly, expire them aggressively, and alert on their creation.","CREDIT WHERE IT IS DUE AND USE IT AS A BENCHMARK: 1Password investigated from 19 November, disclosed on 25 November, published a specific affected-data list, made an unambiguous statement about vault contents, and published a further update. That is substantially better disclosure behaviour than most entries in this report - compare it with rank 1, rank 6 and rank 9. Use it as the standard you hold your own suppliers to."],"references":["https://1password.com/blog/update-on-nov-2026-security-incident","https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/","https://www.securityweek.com/1password-breach-exposes-customer-data-internal-source-code/","https://www.helpnetsecurity.com/2026/11/26/1password-breach-github-customer-records/","https://www.macrumors.com/2026/11/25/1password-security-breach/","https://appleinsider.com/articles/26/11/25/what-to-watch-for-after-the-new-1password-data-breach","https://privacyguides.org/news/2026/11/27/data-breach-roundup-nov-20-26-2026"],"kql":[{"platform":"defender_xdr","table":"EmailEvents","name":"Inbound mail impersonating 1Password breach notifications","description":"THE MOST URGENT QUERY IN THIS ENTRY. 1Password's own guidance warns customers to be wary of emails claiming they must secure their account in response to the breach. The stolen metadata set is close to an ideal targeting list for exactly this campaign.","query":"let Terms = dynamic([\"1password\",\"one password\",\"agilebits\",\"secure your vault\",\"vault security\",\"password manager security\",\"secret key\",\"emergency kit\"]);\nEmailEvents\n| where Timestamp > datetime(2026-11-24)\n| where (Subject has_any (Terms)) or (SenderDisplayName has_any (Terms)) or (SenderFromName has_any (Terms))\n| where not(SenderFromDomain in~ (\"1password.com\", \"agilebits.com\", \"1passwordservices.com\"))\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 15), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderFromAddress, SenderIPv4\n| order by Messages desc"},{"platform":"defender_xdr","table":"UrlClickEvents","name":"Clicks on 1Password-themed links outside the vendor's own domains","description":"Click-through is where a notification-impersonation campaign becomes an incident. A user who clicks a fake 1Password security link is a user about to type a master password into an attacker's page.","query":"let Terms = dynamic([\"1password\",\"onepassword\",\"1pass\",\"agilebits\",\"vault-secure\",\"secure-vault\",\"emergency-kit\"]);\nUrlClickEvents\n| where Timestamp > datetime(2026-11-24)\n| where Url has_any (Terms)\n| where not(Url has_any (dynamic([\"1password.com/\", \"agilebits.com/\", \"1password.eu/\", \"1password.ca/\"])))\n| project Timestamp, AccountUpn, Url, ActionType, IsClickedThrough, Workload, NetworkMessageId, ThreatTypes\n| order by Timestamp desc"},{"platform":"sentinel","table":"GitHubAuditData","name":"Source control: authentication and token activity from unexpected locations","description":"THE QUERY THAT MATTERS FOR EVERY READER, CUSTOMER OR NOT. Two confirmed incidents in this report began at a hijacked developer account. Table and column names vary by GitHub connector - adapt to your own ingestion before use.","query":"GitHubAuditData\n| where TimeGenerated > ago(45d)\n| where Action has_any (\"oauth_authorization.create\", \"personal_access_token.create\", \"personal_access_token.access_granted\", \"user.login\", \"user.failed_login\", \"two_factor_authentication.disabled\", \"org.update_member\")\n| summarize Events = count(), Actions = make_set(Action, 15), Countries = make_set(column_ifexists(\"Country\", \"\"), 10), IPs = make_set(column_ifexists(\"ActorIp\", \"\"), 15), FirstSeen = min(TimeGenerated) by Actor = column_ifexists(\"Actor\", \"\")\n| order by Events desc"},{"platform":"sentinel","table":"GitHubAuditData","name":"Source control: branch protection weakened or bypassed, and direct pushes to protected branches","description":"The control whose failure converts an account hijack into a production compromise. 1Password's disclosure says the attacker PUSHED MALICIOUS CODE TO BACKEND SERVICES. Any event that disables protection, bypasses review or force-pushes a protected branch deserves a same-day question.","query":"GitHubAuditData\n| where TimeGenerated > ago(45d)\n| where Action has_any (\"protected_branch.destroy\", \"protected_branch.update_admin_enforced\", \"protected_branch.policy_override\", \"protected_branch.update_required_status_checks_enforcement_level\", \"repo.access\", \"workflows.updated_workflow_run_permissions\", \"repo.change_merge_setting\")\n| project TimeGenerated, Action, Actor = column_ifexists(\"Actor\", \"\"), Repository = column_ifexists(\"Repo\", \"\"), ActorIp = column_ifexists(\"ActorIp\", \"\"), AdditionalFields\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Unexpected 1Password tenant administrative and recovery activity","description":"For organisations running 1Password Business or Teams. Account provisioning tokens were present in some invitation and recovery emails. 1Password reports no evidence of abuse; this is how you check your own tenant rather than relying on that.","query":"CloudAppEvents\n| where Timestamp > datetime(2026-11-14)\n| where Application has \"1Password\" or AccountDisplayName has \"1password\"\n| where ActionType has_any (\"recovery\", \"invite\", \"device\", \"admin\", \"group\", \"vault\", \"provision\")\n| project Timestamp, ActionType, AccountDisplayName, IPAddress, CountryCode, DeviceType, UserAgent, RawEventData\n| order by Timestamp desc"}],"iocs":[{"type":"ttp","value":"Phishing impersonating a breach notification from the breached vendor itself - 'secure your account in response to the incident', 'reset your password', 'verify your account information'","context":"1PASSWORD'S OWN WARNING. The stolen set - name, email, account ID, sign-in timestamp - is close to an ideal targeting list for exactly this campaign against exactly the population that uses a password manager.","confidence":"high","source":"1Password customer guidance via BleepingComputer, Help Net Security and MacRumors"},{"type":"ttp","value":"Hijacked employee corporate GitHub account used to PUSH MALICIOUS CODE TO BACKEND SERVICES, then to pull customer records","context":"NOT read-only repository theft - a SOURCE-CONTROL-TO-PRODUCTION path. This is the second incident in this report with a hijacked developer source-control account as the entry point (see rank 9, SAP). The repetition inside 48 hours is the finding.","confidence":"high","source":"1Password disclosure via BleepingComputer, SecurityWeek and Help Net Security"},{"type":"behaviour","value":"Direct pushes to protected branches, branch protection disabled or overridden, review requirements bypassed, or workflow permissions changed in your own source control","context":"The control whose failure converts an account hijack into a production compromise. If one compromised engineering identity can push code that reaches production without a second human and a second credential, you have 1Password's exposure.","confidence":"high","source":"Analyst assessment based on the disclosed mechanism"},{"type":"behaviour","value":"Creation of long-lived or broadly scoped personal access tokens and OAuth authorisations on source control accounts; MFA disabled on a developer account","context":"Long-lived, broadly scoped tokens in a developer's account are what turn an account hijack into infrastructure access. Alert on their creation rather than auditing them quarterly.","confidence":"medium","source":"Analyst assessment based on documented source-control compromise patterns"},{"type":"note","value":"TIMELINE: 1Password began investigating 19 NOVEMBER 2026 and disclosed 25 NOVEMBER, with a further update published around 26 November","context":"Six days from detection to public disclosure with a specific affected-data list. Substantially better disclosure behaviour than most entries in this report - usable as a benchmark for your own suppliers.","confidence":"high","source":"1Password blog and secondary reporting"},{"type":"note","value":"TAKEN, AS STATED: customer NAMES, EMAIL ADDRESSES, ACCOUNT AND USER IDS, SIGN-IN TIMESTAMPS, non-secret internal account metadata, tokens present in SOME INVITATION AND RECOVERY EMAILS, and 1Password's INTERNAL SOURCE CODE","context":"1Password characterises the metadata as non-secret. The invitation and recovery tokens are the component with direct operational consequence for tenant administrators.","confidence":"high","source":"1Password disclosure via BleepingComputer, SecurityWeek and Help Net Security"},{"type":"note","value":"NOT TAKEN, AS STATED: 'At no time were customer vault contents accessed by, or available to, t
