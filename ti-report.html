t for CVE-2026-103406","Repeated NGINX worker process termination or 'exited on signal 11' coinciding with HTTP/2 client traffic (CVE-2026-123007)","/core/install.php and /install.php (Drupal) - the attack surface for BOTH installer CVEs, not an attacker artefact","/awv (Mitel MiCollab Audio, Web and Video Conferencing component path)","4505/tcp and 4506/tcp (SaltStack publish and request ports on Session Smart Conductor)","Traversal sequences (.., %2e%2e, %252e) against MONAI Label /datastore, /upload, /annotation, /infer and /train endpoints","SSRF probe targets against mail security gateways - 169.254.169.254, metadata.google.internal, localhost, 127.0.0.1, file://, gopher://, dict:// (N-able Mail Assure CVE-2026-134624)","NO attacker IP address, domain, URL, file hash or YARA rule was published for ANY entry in this report - including the DWP incident, where none exists at all"],"kev_deadlines_passed_or_due":["2026-11-23","2026-11-24","2026-11-26","2026-11-27","2026-11-28","2026-12-09"],"kev_deadlines_expiring_today":["2026-11-27"],"kev_deadlines_within_48_hours":["2026-11-27","2026-11-28"],"kev_deadlines_already_passed":["2026-11-23","2026-11-24","2026-11-26"],"kev_cves_due_today":["CVE-2026-131914","CVE-2026-132165","CVE-2026-132224"],"kev_cves_due_tomorrow_28_november":["CVE-2026-103406","CVE-2026-133469","CVE-2026-133323","CVE-2026-133275","CVE-2026-133303","CVE-2026-133324","CVE-2023-25914","CVE-2023-25915"],"kev_cves_due_9_december":["CVE-2026-133311","CVE-2025-41450"],"kev_cves_overdue":["CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466"],"kev_cves_due_within_48_hours_count":11,"kev_additions_26_november":0,"kev_additions_27_november_identified":0,"deadline_obligations_beyond_patching":["CVE-2026-132165 (Drupal core) - KEV entry reported to require FORENSIC TRIAGE, not patching alone","CVE-2026-103406 (Juniper Session Smart) - three-day deadline reported with MANDATORY FORENSIC TRIAGE","CVE-2026-131914 (Idunno.AntiCsrf) - deadline CANNOT be met by patching: no patch exists and none will, so remediation means removing or replacing the dependency including transitive references"],"unpatchable_exploited_flaws_this_run":["CVE-2026-131914 (Idunno.AntiCsrf for ASP.NET) - NO PATCH, NO FIX EVER, KEV deadline TODAY","CVE-2026-129713 (Danfoss AK-SM 8xxA, CVSS 9.8 unauthenticated RCE) - fix only 'planned' for version 5.5.x with NO release date"],"new_entries_this_run":3,"materially_updated_entries":5,"carry_over_entries":2,"uk_government_entries":6,"uk_corporate_entries":4,"corrections_this_run":2,"corrections_detail":["MITEL DEADLINE SPLIT: yesterday's report recorded this as 'genuinely contested' across three mutually exclusive accounts. This window's reporting converges on FOUR of five CVEs due 28 November with CVE-2026-133311 due 9 December. The contested position is resolved in favour of 28 November for the majority.","DRUPAL VERSION CONFLICT: yesterday's report carried an internal advisory conflict between an affected range of >=11.4.0 \u003c11.4.14 and Solution text reading 'update to Drupal 11.4.13'. The 11.4.13 text does not recur in this window's sources; 11.4.14 is treated as the required build. A NEW requirement also emerged - affected sites must ALSO RUN THE UPDATE HOOK, so a version string alone is not remediation evidence."],"vendor_versus_authority_conflicts_this_run":["CVE-2026-123007 (F5 NGINX): CSA Singapore says 'reportedly' actively exploited as of 26 November; an independent analysis found NO exploitation reported by CERT-EU, Cloudflare or any vendor as of 20 November; still NOT in CISA KEV. The sharpest exploitation-status conflict in this report.","CVE-2026-136716 (Drupal): exploited per the Drupal Security Team but still NOT listed in CISA KEV - one tracker records an explicit negative check at 07:43 GMT on 26 November. The HIGHER-rated of the two Drupal flaws is the one with no federal deadline and no CVSS.","Mitel MiCollab (five CVEs): CISA lists all five as actively exploited; Mitel has NOT publicly confirmed exploitation in the wild and no actor has been attributed.","CVE-2026-103406 (Juniper): CISA KEV names both Session Smart Conductor and Session Smart Router; a vendor-oriented breakdown records Router as 'Not affected'.","CVE-2026-103406 (Juniper): at least one indexed secondary article states the flaw is not exploited in the wild, contradicting both Juniper's own SIRT update and the KEV listing.","CVE-2026-123890 (VMware vCenter): exploited by a Chinese threat actor for months and reported as a zero-day by Google on 20 November, but Broadcom has still NOT confirmed exploitation itself.","CVE-2026-123007 root cause and score: F5 says heap buffer overflow at CVSS v3.1 8.1; Wiz and others say integer underflow or overflow; Red Hat rates it Critical; one tracker records CVSS v4.0 9.2.","DWP: the department says 'some' online services were taken offline; a senior political correspondent reported 'all major benefits' and one outlet reported 'nearly all'. The departmental wording is recorded here.","Gatwick: the airport's stated scope is partial card metadata in isolated cases; several UK outlets assert stolen bank details, which the airport has not confirmed.","Next plc: the company told the market on 23 November the supplier data was 'benign' and unusable for fraud; N0n listed it on 25 November and Next has not named the supplier or linked the two."],"deadline_conflicts_unresolved_this_run":["Mitel MiCollab version strings: '10.3 (10.3.0.18) and earlier affected' versus '10.3 and earlier, fixed in 10.3.0.18 or later' - mutually incompatible, and determines whether 10.3.0.18 is the fix or is vulnerable","Vates Xen Orchestra fixed versions: 6.9.2 / 6.10.1 versus 5.213.1 / 5.211.2 - not adjacent numbering schemes, so one is wrong","Exact KEV due dates for the 23, 24 and 25 November batches are reconstructed from secondary reporting because the KEV catalogue itself could not be retrieved; where sources conflict the earliest date is the planning assumption"],"ai_agent_attack_reports_referenced":["NCSC published on 24 November a marked rise in AI-assisted attacks since September across multiple sectors, knocking services offline and compromising systems - finding that NOT ONE of the weaknesses exploited was new, only that exploitation is faster. Recommended controls were basic hygiene, zero trust, Cyber Essentials, the Cyber Assessment Framework for essential services, throttled sign-ups and an accurate inventory of public-facing systems.","Project MONAI Label CVE-2026-133968 (OVERDUE) was found AND exploited by AI agents per Amazon Threat Intelligence, reaching a root shell on university servers in East Asia in ELEVEN MINUTES - directly relevant to UK universities and NHS research computing.","Drupal CVE-2026-132165 was discovered by Anthropic's OSS Scanner and exploited on live sites about 24 hours after the fix shipped; the same installer subsystem produced a second exploited bypass seven days later.","NCSC State of the Cyber Nation judges an AI-powered ransomware attack on UK critical infrastructure 'highly likely' by 2028, having handled more than 200 incidents affecting CNI and its supporting networks in the year to May 2026, around three-quarters linked to state actors."],"third_party_compromise_pattern_this_month":"SIX FOR SIX. Every confirmed UK consumer-facing compromise disclosed in November 2026 originated at a THIRD PARTY, not at the named brand: Optimizely's signup flow serving malicious JavaScript from its own CDN to at least 178 organisations including the BBC, HSBC, TalkTalk, Zoom, IKEA, Salesforce and CNN (16 November); ASOS via third-party communications platforms; Next plc via an unnamed online supplier (23 November); TfL Oyster; London Gatwick Airport via Times24 UK Limited, operator of its drop-off zones, which has now DISABLED the affected payment system (24-27 November); and Halfords, which stated the breach hit a third-party digital service and was limited to product information and some employee usernames. Not one of these organisations was breached at its own perimeter, and not one could have prevented it by hardening its own estate. In at least THREE of the six the supplier was never named publicly - which is the difference between a scopable incident and an unscopable one. Rank 8 extends the pattern: five N0n retail listings share identical wording describing shopper search sessions, pointing at a single unnamed e-commerce search provider rather than twenty-plus separate intrusions, which would make one supplier compromise the origin of twenty-plus listings. The transferable finding from rank 9 is that Gatwick is UK critical national infrastructure and was reached through a drop-off barrier payment platform - every UK airport, port, rail operator, local authority and NHS trust runs an equivalent peripheral payment or access supplier, procured by estates and facilities and almost never inside the security assurance perimeter.","window_assessment":"The defining event of this window is a UK GOVERNMENT INCIDENT, not an advisory: the Department for Work and Pensions took Universal Credit, State Pension, PIP application, Pension Credit Checker and Tell Us Once services offline from the evening of 26 November after identifying a cyber incident, engaged both the NCSC and the Government Cyber Coordination Centre, and has published nothing beyond a precautionary-takedown statement and a payments assurance. No vector, no actor, no CVE, no data-access finding, no restoration timeline, and contested scope. Because nothing has been characterised, there are NO network indicators for the incident at all, and the only action available to organisations other than DWP is on the downstream fraud wave - which is why the highest-value action in this report for most readers is to publish a scam warning to benefit claimants TODAY, before the weekend, as DWP has itself done. The second feature of the window is a deadline wall: eleven exploited flaws across seven unrelated product families are due today or tomorrow, four more are already overdue and still exploited, and one of today's deadlines - Idunno.AntiCsrf CVE-2026-131914 - cannot be met by patching at all because no patch exists and none will, making it the item most likely to be silently skipped since it requires a dependency-graph search rather than a patch deployment. The third is a real change in exploitation status: a national authority (CSA Singapore) now says F5 NGINX CVE-2026-123007 is reportedly being actively exploited with a public PoC, against an explicit finding a week earlier that nobody had reported exploitation, and NGINX is the substrate of the UK public sector web estate. For UK government specifically the strongest governance finding remains rank 3: NHS England Digital rated the five Mitel MiCollab AWV flaws High on 16 November, nine days before CISA confirmed they were being exploited, so every closure decision on alert CC-4894 in that window rested on information that is now wrong - and the same failure mode applies to anyone who closed the Drupal change on the 18 November builds. Two unverified-but-significant UK items sit on a shared clock: the University of Liverpool listing claiming patient, student, staff, financial and research data with publication reportedly intended around 1-2 December, and the N0n batch naming hmv and Next plc with a countdown to roughly 2 December, alongside a Silentvault listing of UK firm The Neil Jones Food Company with the same date. Next Wednesday is a date on which multiple UK organisations may be publicly leaked. Finally, the October PHP episode that took 32 UK government services offline still has no published restoration update five weeks on - and the Cyber Security and Resilience Bill is in Commons-Lords ping-pong, three days after the Commons disagreed with both Lords amendments, which means a live incident disabling benefit services for millions of claimants will be cited in that debate.","highest_priority_action":"IF YOU SERVE BENEFIT CLAIMANTS IN ANY CAPACITY - local authority, housing association, credit union, debt advice or welfare rights charity, food bank network, NHS trust handling benefit-linked exemptions - DO THIS FIRST, TODAY, BEFORE THE WEEKEND: publish a short plain statement telling service users that DWP online services are down, that payments are continuing as normal, that DWP will NOT text or email asking for bank details or asking them to click a link, and that scam texts go to 7726 and scam emails to report@phishing.gov.uk. Brief your contact centre with the same script. A publicised outage of benefit sign-in is a near-ideal phishing pretext and getting ahead of it is the single highest-value action available to anyone who is not DWP. THEN work rank 10's nine-line checklist and answer yes or no to each, in writing, with a named owner: Drupal patched to 10.6.23 / 11.3.23 / 11.4.14 AND the update hook run AND the installer unreachable (DUE TODAY, forensic triage required); Idunno.AntiCsrf removed or replaced everywhere including transitive references (DUE TODAY, NO PATCH EXISTS - start here, because this is the one that gets skipped); Optimizely remediated (DUE TODAY); Mitel MiCollab patched or AWV external access restricted (TOMORROW); Juniper Session Smart on 7.0.5 / 7.1.7 / 7.2.3 (TOMORROW); Xen Orchestra patched, empty token blocked, off the internet (TOMORROW); Danfoss AK-SM off the internet (TOMORROW, worst flaw unpatchable); MONAI Label and N-able Mail Assure (OVERDUE); vCenter and Cisco Expressway (OVERDUE). ALSO TODAY, AND IT TAKES MINUTES EACH: search your logs for an authentication token that is empty, {} or %7B%7D if you run Xen Orchestra - that is effectively an exploit signature and the highest-yield single search in this report; and check whether HTTP/2 is enabled on your internet-facing NGINX, because disabling it removes the CVE-2026-123007 attack surface entirely. IF YOU ARE AN NHS ORGANISATION, add one item ahead of all of it: find out who closed or deferred NHS England cyber alert CC-4894 on the Mitel MiCollab flaws, when, and on what basis - because that decision was taken up to nine days before anyone knew those flaws were being exploited. IF YOU ARE A UK RETAILER, add one item: produce a written list of every third-party service embedded in your product search and listing pages before 2 December, because the identical wording across five N0n retail listings points at one unnamed shared search provider and the organisations that get surprised next Wednesday are the ones that cannot produce that list today."}}</script>

<script>
(function(){

  /* ---------- dom helpers (textContent only - no HTML injection) ---------- */
  function el(tag, cls, text){
    var n = document.createElement(tag);

    return n;
  }
  function kv(dl, key, val, accent){
    var d = el("div"), dt = el("dt", null, key), dd = el("dd");
    if (accent){ var b = el("b", null, val); dd.appendChild(b); } else { dd.textContent = val; }
    d.appendChild(dt); d.appendChild(dd); dl.appendChild(d); return d;

  function sec(title){
    var s = el("section","sec"); s.appendChild(el("h3", null, title)); return s;

  function fmtDate(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var day = String(d.getUTCDate()).padStart(2,"0");
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    var out = day + " " + mon + " " + d.getUTCFullYear();
    if (String(iso).indexOf("T") > -1){
      out += " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + "Z";
    }
    return out;
  }
  function label(s){
    if (!s) return "—";
    return String(s).replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
  }

  /* ---------- minimal KQL highlighter (safe: builds text nodes only) ---------- */
  var KQL_KW = ("let|where|project|summarize|extend|sort|order|by|join|union|take|limit|distinct|"
    + "count|dcount|countif|sum|make_set|make_list|min|max|any|avg|bin|ago|now|datetime|dynamic|"
    + "todouble|tostring|toint|tolong|strcat|strlen|extract|extract_all|parse_json|coalesce|"
    + "set_intersection|isnotempty|isempty|has|has_any|has_all|has_cs|contains|startswith|"
    + "endswith|in|and|or|not|asc|desc|on|datetime_part|dayofweek|column_ifexists|"
    + "ipv4_is_in_any_range|iff|case|print|top").split("|");
  var KQL_RE = new RegExp("(//[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b("
    + KQL_KW.join("|") + ")\\b", "g");
  function highlight(code){
    var frag = document.createDocumentFragment(), last = 0, m;
    KQL_RE.lastIndex = 0;
    while ((m = KQL_RE.exec(code)) !== null){
      if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
      var span = el("span", m[1] ? "c" : (m[2] ? "s" : "k"), m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
    return frag;
  }

  function copyBtn(getText, labelText){
    var b = el("button","copy", labelText || "Copy");
    b.type = "button";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = getText();
      function done(){
        var old = b.textContent;
        b.textContent = "Copied"; b.classList.add("ok");
        setTimeout(function(){ b.textContent = old; b.classList.remove("ok"); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
      } else { fallback(txt, done); }
    });
    return b;
  }
  function fallback(txt, done){
    var ta = el("textarea"); ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  function renderPosture(){

    li.appendChild(det);

    head.addEventListener("click", function(){
      var open = li.classList.toggle("is-open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
    });
    return li;
  }

  /* ---------- filtering ---------- */
  function haystack(e){
    var parts = [e.title, e.summary, e.vendor, e.id, e.category, e.severity, e.exploitation_status];
    parts = parts.concat(e.cve_ids || [], e.affected_products || [], e.recommended_actions || []);
    (e.iocs || []).forEach(function(i){ parts.push(i.value, i.type, i.context); });
    (e.kql || []).forEach(function(q){ parts.push(q.name, q.table, q.description); });
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function apply(){
    var v = DATA.vulnerabilities || [];
    var q = FILTER.q.trim().toLowerCase();
    var shown = 0;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li, idx){
      var e = v[idx], ok = true;
      if (FILTER.status !== "all" && e.exploitation_status !== FILTER.status) ok = false;
      if (ok && FILTER.kev && !e.kev_listed) ok = false;
      if (ok && FILTER.nopatch && e.patch_available === "yes") ok = false;
      if (ok && q && li._hay.indexOf(q) === -1) ok = false;
      li.hidden = !ok;
      if (ok) shown++;
    });
    document.getElementById("count").textContent = shown + " of " + v.length + " shown";
    document.getElementById("empty").hidden = shown !== 0;
  }

  function renderChips(){
    var v = DATA.vulnerabilities || [];
    var order = ["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed",
                 "public_poc_available","no_known_exploitation"];
    var counts = {};
    v.forEach(function(e){ counts[e.exploitation_status] = (counts[e.exploitation_status]||0)+1; });
    var box = document.getElementById("status-chips"); box.textContent = "";
    var defs = [["all","All",v.length]];
    order.forEach(function(k){ if (counts[k]) defs.push([k, STATUS[k].short, counts[k]]); });
    defs.forEach(function(d){
      var b = el("button","chip", d[1] + " (" + d[2] + ")");
      b.type = "button";
      b.setAttribute("aria-pressed", FILTER.status === d[0] ? "true" : "false");
      b.addEventListener("click", function(){
        FILTER.status = d[0];
        Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        apply();
      });
      box.appendChild(b);
    });
  }

  /* ---------- provenance ---------- */
  function renderProv(){
    var cm = DATA.collection_metadata || {};
    var box = document.getElementById("prov-body"); box.textContent = "";
    if (cm.collection_method){
      box.appendChild(el("h4", null, "Collection method"));
      box.appendChild(el("p","prose", cm.collection_method));
    }
    if ((cm.limitations || []).length){
      box.appendChild(el("h4", null, "Limitations"));
      var u = el("ul","list");
      cm.limitations.forEach(function(l){ u.appendChild(el("li", null, l)); });
      box.appendChild(u);
    }
    if (cm.confidence_legend){
      box.appendChild(el("h4", null, "Confidence legend"));
      var dl = el("dl");
      Object.keys(cm.confidence_legend).forEach(function(k){
        dl.appendChild(el("dt", null, k));
        dl.appendChild(el("dd", null, cm.confidence_legend[k]));
      });
      box.appendChild(dl);
    }
    var w = (DATA.report || {}).coverage_window || {};
    if (w.note){
      box.appendChild(el("h4", null, "Coverage window note"));
      box.appendChild(el("p","prose", w.note));
    }
    if ((cm.ioc_types_present || []).length){
      box.appendChild(el("h4", null, "IOC types present"));
      box.appendChild(el("p","prose", cm.ioc_types_present.join(", ")));
    }
  }

  /* ---------- report archive timeline ---------- */
  var TL_SHOWN = 10;

  function shortDate(iso){
    var p = String(iso).split("-");
    if (p.length !== 3) return String(iso);
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1];
    return (+p[2]) + " " + mon;
  }
  function longDate(iso){
    var p = String(iso).split("-");
    return p.length === 3 ? shortDate(iso) + " " + p[0] : String(iso);
  }
  /* A dated report sits in reports/; the stable copy sits at the repo root.
     Work out which, so archive links resolve from either location. */
  function archivePrefix(){
    return location.pathname.indexOf("/reports/") > -1 ? "" : "reports/";
  }

  function renderTimeline(index){
    var box = document.getElementById("timeline");
    box.textContent = "";
    var reports = (index && index.reports) || [];
    if (!reports.length){ box.hidden = true; return; }
    box.hidden = false;

    var current = index.generated_for;
    var prefix  = archivePrefix();
    var peak    = Math.max.apply(null, reports.map(function(r){ return r.actively_exploited || 0; }));
    if (!peak) peak = 1;

    /* header */
    var head = el("div","tl-head");
    head.appendChild(el("h2", null, "Report archive"));
    var meta = el("span","tl-meta");
    meta.appendChild(el("b", null, reports.length));
    meta.appendChild(document.createTextNode(
      " reports · " + longDate(reports[0].date) +
      " – " + longDate(reports[reports.length-1].date)));
    head.appendChild(meta);
    /* A dated report's index stops at its own date, so it can never name a
       later report. The stable root copy is always the newest, so offer that
       as the way forward. Omitted at the root, where it is the current page. */
    if (!prefix){
      var latest = el("a","tl-latest","Latest report \u2192");
      latest.href = "../ti-report.html";
      head.appendChild(latest);
    }
    box.appendChild(head);

    /* bars - one series (actively exploited per report), so no legend box;
       the caption names it. Hover and keyboard focus both open the tooltip. */
    var chart = el("div","tl-chart");
    var bars  = el("div","tl-bars");
    var tip   = el("div","tl-tip"); tip.hidden = true;

    reports.forEach(function(r){
      var b = el("button","tl-bar" + (r.date === current ? " is-current" : ""));
      b.type = "button";
      b.setAttribute("aria-label",
        longDate(r.date) + ": " + (r.actively_exploited||0) + " actively exploited of " +
        r.entries + " entries");
      var fill = el("span","tl-fill");
      fill.style.height = Math.max(4, Math.round((r.actively_exploited||0) / peak * 100)) + "%";
      b.appendChild(fill);

      function show(){
        tip.textContent = "";
        tip.appendChild(el("p","t-d", longDate(r.date) + (r.date === current ? "  (this report)" : "")));
        if (r.headline) tip.appendChild(el("p","t-h", r.headline));
        tip.appendChild(el("p","t-c",
          r.entries + " entries · " + (r.actively_exploited||0) + " exploited · " +
          (r.kev_listed||0) + " KEV · " + (r.cves||0) + " CVEs"));
        tip.hidden = false;
        /* clamp the tooltip inside the chart */
        var left = b.offsetLeft + b.offsetWidth/2 - bars.scrollLeft;
        var w = tip.offsetWidth || 200;
        var maxLeft = chart.clientWidth - w;
        tip.style.left = Math.max(0, Math.min(left - w/2, maxLeft < 0 ? 0 : maxLeft)) + "px";
      }
      function hide(){ tip.hidden = true; }
      b.addEventListener("mouseenter", show);
      b.addEventListener("focus", show);
      b.addEventListener("mouseleave", hide);
      b.addEventListener("blur", hide);
      b.addEventListener("click", function(){ location.href = prefix + r.file; });
      bars.appendChild(b);
    });

    chart.appendChild(tip);
    chart.appendChild(bars);
    var axis = el("div","tl-axis");
    axis.appendChild(el("span", null, shortDate(reports[0].date)));
    axis.appendChild(el("span", null, "actively exploited per report · peak " + peak));
    axis.appendChild(el("span", null, shortDate(reports[reports.length-1].date)));
    chart.appendChild(axis);
    box.appendChild(chart);

    /* newest-first list - this doubles as the chart's table view */
    var list = el("ol","tl-list");
    var ordered = reports.slice().reverse();
    ordered.forEach(function(r, i){
      var li = el("li");
      if (i >= TL_SHOWN) li.hidden = true;
      var a = el("a","tl-row" + (r.date === current ? " is-current" : ""));
      a.href = prefix + r.file;
      a.appendChild(el("span","tl-d", shortDate(r.date)));
      a.appendChild(el("span","tl-h", r.headline || "—"));
      if (r.date === current) a.appendChild(el("span","tl-now","viewing"));
      a.appendChild(el("span","tl-c",
        r.entries + "e · " + (r.actively_exploited||0) + "x · " + (r.kev_listed||0) + "k"));
      li.appendChild(a);
      list.appendChild(li);
    });
    box.appendChild(list);

    if (ordered.length > TL_SHOWN){
      var more = el("button","btn tl-more", "Show all " + ordered.length + " reports");
      more.type = "button";
      var open = false;
      more.addEventListener("click", function(){
        open = !open;
        Array.prototype.forEach.call(list.children, function(li, i){
          li.hidden = open ? false : i >= TL_SHOWN;
        });
        more.textContent = open ? "Show recent only" : "Show all " + ordered.length + " reports";
      });
      box.appendChild(more);
    }
  }

  /* ---------- boot ---------- */
  function render(data){
    DATA = data;
    renderHead(); renderTiles(); renderPosture(); renderChips(); renderProv();
    var list = document.getElementById("entries"); list.textContent = "";
    (DATA.vulnerabilities || []).forEach(function(e){
      var li = renderEntry(e);
      li._hay = haystack(e);
      list.appendChild(li);
    });
    ALL_OPEN = false;
    document.getElementById("toggle-all").textContent = "Expand all";
    apply();
  }

  document.getElementById("q").addEventListener("input", function(ev){
    FILTER.q = ev.target.value; apply();
  });
  ["f-kev","f-nopatch"].forEach(function(id){
    document.getElementById(id).addEventListener("click", function(){
      var b = document.getElementById(id);
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      FILTER[id === "f-kev" ? "kev" : "nopatch"] = on;
      apply();
    });
  });
  document.getElementById("toggle-all").addEventListener("click", function(){
    ALL_OPEN = !ALL_OPEN;
    var list = document.getElementById("entries");
    Array.prototype.forEach.call(list.children, function(li){
      li.classList.toggle("is-open", ALL_OPEN);
      var h = li.querySelector(".chead");
      if (h) h.setAttribute("aria-expanded", ALL_OPEN ? "true" : "false");
    });
    this.textContent = ALL_OPEN ? "Collapse all" : "Expand all";
  });

  /* drag & drop any TI JSON */
  var dragDepth = 0;
  window.addEventListener("dragenter", function(ev){ ev.preventDefault(); if (++dragDepth) document.body.classList.add("dragging"); });
  window.addEventListener("dragover",  function(ev){ ev.preventDefault(); });
  window.addEventListener("dragleave", function(){ if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("drop", function(ev){
    ev.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var parsed = JSON.parse(fr.result);
        if (!parsed || !parsed.vulnerabilities) throw new Error("not a TI output config");
        render(parsed);
        window.scrollTo(0,0);
      } catch(err){
        alert("Could not load that file: " + err.message);
      }
    };
    fr.readAsText(f);
  });

  /* embedded data first (works offline from file://); refresh from the sibling
     JSON when served over http(s) so a hosted copy always shows today's feed */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("ti-data").textContent); } catch(e){}
  if (embedded && embedded.vulnerabilities) render(embedded);

  /* The archive index describes the reports/ directory, not the data on show,
     so it is rendered once and left alone when another config is loaded. */
  try { renderTimeline(JSON.parse(document.getElementById("ti-index").textContent)); }
  catch(e){ document.getElementById("timeline").hidden = true; }

  if (location.protocol === "http:" || location.protocol === "https:"){
    fetch("ti-output-config.json", {cache:"no-store"}).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      if (j && j.vulnerabilities){
        var a = (j.report||{}).check_performed_at, b = (embedded&&embedded.report||{}).check_performed_at;
        if (a !== b) render(j);
      }
    }).catch(function(){ /* offline or no sibling file - embedded copy stands */ });
  }
})();
</script>
</body>
</html>
