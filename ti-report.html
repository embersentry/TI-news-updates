em are relayed from secondary reporting in this run because cisa.gov did not resolve in this environment, and sources disagree on which Binding Operational Directive governs the SonicWall deadline."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Exposure across the whole current KEV deadline board","description":"One query to produce the week's remediation list. Maps each CVE to its deadline so the output is sorted by urgency rather than by severity.","query":"let KevBoard = datatable(CveId:string, DueDate:datetime, Note:string)\n[\n  \"CVE-2026-19868\", datetime(2026-11-20), \"SonicWall SonicOS SSLVPN SAML/MFA bypass - no workaround\",\n  \"CVE-2026-125350\", datetime(2026-11-24), \"Chrome XML use-after-free\",\n  \"CVE-2026-124194\", datetime(2026-11-24), \"Outlook NTLM hash theft zero-day\",\n  \"CVE-2026-20320\", datetime(2026-11-24), \"Cisco BroadWorks\",\n  \"CVE-2026-102895\", datetime(2026-11-24), \"Openwave Webtop Media Transcoder\",\n  \"CVE-2026-115731\", datetime(2026-12-01), \"Puppet Enterprise - see rank 3\",\n  \"CVE-2026-123039\", datetime(2026-11-16), \"OVERDUE - Check Point\",\n  \"CVE-2026-114713\", datetime(2026-11-16), \"OVERDUE - UnrealIRCd\",\n  \"CVE-2026-123158\", datetime(2026-11-12), \"OVERDUE - OpenSSH SSHole\",\n  \"CVE-2026-118527\", datetime(2026-11-13), \"OVERDUE - Ivanti Connect Secure\",\n  \"CVE-2026-116606\", datetime(2026-11-13), \"OVERDUE - Barracuda ESG\",\n  \"CVE-2026-111560\", datetime(2026-11-13), \"OVERDUE - Barracuda ESG\",\n  \"CVE-2026-107441\", datetime(2026-11-20), \"Zyxel GS1900 - the flaw actually exploited, NOT the KEV entry\"\n];\nDeviceTvmSoftwareVulnerabilities\n| join kind=inner KevBoard on CveId\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 20) by CveId, DueDate, Note, SoftwareName, SoftwareVersion\n| extend DaysRemaining = datetime_diff(\"day\", DueDate, now())\n| order by DaysRemaining asc, Hosts desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"SonicWall SSLVPN authentications ahead of the 20 November deadline","description":"Because CVE-2026-19868 allows SAML-enforced MFA to be bypassed with credentials for an alternate authentication method, look for successful SSLVPN sessions that did not traverse the SAML flow.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where DeviceVendor has \"SonicWall\" or DeviceProduct has_any (\"SonicOS\", \"SonicWall\")\n| where Message has_any (\"SSLVPN\", \"ssl vpn\", \"sslvpn\", \"user login\", \"authentication\")\n| extend SamlInvolved = Message has_any (\"SAML\", \"saml\", \"IdP\", \"assertion\")\n| summarize Sessions = count(), Users = dcount(SourceUserName), SourceIPs = dcount(SourceIP), Sample = any(Message) by SamlInvolved, DeviceProduct\n| order by SamlInvolved asc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"SSLVPN sessions from unexpected geographies or hosting infrastructure","description":"An MFA bypass on a VPN appliance shows up as a legitimate-looking session from the wrong place. Tune the expected-country list to your workforce.","query":"let ExpectedCountries = dynamic([\"GB\", \"IE\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where DeviceVendor has_any (\"SonicWall\", \"Ivanti\", \"Pulse\", \"Fortinet\", \"Palo Alto\")\n| where Message has_any (\"VPN\", \"vpn\", \"tunnel\", \"portal login\")\n| extend SrcCountry = tostring(parse_json(tostring(AdditionalExtensions)).sourceCountry)\n| summarize Sessions = count(), Users = make_set(SourceUserName, 20) by SourceIP, SrcCountry, DeviceVendor\n| where isnotempty(SrcCountry) and not(SrcCountry in (ExpectedCountries))\n| order by Sessions desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Zyxel GS1900 management interface reachability (the LAN-adjacent assumption)","description":"Zyxel characterises the attacker as LAN-based or adjacent, so the exposure is a management interface reachable from a user or guest network rather than from the internet.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemotePort in (80, 443, 8080, 8443)\n| where RemoteIPType == \"Private\"\n| summarize Connections = count(), Sources = dcount(DeviceName), Devices = make_set(DeviceName, 20) by RemoteIP, RemotePort\n| where Connections > 5\n| order by Connections desc"},{"platform":"sentinel","table":"Syslog","name":"Network switch configuration access and credential exfiltration indicators","description":"The Kapibala activity reportedly exfiltrated device configurations, hashed root credentials and network information. This looks for configuration reads and administrative logins on managed switches.","query":"Syslog\n| where TimeGenerated > datetime(2026-08-01)\n| where SyslogMessage has_any (\"running-config\", \"startup-config\", \"config download\", \"config backup\", \"admin login\", \"login success\", \"web management\")\n| summarize Events = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Sample = any(SyslogMessage) by Computer, HostIP\n| order by Events desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Outlook CVE-2026-124194 coverage ahead of 24 November","description":"NHS England Digital cyber alert CC-4889 rates further exploitation of this Outlook zero-day as highly likely. Confirms which endpoints still lack the November update.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId == \"CVE-2026-124194\" or (SoftwareName has_any (\"outlook\", \"office\") and CveId startswith \"CVE-2026-\")\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by CveId, SoftwareName, SoftwareVersion\n| order by Hosts desc"},{"platform":"sentinel","table":"Syslog","name":"Ivanti Connect Secure post-exploitation (version checking is not assurance)","description":"The Integrity Checker Tool can return clean on a compromised appliance because attacker commands execute in memory, so hunt independently of patch state.","query":"Syslog\n| where TimeGenerated > datetime(2026-10-01)\n| where Computer has_any (\"ics\", \"ivanti\", \"pulse\", \"connectsecure\") or SyslogMessage has_any (\"Ivanti\", \"Connect Secure\", \"Pulse Secure\")\n| where SyslogMessage has_any (\"authorized_keys\", \"new user\", \"useradd\", \"crontab\", \"ssh-keygen\", \"/tmp/\", \"base64 -d\", \"curl \", \"wget \")\n| project TimeGenerated, Computer, ProcessName, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"OpenSSH SSHole exposure in the container estate, not just on servers","description":"The vulnerable condition is musl libc with PAM disabled - in practice Alpine images. Container estates are the population least likely to appear in an appliance-focused patch report.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has_any (\"openssh\", \"ssh\")\n| extend Suspect = SoftwareVersion !startswith \"10.6\" and SoftwareVersion !startswith \"10.7\"\n| summarize Hosts = dcount(DeviceId), SampleHosts = make_set(DeviceName, 25) by SoftwareName, SoftwareVersion, Suspect\n| order by Suspect desc, Hosts desc"}],"iocs":[{"type":"note","value":"KEV ADDITION IN THIS WINDOW: CVE-2026-115731 (Perforce Puppet Enterprise), added 17 November 2026, remediation due 1 December 2026","context":"The only addition since 13 November. Covered in full at rank 3 of this run because a configuration-management control plane warrants its own entry.","confidence":"high","source":"CISA alert of 17 November 2026 via secondary reporting"},{"type":"note","value":"DUE FRIDAY 20 NOVEMBER 2026: CVE-2026-19868 (SonicWall SonicOS SSLVPN SAML and MFA bypass)","context":"Affects SSLVPN only where SAML is enabled for SSLVPN logins; an attacker with valid credentials for an alternate authentication method bypasses SAML-enforced MFA. Fixes are SonicOS 7.3.4-7013 and 8.2.3-8015 and SonicWall states there is NO workaround, so this deadline must be met by patching.","confidence":"high","source":"SonicWall advisory SNWLID-2026-0014 and CISA KEV via secondary reporting"},{"type":"note","value":"DUE MONDAY 24 NOVEMBER 2026: CVE-2026-125350 (Chrome), CVE-2026-124194 (Outlook), CVE-2026-20320 (Cisco BroadWorks), CVE-2026-102895 (Openwave Webtop Media Transcoder)","context":"Four in one day. Outlook is the highest priority of the four: it was exploited as a zero-day before the November Patch Tuesday and NHS England Digital cyber alert CC-4889 rates further exploitation as highly likely.","confidence":"high","source":"CISA KEV and NHS England Digital via secondary reporting"},{"type":"note","value":"OVERDUE: CVE-2026-123039 (Check Point) and CVE-2026-114713 (UnrealIRCd) since 16 November; CVE-2026-123158 (OpenSSH SSHole) since 12 November; CVE-2026-118527 (Ivanti Connect Secure) since 13 November; CVE-2026-116606 and CVE-2026-111560 (Barracuda ESG)","context":"Six overdue entries, four of them on edge or remote-access infrastructure. An overdue KEV item on an edge appliance is the most reliable predictor of an incident on this board.","confidence":"medium","source":"analyst consolidation of KEV reporting"},{"type":"note","value":"CATALOGUE ERROR: the Zyxel KEV entry is CVE-2026-7273, but the flaw actually exploited is CVE-2026-107441","context":"The single most important item in this entry. CISA added CVE-2026-7273 in September 2026 on GreyNoise's attribution; Binarly then showed the exploit worked against switches already running the June updates, so those attacks were not using CVE-2026-7273. An organisation that saw the KEV entry, patched to the June firmware and closed the ticket is still vulnerable, with a remediation record that says otherwise.","confidence":"medium","source":"Binarly and GreyNoise via trade press"},{"type":"note","value":"ZYXEL REMEDIATION: firmware 2.90 Patch 3 for CVE-2026-107441; affects ten GS1900 models on firmware 2.90(xxx.2)C0 or earlier; advisory published 3 November 2026; no workarounds listed","context":"Scores differ: Zyxel rates it 8.8 High with a LAN-based or adjacent attacker, Binarly rates it 9.8 Critical. Firmware release date differs between sources (22 or 23 October 2026).","confidence":"medium","source":"Zyxel advisory and Binarly via secondary reporting"},{"type":"behaviour","value":"996 Zyxel GS1900 switches compromised across 48 countries since around 17 August 2026, exfiltrating device configurations, hashed root credentials and network information","context":"Most affected countries reported as Italy, the United States and Taiwan. Because hashed root credentials were taken, device password rotation is part of remediation, not an optional extra.","confidence":"medium","source":"GreyNoise via trade press"},{"type":"ttp","value":"Kapibala - actor tracked by GreyNoise, assessed as Chinese-speaking, exploiting Zyxel GS1900 web management interfaces from a LAN-based or adjacent position","context":"The access assumption matters for UK exposure assessment: the realistic risk is a switch management interface reachable from a user, guest or branch network, not one exposed to the internet.","confidence":"medium","source":"GreyNoise via trade press"},{"type":"behaviour","value":"Alpine-based container images running sshd in Kubernetes clusters or CI/CD pipelines","context":"The realistic UK exposure surface for OpenSSH SSHole (CVE-2026-123158): musl libc plus PAM disabled is the default shape of an Alpine image, and container estates are the population least likely to be covered by an appliance-focused patching report.","confidence":"medium","source":"analyst assessment"},{"type":"note","value":"IVANTI CAVEAT: the Integrity Checker Tool can return clean on a compromised appliance because attacker commands execute in memory","context":"Version checking is not assurance for CVE-2026-118527. Hunt for post-exploitation independently of patch state.","confidence":"medium","source":"carried prior reporting"},{"type":"note","value":"SOURCE CONFLICT: the SonicWall deadline is cited under Binding Operational Directive 22-01 by one source and 26-04 by another","context":"Immaterial for a UK organisation, which carries no CISA obligation, but it indicates that the relayed KEV metadata in this entry is imprecise. Verify against the live catalogue before using any date in a compliance return.","confidence":"medium","source":"conflicting secondary sources"},{"type":"note","value":"ALL DATES IN THIS ENTRY ARE RELAYED, NOT READ AT SOURCE","context":"cisa.gov did not resolve in this environment during this run, so the catalogue was not read directly. The dates are consistently reported across several sources but should be verified against the live KEV catalogue before being used as compliance evidence.","confidence":"high","source":"collection note"}],"references":["https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog","https://www.cisa.gov/news-events/alerts/2026/11/13/cisa-adds-two-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog","https://www.esecurityplanet.com/vulnerabilities/news-sonicwall-sslvpn-authentication-bypass-cve-2026-19868/","https://blog.openvpn.net/cve-2026-19868-sonicwall-sslvpn-saml-mfa-bypass","https://www.rescana.com/post/sonicwall-sonicos-cve-2026-19868-sslvpn-saml-mfa-bypass","https://www.securityweek.com/zyxel-switch-hacks-blamed-on-patched-flaw-actually-exploited-a-zero-day/","https://www.bleepingcomputer.com/news/security/zyxel-fixes-zero-day-exploited-to-hack-nearly-1-000-network-switches/","https://www.csoonline.com/article/4245028/zyxel-patches-a-zero-day-hiding-behind-an-old-fix.html","https://blog.ostorlab.co/zyxel-gs1900-pre-auth-rce-cve-2026-107441.html","https://routerarena.com/news/Zyxel-patches-CVE-2026-107441-zero-day-exploited-on-GS1900-switches","https://socprime.com/blog/cve-2026-124194-microsoft-outlook-zero-day-exploited-to-steal-ntlm-hashes/","https://digital.nhs.uk/cyber-alerts/2026/cc-4889"]},{"rank":8,"id":"TI-2026-11-18-005","title":"UK Corporate Roundup: 'n0n' Claims Debenhams With 15,708 Customer Email Addresses and 8,530 Password-Recovery Codes and Claims Bensons for Beds' AI Storefront Assistant Chat Transcripts, as SonicWall Measures UK Retail Intrusion Attempts 169% Above Last Year Going Into Black Friday","cve_ids":[],"vendor":"UK retail sector; 'n0n' extortion group; SonicWall and Gallagher (telemetry and survey sources)","affected_products":["Debenhams - claimed by 'n0n', listing recorded 16-17 November 2026, unconfirmed by the company","Bensons for Beds Retail Ltd - claimed by 'n0n', listing recorded 16 November 2026, unconfirmed by the company","UK retail web applications generally - the attack surface SonicWall's telemetry measures","AI-driven storefront assistants and the chat transcripts they retain, which is a data class most retailers have not inventoried"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-16","last_updated":"2026-11-18","confidence":"low","summary":"Two UK retail brands were posted to an extortion leak site in this window and a third-party telemetry set published the same week says UK retail is under materially more pressure than last year. Taken together they are the UK corporate story of the window, and the timing - six days before Black Friday - is the reason it matters now rather than in a monthly report.\n\nThe claims. A group calling itself 'n0n' listed Debenhams, described as a major United Kingdom online department store group, with the listing recorded on 16 November 2026 and an estimated attack date of 16 November. Its claimed haul is specific enough to be worth examining: 15,708 distinct customer email addresses and 8,530 distinct password-recovery codes. The same group listed Bensons for Beds Retail Ltd on 16 November, estimated attack date 9 November, and the claimed data is described as shopper chat transcripts from the retailer's storefront assistant together with automated profiling of those shoppers. Neither company has been quoted confirming anything, and these are the group's own claims on its own leak site.\n\nThe password-recovery codes are the detail a security team should stop on. If 8,530 password-recovery codes are genuine and still valid, they are not a disclosure problem, they are an account-takeover toolkit: a recovery code is designed to let someone past authentication without the password. Combined with the matching email addresses, that is a ready-made takeover set against a retail account base during the highest-traffic trading period of the year, when fraudulent orders and changed delivery addresses are hardest to spot in the noise. The correct response to a claim like this does not depend on confirming it - invalidate outstanding recovery tokens, force a rotation, and watch for recovery-flow abuse.\n\nThe Bensons for Beds claim contains something genuinely new for this feed: the claimed data class is AI storefront assistant chat transcripts plus automated shopper profiling. Chat transcripts with a sales assistant are a data class that most retailers have not inventoried, that frequently contain far more than the retailer intended - delivery addresses, order numbers, payment problems, health or bereavement context in a furniture purchase, sometimes card fragments typed by a confused customer - and that are usually retained by the vendor of the assistant rather than by the retailer. Any UK organisation that has deployed an AI chat assistant in the last two years should treat this claim as a prompt to establish three things: what the transcripts contain, who holds them, and how long they are kept.\n\nThe measured context. SonicWall's UK retail telemetry, published 17 November, recorded 23.2 million high- and medium-priority intrusion prevention events and 399,530 malware threats across UK retail sensors between January and September 2026, which it annualises to roughly 169% above 2025's full-year total. The composition is the useful part: web application attacks are 97% of that activity and appeared on 72% of monitored sensors, directory traversal alone generated 10.5 million hits, cross-site scripting 1.6 million, and more than 263,000 attempts targeted Log4j-vulnerable systems. SonicWall's EMEA executive Spencer Starkey attributed the focus to personal data theft during the peak trading quarter, noting that retailers are reluctant to take systems offline for patching at exactly this time of year - which is the honest tension every UK retail security team is living with this week. Separately, a Gallagher survey published on 18 November reports that 83% of UK businesses experienced a cyber incident in the past twelve months against a 75% global average, and that three in five took more than 24 hours to discover a fraudulent attack.\n\nThe 169% figure needs stating carefully. It is an annualised extrapolation from nine months of sensor data, not a completed year-on-year comparison, and some coverage describes it as year-over-year without that qualification. The direction is well supported; the precision is not. Two outlets also differ on the event count (23.2 versus 23.3 million).\n\nThe scepticism this entry requires about 'n0n' itself. Bitdefender's analysis reports that the group emerged in mid-September 2026, that debate remains over whether n0n consistently uses ransomware at all, and - most importantly - that data obtained from n0n's own file server indicated it had targeted just over 20 victims, with duplicate or false entries likely arising from weaknesses in how it maintained its site and polled potential targets. Against that, trackers credit the group with 122 victims in the last 30 days and 184 named victims overall. Those two accounts cannot both be right. The practical conclusion is that n0n's victim counts are unreliable and its listings may include organisations it never breached - which is a reason to verify rather than to dismiss, because a fabricated listing still triggers customer enquiries, press questions and a disclosure decision.\n\nUK relevance and what to do about it. This is squarely the UK corporate half of this feed's brief: two named UK retail brands, UK retail sector telemetry, and a UK business survey, all within a week of the year's peak trading. The one action that matters more than the others is the recovery-code one, because it is cheap, it does not require the claim to be confirmed, and it closes the specific path the claimed data would open.\n\nConfidence and caveats. Confidence is low, and deliberately so. Every incident claim here is an unverified leak-site listing; neither Debenhams nor Bensons for Beds has been quoted confirming an incident, and no ICO statement was identified. The record counts are the group's own. Listing dates differ between trackers (16 versus 17 November), as do estimated attack dates. The group's own victim tally is contradicted by vendor research into its infrastructure. The SonicWall figures are vendor telemetry from its own sensor estate rather than a measure of UK retail as a whole, and the 169% is an extrapolation. The Gallagher figure is survey self-report. No leak site was accessed and no tracker page was fetched directly in this environment - ransomware.live did not resolve - so all listing detail is relayed through search-result summaries.","recommended_actions":["If you operate a consumer account base, invalidate outstanding password-recovery tokens and force a rotation of recovery codes now, without waiting for any claim to be confirmed. A recovery code is designed to bypass authentication; 8,530 of them paired with email addresses is an account-takeover set, and the remediation is cheap enough that confirmation is not worth waiting for.","Instrument the account-recovery flow for abuse this week specifically, because Black Friday traffic will hide it. Alert on recovery-code redemption spikes, redemptions from new infrastructure, and recovery followed immediately by a delivery-address or payment-method change - that last sequence is the fraud pattern, not the login itself.","Inventory your AI chat and storefront assistant transcripts, which the Bensons for Beds claim makes a live data class rather than a theoretical one. Establish what the transcripts contain, whether the vendor or you holds them, how long they are retained, and whether they are in scope of your retention schedule and ROPA. Most organisations will find the answer is 'the vendor, indefinitely, and no'.","Prioritise web application defences over network controls for the next fortnight, because that is where the measured activity is: 97% of recorded UK retail intrusion activity was web application attacks, with directory traversal the single largest technique. Review WAF coverage and rule mode (blocking, not just logging) on every customer-facing application.","Run a Log4j exposure check even though it is a 2021 vulnerability, because more than 263,000 attempts were still recorded against UK retail sensors. Attackers scan for it because they still find it, usually inside a vendor appliance or a container base image rather than in first-party code.","Accept the change-freeze tension explicitly rather than implicitly. SonicWall's point - that retailers will not take systems offline for patching during peak trading - is accurate and is why attackers choose this quarter. Decide now, in writing, which classes of vulnerability will break the freeze (internet-facing unauthenticated RCE, authentication bypass) and which will wait until January.","If your organisation is named in a leak-site listing, verify before responding but prepare as though it is real. A fabricated listing still produces customer enquiries, press questions and a disclosure decision, and n0n's own listings are known to include probable duplicates and false entries - so the communications work is needed either way.","Treat the Gallagher finding that three in five UK businesses took more than 24 hours to discover a fraudulent attack as a detection-time target rather than a statistic. Pick one fraud scenario relevant to your business and measure honestly how long it would take you to notice."],"kql":[{"platform":"sentinel","table":"SigninLogs","name":"Account-recovery and self-service password reset abuse","description":"Primary detection for the claimed password-recovery-code exposure. Volume anomalies matter more than individual events; baseline against the preceding 30 days.","query":"SigninLogs\n| where TimeGenerated > ago(30d)\n| where AuthenticationRequirement != \"multiFactorAuthentication\"\n| where ResultType in (0, 50074, 50076, 50158)\n| extend ClientIP = IPAddress, Country = tostring(LocationDetails.countryOrRegion)\n| summarize Attempts = count(), Users = dcount(UserPrincipalName), Countries = make_set(Country, 10) by bin(TimeGenerated, 1h), ClientIP\n| where Users > 5\n| order by Users desc"},{"platform":"sentinel","table":"AuditLogs","name":"Password reset and recovery-method changes at volume","description":"Detects mass recovery activity, including the attacker-driven kind, and supports the forced-rotation action by showing what normal looks like.","query":"AuditLogs\n| where TimeGenerated > ago(30d)\n| where OperationName has_any (\"Reset password\", \"Change password\", \"Update user\", \"Register security info\", \"Delete security info\", \"User registered security info\")\n| extend Target = tostring(TargetResources[0].userPrincipalName)\n| summarize Operations = count(), Targets = dcount(Target) by bin(TimeGenerated, 1h), OperationName, InitiatedBy = tostring(parse_json(tostring(InitiatedBy)).user.userPrincipalName)\n| where Targets > 3\n| order by Targets desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Directory traversal against customer-facing web applications (the largest measured technique)","description":"SonicWall recorded 10.5 million directory traversal hits across UK retail sensors. This finds the same pattern in your own perimeter logs and, importantly, which attempts were allowed rather than blocked.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where isnotempty(RequestURL)\n| where RequestURL has_any (\"../\", \"..%2f\", \"..%252f\", \"%2e%2e%2f\", \"....//\", \"/etc/passwd\", \"\\\\..\\\\\", \"web.config\", \"WEB-INF\")\n| summarize Attempts = count(), Allowed = countif(DeviceAction !has \"deny\" and DeviceAction !has \"block\"), Sources = dcount(SourceIP) by DestinationHostName, DeviceProduct\n| where Attempts > 10\n| order by Allowed desc, Attempts desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Cross-site scripting and Log4j probe attempts","description":"Covers the other two measured techniques, including the 263,000+ Log4j attempts. A Log4j hit that was allowed warrants an exposure check on the receiving host.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where isnotempty(RequestURL) or isnotempty(Message)\n| extend Payload = strcat(tostring(RequestURL), \" \", tostring(Message))\n| extend Technique = case(\n    Payload has_any (\"${jndi:\", \"${j${\", \"jndi:ldap\", \"jndi:rmi\", \"${lower:j\"), \"Log4j\",\n    Payload has_any (\"\u003cscript\", \"onerror=\", \"javascript:\", \"onload=\", \"%3Cscript\"), \"XSS\",\n    \"other\")\n| where Technique != \"other\"\n| summarize Attempts = count(), Allowed = countif(DeviceAction !has \"deny\" and DeviceAction !has \"block\"), Sources = dcount(SourceIP) by Technique, DestinationHostName\n| order by Allowed desc, Attempts desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Bulk customer-data export from retail and e-commerce platforms","description":"Detects the exfiltration shape behind a claimed email-address and recovery-code dump: a single account exporting far more records than normal.","query":"CloudAppEvents\n| where Timestamp > ago(45d)\n| where ActionType has_any (\"Export\", \"Download\", \"BulkDownload\", \"ReportExport\", \"QueryExecuted\")\n| summarize Events = count(), Apps = make_set(Application, 10) by AccountDisplayName, AccountObjectId, bin(Timestamp, 1d)\n| order by Events desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"AI chat assistant and vendor endpoints: who holds your transcripts","description":"Supports the chat-transcript inventory action by identifying which third-party assistant platforms your customer-facing properties actually talk to.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where isnotempty(DestinationHostName)\n| where DestinationHostName has_any (\"chat\", \"assistant\", \"livechat\", \"intercom\", \"zendesk\", \"drift\", \"ada\", \"openai\", \"anthropic\", \"bot\")\n| summarize Requests = count(), Bytes = sum(todouble(SentBytes)) + sum(todouble(ReceivedBytes)), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by DestinationHostName, DeviceProduct\n| order by Requests desc"},{"platform":"sentinel","table":"ThreatIntelligenceIndicator","name":"Brand and domain monitoring for leak-site and extortion claims","description":"Supports the verify-but-prepare action by matching your own domains against available threat intelligence indicators.","query":"let OurDomains = dynamic([]); // populate with your own and your brands' domains\nThreatIntelligenceIndicator\n| where TimeGenerated > ago(45d)\n| where Active == true\n| where array_length(OurDomains) == 0 or DomainName has_any (OurDomains) or Url has_any (OurDomains)\n| project TimeGenerated, Description, ThreatType, DomainName, Url, ConfidenceScore, SourceSystem\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"EVERY INCIDENT CLAIM IN THIS ENTRY IS AN UNVERIFIED LEAK-SITE LISTING","context":"Neither Debenhams nor Bensons for Beds has been quoted confirming an incident, and no ICO statement was identified. Record counts are the group's own claims. Do not repeat them as confirmed breaches; do act on the recovery-code risk, which is cheap and does not depend on confirmation.","confidence":"high","source":"collection note"},{"type":"note","value":"CLAIMED VICTIM: Debenhams - 'n0n' listing recorded 16-17 November 2026, estimated attack date 16 November","context":"Claimed data is 15,708 distinct customer email addresses and 8,530 distinct password-recovery codes. Described in the listing as a major United Kingdom online department store group.","confidence":"low","source":"ransomware.live and Breachsense listings via search-result summaries"},{"type":"note","value":"CLAIMED VICTIM: Bensons for Beds Retail Ltd - 'n0n' listing recorded 16 November 2026, estimated attack date 9 November","context":"Claimed data is shopper chat transcripts from the retailer's storefront assistant plus automated profiling of those shoppers - a data class most UK retailers have not inventoried.","confidence":"low","source":"ransomware.live listing via search-result summaries"},{"type":"behaviour","value":"Theft of password-recovery codes alongside the matching email addresses","context":"The most consequential element of the Debenhams claim. A recovery code is designed to let someone past authentication without the password, so the pairing is an account-takeover set rather than a disclosure. Invalidate outstanding recovery tokens regardless of whether the claim is verified.","confidence":"medium","source":"analyst assessment of the claimed data"},{"type":"behaviour","value":"Account recovery followed immediately by a delivery-address or payment-method change","context":"The fraud sequence to alert on, rather than the login itself. Black Friday order volume is what makes it invisible, which is why the detection has to be in place before the traffic rather than after.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Exfiltration of AI storefront assistant chat transcripts and derived shopper profiles","context":"A new claimed data class for this feed. Transcripts commonly contain delivery addresses, order numbers, payment problems and personal context the retailer never intended to retain, and are usually held by the assistant vendor rather than by the retailer.","confidence":"low","source":"n0n listing via search-result summaries; analyst assessment of the data class"},{"type":"ttp","value":"'n0n' - extortion group that emerged mid-September 2026, with disputed use of encryption and unreliable victim accounting","context":"Bitdefender reports debate over whether n0n consistently uses ransomware, and that data from n0n's own file server indicated just over 20 victims with probable duplicate or false entries from weak site maintenance and target polling - against tracker figures of 122 victims in 30 days and 184 named overall. Those accounts cannot both be right.","confidence":"low","source":"Bitdefender Threat Debrief November 2026 and ransomware trackers via search-result summaries"},{"type":"behaviour","value":"Web application attacks constituting 97% of recorded intrusion activity against UK retail sensors, present on 72% of them","context":"Directs the next fortnight's effort: WAF coverage and blocking mode on customer-facing applications, ahead of network-layer work. From vendor telemetry across SonicWall's own sensor estate, not a measure of UK retail as a whole.","confidence":"medium","source":"SonicWall telemetry published 17 November 2026 via secondary reporting"},{"type":"behaviour","value":"Directory traversal as the single largest measured technique - 10.5 million hits; cross-site scripting 1.6 million; more than 263,000 attempts against Log4j-vulnerable systems","context":"Log4j attempts at that volume in late 2026 mean attackers still find it, typically inside a vendor appliance or container base image rather than in first-party code. An allowed Log4j probe warrants an exposure check on the receiving host.","confidence":"medium","source":"SonicWall telemetry via secondary reporting"},{"type":"note","value":"MEASUREMENT CAVEAT: the '169% above last year' figure is an annualised extrapolation from nine months (January-September 2026), not a completed year-on-year comparison","context":"Some coverage presents it as year-over-year without that qualification. The direction is well supported; the precision is not. Outlets also differ on the event count (23.2 versus 23.3 million IPS events).","confidence":"high","source":"SonicWall telemetry and conflicting secondary coverage"},{"type":"note","value":"CONTEXT SURVEY (18 November 2026): 83% of UK businesses report a cyber incident in the past twelve months against a 75% global average; three in five took more than 24 hours to discover a fraudulent attack","context":"Survey self-report rather than telemetry. The detection-time finding is the useful half: treat it as a target to test against one fraud scenario rather than as a statistic to quote.","confidence":"low","source":"Gallagher survey via secondary reporting"},{"type":"note","value":"SEASONAL TIMING: Black Friday falls within a week of this run","context":"Why this entry is ranked where it is. Peak order volume hides fraudulent orders and address changes, and change freezes stop the patching that would otherwise close the web application exposure SonicWall measured. Decide in advance which vulnerability classes break the freeze.","confidence":"high","source":"analyst assessment"}],"references":["https://www.ransomware.live/id/RGViZW5oYW1zQE4wbg","https://www.ransomware.live/id/QmVuc29ucyBmb3IgQmVkcyBSZXRhaWwgTHRkQE4wbg","https://www.ransomware.live/group/N0n","https://www.breachsense.com/ransomware-groups/n0n/","https://www.bitdefender.com/en-gb/blog/businessinsights/bitdefender-threat-debrief-november-2026","https://securitybrief.co.uk/story/cyber-criminals-step-up-attacks-on-uk-retail-websites","https://www.scworld.com/brief/uk-retailers-face-surge-in-cyberattacks-ahead-of-holiday-shopping-season","https://internationalsecurityjournal.com/sonicwall-hackers-retail-sites/","https://manageditmag.co.uk/shop-window-cyber-siege-sonicwall-data-shows-hackers-probing-uk-retailers-online-storefronts/","https://www.techradar.com/pro/security/uk-small-businesses-are-being-hit-by-scams-and-commercial-crime-like-never-before","https://www.ransomlook.io/group/n0n"]},{"rank":9,"id":"TI-2026-11-18-006","title":"Legacy XML Endpoint Bundle Published 17 November: Apache Roller CVE-2026-129448 (Unauthenticated Deserialization in /roller-services/xmlrpc, CVSS 9.8) and TYPO3 CVE-2026-125160, Both Described as Exploited by Their Own Vendors - Same Failure Mode as the Confluence Axis Flaw at Rank 2","cve_ids":["CVE-2026-129448","CVE-2026-125160","CVE-2026-119623","CVE-2026-82384"],"vendor":"Apache Software Foundation (Roller); TYPO3","affected_products":["Apache Roller 4.0.0 through 6.1.4 - unauthenticated deserialization via the XML-RPC endpoint; fix reported as 6.1.6, with some sources listing 6.1.5","TYPO3 CMS Form Framework - CVE-2026-125160 information disclosure; fixed in 14.3.12, 13.4.40, 12.4.52 and older branch equivalents","TYPO3 CMS - CVE-2026-119623, reported CVSS 9.4 and described as enabling remote code execution","CVE-2026-82384 - the same Apache Roller flaw under an earlier identifier, listing only 6.1.5 as affected"],"category":"vulnerability_bundle","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-17","last_updated":"2026-11-18","confidence":"low","summary":"Two content management system vulnerabilities were published on 17 November 2026 and both vendors' own advisories describe them as being exploited. They are bundled because they share a failure mode with rank 2 of this run, and the shared mode is the actionable part: a legacy XML endpoint, left enabled by default, reachable without authentication, handling untrusted structured input.\n\nApache Roller CVE-2026-129448. An unauthenticated deserialization of untrusted data in Roller's XML-RPC endpoint, reported CVSS 9.8, affecting versions 4.0.0 through 6.1.4 and allowing unauthenticated remote attackers to execute arbitrary code. Apache's own note is quoted as stating the issue is being actively exploited. The fix is reported as 6.1.6, which disables extension types and rejects XML-RPC requests when the feature is off; some sources list 6.1.5 instead. Where upgrading is not possible the workaround is to set enabledForExtensions to false in WEB-INF/web.xml, or to remove the /roller-services/xmlrpc servlet mapping, and restart Roller. One complication worth knowing: this is reported to be the same vulnerability as CVE-2026-82384, which listed only Roller 6.1.5 as affected - so if you tracked the earlier identifier and concluded you were out of scope on a 6.1.x build, check again against the wider 4.0.0-6.1.4 range.\n\nTYPO3 CVE-2026-125160. An information disclosure flaw in the Form Framework, CVSS 6.3, where files uploaded through FileUpload or ImageUpload form elements are stored in an unguessable sub-folder that stays constant for the whole form session - and error messages leaked that path, letting an attacker determine the public URL of files uploaded through the form. The TYPO3 advisory itself states the vulnerability is known to be actively exploited. Fixed versions are 14.3.12, 13.4.40, 12.4.52 and the corresponding older branches. Separately, several outlets flag TYPO3 CVE-2026-119623 at CVSS 9.4 and describe it as enabling remote code execution; detail on that one is thin in the sources reviewed, and it should be treated as a second reason to take the same TYPO3 update rather than as a separately characterised flaw.\n\nThe low score on the TYPO3 flaw understates it in one specific scenario, and that scenario is a UK public sector one. A 6.3 information disclosure sounds like a finding to schedule. But the disclosed thing is the public URL of files that members of the public uploaded through a web form - and UK local authority, NHS and university TYPO3 sites use exactly those forms for benefit claims, planning objections, complaints, safeguarding referrals and job applications, with identity documents and medical evidence attached. In that context the flaw does not disclose a path; it discloses other people's documents. Score the consequence, not the CVSS.\n\nThe pattern across ranks 2 and 9, which is the reason to read this entry. Confluence exposed an end-of-life Apache Axis SOAP endpoint; Roller exposes an XML-RPC endpoint; TYPO3's flaw is in a legacy error-handling path in a form framework. In each case the vulnerable surface is a feature that predates the current product, remains enabled by default, and almost nobody uses. The generalisable action is therefore not three patches but one question asked across the estate: which legacy XML, SOAP, XML-RPC and remote API endpoints are enabled on applications we run, and which of them does anyone actually use? The answer is almost always 'none', and disabling them is faster than patching and durable against the next flaw in the same code.\n\nUK relevance. Both products are well represented in UK public sector and higher education web estates - TYPO3 particularly so in European and UK local government and university sites, and Roller in older self-hosted blog and publishing platforms that are often forgotten rather than maintained. The realistic UK exposure here is an unmaintained site on an unmonitored subdomain, which is also the hardest asset to find and the likeliest to be unpatched.\n\nConfidence and caveats. Confidence is low, and the reason is the exploitation evidence rather than the vulnerabilities. Both CVEs were published on 17 November 2026 and the version and fix details are reported consistently in outline. For Roller, sources conflict materially: one outlet quotes Apache stating active exploitation while an aggregator records no evidence of exploitation and notes absence from CISA KEV; a public proof of concept is listed, which is not confirmation. Fix versions conflict (6.1.5 versus 6.1.6). For TYPO3, the exploitation statement is attributed to the vendor advisory but neither the advisory nor Apache's security list was read directly in this environment. CVE-2026-119623 is poorly characterised in the sources reviewed. Nothing ties any of this to UK victims. Verify against the TYPO3 security advisories and the Apache security mailing list before citing exploitation to anyone.","recommended_actions":["Apache Roller: upgrade to 6.1.6 (or 6.1.5 if that is what your distribution ships as fixed - the sources conflict and either is better than 6.1.4), and verify the XML-RPC endpoint is closed afterwards rather than assuming the upgrade disabled it.","Apache Roller, if you cannot upgrade today: set enabledForExtensions to false in WEB-INF/web.xml, or remove the /roller-services/xmlrpc servlet mapping, and restart Roller. This removes the unauthenticated deserialization surface entirely, which is stronger than any filtering rule.","Re-check your Roller scope if you previously assessed CVE-2026-82384 and concluded you were unaffected. That identifier listed only 6.1.5; this one covers 4.0.0 through 6.1.4 and is reported to be the same flaw, so an earlier 'not applicable' may be wrong.","TYPO3: apply 14.3.12, 13.4.40 or 12.4.52 as appropriate. Treat it as urgent rather than routine if your TYPO3 site runs public-facing forms that accept file uploads - benefit claims, planning objections, complaints, safeguarding referrals, job applications - because what the flaw discloses in that case is other people's uploaded documents, not a path.","If you run such forms on an unpatched TYPO3 instance, consider whether a UK GDPR assessment is required rather than only a patch. The vendor states the flaw is known to be actively exploited, and the exposed material is documents uploaded by members of the public.","Ask the generalisable question across the whole estate, once: which legacy XML, SOAP, XML-RPC and remote API endpoints are enabled on applications we run, and does anyone use them? This is the same question rank 2 forces about Confluence's Remote API. The answer is almost always 'nobody', and disabling them is faster than patching and survives the next flaw in the same code.","Find the unmaintained sites first, because they are the realistic UK exposure: a forgotten Roller or TYPO3 instance on an unmonitored subdomain, outside the patching process and outside monitoring. Enumerate subdomains and fingerprint what is running on them rather than relying on the asset register.","Do not repeat the exploitation claims as settled. Both come from vendor advisories relayed through secondary reporting, one aggregator records no exploitation evidence for Roller, and neither CVE is in CISA KEV. Verify against the TYPO3 security advisories and the Apache security mailing list before citing exploitation in a change request or a board update."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"Requests to the Apache Roller XML-RPC endpoint","description":"Primary detection for CVE-2026-129448. On an instance with no legitimate XML-RPC consumers, any request here is suspicious.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where isnotempty(RequestURL)\n| where RequestURL has_any (\"/roller-services/xmlrpc\", \"roller-services\", \"/xmlrpc\", \"xmlrpc.php\")\n| extend IsExternal = not(ipv4_is_private(SourceIP))\n| summarize Requests = count(), Sources = dcount(SourceIP), Methods = make_set(RequestMethod, 5), Allowed = countif(DeviceAction !has \"deny\" and DeviceAction !has \"block\") by DestinationHostName, RequestURL, IsExternal\n| order by Requests desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Java deserialization gadget markers in request bodies and URLs","description":"Looks for serialized-object markers associated with deserialization exploitation. Depends on your perimeter logging request content; many devices do not.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| extend Payload = strcat(tostring(RequestURL), \" \", tostring(Message), \" \", tostring(AdditionalExtensions))\n| where Payload has_any (\"rO0AB\", \"aced0005\", \"java.lang.ProcessBuilder\", \"javax.management\", \"org.apache.commons.collections\", \"InvokerTransformer\", \"TemplatesImpl\", \"ysoserial\")\n| project TimeGenerated, SourceIP, DestinationHostName, RequestURL, DeviceAction, DeviceProduct, Payload\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Post-exploitation on Roller and TYPO3 hosts","description":"The detection that matters for both halves of this bundle: a web application process spawning a shell or a download utility.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-11-10)\n| where InitiatingProcessFileName in~ (\"java\", \"java.exe\", \"httpd\", \"apache2\", \"nginx\", \"php-fpm\", \"php\", \"php.exe\", \"tomcat.exe\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"cmd.exe\", \"powershell.exe\", \"curl\", \"wget\", \"python\", \"python3\", \"perl\", \"nc\", \"ncat\", \"base64\", \"chmod\", \"whoami\", \"id\")\n| project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"TYPO3 form upload path enumeration (CVE-2026-125160)","description":"The exploitation pattern is learning an upload sub-folder path from an error message, then requesting files directly. This looks for direct requests into TYPO3 upload directories.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where isnotempty(RequestURL)\n| where RequestURL has_any (\"/fileadmin/\", \"/uploads/\", \"form_upload\", \"typo3temp\", \"/user_upload/\")\n| extend IsExternal = not(ipv4_is_private(SourceIP))\n| where IsExternal\n| summarize Requests = count(), DistinctPaths = dcount(RequestURL), Paths = make_set(RequestURL, 25) by SourceIP, DestinationHostName\n| where DistinctPaths > 5\n| order by DistinctPaths desc"},{"platform":"sentinel","table":"Syslog","name":"Verbose application errors that leak upload paths","description":"The root cause of CVE-2026-125160 is an error message disclosing an unguessable path. Finding those messages in your own logs tells you whether the leak occurred.","query":"Syslog\n| where TimeGenerated > ago(30d)\n| where SyslogMessage has_any (\"TYPO3\", \"typo3\", \"Form Framework\", \"FileUpload\", \"ImageUpload\")\n| where SyslogMessage has_any (\"fileadmin\", \"user_upload\", \"typo3temp\", \"Exception\", \"not allowed\", \"invalid file\")\n| project TimeGenerated, Computer, ProcessName, SeverityLevel, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Web shell drops in CMS web roots","description":"Covers both products. Tune the folder list to your own document roots and CMS layout.","query":"DeviceFileEvents\n| where Timestamp > datetime(2026-11-10)\n| where FolderPath has_any (\"/var/www\", \"htdocs\", \"fileadmin\", \"typo3conf\", \"roller\", \"WEB-INF\", \"webapps\", \"public_html\")\n| where ActionType in (\"FileCreated\", \"FileModified\")\n| where FileName endswith \".php\" or FileName endswith \".jsp\" or FileName endswith \".jspx\" or FileName endswith \".phtml\" or FileName endswith \".sh\"\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, SHA256, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Estate-wide legacy XML and remote API endpoint inventory","description":"Implements the generalisable action across ranks 2 and 9: find every legacy XML, SOAP, XML-RPC and remote API endpoint that is still answering, so you can disable the ones nobody uses.","query":"let LegacyEndpoints = dynamic([\"/xmlrpc\", \"xmlrpc.php\", \"/roller-services\", \"soap-axis1\", \"/services/\", \"/rpc/\", \"/axis\", \"/axis2\", \"?wsdl\", \"/soap\", \"/SOAP\", \"/remoting/\", \"/jmx-console\", \"/invoker/\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where isnotempty(RequestURL)\n| where RequestURL has_any (LegacyEndpoints)\n| summarize Requests = count(), Sources = dcount(SourceIP), ExternalSources = dcountif(SourceIP, not(ipv4_is_private(SourceIP))), Paths = make_set(RequestURL, 15) by DestinationHostName, DestinationIP\n| order by ExternalSources desc, Requests desc"}],"iocs":[{"type":"uri_path","value":"/roller-services/xmlrpc","context":"The vulnerable Apache Roller XML-RPC endpoint for CVE-2026-129448. Both the hunt target and the mitigation target - removing this servlet mapping closes the unauthenticated deserialization surface.","confidence":"high","source":"Apache Roller advisory via secondary reporting"},{"type":"ttp","value":"Unauthenticated deserialization of untrusted data via a legacy XML-RPC endpoint left enabled by default","context":"The same failure mode as the Confluence Apache Axis flaw at rank 2: a legacy structured-input endpoint, enabled by default, reachable without authentication, that almost nobody uses.","confidence":"high","source":"Apache Roller advisory via secondary reporting"},{"type":"note","value":"APACHE ROLLER: affected 4.0.0 through 6.1.4; fix reported as 6.1.6 (some sources say 6.1.5)","context":"6.1.6 is reported to disable extension types and reject XML-RPC requests when the feature is off. The version conflict is unresolved in the sources reviewed; either reported fix is better than 6.1.4.","confidence":"medium","source":"conflicting secondary sources"},{"type":"note","value":"APACHE ROLLER WORKAROUND: set enabledForExtensions to false in WEB-INF/web.xml, or remove the /roller-services/xmlrpc servlet mapping, then restart Roller","context":"The control to apply where upgrading cannot happen today. It removes the surface rather than filtering access to it.","confidence":"medium","source":"Apache Roller advisory via secondary reporting"},{"type":"note","value":"IDENTIFIER DUPLICATION: CVE-2026-129448 is reported to be the same flaw as CVE-2026-82384, which listed only Roller 6.1.5 as affected","context":"If you assessed the earlier identifier and concluded you were out of scope on a 6.1.x build, that assessment may be wrong - the new identifier covers 4.0.0 through 6.1.4.","confidence":"medium","source":"OpenCVE and secondary reporting"},{"type":"note","value":"TYPO3 CVE-2026-125160: Form Framework information disclosure, CVSS 6.3; vendor advisory states it is known to be actively exploited","context":"Error messages leaked the unguessable upload sub-folder path, which stays constant for the whole form session, letting an attacker determine the public URL of files uploaded through the form.","confidence":"medium","source":"TYPO3 advisory via secondary reporting"},{"type":"note","value":"TYPO3 FIXED VERSIONS: 14.3.12, 13.4.40, 12.4.52 and corresponding older branches","context":"Also covers CVE-2026-119623, reported at CVSS 9.4 and described as enabling remote code execution, which is poorly characterised in the sources reviewed and is best treated as a second reason to take the same update.","confidence":"medium","source":"TYPO3 advisory and secondary reporting"},{"type":"behaviour","value":"Direct requests into TYPO3 upload directories (/fileadmin/, /user_upload/, typo3temp) from external sources enumerating many distinct paths","context":"The exploitation pattern for CVE-2026-125160: learn the path from a leaked error message, then fetch the files. Many distinct paths from one external source is the signal.","confidence":"medium","source":"analyst assessment based on the described flaw"},{"type":"behaviour","value":"Verbose application error messages that disclose upload paths","context":"The root cause rather than the exploit. Finding these in your own logs tells you whether the leak actually occurred on your instance, which is the evidence a UK GDPR assessment would need.","confidence":"medium","source":"analyst assessment"},{"type":"note","value":"CONSEQUENCE, NOT CVSS: a 6.3 information disclosure that exposes documents uploaded by the public through council, NHS or university web forms","context":"UK public sector TYPO3 sites use FileUpload and ImageUpload forms for benefit claims, planning objections, complaints, safeguarding referrals and job applications, with identity documents and medical evidence attached. In that context the flaw discloses other people's documents.","confidence":"high","source":"analyst assessment"},{"type":"note","value":"EXPLOITATION EVIDENCE CONFLICTS FOR APACHE ROLLER","context":"One outlet quotes Apache stating the issue is being actively exploited; an aggregator records no evidence of exploitation and notes absence from CISA KEV. A public proof of concept is listed on Sploitus, which is not confirmation. Verify against the Apache security mailing list before citing exploitation.","confidence":"low","source":"conflicting secondary sources"},{"type":"note","value":"GENERALISABLE ACTION: inventory and disable legacy XML, SOAP, XML-RPC and remote API endpoints estate-wide","context":"The single durable control spanning ranks 2 and 9. These surfaces predate the current product, stay enabled by default, and are almost never used. Disabling them is faster than patching and survives the next flaw in the same code.","confidence":"high","source":"analyst assessment"}],"references":["https://securityonline.info/apache-roller-vulnerability-cve-2026-129448/","https://securityonline.info/typo3-vulnerability-cve-2026-125160-exploited/","https://app.opencve.io/cve/CVE-2026-129448","https://radar.offseq.com/threat/cve-2026-129448-cwe-502-deserialization-of-untrusted-data-in-apache-software-foundation-apache-roller-2cdd99c303274063","https://www.strix.ai/cve/CVE-2026-125160","https://www.openwall.com/lists/oss-security/","https://securityonline.info/category/news/vulnerability-report/"]},{"rank":10,"id":"TI-2026-11-17-003","title":"UK Government: Commons Consideration of Lords Amendments to the Cyber Security and Resilience Bill Is Expected on 24 November - Six Days Away - but This Feed Can No Longer Confirm That Date From an Official Source, and Corrects Yesterday's Entry Which Said It Could","cve_ids":[],"vendor":"UK Parliament; DSIT; Cabinet Office; NCSC; House of Lords National Resilience Committee","affected_products":["Cyber Security and Resilience (Network and Information Systems) Bill, Bill 4035 - Commons consideration of Lords amendments expected 24 November 2026","Bill 175 2026-27 (Lords Amendments), published 3 November 2026","Operators of essential services, digital service providers, data centres, managed service providers and designated critical suppliers that will fall in or near the Bill's scope","UK central government, local government and devolved administration resilience planning, per the Lords National Resilience Committee report of 16 November 2026"],"category":"incident","cvss_v3":null,"severity":"informational","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-16","last_updated":"2026-11-18","confidence":"low","summary":"This entry is carried at rank 10 for one reason and one reason only: a legislative stage that changes who has to report cyber incidents to whom is expected six days from now, and organisations that will be in scope have those six days to finish the evidence work. It also carries a correction, which is the more important part.\n\nThe correction. Yesterday's run stated that 24 November 2026 was 'confirmed on UK Parliament's own bills pages' as the date for Commons consideration of Lords amendments. That overstated the source. On re-checking in this window, the 24 November date is traceable only to a commercial Bill-tracking site, which itself labels it as a position 'as at 13 November', and an earlier page on that same site said no Commons sitting date had been announced. No official UK Parliament page confirming 24 November was located in this run. The date is plausible and is the best available, and it is not confirmed. This feed has now had to correct its account of this Bill's progress twice - on 14 November and again today - which is itself a useful signal about how reliable third-party legislative trackers are for compliance planning.\n\nWhat is officially established, and should be used in preference to the date. The Lords completed third reading on 2 November 2026, agreeing four government amendments mainly to align language and clarify the definition of a 'regulated person'. Bill 175 2026-27 (Lords Amendments) was published on 3 November 2026. At Lords report stage there were three divisions: members agreed two amendments - one requiring a review of the NIS scheme within twelve months, and one establishing a register of state actors posing a threat to UK cyber security - and disagreed a third, which would have required reporting of incidents involving frontier AI models. Those two agreed amendments are the Government defeats that the Commons will be asked to overturn or accept, so they are the substance of whatever happens on the 24th.\n\nAmendment counts in circulation are unreliable and should be avoided. UK Parliament's own report records three divisions and two agreed amendments at report stage. A commercial tracker reports '103 amendments agreed; three divisions at report stage' while elsewhere referring to two Lords amendments, which is internally inconsistent; another source refers to 5 of 193 amendments agreed at committee stage. If you need a number for a briefing, cite the official report-stage outcome - two agreed, one disagreed, three divisions - and nothing else.\n\nThe policy context from the window above it. The House of Lords National Resilience Committee published 'Are we ready? Building a culture of resilience' on 16 November, concluding the UK is seriously underprepared for catastrophic risks including cyber attacks, finding that resilience plans are largely outdated and do not prepare central or local government for concurrent crises, and describing the Bill as providing 'useful baseline requirements' with limited scope. That double-edged assessment is the argument anyone seeking to widen the Bill's scope will use in the Commons debate. It sits alongside the NCSC's 3 November annual review, in which Richard Horne warned of 'a real prospect of an unprecedented rise in the number of cyber incidents' and the agency recorded 1,831 attack reports, 337 supported incidents and 80 classed as nationally significant over the year to 31 August 2026.\n\nWhat a security team should do with six days and no confirmed date. Two things, neither of which depends on the date being right. First, finish and date the asset and supplier inventory if you are, or will be, in scope - operator of essential services, digital service provider, data centre, managed service provider or designated critical supplier. The inventory is required under every version of the Bill and is the evidence that will be asked for, so the work is not wasted whatever happens on the 24th. Second, test the concurrency assumption the Committee criticised: walk one scenario in which a cyber incident runs at the same time as a second disruption and identify which named individuals appear in both response structures. Those people are single points of failure, and the Committee has just said at national level that assuming their availability is unsafe.\n\nConfidence and caveats. Confidence is low, downgraded from medium, and the downgrade is entirely about provenance rather than substance. Nothing here was read at source: no Parliament page, no Hansard record, no Committee report was fetched in this environment. The 24 November date rests on a commercial tracker. Secondary accounts of the earlier Commons report stage still conflict - one says the Bill passed without division, another says three amendments were defeated on division - and Hansard should be checked before either is repeated. Quoted phrases attributed to the Committee and to the Cabinet Office come from press coverage. This entry carries no indicators, no patch and no exploitation, is rated informational, and should not be escalated as threat intelligence. Verify the date and the amendment position against bills.parliament.uk for Bill 4035 and against the Commons order paper before briefing anyone.","recommended_actions":["Verify the 24 November date yourself against bills.parliament.uk for Bill 4035 and against the Commons order paper before putting it in any plan, paper or briefing. This feed asserted it was officially confirmed yesterday and is correcting that today; it is traceable only to a commercial tracker.","If you are, or will be, in scope of the Bill - operator of essential services, digital service provider, data centre, managed service provider or designated critical supplier - finish and date the asset and supplier inventory this week. It is required under every version of the Bill and is the evidence that will be asked for, so the work holds whatever happens on the 24th.","Brief stakeholders on the two agreed Lords amendments rather than on amendment counts, because those two are the substance of the Commons stage: a review of the NIS scheme within twelve months, and a register of state actors posing a threat to UK cyber security. Both are Government defeats from report stage.","Note that reporting of incidents involving frontier AI models was voted on at Lords report stage and disagreed. If your organisation's planning assumed an AI incident-reporting duty was coming in this Bill, that assumption is currently wrong, though it may return in the Commons.","Test the concurrency assumption in your own incident response plan, which is the Lords National Resilience Committee's substantive finding. Walk one scenario where a cyber incident runs simultaneously with a second disruption and identify which named individuals appear in both response structures. Those people are your single points of failure and they are invisible in most plans.","Prepare a short, honest answer to 'are we prepared', because the political context makes it likely to be asked. Two or three sentences with dates: when the plan was last exercised, what the exercise found, and which recommendations remain open. An assurance return written in the week it is demanded is always worse than one written now.","Read the Committee's recommendations as a forecast of structure rather than of technique. A dedicated resilience minister, a permanent-secretary-level chief resilience officer and an annual prime ministerial resilience statement would each change who asks you for data and how often. Plan for the reporting load, not for new technical controls.","Do not treat this entry as actionable threat intelligence. It is informational, carries no indicators, and the inventory-oriented queries exist only because the Bill's evidence requirements make asset and supplier visibility the thing most organisations will be asked to demonstrate."],"kql":[{"platform":"defender_xdr","table":"DeviceInfo","name":"Asset inventory baseline for Bill evidence (completeness and coverage)","description":"The Bill's evidence requirements start with knowing what you have. This produces a dated coverage picture, including which assets are not onboarded to monitoring.","query":"DeviceInfo\n| where Timestamp > ago(7d)\n| summarize arg_max(Timestamp, *) by DeviceId\n| extend MonitoringState = case(OnboardingStatus == \"Onboarded\", \"monitored\", \"NOT MONITORED\")\n| summarize Devices = count(), Examples = make_set(DeviceName, 15) by OSPlatform, DeviceType, MonitoringState, IsInternetFacing\n| order by MonitoringState asc, Devices desc"},{"platform":"defender_xdr","table":"DeviceInfo","name":"Internet-facing asset register (the subset regulators ask about first)","description":"Internet-facing assets are the population every regulatory conversation starts with. Export and date this list as evidence.","query":"DeviceInfo\n| where Timestamp > ago(7d)\n| summarize arg_max(Timestamp, *) by DeviceId\n| where IsInternetFacing == true\n| project DeviceName, DeviceId, OSPlatform, OSVersion, PublicIP, OnboardingStatus, DeviceType, LastSeenTime = Timestamp\n| order by DeviceName asc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Third-party and supplier connectivity inventory (supplier evidence)","description":"Supports the supplier inventory the Bill requires by showing which external parties actually connect to your estate, which is usually broader than the contract list.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where isnotempty(SourceIP)\n| extend IsExternal = not(ipv4_is_private(SourceIP))\n| where IsExternal\n| summarize Sessions = count(), Bytes = sum(todouble(SentBytes)) + sum(todouble(ReceivedBytes)), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Ports = make_set(DestinationPort, 10) by SourceIP, DestinationHostName\n| where Sessions > 50\n| order by Bytes desc"},{"platform":"sentinel","table":"SigninLogs","name":"External and guest identity access (managed service provider visibility)","description":"Managed service providers and designated critical suppliers reach your estate through identities as often as through networks. This enumerates them.","query":"SigninLogs\n| where TimeGenerated > ago(30d)\n| where UserType == \"Guest\" or UserPrincipalName has \"#EXT#\"\n| summarize Signins = count(), Apps = make_set(AppDisplayName, 15), Countries = make_set(tostring(LocationDetails.countryOrRegion), 10), LastSeen = max(TimeGenerated) by UserPrincipalName\n| order by Signins desc"}],"iocs":[{"type":"note","value":"THIS ENTRY CARRIES NO INDICATORS OF COMPROMISE AND IS NOT ACTIONABLE THREAT INTELLIGENCE","context":"Nothing here is exploited, patchable or detectable. It is rated informational and carries a deliberately minimal indicator and KQL set. It is ranked tenth because the brief this feed serves is UK government first, not because it is urgent.","confidence":"high","source":"analyst assessment"},{"type":"note","value":"CORRECTION TO THE 17 NOVEMBER RUN: this feed stated 24 November 2026 was 'confirmed on UK Parliament's own bills pages'. It is not.","context":"On re-checking, the date is traceable only to a commercial Bill-tracking site which labels it a position 'as at 13 November', and an earlier page on the same site said no Commons sitting date had been announced. No official Parliament page confirming 24 November was located. This is the second correction this feed has made to its account of this Bill's progress.","confidence":"high","source":"collection note"},{"type":"note","value":"OFFICIALLY ESTABLISHED: Lords third reading completed 2 November 2026 with four government amendments agreed; Bill 175 2026-27 (Lords Amendments) published 3 November 2026","context":"The four third-reading amendments were mainly to align language and clarify the definition of a 'regulated person'. Use these facts rather than the sitting date, because they are attested by UK Parliament's own publications.","confidence":"medium","source":"UK Parliament publications via secondary reporting"},{"type":"note","value":"THE TWO AGREED LORDS AMENDMENTS: a review of the NIS scheme within twelve months, and a register of state actors posing a threat to UK cyber security","context":"Both are Government defeats from report stage and are the substance of the Commons stage. Brief on these rather than on amendment counts.","confidence":"medium","source":"UK Parliament report of Lords report stage via secondary reporting"},{"type":"note","value":"DISAGREED AT LO o concurrent response structures at once","related_entry":"TI-2026-11-17-003","related_cves":[],"confidence":"high"}],"domain":[{"value":"1688360.cc","related_entry":"TI-2026-11-17-001","related_cves":[],"confidence":"medium"},{"value":"5vobauua3ojpklx.icu","related_entry":"TI-2026-11-17-001","related_cves":[],"confidence":"medium"},{"value":"eil786npto9u5bq.icu","related_entry":"TI-2026-11-17-001","related_cves":[],"confidence":"medium"},{"value":"webshell.lol","related_entry":"TI-2026-11-17-001","related_cves":[],"confidence":"medium"}],"malware":[{"value":"4EverAble2Shell","related_entry":"TI-2026-11-17-002","related_cves":["CVE-2026-90436"],"confidence":"medium"},{"value":"OPTIMJACK","related_entry":"TI-2026-11-17-001","related_cves":[],"confidence":"medium"}],"port":[{"value":"8140","related_entry":"TI-2026-11-18-002","related_cves":["CVE-2026-115731"],"confidence":"high"}],"ttp":[{"value":"Pre-authentication reach of the Base64 decode path via credential, token and attachment parsing","related_entry":"TI-2026-11-18-001","related_cves":["CVE-2026-114938"],"confidence":"medium"},{"value":"Unauthenticated SOAP request to an embedded end-of-life Apache Axis 1.x library reachable through a product's legacy remote API","related_entry":"TI-2026-11-17-002","related_cves":["CVE-2026-90436"],"confidence":"high"},{"value":"Deserialization of untrusted data on a configuration-management control plane, authenticated by any CA-signed agent certificate","related_entry":"TI-2026-11-18-002","related_cves":["CVE-2026-115731"],"confidence":"high"},{"value":"Trust inversion - a managed agent executing code on the server that is supposed to manage it","related_entry":"TI-2026-11-18-002","related_cves":["CVE-2026-115731"],"confidence":"high"},{"value":"'Unclaimed tax repayment' lure combining a malicious attachment with a fake GOV.UK page","related_entry":"TI-2026-11-18-003","related_cves":[],"confidence":"medium"},{"value":"Outage-chained credential phishing: messages posing as Microsoft, prompted by the 12-13 November 2026 Microsoft outage, asking for HMRC login details","related_entry":"TI-2026-11-18-003","related_cves":[],"confidence":"low"},{"value":"Malicious JavaScript written into a SaaS experimentation platform's per-customer project field, served from the vendor CDN inside the customer's own trusted snippet","related_entry":"TI-2026-11-17-001","related_cves":[],"confidence":"high"},{"value":"Abuse of a SaaS account signup flow to obtain write access to other tenants' projects","related_entry":"TI-2026-11-17-001","related_cves":[],"confidence":"medium"},{"value":"Kapibala - actor tracked by GreyNoise, assessed as Chinese-speaking, exploiting Zyxel GS1900 web management interfaces from a LAN-based or adjacent position","related_entry":"TI-2026-11-11-004","related_cves":["CVE-2026-102895","CVE-2026-107441","CVE-2026-111560","CVE-2026-114713","CVE-2026-115731","CVE-2026-116606","CVE-2026-118527","CVE-2026-123039","CVE-2026-123158","CVE-2026-124194","CVE-2026-125350","CVE-2026-19868","CVE-2026-20320","CVE-2026-7273"],"confidence":"medium"},{"value":"'n0n' - extortion group that emerged mid-September 2026, with disputed use of encryption and unreliable victim accounting","related_entry":"TI-2026-11-18-005","related_cves":[],"confidence":"low"},{"value":"Unauthenticated deserialization of untrusted data via a legacy XML-RPC endpoint left enabled by default","related_entry":"TI-2026-11-18-006","related_cves":["CVE-2026-129448","CVE-2026-125160","CVE-2026-119623","CVE-2026-82384"],"confidence":"high"}],"uri_path":[{"value":"/plugins/servlet/soap-axis1/confluenceservice-v2","related_entry":"TI-2026-11-17-002","related_cves":["CVE-2026-90436"],"confidence":"high"},{"value":"/plugins/servlet/soap-axis1","related_entry":"TI-2026-11-17-002","related_cves":["CVE-2026-90436"],"confidence":"high"},{"value":"/rpc/xmlrpc","related_entry":"TI-2026-11-17-002","related_cves":["CVE-2026-90436"],"confidence":"medium"},{"value":"/track.js","related_entry":" ovember; downstream JDKs were reported as lagging, so where there is no patch use -XX:-UseBASE64Intrinsics on x86-64. Count the JDKs inside appliances and container images, not just the ones in your software register. ARM64 and CPUs without AVX-512 VBMI are reported out of scope - check /proc/cpuinfo before escalating. (2) IN THE SAME WINDOW, ON THE SAME HOSTS, CLOSE CVE-2026-90436: disable Confluence's Remote API (XML-RPC & SOAP) - no restart needed - and confirm /plugins/servlet/soap-axis1/confluenceservice-v2 returns 403, then upgrade to Confluence Data Center 9.2.28. This one IS being exploited at scale: approximately 40,000 attempts from 600+ IPs in three days. Assume compromise, not exposure, for any instance reachable during 13-18 November, and search the pages for stored credentials before anything else. (3) PATCH SONICWALL BY FRIDAY 20 NOVEMBER - CVE-2026-19868 bypasses SAML-enforced MFA on SSLVPN and SonicWall states there is no workaround. Then Chrome, Outlook, Cisco BroadWorks and Openwave by Monday 24 November, and Puppet Enterprise CVE-2026-115731 by 1 December (patch, then revoke the agent certificates of decommissioned hosts - any CA-signed agent certificate is the whole prerequisite). (4) RE-OPEN THE ZYXEL TICKET YOU CLOSED. CISA's KEV entry names CVE-2026-7273; Binarly showed the exploited flaw is CVE-2026-107441. If you patched to the June firmware because KEV said so, you are still vulnerable and your remediation record says otherwise - go to firmware 2.90 Patch 3, isolate switch management interfaces and rotate device passwords, because hashed root credentials were taken. (5) IF YOU HOLD CONSUMER ACCOUNTS, INVALIDATE OUTSTANDING PASSWORD-RECOVERY TOKENS NOW, without waiting for the Debenhams claim to be confirmed. 8,530 recovery codes paired with email addresses is an account-takeover set, Black Friday traffic will hide the fraud, and the remediation is cheap. Alert on recovery followed immediately by a delivery-address change - that sequence is the fraud, not the login. And one thing to stop doing: if your Content Security Policy blocks third-party script sources but permits unsafe-eval or unsafe-inline, it did not protect HSBC and it will not protect you - the OPTIMJACK attacker shipped an inline eval fallback specifically for defenders who block the domain."}}</script>
