//threatdefence.com/article/barracuda-esg-cve-2026-116606-patching-hunting","https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog"]},{"rank":6,"id":"TI-2026-11-11-007","title":"KEV Deadlines Bite Today and Tomorrow: 9 November Batch Due 12 November (OpenSSH 'SSHole' Exploitation Accelerating, GPUStack, FreeSWITCH, IBM Aspera Faspex) and Ivanti Connect Secure CVE-2026-118527 Due 13 November","cve_ids":["CVE-2026-123158","CVE-2026-102895","CVE-2026-116779","CVE-2026-123218","CVE-2026-118527","CVE-2026-111357","CVE-2026-104935"],"vendor":"Multiple (OpenBSD, GPUStack, SignalWire, IBM, Ivanti)","affected_products":["OpenSSH before 10.6p2 on Linux using musl libc without PAM (Alpine Linux default configuration)","GPUStack (authentication flaw, CVE-2026-102895)","SignalWire FreeSWITCH (code injection, CVE-2026-116779)","IBM Aspera Faspex (authorisation flaw, CVE-2026-123218) - note container-image remediation gap","Ivanti Connect Secure 25.1.1.2 and prior, 25.1.2.2 and prior, 22.8R2.5 and prior"],"category":"vulnerability_bundle","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-12","patch_available":"partial","first_reported":"2026-11-09","last_updated":"2026-11-12","confidence":"medium","summary":"UK government and UK corporate - cross-cutting compliance and exposure bundle. Two KEV deadlines fall inside and immediately after this window. The 9 November batch is due TODAY, 12 November: GPUStack CVE-2026-102895 (authentication flaw), SignalWire FreeSWITCH CVE-2026-116779 (code injection), OpenBSD OpenSSH CVE-2026-123158, and IBM Aspera Faspex CVE-2026-123218 (authorisation flaw). The Ivanti Connect Secure chain's remaining deadline, CVE-2026-118527, falls tomorrow, 13 November. The OpenSSH item - dubbed 'SSHole' - is where exploitation is escalating fastest and deserves the attention. GreyNoise recorded the first successful in-the-wild exploitation on 7 November, roughly 40 hours after the fix in OpenSSH 10.6p2 shipped, and logged 16 successful exploitation chains from six source IPs against protected networks. Previdian reports its first exploitation attempt arriving less than nine hours after CVE publication and confirmed root access on an Alpine Linux honeypot, counting 20 attempts from 13 attacker IPs across nine countries. watchTowr tied observed activity to botnet and cryptomining operations on 6 November, and reporting also describes attempts to install a Python-based backdoor. The critical scoping condition keeps this from being universal: the bug affects OpenSSH before 10.6p2 on Linux systems using musl libc WITHOUT PAM - which is Alpine's default - and exploitation requires specific account conditions, with accounts holding valid password hashes not affected. In practice that points at container images and appliance firmware far more than at mainstream Ubuntu, RHEL or Debian hosts: Alpine is the default base for an enormous share of UK public-sector and corporate container estates, and a container image is exactly the asset class that OS patch compliance reporting does not cover. The same pattern applies to IBM Aspera Faspex, where a container-image remediation gap was noted in the previous run, and Aspera Faspex is used for large-file transfer in UK research, healthcare and media organisations. On Ivanti, Volexity attributes a chain of CVE-2026-104935 (authentication bypass) with CVE-2026-111357 and CVE-2026-118527 to actor UTA0576, achieving unauthenticated root on fully patched appliances from 3 October and then stealing credentials and querying Active Directory for LAPS passwords and BitLocker recovery keys - a post-exploitation objective that turns a VPN compromise into domain-wide exposure. Fixes are in 25.1.1.3 and 22.8R2.6; the 13 October release addressed only CVE-2026-104935, so organisations that patched then are not covered. CISA warns that Ivanti's Integrity Checker Tool may not detect CVE-2026-104935 exploitation because attacker commands execute in memory, so compromise assessment needs network and memory forensics, not the vendor tool alone. Detail is from search-result summaries; cisa.gov was not retrievable from this environment and sources disagree on some CVSS values, affected versions and the local-versus-remote precondition for CVE-2026-118527.","recommended_actions":["OpenSSH: identify every Alpine-based container image and musl-libc host in your estate and rebuild or patch to OpenSSH 10.6p2 or later. Scan image registries, not just running hosts - a vulnerable base image will keep redeploying the flaw.","OpenSSH scoping: confirm the PAM condition before mass action. Systems using musl libc WITHOUT PAM are affected; accounts with valid password hashes are not exploitable. Use this to triage rather than to dismiss.","OpenSSH hunting: treat any successful SSH authentication for an account that should have no working password as an incident, and hunt for cryptominer and Python-backdoor persistence on exposed Alpine hosts given the botnet and mining activity reported.","Ivanti Connect Secure: upgrade to 25.1.1.3 or 22.8R2.6 before the 13 November deadline. If you patched on 13 October you addressed only CVE-2026-104935 and remain exposed to CVE-2026-111357 and CVE-2026-118527.","Ivanti compromise assessment: do not rely on the Integrity Checker Tool - CISA states it may miss CVE-2026-104935 exploitation because commands run in memory. Use network telemetry, memory capture and credential-abuse hunting instead.","Ivanti blast radius: assume credential theft on any appliance exposed since 3 October. Rotate VPN and service-account credentials, and treat LAPS passwords and BitLocker recovery keys as compromised - rotate LAPS and re-escrow BitLocker keys.","IBM Aspera Faspex: patch CVE-2026-123218 and verify container-image coverage specifically, as the container distribution lags the appliance fix.","GPUStack and FreeSWITCH: inventory these in research, AI/ML and telephony estates - both are commonly deployed outside central IT visibility. FreeSWITCH underpins UK contact-centre and VoIP platforms.","Record and evidence remediation against the KEV dates (12 and 13 November). UK organisations are not bound by BOD 26-04 but regulators and insurers increasingly treat KEV dates as the reasonableness benchmark."],"kql":[{"platform":"defender_xdr","table":"DeviceLogonEvents","name":"Successful SSH logon to a Linux host for an account that should have no usable password (SSHole)","description":"Untested. CVE-2026-123158 bypasses password authentication for accounts without a valid password hash, so a successful remote interactive logon for a service or locked account is the signal. Narrow the account list to your own system accounts before alerting.","query":"let LikelyNoPasswordAccounts = dynamic([\"nobody\", \"daemon\", \"bin\", \"sys\", \"sync\", \"games\", \"man\", \"lp\", \"mail\", \"news\", \"uucp\", \"proxy\", \"www-data\", \"backup\", \"list\", \"irc\", \"gnats\", \"nginx\", \"apache\", \"postgres\", \"mysql\", \"redis\", \"node\", \"app\"]);\nDeviceLogonEvents\n| where Timestamp > ago(30d)\n| where DeviceName !has \"windows\"\n| where ActionType == \"LogonSuccess\"\n| where LogonType in~ (\"Network\", \"Remote interactive\", \"Interactive\")\n| where AccountName in~ (LikelyNoPasswordAccounts) or AccountName == \"root\"\n| where isnotempty(RemoteIP) and not(ipv4_is_private(RemoteIP))\n| project Timestamp, DeviceName, AccountName, RemoteIP, LogonType, InitiatingProcessFileName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Cryptominer, botnet and Python-backdoor persistence following SSH compromise","description":"Untested. Matches the reported post-exploitation activity (botnet, cryptomining, Python-based backdoor). Looks for mining binaries, pool references, and interpreter processes parented by sshd.","query":"let MinerMarkers = dynamic([\"xmrig\", \"minerd\", \"cpuminer\", \"stratum+tcp\", \"--donate-level\", \"nicehash\", \"monero\", \"pool.minexmr\", \"supportxmr\", \"c3pool\"]);\nDeviceProcessEvents\n| where Timestamp > ago(30d)\n| where ProcessCommandLine has_any (MinerMarkers)\n      or (InitiatingProcessFileName =~ \"sshd\" and FileName in~ (\"python\", \"python3\", \"perl\", \"curl\", \"wget\", \"nc\", \"ncat\", \"socat\", \"base64\", \"chmod\"))\n| project Timestamp, DeviceName, Parent = InitiatingProcessFileName, Child = FileName, CommandLine = ProcessCommandLine, Account = AccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"KEV exposure across the 9 November batch and the Ivanti chain","description":"Untested. Compliance view against the 12 and 13 November deadlines. Note that container images and appliance firmware are generally invisible to TVM, so an empty result does not mean an unexposed estate - particularly for the Alpine/musl OpenSSH condition.","query":"let KevSet = dynamic([\"CVE-2026-123158\", \"CVE-2026-102895\", \"CVE-2026-116779\", \"CVE-2026-123218\", \"CVE-2026-104935\", \"CVE-2026-111357\", \"CVE-2026-118527\"]);\nDeviceTvmSoftwareVulnerabilities\n| where CveId in (KevSet)\n| summarize Devices = dcount(DeviceName), DeviceList = make_set(DeviceName, 50), Software = make_set(SoftwareName, 10) by CveId\n| extend KevDueDate = case(CveId in (\"CVE-2026-123158\", \"CVE-2026-102895\", \"CVE-2026-116779\", \"CVE-2026-123218\"), \"2026-11-12\", CveId == \"CVE-2026-118527\", \"2026-11-13\", CveId == \"CVE-2026-111357\", \"2026-11-02 (PASSED)\", \"2026-11-03 (PASSED)\")\n| order by Devices desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Ivanti Connect Secure - post-compromise credential and directory reconnaissance from the appliance","description":"Untested. UTA0576's reported objective was credential theft plus Active Directory queries for LAPS passwords and BitLocker keys. This flags the appliance initiating LDAP/SMB/Kerberos traffic to domain controllers beyond its normal authentication pattern. Replace the appliance IP list first.","query":"let VpnApplianceIPs = dynamic([\"REPLACE_WITH_YOUR_IVANTI_APPLIANCE_IPS\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(60d)\n| where SourceIP in (VpnApplianceIPs)\n| where DestinationPort in (389, 636, 3268, 3269, 445, 88, 464, 5985, 5986)\n| summarize Connections = count(), Ports = make_set(DestinationPort, 15), Destinations = make_set(DestinationIP, 25), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP, bin(TimeGenerated, 1d)\n| order by Connections desc"},{"platform":"sentinel","table":"SecurityEvent","name":"LAPS password and BitLocker recovery key reads (Ivanti post-exploitation objective)","description":"Untested. Directly targets the stated objective rather than the exploit. Directory-service reads of ms-Mcs-AdmPwd (LAPS) and msFVE-RecoveryPassword (BitLocker) should be rare and attributable; any read from an unexpected account or host is an incident. Requires directory-service access auditing to be enabled.","query":"SecurityEvent\n| where TimeGenerated > ago(60d)\n| where EventID in (4662, 5136)\n| where ObjectServer =~ \"DS\"\n| where AdditionalInfo has_any (\"ms-Mcs-AdmPwd\", \"msLAPS-Password\", \"msLAPS-EncryptedPassword\", \"msFVE-RecoveryPassword\", \"msFVE-RecoveryInformation\")\n| project TimeGenerated, Computer, SubjectUserName, SubjectDomainName, ObjectName, AccessMask, AdditionalInfo\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"The specific attacker IP values from GreyNoise (6 source IPs, 16 successful chains) and Previdian (13 IPs, 9 countries) were not published in accessible reporting and so cannot be listed here. GreyNoise's reported 27.5 million port-22 scan figure is general scanning volume, not confirmed exploitation of this CVE. Consult GreyNoise and Previdian directly for IP-level indicators.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-06/12"},{"type":"behaviour","value":"First successful in-the-wild OpenSSH CVE-2026-123158 exploitation recorded 7 November, approximately 40 hours after the 10.6p2 fix","context":"Exploitation timeline: the gap between fix and weaponisation was under two days. Treat patch SLAs for internet-facing SSH accordingly.","confidence":"medium","source":"GreyNoise (as relayed by Help Net Security, BleepingComputer)"},{"type":"behaviour","value":"16 successful exploitation chains from 6 source IPs (GreyNoise); 20 attempts from 13 IPs in 9 countries with confirmed root on an Alpine honeypot (Previdian)","context":"Independent corroboration from two vendors that exploitation is real, multi-actor and geographically distributed.","confidence":"medium","source":"GreyNoise / Previdian (as relayed)"},{"type":"behaviour","value":"OpenSSH flaw exploitable only on Linux using musl libc without PAM (Alpine default); accounts with valid password hashes are not affected","context":"The scoping condition that makes this a container-estate and appliance-firmware problem rather than a general Linux problem. Mainstream glibc distributions with PAM are out of scope.","confidence":"high","source":"SOCPrime / Help Net Security (as relayed)"},{"type":"malware","value":"Cryptomining and botnet payloads; Python-based backdoor","context":"Observed post-exploitation payloads following SSHole exploitation. Indicates opportunistic mass exploitation rather than targeted intrusion - but opportunistic access is sold on.","confidence":"medium","source":"watchTowr / press reporting (as relayed)"},{"type":"actor","value":"UTA0576","context":"Volexity-tracked actor chaining CVE-2026-104935 with CVE-2026-111357 and CVE-2026-118527 for unauthenticated root on fully patched Ivanti Connect Secure appliances from 3 October 2026.","confidence":"medium","source":"Volexity (as relayed by SecurityWeek, socradar.io)"},{"type":"ttp","value":"T1555.006 - Credentials from Password Stores: Cloud Secrets / directory-stored credentials (LAPS, BitLocker recovery keys)","context":"Reported Ivanti post-exploitation objective: querying Active Directory for LAPS passwords and BitLocker recovery keys, converting VPN compromise into domain-wide and endpoint-level access.","confidence":"medium","source":"Volexity (as relayed)"},{"type":"behaviour","value":"Ivanti Integrity Checker Tool may not detect CVE-2026-104935 exploitation because attacker commands execute in memory","context":"CISA guidance. A clean ICT result is not evidence of a clean appliance; network and memory forensics are required.","confidence":"medium","source":"CISA alert (as relayed)"},{"type":"behaviour","value":"Ivanti 13 October release fixed only CVE-2026-104935; the other two chain components require 25.1.1.3 or 22.8R2.6","context":"Patch-completeness trap: organisations that responded to the October KEV addition may believe they are remediated when they are not.","confidence":"medium","source":"SecurityWeek / Ivanti advisory (as relayed)"},{"type":"ttp","value":"T1133 - External Remote Services","context":"Both the OpenSSH and Ivanti items are internet-facing remote-access surfaces, the most consistently exploited initial-access class in the UK threat picture.","confidence":"high","source":"Analyst inference"},{"type":"port","value":"22","context":"SSH exposure surface for CVE-2026-123158. Restrict to management networks and bastion hosts; internet-exposed SSH on Alpine-based systems is the highest-risk configuration.","confidence":"high","source":"Analyst-derived detection logic"}],"references":["https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog","https://www.helpnetsecurity.com/2026/11/06/openssh-sshole-cve-2026-123158-exploitation/","https://www.bleepingcomputer.com/news/security/hackers-exploit-sshole-openssh-flaw-to-breach-linux-systems/","https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html","https://www.securityweek.com/ivanti-patches-two-more-zero-days-exploited-in-connect-secure-attack-chain/amp/","https://socradar.io/blog/ivanti-connect-secure-0day-root-access/","https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-urges-patching-newly-exploited-vulnerabilities-ivanti-connect-secure"]},{"rank":7,"id":"TI-2026-11-11-003","title":"Exploited Endpoint Zero-Days Still Open: Microsoft Outlook CVE-2026-124194 (NTLMv2 Leak, KEV Due 24 November) and Chrome/Chromium CVE-2026-125350 (libxslt Use-After-Free, Eighth Chrome Zero-Day of 2026)","cve_ids":["CVE-2026-124194","CVE-2026-125350","CVE-2026-110043","CVE-2026-110068","CVE-2026-111309"],"vendor":"Microsoft; Google","affected_products":["Microsoft Outlook / Microsoft 365 Apps / Office (patched via Office update channels, not Windows Update)","Google Chrome before 157.0.8103.50","Chromium-based browsers including Microsoft Edge (fix shipped)"],"category":"vulnerability_bundle","cvss_v3":6.5,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-24","patch_available":"yes","first_reported":"2026-11-10","last_updated":"2026-11-12","confidence":"high","summary":"UK government and UK corporate - cross-cutting endpoint exposure, carried from the previous run and consolidated. Both items remain actively exploited and both are near-universally deployed across UK central government, local authorities, NHS and UK corporates, which is why they stay in the top ten despite no new in-window development. (1) Microsoft Outlook CVE-2026-124194, the single exploited zero-day in the 10 November Patch Tuesday, is a spoofing and information-disclosure flaw: opening or previewing a crafted message file causes Outlook to reach out to an attacker-controlled location and leak the current user's NTLMv2 hash, which can be relayed to internal services or cracked offline. CVSS is only 6.5 and Microsoft assigns no critical rating, but exploited status plus total deployment makes it the highest-practical-priority Office patch. CISA added it to KEV on 10 November with a due date of 24 November 2026 - treat that as the outside limit rather than the target. The deployment trap persists: at least one outlet reports the fix arrives through the Office / Microsoft 365 Apps update channel rather than Windows Update, so estates patching only via WSUS or Windows Update may report compliant while remaining vulnerable. Verify Office build numbers, not OS patch level, and check Click-to-Run and MSI estates separately. This channel detail remains unconfirmed against Microsoft's own advisory. Three further Outlook remote-code-execution flaws rated critical shipped in the same release (CVE-2026-110043, CVE-2026-110068, CVE-2026-111309); none is reported as exploited, and all should go in the same change window. Patch Tuesday CVE totals continue to conflict across outlets (1,092 per Rapid7, 1,093 per Tenable, 1,094 per Splashtop and CSO, 1,235 per BleepingComputer, with 63-64 rated critical), so work from your own vulnerability-management feed rather than any headline number. (2) Google Chrome CVE-2026-125350 is a use-after-free in the XML/libxslt component, reported by an anonymous researcher on 6 November, with Google confirming an exploit exists in the wild and withholding attack detail. It affects Chrome before 157.0.8103.50 and is the eighth actively exploited Chrome zero-day of 2026, matching the full-year 2025 total. It was KEV-listed on 10 November. Chromium downstreams including Microsoft Edge have shipped fixes. Chrome updates only apply on relaunch, so a patched-but-unrestarted browser remains exploitable - force relaunch rather than relying on the update badge. Detail is from search-result summaries; msrc.microsoft.com and the Chrome releases blog were not retrievable from this environment.","recommended_actions":["Patch Outlook / Microsoft 365 Apps via the Office update channel now and confirm remediation by Office build number, not OS patch level. Audit Click-to-Run and MSI estates separately.","Block outbound SMB (TCP/445) and WebDAV from user workstations to the internet at the perimeter - this neutralises the NTLM-leak primitive even where patching lags, and is the single highest-value compensating control.","Enforce SMB signing and Extended Protection for Authentication on domain controllers, LDAP and internal services to defeat NTLM relay of any hash already captured.","Block NetNTLMv1, begin NTLM auditing, and plan Group Policy restriction of outbound NTLM to remote servers.","Disable the Outlook reading and preview pane for untrusted mail and force plain-text rendering where operationally tolerable until patching completes.","Hunt back 90 days for Outlook-initiated SMB or WebDAV connections to external hosts - exploitation predates the patch, so a clean patch state says nothing about prior compromise.","Apply CVE-2026-110043, CVE-2026-110068 and CVE-2026-111309 (critical Outlook RCE) in the same change window as the exploited flaw.","Force a Chrome relaunch to 157.0.8103.50 or later via policy (RelaunchNotification and RelaunchNotificationPeriod) rather than relying on users restarting; an updated binary with a stale running process is still exploitable.","Apply the equivalent Microsoft Edge and other Chromium-downstream updates, and confirm managed-browser fleets report actual running versions.","Treat the Outlook KEV date of 24 November as an outside limit. Both of these are exploited endpoint flaws in universally deployed software; a two-week window is not a target."],"kql":[{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outlook initiating SMB or WebDAV to an external host (CVE-2026-124194 NTLM leak)","description":"Untested. Core exploitation detection: outlook.exe should never make SMB connections to public IP space. Excludes RFC1918, CGNAT and link-local ranges.","query":"DeviceNetworkEvents\n| where Timestamp > ago(90d)\n| where InitiatingProcessFileName =~ \"outlook.exe\"\n| where RemotePort in (445, 139)\n| where isnotempty(RemoteIP)\n| where not(ipv4_is_private(RemoteIP)) and not(ipv4_is_in_any_range(RemoteIP, dynamic([\"100.64.0.0/10\", \"127.0.0.0/8\", \"169.254.0.0/16\"])))\n| project Timestamp, DeviceName, AccountName = InitiatingProcessAccountName, RemoteIP, RemoteUrl, RemotePort, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceEvents","name":"WebDAV fallback activity triggered from Outlook or Office processes","description":"Untested. Where SMB egress is blocked, forced authentication commonly falls back to WebDAV over HTTP(S) via the WebClient service. Two branches unioned: WebClient/named-pipe activity from Office processes, and Office processes referencing UNC or WebDAV paths. Baseline legitimate file shares first.","query":"let OfficeProcs = dynamic([\"outlook.exe\", \"winword.exe\", \"excel.exe\", \"powerpnt.exe\"]);\nlet WebDavMarkers = dynamic([\"@SSL\", \"DavWWWRoot\", \"http://\", \"https://\"]);\nlet OfficeWebClient =\n    DeviceEvents\n    | where Timestamp > ago(90d)\n    | where InitiatingProcessFileName in~ (OfficeProcs)\n    | where ActionType has_any (\"Service\", \"NamedPipe\") or tostring(AdditionalFields) has \"WebClient\"\n    | project Timestamp, DeviceName, Source = \"DeviceEvents\", ActionType, Process = InitiatingProcessFileName, Detail = strcat(FileName, \" | \", tostring(AdditionalFields)), Account = InitiatingProcessAccountName;\nlet OfficeUncChild =\n    DeviceProcessEvents\n    | where Timestamp > ago(90d)\n    | where InitiatingProcessFileName in~ (OfficeProcs)\n    | where ProcessCommandLine has @\"\\\\\" or ProcessCommandLine has_any (WebDavMarkers)\n    | project Timestamp, DeviceName, Source = \"DeviceProcessEvents\", ActionType = \"ProcessCreated\", Process = InitiatingProcessFileName, Detail = ProcessCommandLine, Account = InitiatingProcessAccountName;\nunion OfficeWebClient, OfficeUncChild\n| order by Timestamp desc"},{"platform":"sentinel","table":"SecurityEvent","name":"NTLM relay indicators - one account authenticating from many hosts in a short window","description":"Untested. Post-leak relay hunt on Windows Security event 4624 type 3 with NTLM. Noisy in large estates; scope to privileged accounts first and tune the SourceHosts threshold.","query":"SecurityEvent\n| where TimeGenerated > ago(30d)\n| where EventID == 4624 and LogonType == 3\n| where AuthenticationPackageName =~ \"NTLM\"\n| where TargetUserName !endswith \"$\" and TargetUserName !in~ (\"ANONYMOUS LOGON\", \"SYSTEM\")\n| summarize SourceHosts = dcount(IpAddress), Hosts = make_set(IpAddress, 25), Targets = make_set(Computer, 25), Logons = count() by TargetUserName, bin(TimeGenerated, 1h)\n| where SourceHosts >= 5\n| order by SourceHosts desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Chrome renderer sandbox escape indicators - unexpected children of the browser","description":"Untested. A use-after-free in libxslt yields renderer-process code execution; impact requires a follow-on escape. Flags non-browser children of chrome.exe/msedge.exe. Exclude your own managed browser helpers and installers.","query":"let Browsers = dynamic([\"chrome.exe\", \"msedge.exe\", \"brave.exe\", \"opera.exe\", \"vivaldi.exe\"]);\nlet BenignChildren = dynamic([\"chrome.exe\", \"msedge.exe\", \"brave.exe\", \"opera.exe\", \"vivaldi.exe\", \"setup.exe\", \"chrome_pwa_launcher.exe\", \"msedgewebview2.exe\", \"notification_helper.exe\", \"elevation_service.exe\", \"msedge_proxy.exe\"]);\nDeviceProcessEvents\n| where Timestamp > ago(30d)\n| where InitiatingProcessFileName in~ (Browsers)\n| where FileName !in~ (BenignChildren)\n| where FileName in~ (\"cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\", \"rundll32.exe\", \"regsvr32.exe\", \"certutil.exe\", \"bitsadmin.exe\", \"curl.exe\", \"msiexec.exe\", \"installutil.exe\")\n| project Timestamp, DeviceName, Browser = InitiatingProcessFileName, BrowserVersion = InitiatingProcessVersionInfoProductVersion, Child = FileName, ChildCmd = ProcessCommandLine, Account = AccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"Browsers still running a Chrome build below 157.0.8103.50","description":"Untested. Patch-coverage view. Chrome applies updates only on relaunch, so a device may hold a patched binary while running a vulnerable process - pair this with a forced-relaunch policy rather than treating inventory as proof.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has \"chrome\" and SoftwareVendor has \"google\"\n| extend Major = toint(split(SoftwareVersion, \".\")[0]), Build = toint(split(SoftwareVersion, \".\")[2]), Patch = toint(split(SoftwareVersion, \".\")[3])\n| where Major \u003c 157 or (Major == 157 and (Build \u003c 8103 or (Build == 8103 and Patch \u003c 50)))\n| project DeviceName, DeviceId, SoftwareName, SoftwareVersion, OSPlatform\n| order by SoftwareVersion asc"}],"iocs":[{"type":"note","value":"Neither Microsoft nor Google has published attacker infrastructure for CVE-2026-124194 or CVE-2026-125350 - no IPs, domains or hashes are available, and Google is explicitly withholding attack detail for the Chrome flaw. Detection must be behavioural.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-10/12"},{"type":"ttp","value":"T1187 - Forced Authentication","context":"A crafted message file causes Outlook to authenticate to an attacker-controlled host, leaking the NTLMv2 hash.","confidence":"high","source":"Rapid7 (as relayed)"},{"type":"ttp","value":"T1557.001 - Adversary-in-the-Middle: LLMNR/NBT-NS Poisoning and SMB Relay","context":"Typical follow-on use of a captured NTLMv2 hash is relay to internal services.","confidence":"medium","source":"Analyst inference"},{"type":"ttp","value":"T1110.002 - Brute Force: Password Cracking","context":"Alternative follow-on: offline cracking of the captured NTLMv2 hash.","confidence":"medium","source":"Analyst inference"},{"type":"behaviour","value":"outlook.exe establishing TCP/445 or TCP/139 sessions to non-RFC1918 destinations","context":"High-fidelity exploitation indicator; Outlook has no legitimate reason to do this.","confidence":"high","source":"Analyst-derived detection logic"},{"type":"port","value":"445","context":"SMB egress abused to carry the forced NTLM authentication. Blocking this outbound is the primary compensating control.","confidence":"high","source":"Analyst-derived detection logic"},{"type":"behaviour","value":"Outlook fix delivered via the Microsoft 365 Apps / Office update channel rather than Windows Update","context":"Estates patching only via WSUS or Windows Update may report compliant while remaining vulnerable. Still unconfirmed against the vendor advisory.","confidence":"low","source":"TechHacker (as relayed)"},{"type":"filename","value":"libxslt","context":"Component containing the Chrome use-after-free (CVE-2026-125350). Also embedded in many non-browser applications, which may carry independent exposure.","confidence":"medium","source":"The Register / SecurityWeek (as relayed)"},{"type":"behaviour","value":"Chrome updates take effect only on browser relaunch","context":"A device reporting a patched Chrome build can still be running a vulnerable process for days. Force relaunch via policy.","confidence":"high","source":"Analyst-derived operational note"},{"type":"ttp","value":"T1203 - Exploitation for Client Execution","context":"Both items are client-side exploitation of universally deployed endpoint software, reached through mail and web content.","confidence":"high","source":"Analyst inference"}],"references":["https://www.rapid7.com/blog/post/em-patch-tuesday-november-2026/","https://www.csoonline.com/article/4247015/november-2026-patch-tuesday-63-critical-microsoft-fixes-plus-an-outlook-zero-day-that-allows-theft-of-hashed-credentials.html","https://www.splashtop.com/blog/patch-tuesday-november-2026","https://thehackernews.com/2026/11/google-issues-chrome-security-update.html","https://www.securityweek.com/chrome-update-patches-exploited-xml-zero-day-eighth-this-year/","https://threatprotect.qualys.com/2026/11/10/google-chrome-patches-eighth-zero-day-vulnerability-of-the-year-cve-2026-125350/","https://www.theregister.com/security/2026/11/10/chrome-zero-day-whack-a-mole-continues-as-2026-tally-hits-8/5308732"]},{"rank":8,"id":"TI-2026-11-12-004","title":"SAP November 2026 Patch Day: Four CVSS 10.0 Unauthenticated Flaws in the NetWeaver Stack - 'ICM2SHELL' Memory Corruption, Web Dispatcher, Gateway and a SAML2 Signature-Verification Bypass, No Workarounds","cve_ids":["CVE-2026-76964","CVE-2026-89126","CVE-2026-120017","CVE-2026-89103","CVE-2026-89119"],"vendor":"SAP","affected_products":["SAP NetWeaver Application Server ABAP - Internet Communication Manager (ICM)","SAP Web Dispatcher","SAP Gateway","SAP NetWeaver SAML2 Service Provider (Fiori and Web GUI systems using SSO)"],"category":"vulnerability_bundle","cvss_v3":10.0,"severity":"critical","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-10","last_updated":"2026-11-12","confidence":"medium","summary":"UK government and UK corporate - cross-cutting, highest severity scores in the window. SAP's November 2026 Security Patch Day (10 November) fixed four vulnerabilities carrying the maximum CVSS score of 10.0, all in the NetWeaver stack and none requiring authentication. Two are memory-corruption flaws in the Internet Communication Manager, in NetWeaver AS ABAP (CVE-2026-76964, SAP Note 3778530) and in SAP Web Dispatcher (CVE-2026-89126, Note 3778556); Onapsis, which discovered the ICM flaw and named it 'ICM2SHELL', estimates that thousands of SAP systems with ICM-based HTTP interfaces may be reachable over the public internet. A third 10.0 affects SAP Gateway - sources disagree on the identifier, with one listing CVE-2026-89103 and another describing it without a CVE, so verify against SAP's own Patch Day page. The fourth, CVE-2026-120017, is a missing-authentication flaw in the SAML2 service provider: because signatures are not verified, an attacker can log in as another user, including a privileged one. The fix is Note 3849308, and it should be assumed to affect every Fiori or Web GUI system configured for single sign-on. SAP's advisory reportedly lists no workaround for the SAML2 and Gateway flaws, so patching is the only remedy - there is no configuration change to buy time with. A CSRF flaw (CVE-2026-89119) is rated 9.6, and RedRays counts 38 security notes on the day, nine of them HotNews. No exploitation has been reported as at this window, which is why this sits at rank 8 rather than higher - but the combination of CVSS 10.0, unauthenticated reach, internet-exposed ICM interfaces and the absence of workarounds makes it the most consequential patch-only item in this report. UK relevance is substantial and often under-appreciated: SAP underpins finance, HR, payroll and procurement across UK central government departments, NHS shared-service organisations, local authority back offices, utilities and large UK corporates, and ERP estates are routinely on slower patch cycles than endpoints with change windows measured in weeks. The exploitation history of SAP NetWeaver is the argument for urgency: CVE-2025-31324 moved from disclosure to mass webshell deployment quickly enough that Shadowserver still reports compromised NetWeaver instances from it. Detail is from search-result summaries; the SAP Patch Day page and security notes were not retrievable from this environment, and the Gateway CVE identifier and publication date (10 versus 11 November) conflict between sources.","recommended_actions":["Apply SAP Notes 3778530 (NetWeaver AS ABAP ICM), 3778556 (Web Dispatcher), 3849308 (SAML2 service provider) and the Gateway note from the November Patch Day as an emergency change - there are no workarounds for the SAML2 and Gateway flaws.","Identify every internet-reachable ICM-based HTTP interface and SAP Web Dispatcher instance first; Onapsis assesses thousands as publicly exposed, and these are the unauthenticated-reachable assets.","Audit every Fiori and SAP Web GUI system configured for SAML2 single sign-on for CVE-2026-120017 - a signature-verification bypass permitting authentication as an arbitrary privileged user defeats MFA and conditional access upstream of SAP.","Where immediate patching is impossible, remove internet reachability from ICM and Web Dispatcher endpoints and place them behind a reverse proxy or VPN, accepting the service impact; this is a reachability control, not a fix.","Review SAP security audit logs and ICM/Web Dispatcher access logs retrospectively for anomalous unauthenticated requests, malformed HTTP, and crashes or restarts of the ICM process consistent with memory-corruption probing.","Hunt for the NetWeaver webshell pattern established by CVE-2025-31324 exploitation - unexpected files under servlet and public web paths, and new JSP or class files in deployment directories.","Verify SAP Gateway access control lists (secinfo/reginfo) independently of the patch; a hardened Gateway limits exploitation value even where a vulnerability exists.","Confirm patch coverage for the 9.6 CSRF flaw (CVE-2026-89119) and the remaining HotNews notes in the same change window - 38 notes were released, nine HotNews.","Validate against SAP's own Patch Day page: the Gateway CVE identifier differs between secondary sources and should not be tracked from this report alone."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"External access to SAP ICM, Web Dispatcher and Gateway service ports","description":"Untested. Exposure and reconnaissance view covering the standard SAP HTTP/HTTPS instance ports (80NN/443NN), Gateway (33NN/48NN) and dispatcher ports. Replace the host list with your SAP estate; any external source reaching these is an exposure finding in its own right.","query":"let SapHosts = dynamic([\"REPLACE_WITH_YOUR_SAP_HOST_IPS\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where DestinationIP in (SapHosts)\n| where DestinationPort between (8000 .. 8099) or DestinationPort between (44300 .. 44399) or DestinationPort between (3300 .. 3399) or DestinationPort between (4800 .. 4899) or DestinationPort in (50000, 50001, 8080, 443)\n| where isnotempty(SourceIP) and not(ipv4_is_private(SourceIP))\n| summarize Requests = count(), Ports = make_set(DestinationPort, 20), Actions = make_set(DeviceAction, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP, DestinationIP\n| order by Requests desc"},{"platform":"sentinel","table":"Syslog","name":"SAP ICM and Web Dispatcher process crashes or restarts (memory-corruption probing)","description":"Untested. ICM2SHELL-class memory corruption generates crashes before it generates reliable execution, so ICM/Web Dispatcher restarts without a matching change record are an early signal. Requires SAP host syslog forwarding.","query":"Syslog\n| where TimeGenerated > ago(30d)\n| where ProcessName has_any (\"icman\", \"sapwebdisp\", \"disp+work\", \"gwrd\", \"sapstartsrv\")\n| where SyslogMessage has_any (\"signal 11\", \"SIGSEGV\", \"core dump\", \"process terminated\", \"restart\", \"abnormal end\", \"ICM shutdown\", \"segmentation\")\n| summarize Events = count(), Sample = any(SyslogMessage), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Computer, ProcessName, bin(TimeGenerated, 1h)\n| where Events >= 2\n| order by LastSeen desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Webshell or unexpected deployable written into SAP web and servlet directories","description":"Untested. Mirrors the post-exploitation pattern established by CVE-2025-31324 NetWeaver exploitation. Flags web-executable content written into SAP deployment paths by anything other than the SAP deployment tooling.","query":"DeviceFileEvents\n| where Timestamp > ago(90d)\n| where FolderPath has_any (@\"\\usr\\sap\\\", \"/usr/sap/\", \"servlet_jsp\", \"irj/root\", \"j2ee/cluster\", \"sap/public\")\n| where FileName endswith \".jsp\" or FileName endswith \".jspx\" or FileName endswith \".class\" or FileName endswith \".war\" or FileName endswith \".sh\" or FileName endswith \".php\"\n| where InitiatingProcessFileName !in~ (\"sapstartsrv.exe\", \"sapstartsrv\", \"jcontrol.exe\", \"jcontrol\", \"sapcpe.exe\", \"sapcpe\", \"tp.exe\", \"r3trans.exe\")\n| project Timestamp, DeviceName, FolderPath, FileName, SHA256, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"OS command execution spawned by SAP server processes","description":"Untested. Successful ICM memory-corruption exploitation yields execution in the SAP work-process context. Flags shells and tooling parented by SAP binaries - should be near-zero outside maintenance windows.","query":"let SapProcs = dynamic([\"disp+work.exe\", \"disp+work\", \"icman.exe\", \"icman\", \"sapwebdisp.exe\", \"sapwebdisp\", \"gwrd.exe\", \"gwrd\", \"jlaunch.exe\", \"jlaunch\"]);\nDeviceProcessEvents\n| where Timestamp > ago(90d)\n| where InitiatingProcessFileName in~ (SapProcs)\n| where FileName in~ (\"cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"sh\", \"bash\", \"python\", \"python3\", \"perl\", \"curl\", \"curl.exe\", \"wget\", \"certutil.exe\", \"nc\", \"ncat\", \"whoami.exe\", \"whoami\", \"net.exe\")\n| project Timestamp, DeviceName, SapProcess = InitiatingProcessFileName, Child = FileName, ChildCmd = ProcessCommandLine, Account = AccountName\n| order by Timestamp desc"}],"iocs":[{"type":"note","value":"No exploitation has been reported for the November 2026 SAP flaws as at this window, and consequently no attacker infrastructure, hashes or exploit artefacts exist. The queries and indicators below are pre-emptive, derived from the exploitation pattern of the earlier NetWeaver flaw CVE-2025-31324.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-10/12"},{"type":"malware","value":"ICM2SHELL (Onapsis designation for the NetWeaver ICM memory-corruption flaw)","context":"Name refers to the vulnerability and its shell-execution outcome, not to a malware family. Discovered by Onapsis.","confidence":"medium","source":"Onapsis (as relayed by SAPinsider, DEV Community)"},{"type":"behaviour","value":"Thousands of SAP systems with ICM-based HTTP interfaces assessed as reachable from the public internet","context":"Onapsis estimate. Converts an unauthenticated CVSS 10.0 into practical internet-wide exposure.","confidence":"medium","source":"Onapsis (as relayed)"},{"type":"behaviour","value":"SAML2 service provider failing to verify signatures, permitting authentication as an arbitrary user including privileged accounts","context":"CVE-2026-120017. Defeats upstream identity controls - MFA and conditional access enforced at the IdP provide no protection when the SP does not verify the assertion.","confidence":"medium","source":"DEV Community analysis / gbhackers (as relayed)"},{"type":"behaviour","value":"No workaround published for the SAML2 and Gateway flaws","context":"Removes the usual option of mitigating while scheduling. Patch or remove reachability are the only choices.","confidence":"medium","source":"SAP advisory (as relayed)"},{"type":"ttp","value":"T1190 - Exploit Public-Facing Application","context":"Unauthenticated exploitation of internet-reachable ICM, Web Dispatcher and Gateway services.","confidence":"high","source":"Analyst inference"},{"type":"ttp","value":"T1606.002 - Forge Web Credentials: SAML Tokens","context":"The SAML2 signature-verification bypass permits forged assertions to be accepted, granting arbitrary identity assumption within SAP.","confidence":"medium","source":"Analyst inference"},{"type":"ttp","value":"T1505.003 - Server Software Component: Web Shell","context":"The established post-exploitation pattern for NetWeaver compromise (per Shadowserver reporting on CVE-2025-31324), and the most likely follow-on here.","confidence":"medium","source":"Shadowserver (as relayed)"},{"type":"service_name","value":"SAP Notes 3778530, 3778556, 3849308","context":"Remediation references for the NetWeaver ICM, Web Dispatcher and SAML2 service-provider flaws respectively. Verify the Gateway note number against SAP's Patch Day page.","confidence":"medium","source":"SAPinsider / RedRays (as relayed)"},{"type":"port","value":"8000-8099, 44300-44399, 3300-3399","context":"Typical SAP instance HTTP, HTTPS and Gateway port ranges. None should be internet-reachable.","confidence":"medium","source":"Analyst-derived detection logic"}],"references":["https://sapinsider.org/articles/sap-security-patch-day-november-2026-shared-infrastructure","https://gbhackers.com/sap-november-2026-patch-day/","https://cybersecuritynews.com/sap-security-patch-day-november/","https://redrays.io/blog/sap-security-patch-day-november-2026/","https://www.rescana.com/post/sap-security-patch-day-november-2026-netweaver-cvss-10-patch-now","https://dev.to/sharz_ninesec/saps-november-2026-patch-day-icm2shell-proxygate-and-a-saml-bypass-all-rated-cvss-100-5edj"]},{"rank":9,"id":"TI-2026-11-12-005","title":"Maersk Confirms Data Theft From Legacy LF Logistics System as WhiteArmor Demands $5m - Plus UK Corporate Leak-Site Claims in Window: Audio Note UK (Osiris, 11 Nov), A&O Shearman, Signworx (Play), Unilever (WhiteArmor)","cve_ids":[],"vendor":"Multiple (A.P. Moller-Maersk and UK corporate victims)","affected_products":["Maersk - local legacy system inherited through the 2022 acquisition of LF Logistics (Hong Kong)","Audio Note UK Ltd - listed on the Osiris leak site, 11 November 2026","A&O Shearman (UK-headquartered international law firm) - listed 10-11 November 2026","Signworx (GB) - listed by Play ransomware, 10 November 2026","Unilever (UK-headquartered) - WhiteArmor claim, 4-5 November 2026"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-11","last_updated":"2026-11-12","confidence":"medium","summary":"UK corporate and UK supply chain - the principal confirmed corporate incident in the window plus the UK leak-site picture. On 11 November, A.P. Moller-Maersk confirmed that an intruder accessed and extracted data from a local legacy system inherited through an acquisition, said the incident appears isolated, and stated that its findings so far strongly suggest no sensitive data has been disclosed. It declined to name the system, the data types or the intrusion date, and reported no impact on other Maersk systems or on customers and partners connected via API or EDI. Separately, a relatively new extortion group calling itself WhiteArmor listed Maersk on its leak site and demanded USD 5m in Bitcoin, claiming roughly 100GB taken from a platform associated with LF Logistics - the Hong Kong company Maersk acquired in 2022 - and specifying around 29,000 driver records, 16,123 staff accounts and over 27,000 mobile device logs. Those figures come solely from the group and are unverified; Maersk has not confirmed WhiteArmor's involvement or the data types, and specialists cited by Danish outlet Ingenioren read this as data theft and extortion rather than conventional encrypting ransomware. The UK relevance is twofold. First, supply chain: Maersk is a primary container carrier for UK import and export flows through Felixstowe, London Gateway and Southampton, and UK logistics, retail and manufacturing firms exchange shipment, customs and driver data with it - so UK organisations should ask whether their own data sat in the acquired LF Logistics estate, not merely whether Maersk is 'affected'. Second, actor continuity: WhiteArmor also claimed UK-headquartered Unilever on 4-5 November, so the same group has now named two UK-linked multinationals in just over a week, suggesting a campaign against large enterprises with complex acquisition histories rather than isolated opportunism. The broader pattern here is the real lesson: the confirmed breach was in a legacy system inherited through acquisition - precisely the asset class that falls outside both the acquirer's standard controls and its asset inventory. UK leak-site activity inside and adjacent to the window comprises Audio Note UK Ltd (claimed by Osiris on 11 November, with a threat to publish unless negotiations open), A&O Shearman (a UK-headquartered international law firm, listed 10-11 November, attributed by one feed to 'BusinessDataLeaks'), Signworx (GB, claimed by Play on 10 November) and Simply UK (7 November). All four are unverified leak-site claims with no victim statement found, and should be treated as investigative leads only - leak-site listings routinely include stale, duplicated and occasionally fabricated victims. Detail is from search-result summaries; BleepingComputer, SecurityWeek and Infosecurity Magazine were not retrievable from this environment.","recommended_actions":["UK organisations with Maersk or LF Logistics relationships: ask Maersk directly, in writing, whether your data resided in the affected legacy system, rather than relying on the public statement that the incident is 'isolated'.","Treat shipment, customs, driver and personnel data shared with logistics partners as potentially exposed and plan for the downstream consequence - driver and staff records enable convincing phishing and identity-fraud targeting of named individuals.","Run the acquisition-inventory test on your own estate: list every system inherited through merger or acquisition in the last five years, identify which have never been through your standard security baseline, patch cycle, logging onboarding or access review, and schedule assessment in that order. This is the specific failure mode confirmed here.","Brief fraud, finance and HR functions that WhiteArmor has now named two UK-linked multinationals in just over a week, and that extortion groups commonly follow a listing with direct pressure on named employees and customers.","For Audio Note UK, A&O Shearman, Signworx and Simply UK: if you are one of these organisations or a supplier or customer of one, initiate verification now rather than waiting for publication - the extortion window is where notification obligations and legal options are decided.","Where you are a law-firm client (A&O Shearman listing), review what privileged and commercially sensitive material that firm holds, and raise it through your existing supplier-incident process; legal-sector compromise has disproportionate confidentiality consequences.","Do not treat leak-site listings as confirmed breaches in reporting lines to boards or regulators. Record them as unverified claims with a verification owner and a date, and update the record when evidence arrives.","Review outbound data flows to third-party logistics and legal platforms for excess scope - the Maersk case shows that acquired platforms accumulate data that no current contract would justify collecting."],"kql":[{"platform":"sentinel","table":"AADNonInteractiveUserSignInLogs","name":"Third-party and partner integration identities - anomalous sign-in locations","description":"Untested. Supply-chain exposure hunt: a compromised logistics or legal partner platform may hold credentials or federation into your tenant. Flags non-interactive sign-ins for integration identities from unexpected countries or many IPs. Baseline your partner egress ranges first.","query":"AADNonInteractiveUserSignInLogs\n| where TimeGenerated > ago(90d)\n| where ResultType == 0\n| extend Country = tostring(LocationDetails.countryOrRegion)\n| summarize SignIns = count(), Countries = make_set(Country, 15), IPs = make_set(IPAddress, 25), Apps = make_set(AppDisplayName, 15), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by UserPrincipalName, UserType\n| where array_length(Countries) > 2 or array_length(IPs) > 10\n| order by SignIns desc"},{"platform":"sentinel","table":"OfficeActivity","name":"Bulk download or external sharing of logistics, shipment and supplier data","description":"Untested. Detects the consequence of partner-platform compromise reaching your own data: large-scale access to logistics and supplier content, or new external sharing links on it. Adjust the path keywords to your document taxonomy.","query":"OfficeActivity\n| where TimeGenerated > ago(90d)\n| where RecordType in (\"SharePointFileOperation\", \"OneDrive\", \"SharePointSharingOperation\")\n| where OfficeObjectId has_any (\"logistic\", \"shipping\", \"shipment\", \"freight\", \"customs\", \"supplier\", \"haulage\", \"maersk\", \"carrier\", \"manifest\")\n| summarize Events = count(), Files = dcount(OfficeObjectId), Operations = make_set(Operation, 12), IPs = make_set(ClientIP, 12) by UserId, bin(TimeGenerated, 1d)\n| where Files > 50 or Operations has_any (\"AnonymousLinkCreated\", \"SharingInvitationCreated\", \"AddedToSecureLink\")\n| order by Files desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Inbound mail impersonating logistics, carrier or law-firm brands (post-breach phishing)","description":"Untested. Stolen driver, staff and shipment records fuel targeted phishing within weeks. Flags inbound mail referencing the named organisations from external senders that fail authentication. Expect legitimate traffic from genuine partner domains - allow-list those explicitly.","query":"let WatchBrands = dynamic([\"maersk\", \"lf logistics\", \"a&o shearman\", \"aoshearman\", \"audio note\", \"signworx\", \"unilever\"]);\nEmailEvents\n| where Timestamp > ago(30d)\n| where EmailDirection == \"Inbound\"\n| where Subject has_any (WatchBrands) or SenderFromDomain has_any (WatchBrands) or SenderDisplayName has_any (WatchBrands)\n| where SpfVerdict != \"Pass\" or DmarcVerdict != \"Pass\" or DkimVerdict != \"Pass\"\n| project Timestamp, SenderFromAddress, SenderDisplayName, SenderFromDomain, RecipientEmailAddress, Subject, SpfVerdict, DkimVerdict, DmarcVerdict, DeliveryAction, ThreatTypes\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Endpoint access to ransomware leak-site and extortion infrastructure","description":"Untested. Dual purpose: identifies staff visiting leak sites to check for your own organisation (route this through a controlled process instead), and flags Tor or onion-gateway use that may indicate negotiation activity or compromise. Replace the keyword list with your current threat-group tracking.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemoteUrl has_any (\"whitearmor\", \"osiris\", \"onion.ly\", \"onion.to\", \"onion.pet\", \"tor2web\", \"ransomware.live\", \"dls.\")\n      or RemotePort in (9001, 9030, 9050, 9051)\n| project Timestamp, DeviceName, Account = InitiatingProcessAccountName, InitiatingProcessFileName, RemoteUrl, RemoteIP, RemotePort\n| order by Timestamp desc"}],"iocs":[{"type":"note","value":"No technical indicators (hashes, IPs, ransom-note filenames, encryption extensions) have been published for the Maersk incident or for any of the UK leak-site claims in this entry. WhiteArmor's record counts come solely from the group and are unverified; Maersk has not confirmed WhiteArmor's involvement. All UK victim names below are unverified leak-site listings with no victim statement located.","context":"Provenance statement - filter out before ingestion. This entry is intelligence on targeting, not a detection package.","confidence":"high","source":"Search-result summaries, 2026-11-11/12"},{"type":"actor","value":"WhiteArmor","context":"Relatively new extortion group. Listed Maersk with a USD 5m Bitcoin demand (11 Nov) and UK-headquartered Unilever (4-5 Nov). Pattern suggests targeting of large multinationals with complex acquisition histories.","confidence":"medium","source":"BleepingComputer / SecurityWeek / Infosecurity Magazine (as relayed)"},{"type":"actor","value":"Osiris","context":"Claimed Audio Note UK Ltd on 11 November 2026 with a threat to publish data unless the company opens negotiations. Unverified.","confidence":"low","source":"DeXpose / Ransomware.live / Recent Breaches (as relayed)"},{"type":"actor","value":"Play","context":"Claimed Signworx (GB) on 10 November 2026, with an estimated attack date the same day. Unverified.","confidence":"low","source":"Ransomware.live (as relayed)"},{"type":"account","value":"Maersk / LF Logistics","context":"Confirmed victim. Data accessed and extracted from a local legacy system inherited through the 2022 LF Logistics acquisition; Maersk states the incident appears isolated and that findings so far strongly suggest no sensitive data has been disclosed.","confidence":"high","source":"Maersk statement, 11 November (as relayed)"},{"type":"account","value":"Audio Note UK Ltd","context":"UK manufacturer listed on the Osiris leak site, 11 November 2026. Unverified claim; no company statement found.","confidence":"low","source":"Leak-site aggregators (as relayed)"},{"type":"account","value":"A&O Shearman","context":"UK-headquartered international law firm listed 10-11 November 2026, attributed by one feed to 'BusinessDataLeaks'. Unverified. Legal-sector listings carry disproportionate client-confidentiality consequences if genuine.","confidence":"low","source":"Breachsense / Ransomware.live (as relayed)"},{"type":"account","value":"Signworx (GB); Simply UK","context":"UK entries on leak-site trackers dated 10 November (Play) and 7 November respectively. Unverified.","confidence":"low","source":"Ransomware.live (as relayed)"},{"type":"behaviour","value":"Breach confined to a legacy system inherited through acquisition, outside the acquirer's standard control set and asset inventory","context":"The transferable lesson. Acquired estates commonly escape baseline hardening, patching, logging onboarding and access review, and hold data no current contract would justify retaining.","confidence":"high","source":"Maersk statement (as relayed) plus analyst assessment"},{"type":"ttp","value":"T1657 - Financial Theft (extortion without encryption)","context":"Specialists cited by Ingenioren assess this as data theft and extortion rather than conventional encrypting ransomware - the dominant pattern in current UK-facing extortion activity.","confidence":"medium","source":"Ingenioren (as relayed)"},{"type":"ttp","value":"T1567 - Exfiltration Over Web Service","context":"Claimed 100GB exfiltration from a logistics platform; exfiltration method not disclosed.","confidence":"low","source":"Analyst inference"},{"type":"behaviour","value":"Leak-site listings routinely include stale, duplicated and occasionally fabricated victims","context":"Handling rule for every unverified name in this entry: record as an investigative lead with a named verification owner, not as a confirmed breach in board or regulatory reporting.","confidence":"high","source":"Analyst assessment, consistent with prior runs"}],"references":["https://www.bleepingcomputer.com/news/security/maersk-confirms-data-breach-as-whitearmor-ransomware-demands-5-million/","https://www.securityweek.com/maersk-confirms-data-theft-amid-5-million-extortion-attempt/","https://www.infosecurity-magazine.com/news/maersk-data-breach-extortion-group/","https://industrialcyber.co/ransomware/maersk-investigates-legacy-system-breach-after-whitearmor-ransomware-group-claims-100gb-logistics-data-theft/","https://securityaffairs.com/202869/data-breach/whitearmor-demands-5-million-from-maersk-claims-theft-of-100gb-of-data.html","https://www.dexpose.io/osiris-ransomware-targets-audio-note-uk-ltd/","https://www.ransomware.live/"]},{"rank":10,"id":"TI-2026-11-12-006","title":"Check Point Links Three China-Nexus Espionage Clusters Through Shared 'Sparrow' Malware Framework and a Suspected Quartermaster, 'CopperDragon' - European Telecoms, Government, Military and CNI Targeted","cve_ids":[],"vendor":"Multiple (telecommunications, government, military, research and critical infrastructure targets)","affected_products":["Telecommunications operators and transit networks (Europe, Asia, Latin America)","Government and military entities","Research institutions and critical infrastructure operators","Exposed Linux servers and internet-facing RDP (OceanGate access vectors)"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-11","last_updated":"2026-11-12","confidence":"medium","summary":"UK government and UK corporate - strategic espionage context, in-window research publication. Check Point Research published findings on 11 November from a year-long investigation linking three China-nexus intrusion clusters - tracked as SilentDelivery, OceanGate and DarkWire - through a shared malware ecosystem it calls 'Sparrow', and attributing that shared toolkit to a suspected common supplier it names 'CopperDragon'. Check Point describes CopperDragon as a probable 'digital quartermaster' developing tooling for multiple China-nexus actors including FamousSparrow, Earth Estries, Tropic Trooper, UAT-9244 and UAT-8302, and assesses some degree of overlap with Salt Typhoon. The campaigns are reported to have targeted several dozen high-profile organisations across three continents: telecommunications operators, government bodies, military entities, research institutions and critical infrastructure in Europe, Asia and Latin America. Access methods differ by cluster, which is the most actionable part of the research - SilentDelivery relies on watering holes and phishing, OceanGate targets exposed Linux servers and RDP password guessing, and DarkWire focuses on telecom and government networks. One Sparrow component is reported to hide command-and-control behind a live legitimate service, a pattern that defeats domain-reputation blocking. Check Point is explicit that shared tooling does not establish a single operator: the report does not claim one team ran all three campaigns, and it does not identify who runs CopperDragon. The '21 countries' figure appears in Check Point's blog summary rather than its technical report and should be treated as approximate. This ranks tenth because it is strategic rather than immediately actionable, but it is directly relevant to UK readers on three counts. Telecommunications and transit networks carrying UK data are named targets, and Salt Typhoon-adjacent activity against telecoms has been a sustained concern for UK and allied agencies. The NCSC's 3 November 'State of the Cyber Nation' review assessed that China highly likely has both the intent and the best positioning to use AI against critical national infrastructure and strategic targets, and this research is a concrete instance of the industrialised tooling that assessment describes. And the quartermaster model has a defensive implication worth internalising: shared tooling across unrelated operators means that indicator-based attribution will mislead, so detection should be anchored on behaviour and tradecraft rather than on actor-labelled IoC feeds. Detail is from search-result summaries; the Check Point Research blog and technical report were not retrievable from this environment, so no hashes, domains or IPs are available here.","recommended_actions":["UK telecommunications operators, government bodies and CNI entities: obtain the full Check Point Research report directly and run its indicators against at least 12 months of retained telemetry - the investigation spans a year and dwell times in this class of intrusion are long.","Harden the stated access vectors rather than hunting the malware first: eliminate internet-exposed RDP or place it behind MFA-enforced brokers, and audit internet-facing Linux servers for exposed management services and weak or reused credentials.","Review watering-hole exposure: for sector bodies, regulators and membership organisations whose sites your staff visit routinely, treat a compromise of those sites as a plausible delivery route and ensure browser isolation or hardened configurations for high-risk roles.","Assume indicator-based attribution will be unreliable given shared tooling across unrelated operators. Prioritise behavioural detections - credential access, directory reconnaissance, lateral movement, long-lived low-volume egress - over actor-labelled IoC feeds.","Hunt for command-and-control concealed inside legitimate live services: look for low-volume, long-duration, regularly timed connections to otherwise reputable cloud and content services from servers that have no business reason to use them.","Telecoms specifically: review access to subscriber data, lawful-intercept infrastructure, signalling and routing platforms, and OSS/BSS systems - the collection targets in comparable campaigns against carriers.","Include third-party and managed-service access in scope. Several of the named actor sets historically reached targets through suppliers and shared infrastructure rather than directly.","Feed this into board-level reporting alongside the NCSC's assessment that China highly likely has the intent and positioning to act against UK CNI and strategic targets - it is corroborating evidence for that judgement, not a separate concern."],"kql":[{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Long-lived low-volume beaconing to legitimate cloud and content services from server workloads","description":"Untested. Targets the reported tradecraft of hiding C2 behind a live legitimate service, which defeats domain reputation. Looks for regular, low-volume, many-day connections from servers to reputable services. Expect benign hits from telemetry and update agents - allow-list those processes explicitly, then investigate the remainder.","query":"DeviceNetworkEvents\n| where Timestamp > ago(90d)\n| where ActionType == \"ConnectionSuccess\"\n| where isnotempty(RemoteUrl)\n| where InitiatingProcessFileName !in~ (\"msedge.exe\", \"chrome.exe\", \"firefox.exe\", \"onedrive.exe\", \"teams.exe\", \"outlook.exe\", \"msteams.exe\", \"mssense.exe\", \"senseir.exe\", \"omsagent\", \"mdatp\", \"waagent\")\n| summarize Connections = count(), ActiveDays = dcount(bin(Timestamp, 1d)), Hours = dcount(bin(Timestamp, 1h)), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, RemoteUrl, InitiatingProcessFileName\n| where ActiveDays >= 14 and Connections \u003c 2000 and Hours >= 20\n| extend AvgPerDay = round(todouble(Connections) / ActiveDays, 1)\n| order by ActiveDays desc"},{"platform":"sentinel","table":"SecurityEvent","name":"RDP password-guessing followed by success (OceanGate access vector)","description":"Untested. Directly targets the reported OceanGate vector. Correlates clusters of 4625 failures with a subsequent 4624 type-10 success from the same source. Any pairing from an external IP is an incident.","query":"let Failures =\n    SecurityEvent\n    | where TimeGenerated > ago(60d)\n    | where EventID == 4625 and LogonType in (3, 10)\n    | summarize FailedAttempts = count(), AccountsTried = dcount(TargetUserName) by IpAddress, Computer, Window = bin(TimeGenerated, 1h)\n    | where FailedAttempts >= 20 or AccountsTried >= 5;\nlet Successes =\n    SecurityEvent\n    | where TimeGenerated > ago(60d)\n    | where EventID == 4624 and LogonType == 10\n    | project SuccessTime = TimeGenerated, IpAddress, Computer, TargetUserName, Window = bin(TimeGenerated, 1h);\nFailures\n| join kind=inner Successes on IpAddress, Computer, Window\n| project Window, IpAddress, Computer, CompromisedAccount = TargetUserName, FailedAttempts, AccountsTried, SuccessTime\n| order by FailedAttempts desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Directory and network reconnaissance burst on a single host","description":"Untested. Behaviour-first detection as recommended for shared-tooling threats: an operator orientating in a new environment runs several distinct discovery commands in a short window, which a legitimate administrator rarely does. Tune the distinct-tool threshold to your estate.","query":"let Recon = dynamic([\"nltest.exe\", \"net.exe\", \"net1.exe\", \"whoami.exe\", \"ipconfig.exe\", \"arp.exe\", \"route.exe\", \"netstat.exe\", \"systeminfo.exe\", \"tasklist.exe\", \"quser.exe\", \"qwinsta.exe\", \"dsquery.exe\", \"nslookup.exe\", \"adfind.exe\"]);\nDeviceProcessEvents\n| where Timestamp > ago(90d)\n| where FileName in~ (Recon)\n| summarize DistinctTools = dcount(FileName), Tools = make_set(FileName, 20), Commands = make_set(ProcessCommandLine, 25), Executions = count() by DeviceName, AccountName, Window = bin(Timestamp, 30m)\n| where DistinctTools >= 5\n| order by DistinctTools desc"},{"platform":"defender_xdr","table":"DeviceLogonEvents","name":"Externally originated successful logons to internet-facing Linux and Windows servers","description":"Untested. Exposure review for the OceanGate vector: successful authentication to server workloads from public IP space. In a correctly segmented estate this should be empty or limited to a documented bastion set.","query":"DeviceLogonEvents\n| where Timestamp > ago(60d)\n| where ActionType == \"LogonSuccess\"\n| where LogonType in~ (\"Network\", \"Remote interactive\", \"Interactive\")\n| where isnotempty(RemoteIP) and not(ipv4_is_private(RemoteIP)) and not(ipv4_is_in_any_range(RemoteIP, dynamic([\"100.64.0.0/10\", \"127.0.0.0/8\", \"169.254.0.0/16\"])))\n| summarize Logons = count(), Accounts = make_set(AccountName, 20), SourceIPs = make_set(RemoteIP, 25), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName\n| order by Logons desc"}],"iocs":[{"type":"note","value":"No hashes, domains or IP addresses from the Check Point Research report could be retrieved from this environment - the research blog and technical report were not accessible and search summaries carried no indicator values. The Check Point publication must be consulted directly for the authoritative Sparrow IoC set. This entry is deliberately tradecraft-only.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-11/12"},{"type":"actor","value":"CopperDragon","context":"Check Point designation for a suspected digital quartermaster developing tooling for multiple China-nexus actors. Operator identity unknown; Check Point does not claim a single team ran all three campaigns.","confidence":"medium","source":"Check Point Research (as relayed by Infosecurity Magazine, The Hacker News)"},{"type":"malware","value":"Sparrow framework","context":"Shared malware ecosystem linking the SilentDelivery, OceanGate and DarkWire clusters. One component reportedly conceals command-and-control behind a live legitimate service.","confidence":"medium","source":"Check Point Research (as relayed)"},{"type":"actor","value":"SilentDelivery, OceanGate, DarkWire","context":"The three linked intrusion clusters. Access methods differ: SilentDelivery uses watering holes and phishing; OceanGate targets exposed Linux servers and RDP password guessing; DarkWire targets telecom and government networks.","confidence":"medium","source":"Check Point Research (as relayed)"},{"type":"actor","value":"FamousSparrow, Earth Estries, Tropic Trooper, UAT-9244, UAT-8302; assessed overlap with Salt Typhoon","context":"China-nexus actor sets assessed as consumers of CopperDragon tooling. Shared tooling across unrelated operators means indicator-based attribution will mislead.","confidence":"medium","source":"Check Point Research (as relayed)"},{"type":"ttp","value":"T1102 - Web Service (C2 concealed within a live legitimate service)","context":"Defeats domain-reputation blocking and allow-list-based egress control. Hunt on connection shape - low volume, long duration, regular timing - rather than on destination reputation.","confidence":"medium","source":"Check Point Research (as relayed)"},{"type":"ttp","value":"T1189 - Drive-by Compromise","context":"SilentDelivery watering-hole access vector. Sector bodies, regulators and membership sites are plausible staging points for UK targets.","confidence":"medium","source":"Check Point Research (as relayed)"},{"type":"ttp","value":"T1110.001 - Brute Force: Password Guessing","context":"OceanGate access vector against internet-facing RDP, alongside exploitation of exposed Linux servers.","confidence":"medium","source":"Check Point Research (as relayed)"},{"type":"ttp","value":"T1133 - External Remote Services","context":"Exposed RDP and Linux management services are the named initial-access surface for one of the three clusters.","confidence":"medium","source":"Check Point Research (as relayed)"},{"type":"behaviour","value":"Digital quartermaster model: one supplier developing tooling consumed by multiple unrelated state-nexus operators","context":"Defensive consequence: tool-based attribution is unreliable and actor-labelled IoC feeds will produce both false confidence and missed detections. Anchor detection on behaviour and tradecraft.","confidence":"medium","source":"Check Point Research (as relayed) plus analyst assessment"},{"type":"behaviour","value":"'21 countries' figure appears in Check Point's blog summary rather than its technical report","context":"Treat scale figures as approximate. The technical report describes several dozen high-profile organisations across three continents.","confidence":"medium","source":"TechTimes (as relayed)"}],"references":["https://www.infosecurity-magazine.com/news/chinese-malware-tied-three-hacking/","https://thehackernews.com/2026/11/three-chin
