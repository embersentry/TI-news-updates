ceptable bridging control and carries a modest performance cost on Base64-heavy workloads. Count the JDKs inside appliances and container images, not the ones in the software register.\n\nConfidence and caveats. Confidence is medium. The NHS England alert of 18 November is reported by a single news source and the original NHS England page was not retrieved, so the wording of the NCSOC assessment should be verified at digital.nhs.uk/cyber-alerts before it is quoted. Oracle's 8.1 CVSS v3.1 score, the fixed build numbers and CISA's 17 November alert are consistently reported. The affected range starting at 17.0.6 is explicitly unconfirmed by Oracle and OpenJDK. The GreyNoise position is internally inconsistent across sources as described above. The OX Security 0.12% figure is a vendor estimate of a population, not a measurement. No pages were fetched directly in this environment.","recommended_actions":["Run the CPU-feature check first, because it reclassifies most of the estate in one pass: on every internet-facing Java host, grep /proc/cpuinfo for avx512_vbmi. Where the flag is absent, the reported RCE path does not apply and the item drops to a denial-of-service exposure for the normal patch cycle. Where it is present - typically recent Intel server silicon, including many cloud instance types - keep the 72-hour clock.","For NHS organisations and their suppliers, treat the 18 November NHS England cyber alert as the tasking it is: confirm receipt, record the assessment that future exploitation is likely, and report your position through the usual NHS England route. Verify the alert text at digital.nhs.uk/cyber-alerts rather than relying on this summary.","Patch the identity plane first and the wiki second. Keycloak and PingFederate are reported pre-authentication in default configuration, and an identity provider compromise is not recoverable by patching afterwards. Jira, Confluence, Jenkins and Artifactory follow - and note that Confluence hosts also carry rank 2's actively exploited Axis flaw, so do both in one maintenance window.","Where a downstream JDK has no fixed build - Red Hat packages and Temurin 17 were both reported as lagging - apply -XX:-UseBASE64Intrinsics on x86-64 as a bridging control and record it as a temporary measure with a review date, not as remediation.","Build the Java runtime inventory as a deliverable in its own right, covering JDKs inside vendor appliances, container base images and bundled application runtimes. This vulnerability will not be the last one in the Java runtime, and the inventory outlives it; most organisations discover they have three to five times more JVMs than their software register shows.","Alert on the denial-of-service signal, which is the achievable impact and therefore the likely one: unexpected JVM termination, hs_err_pid or replay_pid file creation, and repeated restarts of a Java service on an internet-facing host.","Do not re-escalate on the basis of exploitation-attempt telemetry alone. Scanning on ports 80 and 8080 against a named CVE is now routine within hours of disclosure and is not evidence that your estate is exploitable; the CPU-feature and reachability checks are."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"Java runtime inventory against the 17 November fixed builds","description":"The exposure baseline. Expect this to under-report badly: JDKs inside appliances and container images are usually invisible to software inventory, which is the point of the manual inventory action.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has_any (\"java\", \"jdk\", \"jre\", \"openjdk\", \"temurin\", \"corretto\", \"zulu\", \"graalvm\", \"semeru\")\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by SoftwareVendor, SoftwareName, SoftwareVersion\n| order by Hosts desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Child process of a Java process - code execution following successful exploitation","description":"The consequence of a successful RCE. Baseline first on build servers, where Jenkins legitimately spawns shells; on an identity provider or a wiki this should be close to empty.","query":"DeviceProcessEvents\n| where Timestamp > ago(14d)\n| where InitiatingProcessFileName in~ (\"java\", \"java.exe\", \"javaw.exe\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"nc\", \"ncat\", \"socat\", \"python\", \"python3\", \"perl\", \"base64\", \"chmod\", \"certutil.exe\", \"powershell.exe\", \"cmd.exe\")\n| extend Context = case(\n    InitiatingProcessCommandLine has_any (\"keycloak\", \"pingfederate\"), \"identity_provider\",\n    InitiatingProcessCommandLine has_any (\"jenkins\"), \"build_server_expect_noise\",\n    InitiatingProcessCommandLine has_any (\"confluence\", \"jira\", \"artifactory\"), \"atlassian_or_artifactory\",\n    \"other_java\")\n| project Timestamp, DeviceName, Context, InitiatingProcessAccountName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, ReportId\n| order by Context asc, Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"JVM crash artefacts - hs_err_pid and replay_pid files on internet-facing Java hosts","description":"Denial of service is the readily achievable impact, so crash artefacts are the most likely evidence of attempted exploitation. Their appearance on a host that has not been crashing is the signal.","query":"DeviceFileEvents\n| where Timestamp > ago(14d)\n| where FileName startswith \"hs_err_pid\" or FileName startswith \"replay_pid\" or FileName startswith \"core.\"\n| project Timestamp, DeviceName, FolderPath, FileName, InitiatingProcessFileName, InitiatingProcessAccountName, InitiatingProcessCommandLine\n| summarize Crashes = count(), FirstSeen = min(Timestamp), LastSeen = max(Timestamp), Files = make_set(FileName, 10) by DeviceName, FolderPath\n| order by Crashes desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Oversized or malformed Base64 in pre-authentication request fields","description":"The flaw is in the Base64 decoder, and the pre-authentication reach comes from fields decoded before the authentication decision: Authorization headers, cookies, SAML and JWT parameters. Hunt for abnormal length rather than for a signature.","query":"W3CIISLog\n| where TimeGenerated > ago(7d)\n| where csUriStem has_any (\"/auth\", \"/realms\", \"/saml\", \"/oauth\", \"/token\", \"/login\", \"/rest/\", \"/idp\", \"/sp\")\n| extend QueryLength = strlen(csUriQuery), CookieLength = strlen(csCookie)\n| where QueryLength > 8000 or CookieLength > 8000\n| project TimeGenerated, Computer, cIP, csMethod, csUriStem, QueryLength, CookieLength, scStatus, csUserAgent, timeTaken\n| order by QueryLength desc"},{"platform":"sentinel","table":"Syslog","name":"Repeated Java service restarts on internet-facing hosts","description":"Catches the denial-of-service impact where crash files are not collected. A service that restarts repeatedly on an internet-facing Java host, starting after 17 November, deserves a look regardless of cause.","query":"Syslog\n| where TimeGenerated > datetime(2026-11-16)\n| where SyslogMessage has_any (\"java\", \"keycloak\", \"confluence\", \"jira\", \"jenkins\", \"artifactory\", \"pingfederate\", \"tomcat\")\n| where SyslogMessage has_any (\"Started\", \"Stopped\", \"failed\", \"Main process exited\", \"SIGSEGV\", \"OutOfMemory\", \"Scheduled restart\")\n| summarize Events = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Sample = any(SyslogMessage) by Computer, ProcessName, bin(TimeGenerated, 1h)\n| where Events > 5\n| order by Events desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound callback from a Java process on an internet-facing host","description":"Post-exploitation egress. Java application servers have enumerable outbound requirements, which makes unexpected destinations - particularly on non-web ports - a usable signal.","query":"DeviceNetworkEvents\n| where Timestamp > ago(14d)\n| where InitiatingProcessFileName in~ (\"java\", \"java.exe\", \"javaw.exe\")\n| where ActionType == \"ConnectionSuccess\"\n| where RemotePort !in (80, 443, 8080, 8443, 1433, 3306, 5432, 1521, 389, 636, 25, 587)\n| summarize Connections = count(), Ports = make_set(RemotePort, 20) by DeviceName, RemoteIP, RemoteUrl, InitiatingProcessCommandLine\n| order by Connections desc"},{"platform":"sentinel","table":"SigninLogs","name":"Post-exploitation identity abuse following a suspected Keycloak or PingFederate compromise","description":"The reason the identity plane is patched first. If a federated identity provider were compromised, the visible consequence would be downstream authentications that bypass expected controls - new federation trusts, token issuance anomalies, or sign-ins without the expected MFA claim.","query":"SigninLogs\n| where TimeGenerated > datetime(2026-11-17)\n| where ResultType == 0\n| where AuthenticationRequirement == \"singleFactorAuthentication\" or isempty(tostring(AuthenticationDetails))\n| extend Federated = tostring(parse_json(tostring(AuthenticationProcessingDetails))[0].value)\n| summarize Signins = count(), Users = dcount(UserPrincipalName), IPs = dcount(IPAddress), SampleUsers = make_set(UserPrincipalName, 15) by AppDisplayName, Federated, bin(TimeGenerated, 1h)\n| where Users > 5\n| order by Signins desc"}],"iocs":[{"type":"note","value":"NO CONFIRMED SUCCESSFUL EXPLOITATION ANYWHERE AS AT 19 NOVEMBER","context":"GreyNoise reports exploitation attempts but confirms no successful exploitation against its sensors; Censys reports probing and exploit-shaped requests. Not in CISA KEV. A full RCE exploit exists for VulnCheck Initial Access Intelligence customers from 17 November; no public RCE exploit was identified.","confidence":"high","source":"GreyNoise, Censys, VulnCheck and OX Security via secondary reporting"},{"type":"behaviour","value":"Absence of the avx512_vbmi flag in /proc/cpuinfo on an internet-facing Java host","context":"The single most useful triage input in this entry. VulnCheck reports the vulnerable code path executes only on CPUs providing AVX-512 VBMI and BW; where the flag is absent the RCE case is reported to fall away. Check before escalating.","confidence":"medium","source":"VulnCheck via secondary reporting"},{"type":"ttp","value":"Memory corruption in the OpenJDK Base64 decoder reached pre-authentication via credential, token, cookie and attachment parsing","context":"Base64 decoding happens before the authentication decision, which is why no account is required in the affected products' default configurations.","confidence":"high","source":"Oracle/OpenJDK advisories and CISA alert via secondary reporting"},{"type":"behaviour","value":"Scanning concentrated on ports 80 and 8080 tagged to CVE-2026-114938","context":"GreyNoise telemetry. Routine post-disclosure scanning, not evidence that a given estate is exploitable - do not re-escalate on this alone.","confidence":"medium","source":"GreyNoise live tracking page via secondary reporting"},{"type":"behaviour","value":"Unexpected JVM termination, or hs_err_pid / replay_pid file creation, on an internet-facing Java host after 17 November","context":"Denial of service is the readily achievable impact and reliable RCE requires per-application work, so crash artefacts are the most likely evidence of attempted exploitation.","confidence":"medium","source":"analyst assessment"},{"type":"behaviour","value":"Shell, curl, wget, base64 or PowerShell executing as a child of a java or javaw process","context":"The consequence of successful exploitation. Expect legitimate noise on Jenkins build servers; on Keycloak or PingFederate this should be empty.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Abnormally long Base64-shaped values in Authorization headers, cookies, SAML assertions or JWT parameters on pre-authentication endpoints","context":"The reachable input. Hunt on length anomaly rather than signature, because the payload is shaped by the target application rather than by a fixed exploit string.","confidence":"medium","source":"analyst assessment"},{"type":"ttp","value":"Pre-authentication reach reported in DEFAULT configurations of Keycloak, Jira, Confluence, Jenkins, JFrog Artifactory and PingFederate","context":"Default-configuration reachability is what makes the identity-plane products the patch priority: a Keycloak or PingFederate compromise is not recoverable by patching afterwards.","confidence":"medium","source":"researcher reporting via trade press"},{"type":"behaviour","value":"Running a downstream JDK with no fixed build published - Red Hat packages and Temurin 17 reported lagging","context":"Determines who is left with the mitigation rather than the fix. Those estates should be running -XX:-UseBASE64Intrinsics with a recorded review date.","confidence":"medium","source":"Cycode and trade press"},{"type":"ttp","value":"-XX:-UseBASE64Intrinsics as the vendor-reported mitigation on x86-64 where no patch exists","context":"Bridging control, not remediation. Modest performance cost on Base64-heavy workloads; record it with a review date.","confidence":"medium","source":"secondary reporting"},{"type":"note","value":"GREYNOISE POSITION IS INCONSISTENT ACROSS SOURCES","context":"One report states GreyNoise has downgraded its classifications and lists no block candidates; its live page reportedly still shows observed infrastructure entries. The discrepancy is recorded rather than resolved - check the GreyNoise page directly before acting on either statement.","confidence":"low","source":"secondary reporting"},{"type":"note","value":"NHS ENGLAND ALERT OF 18 NOVEMBER IS SINGLE-SOURCED IN THIS RUN","context":"The alert, and the NCSOC assessment that future exploitation is likely, are reported by one news source; the NHS England page itself was not retrieved. Verify at digital.nhs.uk/cyber-alerts before quoting.","confidence":"low","source":"secondary reporting of NHS England cyber alert"}],"references":["https://digital.nhs.uk/cyber-alerts/year/2026","https://fish4news.co.uk/global-java4shell-security-alert-java-patching/","https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability","https://www.ox.security/blog/java4shell-cve-2026-114938-rce-risk/","https://www.vulncheck.com/blog/java4shell","https://censys.com/advisory/cve-2026-114938/","https://java4shell.events.greynoise.io/","https://blog.talosintelligence.com/java4shell","https://cycode.com/blog/java4shell-cve-2026-114938/","https://watchtowr.com/intelligence/java4shell-cve-2026-114938-faq/"]},{"rank":4,"id":"TI-2026-11-19-004","title":"UK Corporate: Belfast-Based Wellington IT's CU Online Banking Platform Was Exploited Through an Authorisation Flaw to Harvest Saved Payee Records Across Roughly 40 Credit Unions - Potentially 1.8 Million People - and the 18 November Story Is That the Attack Happened in October and Customers Were Told Six Weeks Later","cve_ids":[],"vendor":"Wellington IT Ltd (Belfast) - CU Online credit union banking platform","affected_products":["CU Online - Wellington IT's online banking platform for credit unions, reported to serve around 50 credit unions including 43 in Ireland","Approximately 40 Irish credit unions reported affected; the Irish Times puts potential reach at around 1.8 million people","Data reported accessed: saved payee records (names and account identifiers). Wellington IT and the Irish League of Credit Unions state that account credentials, passwords, PINs and balances were NOT accessed"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-17","last_updated":"2026-11-19","confidence":"medium","summary":"The UK corporate story dated inside this window is a Northern Irish software supplier, and it is primarily a disclosure-timing story. Wellington IT, a Belfast company that provides the CU Online banking platform to around 50 credit unions, suffered an incident in which an attacker exploited an authorisation flaw in the platform to retrieve saved payee records. Reporting describes roughly 1.4 million malicious requests. Around 40 Irish credit unions are affected and the Irish Times puts the potential reach at approximately 1.8 million people. On 17 November the story broke; on 18 November the Irish government's response became the story, with Minister Robert Troy describing the delay in notification as 'not acceptable' after credit unions were told only on Tuesday about an attack that occurred in early October.\n\nWhy a Belfast supplier and Irish credit unions belong in a UK-focused feed. Three reasons, and the first is the one that matters most to UK readers. Wellington IT is a UK company, in Northern Ireland, and the obligations that attach to it under UK data protection law are UK obligations; the ICO is a UK regulator with an interest here even though the affected members are largely in the Republic. Second, the incident is a textbook instance of the exact risk the UK's Cyber Security and Resilience Bill is being written to address: a single supplier whose platform sits behind dozens of small regulated financial institutions, none of which could have detected this themselves, and a notification chain that took six weeks. The Bill's incident-reporting duties and its extension of scope to critical suppliers and managed service providers are precisely aimed at this shape of failure, and anyone preparing for it now has a live worked example. Third, credit unions operate on both sides of the border and the same platform serves them.\n\nWhat was taken, and why 'no credentials' is not the end of the assessment. Wellington IT and the Irish League of Credit Unions state that account credentials, passwords, PINs and balances were not accessed. Take that at face value and the data set is still dangerous: saved payee records are a list of who each member sends money to, with the account identifiers. That is a precision social-engineering data set. It supports a call that names the member's actual builder, landlord, solicitor or family member and asks them to update the account details - the most effective authorised-push-payment fraud script there is, because the caller knows something only the bank should know. The fraud that follows will not look like a breach of the credit union; it will look like a member choosing to send money. Any UK institution holding comparable saved-payee or standing-beneficiary data should read this as a warning about that data class specifically, which is routinely held at a lower protection tier than credentials.\n\nThe technical cause, as far as it is public. An authorisation flaw in the CU Online platform allowed saved payee records to be retrieved - the shape of a broken object-level authorisation problem, where an authenticated or partially authenticated request can enumerate other users' records by changing an identifier. That class of flaw has no CVE, no patch to deploy and no scanner that reliably finds it, which is why 1.4 million requests could be served before anyone noticed. The detection that would have caught it is volumetric and behavioural: one session, or one source, retrieving payee records at a rate no human uses. That is an application-logging and rate-limiting problem, and the KQL below is written for it. The Irish League of Credit Unions says the vulnerability has been closed.\n\nThe response, and the lesson in it. Wellington IT's chief executive Colin Mitchell says an outside cybersecurity team was engaged. The company is working with Ireland's National Cyber Security Centre and the Garda National Cyber Crime Bureau, and the Data Protection Commission has received multiple breach notifications. The six-week gap between the October attack and Tuesday's notification to credit unions is what ministers have seized on, and it is the part that generalises: for anyone running a multi-tenant platform, the notification clock in your contracts is a control, and if it is not specified in hours you will discover its real length during an incident.\n\nConfidence and caveats. Confidence is medium. The core facts - Wellington IT, CU Online, an authorisation flaw, saved payee data, approximately 40 affected Irish credit unions, October attack, notification on 17 November, ministerial criticism on 18 November - are consistent across the Irish Times, BleepingComputer and RTÉ-derived coverage. The figures conflict: credit union counts range from 40 to 50, the malicious request count is reported as 1.4 million by the Irish Times and BleepingComputer's source but as 5 million by a lower-quality outlet, and the 1.8 million potential-reach figure is the Irish Times's estimate of exposure rather than a confirmed count of affected individuals. Several aggregator sites reproduce these details with variations and should not be relied on. No UK credit union has been named as affected. No pages were fetched directly in this environment.","recommended_actions":["If you run a multi-tenant platform for regulated clients, audit today for broken object-level authorisation on every endpoint that returns a record keyed by an identifier - payees, beneficiaries, statements, documents, members. This flaw class is invisible to vulnerability scanners and to patch management, and it is what was exploited here.","Put volumetric detection on record-retrieval endpoints, which is the control that would have caught 1.4 million requests. Alert on a single session or source IP retrieving more records per hour than a human interface permits, and rate-limit at the application layer rather than only at the perimeter.","Treat saved payee and standing-beneficiary data as a sensitive class in its own right, at the same tier as credentials. 'No passwords taken' does not reduce the fraud exposure, because knowing who a member pays is what makes an authorised-push-payment script work.","If you are a UK financial institution with members or customers who may hold accounts at affected credit unions, brief your fraud and contact-centre teams on the specific script to expect: a caller who already knows the name of a genuine payee and asks for the account details to be changed. Verification must happen out of band, never on the inbound call.","Review the notification clause in every contract with a platform supplier and check whether it is specified in hours. Six weeks elapsed here between attack and client notification. Under the incoming Cyber Security and Resilience regime, that gap becomes a reportable failure rather than a commercial inconvenience.","If you are a UK organisation whose supplier is in Northern Ireland or otherwise within UK jurisdiction, note that your ICO obligations are unaffected by where the data subjects live. Confirm who is controller and who is processor before an incident, not during one.","Do not rely on the reassurance that credentials were not accessed to decide whether to notify. The data taken supports targeted fraud against named individuals, which is a high-risk determination under UK GDPR Article 34 on its own."],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Enumeration of record-keyed endpoints - the flaw class exploited at CU Online","description":"Detects broken object-level authorisation being exercised: one source requesting many distinct record identifiers from the same endpoint. This is the detection that would have surfaced 1.4 million payee retrievals. Tune the thresholds to your interface's real maximum.","query":"W3CIISLog\n| where TimeGenerated > ago(30d)\n| where csUriStem has_any (\"payee\", \"beneficiar\", \"account\", \"member\", \"statement\", \"transfer\", \"customer\", \"profile\")\n| where scStatus in (200, 206)\n| extend RecordId = extract(@\"(?i)(?:id|accountid|payeeid|memberid|customerid)=([0-9A-Za-z\\-]{1,64})\", 1, csUriQuery)\n| where isnotempty(RecordId)\n| summarize DistinctRecords = dcount(RecordId), Requests = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), SampleRecords = make_set(RecordId, 10) by cIP, csUriStem, csUsername, bin(TimeGenerated, 1h)\n| where DistinctRecords > 50\n| order by DistinctRecords desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Single session retrieving records at non-human rate","description":"Volumetric companion to the enumeration query, keyed on session rather than on identifier extraction, for platforms where the record key is in the body rather than the query string.","query":"W3CIISLog\n| where TimeGenerated > ago(30d)\n| where csUriStem has_any (\"payee\", \"beneficiar\", \"api\", \"service\")\n| summarize Requests = count(), DistinctUris = dcount(strcat(csUriStem, csUriQuery)), Bytes = sum(scBytes) by cIP, csUsername, csUserAgent, bin(TimeGenerated, 5m)\n| where Requests > 300\n| extend RequestsPerSecond = round(todouble(Requests) / 300.0, 2)\n| order by Requests desc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"Application gateway and WAF view of sustained API retrieval against a tenanted platform","description":"Where the application logs are not centralised, the gateway often is. Use this to establish whether a volumetric pattern reached the application at all.","query":"AzureDiagnostics\n| where TimeGenerated > ago(30d)\n| where Category has_any (\"ApplicationGatewayAccessLog\", \"ApplicationGatewayFirewallLog\", \"FrontdoorAccessLog\")\n| extend Uri = coalesce(tostring(requestUri_s), tostring(requestUri_s))\n| where Uri has_any (\"payee\", \"beneficiar\", \"member\", \"account\")\n| summarize Requests = count(), Statuses = make_set(httpStatus_d, 10), Hosts = dcount(host_s) by clientIP_s, Uri, bin(TimeGenerated, 10m)\n| where Requests > 200\n| order by Requests desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Bulk export or download of customer records from a SaaS or tenanted platform","description":"Catches the same exfiltration shape where the platform is consumed as SaaS and the only telemetry is app-level. Baseline against your own reporting and finance cycles, which produce legitimate bulk exports.","query":"CloudAppEvents\n| where Timestamp > ago(30d)\n| where ActionType has_any (\"Download\", \"Export\", \"FileDownloaded\", \"ListRecords\", \"BulkRead\")\n| summarize Events = count(), Apps = make_set(Application, 5), IPs = make_set(IPAddress, 10) by AccountDisplayName, ActionType, bin(Timestamp, 1h)\n| where Events > 100\n| order by Events desc"},{"platform":"sentinel","table":"SigninLogs","name":"Supplier and third-party administrative access to platforms holding customer financial data","description":"The structural control this incident argues for: know when your platform supplier's accounts are used, from where, and whether the access was expected. Replace the pattern with your own supplier account naming.","query":"SigninLogs\n| where TimeGenerated > ago(60d)\n| where UserPrincipalName has_any (\"supplier\", \"vendor\", \"support\", \"wellington\", \"svc_\", \"ext_\", \"guest\") or UserType == \"Guest\"\n| where ResultType == 0\n| summarize Signins = count(), Countries = make_set(LocationDetails.countryOrRegion, 10), IPs = dcount(IPAddress), Apps = make_set(AppDisplayName, 10) by UserPrincipalName, bin(TimeGenerated, 1d)\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Authorisation-boundary probing - sequential or incremented identifiers from one source","description":"Earlier-stage signal than bulk retrieval: an attacker discovering the flaw tries adjacent identifiers first. Short windows and low thresholds catch the discovery phase rather than the harvest.","query":"W3CIISLog\n| where TimeGenerated > ago(30d)\n| extend RecordId = extract(@\"(?i)(?:id|payeeid|accountid)=([0-9]{1,18})\", 1, csUriQuery)\n| where isnotempty(RecordId)\n| extend IdNum = tolong(RecordId)\n| summarize Ids = make_list(IdNum, 200), Distinct = dcount(RecordId), Forbidden = countif(scStatus in (401, 403)), Allowed = countif(scStatus == 200) by cIP, csUriStem, bin(TimeGenerated, 5m)\n| where Distinct > 10 and Forbidden > 0 and Allowed > 0\n| order by Distinct desc"},{"platform":"sentinel","table":"EmailEvents","name":"Payee-change and beneficiary-update lures following the disclosure","description":"The downstream fraud this data enables. Hunt for inbound mail referencing payee or beneficiary changes, credit unions, or account-detail updates, particularly to finance and member-facing staff.","query":"EmailEvents\n| where Timestamp > datetime(2026-11-17)\n| where Subject has_any (\"payee\", \"beneficiary\", \"account details\", \"bank details\", \"credit union\", \"payment details\", \"standing order\", \"direct debit\")\n| where Subject has_any (\"change\", \"update\", \"amend\", \"new\", \"confirm\", \"verify\")\n| project Timestamp, SenderFromAddress, SenderDisplayName, RecipientEmailAddress, Subject, DeliveryAction, ThreatTypes, AuthenticationDetails\n| order by Timestamp desc"}],"iocs":[{"type":"note","value":"NO TECHNICAL INDICATORS PUBLISHED","context":"No attacker infrastructure, malware, CVE or IP addresses have been published for this incident. The entries below are the exploited flaw class, the data class at risk and the detections that would surface the same pattern elsewhere.","confidence":"high","source":"analyst assessment of available reporting"},{"type":"ttp","value":"Authorisation flaw in a multi-tenant banking platform exploited to retrieve saved payee records (broken object-level authorisation pattern)","context":"No CVE, no patch, no scanner finds it reliably. This is why approximately 1.4 million malicious requests could be served before detection.","confidence":"medium","source":"Irish Times and BleepingComputer via secondary reporting"},{"type":"behaviour","value":"Approximately 1.4 million malicious requests against record-retrieval endpoints","context":"The volumetric signature. One outlet reports 5 million instead; the lower figure is from the better sources. Either way it is far outside human interface use and should have alerted.","confidence":"medium","source":"Irish Times and BleepingComputer; 5 million figure from a lower-quality outlet"},{"type":"ttp","value":"Saved payee records (names plus account identifiers) as the target data class","context":"A precision social-engineering set: it tells an attacker who each member genuinely pays. The resulting fraud presents as the member authorising a payment, not as a breach.","confidence":"high","source":"Wellington IT and Irish League of Credit Unions statements via secondary reporting"},{"type":"ttp","value":"Authorised push payment fraud using a genuine named payee and a request to change account details","context":"The predictable follow-on. Contact-centre verification must be out of band; a caller who names the real payee will pass any check that treats that knowledge as proof of identity.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Six-week gap between the October attack and notification of affected credit unions on 17 November 2026","context":"The 18 November story. Minister Robert Troy called the delay 'not acceptable'. For UK readers this is the shape of failure the Cyber Security and Resilience Bill's reporting duties target.","confidence":"high","source":"Irish government statements via trade and national press"},{"type":"behaviour","value":"Single session or source IP retrieving more distinct customer records per hour than the user interface permits","context":"The detection that catches this flaw class. Keep it permanently on any endpoint that returns a record keyed by an identifier.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Mixed 403 and 200 responses to sequential or incremented record identifiers from one source","context":"The discovery phase, before the harvest. Cheaper to detect and far earlier than the bulk retrieval.","confidence":"medium","source":"analyst assessment"},{"type":"account","value":"Supplier and platform-vendor administrative accounts on customer-data systems","context":"The structural exposure in a shared-platform model: dozens of regulated institutions could not have detected this themselves because the platform is not theirs to instrument.","confidence":"high","source":"analyst assessment"},{"type":"ttp","value":"Single supplier serving more than a third of a national sector's institutions","context":"Wellington IT is reported to provide the banking platform to over a third of credit unions in Ireland. Concentration risk is the finding, and it is the same finding in UK local government, NHS trusts and MSP-served SMEs.","confidence":"medium","source":"secondary reporting"},{"type":"note","value":"FIGURES CONFLICT BETWEEN OUTLETS","context":"Credit union counts range from 40 to 50; malicious requests are reported as 1.4 million (Irish Times, BleepingComputer) or 5 million (lower-quality outlet); the 1.8 million figure is the Irish Times's estimate of potential reach, not a confirmed count of affected individuals.","confidence":"high","source":"analyst comparison of sources"},{"type":"note","value":"NO UK CREDIT UNION NAMED AS AFFECTED","context":"Reporting identifies Irish credit unions. The UK relevance is the supplier's jurisdiction, the cross-border sector, and the regulatory parallel - not a confirmed UK victim.","confidence":"high","source":"analyst assessment"}],"references":["https://www.bleepingcomputer.com/news/security/data-breach-impacts-40-irish-credit-unions-in-reported-it-provider-hack/","https://www.irishtimes.com/your-money/2026/11/17/suspected-data-breach-at-43-credit-unions-could-affect-hundreds-of-thousands-of-members/","https://www.ireland-live.ie/north-west/donegal-live/local-credit-unions-update-members-following-cybersecurity-breach-9358685","https://the420.in/attackers-exploit-authorization-flaw-to-access-payee-data-at-40-credit-unions-in-ireland/","https://www.newsy-today.com/minister-troy-concerned-over-delayed-disclosure-of-credit-union-cyberattack/","https://en.wikipedia.org/wiki/Cyber_Security_and_Resilience_Bill"]},{"rank":5,"id":"TI-2026-11-19-005","title":"Microsoft's Official 'agent-framework' PyPI Package Was Hijacked on 17 November and Shipped a Credential Stealer in Versions 1.26.1 and 1.26.2 That Runs on Every Python Start Without Being Imported, Harvesting Azure, GitHub Actions OIDC, AWS and Docker Secrets","cve_ids":[],"vendor":"Microsoft (agent-framework on PyPI) - publisher account compromise, not a code vulnerability","affected_products":["agent-framework on PyPI, versions 1.26.1 (published 20:35 UTC, 17 November 2026) and 1.26.2 (21:08 UTC) - both now removed from PyPI","Last known-good version: 1.26.0","Any build agent, developer workstation, container image or CI pipeline that installed or resolved those versions in the approximately 33-minute-plus window and the hours before removal","Credential scopes reported targeted: Azure, Azure DevOps, GitHub (including GitHub Actions OIDC tokens in 1.26.2), AWS, Docker, Hugging Face and OpenAI"],"category":"incident","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-18","last_updated":"2026-11-19","confidence":"high","summary":"An attacker published two malicious releases of Microsoft's official agent-framework package to PyPI on 17 November 2026 - version 1.26.1 at 20:35 UTC and 1.26.2 at 21:08 UTC - each carrying a credential stealer. Wiz found no corresponding tag or release in Microsoft's GitHub repository and no malicious code on its main branch, which places the compromise at the publishing step rather than in the source. Both versions have been removed from PyPI, Microsoft has acknowledged the incident and secured the publisher account, and how the attacker obtained publishing rights to Microsoft's official PyPI project remains unexplained. The last clean version is 1.26.0.\n\nThe mechanism is the part that makes this worse than a typical malicious package. The stealer does not wait to be imported. It installs itself through Python startup hooks - .pth files named agent_framework_meta.pth and af_runtime_diag.pth - which Python executes automatically at interpreter start. Any Python process on that machine, for any purpose, runs the stealer. A developer who pip-installed the package to evaluate it, never wrote a line of code against it, and then ran an unrelated script has been compromised. This defeats the usual reasoning that an unused dependency is a dormant dependency, and it means the blast radius is the machine, not the project.\n\nWhat it took. Secrets from environment variables, local configuration files and other running processes, with targets reported across Azure, Azure DevOps, GitHub, AWS, Docker, Hugging Face and OpenAI. Version 1.26.2 additionally requested GitHub Actions OIDC tokens - a deliberate escalation, because an OIDC token from a workflow can be exchanged for cloud access without any long-lived secret ever existing to rotate. On a CI runner the environment variables are the crown jewels by design, so a stealer that runs at interpreter start on a build agent has effectively been handed the pipeline's whole identity.\n\nUK relevance. There is no UK-specific angle and no UK organisation has been named, which is exactly why this ranks fifth rather than lower: the exposure is distributed across every UK organisation building agentic AI applications on Microsoft's stack, which in late 2026 includes a large number of government digital teams, NHS data platforms, banks and consultancies. Package name recognition is doing the attacker's work here. 'agent-framework', published by Microsoft, is precisely the dependency an engineer adds without a second thought during a prototype, and prototypes run on laptops with production cloud credentials in the environment far more often than any architecture diagram admits. This is also the second compromise of a Microsoft-related PyPI package this year, after the durabletask incident in May 2026, which makes the publisher-account control a pattern rather than an accident.\n\nThe remediation is a credential event, not a dependency event, and this distinction is where most organisations will get it wrong. Pinning to 1.26.0 stops further execution; it does not undo exposure. Any machine that resolved 1.26.1 or 1.26.2 must be treated as having had every secret reachable from its environment disclosed to a third party - which on a build agent means cloud credentials, registry tokens, signing keys and anything in the pipeline's variable groups. The correct sequence is: identify the machines, rotate everything those machines could see, then rebuild them from known-good images rather than uninstalling the package, because the .pth startup hooks are a persistence mechanism and a package uninstall is not a guaranteed removal. Then audit the cloud side for what the stolen credentials did between 17 November and rotation.\n\nThe window is narrow, which is the only good news. Roughly 33 minutes separated the two malicious publications and removal followed within hours, so the installing population is small compared with a long-lived typosquat. But 'small' and 'irrelevant' are different: a single compromised CI service principal in a UK government delivery partner is a serious incident on its own, and lockfile-driven installs resolve exact versions for weeks afterwards if a lockfile was updated inside the window.\n\nConfidence and caveats. Confidence is high. The affected versions, publication timestamps, startup-hook filenames, credential scopes, OIDC escalation in 1.26.2, removal from PyPI, Microsoft's acknowledgement and the clean 1.26.0 baseline are consistently reported by Socket, Orca Security, OX Security, Wiz, Mend, SecurityWeek, BleepingComputer and The Hacker News. The initial access method for the publisher account is unknown and should not be guessed at. No pages were fetched directly in this environment, and the file hashes of the malicious artefacts were not captured in this run - obtain them from Socket or Orca before building hash-based detections.","recommended_actions":["Search every build agent, developer workstation, container image and lockfile for agent-framework 1.26.1 or 1.26.2, and for the startup hook filenames agent_framework_meta.pth and af_runtime_diag.pth. The .pth files are the reliable indicator because they persist independently of the package metadata.","Treat every machine that resolved those versions as a credential compromise, not a malware cleanup. Rotate everything reachable from that machine's environment: Azure and AWS credentials, Azure DevOps and GitHub tokens, container registry credentials, Hugging Face and OpenAI keys, SSH keys and anything in CI variable groups.","Rebuild affected hosts from known-good images rather than uninstalling the package. Python startup hooks are a persistence mechanism, and a pip uninstall is not a guaranteed removal of files the installer placed outside the package directory.","Review GitHub Actions OIDC trust policies and cloud role assumptions for the period from 17 November to your rotation time. An OIDC token exchange leaves no long-lived secret to rotate, so the only evidence is in the cloud audit trail - look for role assumptions from unexpected workflows, repositories or IP addresses.","Pin agent-framework to 1.26.0 and require hash-pinned, lockfile-driven installs for CI, so that a future malicious publication cannot be resolved automatically. Pinning limits the next incident; it does not remediate this one.","Stop running prototypes with production credentials in the environment. The mechanism here - execution at interpreter start, regardless of import - means the exposure was the machine's whole secret surface, which on a developer laptop is usually wider than anyone has documented.","Raise the publisher-account question with Microsoft and with your own package publishing process: this is the second compromise of a Microsoft-related PyPI package in 2026 after durabletask in May. Check whether your own organisation's published packages require trusted publishing and hardware-backed MFA on the publishing identity."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Installation of agent-framework 1.26.1 or 1.26.2","description":"The primary scoping query. Catches explicit pip installs and requirements-driven resolution where the version appears on the command line; lockfile-driven installs may not, so pair this with the file-based query.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-11-17)\n| where ProcessCommandLine has \"agent-framework\" or ProcessCommandLine has \"agent_framework\"\n| where ProcessCommandLine has_any (\"pip\", \"uv\", \"poetry\", \"pipenv\", \"pdm\", \"install\", \"sync\")\n| extend MaliciousVersion = ProcessCommandLine has_any (\"1.26.1\", \"1.26.2\")\n| project Timestamp, DeviceName, AccountName, MaliciousVersion, FileName, ProcessCommandLine, InitiatingProcessCommandLine, ReportId\n| order by MaliciousVersion desc, Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Malicious Python startup hook files - the persistence mechanism","description":"The most reliable indicator. These .pth files cause the stealer to execute at every Python interpreter start regardless of whether the package is imported, and they persist through a package uninstall.","query":"DeviceFileEvents\n| where Timestamp > datetime(2026-11-17)\n| where FileName in~ (\"agent_framework_meta.pth\", \"af_runtime_diag.pth\")\n   or (FileName endswith \".pth\" and FolderPath has_any (\"site-packages\", \"dist-packages\", \"Lib\\\\site-packages\"))\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, SHA256, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Credential harvesting behaviour from a Python process","description":"The stealer reads environment variables, local credential files and other processes' memory. Hunt for Python touching the standard cloud credential locations.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-11-17)\n| where InitiatingProcessFileName has \"python\" or FileName has \"python\"\n| where ProcessCommandLine has_any (\".aws/credentials\", \".azure\", \".docker/config.json\", \".kube/config\", \".git-credentials\", \"id_rsa\", \".netrc\", \"huggingface\", \".ssh/\", \"ACTIONS_ID_TOKEN_REQUEST\", \"AZURE_CLIENT_SECRET\", \"GITHUB_TOKEN\", \"printenv\", \"os.environ\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Python process reading cloud credential files","description":"File-access view of the same behaviour, for hosts where command lines do not reveal it. On a build agent, Python reading ~/.aws/credentials outside a known deployment step is worth a look.","query":"DeviceFileEvents\n| where Timestamp > datetime(2026-11-17)\n| where InitiatingProcessFileName has \"python\"\n| where FolderPath has_any (\".aws\", \".azure\", \".docker\", \".kube\", \".ssh\", \".config/gh\", \"huggingface\", \"npm\") or FileName in~ (\"credentials\", \"config.json\", \"id_rsa\", \".netrc\", \"hosts.yml\")\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, InitiatingProcessAccountName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound exfiltration from a Python process on a build agent","description":"Exfiltration destination is unpublished, so this is shaped by exclusion: Python egress from a build agent to anything that is not a package index or your own infrastructure. Replace the allowlist with your own.","query":"let KnownIndexes = dynamic([\"pypi.org\", \"files.pythonhosted.org\", \"pypi.python.org\", \"ghcr.io\", \"github.com\", \"dev.azure.com\", \"registry.npmjs.org\"]);\nDeviceNetworkEvents\n| where Timestamp > datetime(2026-11-17)\n| where InitiatingProcessFileName has \"python\"\n| where ActionType == \"ConnectionSuccess\"\n| where isnotempty(RemoteUrl)\n| where not(RemoteUrl has_any (KnownIndexes))\n| summarize Connections = count(), Ports = make_set(RemotePort, 10), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, RemoteUrl, RemoteIP, InitiatingProcessCommandLine\n| order by Connections desc"},{"platform":"sentinel","table":"AzureActivity","name":"Azure activity from service principals after 17 November - what the stolen credentials did","description":"The post-rotation audit question. Look for service principal activity from new IP addresses, new regions, or performing operations the principal has never performed before.","query":"AzureActivity\n| where TimeGenerated > datetime(2026-11-17)\n| where isnotempty(tostring(Claims))\n| extend Principal = coalesce(tostring(parse_json(tostring(Claims))[\"appid\"]), Caller)\n| summarize Operations = count(), Ops = make_set(OperationNameValue, 20), IPs = make_set(CallerIpAddress, 20), Resources = dcount(ResourceId) by Principal, bin(TimeGenerated, 1d)\n| order by TimeGenerated desc, Operations desc"},{"platform":"sentinel","table":"SigninLogs","name":"Service principal and workload identity sign-ins from new locations after the compromise window","description":"Workload identities have stable sign-in geography. A service principal authenticating from a new country or ASN after 17 November is the clearest available signal that a stolen credential is being used.","query":"let Baseline = materialize(SigninLogs\n  | where TimeGenerated between (ago(90d) .. datetime(2026-11-17))\n  | summarize KnownIPs = make_set(IPAddress, 1000), KnownCountries = make_set(tostring(LocationDetails.countryOrRegion), 50) by ServicePrincipalName);\nSigninLogs\n| where TimeGenerated > datetime(2026-11-17)\n| where isnotempty(ServicePrincipalName) and ResultType == 0\n| extend Country = tostring(LocationDetails.countryOrRegion)\n| join kind=leftouter Baseline on ServicePrincipalName\n| where isempty(KnownCountries) or Country !in (KnownCountries)\n| project TimeGenerated, ServicePrincipalName, AppDisplayName, IPAddress, Country, ResourceDisplayName\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"GitHubAudit_CL","name":"GitHub Actions OIDC token exchange and workflow anomalies","description":"Assumes GitHub audit logs are ingested; rename to match your table. Version 1.26.2 specifically requested Actions OIDC tokens, and an OIDC exchange leaves no secret to rotate - the cloud and GitHub audit trails are the only evidence.","query":"GitHubAudit_CL\n| where TimeGenerated > datetime(2026-11-17)\n| where action_s has_any (\"oidc\", \"workflows\", \"secret\", \"pat\", \"token\", \"repo.add_member\", \"protected_branch\")\n| summarize Events = count(), Actions = make_set(action_s, 20), Actors = make_set(actor_s, 20), IPs = make_set(actor_ip_s, 20) by repo_s, bin(TimeGenerated, 1d)\n| order by TimeGenerated desc"}],"iocs":[{"type":"malware","value":"agent-framework 1.26.1 and 1.26.2 (PyPI)","context":"The two malicious releases, published at 20:35 and 21:08 UTC on 17 November 2026 and since removed from PyPI. Last clean version is 1.26.0.","confidence":"high","source":"Socket, Orca Security and Microsoft acknowledgement via trade press"},{"type":"filename","value":"agent_framework_meta.pth","context":"Python startup hook that causes the stealer to execute at every interpreter start regardless of whether the package is imported. The most reliable indicator, and it survives a package uninstall.","confidence":"high","source":"Socket and Orca Security"},{"type":"filename","value":"af_runtime_diag.pth","context":"Second startup hook used by the same payload. Search site-packages and dist-packages for both names.","confidence":"high","source":"Socket and Orca Security"},{"type":"ttp","value":"Execution at Python interpreter start via .pth startup hooks, with no import required","context":"Why an unused dependency is not a dormant dependency here. The blast radius is the machine's entire secret surface, not the project that declared the package.","confidence":"high","source":"Socket, Mend and Orca Security"},{"type":"ttp","value":"GitHub Actions OIDC token request added in version 1.26.2","context":"Deliberate escalation. An OIDC token exchanges for cloud access with no long-lived secret involved, so there is nothing to rotate and the only evidence is in the cloud and GitHub audit trails.","confidence":"high","source":"Socket"},{"type":"ttp","value":"Publisher-account compromise rather than source compromise","context":"Wiz found no matching tag or release in Microsoft's GitHub repository and no malicious code on main. The initial access method for the publishing identity is unexplained.","confidence":"high","source":"Wiz via trade press"},{"type":"behaviour","value":"Python process reading ~/.aws/credentials, ~/.azure, ~/.docker/config.json, ~/.ssh or environment secrets","context":"The harvesting behaviour. Reported scopes: Azure, Azure DevOps, GitHub, AWS, Docker, Hugging Face and OpenAI.","confidence":"high","source":"Socket, Orca Security and OX Security"},{"type":"behaviour","value":"Secrets read from the memory of other running processes","context":"Reported as part of the collection, which extends exposure beyond files and environment variables to whatever else was running on the host at the time.","confidence":"medium","source":"trade press summaries of vendor analysis"},{"type":"ttp","value":"Trusted vendor package name used to bypass engineering scrutiny","context":"'agent-framework', published by Microsoft, is the dependency an engineer adds during a prototype without review. The name is the social engineering.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Second compromise of a Microsoft-related PyPI package in 2026, after durabletask in May","context":"Makes publisher-account security a pattern rather than an accident, and a reasonable question to put to the vendor and to your own publishing process.","confidence":"medium","source":"trade press"},{"type":"behaviour","value":"Lockfile updated between 17 and 19 November 2026 referencing agent-framework","context":"The population that keeps installing a removed version. Pinned and hash-locked builds resolve exact versions long after PyPI has taken them down.","confidence":"high","source":"analyst assessment"},{"type":"note","value":"NO FILE HASHES OR EXFILTRATION INFRASTRUCTURE CAPTURED IN THIS RUN","context":"Socket and Orca published analysis including artefact detail; the hashes and exfiltration endpoints were not captured here. Obtain them from those sources before building hash- or network-based detections.","confidence":"high","source":"analyst assessment"},{"type":"note","value":"APPROXIMATELY 33 MINUTES SEPARATED THE TWO PUBLICATIONS; REMOVAL FOLLOWED WITHIN HOURS","context":"The installing population is small compared with a long-lived typosquat. Small is not zero: one compromised CI service principal is a full incident.","confidence":"high","source":"Orca Security and Socket"}],"references":["https://www.bleepingcomputer.com/news/security/microsofts-agent-framework-pypi-package-compromised-to-steal-credentials/","https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer","https://orca.security/resources/research/microsoft-agent-framework-pypi-supply-chain-attack-versions-1-26-1-and-1-26-2-steal-cloud-credentials/","https://www.ox.security/blog/breaking-hijacked-releases-of-microsofts-official-agent-framework-steals-azure-and-ci-credentials/","https://www.securityweek.com/microsoft-agent-framework-releases-poisoned-with-credential-stealer/","https://thehackernews.com/2026/11/attackers-compromise-microsofts-agent.html","https://www.mend.io/blog/microsoft-agent-framework-pypi-credential-stealer/","https://cybersecuritynews.com/microsofts-agent-framework-pypi-package/","https://opensourcemalware.com/blog/agent-framework-pypi-compromised"]},{"rank":6,"id":"TI-2026-11-19-006","title":"The Other Three CISA KEV Additions of 18 November - Synology DiskStation CVE-2024-10441 Under Ransomware Attack With a Patch Available Since November 2024, Vanderbilt REDCap CVE-2026-90817 (CVSS 9.8, Unauthenticated RCE) Which Sits Inside Hundreds of UK University and NHS Research Estates, and BerriAI LiteLLM CVE-2026-40217 Being Used for LLMjacking","cve_ids":["CVE-2024-10441","CVE-2026-90817","CVE-2026-40217"],"vendor":"Synology (DiskStation Manager); Vanderbilt University (REDCap); BerriAI (LiteLLM)","affected_products":["Synology DiskStation Manager - CVE-2024-10441, fixes available since November 2024; exploited in ransomware attacks against internet-exposed NAS devices. KEV due 21 November 2026","Vanderbilt REDCap 13.3.0 and later - CVE-2026-90817, code injection permitting unauthenticated remote code execution, CVSS 9.8. KEV due 21 November 2026","BerriAI LiteLLM - CVE-2026-40217, remote code execution via the proxy's guardrail test endpoint. KEV due 2 December 2026. CVSS disputed: 8.8, 7.5 and 5.9 reported by different sources","UK exposure concentrates in universities and NHS research (REDCap), small-business and departmental file shares (DSM), and AI gateway deployments in AI-enabled organisations (LiteLLM)"],"category":"vulnerability_bundle","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-21","patch_available":"yes","first_reported":"2026-11-18","last_updated":"2026-11-19","confidence":"high","summary":"CISA added four vulnerabilities to the Known Exploited Vulnerabilities catalogue on 18 November 2026. The Apache Axis flaw is at rank 2; the other three are bundled here because each is individually serious, each lands on a different part of the UK estate, and together they describe a three-day remediation window that most organisations will not have noticed. Three of the four carry a 21 November deadline - a three-day clock - and the LiteLLM flaw is due 2 December.\n\nREDCap CVE-2026-90817 is the one UK readers are most likely to under-rate and the reason this entry ranks sixth rather than lower. REDCap - Research Electronic Data Capture, from Vanderbilt University - is the clinical and academic research data platform used by an enormous number of UK universities, NHS trusts and research institutes, typically deployed and maintained by a research IT team or a departmental administrator rather than by central security, and typically holding exactly the data that would be most damaging to lose: identifiable participant records, clinical trial data, consent records. The flaw is a code injection permitting unauthenticated remote code execution with a CVSS of 9.8, affecting REDCap 13.3.0 and later. CISA has evidence of exploitation. The structural problem is ownership: in most UK institutions nobody in the security function knows how many REDCap instances exist, because they were each stood up by a different research group with a different funding stream. The action is therefore a discovery action first - find the instances, including the ones on departmental servers and in cloud subscriptions nobody tracks - and then a patching action.\n\nSynology DSM CVE-2024-10441 is a 2024 vulnerability with fixes available since November 2024, now being exploited in ransomware attacks against NAS devices. Two years of patch availability, and it is on KEV because people are losing data to it this month. The UK exposure here is overwhelmingly small and medium businesses, GP practices, schools, charities and departmental file shares - the places where a Synology box was bought as cheap storage, exposed through QuickConnect or a port-forward so that people could get at files from home, and then never touched again. These are not organisations with a patch cycle, and the device is often the only copy of the data, which is what makes ransomware against NAS so effective. The action is simple and unpopular: find them, update DSM, and take them off the internet. A NAS does not need an internet-facing management interface, and if remote access is genuinely required it belongs behind a VPN.\n\nLiteLLM CVE-2026-40217 is the newest exposure class in the bundle. LiteLLM is a proxy that gives applications a single API in front of many model providers, and the flaw allows remote attackers to execute code through the proxy's guardrail test endpoint. Reporting links the exploitation to LLMjacking - stealing an organisation's model credentials and reselling inference capacity - which makes the direct financial loss the provider bill rather than a data breach, though a compromised AI gateway also sees every prompt and response flowing through it, and in a UK government or healthcare context those prompts may contain personal data. Note that the deadline is 2 December, not 21 November, which is an interesting asymmetry given that it is the newest flaw. CVSS is disputed across sources at 8.8, 7.5 and 5.9; judge it on the position of the asset instead. The fix is to upgrade, block the guardrail test route, and rotate the model provider keys the proxy holds - the last of which is the step that stops the financial bleeding.\n\nHow to use the three-day deadline. UK organisations have no obligation to CISA. The value of the 21 November date is that it is a published, defensible deadline for a conversation with a research director who does not want their REDCap instance taken offline, or with a practice manager who likes being able to reach the NAS from home. The exploitation evidence is CISA's, not a vendor's marketing, and that is usually enough to move a decision that has been stuck.\n\nConfidence and caveats. Confidence is high on the KEV additions, the CVE identifiers, the 21 November and 2 December deadlines, the REDCap CVSS of 9.8 and the affected version floor of 13.3.0, and the Synology fix availability since November 2024. The LiteLLM CVSS is genuinely disputed across three figures and no vendor advisory was read at source. The LLMjacking and ransomware attribution for LiteLLM and DSM respectively come from CISA framing relayed through trade press rather than from named incident reports. No UK victim has been identified for any of the three. No pages were fetched directly in this environment.","recommended_actions":["Run a REDCap discovery exercise today, before patching: query DNS, certificate transparency logs and cloud subscriptions for redcap hostnames, and ask research and faculty IT directly. In most UK universities and trusts the security function does not know how many instances exist, and an unpatched instance holding identifiable trial data is the worst case in this bundle.","Patch REDCap to the version addressing CVE-2026-90817 (affects 13.3.0 and later) against the 21 November deadline, and where an instance cannot be patched in time, remove it from internet reachability rather than leaving it exposed - the flaw is unauthenticated.","Find and update every Synology DiskStation, then take its management interface off the internet. Disable QuickConnect and remove port-forwards; if remote file access is needed, put it behind a VPN. Fixes for CVE-2024-10441 have been available for two years and ransomware operators are using it now.","Verify that NAS devices are not the only copy of the data they hold. Ransomware against NAS is effective precisely because the device is frequently both the primary store and the backup; a backup that the NAS can write to is not a backup.","For LiteLLM, upgrade, block the guardrail test endpoint at the gateway, and rotate every model provider API key the proxy holds. The key rotation is what stops the cost accumulating if credentials have already been taken.","Treat the AI gateway as a system that sees personal data, because it does. Every prompt and response passing through LiteLLM is visible to whoever controls it, which in a government or healthcare deployment makes a gateway compromise a data incident and not only a billing one.","Use 21 November as the internal deadline in the conversations where you need external authority: CISA's exploitation evidence is a stronger argument with a reluctant research director or practice manager than a CVSS score is."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Exposure across the three 18 November KEV additions","description":"Single exposure check for the bundle. Expect REDCap and LiteLLM to be absent from vulnerability feeds - both are typically self-hosted outside managed software inventory - so treat an empty result as an inventory gap.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId in (\"CVE-2024-10441\", \"CVE-2026-90817\", \"CVE-2026-40217\")\n   or SoftwareName has_any (\"diskstation\", \"synology\", \"redcap\", \"litellm\")\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion, CveId, VulnerabilitySeverityLevel\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by CveId, SoftwareName, SoftwareVersion\n| order by Hosts desc"},{"platform":"sentinel","table":"DnsEvents","name":"REDCap instance discovery from internal DNS","description":"The discovery step that precedes patching. Research-managed REDCap instances surface in DNS long before they appear in any asset register.","query":"DnsEvents\n| where TimeGenerated > ago(30d)\n| where Name has_any (\"redcap\", \"rc.\", \"research-data\", \"trials\", \"ctu.\")\n| summarize Queries = count(), Clients = dcount(ClientIP), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Name\n| order by Queries desc"},{"platform":"sentinel","table":"W3CIISLog","name":"REDCap unauthenticated code injection attempts","description":"Hunts for injection-shaped input on REDCap endpoints reachable before authentication. Tune the parameter names to your deployment's actual surface.","query":"W3CIISLog\n| where TimeGenerated > ago(21d)\n| where csUriStem has_any (\"redcap\", \"/api/\", \"surveys\", \"DataEntry\", \"Design\", \"plugins\")\n| where csUriQuery has_any (\"system(\", \"exec(\", \"passthru\", \"shell_exec\", \"eval(\", \"base64_decode\", \"php://\", \"data://\", \"${\", \"\u003c?php\")\n   or csUriStem has_any (\".php.\", \"%00\")\n| project TimeGenerated, Computer, cIP, csMethod, csUriStem, csUriQuery, scStatus, csUserAgent\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Web server or PHP process spawning a shell on a research data platform","description":"The consequence of successful REDCap exploitation. On a research data capture platform this should be empty; any hit is an incident.","query":"DeviceProcessEvents\n| where Timestamp > ago(21d)\n| where DeviceName has_any (\"redcap\", \"research\", \"ctu\", \"trial\") or InitiatingProcessFileName in~ (\"php\", \"php-fpm\", \"httpd\", \"apache2\", \"w3wp.exe\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"nc\", \"python\", \"python3\", \"perl\", \"base64\", \"chmod\", \"cmd.exe\", \"powershell.exe\")\n| project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Internet-exposed NAS management interfaces and QuickConnect traffic","description":"Finds the Synology exposure. The remediation is to make these results empty rather than to tune the query.","query":"CommonSecurityLog\n| where TimeGenerated > ago(14d)\n| where DestinationPort in (5000, 5001, 5005, 5006) or RequestURL has_any (\"quickconnect\", \"webapi\", \"DSM\", \"synology\", \"entry.cgi\", \"webman\")\n| summarize Sessions = count(), SourceIPs = dcount(SourceIP), Countries = make_set(DeviceCustomString1, 10) by DestinationIP, DestinationPort, DeviceAction\n| order by Sessions desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Mass file rename or encryption extension activity on network shares","description":"The ransomware consequence for NAS. Detects bulk renames to ransomware extensions and ransom-note creation on mapped shares, which is often the only telemetry available when the NAS itself is unmanaged.","query":"DeviceFileEvents\n| where Timestamp > ago(14d)\n| where ActionType in (\"FileRenamed\", \"FileCreated\", \"FileModified\")\n| where FileName endswith_cs \".encrypted\" or FileName endswith_cs \".locked\" or FileName endswith_cs \".crypt\"\n   or FileName matches regex @\"(?i)(readme|how.?to.?decrypt|restore.?files|_?recover).*\\.(txt|html|hta)$\"\n| summarize Files = count(), Folders = dcount(FolderPath), Sample = make_set(FileName, 10) by DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName, bin(Timestamp, 15m)\n| where Files > 20\n| order by Files desc"},{"platform":"sentinel","table":"W3CIISLog","name":"LiteLLM guardrail test endpoint access","description":"The exploited route in CVE-2026-40217. Any external access to a guardrail or test endpoint on an AI gateway should be investigated and then blocked.","query":"W3CIISLog\n| where TimeGenerated > ago(21d)\n| where csUriStem has_any (\"guardrail\", \"/v1/\", \"litellm\", \"/chat/completions\", \"/health\", \"/test\", \"/model/new\", \"/key/generate\")\n| summarize Requests = count(), Statuses = make_set(scStatus, 10), Agents = make_set(csUserAgent, 10) by cIP, csUriStem, Computer\n| order by Requests desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"LLMjacking signal - model API usage anomaly after a gateway compromise","description":"The financial consequence. Stolen model keys present as inference volume from unexpected sources or at unexpected hours; the provider bill is usually the first alert, which is too late.","query":"CloudAppEvents\n| where Timestamp > ago(30d)\n| where Application has_any (\"OpenAI\", \"Azure OpenAI\", \"Anthropic\", \"Bedrock\", \"Vertex\", \"LiteLLM\")\n| summarize Events = count(), IPs = dcount(IPAddress), SampleIPs = make_set(IPAddress, 15) by Application, AccountDisplayName, bin(Timestamp, 1h)\n| order by Events desc"}],"iocs":[{"type":"note","value":"NO ATTACKER INFRASTRUCTURE PUBLISHED FOR ANY OF THE THREE","context":"CISA's KEV entries name no actors, no victims and no infrastructure. The items below are exposure conditions, prerequisites and detection behaviours.","confidence":"high","source":"CISA KEV entries via secondary reporting"},{"type":"ttp","value":"Unauthenticated code injection to remote code execution in REDCap 13.3.0 and later (CVE-2026-90817, CVSS 9.8)","context":"The highest-impact item in the bundle for UK universities and NHS research, because the platform holds identifiable participant and clinical trial data and is usually owned outside central security.","confidence":"high","source":"CISA KEV and trade press"},{"type":"behaviour","value":"REDCap instances absent from the central asset register, stood up by individual research groups","context":"The structural exposure. Discovery via DNS, certificate transparency and direct enquiry to faculty IT must precede patching, because you cannot patch what nobody has told you about.","confidence":"high","source":"analyst assessment"},{"type":"ttp","value":"Synology DSM CVE-2024-10441 exploited in ransomware attacks against internet-exposed NAS devices","context":"Fixes available since November 2024. KEV listing two years later means organisations are losing data to it now, overwhelmingly in UK SMEs, GP practices, schools and charities.","confidence":"high","source":"Synology disclosure and CISA KEV via trade press"},{"type":"port","value":"5000/tcp and 5001/tcp (Synology DSM management)","context":"The exposure condition. A NAS does not need an internet-facing management interface; the remediation is to make these unreachable rather than to monitor them.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Synology QuickConnect enabled on a device holding the only copy of business data","context":"The combination that makes NAS ransomware effective: convenient remote reach plus no independent backup. A backup the NAS can write to is not a backup.","confidence":"high","source":"analyst assessment"},{"type":"ttp","value":"Remote code execution via the LiteLLM proxy guardrail test endpoint (CVE-2026-40217)","context":"KEV due 2 December. The fix is upgrade, block the route and rotate the model provider keys the proxy holds.","confidence":"high","source":"CISA KEV and trade press"},{"type":"ttp","value":"LLMjacking - theft of model provider credentials to resell inference capacity","context":"The reported motive for LiteLLM exploitation. The immediate loss is the provider bill; the ignored loss is that the gateway sees every prompt and response, which in UK government or healthcare use may be personal data.","confidence":"medium","source":"CISA framing via trade press"},{"type":"uri_path","value":"/guardrails and guardrail test routes on an AI gateway","context":"Exploited route. Should not be reachable from the internet on any deployment.","confidence":"medium","source":"trade press summaries"},{"type":"behaviour","value":"Inference volume against model provider APIs from unexpected source addresses or at unexpected hours","context":"The LLMjacking detection. Without it the first alert is the provider invoice.","confidence":"medium","source":"analyst assessment"},{"type":"behaviour","value":"Bulk file rename to ransomware extensions, or ransom-note creation, on mapped network shares","context":"Where the NAS itself is unmanaged, client-side telemetry on mapped shares is often the only available detection of NAS encryption.","confidence":"high","source":"analyst assessment"},{"type":"note","value":"LITELLM CVSS IS DISPUTED ACROSS THREE FIGURES","context":"8.8, 7.5 and 5.9 are each reported by different sources, and no vendor advisory was read at source. Judge it on the position of the asset - an AI gateway holding every model key - rather than on the number.","confidence":"high","source":"analyst comparison of sources"},{"type":"note","value":"THREE-DAY KEV DEADLINE IS UNUSUALLY SHORT","context":"Synology DSM, REDCap and Apache Axis are all due 21 November, three days after addition. LiteLLM is due 2 December. The asymmetry is unexplained in the published material.","confidence":"high","source":"CISA KEV via secondary reporting"}],"references":["https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog","https://thehackernews.com/2026/11/cisa-warns-of-4-exploited-flaws-linked.html","https://securityonline.info/cisa-adds-4-exploited-flaws-kev-synology-litellm/","https://shattered.io/litellm-axis-redcap-synology-dsm-four-flaws-join-cisa-kev-nov-18/","https://mlq.ai/news/cisa-gives-agencies-three-days-to-fix-exploited-redcap-synology-and-apache-axis-flaws/","https://www.agentbeam.com/blog/litellm-cve-2026-40217-cisa-kev-guardrail-sandbox-rce-november-2026","https://heise.de/news/Angriffe-auf-Luecken-in-Apache-Axis-und-Roller-LiteLLM-Synology-und-mehr-11530429.html","https://www.cisa.gov/known-exploited-vulnerabilities-catalog"]},{"rank":7,"id":"TI-2026-11-19-007","title":"Apache Confirmed Active Exploitation of Roller CVE-2026-129448 - an Unauthenticated XML-RPC Deserialization RCE Reaching Back to Version 4.0.0 That Is the Same Bug as September's CVE-2026-82384, and Disabling XML-RPC in the Admin UI Does Not Close It","cve_ids":["CVE-2026-129448","CVE-2026-82384"],"vendor":"Apache Software Foundation (Roller)","affected_products":["Apache Roller 4.0.0 through 6.1.4 - fixed in 6.1.6; 6.1.7 is current","Roller 6.1.5 was the September fix for CVE-2026-82384, which Apache now states is the same underlying bug - instances patched in September should still move to 6.1.6 or later","Exposure is the XML-RPC servlet, reachable without authentication; disabling XML-RPC through the Roller administration UI is explicitly NOT sufficient"],"category":"vulnerability","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-17","last_updated":"2026-11-19","confidence":"high","summary":"Apache has publicly confirmed active exploitation of CVE-2026-129448, an unsafe deserialization flaw in Apache Roller's XML-RPC endpoint that yields unauthenticated remote code execution, rated CVSS 9.8. Most sources date the CVE publication to 17 November, with confirmation of active exploitation reported on 18 November - which places the confirmation inside this window and is why the entry is carried forward from yesterday's bundle as an item in its own right.\n\nThe detail that will catch people out. Apache states that this is the same underlying bug as CVE-2026-82384, which was patched in September for Roller 6.1.5. An organisation that patched in September, closed the ticket and recorded the vulnerability as remediated is, on Apache's own account, still exposed, and must move to 6.1.6 or later. This is the second instance in a week of a remediation record being wrong rather than absent - yesterday's run recorded the Zyxel KEV entry naming the wrong CVE - and it is worth treating as a pattern for the vulnerability management function: a closed ticket is evidence that an action was taken, not that the exposure is gone. The affected range is also far wider than the September advisory implied, reaching back to Roller 4.0.0.\n\nThe second detail that will catch people out. Apache has said explicitly that disabling XML-RPC through the Roller administration UI is not sufficient. The effective temporary mitigation is to disable the extensions setting in web.xml or to remove the XML-RPC servlet mapping outright, then restart Roller. Any organisation that responded to the September advisory by unticking a box in the admin interface has a mitigation that does not mitigate. Verify by requesting the XML-RPC endpoint and confirming it does not respond, rather than by checking a setting.\n\nThe structural pattern across this window. Roller is the third unauthenticated deserialization flaw in a legacy XML endpoint on this feed's top ten today - alongside Apache Axis at rank 2 and, by mechanism, the Puppet deserialization flaw still inside the KEV deadline board at rank 9. XML-RPC and SOAP endpoints share a characteristic that makes them unusually dangerous: they parse untrusted structured input before the authentication decision, they are enabled by default in software written when that was normal, and almost nobody uses them any more, so nobody notices they are open. The generalisable action is bigger than any of the three CVEs: enumerate and disable legacy XML and SOAP endpoints across the estate, because they will keep producing this class of flaw and nobody is relying on them.\n\nUK relevance, stated honestly. Roller's UK installed base is modest - it is a Java blogging platform, found mainly in universities, legacy corporate intranets and self-hosted publishing estates, and far less common than Confluence. No UK victim has been named and no UK advisory published. The entry earns rank 7 on three grounds rather than on footprint: Apache has confirmed exploitation rather than hinted at it, the fix is simple and available, and the stale-remediation trap means a UK organisation can be exposed while believing it is patched. Where Roller does exist in a UK estate it is usually forgotten, internet-facing and owned by someone who left, which is also the profile of the host that will not get patched this week.\n\nWhat Apache has not said. No attacker attribution, no victim count, no indicators of compromise, and no description of what follows exploitation. There is nothing to pattern-match against, so the available controls are version state, endpoint reachability and detection of post-exploitation behaviour on the host. The flaw was not in CISA's KEV catalogue as at the 13 November release and was not among the four additions of 18 November; given confirmed exploitation, a future KEV addition would be unsurprising and should not be waited for.\n\nConfidence and caveats. Confidence is high. Apache's confirmation of exploitation, the CVSS 9.8 rating, the 4.0.0-to-6.1.4 affected range, the 6.1.6 fix, the identity with CVE-2026-82384 and the insufficiency of the admin-UI toggle are consistently reported across The Hacker News, BleepingComputer, Corgea and several trackers. Sources differ slightly on the affected range and on whether the exploitation confirmation fell on 17 or 18 November. No exploitation volume, actor or victim detail is available. No pages were fetched directly in this environment.","recommended_actions":["Upgrade Apache Roller to 6.1.6 or later - 6.1.7 is current. Do this even if you patched in September: Apache states CVE-2026-129448 is the same bug as CVE-2026-82384, so 6.1.5 is not sufficient.","Re-open any Roller ticket closed in September. A remediation record that says 'patched to 6.1.5' is now evidence of an exposure, not of a fix. Check how many other closed tickets in your register rest on a vendor advisory that has since been widened.","If you cannot upgrade immediately, disable the extensions setting in web.xml or remove the XML-RPC servlet mapping, then restart Roller. Do not rely on disabling XML-RPC in the Roller administration UI - Apache has said explicitly that this is not sufficient.","Verify the mitigation by req
