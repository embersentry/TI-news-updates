<!doctype html>
<html lang="en" data-palette="#FF5A1F,#FF8C1A,#9A958C">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat Intelligence Brief</title>
<meta name="description" content="Daily threat intelligence brief: ranked vulnerabilities with analyst summaries, KQL hunting queries and IOCs.">
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --raised:#1C1C1A;
    --border:#2E2E2B;
    --border-strong:#403F3A;
    --ink:#F4F0E6;
    --ink-dim:#C9C4B8;
    --muted:#9A958C;
    --accent:#FF6A1A;
    --accent-hot:#FF5A1F;
    --accent-soft:rgba(255,106,26,.12);
    --accent-line:rgba(255,106,26,.32);
    --bar:rgba(255,106,26,.5);
    --radius:4px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- masthead ---------- */
  header.mast{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#121211 0%,var(--bg) 100%)}
  .mast-in{max-width:var(--maxw);margin:0 auto;padding:28px 16px 24px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{width:30px;height:30px;flex:none}
  .brand-txt h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .brand-txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .stamp{display:flex;flex-wrap:wrap;gap:22px}
  .stamp div{min-width:0}
  .stamp dt{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .stamp dd{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap}
  .stamp dd b{color:var(--accent);font-weight:600}

  /* ---------- priority banner ---------- */
  .alert{margin:22px 0 0;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-left:3px solid var(--accent-hot);border-radius:var(--radius);padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start}
  .alert svg{flex:none;margin-top:2px}
  .alert .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
    font-weight:650;margin:0 0 3px}
  .alert p{margin:0;font-size:14px;color:var(--ink)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:var(--radius);margin:22px 0 0;overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .tile{background:var(--surface);padding:14px 16px 13px}
  .tile .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;display:block}
  .tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
  .tile.hot .n{color:var(--accent-hot)}
  .tile.warn .n{color:var(--accent)}

  /* ---------- posture bar ---------- */
  .posture{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 14px}
  .posture h2{margin:0 0 11px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .pbar{display:flex;gap:2px;height:12px;border-radius:2px;overflow:hidden;background:var(--bg)}
  .pseg{min-width:3px}
  .pseg.s-exploited{background:var(--accent-hot)}
  .pseg.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .pseg.s-none{background:var(--muted)}
  .plegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px}
  .plegend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-dim)}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none}
  .swatch.s-exploited{background:var(--accent-hot)}
  .swatch.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .swatch.s-none{background:var(--muted)}
  .plegend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 0;
    padding-bottom:18px;border-bottom:1px solid var(--border)}
  .search{position:relative;flex:1 1 230px;min-width:0}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:var(--radius);padding:9px 11px 9px 34px;font-size:14px;font-family:var(--sans)}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);
    border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
    transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
  .chip:hover{border-color:var(--border-strong);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A;font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{background:transparent;border:1px solid var(--border);color:var(--ink-dim);border-radius:var(--radius);
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

  /* ---------- entry cards ---------- */
  .entries{margin:0;padding:0;list-style:none}
  .card{border-bottom:1px solid var(--border)}
  .card.is-open{background:var(--surface)}
  .chead{display:flex;gap:16px;padding:20px 4px;cursor:pointer;align-items:flex-start;
    width:100%;background:none;border:0;text-align:left;font-family:inherit;color:inherit}
  .chead:hover .ctitle{color:var(--accent)}
  .chead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{flex:none;width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;
    font-family:var(--mono);font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
    background:var(--raised);border:1px solid var(--border);color:var(--muted)}
  .card[data-status="exploited_in_the_wild"] .rank{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .cbody{flex:1;min-width:0}
  .ctitle{margin:0;font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;
    transition:color .12s}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
  .teaser{margin:10px 0 0;font-size:14px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.is-open .teaser{display:none}
  .caret{flex:none;color:var(--muted);transition:transform .15s;margin-top:7px}
  .card.is-open .caret{transform:rotate(90deg);color:var(--accent)}

  /* pills: status differentiated by WEIGHT + always a text label, never hue alone */
  .pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
    padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;
    align-items:center;gap:5px;line-height:1.5}
  .pill.st-exploited{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.st-attempts{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.st-none{background:transparent;border-color:var(--border-strong);color:var(--muted)}
  .pill.kev{background:transparent;border-color:var(--accent-line);color:var(--accent)}
  .pill.nopatch{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.partial{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.plain{background:transparent;border-color:var(--border);color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:500;
    white-space:normal;max-width:100%;overflow-wrap:anywhere}
  .cve{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);background:var(--raised);
    border:1px solid var(--border);border-radius:3px;padding:2px 7px;white-space:nowrap}
  .cve.more{color:var(--muted);background:transparent}

  /* ---------- detail ---------- */
  .detail{display:none;padding:0 4px 30px 54px}
  .card.is-open .detail{display:block}
  .sec{margin-top:26px}
  .sec:first-child{margin-top:6px}
  .sec > h3{margin:0 0 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:650;display:flex;align-items:center;gap:9px}
  .sec > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .prose{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.72;max-width:76ch}
  .facts{display:flex;flex-wrap:wrap;border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden}
  .facts div{flex:1 1 168px;background:var(--bg);padding:10px 13px;
    border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .card.is-open .facts div{background:var(--raised)}
  .facts dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .facts dd{margin:0;font-size:13px;font-family:var(--mono);color:var(--ink-dim)}
  ul.list{margin:0;padding-left:0;list-style:none}
  ul.list li{position:relative;padding-left:20px;margin-bottom:8px;font-size:14px;color:var(--ink-dim);max-width:78ch}
  ul.list li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;
    background:var(--accent);border-radius:1px}
  ul.list.num{counter-reset:a}
  ul.list.num li{counter-increment:a;padding-left:26px}
  ul.list.num li::before{content:counter(a);background:none;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);top:0;left:2px;width:auto;height:auto;font-weight:600}

  /* KQL */
  .kql{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;background:var(--bg);overflow:hidden}
  .kql-head{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
    border-bottom:1px solid var(--border);background:var(--raised);flex-wrap:wrap}
  .kql-head .kn{flex:1;min-width:140px}
  .kql-head h4{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .kql-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}
  .plat{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:3px;padding:2px 7px;
    white-space:nowrap;flex:none}
  .kql pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:var(--ink-dim);tab-size:2}
  .kql pre .k{color:var(--accent)}
  .kql pre .s{color:#C9C4B8}
  .kql pre .c{color:#6E6A63;font-style:italic}
  .copy{flex:none;background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:3px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.ok{border-color:var(--accent-hot);color:var(--accent-hot)}

  /* IOC table */
  .tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:9px 13px;background:var(--raised);color:var(--muted);
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-dim)}
  tbody tr:last-child td{border-bottom:0}
  td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere;min-width:120px}
  td.t{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
  td.ctx{min-width:220px;line-height:1.55}
  td.src{font-size:12px;color:var(--muted);min-width:130px}
  .cf{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;padding:2px 7px;
    border-radius:999px;border:1px solid;white-space:nowrap}
  .cf.high{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .cf.medium{background:transparent;border-color:var(--border-strong);color:var(--ink-dim)}
  .cf.low{background:transparent;border-color:var(--border);color:var(--muted)}
  tr.is-note td{background:rgba(255,106,26,.05)}
  .note-row{font-size:12.5px;color:var(--muted);font-style:italic}
  .refs{margin:0;padding:0;list-style:none}
  .refs li{margin-bottom:7px}
  .refs a{color:var(--accent);text-decoration:none;font-size:13px;font-family:var(--mono);
    overflow-wrap:anywhere;border-bottom:1px solid transparent}
  .refs a:hover{border-bottom-color:var(--accent)}

  /* ---------- provenance ---------- */
  .prov{margin:40px 0 0;border:1px solid var(--border);border-left:3px solid var(--border-strong);
    border-radius:var(--radius);background:var(--surface)}
  .prov > summary{cursor:pointer;padding:15px 18px;font-size:13px;font-weight:600;color:var(--ink);
    list-style:none;display:flex;align-items:center;gap:10px}
  .prov > summary::-webkit-details-marker{display:none}
  .prov > summary:hover{color:var(--accent)}
  .prov > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .prov[open] > summary{border-bottom:1px solid var(--border)}
  .prov-body{padding:18px}
  .prov-body h4{margin:20px 0 9px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .prov-body h4:first-child{margin-top:0}
  .prov-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}
  .prov-body dt{font-weight:650;color:var(--accent);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding-top:3px}
  .prov-body dd{margin:0;color:var(--ink-dim)}

  footer.foot{margin:44px 0 0;border-top:1px solid var(--border);padding:20px 0 50px;
    display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  footer.foot p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .drop-hint{font-size:12px;color:var(--muted)}

  .empty{padding:60px 4px;text-align:center;color:var(--muted);font-size:14px}
  body.dragging::after{content:"Drop a TI JSON file to load it";position:fixed;inset:14px;
    border:2px dashed var(--accent);border-radius:8px;background:rgba(10,10,10,.9);color:var(--accent);
    display:grid;place-items:center;font-size:17px;font-weight:600;z-index:99;pointer-events:none}

  @media (max-width:720px){
    .brand{align-items:flex-start}
    .detail{padding-left:4px}
    .stamp{gap:16px}
    .mast-in{padding-top:22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- report archive timeline ---------- */
  .timeline{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 16px}
  .tl-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;
    justify-content:space-between;margin-bottom:14px}
  .tl-head h2{margin:0;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .tl-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-meta b{color:var(--ink);font-weight:600}
  .tl-latest{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;
    border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .tl-latest:hover{background:var(--accent-soft)}
  .tl-chart{position:relative}
  .tl-bars{display:flex;align-items:flex-end;gap:3px;height:62px;overflow-x:auto;
    overflow-y:hidden;padding-bottom:1px}
  .tl-bar{flex:1 1 0;min-width:5px;height:100%;background:none;border:0;
    padding:0;cursor:pointer;display:flex;align-items:flex-end}
  .tl-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tl-fill{width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--bar);
    transition:background .12s}
  .tl-bar:hover .tl-fill,.tl-bar:focus-visible .tl-fill{background:var(--accent)}
  .tl-bar.is-current .tl-fill{background:var(--accent-hot)}
  .tl-axis{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tl-tip{position:absolute;top:calc(100% + 8px);z-index:5;pointer-events:none;
    background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:9px 11px;min-width:190px;max-width:330px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .tl-tip[hidden]{display:none}
  .tl-tip .t-d{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 5px}
  .tl-tip .t-h{margin:0 0 7px;font-size:12.5px;color:var(--ink);line-height:1.45}
  .tl-tip .t-c{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tl-list{list-style:none;margin:17px 0 0;padding:0;border-top:1px solid var(--border)}
  .tl-list li{margin:0}
  .tl-row{display:flex;gap:14px;align-items:baseline;padding:9px 4px;
    border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
  .tl-row:hover{background:var(--raised)}
  .tl-row:hover .tl-h{color:var(--accent)}
  .tl-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tl-d{flex:none;width:86px;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .tl-h{flex:1;min-width:0;font-size:13.5px;color:var(--ink-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tl-c{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .tl-now{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:1px 7px}
  .tl-more{margin-top:13px}
  @media (max-width:720px){
    .tl-c{display:none}
    .tl-d{width:72px}
    /* Keep the caption - it is what names the series - but give it its own
       line instead of letting it wrap between the two date labels. */
    .tl-axis{flex-wrap:wrap}
    .tl-axis span:nth-child(2){order:3;flex:1 0 100%;text-align:center;margin-top:4px}
  }

  /* ---------- print ---------- */
  @media print{
    :root{--bg:#fff;--surface:#fff;--raised:#f4f2ee;--border:#d5d2cb;--border-strong:#b5b1a8;
          --ink:#111;--ink-dim:#2a2a28;--muted:#5d5a54;--accent:#B83F00;--accent-hot:#B83F00;
          --accent-soft:#faeee6;--accent-line:#e0b79e}
    body{font-size:10.5pt}
    .controls,.caret,.copy,footer.foot,.drop-hint{display:none!important}
    .detail{display:block!important;padding-left:0;page-break-inside:avoid}
    .teaser{display:none!important}
    .card{page-break-inside:avoid;border-bottom:1px solid var(--border)}
    .chead{cursor:default;padding:14px 0}
    .card[data-status="exploited_in_the_wild"] .rank{background:#B83F00;color:#fff}
    .pill.st-exploited,.pill.nopatch{background:#B83F00;color:#fff}
    .kql pre{white-space:pre-wrap;word-break:break-word}
    .tl-row[hidden]{display:flex!important}
    .tl-more,.tl-tip{display:none!important}
    .tl-bars{overflow:visible}

iven as 12 November by Infosecurity Magazine and SC Magazine UK but 11 November by one newsletter, with the underlying scheme documents reportedly published 17 September 2026. SAP's Gateway CVSS 10.0 identifier conflicts between sources (CVE-2026-89103 vs no CVE listed) and the Patch Day date is given as both 10 and 11 November. Barracuda's fixed version remains ambiguous (Campus article reportedly says 9.4.0.029 or later, CVE record and Mandiant say pre-9.4.0.030 affected); Previdian's 17-attempt telemetry is one vendor's observation, not a compromise count, and the attacker IPs were not published. OpenSSH and Ivanti attacker IP values from GreyNoise, Previdian and Volexity were likewise not published in accessible reporting, and sources disagree on whether CVE-2026-118527 requires a local or remote authenticated attacker. Maersk has not confirmed WhiteArmor's involvement or the data types, and WhiteArmor's 100GB and record-count claims are the group's alone. All UK corporate leak-site listings at rank 9 (Audio Note UK, A&O Shearman, Signworx, Simply UK) are unverified claims with no victim statement located. An early search result appeared to place a Cl0p/NHS Barts Health disclosure inside this window; on checking, that is December 2025 reporting on the Oracle E-Business Suite zero-day CVE-2025-61882 and it has been excluded as out of window."],"confidence_legend":{"high":"Corroborated by the vendor advisory or by multiple independent reputable sources.","medium":"Reported by a single reputable source, or by secondary coverage of a primary source not directly accessible.","low":"Single-sourced and uncorroborated; treat as an investigative lead only."},"exploitation_status_values":["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed","public_poc_available","no_known_exploitation"],"kql_platform_values":["sentinel","defender_xdr"],"ioc_types_present":["account","actor","behaviour","filename","malware","note","port","service_name","ttp","uri_path"]},"vulnerabilities":[{"rank":1,"id":"TI-2026-11-12-001","title":"Apache HTTP Server HTTP/2 Pre-Auth Remote Code Execution (CVE-2026-119618, CVSS 9.8) - Fix Released 11 November, Reliable Exploit Demonstrated, Debian/Amazon Linux Packages Still Lagging","cve_ids":["CVE-2026-119618"],"vendor":"Apache Software Foundation","affected_products":["Apache HTTP Server 2.4.55 through 2.4.70 (only with HTTP/2 enabled)","Standalone mod_h2 2.0.8 through 2.0.42","Downstream distribution packages: Debian bookworm/trixie/forky (fix pending per secondary reporting), Amazon Linux (pending), RHEL 9/10 (fixed)"],"category":"vulnerability","cvss_v3":9.8,"severity":"critical","exploitation_status":"public_poc_available","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-11","last_updated":"2026-11-12","confidence":"medium","summary":"UK government and UK corporate - cross-cutting, highest practical exposure in this window. Apache HTTP Server 2.4.71 was released on 11 November 2026 to fix CVE-2026-119618, a race condition in the mod_http2 module that corrupts heap memory and, per multiple write-ups (Wiz, The Hacker News, securityonline.info), permits unauthenticated remote code execution. Reported CVSS is 9.8. Affected builds are 2.4.55 to 2.4.70 and standalone mod_h2 2.0.8 to 2.0.42, but ONLY where HTTP/2 is enabled - that is, where the Protocols directive includes h2 or h2c. This matters disproportionately to the UK public sector: Apache remains the default front door for a large share of GOV.UK-adjacent services, NHS trust web estates, university and local-authority sites, and reverse-proxy tiers in front of Java and PHP applications, and HTTP/2 has been on by default in most distribution builds for years. Two caveats sharpen the risk rather than soften it. First, exploitation status is disputed: one outlet reports Red Hat stating that a reliable exploit has been demonstrated against a default Apache configuration with HTTP/2 enabled, while other trackers record no verified in-the-wild exploitation and no weaponisation as of this window. A containerised differential lab, ThreadSanitizer evidence and a standard-library HTTP/2 proof-of-concept are already published on GitHub under the CVE identifier, so the gap between demonstrated and opportunistic is days, not weeks. Second, the upstream fix does not equal a patched estate: secondary reporting indicates Debian bookworm, trixie and forky had no fixed package at the time of writing and Amazon Linux fixes were pending, while RHEL 9 and 10 shipped. UK organisations that patch only from distribution repositories may have nothing to install yet, which makes the configuration workaround the operative control today. Apache's own advisory lists no workaround; Wiz advises administrators who cannot update to strip h2 and h2c from the Protocols directive, leaving 'Protocols http/1.1'. Not KEV-listed as at this window. Detail is from search-result summaries only; httpd.apache.org and the vendor advisory were not retrievable from this environment.","recommended_actions":["Inventory every Apache HTTP Server instance and determine which have HTTP/2 enabled - grep the Protocols directive across all vhosts and included config fragments for h2 or h2c; instances without HTTP/2 are not affected and should be de-prioritised.","Upgrade to Apache HTTP Server 2.4.71 (or mod_h2 2.0.43+) where a package exists; on Debian and Amazon Linux, where fixes were still pending in this window, track the distribution security tracker daily.","Where you cannot patch today, apply the mitigation now: set 'Protocols http/1.1' and remove h2/h2c, then reload. Accept the HTTP/2 performance loss as a temporary cost and record it as a deviation to be reverted after patching.","Treat internet-facing and DMZ reverse proxies, load-balancer offload tiers and WAF-origin Apache nodes as the first patch wave; these terminate TLS and ALPN-negotiate h2 and are reachable pre-authentication.","Check appliance and container images, not just OS packages: bundled Apache inside vendor appliances, Docker base images and application stacks (XAMPP-style bundles, older Bitnami images) will not be covered by OS patching.","Hunt for post-exploitation rather than for the exploit itself: a heap-corruption RCE in the web server process yields child processes under the httpd/apache2 service account - look for shells, interpreters and network tooling spawned by the web server.","Raise monitoring sensitivity on httpd/apache2 segmentation faults and worker crashes; the race condition will produce crash-loop noise on failed attempts before successful code execution."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Shell or interpreter spawned by Apache worker (CVE-2026-119618 post-exploitation)","description":"Untested. Primary behavioural detection: successful heap-corruption RCE in mod_http2 executes in the context of the httpd/apache2 worker, so any shell, interpreter or network tool parented by the web server is high-signal. Baseline legitimate CGI first.","query":"let WebServerProcs = dynamic([\"httpd\", \"apache2\", \"httpd.exe\", \"apache.exe\"]);\nlet SuspiciousChildren = dynamic([\"sh\", \"bash\", \"dash\", \"zsh\", \"python\", \"python3\", \"perl\", \"ruby\", \"php\", \"nc\", \"ncat\", \"netcat\", \"socat\", \"curl\", \"wget\", \"base64\", \"chmod\", \"id\", \"whoami\", \"uname\", \"crontab\", \"systemctl\"]);\nDeviceProcessEvents\n| where Timestamp > ago(14d)\n| where InitiatingProcessFileName in~ (WebServerProcs)\n| where FileName in~ (SuspiciousChildren)\n| project Timestamp, DeviceName, ParentProcess = InitiatingProcessFileName, ParentCommandLine = InitiatingProcessCommandLine, ChildProcess = FileName, ChildCommandLine = ProcessCommandLine, Account = AccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connection initiated by Apache worker process (reverse shell / tool pull)","description":"Untested. A web server should accept inbound connections, not originate outbound ones to arbitrary internet hosts. Excludes RFC1918, CGNAT and loopback. Expect benign hits where Apache proxies upstream - exclude known upstream destinations.","query":"let WebServerProcs = dynamic([\"httpd\", \"apache2\", \"httpd.exe\", \"apache.exe\"]);\nDeviceNetworkEvents\n| where Timestamp > ago(14d)\n| where InitiatingProcessFileName in~ (WebServerProcs)\n| where ActionType == \"ConnectionSuccess\"\n| where isnotempty(RemoteIP)\n| where not(ipv4_is_private(RemoteIP)) and not(ipv4_is_in_any_range(RemoteIP, dynamic([\"100.64.0.0/10\", \"127.0.0.0/8\", \"169.254.0.0/16\"])))\n| summarize Connections = count(), Ports = make_set(RemotePort, 20), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, RemoteIP, RemoteUrl, InitiatingProcessFileName\n| order by LastSeen desc"},{"platform":"sentinel","table":"Syslog","name":"Apache worker segmentation faults and child-process crash clusters","description":"Untested. Failed mod_http2 race exploitation typically crashes the worker before it succeeds, so a cluster of segfault/child-exit messages on an HTTP/2-enabled host is an early warning. Requires the Syslog connector and Apache logging to syslog.","query":"Syslog\n| where TimeGenerated > ago(14d)\n| where ProcessName has_any (\"httpd\", \"apache2\")\n| where SyslogMessage has_any (\"segmentation fault\", \"caught SIGSEGV\", \"child pid\", \"exit signal\", \"Segmentation fault\")\n| summarize Crashes = count(), Sample = any(SyslogMessage), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Computer, bin(TimeGenerated, 1h)\n| where Crashes >= 3\n| order by Crashes desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"Apache HTTP Server versions in the vulnerable 2.4.55-2.4.70 band","description":"Untested. Exposure inventory. Vulnerable only where HTTP/2 is enabled, which TVM cannot see - treat output as the candidate set to triage against the Protocols directive, not as a confirmed-vulnerable list.","query":"DeviceTvmSoftwareInventory\n| where SoftwareVendor has_any (\"apache\", \"apache_software_foundation\")\n| where SoftwareName has_any (\"http_server\", \"httpd\", \"apache\")\n| extend Major = toint(split(SoftwareVersion, \".\")[0]), Minor = toint(split(SoftwareVersion, \".\")[1]), Patch = toint(split(SoftwareVersion, \".\")[2])\n| where Major == 2 and Minor == 4 and Patch between (55 .. 70)\n| project DeviceName, DeviceId, SoftwareName, SoftwareVersion, OSPlatform\n| order by DeviceName asc"}],"iocs":[{"type":"note","value":"No attacker infrastructure has been published for CVE-2026-119618; there are no IPs, domains or hashes. Detection must be behavioural (post-exploitation child processes, outbound connections from the web server, worker crash clusters).","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-11/12"},{"type":"ttp","value":"T1190 - Exploit Public-Facing Application","context":"Pre-authentication RCE against an internet-facing HTTP/2 listener.","confidence":"high","source":"Analyst inference from vulnerability class"},{"type":"ttp","value":"T1059.004 - Command and Scripting Interpreter: Unix Shell","context":"Expected first post-exploitation action in the httpd/apache2 worker context.","confidence":"medium","source":"Analyst inference"},{"type":"behaviour","value":"Protocols directive containing h2 or h2c on Apache 2.4.55-2.4.70","context":"The precondition that converts a version match into real exposure. Audit every vhost and included config fragment.","confidence":"high","source":"Wiz / Apache advisory (as relayed)"},{"type":"behaviour","value":"httpd or apache2 parent process spawning sh, bash, python, curl, wget, nc or socat","context":"High-fidelity post-exploitation indicator; baseline legitimate CGI before alerting.","confidence":"high","source":"Analyst-derived detection logic"},{"type":"behaviour","value":"Cluster of Apache worker segmentation faults / SIGSEGV child exits on an HTTP/2-enabled host","context":"Failed race-condition exploitation attempts crash the worker; an early-warning signal that precedes success.","confidence":"medium","source":"Analyst inference from race-condition exploit mechanics"},{"type":"behaviour","value":"Public GitHub proof-of-concept and differential test lab published under the CVE-2026-119618 identifier","context":"Lowers the barrier to opportunistic mass scanning; treat the exploitation window as open.","confidence":"medium","source":"DEV Community / Wiz (as relayed)"},{"type":"port","value":"443","context":"HTTP/2 is negotiated via TLS ALPN, so exposure is overwhelmingly on 443 rather than 80 (h2c cleartext is rarer but also affected).","confidence":"high","source":"Analyst-derived detection logic"}],"references":["https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability","https://thehackernews.com/2026/11/critical-apache-http2-flaw-could-let.html","https://securityonline.info/apache-http-server-cve-2026-119618-rce-fixed/","https://dev.to/threataft_dev/cve-2026-119618-apache-http2-pre-auth-rce-what-the-race-condition-actually-does-25om","https://1023jack.com/news/critical-apache-http-2-flaw-cve-2026-119618-who-is-affected-and-what-to-do-now/"]},{"rank":2,"id":"TI-2026-11-12-002","title":"Russia-Aligned Turla Deploys 'Cereal' Backdoor Inside Government Microsoft Exchange Servers to Intercept NATO and EU Email - No External C2, Victim's Own Server Is the Control Channel","cve_ids":[],"vendor":"Microsoft","affected_products":["Microsoft Exchange Server (on-premises; OWA, Autodiscover and ActiveSync request paths abused)","IIS request-handling pipeline on Exchange hosts"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-10","last_updated":"2026-11-12","confidence":"medium","summary":"UK government - highest-relevance espionage development in the window. ESET published research (10 November, widely syndicated 11 November) on 'Cereal', a previously undocumented toolset it attributes with high confidence to the Russia-aligned Turla group, found implanted in on-premises Microsoft Exchange servers at government organisations in Romania and Kazakhstan. The reported objective is email collection, with stolen mail in the Romanian case said to target NATO and EU correspondence. The tradecraft, not the victim list, is why this ranks second for a UK government audience. Cereal was observed with NO external command-and-control infrastructure: the compromised Exchange server itself is the control point, and the backdoor listens on request paths that mimic legitimate Exchange services - Outlook Web Access, Autodiscover and ActiveSync. Operators reach it by sending crafted requests to the victim's own public mail endpoint, so there is no beacon, no suspicious outbound connection and no attacker domain to block or hunt for. Every detection assumption built around egress monitoring, DNS sinkholing and C2 IoC feeds fails against this design. ESET notes that using a compromised server as the operational hub is rare, practised by only a handful of APT groups, and that Turla has run variations of it before. Two honest gaps: ESET could not determine how initial access was obtained - exploitation of an Exchange vulnerability is a possibility, not a finding - and could not quantify how much mail was taken. Sources also disagree on the timeline, with the toolset variously described as first discovered in November 2025 and as surfacing during an investigation that began on 28 November 2025 at a Kazakh government body. Attribution rests on a component already publicly tied to Turla being found alongside Cereal and on code resembling older Turla malware. For UK readers the exposure is specific and actionable: UK central government, arm's-length bodies, NHS trusts, local authorities and defence suppliers still run hybrid or legacy on-premises Exchange, Turla's declared collection interest is exactly NATO and EU-facing diplomatic and defence correspondence, and the UK is a NATO member whose departments exchange that traffic daily. Detail is from search-result summaries; the ESET WeLiveSecurity report was not retrievable from this environment, so no file hashes or specific URI strings are available.","recommended_actions":["Treat every on-premises or hybrid Exchange server as in scope and run a dedicated compromise assessment - this is a hunt, not a patch, because no CVE and no vendor fix are attached to Cereal.","Enumerate all IIS modules, HTTP handlers and global.asax/web.config handler registrations on Exchange hosts and diff them against a known-good build; a passive implant listening on OWA/Autodiscover/ActiveSync paths must be registered somewhere in the request pipeline.","Hunt IIS logs for requests to OWA, Autodiscover and ActiveSync paths that return unusual status codes or response sizes, arrive from a small set of external IPs, carry anomalous User-Agent strings, or use POST where GET is normal.","Do not rely on outbound/C2 detection for this threat. Cereal was observed with no external C2, so egress blocking, DNS sinkholing and threat-feed matching will not fire.","Review Exchange mailbox access for collection tradecraft: new or modified mailbox export requests, ApplicationImpersonation or full-access delegation grants, EWS access from service accounts, and journaling or transport rules forwarding mail.","Enable and centralise Exchange admin audit logging, IIS logging with full query strings, and PowerShell script-block logging on Exchange hosts; retain at least 12 months given the reported dwell from late 2025.","Prioritise departments and suppliers handling NATO, EU, defence or foreign-policy correspondence, matching the campaign's reported collection interest.","Where an on-premises Exchange server is retained only for hybrid attributes or legacy SMTP relay, use this as the trigger to decommission it - it is an internet-facing code-execution surface with a long exploitation history.","Assume credential and secret compromise on any host found implanted: rotate Exchange service accounts, machine accounts, certificates and any Entra ID application credentials used by the server."],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Anomalous external access to OWA / Autodiscover / ActiveSync paths (Cereal passive implant hunt)","description":"Untested. Cereal listens on paths that imitate legitimate Exchange services, so operator traffic hides in normal mail-endpoint noise. This narrows to external client IPs with few distinct URIs but repeated POSTs - operator behaviour rather than client behaviour. Requires the IIS connector on Exchange servers. Expect heavy benign volume; iterate on the thresholds.","query":"W3CIISLog\n| where TimeGenerated > ago(30d)\n| where csUriStem has_any (\"/owa/\", \"/Autodiscover/\", \"/Microsoft-Server-ActiveSync\", \"/ecp/\")\n| where isnotempty(cIP) and not(ipv4_is_private(cIP))\n| summarize Requests = count(), Posts = countif(csMethod =~ \"POST\"), DistinctUris = dcount(csUriStem), Uris = make_set(csUriStem, 15), Agents = make_set(csUserAgent, 10), Statuses = make_set(scStatus, 10), BytesOut = sum(tolong(scBytes)) by cIP, Computer, bin(TimeGenerated, 1d)\n| where Posts >= 5 and DistinctUris \u003c= 3\n| order by BytesOut desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"DLL or managed assembly written into Exchange / IIS directories","description":"Untested. A passive implant registered in the IIS pipeline must land on disk. Flags non-Microsoft writes of executable content into Exchange and IIS paths. Suppress known patch and Cumulative Update activity by excluding msiexec/TrustedInstaller/ServiceHub windows.","query":"DeviceFileEvents\n| where Timestamp > ago(180d)\n| where FolderPath has_any (@\"\\Microsoft\\Exchange Server\\\", @\"\\inetpub\\\", @\"\\Windows\\System32\\inetsrv\\\", @\"\\Exchange Server\\V15\\FrontEnd\\\", @\"\\Exchange Server\\V15\\ClientAccess\\\")\n| where FileName endswith \".dll\" or FileName endswith \".aspx\" or FileName endswith \".ashx\" or FileName endswith \".asmx\" or FileName endswith \".config\"\n| where InitiatingProcessFileName !in~ (\"msiexec.exe\", \"trustedinstaller.exe\", \"tiworker.exe\", \"servicehub.host.dotnet.x64.exe\", \"setup.exe\", \"umworkerprocess.exe\")\n| project Timestamp, DeviceName, FolderPath, FileName, SHA256, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Child process spawned by Exchange IIS worker (w3wp) or Exchange services","description":"Untested. Hands-on-keyboard activity through a web implant surfaces as children of w3wp.exe running the Exchange application pools, or of Exchange service hosts. Classic Exchange post-exploitation detection, still the highest-value single query for this threat.","query":"DeviceProcessEvents\n| where Timestamp > ago(180d)\n| where InitiatingProcessFileName in~ (\"w3wp.exe\", \"umworkerprocess.exe\", \"microsoft.exchange.servicehost.exe\", \"edgetransport.exe\")\n| where FileName in~ (\"cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"net.exe\", \"net1.exe\", \"whoami.exe\", \"nltest.exe\", \"certutil.exe\", \"bitsadmin.exe\", \"rundll32.exe\", \"regsvr32.exe\", \"wmic.exe\", \"cscript.exe\", \"wscript.exe\", \"mshta.exe\", \"7z.exe\", \"rar.exe\", \"makecab.exe\")\n| project Timestamp, DeviceName, Parent = InitiatingProcessFileName, ParentCmd = InitiatingProcessCommandLine, Child = FileName, ChildCmd = ProcessCommandLine, Account = AccountName\n| order by Timestamp desc"},{"platform":"sentinel","table":"OfficeActivity","name":"Mailbox collection tradecraft - export requests, impersonation and delegation grants","description":"Untested. Covers the objective rather than the implant: bulk mail collection usually leaves export-request, impersonation-grant or full-access-delegation records. Review every hit; these operations should be rare and change-controlled.","query":"OfficeActivity\n| where TimeGenerated > ago(180d)\n| where RecordType has_any (\"ExchangeAdmin\", \"ExchangeItem\", \"ExchangeItemGroup\")\n| where Operation has_any (\"New-MailboxExportRequest\", \"Add-MailboxPermission\", \"Add-ADPermission\", \"New-ManagementRoleAssignment\", \"Set-Mailbox\", \"New-InboxRule\", \"Set-TransportRule\", \"New-JournalRule\", \"Add-RecipientPermission\")\n| project TimeGenerated, Operation, UserId, ClientIP, OfficeObjectId, Parameters, ResultStatus\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"No file hashes, URI strings, IPs or domains for Cereal could be retrieved from this environment - the ESET WeLiveSecurity report was not accessible and search summaries carried no indicator values. The ESET publication should be consulted directly for the authoritative IoC set before any hunt is scoped.","context":"Provenance statement - filter out before ingestion. This entry is deliberately behaviour-only.","confidence":"high","source":"Search-result summaries, 2026-11-10/11"},{"type":"actor","value":"Turla (Russia-aligned; also tracked as Snake, Venomous Bear, Secret Blizzard)","context":"Attributed by ESET with high confidence on the basis of a co-located component already publicly linked to Turla and code resembling older Turla malware.","confidence":"medium","source":"ESET (as relayed by CyberScoop, cyberpress.org, EuropaWire)"},{"type":"malware","value":"Cereal","context":"Previously undocumented Turla toolset providing passive email-collection backdoor functionality on Exchange servers.","confidence":"medium","source":"ESET (as relayed)"},{"type":"ttp","value":"T1505.004 - Server Software Component: IIS Components","context":"The backdoor is registered into the Exchange/IIS request pipeline so it is invoked by inbound HTTP requests.","confidence":"medium","source":"Analyst inference from ESET description"},{"type":"ttp","value":"T1205 - Traffic Signaling","context":"Operators activate the implant with crafted requests to legitimate-looking Exchange endpoints rather than via a beacon.","confidence":"medium","source":"Analyst inference"},{"type":"ttp","value":"T1114.002 - Email Collection: Remote Email Collection","context":"Stated campaign objective: interception of NATO and EU-related government correspondence.","confidence":"medium","source":"ESET (as relayed)"},{"type":"behaviour","value":"Backdoor operating with no external command-and-control infrastructure; the compromised Exchange server is itself the control point","context":"Defeats egress monitoring, DNS sinkholing and C2 IoC matching. Detection must target the server's own request pipeline and child processes.","confidence":"medium","source":"ESET (as relayed)"},{"type":"uri_path","value":"/owa/, /Autodiscover/, /Microsoft-Server-ActiveSync","context":"Legitimate Exchange service paths that the implant imitates when listening for operator requests. These are normal endpoints - they are hunt locations, not malicious indicators.","confidence":"medium","source":"ESET (as relayed)"},{"type":"behaviour","value":"Initial access vector undetermined by the research; exploitation of an Exchange vulnerability is a possibility rather than a finding","context":"Do not assume a patch closes this. Treat on-premises Exchange as compromised-until-assessed where the threat model warrants it.","confidence":"high","source":"ESET (as relayed)"}],"references":["https://cyberscoop.com/russian-turla-group-used-new-toolset-to-silently-pilfer-emails-from-kazakhstan-romanian-governments/","https://cyberpress.org/turla-weaponizes-microsoft-exchange/","https://news.europawire.eu/eset-identifies-turla-cereal-spyware-intercepting-nato-and-eu-emails-on-exchange-servers/eu-press-release/2026/11/11/11/23/04/187141/","https://cybernews.com/security/russian-hackers-microsoft-exchange-nato-emails/","https://analyticsinsight.net/news/turlas-new-cereal-malware-steals-emails-from-exchange-servers"]},{"rank":3,"id":"TI-2026-11-12-003","title":"NCSC Launches Cyber Adversary Simulation (CyAS) Scheme for UK Critical National Infrastructure - Assured Provider Assurance, Assumed-Breach Methodology, MVP Stage","cve_ids":[],"vendor":"UK National Cyber Security Centre (NCSC)","affected_products":["UK critical national infrastructure operators and their regulators/oversight bodies","UK government departments and arm's-length bodies","Commercial providers of adversary simulation / red-team services seeking NCSC assurance"],"category":"incident","cvss_v3":null,"severity":"informational","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-12","last_updated":"2026-11-12","confidence":"medium","summary":"UK government - primary in-window UK government development, defensive rather than incident. The NCSC launched its Cyber Adversary Simulation (CyAS) scheme, publishing guidance and scheme documents, with coverage dated 12 November 2026 (Infosecurity Magazine, SC Magazine UK, Industrial Cyber; one newsletter gives 11 November, and Mondaq notes the underlying scheme documents were published on 17 September 2026 ahead of this formal launch). The scheme assures suppliers of adversary simulation services so that organisations can identify trusted providers to test how well they prevent, detect and respond to realistic simulated attacks. It is aimed squarely at the most critical UK organisations - CNI operators, UK government sectors and the regulators and oversight bodies that supervise them - and sits alongside the existing Cyber Assessment Framework (CAF) and Cyber Resilience Audit, giving regulators a consistent evidence base for resilience claims. Three details matter operationally. First, the methodology is explicitly assumed-breach, which the NCSC recommends for organisations with mature security postures and existing strong detection; immature estates will get more value from CAF work and detection engineering before buying a CyAS engagement. Second, assured providers are not permitted to run fixed attacker playbooks: they must apply an adversarial mindset, conduct continuous and tailored reconnaissance, and develop bespoke approaches to agreed objectives. That is a deliberate break from checklist-driven penetration testing and raises the bar on in-house detection and response. Third, this is a Minimum Viable Product release, so the NCSC can test demand and refine methodology before publishing a fuller operating model and provider listings - organisations should not expect a complete assured-provider list yet, and should monitor NCSC updates. Context makes the timing legible: the NCSC's 3 November 'State of the Cyber Nation' review recorded 80 nationally significant incidents and judged AI-enabled ransomware against UK CNI 'highly likely' by 2028, and the Budget allocated GBP 70m for a National Exposure and Real-Time Vulnerability (Nerv) Centre within the NCSC. CyAS is the assurance limb of that programme, and it is also the item in this window that CNI security leaders can act on through procurement and planning rather than emergency patching. Detail is from search-result summaries; ncsc.gov.uk was not retrievable from this environment.","recommended_actions":["CNI operators and UK government bodies: read the published CyAS guidance and scheme documents, and assess honestly whether your detection and response maturity justifies an assumed-breach engagement now or whether CAF-aligned detection work should come first.","Treat the assumed-breach premise as a planning assumption, not just a test format: validate that you could detect post-compromise activity (lateral movement, credential access, data staging) without relying on perimeter or initial-access alerts.","Where adversary simulation is already procured, review contracts against the CyAS expectations - bespoke, objective-led, continuously reconnoitred engagements rather than fixed playbooks - and plan to move to assured providers as listings are published.","Monitor NCSC updates for the full operating model and the assured-provider list; the MVP stage means both are incomplete and procurement decisions should allow for change.","Align CyAS outputs with existing CAF and Cyber Resilience Audit evidence so that regulators and oversight bodies receive one consistent resilience narrative rather than three.","Use the scheme as the mandate for purple-team follow-through: book the detection-engineering and response-playbook work to consume engagement findings before the engagement starts, since simulation value is realised in remediation.","Supply-chain application: for critical suppliers, consider requiring evidence of adversary-simulation testing and remediation as a contractual control, in step with the Cyber Security and Resilience Bill trajectory."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Assumed-breach readiness check - credential access and discovery tooling on endpoints","description":"Untested. Self-assessment query, not a threat detection. Before commissioning a CyAS engagement, confirm you can see the activity an assumed-breach operator will generate. If this returns nothing across a 30-day window in a large estate, suspect telemetry gaps rather than a clean estate.","query":"let DiscoveryTools = dynamic([\"nltest.exe\", \"net.exe\", \"net1.exe\", \"whoami.exe\", \"dsquery.exe\", \"adfind.exe\", \"sharphound.exe\", \"azurehound.exe\", \"seatbelt.exe\", \"rubeus.exe\", \"mimikatz.exe\", \"procdump.exe\", \"nltestsvc.exe\"]);\nDeviceProcessEvents\n| where Timestamp > ago(30d)\n| where FileName in~ (DiscoveryTools) or ProcessCommandLine has_any (\"lsass\", \"-dumpcred\", \"sekurlsa\", \"DCSync\", \"Invoke-Mimikatz\", \"Get-DomainUser\", \"Get-NetComputer\")\n| summarize Executions = count(), Devices = dcount(DeviceName), Accounts = make_set(AccountName, 15), Tools = make_set(FileName, 20) by bin(Timestamp, 7d)\n| order by Timestamp desc"},{"platform":"sentinel","table":"Usage","name":"Detection-coverage baseline - which log sources actually arrive, and in what volume","description":"Untested. Assumed-breach testing exposes blind spots in ingestion before it exposes gaps in analytics. Run this to confirm that the tables your detections depend on are receiving data, and to spot a source that has silently stopped.","query":"Usage\n| where TimeGenerated > ago(30d)\n| where IsBillable == true\n| summarize GB = round(sum(Quantity) / 1024, 2), Days = dcount(bin(TimeGenerated, 1d)) by DataType\n| extend Status = iff(Days \u003c 25, \"GAP - intermittent or stopped\", \"continuous\")\n| order by GB desc"},{"platform":"sentinel","table":"SecurityAlert","name":"Alert-to-response baseline by severity and tactic","description":"Untested. Produces the before picture for a CyAS engagement: what fires today, in what volume, and against which tactics. Compare post-engagement to evidence improvement to regulators and oversight bodies.","query":"SecurityAlert\n| where TimeGenerated > ago(90d)\n| mv-expand Tactic = todynamic(Tactics)\n| summarize Alerts = count(), DistinctRules = dcount(AlertName) by AlertSeverity, Tactic = tostring(Tactic)\n| order by AlertSeverity asc, Alerts desc"}],"iocs":[{"type":"note","value":"This is a UK government assurance-scheme launch, not an incident or vulnerability. There are no indicators of compromise. It is included because it is the principal in-window UK government cyber development and carries procurement and planning actions for CNI and public-sector security leaders.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Analyst note"},{"type":"behaviour","value":"NCSC CyAS scheme published at Minimum Viable Product stage - assured-provider listings and full operating model not yet available","context":"Plan procurement with the expectation that scheme detail will change; do not treat the current documents as final.","confidence":"medium","source":"NCSC / SC Magazine UK (as relayed)"},{"type":"behaviour","value":"Assumed-breach methodology recommended only for organisations with mature detection capability","context":"Self-selection criterion: immature estates should invest in telemetry and detection engineering before commissioning adversary simulation.","confidence":"medium","source":"NCSC guidance (as relayed by mallory.ai / SC Magazine UK)"},{"type":"behaviour","value":"Assured providers required to use tailored, continuously reconnoitred, objective-led approaches rather than fixed attacker playbooks","context":"Raises the realism of testing; detection content tuned to published red-team tooling signatures will underperform.","confidence":"medium","source":"NCSC guidance (as relayed)"},{"type":"ttp","value":"Scheme complements the Cyber Assessment Framework (CAF) and Cyber Resilience Audit","context":"Enables regulators and oversight bodies to gather consistent evidence of cyber resilience across CNI sectors.","confidence":"medium","source":"NCSC (as relayed)"}],"references":["https://www.ncsc.gov.uk/news/ncsc-scheme-help-critical-organisations-test-their-cyber-defences","https://www.infosecurity-magazine.com/news/ncsc-cyber-adversary-testing-boost/","https://insight.scmagazineuk.com/ncsc-launches-guidance-for-cyber-adversary-simulation-scheme","https://industrialcyber.co/threats-attacks/gchqs-ncsc-launches-cyber-resilience-facilities-threat-simulation-scheme-to-boost-national-cyber-defences/","https://www.legal500.com/intelligence/united-kingdom/technology/ncsc-publishes-guidance-and-scheme-documents-for-cyber-adversary-simulation-scheme"]},{"rank":4,"id":"TI-2026-11-11-002","title":"UK Public-Sector Code Exposure: 100+ Serious Flaws Across 349 Public Repositories - Planning Inspectorate Credential Revoked in 20 Minutes, Experts Warn Against Simply Going Private (11 November Update)","cve_ids":[],"vendor":"Multiple UK government departments and public bodies","affected_products":["Public GitHub repositories owned by 33 UK public-sector organisations (349 codebases scanned)","Planning Inspectorate - Microsoft Entra ID application credential committed to a public repository","Scottish Government - administrative token reported in client-side JavaScript","NHS England public source-code repositories (access restricted since May over AI-related concerns)"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-10","last_updated":"2026-11-12","confidence":"medium","summary":"UK government - carried from the previous run with material in-window developments. The original finding (WIRED, 10 November) was that a researcher scanning 349 codebases across 33 UK public-sector organisations identified more than 100 serious vulnerabilities, with weaknesses in roughly two-thirds of the organisations examined - the figure describes the sample, not a government-wide vulnerability rate. The headline case was a Microsoft Entra ID application credential for the Planning Inspectorate committed to a public GitHub repository, reportedly capable of granting read-write access to all its SharePoint sites, private staff OneDrive accounts and legally sensitive evidence libraries. Three developments landed inside this window and change the handling. First, the Planning Inspectorate's response is now on record: its monitoring detected the researcher's activity, it revoked the credential within about 20 minutes of receiving the report, and it found no evidence of a data breach. That is a creditable response time and it materially lowers the probability of successful third-party abuse of that specific credential, though it does not address the Git history problem. Second, expert commentary published 11 November (IT Security Guru) reframes the risk: public repositories are continuously and automatically scraped by hostile state-nexus groups and initial access brokers, so the operative question is not whether a secret was spotted but whether it was harvested before revocation - and that cannot be proven either way from the outside. Third, the researcher and independent analysts have warned against the reflexive remedy of pulling repositories private without fixing the underlying flaws: clones and forks already taken remain in circulation, and going dark removes external scrutiny while leaving the vulnerability in place. NHS England's May decision to restrict public access to some source-code repositories over AI security concerns is cited as the cautionary precedent. Standing UK government guidance since May already sets a minimum bar before code is published - a named owner, and controls that stop developers committing secrets - so the gap here is enforcement rather than policy. No public evidence exists that UK government data was stolen through any of these exposures. Detail is from search-result summaries; the WIRED original and the ControlPlane disclosure were not retrievable from this environment, and several aggregator sources carrying this story are low quality.","recommended_actions":["Run secret scanning across every public repository your organisation owns, including full Git history and all branches, tags and forks - a revoked credential still present in history is still an exposure record, and rewriting history does not retract clones already taken.","Rotate, do not merely revoke: treat any credential that was ever committed to a public repository as compromised, rotate it, and review what it could reach during its entire validity period, not just since discovery.","For Entra ID application credentials specifically, audit sign-in and audit logs for the full exposure window: service-principal sign-ins from unexpected IPs or ASNs, Graph API calls to SharePoint and OneDrive resources, and any consent or permission changes.","Enable push protection and secret scanning at the organisation level in GitHub, with blocking (not advisory) mode for new commits, and require pre-commit secret detection in CI.","Do not make vulnerable repositories private as the primary remedy - fix the flaws first. Clones already taken are unaffected by visibility changes, and privacy removes external reporting without removing the risk.","Audit client-side JavaScript for embedded tokens and keys across public-facing services; the reported Scottish Government admin token in client-side code is a distinct class from Git-committed secrets and needs a separate sweep.","Confirm compliance with the existing UK government minimum bar for publishing code - a named repository owner and technical controls preventing secret commits - and evidence it per repository rather than per organisation.","Where monitoring detected the researcher, verify the same detection would fire for a hostile actor using the same credential quietly - researcher activity is often noisier than real abuse."],"kql":[{"platform":"sentinel","table":"AADServicePrincipalSignInLogs","name":"Service-principal sign-ins from unexpected locations (exposed Entra application credential abuse)","description":"Untested. Core hunt for abuse of a leaked application credential. Review the full period from first commit to rotation, not just from disclosure. Baseline your own CI/CD egress IPs and exclude them explicitly rather than by country.","query":"AADServicePrincipalSignInLogs\n| where TimeGenerated > ago(180d)\n| summarize SignIns = count(), IPs = make_set(IPAddress, 25), Countries = make_set(tostring(LocationDetails.countryOrRegion), 15), Resources = make_set(ResourceDisplayName, 15), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by ServicePrincipalName, ServicePrincipalId, AppId\n| where array_length(Countries) > 1 or array_length(IPs) > 5\n| order by SignIns desc"},{"platform":"sentinel","table":"MicrosoftGraphActivityLogs","name":"Application-context Graph API access to SharePoint and OneDrive resources","description":"Untested. An exposed application credential with Sites/Files permissions would be used through Graph. Flags app-only (no user) Graph calls against drive and site endpoints. Requires the Graph activity logs connector.","query":"MicrosoftGraphActivityLogs\n| where TimeGenerated > ago(180d)\n| where isempty(UserId) or UserId == \"\"\n| where RequestUri has_any (\"/sites/\", \"/drives/\", \"/drive/\", \"/me/drive\", \"/users/\", \"/groups/\")\n| summarize Calls = count(), Methods = make_set(RequestMethod, 6), Uris = make_set(substring(RequestUri, 0, 120), 20), IPs = make_set(IPAddress, 15), Responses = make_set(ResponseStatusCode, 10) by AppId, ServicePrincipalId, bin(TimeGenerated, 1d)\n| where Calls > 50\n| order by Calls desc"},{"platform":"sentinel","table":"OfficeActivity","name":"Bulk SharePoint / OneDrive file access and download by an application identity","description":"Untested. Detects the consequence rather than the authentication: large-scale file reads or downloads attributed to an app identity or an anomalous principal. Tune the threshold to your tenant's baseline before alerting.","query":"OfficeActivity\n| where TimeGenerated > ago(180d)\n| where RecordType in (\"SharePointFileOperation\", \"OneDrive\")\n| where Operation in (\"FileDownloaded\", \"FileAccessed\", \"FileSyncDownloadedFull\", \"FileCopied\")\n| summarize Files = dcount(OfficeObjectId), Events = count(), Sites = dcount(Site_Url), IPs = make_set(ClientIP, 15) by UserId, UserType, bin(TimeGenerated, 1d)\n| where Files > 500\n| order by Files desc"},{"platform":"sentinel","table":"AuditLogs","name":"Application credential and permission changes (rotation evidence and unauthorised additions)","description":"Untested. Dual purpose: evidences your own rotation activity for audit, and catches an attacker adding a second credential to a service principal to retain access after the leaked one is revoked.","query":"AuditLogs\n| where TimeGenerated > ago(180d)\n| where OperationName has_any (\"Update application\", \"Add service principal credentials\", \"Update application - Certificates and secrets management\", \"Add app role assignment\", \"Consent to application\", \"Add delegated permission grant\")\n| extend Actor = tostring(InitiatedBy.user.userPrincipalName), ActorApp = tostring(InitiatedBy.app.displayName), Target = tostring(TargetResources[0].displayName)\n| project TimeGenerated, OperationName, Actor, ActorApp, Target, Result, AdditionalDetails = tostring(TargetResources[0].modifiedProperties)\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"No attacker indicators exist for this entry - it is a disclosure of exposure, not an observed intrusion. The Planning Inspectorate states it found no evidence of a data breach. Hunting must be retrospective and identity-centric across the entire credential validity period.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-10/11"},{"type":"behaviour","value":"Microsoft Entra ID application credential committed to a public GitHub repository and present in Git history","context":"Planning Inspectorate case. Reportedly capable of read-write access to all SharePoint sites, private staff OneDrive accounts and legally sensitive evidence libraries.","confidence":"medium","source":"WIRED (as relayed by eSecurity Planet, mlq.ai)"},{"type":"behaviour","value":"Credential revoked approximately 20 minutes after report; agency monitoring had already detected the researcher's activity; no evidence of data breach found","context":"In-window development that lowers - but cannot eliminate - the probability of third-party abuse. Harvesting before revocation cannot be excluded from outside.","confidence":"medium","source":"Planning Inspectorate statement to WIRED (as relayed)"},{"type":"behaviour","value":"Administrative token reported embedded in client-side JavaScript (Scottish Government)","context":"Distinct exposure class from Git-committed secrets: served to every visitor, so no repository scanning will find it. Requires a separate front-end sweep.","confidence":"low","source":"Secondary reporting, unverified"},{"type":"ttp","value":"T1552.001 - Unsecured Credentials: Credentials In Files","context":"Root cause: secrets committed to source control and to client-delivered code.","confidence":"high","source":"Analyst inference"},{"type":"ttp","value":"T1078.004 - Valid Accounts: Cloud Accounts","context":"An exposed application credential provides authenticated, non-interactive cloud access that bypasses MFA and conditional access aimed at users.","confidence":"high","source":"Analyst inference"},{"type":"ttp","value":"T1593.003 - Search Open Websites/Domains: Code Repositories","context":"Expert commentary describes continuous automated scraping of public repositories by state-nexus groups and initial access brokers.","confidence":"medium","source":"IT Security Guru expert commentary, 11 Nov (as relayed)"},{"type":"behaviour","value":"Making exposed repositories private without remediating the underlying flaws","context":"Warned against by the researcher and independent analysts: clones and forks already taken persist, and removing public scrutiny leaves the vulnerability in place. NHS England's May restriction is the cited precedent.","confidence":"medium","source":"IT Security Guru / FSFE (as relayed)"}],"references":["https://www.itsecurityguru.org/2026/11/11/open-code-isnt-the-problem-experts-on-the-god-tier-flaws-exposed-across-uk-government-repositories/","https://www.esecurityplanet.com/threats/news-government-code-security-flaws-emea-uk/","https://mlq.ai/news/researcher-finds-exposed-credentials-and-other-serious-flaws-across-uk-government-code-including-a-planning-inspectorate-login-wired-reports/","https://www.techbooky.com/ai-audit-finds-serious-flaws-in-uk-government-code/","https://govobservatory.uk/orgs/Planning-Inspectorate/code"]},{"rank":5,"id":"TI-2026-11-11-004","title":"Barracuda ESG Pre-Auth Root Chain (CVE-2026-116606 + CVE-2026-111560): 17 Exploitation Attempts Observed 9-11 November From 15 IPs in 3 Countries - CISA KEV Deadline 13 November (Tomorrow)","cve_ids":["CVE-2026-116606","CVE-2026-111560"],"vendor":"Barracuda Networks","affected_products":["Barracuda Email Security Gateway (ESG) - firmware before 9.4.0.030","Barracuda Load Balancer ADC, Message Archiver, Web Application Firewall, WAF Control Center, Web Security Gateway (CVE-2026-111560 scope)"],"category":"vulnerability","cvss_v3":9.3,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-13","patch_available":"yes","first_reported":"2026-11-09","last_updated":"2026-11-12","confidence":"medium","summary":"UK government and UK corporate - cross-cutting, hardest deadline in this window. Carried from the previous run with new exploitation telemetry. CVE-2026-116606 is a pre-authentication authorisation bypass in the Barracuda Email Security Gateway (CVSS 9.3, reportedly in the ESG password-change logic) that permits a global configuration restore; CVE-2026-111560 is a command-injection flaw (CVSS 8.6). Chained, the vendor states they give an attacker full control of an affected gateway - unauthenticated remote root on a device that sits in front of the mail flow and holds mail-routing configuration and credentials. The in-window development is quantitative. Security firm Previdian reports observing 17 exploitation attempts against CVE-2026-116606 between 9 and 11 November, from 15 IP addresses across three countries. That is one vendor's telemetry, not a confirmed compromise count, and neither Barracuda nor CISA has published exploitation detail or appliance-compromise figures - but it moves this from 'KEV-listed' to 'actively and repeatedly targeted during this window'. Barracuda disclosed observed exploitation in an update posted 21:00 on 9 November; CISA added both CVEs to KEV on 10 November with a remediation due date reported as 13 November 2026 - tomorrow - under a three-day requirement. Two version traps remain unresolved: Barracuda's Campus article is reported to say 9.4.0.029 or later while the CVE record and Mandiant describe versions before 9.4.0.030 as affected, so stopping at 9.4.0.029 may leave you exposed and should be confirmed with Barracuda Support; and CVE-2026-111560 extends beyond ESG to Load Balancer ADC, Message Archiver, WAF, WAF Control Center and Web Security Gateway, which teams patching only the email gateway will miss. UK relevance is direct: Barracuda ESG is widely deployed across UK local government, NHS trusts, schools and mid-market corporates, frequently as an internet-facing appliance with an administrative interface reachable from outside. Given the history of the 2023 ESG campaign, where compromised appliances required physical replacement rather than patching, any appliance that was internet-exposed and unpatched between 2 and 10 November should be treated as potentially compromised and triaged on that basis, not simply patched and closed. Detail is from search-result summaries; cisa.gov and the Barracuda advisory were not retrievable from this environment.","recommended_actions":["Patch Barracuda ESG to firmware 9.4.0.030 or later today - the KEV remediation date is 13 November. Confirm with Barracuda Support whether 9.4.0.029 is sufficient, given the documented version discrepancy; default to 9.4.0.030.","Extend patching for CVE-2026-111560 to Load Balancer ADC, Message Archiver, Web Application Firewall, WAF Control Center and Web Security Gateway - the command-injection flaw is not ESG-only.","Remove the appliance administrative interface from internet reachability immediately; restrict it to a management VLAN or jump host regardless of patch state.","Treat any appliance that was internet-exposed and unpatched between 2 and 10 November as potentially compromised: review the running configuration against a known-good baseline for unauthorised changes, inspect administrative accounts, and engage incident response where exposure or unexplained changes exist.","Review and diff the gateway configuration specifically for evidence of the global configuration restore primitive being used - restored or altered mail routing, new transport destinations, modified LDAP/AD binds, changed admin credentials or added accounts.","Rotate every credential held on or by the appliance: LDAP/Active Directory bind accounts, SMTP relay credentials, API keys, and administrative passwords. A root-level compromise exposes all of them.","Hunt for mail-flow tampering in the period of exposure: unexpected BCC or journaling destinations, forwarding rules applied at the gateway, and anomalous volumes of mail to unfamiliar domains.","Note the 2023 precedent: in that ESG campaign Barracuda ultimately advised appliance replacement over patching for compromised devices. If you find indicators, plan for replacement rather than cleanup."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"Inbound administrative access attempts to Barracuda appliance management interfaces","description":"Untested. Perimeter-side hunt where the appliance itself does not ship logs to Sentinel. Looks for external sources reaching appliance management ports. Replace the IP list with your own appliance addresses before running.","query":"let ApplianceIPs = dynamic([\"REPLACE_WITH_YOUR_BARRACUDA_APPLIANCE_IPS\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where DestinationIP in (ApplianceIPs)\n| where DestinationPort in (8000, 8443, 443, 25, 587)\n| where isnotempty(SourceIP) and not(ipv4_is_private(SourceIP))\n| summarize Attempts = count(), Ports = make_set(DestinationPort, 10), Actions = make_set(DeviceAction, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP, DestinationIP\n| order by Attempts desc"},{"platform":"sentinel","table":"Syslog","name":"Barracuda appliance configuration restore, admin changes and unexpected process activity","description":"Untested. Requires appliance syslog forwarding to Sentinel. Targets the specific exploitation primitive (global configuration restore) plus administrative change and command-execution artefacts. Any hit on a restore event that does not match a change record is an incident.","query":"Syslog\n| where TimeGenerated > ago(30d)\n| where Computer has_any (\"barracuda\", \"esg\", \"bspam\")\n| where SyslogMessage has_any (\"config restore\", \"configuration restore\", \"restore_config\", \"admin password\", \"password change\", \"useradd\", \"root shell\", \"/bin/sh\", \"/bin/bash\", \"cmd=\", \"system\", \"wget \", \"curl \", \"nc -\")\n| project TimeGenerated, Computer, Facility, SeverityLevel, ProcessName, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Outbound connections originating from the Barracuda appliance (post-exploitation egress)","description":"Untested. A mail gateway initiates SMTP outbound legitimately; it should not be pulling tooling over HTTP or opening arbitrary egress. Replace the ApplianceIPs list with your own Barracuda appliance addresses before running. Requires firewall logs identifying the appliance as the source.","query":"let ApplianceIPs = dynamic([\"REPLACE_WITH_YOUR_BARRACUDA_APPLIANCE_IPS\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where SourceIP in (ApplianceIPs)\n| where DestinationPort !in (25, 53, 123, 443, 587, 465)\n| where isnotempty(DestinationIP) and not(ipv4_is_private(DestinationIP))\n| summarize Connections = count(), Ports = make_set(DestinationPort, 20), Destinations = make_set(DestinationIP, 25), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP\n| order by Connections desc"},{"platform":"sentinel","table":"OfficeActivity","name":"Mail-flow tampering following gateway compromise - transport rules and forwarding","description":"Untested. Where the gateway fronts Exchange Online, a compromised appliance is often used to establish persistent mail access downstream. Reviews transport-rule and forwarding changes in the exposure period.","query":"OfficeActivity\n| where TimeGenerated > ago(30d)\n| where Operation has_any (\"New-TransportRule\", \"Set-TransportRule\", \"New-InboxRule\", \"Set-InboxRule\", \"Set-Mailbox\", \"New-JournalRule\", \"Add-RecipientPermission\", \"Set-OrganizationConfig\")\n| project TimeGenerated, Operation, UserId, ClientIP, OfficeObjectId, Parameters, ResultStatus\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"Neither Barracuda nor CISA has published attacker infrastructure, file hashes or compromised-appliance counts for this chain. Previdian's telemetry (17 attempts, 15 IPs, 3 countries, 9-11 November) is one vendor's observation and the specific IP values were not published in accessible reporting. Detection must be configuration- and behaviour-based.","context":"Provenance statement - filter out before ingestion.","confidence":"high","source":"Search-result summaries, 2026-11-09/12"},{"type":"behaviour","value":"17 exploitation attempts against CVE-2026-116606 observed between 9 and 11 November from 15 IP addresses in 3 countries","context":"In-window escalation evidence (Previdian telemetry). Confirms sustained targeting rather than a single proof-of-concept test. Not a compromise count.","confidence":"medium","source":"Previdian (as relayed by SecurityWeek / securityonline.info)"},{"type":"behaviour","value":"Unauthenticated global configuration restore on a Barracuda ESG appliance","context":"The core exploitation primitive of CVE-2026-116606. Any configuration restore event with no matching change record is an incident, not an anomaly.","confidence":"high","source":"Barracuda advisory (as relayed)"},{"type":"behaviour","value":"Public proof-of-concept exploit release preceding observed in-the-wild exploitation","context":"Exploitation followed PoC publication, which is why the exposure window (approximately 2-10 November) matters more than the disclosure date.","confidence":"medium","source":"securityonline.info (as relayed)"},{"type":"service_name","value":"Barracuda ESG firmware 9.4.0.030","context":"Target fixed version. Note the reported discrepancy: Barracuda Campus is said to cite 9.4.0.029 or later while the CVE record and Mandiant describe pre-9.4.0.030 as affected. Confirm with Barracuda Support.","confidence":"medium","source":"Barracuda / CVE record / Mandiant (as relayed, conflicting)"},{"type":"ttp","value":"T1190 - Exploit Public-Facing Application","context":"Pre-authentication exploitation of an internet-facing email security appliance.","confidence":"high","source":"Analyst inference"},{"type":"ttp","value":"T1059.004 - Command and Scripting Interpreter: Unix Shell","context":"CVE-2026-111560 is a command-injection flaw yielding shell execution as root on the appliance.","confidence":"high","source":"Analyst inference from vulnerability class"},{"type":"ttp","value":"T1557 / T1114 - Mail interception and collection via a compromised gateway","context":"A root-controlled mail gateway permits silent interception, copying and redirection of all inbound and outbound mail.","confidence":"medium","source":"Analyst inference"},{"type":"port","value":"8000, 8443","context":"Barracuda appliance administrative interface ports. Should never be internet-reachable; restrict to a management network.","confidence":"medium","source":"Analyst-derived detection logic"}],"references":["https://www.securityweek.com/recently-patched-barracuda-vulnerabilities-exploited-in-attacks/","https://securityonline.info/barracuda-esg-vulnerability-exploited-poc/","https://www.suped.com/blog/cisa-lists-two-actively-exploited-barracuda-email-gateway-flaws","https:
