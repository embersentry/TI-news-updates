roup has been named","related_entry":"TI-2026-11-28-004","confidence":"medium","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"]},{"value":"Mitel's own advisory, last updated 24 November, does NOT mention in-the-wild exploitation of these vulnerabilities; CISA lists all five as actively exploited and Accenture has published an exploitation timeline","related_entry":"TI-2026-11-28-004","confidence":"high","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"]},{"value":"EIGHTEEN distinct exploited CVEs across TWELVE unrelated product families fall due, overdue or newly listed inside a single week - a PHP CMS, a map server, an ASP.NET library, an A/B testing platform, a medical imaging tool, a mail gateway, an SD-WAN controller, a hypervisor console, a UC platform, a refrigeration controller, a virtualisation platform and a video conferencing gateway","related_entry":"TI-2026-11-28-004","confidence":"high","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"]},{"value":"KEV DEADLINE DATES in this entry are reconstructed from secondary reporting and tracker records because the CISA KEV catalogue itself could not be retrieved directly in this session. Where sources conflict the EARLIEST date is used as the planning assumption","related_entry":"TI-2026-11-28-004","confidence":"medium","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"]},{"value":"NO PATCH, NO CVE, NO OFFICIAL SEVERITY RATING, AND NOT DISCLOSED TO THE CACTI PROJECT BEFORE PUBLIC RELEASE on THANKSGIVING DAY, 26 NOVEMBER 2026","related_entry":"TI-2026-11-28-005","confidence":"high"},{"value":"ROOT CAUSE: a STORED, SECOND-ORDER SQL INJECTION. The exploit writes malicious SQL into a guest user's graph display preferences; that stored value later alters the commands executed by Cacti's REAL-TIME POLLER, producing command execution","related_entry":"TI-2026-11-28-005","confidence":"high"},{"value":"THE PRIVILEGE CLAIM IS OVERSTATED IN SOME COVERAGE: root was demonstrated only IN A LAB WHERE CACTI ALREADY RAN AS ROOT. Typical deployments run as www-data or apache, so the realistic default outcome is command execution as the WEB SERVER USER","related_entry":"TI-2026-11-28-005","confidence":"high"},{"value":"VERSION SCOPE IS UNKNOWN: tested against Cacti Core 1.2.31. NO source establishes whether earlier versions are affected","related_entry":"TI-2026-11-28-005","confidence":"high"},{"value":"EXPLOITATION STATUS: as of 27 November there were NO REPORTS of this being exploited in attacks, and it is correctly NOT in CISA KEV","related_entry":"TI-2026-11-28-005","confidence":"high"},{"value":"WHAT A CACTI COMPROMISE ACTUALLY COSTS: by design Cacti holds SNMP community strings and SNMPv3 credentials for the network estate, often device or SSH credentials for collection, a database of topology, inventory, interface naming and addressing, and a poller that executes commands on a schedule","related_entry":"TI-2026-11-28-005","confidence":"high"},{"value":"PROCESS FINDING: this is the SECOND item in this report whose remediation is NOT a patch - CVE-2026-131914 (Idunno.AntiCsrf, rank 4) has no patch and never will, and this flaw has no patch yet. Both are closed by configuration change or dependency removal","related_entry":"TI-2026-11-28-005","confidence":"high"},{"value":"LISTING: INC Ransom listed 'Brit Ltd / Brit Insurance' (britinsurance.com) on 27 NOVEMBER 2026 with a countdown reported at approximately 33 DAYS","related_entry":"TI-2026-11-28-006","confidence":"medium"},{"value":"SOURCES DIRECTLY CONTRADICT EACH OTHER ON PROOF: one tracker states the listing carried 22 IMAGES as proof; another states explicitly that the entry provides NO details on the alleged data, NO volume, NO ransom demand and NO screenshots or images","related_entry":"TI-2026-11-28-006","confidence":"high"},{"value":"ACTOR CREDIBILITY CAVEAT IS DOCUMENTED: at least one tracker explicitly warns that listings attributed to INCRANSOM have been reported as including UNVERIFIED OR FABRICATED VICTIM CLAIMS. Independent trackers label this entry a claim, one recording it as 'Claim, unrated'","related_entry":"TI-2026-11-28-006","confidence":"high"},{"value":"BRIT HAS PUBLISHED NOTHING: no Brit or Lloyd's statement confirming or denying a breach was found in any source reviewed; Brit's own news page carried nothing as of Friday afternoon","related_entry":"TI-2026-11-28-006","confidence":"high"},{"value":"REGULATORY CLOCK: under UK data protection law, if personal data was taken Brit would generally have to notify the ICO WITHIN 72 HOURS of becoming aware. The listing appeared 27 November, so a window running from that date would close around 30 NOVEMBER","related_entry":"TI-2026-11-28-006","confidence":"high"},{"value":"DATA CLASS ASSESSMENT - NOT A CLAIM ABOUT WHAT THE ATTACKER HOLDS: a Lloyd's specialty insurer typically holds underwriting submissions and risk surveys describing other organisations' control weaknesses, claims files with incident detail and forensic reports, reinsurance and broker correspondence, and CYBER INSURANCE underwriting and claims material","related_entry":"TI-2026-11-28-006","confidence":"medium"},{"value":"NO ATTACKER IP ADDRESSES, DOMAINS, URLS, FILE HASHES OR MALWARE SAMPLES SPECIFIC TO THIS LISTING have been published by any source reviewed","related_entry":"TI-2026-11-28-006","confidence":"high"},{"value":"PATTERN: this is the FOURTH UK organisation in roughly one week to appear on an extortion leak site or disclose a third-party compromise - University of Liverpool (25 Nov), Next plc supplier (23 Nov) and hmv via N0n (25 Nov), Gatwick's AutoPay supplier (24-25 Nov), and now Brit (27 Nov). THREE of the four involve a THIRD PARTY or an UNVERIFIED CRIMINAL CLAIM rather than a confirmed intrusion at the named brand's own perimeter","related_entry":"TI-2026-11-28-006","confidence":"high"},{"value":"NEW AND DECISIVE FOR CONFIDENCE: on 25 NOVEMBER 2026 the University of Liverpool ordered ALL staff and students to reset passwords BY 1PM UK TIME, citing a 'POTENTIAL THREAT TO OUR SYSTEMS', following EMERGENCY SYSTEM RESETS on 24 NOVEMBER. The university has NOT linked this to ScarlettGroup and has NOT confirmed data theft","related_entry":"TI-2026-11-28-007","confidence":"high"},{"value":"LEAK CLOCK: ScarlettGroup listed the university on 25 NOVEMBER and is reported to intend publication within 6-7 DAYS; one tracker recorded roughly 6 days and 19 hours remaining when indexed. That places intended publication around 1-2 DECEMBER 2026","related_entry":"TI-2026-11-28-007","confidence":"low"},{"value":"CLAIMED DATA CATEGORIES - ATTACKER ASSERTION ONLY: PATIENT, student, staff, financial and RESEARCH data. NO volume disclosed, NO samples shown, NO category independently confirmed. Ransomware.live states plainly that its listings reflect unverified criminal claims","related_entry":"TI-2026-11-28-007","confidence":"low"},{"value":"UNVERIFIED CONTEXT, RECORDED WITH ITS WEAKNESS: one report cites infostealer intelligence attributed to Hudson Rock of 535 EMPLOYEES and 774 USERS affected by infostealer activity","related_entry":"TI-2026-11-28-007","confidence":"low"},{"value":"THE UNIVERSITY HAS PUBLISHED NO SUBSTANTIVE STATEMENT about the incident - only the password reset notice, which did NOT characterise it. NO ICO notification has been reported","related_entry":"TI-2026-11-28-007","confidence":"high"},{"value":"NO ATTACKER INFRASTRUCTURE, IP ADDRESSES, DOMAINS, FILE HASHES, MALWARE SAMPLES OR INTRUSION-SPECIFIC TTPS have been published for this incident","related_entry":"TI-2026-11-28-007","confidence":"high"},{"value":"SECTOR CONTEXT: rank 4 of this report records Project MONAI Label CVE-2026-133968 as OVERDUE in CISA KEV and reportedly FOUND AND EXPLOITED BY AI AGENTS to reach a root shell ON UNIVERSITY SERVERS IN ELEVEN MINUTES, per Amazon Threat Intelligence","related_entry":"TI-2026-11-28-007","confidence":"high"},{"value":"TIMELINE: 1Password began investigating 19 NOVEMBER 2026 and disclosed 25 NOVEMBER, with a further update published around 26 November","related_entry":"TI-2026-11-28-008","confidence":"high"},{"value":"TAKEN, AS STATED: customer NAMES, EMAIL ADDRESSES, ACCOUNT AND USER IDS, SIGN-IN TIMESTAMPS, non-secret internal account metadata, tokens present in SOME INVITATION AND RECOVERY EMAILS, and 1Password's INTERNAL SOURCE CODE","related_entry":"TI-2026-11-28-008","confidence":"high"},{"value":"NOT TAKEN, AS STATED: 'At no time were customer vault contents accessed by, or available to, the attacker.' Vault data, the items in vaults, and the keys protecting them were not affected","related_entry":"TI-2026-11-28-008","confidence":"high"},{"value":"UNRESOLVED SOURCE CONFLICT ON THE MOST SECURITY-RELEVANT QUESTION: one report states stolen SRP PARAMETERS CANNOT BE USED to access an account, attributed to 1Password; another, citing a company representative on 1Password's community forum, states the stolen data INCLUDED SECURE REMOTE PASSWORD VERIFIERS DERIVED FROM USER ACCOUNT PASSWORDS AND SECRET KEYS","related_entry":"TI-2026-11-28-008","confidence":"medium"},{"value":"ARCHITECTURAL CONTEXT, NOT A STATEMENT ABOUT WHAT WAS TAKEN: 1Password's design combines the account password with a SECRET KEY held only on the user's own devices, which materially raises the cost of any offline attack against a verifier compared with a conventional password hash","related_entry":"TI-2026-11-28-008","confidence":"medium"},{"value":"VENDOR NEGATIVE FINDING: 1Password says it validated NO INTERNAL EVIDENCE OF USER ACCOUNT TAKEOVERS OR COMPROMISE USING ANY EXPOSED ACCOUNT PROVISIONING TOKENS","related_entry":"TI-2026-11-28-008","confidence":"high"},{"value":"PATTERN ACROSS THIS REPORT: this is the THIRD entry in which an organisation's own incident response creates the phishing pretext against its users - DWP's outage and journal waiver (rank 1), Liverpool's mandatory password reset (rank 7), and now a password manager's breach notification","related_entry":"TI-2026-11-28-008","confidence":"high"},{"value":"SAP'S ENTIRE CONFIRMED PUBLIC POSITION: that a security incident exists, and that 'Based on our investigation to date, we have found no evidence of unauthorized access to customer business data'","related_entry":"TI-2026-11-28-009","confidence":"high"},{"value":"REPORTED BUT NOT CONFIRMED BY SAP: stolen employee authentication tokens; source code copied and changed on GitHub; internal codename 'PROJECT GRANITE'; GitHub access restricted; AUTOMATED BUILD AND DELIVERY PIPELINES PAUSED; CODE-SIGNING KEYS ROTATED; possible use of agentic AI","related_entry":"TI-2026-11-28-009","confidence":"medium"},{"value":"ANALYST INFERENCE, LABELLED AS SUCH: pausing automated build and delivery pipelines and rotating code-signing keys are expensive, disruptive actions a software vendor takes when it cannot yet prove the code leaving its pipeline is the code its engineers wrote. A company confident the tampering was contained to a repository would need neither","related_entry":"TI-2026-11-28-009","confidence":"low"},{"value":"THE CRITICAL NEGATIVE, TO BE STATED EVERY TIME THIS INCIDENT IS DESCRIBED: NONE of the reports indicates that tampered code was incorporated into software delivered to SAP customers","related_entry":"TI-2026-11-28-009","confidence":"high"},{"value":"NOT ESTABLISHED BY ANYONE: how the tokens were stolen, how many repositories were touched, whether proprietary product code was involved as opposed to samples or tooling, and when the activity started","related_entry":"TI-2026-11-28-009","confidence":"high"},{"value":"SOURCES TO DISCARD RATHER THAN AVERAGE: two aggregator pages state the stolen credentials were used to clone PRIVATE REPOSITORIES and that the incident was CONFINED TO SOURCE CODE MANAGEMENT, while other outlets state the affected repositories are UNKNOWN. One write-up's '300 million subscribers' figure is unsourced speculation","related_entry":"TI-2026-11-28-009","confidence":"high"},{"value":"UK RELEVANCE: SAP is deeply embedded in UK public sector and large enterprise finance, HR, procurement and payroll - typically the system of record for payments, frequently integrated with banking, and frequently maintained by a specialist partner rather than internal IT","related_entry":"TI-2026-11-28-009","confidence":"high"},{"value":"LEAK CLOCK: every N0n listing posted on 25 NOVEMBER carries a countdown to a publication deadline of APPROXIMATELY 2 DECEMBER 2026 and is marked 'NOT PAID'. The named set includes Mattel, Gannett, NEXT, HMV, Torrid and seventeen others","related_entry":"TI-2026-11-28-010","confidence":"medium"},{"value":"THE MOST INTERESTING CLAIM IN THIS ENTRY: N0n claims to hold, for Next plc, more than 3.5 MILLION ROWS of search query and revenue data, more than 320,000 LINES OF SHOPPER CHATS WITH AN AI SHOPPING ASSISTANT INCLUDING BODY MEASUREMENTS AND SIZING DETAILS, and records for 293 NAMED STAFF","related_entry":"TI-2026-11-28-010","confidence":"low"},{"value":"DO NOT CONFLATE THE TWO NEXT THREADS: Next disclosed on 23 NOVEMBER via a London Stock Exchange filing that an UNNAMED third-party online supplier suffered a cyber incident resulting in unauthorised access to 'certain BENIGN data relating to NEXT', and says current evidence indicates NO customer personal data was compromised. N0n listed Next SEPARATELY on 25 November. Next has NOT named the supplier and has NOT linked the two","related_entry":"TI-2026-11-28-010","confidence":"high"},{"value":"SHARED-PROVIDER INFERENCE: FIVE retail listings including hmv and Torrid carry IDENTICAL WORDING about shopper search sessions, pointing at ONE UNNAMED SHARED E-COMMERCE SEARCH PROVIDER rather than twenty-plus separate intrusions. NO provider has been named by anyone","related_entry":"TI-2026-11-28-010","confidence":"medium"},{"value":"ACTOR CREDIBILITY IS DOCUMENTED AS POOR: Bitdefender reported an EXPOSED N0n FILE SERVER showing it had targeted JUST OVER 20 VICTIMS while its leak site listed MORE THAN 100, and called the group's threat image 'A FALSE DEPICTION'. No samples released for the headline 166 MILLION Gannett / USA Today claim; USA Today has not confirmed a breach","related_entry":"TI-2026-11-28-010","confidence":"high"},{"value":"GATWICK SUPPLIER CHAIN IS NOW THREE DEEP AND CONFIRMED: the affected system is AUTOPAY, OPERATED BY PARKPARK, USED BY TIMES24 UK LIMITED, which is Gatwick's DROP-OFF ZONE MANAGER","related_entry":"TI-2026-11-28-010","confidence":"high"},{"value":"NEW IN THIS WINDOW: one report describes HASHED PASSWORDS as exposed in the Gatwick AutoPay breach, consistent with the 'AutoPay login information' category Gatwick itself names","related_entry":"TI-2026-11-28-010","confidence":"medium"},{"value":"GATWICK SCOPE CONFLICT STILL UNRESOLVED ON DAY FOUR: Gatwick says a SMALL NUMBER of accounts were affected and exposed data MAY include card brand, LAST FOUR DIGITS and EXPIRY DATE in isolated cases, plus payment records, AutoPay login information, customer contact and personal details, and vehicle and drop-off information. Full card numbers, security codes and bank account numbers appear in NO report reviewed. Several UK outlets nonetheless assert stolen BANK DETAILS, which Gatwick has not confirmed","related_entry":"TI-2026-11-28-010","confidence":"high"},{"value":"THE PATTERN, SIX CONSECUTIVE INSTANCES: NOT ONE UK consumer-facing compromise disclosed this month began at the named brand's own perimeter - Optimizely, ASOS, Next plc, TfL, Halfords and now Gatwick all started at a supplier","related_entry":"TI-2026-11-28-010","confidence":"high"}],"port":[{"value":"8080/tcp and 8443/tcp on GIS, map, spatial or INSPIRE-named hosts","related_entry":"TI-2026-11-28-002","confidence":"medium","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"4505/tcp and 4506/tcp","related_entry":"TI-2026-11-28-004","confidence":"high","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"]}],"ttp":[{"value":"Pretexting on the journal sanction waiver - 'your journal entry failed, reconfirm your details to avoid a sanction'","related_entry":"TI-2026-11-28-001","confidence":"medium"},{"value":"Pretexting on a publicised multi-day government outage - 'your Universal Credit account could not be verified', 'claim your emergency payment while services are down', 'Healthy Start application resubmission required'","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"Data-theft extortion without confirmed encryption - leak-site listing with a fixed countdown as the pressure mechanism","related_entry":"TI-2026-11-28-006","confidence":"high"},{"value":"Phishing that uses the publicised institutional password reset as the lure - 'your password reset failed, complete it here'","related_entry":"TI-2026-11-28-007","confidence":"high"},{"value":"Phishing impersonating a breach notification from the breached vendor itself - 'secure your account in response to the incident', 'reset your password', 'verify your account information'","related_entry":"TI-2026-11-28-008","confidence":"high"},{"value":"Hijacked employee corporate GitHub account used to PUSH MALICIOUS CODE TO BACKEND SERVICES, then to pull customer records","related_entry":"TI-2026-11-28-008","confidence":"high"},{"value":"Stolen employee authentication tokens used to COPY AND ALTER SOURCE CODE on GitHub (reported, NOT confirmed by SAP)","related_entry":"TI-2026-11-28-009","confidence":"medium"},{"value":"Phishing pretexting on a code-signing key rotation - 'import this new SAP trust certificate', 'your SAP notes must be re-applied with updated signatures'","related_entry":"TI-2026-11-28-009","confidence":"medium"},{"value":"Phishing impersonating UNFAMILIAR supplier names after a third-party breach - Gatwick, Times24, AutoPay, ParkPark","related_entry":"TI-2026-11-28-010","confidence":"high"}],"uri_path":[{"value":"Prefixed service names of the form /x/WFS, /\u003canything>/WFS, /\u003canything>/WMS, /\u003canything>/ows","related_entry":"TI-2026-11-28-002","confidence":"high","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"WFS GetFeatureById and STOREDQUERY_ID requests containing file://, 169.254.169.254, metadata.google.internal, localhost, 127.0.0.1, /etc/passwd, web.xml or datastore.xml","related_entry":"TI-2026-11-28-002","confidence":"high","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"/core/install.php and /install.php","related_entry":"TI-2026-11-28-003","confidence":"high","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"/awv","related_entry":"TI-2026-11-28-004","confidence":"high","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"]}]},"summary_statistics":{"total_entries":10,"actively_exploited":7,"public_poc_available":1,"exploitation_reported_unconfirmed":2,"no_known_exploitation":0,"kev_listed":3,"no_patch_available":7,"partial_patch_available":1,"full_patch_available":2,"total_cves_referenced":24,"cves_referenced":["CVE-2023-25914","CVE-2023-25915","CVE-2025-41450","CVE-2026-103406","CVE-2026-120704","CVE-2026-120705","CVE-2026-123890","CVE-2026-129242","CVE-2026-129243","CVE-2026-129244","CVE-2026-129245","CVE-2026-131914","CVE-2026-132165","CVE-2026-132224","CVE-2026-133275","CVE-2026-133303","CVE-2026-133311","CVE-2026-133323","CVE-2026-133324","CVE-2026-133469","CVE-2026-133968","CVE-2026-134624","CVE-2026-136716","CVE-2026-76466"],"total_kql_queries":55,"total_iocs":125,"actionable_iocs_excluding_notes":47,"new_to_kev_this_window":{"added_2026-11-27":["CVE-2026-120705","CVE-2026-129243","CVE-2026-136716"],"due_date":"2026-11-30","note":"CISA added three exploited CVEs on 27 November - two OSGeo GeoServer flaws and Drupal core CVE-2026-136716 - all due Monday 30 November. The Drupal addition CLOSES the open question this feed carried on 26 and 27 November about whether that CVE would be catalogued. Any tooling built on a KEV pull from before 27 November is wrong about all three."},"hard_network_iocs_this_run":["A stored query CREATED, then CONFIRMED to exist, then DELETED against GeoServer by an unauthenticated source (CVE-2026-120705 / CVE-2026-129243) - THE BEST INDICATOR IN THIS REPORT. watchTowr observed exactly this; no legitimate map client does it.","A prefixed GeoServer service name of the form /x/WFS or /\u003canything>/WFS, /WMS, /ows - effectively the CVE-2026-129243 authorization bypass signature","WFS GetFeatureById or STOREDQUERY_ID requests containing file://, 169.254.169.254, metadata.google.internal, /etc/passwd, web.xml or datastore.xml (GeoServer CVE-2026-120705)","An authentication cookie or login token whose value is empty, {} or %7B%7D (Vates Xen Orchestra CVE-2026-133469) - carried forward, still an exploit signature, and due today","A NON-NUMERIC VALUE in a Cacti graph display setting - the stored second-order SQL injection payload of the 4HTTP2SHELL zero-day, searched for directly","MiCollab LDAP connector service account authenticating from any host other than the MiCollab servers - Accenture's 32-minute domain controller pivot, and it SURVIVES THE PATCH","/core/install.php and /install.php (Drupal) - the attack surface for BOTH installer CVEs; any request since 18 NOVEMBER is in triage scope and a 200 response is a compromise indication","Drupal administrator accounts created on or after 18 November with no joiner record - the artefact Drupal reports SURVIVES THE UPGRADE","A Salt minion ID containing shell metacharacters or command substitution syntax (Juniper Session Smart Conductor, CVE-2026-103406, due today with forensic triage)","4505/tcp and 4506/tcp (SaltStack publish and request ports on Session Smart Conductor); 8080/tcp and 8443/tcp on GIS, map and INSPIRE-named hosts (GeoServer inventory)","Traversal sequences (.., %2e%2e, %252e) against MONAI Label /datastore, /upload, /annotation, /infer and /train endpoints (CVE-2026-133968, overdue, AI-agent exploited)","SSRF probe targets against mail security gateways - 169.254.169.254, metadata.google.internal, localhost, 127.0.0.1, file://, gopher://, dict:// (N-able Mail Assure CVE-2026-134624, overdue)","Direct pushes to protected branches, branch protection disabled or overridden, self-hosted runner registration, and new broadly scoped personal access tokens (the 1Password and SAP entry mechanism, twice in 48 hours)","NO attacker IP address, domain, URL, file hash or YARA rule was published for ANY entry in this report - including the DWP incident, where none exists at all"],"kev_deadlines_already_passed":["2026-11-23","2026-11-24","2026-11-26","2026-11-27"],"kev_deadlines_expiring_today_28_november":["2026-11-28"],"kev_cves_due_today_28_november":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915"],"kev_cves_overdue_and_still_exploited":["CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466"],"kev_cves_due_monday_30_november":["CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"],"kev_cves_due_9_december":["CVE-2026-133311","CVE-2025-41450"],"forensic_triage_required_per_bod_26_04":["CVE-2026-132165","CVE-2026-103406","CVE-2026-133469"],"cves_with_no_patch_available":{"CVE-2026-131914":"Idunno.AntiCsrf - no patch exists and none will. Only remediation is removing or replacing the dependency, including transitive references. OVERDUE since 27 November.","Cacti 4HTTP2SHELL (no CVE assigned)":"Unpatched zero-day with a public exploit released 26 November without disclosure to the project. Mitigation is disabling the guest account and restricting web access."},"uk_government_entries":[1,2,3,4],"uk_corporate_and_sector_entries":[5,6,7,8,9,10],"cross_cutting_findings":["FIVE SEPARATE ENTRIES show an organisation's OWN INCIDENT RESPONSE becoming the pretext for the next attack: DWP's outage and journal sanction waiver (rank 1), the University of Liverpool's mandatory password reset (rank 7), 1Password's breach notification (rank 8), SAP's reported code-signing key rotation (rank 9), and Gatwick's supplier scam warning (rank 10). Treat it as a planning assumption and build the counter-message into the incident communications plan rather than after it.","TWO CONFIRMED INCIDENTS IN 48 HOURS began at a developer's SOURCE-CONTROL ACCOUNT - 1Password (rank 8) and SAP (rank 9). Neither was fundamentally about secrets committed to a repository; both were about an identity with write access and a path from that access toward something that ships. The controls are phishing-resistant MFA on source control, short-lived scoped tokens, branch protection and mandatory review on anything that can reach a build, signed commits, and separation between the identity that writes code and the identity that releases it.","THREE SEPARATE ITEMS SHOW THAT PATCHING IS NOT REMEDIATION: Drupal admin accounts and backdoors SURVIVE THE UPGRADE (rank 3); GeoServer's predictable remember-me signing key means forged administrator sessions SURVIVE THE UPGRADE unless credentials are rotated (rank 2); and MiCollab's stored LDAP connector credentials are a domain credential that SURVIVES THE PATCH (rank 4). In all three cases a version number is being mistaken for evidence of remediation.","TWO OF THE ITEMS IN THIS REPORT CANNOT BE CLOSED BY A DEPLOYMENT AT ALL - CVE-2026-131914 has no patch and never will, and the Cacti zero-day has no patch yet. Both are remediated by configuration change or dependency removal. A vulnerability management process built as a patch-deployment pipeline will tend to leave both open while reporting green on everything patchable.","THE UK CONSUMER-FACING THIRD-PARTY PATTERN HOLDS FOR A SIXTH CONSECUTIVE INSTANCE: Optimizely, ASOS, Next plc, TfL, Halfords and Gatwick - not one disclosed UK consumer-facing compromise this month began at the named brand's own perimeter. Gatwick's chain is now confirmed three deep (AutoPay, operated by ParkPark, used by Times24 UK Limited). This is a governance finding about third-party risk registers, not a technical one.","A NEW DATA CLASS APPEARS FOR THE FIRST TIME IN THIS FEED: conversational logs from a CUSTOMER-FACING AI SHOPPING ASSISTANT, claimed to contain shoppers' BODY MEASUREMENTS AND SIZING DETAILS, as the breach payload itself (rank 10, Next plc, attacker claim, unverified). Almost no organisation classified its assistant transcripts as a sensitive data store when the feature shipped."],"notable_status_changes_this_window":["DRUPAL CVE-2026-136716 IS NOW IN CISA KEV (added 27 November, due 30 November). This closes the open question carried in the 26 and 27 November reports, where exploitation rested solely on the Drupal Security Team's own statement and one tracker recorded an explicit negative against catalogue snapshot 2026.11.25. Recorded as a STATUS CHANGE - the earlier negative checks were accurate when made.","UNIVERSITY OF LIVERPOOL confidence rises from LOW to MEDIUM. Newly surfaced reporting establishes that the university ordered ALL staff and students to reset passwords by 1pm on 25 November citing a 'potential threat to our systems', after emergency system resets on 24 November. This corroborates that a security EVENT occurred; it does NOT corroborate the attacker's claims about what was taken.","DWP SCOPE QUESTION effectively resolved against the department's 'some online services' wording, by enumeration rather than by any source retracting. The affected list now runs to Universal Credit sign-in, journals, change reporting and caseworker messaging, State Pension, Pension Credit online, the Pension Credit Checker, PIP applications, Tell Us Once, ESA fit note submission, new claim journeys and the NHS Healthy Start portal.","DWP GOVERNMENT LANGUAGE HARDENED: from the department's 'precaution' on 27 November to Downing Street's 'LIVE AND ONGOING INCIDENT' with a malicious actor NOT ruled out, and the Work and Pensions Secretary's 'SERIOUS CYBER INCIDENT'. The ICO is now engaging.","F5 NGINX CVE-2026-123007 (rank 4 of the 27 November report) is NOT carried as a separate entry in this window. No development was found: the most recent coverage located still runs to approximately 24 November, exploitation remains unconfirmed, and it is still absent from CISA KEV. The contested CSA Singapore AL-2026-168 'reportedly exploited' position from 26 November is unchanged and unresolved. Mitigation guidance stands: the flaw requires HTTP/2, so disabling HTTP/2 removes the surface."],"window_assessment":"THE DEFINING EVENT IS STILL THE UK GOVERNMENT INCIDENT, AND IN THIS WINDOW IT GOT WORSE RATHER THAN CLEARER. The DWP outage has entered its third calendar day; Downing Street now calls it a 'LIVE AND ONGOING INCIDENT' and will not rule out a malicious actor; the Work and Pensions Secretary calls it a 'SERIOUS CYBER INCIDENT'; the ICO is engaging; and the outage has spread beyond DWP's own branded estate to the NHS-run Healthy Start portal. Two facts are newly actionable - sanctions WAIVED for missed Universal Credit journal entries, and a press-sourced expectation that disruption lasts MOST OF THE WEEKEND. There is still no vector, no actor, no CVE and NO NETWORK INDICATORS, so the only third-party hunting remains the fraud wave - and the journal waiver is now its sharpest hook. THE SECOND DEFINING FEATURE IS A NEW KEV BATCH THAT LANDS ON THE UK PUBLIC SECTOR WEB AND GEOSPATIAL ESTATE WITH A MONDAY DEADLINE: two exploited OSGeo GeoServer flaws, which is a technology embedded in UK INSPIRE geospatial publication by documented history and frequently supplier-maintained and unmonitored, plus Drupal CVE-2026-136716, whose listing closes the open question this feed carried for two days. GeoServer also delivers the single best indicator in this report - watchTowr's CREATE-VERIFY-DELETE stored query probe. THE THIRD IS THAT PATCHING HAS BEEN SHOWN NOT TO BE REMEDIATION IN THREE SEPARATE PLACES: Drupal admin accounts and backdoors survive the upgrade, GeoServer's predictable remember-me key means forged admin sessions survive the upgrade, and MiCollab's stored LDAP connector credentials - used by an attacker to reach a DOMAIN CONTROLLER IN 32 MINUTES per Accenture - survive the patch. THE FOURTH IS THE DEADLINE WALL ARRIVING ON A SATURDAY: eight exploited CVEs due today, seven overdue, three due Monday - eighteen across twelve unrelated product families in one week, with no common owner. On the corporate side, UK financial services appears for the first time in recent windows (INC Ransom listing Lloyd's insurer Brit, unverified and with sources contradicting each other on proof), the University of Liverpool entry firms up on a newly surfaced estate-wide forced password reset, TWO confirmed incidents in 48 hours began at a developer's source-control account (1Password and SAP), and the month's UK third-party pattern holds for a sixth consecutive instance.","highest_priority_action":"THERE ARE THREE, AND THEY TAKE UNDER AN HOUR BETWEEN THEM. FIRST, IF YOU SERVE BENEFIT CLAIMANTS IN ANY CAPACITY - local authority, housing association, credit union, debt advice or welfare rights charity, food bank network, NHS trust or early-years service: publish a message TODAY that does two things at once. Tell service users that DWP has WAIVED SANCTIONS for missed Universal Credit journal entries during the outage, and tell them in the same breath that DWP and the NHS will NEVER text or email asking for bank details or asking them to click a link to restore access. The waiver is the most reassuring fact available and simultaneously the most exploitable pretext; publish both halves together or you hand attackers the first without the second. Add that the NHS Healthy Start application portal is also down, scam texts go to 7726 and scam emails to report@phishing.gov.uk. SECOND, IF YOU RUN MITEL MICOLLAB: ROTATE THE LDAP CONNECTOR SERVICE ACCOUNT CREDENTIALS, patched or not. Accenture reports the attacker used those stored credentials to authenticate to a DOMAIN CONTROLLER 32 MINUTES after first contact. They are domain credentials the product holds by design and they survive the patch. THIRD, RUN TWO FREE SEARCHES. Search for authentication cookies or tokens whose value is empty, {} or %7B%7D (Vates Xen Orchestra CVE-2026-133469, due today with forensic triage required). And search your web logs back to 18 NOVEMBER for any request to /core/install.php or /install.php - a 200 response is a Drupal compromise indication, and Drupal reports attacker admin accounts SURVIVE THE UPGRADE. THEN, BEFORE MONDAY MORNING, WRITE DOWN THE SEQUENCE for the eleven exploited CVEs that will otherwise land on one team at once: eight due today (four Mitel, Juniper, Xen Orchestra, two Danfoss) and three due Monday (Drupal CVE-2026-136716, GeoServer CVE-2026-120705 and CVE-2026-129243). Start the GeoServer inventory now, because discovery is the hard part and the software is routinely absent from security asset lists.","new_entries_this_run":4,"new_entries_detail":["RANK 2 - OSGeo GeoServer CVE-2026-120705 and CVE-2026-129243 added to CISA KEV on 27 November, due 30 November; links in a five-stage unauthenticated RCE chain; 3,000+ instances internet-facing","RANK 5 - Cacti '4HTTP2SHELL' unpatched zero-day with a public exploit released 26 November without disclosure to the project; no CVE, no patch","RANK 6 - INC Ransom listed Brit Ltd / Brit Insurance, a Fairfax-owned Lloyd's specialty insurer, on 27 November with a ~33-day countdown","RANK 9 - SAP confirmed a security incident, reportedly handled internally as 'Project Granite', after reports of stolen employee GitHub tokens and altered source code"],"carry_over_entries":0,"materially_updated_entries":6,"materially_updated_detail":["RANK 1 (DWP) - six substantive additions: Downing Street's 'live and ongoing' characterisation with a malicious actor not ruled out; Pat McFadden's 'serious cyber incident'; ICO engagement; 'currently no evidence of customer data loss'; the NHS Healthy Start portal also offline; and the journal sanction waiver plus a press-sourced weekend duration estimate","RANK 3 (Drupal) - CVE-2026-136716 now IN KEV, and the new finding that attacker admin accounts and backdoors SURVIVE THE UPGRADE, making a compromise assessment necessary for any site with a reachable installer since 18 November","RANK 4 (deadline wall) - the wall has ARRIVED: eight CVEs due today, seven overdue, three due Monday; plus Accenture's detailed Mitel timeline including the 32-minute domain controller pivot via stored LDAP credentials","RANK 7 (University of Liverpool) - confidence raised from LOW to MEDIUM on the newly surfaced 25 November estate-wide mandatory password reset and 24 November emergency system resets","RANK 8 (1Password) - new detail that the hijacked GitHub account was used to PUSH MALICIOUS CODE TO BACKEND SERVICES, and an unresolved source conflict over whether SRP verifiers were taken","RANK 10 (N0n and Gatwick) - the Next claim now specifies 320,000+ lines of AI shopping assistant chats containing body measurements; Gatwick's chain confirmed three deep as AutoPay operated by ParkPark and used by Times24 UK Limited, with hashed passwords reportedly exposed"],"corrections_this_run":1,"corrections_detail":["DRUPAL CVE-2026-136716 KEV STATUS: the 26 and 27 November reports recorded that exploitation rested SOLELY on the Drupal Security Team's own statement and that the CVE was NOT in CISA KEV, citing one tracker's explicit negative check against catalogue snapshot 2026.11.25 at 07:43 GMT on 26 November. CISA added the CVE on 27 November with a 30 November deadline. This is recorded as a STATUS CHANGE rather than an error - the earlier negative checks were accurate when made - but any dashboard, report or attestation this feed informed before today understates that CVE and should be refreshed."],"unpatchable_exploited_flaws_this_run":["CVE-2026-131914 (Idunno.AntiCsrf for ASP.NET) - NO PATCH, NO FIX EVER. KEV deadline passed 27 November and remediation means removing or replacing the dependency including transitive references. The item most likely to have been silently skipped.","Cacti '4HTTP2SHELL' (NO CVE ASSIGNED) - unpatched zero-day with a public, tested exploit released 26 November without disclosure to the project. Mitigation is disabling the guest account and restricting web interface access.","CVE-2026-129713 (Danfoss AK-SM 8xxA, CVSS 9.8 unauthenticated RCE) - carried forward: fix only 'planned' for version 5.5.x with no release date."],"remediation_insufficient_without_further_action":["DRUPAL CVE-2026-132165 / CVE-2026-136716 - Drupal's reported testing shows ATTACKER ADMIN ACCOUNTS AND BACKDOORS SURVIVE THE UPGRADE, and the admin interface does not reveal compromise. Upgrading plus the update hook is not sufficient; a compromise assessment is required for any site with a reachable installer since 18 November.","GEOSERVER CVE-2026-129245 - a PREDICTABLE REMEMBER-ME SIGNING KEY permits administrator session forgery that can SURVIVE AN UPGRADE. Advisory guidance is to change administrator passwords where exposure is suspected; upgrading without rotating credentials and invalidating remember-me tokens is a version number, not remediation.","MITEL MICOLLAB - the product stores LDAP CONNECTOR CREDENTIALS by design, and Accenture reports the attacker used them to authenticate to a DOMAIN CONTROLLER 32 MINUTES after first contact. Those are domain credentials that SURVIVE THE PATCH and must be rotated."],"vendor_versus_authority_conflicts_this_run":["1PASSWORD SRP VERIFIERS - THE SHARPEST CONFLICT IN THIS WINDOW: one report states stolen SRP parameters CANNOT be used to access an account, attributed to 1Password; another, citing a company representative on 1Password's community forum, states the stolen data INCLUDED Secure Remote Password verifiers derived from user account passwords and Secret Keys. Materially different claims, unresolved, and the single thing to get clarified from the vendor in writing.","SAP - SAP has confirmed only that an incident exists and that it found no evidence of unauthorised access to customer business data. Reports of stolen employee GitHub tokens, altered source code, paused build pipelines and rotated code-signing keys come from Der Spiegel and Handelsblatt and are NOT confirmed by SAP. Two aggregator pages additionally claim the incident was 'confined to source code management', contradicting other outlets' statements that affected repositories are unknown - discarded rather than averaged.","GATWICK - the airport's stated scope is partial card metadata (brand, last four digits, expiry) in isolated cases among a small number of accounts, while several UK outlets assert stolen BANK DETAILS, which Gatwick has not confirmed. Unresolved on day four. One report additionally describes HASHED PASSWORDS as exposed.","NEXT PLC - Next's LSE-filed characterisation is 'certain benign data' with no customer personal data compromised; N0n claims 3.5m+ rows plus 320,000+ lines of AI assistant chats containing body measurements and 293 named staff. Next has not named the supplier and has not linked the two events.","GEOSERVER EXPLOITATION - watchTowr observed PROBING and has NOT reported successful code execution; Eye Security is reported to have observed in-the-wild exploitation of CVE-2026-120705 on 25 November; CISA's 27 November KEV listing is the authoritative confirmation and supersedes earlier accurate negative checks.","MITEL MICOLLAB - CISA lists all five CVEs as actively exploited and Accenture has published an exploitation timeline; Mitel's own advisory, last updated 24 November, does NOT mention in-the-wild exploitation.","F5 NGINX CVE-2026-123007 - carried forward unresolved. CSA Singapore's 26 November alert says 'reportedly' actively exploited; an independent analysis found no exploitation reported by CERT-EU, Cloudflare or any vendor as of 20 November; still NOT in CISA KEV and no development found in this window."],"deadline_conflicts_unresolved_this_run":["Exact KEV due dates are reconstructed from secondary reporting and trackers because the CISA KEV catalogue and the 27 November CISA alert could not be retrieved directly. Where sources conflict the EARLIEST date is the planning assumption.","One source gave no CVE-specific due date for CVE-2026-103406 (Juniper Session Smart) and reported 28 November for the batch overall.","GeoServer advisory CVE counts differ - five in some write-ups, six in others, and a separate NCSC-NL advisory on a GeoServer feed is reported to count seventeen. Different scopes rather than a contradiction, but it will confuse anyone reading several sources.","Mitel MiCollab version strings remain mutually incompatible: '10.3 (10.3.0.18) and earlier affected' versus '10.3 and earlier, fixed in 10.3.0.18 or later'.","Vates Xen Orchestra fixed versions remain contested: 6.9.2 / 6.10.1 versus 5.213.1 / 5.211.2 - not adjacent numbering schemes, so one is wrong.","Cacti zero-day version scope is simply UNKNOWN - tested only against Cacti Core 1.2.31 and no source establishes whether earlier versions are affected."],"ai_agent_attack_reports_referenced":["MITEL MICOLLAB (rank 4) - Accenture Apex Labs observed the attacker's systems contacting TWO UNNAMED COMMERCIAL AI API SERVICES, states its telemetry is SAMPLED and that it CANNOT determine how they were used, and assesses the activity as consistent with data triage, exploitation support, web-shell work or extortion preparation. API CONTACTS ARE TIMING EVIDENCE, NOT PROOF of an automated attack. No group named. Recorded as SUSPECTED AI-assisted.","SAP (rank 9) - Der Spiegel reported the attackers MAY have used agentic AI. Explicitly unverified and not carried as established.","PROJECT MONAI LABEL CVE-2026-133968 (rank 4, OVERDUE) - found AND exploited by AI agents per Amazon Threat Intelligence, reaching a root shell on university servers in ELEVEN MINUTES. Directly relevant to UK universities and NHS research computing, and sits in the same report as a UK Russell Group university with a live extortion clock.","DRUPAL CVE-2026-132165 (rank 3) - reportedly discovered by Anthropic's open-source scanner, patched 18 November and exploited from 19 November; a second distinct bypass followed roughly seven days later and was abused the day it was disclosed.","NCSC, 24 NOVEMBER - a marked rise in AI-assisted attacks since September across multiple sectors, knocking services offline and compromising systems, while finding that NOT ONE of the weaknesses exploited was new. Recommended controls were basic hygiene, zero trust, Cyber Essentials, the Cyber Assessment Framework for essential services, throttled sign-ups and AN ACCURATE INVENTORY OF PUBLIC-FACING SYSTEMS - which is precisely the control whose absence puts supplier-maintained GeoServer and forgotten Drupal multisites in rank 2 and rank 3.","NCSC STATE OF THE CYBER NATION, 3 NOVEMBER - judges an AI-powered ransomware attack on UK critical national infrastructure 'HIGHLY LIKELY' by 2028, with energy, water, transport and healthcare at greatest risk, and assesses that AI's largest effect is accelerating and scaling existing tactics rather than creating new attack vectors."],"third_party_compromise_pattern_this_month":"SIX FOR SIX, AND THE CHAIN IS NOW DEMONSTRABLY THREE DEEP. Every confirmed UK consumer-facing compromise disclosed in November 2026 originated at a THIRD PARTY, not at the named brand: Optimizely's signup flow serving malicious JavaScript from its own CDN to at least 178 organisations including the BBC, HSBC, TalkTalk, Zoom, IKEA, Salesforce and CNN (16 November); ASOS via third-party communications platforms; Next plc via an unnamed online supplier, disclosed through an LSE filing (23 November); TfL Oyster; Halfords via a third-party digital service; and London Gatwick Airport, where this window CONFIRMS the structure as AutoPay, OPERATED BY PARKPARK, USED BY TIMES24 UK LIMITED, Gatwick's drop-off zone manager - three organisations between the airport brand and the vulnerability, none of which a customer paying a drop-off charge could have known existed. Not one of these organisations was breached at its own perimeter, and not one could have prevented it by hardening its own estate. The N0n campaign extends the pattern with an inference worth acting on: FIVE retail listings including hmv and Torrid carry IDENTICAL wording about shopper search sessions, pointing at ONE UNNAMED SHARED E-COMMERCE SEARCH PROVIDER rather than twenty-plus separate intrusions - and that provider's other customers are an undisclosed victim population who will learn from a leak site rather than a notification. This window adds a new dimension to the same pattern: the claimed Next payload includes 320,000+ LINES OF AI SHOPPING ASSISTANT CHATS CONTAINING BODY MEASUREMENTS AND SIZING DETAILS. A customer-facing AI feature is now itself a sensitive data store, and almost nobody classified it as one when the feature shipped. The conclusion is a GOVERNANCE finding rather than a technical one: most UK third-party risk registers do not reach three layers deep, do not include the operator behind the supplier, and do not include the AI feature bolted onto the website last year. If your register would not have told you, before this month, that a company called ParkPark held your customers' partial card data, it is a list of contracts rather than a map of risk.","source_control_compromise_pattern_this_window":"TWO CONFIRMED INCIDENTS IN 48 HOURS BEGAN AT A DEVELOPER'S SOURCE-CONTROL ACCOUNT, at opposite ends of the scale: 1PASSWORD, where an attacker hijacked an employee's corporate GitHub account and used it to PUSH MALICIOUS CODE TO BACKEND SERVICES before pulling customer records (vaults not accessed per the vendor, but the SRP verifier question unresolved); and SAP, which confirmed an incident reportedly handled internally as 'PROJECT GRANITE' after reports that attackers stole employee GitHub tokens and COPIED AND ALTERED SOURCE CODE, and which has reportedly PAUSED BUILD PIPELINES and ROTATED CODE-SIGNING KEYS - actions a vendor takes when it cannot yet prove the code leaving its pipeline is the code its engineers wrote, though NOTHING in any report indicates tampered code reached customers. NEITHER INCIDENT WAS FUNDAMENTALLY ABOUT SECRETS COMMITTED TO A REPOSITORY. Both were about an identity with WRITE access and a path from that access toward something that ships. The controls that follow are: phishing-resistant MFA on source control (not push or SMS), short-lived narrowly scoped tokens with alerting on creation, branch protection and mandatory review on any branch that can reach a build, signed commits, separation between the identity that writes code and the identity that releases it, and alerting on changes to pipeline, runner and signing configuration rather than only on code changes. The question to answer this weekend, whether or not you consider yourself a software organisation: could ONE compromised engineering identity push code that reaches a production service without a second human and a second credential? Most UK government departments and large corporates now build and ship software, and many have never asked it.","incident_response_becomes_the_next_pretext":"FIVE SEPARATE ENTRIES IN THIS SINGLE REPORT SHOW AN ORGANISATION'S OWN INCIDENT RESPONSE HANDING ATTACKERS THE NEXT PRETEXT. DWP's publicised outage plus its journal sanction waiver ('your journal entry failed, reconfirm your details to avoid a sanction'). The University of Liverpool's publicised mandatory password reset ('your password reset failed, complete it here'). 1Password's breach notification, against which the vendor itself warns customers to be wary of emails telling them to secure their accounts. SAP's reported code-signing key rotation ('import this new SAP trust certificate'). And Gatwick's supplier scam warning, which had to name four unfamiliar entities - Gatwick, Times24, AutoPay and ParkPark - precisely because unfamiliar supplier names are what fraudsters exploit. That is consistent enough to be a planning assumption rather than an observation: WHATEVER AN ORGANISATION TELLS ITS USERS TO DO DURING AN INCIDENT WILL BE IMPERSONATED WITHIN DAYS. The practical consequence is that the counter-message belongs INSIDE the incident communications plan and should go out in the same message as the instruction - not as a follow-up after the phishing starts. Gatwick did this best of the five by naming every entity in its chain.","deadline_obligations_beyond_patching":["CVE-2026-132165 (Drupal core) - KEV entry reported to require FORENSIC TRIAGE under BOD 26-04, not patching alone. Deadline passed 27 November.","CVE-2026-103406 (HPE Juniper Session Smart) - three-day deadline with MANDATORY FORENSIC TRIAGE. Due TODAY, 28 November.","CVE-2026-133469 (Vates Xen Orchestra) - required action reported as applying vendor mitigations AND following BOD 26-04 FORENSIC TRIAGE guidance. Due TODAY, 28 November.","CVE-2026-131914 (Idunno.AntiCsrf) - deadline CANNOT be met by patching: no patch exists and none will, so remediation means removing or replacing the dependency including transitive references. OVERDUE.","CVE-2026-136716 (Drupal core) - no forensic triage flag found in any source, BUT Drupal's reported finding that attacker admin accounts and backdoors SURVIVE THE UPGRADE makes a compromise assessment necessary on its own merits for any site with a reachable installer since 18 November. Due MONDAY 30 November.","CVE-2026-129245 (GeoServer, not itself in KEV) - the predictable remember-me signing key means remediating the two KEV GeoServer CVEs requires ADMINISTRATOR CREDENTIAL ROTATION and remember-me token invalidation beyond the upgrade."],"kev_additions_27_november":["CVE-2026-120705","CVE-2026-129243","CVE-2026-136716"],"kev_cves_due_today":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915"],"kev_cves_overdue":["CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466"],"kev_deadlines_expiring_today":["2026-11-28"],"kev_deadlines_passed_or_due":["2026-11-23","2026-11-24","2026-11-26","2026-11-27","2026-11-28","2026-11-30","2026-12-09"],"kev_cves_due_within_72_hours_count":11}}</script>

<script>
(function(){
  "use strict";

  /* ---------- labels ---------- */
  var STATUS = {
    exploited_in_the_wild:                     {short:"Exploited",        full:"Exploited in the wild",                  cls:"st-exploited", seg:"s-exploited"},
    exploitation_attempts_reported_unconfirmed:{short:"Attempts seen",    full:"Exploitation attempts reported (unconfirmed)", cls:"st-attempts", seg:"s-attempts"},
    public_poc_available:                      {short:"Public PoC",       full:"Public PoC available",                   cls:"st-attempts", seg:"s-attempts"},
    no_known_exploitation:                     {short:"No known exploit", full:"No known exploitation",                   cls:"st-none",      seg:"s-none"}
  };
  var PATCH = {yes:null, partial:{t:"Partial patch",cls:"partial"}, no:{t:"No patch",cls:"nopatch"}};
  var PLATFORM = {sentinel:"Sentinel", defender_xdr:"Defender XDR"};
  var CATEGORY = {vulnerability:"Vulnerability", vulnerability_bundle:"Vulnerability bundle",
                  threat_actor_campaign:"Threat actor campaign", incident:"Incident"};

  /* ---------- dom helpers (textContent only - no HTML injection) ---------- */
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null && text !== "") n.textContent = String(text);
    return n;
  }
  function kv(dl, key, val, accent){
    var d = el("div"), dt = el("dt", null, key), dd = el("dd");
    if (accent){ var b = el("b", null, val); dd.appendChild(b); } else { dd.textContent = val; }
    d.appendChild(dt); d.appendChild(dd); dl.appendChild(d); return d;
  }
  function sec(title){
    var s = el("section","sec"); s.appendChild(el("h3", null, title)); return s;
  }
  function fmtDate(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var day = String(d.getUTCDate()).padStart(2,"0");
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    var out = day + " " + mon + " " + d.getUTCFullYear();
    if (String(iso).indexOf("T") > -1){
      out += " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + "Z";
    }
    return out;
  }
  function label(s){
    if (!s) return "—";
    return String(s).replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
  }

  /* ---------- minimal KQL highlighter (safe: builds text nodes only) ---------- */
  var KQL_KW = ("let|where|project|summarize|extend|sort|order|by|join|union|take|limit|distinct|"
    + "count|dcount|countif|sum|make_set|make_list|min|max|any|avg|bin|ago|now|datetime|dynamic|"
    + "todouble|tostring|toint|tolong|strcat|strlen|extract|extract_all|parse_json|coalesce|"
    + "set_intersection|isnotempty|isempty|has|has_any|has_all|has_cs|contains|startswith|"
    + "endswith|in|and|or|not|asc|desc|on|datetime_part|dayofweek|column_ifexists|"
    + "ipv4_is_in_any_range|iff|case|print|top").split("|");
  var KQL_RE = new RegExp("(//[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b("
    + KQL_KW.join("|") + ")\\b", "g");
  function highlight(code){
    var frag = document.createDocumentFragment(), last = 0, m;
    KQL_RE.lastIndex = 0;
    while ((m = KQL_RE.exec(code)) !== null){
      if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
      var span = el("span", m[1] ? "c" : (m[2] ? "s" : "k"), m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
    return frag;
  }

  function copyBtn(getText, labelText){
    var b = el("button","copy", labelText || "Copy");
    b.type = "button";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = getText();
      function done(){
        var old = b.textContent;
        b.textContent = "Copied"; b.classList.add("ok");
        setTimeout(function(){ b.textContent = old; b.classList.remove("ok"); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
      } else { fallback(txt, done); }
    });
    return b;
  }
  function fallback(txt, done){
    var ta = el("textarea"); ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  /* ---------- state ---------- */
  var DATA = null, FILTER = {q:"", status:"all", kev:false, nopatch:false}, ALL_OPEN = false;

  /* ---------- render: masthead / tiles / posture ---------- */
  function renderHead(){
    var r = DATA.report || {}, w = r.coverage_window || {};
    document.getElementById("feed-name").textContent = DATA.feed_name || "Threat Intelligence Brief";
