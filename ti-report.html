e instruction to obtain shell access - including the API mapping phase. That is the fastest documented discovery-to-root sequence this feed has carried, and it is the specific report that the NCSC's 24 November publication at rank 5 is describing in the abstract.\n\nThe documented persistence mechanism is the part to hunt for: a reverse shell planted in sitecustomize.py. That is a Python file which the interpreter imports automatically at startup, on every invocation, which makes it an exceptionally clean persistence location and one that no malware scanner treats as suspicious by default. Check it on every server that ran MONAI Label, including ones you have since patched, because patching does not remove a file the attacker already wrote.\n\nWHY THIS IS A UK GOVERNMENT ITEM. MONAI Label does not live in corporate IT. It lives in NHS trust imaging departments, in trust-affiliated research units, in university medical schools and in the research computing estates that sit alongside both. Those servers are frequently commissioned by clinical researchers on grant funding, are often not in the trust's asset inventory, are often not enrolled in endpoint management, and are sometimes reachable from wider networks because a collaborator needed access. The actual finding here is not the CVE. It is that most NHS trusts and universities cannot currently answer the question 'do we run MONAI Label, and where' from any system of record, and the only reliable way to find out before tomorrow is to ask research computing and imaging teams directly.\n\nN-ABLE MAIL ASSURE, CVE-2026-134624. A server-side request forgery flaw, CVSS 9.3, in N-able's hosted mail security product. The provenance is the interesting part: N-able found it while investigating its own security breach of 16 November 2026. So the sequence is that a security vendor was breached, and in investigating that breach discovered a critical flaw in a product it operates on behalf of customers, which CISA then assessed as actively exploited. N-able's reported position is that exploitation was confined to a single N-able hosted server.\n\nWHY THIS IS A UK ITEM, AND THE QUESTION TO ASK. Mail Assure reaches UK organisations overwhelmingly through managed service providers rather than directly, which means most affected UK bodies - including a substantial number of small public sector organisations, schools, GP practices, housing associations and SMEs - do not have a contractual relationship with N-able at all and will not receive the advisory. They have an MSP. So the action is not patching; it is a written question to the MSP, today, with three parts: what build are we on, was our tenant in scope, and was this flaw the entry vector for the 16 November breach. Do not accept 'exploitation was confined to a single N-able hosted server' as an answer to the third question - that is a statement about where exploitation occurred, not about which tenants that server handled mail for. An SSRF in a mail security gateway is positioned to reach internal services and cloud instance metadata from a trusted network position, so the answer matters.\n\nSTATUS, CONFLICTS AND WHAT THIS ENTRY DOES NOT CLAIM. Both CVEs are in KEV on CISA's assessment of active exploitation, both have fixes available, and the MONAI exploitation account is unusually well-evidenced because the attacker's own operation was documented by Amazon Threat Intelligence rather than inferred from victim telemetry. One vulnerability tracker still records no evidence of exploitation for CVE-2026-134624; that record predates the KEV addition and is superseded. No indicators of compromise have been published for the N-able flaw at all, so hunting there is limited to the behavioural pattern of outbound requests from the mail gateway to internal or metadata endpoints. No N-able build numbers could be verified in this run - the advisory could not be read directly, and this report deliberately does not guess them.","recommended_actions":["Ask research computing, radiology informatics and university medical school IT directly today whether MONAI Label is running anywhere, and treat the answer from people rather than from the CMDB as authoritative. The asset inventory will not know. This is the single step that decides whether the entry applies to you, and it cannot be automated before tomorrow's deadline.","Patch MONAI Label to 0.8.6 and, separately and regardless of patch status, enable authentication. The product ships with authentication disabled by default, so a patched server with default configuration is still a server that anyone who can route to it can use.","Check sitecustomize.py on every server that has ever run MONAI Label, including servers you have already patched and servers you have decommissioned but not wiped. This is the specific persistence Amazon documented, Python imports it automatically at every interpreter start, and patching does not remove a file the attacker already wrote.","Remove MONAI Label servers from any network path that is not strictly required. These are research tools with a trusted-network security model; if one is reachable from a general staff VLAN or from the internet, network segmentation is a faster and more durable control than the patch.","For N-able Mail Assure, send your MSP a written question today with three parts: which build our tenant is on, whether our tenant was in scope of CVE-2026-134624, and whether this flaw was the entry vector for N-able's 16 November breach. Ask for a dated written answer and record the date you asked, because for most UK organisations that record is the only remediation evidence available by tomorrow.","Do not accept 'exploitation was confined to a single N-able hosted server' as an answer to whether your tenant was affected. That statement describes where exploitation happened, not which customers that server processed mail for. Ask the second question explicitly.","Hunt for outbound requests from mail security infrastructure to internal addresses, cloud instance metadata endpoints and link-local addresses. SSRF in a gateway is valuable precisely because the gateway sits in a trusted position, and since no indicators have been published for this CVE, this behavioural pattern is the only hunting available.","Add both CVEs to your KEV deadline tracker with tomorrow's date and record an explicit decision where you will miss it. Five KEV deadlines fall inside the next 48 hours across this report; the ones that will be missed are the ones nobody has written down.","Treat the MONAI timeline as a planning input for everything else. Eleven minutes from an instruction to root, on a server nobody knew existed, is the operational reality the NCSC described in its 24 November publication. Asset discovery, not patch velocity, is the control that would have prevented it.","Review where else in your estate a research or scientific tool with authentication disabled by default is running on a trusted network. MONAI Label is one instance of a category, and the category - grant-funded scientific software outside asset management - is the larger exposure for NHS trusts and universities."],"references":["https://www.cisa.gov/news-events/alerts/2026/11/23/cisa-adds-two-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://shattered.io/cisa-kev-monai-label-cve-2026-133968-n-able-mail-assure-cve-2026-134624-nov-26/","https://thenextweb.com/news/cairn-ai-agents-zero-day-monai-label-cisa-amazon","https://www.ncsc.gov.uk/blogs/familiar-weaknesses-exploited-faster-defending-against-agentic-cyber-attacks","https://thehackernews.com/2026/11/cisa-warns-of-active-exploitation-of.html","https://www.cisa.gov/news-events/cybersecurity-advisories"],"kql":[{"platform":"defender_xdr","table":"DeviceFileEvents","name":"sitecustomize.py creation or modification - the documented MONAI Label persistence","description":"Run this first and run it across the whole estate, not just imaging servers. Python imports sitecustomize.py automatically at every interpreter start, which makes it ideal persistence and invisible to most scanning. Patching MONAI Label does not remove it.","query":"DeviceFileEvents\n| where Timestamp > ago(180d)\n| where FileName =~ \"sitecustomize.py\"\n| where ActionType in (\"FileCreated\", \"FileModified\", \"FileRenamed\")\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName, RequestAccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Discovery of MONAI Label servers by process command line","description":"The inventory query. These servers are commissioned by researchers on grant funding and are frequently absent from the asset register, so process telemetry is often the only system of record that knows they exist.","query":"DeviceProcessEvents\n| where Timestamp > ago(90d)\n| where ProcessCommandLine has_any (\"monailabel\", \"monai_label\", \"monai.apps\", \"monailabel.main\")\n   or InitiatingProcessCommandLine has_any (\"monailabel\", \"monai_label\")\n| summarize FirstSeen = min(Timestamp), LastSeen = max(Timestamp), Commands = make_set(ProcessCommandLine, 10) by DeviceName, DeviceId, AccountName\n| order by LastSeen desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Shell and interpreter children of the MONAI Label Python process","description":"The evidence of successful exploitation. Path traversal in MONAI Label leads to code execution as the service account, so a shell or network utility whose parent is the MONAI Python process is the finding.","query":"DeviceProcessEvents\n| where Timestamp > ago(90d)\n| where InitiatingProcessCommandLine has_any (\"monailabel\", \"monai_label\", \"uvicorn\", \"gunicorn\")\n| where FileName has_any (\"sh\", \"bash\", \"dash\", \"nc\", \"ncat\", \"socat\", \"curl\", \"wget\", \"python\", \"python3\", \"chmod\", \"crontab\", \"ssh-keygen\")\n| project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, AccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Inbound exposure of MONAI Label listeners and path traversal request shapes","description":"Establishes reachability, which with authentication disabled by default is the entire exposure. Combine with external attack surface data; a MONAI Label server reachable beyond its research subnet is the priority regardless of patch state.","query":"DeviceNetworkEvents\n| where Timestamp > ago(60d)\n| where InitiatingProcessFileName has_any (\"python\", \"python3\", \"uvicorn\", \"gunicorn\")\n| where ActionType in (\"InboundConnectionAccepted\", \"ListeningConnectionCreated\")\n| summarize Connections = count(), RemoteIPs = make_set(RemoteIP, 50), Ports = make_set(LocalPort, 20) by DeviceName, InitiatingProcessFileName\n| extend ExternalSources = array_length(RemoteIPs)\n| order by Connections desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Path traversal patterns against imaging and research hosts","description":"Perimeter and proxy view of the exploitation attempt itself. Traversal sequences in a request to a MONAI Label endpoint are the attack; adjust the destination filter to your research network ranges.","query":"CommonSecurityLog\n| where TimeGenerated > ago(60d)\n| where RequestURL has_any (\"../\", \"..%2f\", \"..%252f\", \"%2e%2e%2f\", \"..\\\\\")\n   or RequestURL has_any (\"/datastore\", \"/infer\", \"/activelearning\", \"/session\")\n| summarize Requests = count(), Urls = make_set(RequestURL, 20), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP, DestinationIP, DestinationPort, DeviceAction\n| order by Requests desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound SSRF-shaped requests from mail security infrastructure - N-able Mail Assure","description":"No indicators have been published for CVE-2026-134624, so this behavioural pattern is the only hunting available. SSRF from a gateway is valuable because the gateway sits in a trusted position, and cloud metadata endpoints are the classic target.","query":"DeviceNetworkEvents\n| where Timestamp > datetime(2026-11-01)\n| where RemoteIP in (\"169.254.169.254\", \"169.254.170.2\", \"100.100.100.200\") or ipv4_is_private(RemoteIP) or RemoteUrl has_any (\"metadata.google.internal\", \"metadata.azure.com\", \"instance-data\")\n| where InitiatingProcessFileName has_any (\"mailassure\", \"spamexperts\", \"postfix\", \"exim\", \"nginx\", \"httpd\", \"java\")\n| summarize Connections = count(), Destinations = make_set(strcat(RemoteIP, \":\", tostring(RemotePort)), 30), FirstSeen = min(Timestamp) by DeviceName, InitiatingProcessFileName\n| order by Connections desc"},{"platform":"sentinel","table":"SigninLogs","name":"MSP and third-party administrative access around the N-able breach date","description":"For organisations whose mail security comes through an MSP, this is the available compensating visibility: what the MSP's accounts did in your tenant around 16 November 2026, when N-able was breached.","query":"SigninLogs\n| where TimeGenerated between (datetime(2026-11-10) .. datetime(2026-11-25))\n| where UserPrincipalName has_any (\"msp\", \"support\", \"n-able\", \"nable\", \"mailassure\", \"partner\", \"admin@\")\n   or ResourceDisplayName has_any (\"Mail\", \"Exchange\", \"Graph\")\n| where ResultType == 0\n| summarize Signins = count(), IPs = make_set(IPAddress, 30), Apps = make_set(AppDisplayName, 20), Locations = make_set(Location, 10) by UserPrincipalName\n| order by Signins desc"}],"iocs":[{"type":"filepath","value":"sitecustomize.py","context":"The documented persistence location for the MONAI Label compromise - a reverse shell planted in a Python file the interpreter imports automatically at every start. Check it on every server that ever ran MONAI Label, patched or not, since the patch does not remove it.","confidence":"high","source":"Amazon Threat Intelligence via secondary reporting"},{"type":"ttp","value":"Autonomous AI agents (Cairn framework) performing API mapping, vulnerability discovery and exploitation of CVE-2026-133968 to root access in approximately 11 minutes from a bare instruction to obtain shell access","context":"The fastest documented discovery-to-root sequence this feed has carried, and unusually well evidenced because the operation itself was documented rather than inferred from victim telemetry.","confidence":"high","source":"Amazon Threat Intelligence via secondary reporting"},{"type":"ttp","value":"Path traversal in the MONAI Label server leading to arbitrary file write and code execution as the service account","context":"The exploitation mechanism. Traversal sequences in requests to MONAI Label endpoints are the attack signature available in perimeter logs.","confidence":"high","source":"Project MONAI advisory and CISA KEV via secondary reporting"},{"type":"ttp","value":"Server-side request forgery from the N-able Mail Assure platform, positioned to reach internal services and cloud instance metadata from a trusted network location","context":"The N-able exploitation mechanism as described. No indicators have been published, so this behavioural shape is the only hunting signal available.","confidence":"medium","source":"N-able advisory via secondary reporting"},{"type":"behaviour","value":"MONAI Label Python process (uvicorn/gunicorn) spawning a shell, netcat, socat, curl, wget, chmod or crontab","context":"Highest-confidence evidence of successful exploitation on a MONAI Label host, given no file hashes have been published.","confidence":"high","source":"Analyst assessment based on Amazon Threat Intelligence reporting"},{"type":"behaviour","value":"MONAI Label server accepting inbound connections from outside its research subnet","context":"With authentication disabled by default, reachability is the entire exposure. A reachable server is the priority finding whether or not it has been patched.","confidence":"high","source":"Analyst assessment"},{"type":"behaviour","value":"Outbound requests from mail security infrastructure to 169.254.169.254 or other cloud instance metadata endpoints","context":"The classic SSRF target. Relevant to CVE-2026-134624 and worth a standing detection regardless of this CVE.","confidence":"medium","source":"Analyst assessment"},{"type":"note","value":"MONAI Label fixed version: 0.8.6","context":"The remediation target. Verify against the Project MONAI advisory before using for audit evidence; it is cited from search-surfaced summaries.","confidence":"high","source":"Project MONAI advisory via secondary reporting"},{"type":"note","value":"MONAI Label ships with authentication DISABLED by default","context":"The configuration fact that turns a path traversal flaw into an unauthenticated root compromise. A patched server left on default configuration is still exposed to anyone who can route to it.","confidence":"high","source":"Multiple secondary reports"},{"type":"note","value":"CVE-2026-133968: CVSS 9.8, added to CISA KEV 2026-11-23, remediation due 2026-11-26","context":"One of five KEV deadlines falling inside the next 48 hours. No deadline expires today.","confidence":"high","source":"CISA KEV catalogue via secondary reporting"},{"type":"note","value":"CVE-2026-134624: CVSS 9.3, added to CISA KEV 2026-11-23, remediation due 2026-11-26","context":"The second of tomorrow's two deadlines. For most UK organisations this is remediated by an MSP, not by the organisation, which makes the written question to the MSP the only available evidence of action.","confidence":"high","source":"CISA KEV catalogue via secondary reporting"},{"type":"note","value":"N-able discovered CVE-2026-134624 while investigating its own security breach of 16 November 2026","context":"The provenance that should drive the question to your MSP. A security vendor was breached and found a critical flaw in a product it operates for customers; the relationship between the two has not been publicly settled.","confidence":"high","source":"N-able advisory via secondary reporting"},{"type":"note","value":"N-able's reported position is that exploitation was confined to a single N-able hosted server","context":"This describes where exploitation occurred, not which customer tenants that server processed mail for. Do not accept it as an answer to whether your tenant was affected.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"No N-able Mail Assure fixed build numbers could be verified in this run and none are stated here","context":"The advisory could not be read directly. Obtain the build number from N-able or your MSP in writing rather than from any third-party summary, including this one.","confidence":"high","source":"Analyst assessment - collection limitation"},{"type":"note","value":"One vulnerability tracker still records no evidence of exploitation for CVE-2026-134624; that record predates the 23 November KEV addition and is superseded","context":"Another instance of stale tracker data suppressing priority. The same pattern appears at ranks 1, 2 and 4 of this report.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"No indicators of compromise, file hashes or YARA rules have been published for CVE-2026-134624","context":"Hunting for the N-able flaw is necessarily behavioural. Do not interpret a clean indicator search as evidence of no compromise.","confidence":"high","source":"Analyst assessment across reviewed sources"}]},{"rank":4,"id":"TI-2026-11-25-004","title":"MATERIAL UPDATE AND A CORRECTION TO YESTERDAY'S ENTRY: Idunno.AntiCsrf CVE-2026-131914 Was Added to CISA KEV on 24 November With a Deadline of 27 November - a Mandated Remediation Date for a Vulnerability That Has No Patch and Never Will, Which Means the Only Compliant Remediation Is Finding and Deleting the DLL","cve_ids":["CVE-2026-131914"],"vendor":"Idunno (abandoned open-source project)","affected_products":["Idunno.AntiCsrf 0.9.1.0","Idunno.AntiCsrf 0.9.1 Beta","Any ASP.NET application on IIS referencing Idunno.AntiCsrf.dll or registering the AntiCsrf module in Web.config","No fixed version exists and none will be released - the project is abandoned"],"category":"vulnerability","cvss_v3":9.3,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-27","patch_available":"no","first_reported":"2026-11-18","last_updated":"2026-11-25","confidence":"high","summary":"THE CORRECTION FIRST. This feed carried this entry yesterday at rank 3 with kev_listed set to false. That is now wrong. CISA added CVE-2026-131914 to the Known Exploited Vulnerabilities catalogue on 24 November 2026, alongside the Drupal and Optimizely flaws at ranks 1 and 2, with a remediation deadline of 27 November 2026. If you took yesterday's report into a prioritisation meeting and the absence of a KEV listing was part of the argument for scheduling rather than acting, that argument no longer holds.\n\nWHY THE KEV LISTING MATTERS MORE HERE THAN USUAL. A KEV entry is an instruction to remediate by a date. For almost every other entry in this catalogue, remediation means applying a vendor patch. Here there is no vendor, no patch, and no possibility of one: Idunno.AntiCsrf is an abandoned open-source project, the affected versions are 0.9.1.0 and 0.9.1 Beta, and no fixed version exists or will be released. So CISA has set a three-day deadline for a vulnerability whose only compliant remediation is deleting the component and replacing the functionality it provided. That is a developer-led code change, not a patch cycle, and three days is not enough time for one in most organisations - which means the realistic answer for most estates is the interim control plus a dated plan, and the realistic answer for internet-facing applications is removing the DLL now and accepting that CSRF protection is temporarily provided by something else.\n\nWHAT THE FLAW IS. Idunno.AntiCsrf is a small ASP.NET library providing anti-cross-site-request-forgery protection. CVE-2026-131914 is insecure deserialization: the module deserializes the value of the CSRF form field with no integrity check. Exploitation is a single unauthenticated HTTP POST. The attacker puts any non-empty value in the CSRF cookie and a crafted serialized payload in the matching form field. No authentication, no valid token, one request, and the result is code execution in the IIS worker process, w3wp.exe. CVSS 9.3. Mandiant's advisory MNDT-2026-0048, dated 18 November 2026, confirms exploitation in the wild, and the KEV addition is now an independent second authority saying the same thing.\n\nTHE INVERSION THAT MAKES THIS A UK PUBLIC SECTOR PROBLEM. The applications most likely to carry this library are the ones that were security reviewed. The library exists on a server because at some point a reviewer told a developer to add CSRF protection to an ASP.NET application, and the developer found a small library that did it. That is a governance process working as designed, in 2014, producing a critical unpatched remotely exploitable vulnerability in 2026. It also means the component is invisible to every system you would normally consult: it is not a product, nobody procured it, it appears in no vendor advisory feed, it is not in the software inventory, and it will never appear in a patch compliance report. The only way to find it is a file system and configuration search - Idunno.AntiCsrf.dll in bin directories and the GAC, and the AntiCsrf module registration in every Web.config. That search is achievable across a large estate in an afternoon and it is the step that decides whether this entry applies to you.\n\nTWO THINGS NOT TO DO. Do not rotate ASP.NET machine keys and record the issue as handled. Reporting is explicit that key rotation does not address this vulnerability; the deserialization happens without any integrity check, so there is no key involved to rotate. If an incident record says machine key rotation closed this, reopen it. And do not wait for a patch. There is no maintainer to produce one.\n\nHUNTING, WHICH IS NECESSARILY STRUCTURAL. Mandiant has published no indicators at all - no hashes, no IP addresses, no domains, no YARA rules. The published hunting guidance is a request pattern: anomalous POST requests to .aspx endpoints returning HTTP 302 or 500 with unusually large cs-bytes. The highest-confidence evidence of actual compromise is process creation from w3wp.exe, because that is where the code lands. Both are in the queries below.\n\nONE REMAINING CONFLICT. A reported NVD SSVC exploitation rating of 'none' has been recorded against this CVE, directly contradicting both Mandiant and now CISA. If your vulnerability management pipeline ingests the SSVC exploitation field, it is scoring an actively exploited, unpatchable, critical RCE as unexploited. Override it manually, and then find out what else that logic is suppressing - this is the fourth entry in today's report where stale or conflicting automated data is the reason an exploited flaw would be under-prioritised.","recommended_actions":["Search every IIS server for Idunno.AntiCsrf.dll today - bin directories and the Global Assembly Cache - and search every Web.config for the AntiCsrf module registration. This is a file system and configuration search achievable across a large estate in an afternoon, and it is the only way to discover a component that appears in no inventory and no advisory feed.","Update your KEV tracker: CVE-2026-131914 is now KEV-listed with a deadline of 27 November 2026. Yesterday's position that it was not listed is superseded. Where that absence was used to justify scheduling rather than acting, revisit the decision explicitly.","On internet-facing applications, remove Idunno.AntiCsrf.dll and its Web.config module registration now and provide CSRF protection by another means, rather than waiting for a planned code change. One unauthenticated POST is the entire exploit, so reachability is the entire exposure and the three-day deadline is not survivable by a normal release cycle.","Replace the protection with the supported ASP.NET anti-forgery mechanism as the permanent fix. This is a developer-led change, so raise it as such today with a named owner and a date - there is no patch to wait for and 'awaiting vendor fix' is not an available status.","Deploy the interim WAF control on every affected application: block or alert on POST requests carrying a populated CSRF cookie together with a serialized object payload in the matching form field. This is the only mitigation available before the code change lands.","Do NOT rotate ASP.NET machine keys and treat the issue as resolved. Reporting is explicit that key rotation does not address this flaw. Reopen any incident record that says it does.","Review IIS logs on affected servers for anomalous POST requests to .aspx endpoints returning HTTP 302 or 500 with unusually large cs-bytes. This is the published hunting guidance, and since Mandiant released no indicators there is nothing else to search for instead.","Hunt for process creation from w3wp.exe on every server that carried the library. Code execution lands in the IIS worker process, so a shell, script interpreter or encoded command spawned by w3wp.exe is the highest-confidence evidence of compromise available.","Check whether your vulnerability management pipeline is ingesting the NVD SSVC exploitation field for this CVE. A reported rating of 'none' contradicts both Mandiant and CISA. Override it manually and then audit what else the same logic is suppressing.","Use this as the trigger for a wider unmaintained-dependency audit of your ASP.NET estate. The lesson is that an abandoned third-party security library inside an application is a vulnerability with no remediation path, and the next one will arrive the same way - through a security review recommendation made years ago."],"references":["https://www.cisa.gov/news-events/alerts/2026/11/24/cisa-adds-three-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://www.securityweek.com/hackers-exploit-unpatched-flaw-in-defunct-idunno-anticsrf-library/","https://thehackernews.com/2026/11/hackers-exploit-critical-aspnet-anti.html","https://securityonline.info/idunno-anticsrf-rce-vulnerability-cve-2026-131914/","https://www.rescana.com/post/idunno-anticsrf-cve-2026-131914-deserialization-rce-exploited-no-fix-remove-now","https://zerohunt.ai/blog/cve-2026-131914-idunno-anticsrf-aspnet-rce/","https://dailysecurityreview.com/resources/idunno-anticsrf-flaw-cve-2026-131914-exploited-with-no-patch-available/","https://zerohour.day/item/cd2598a756bce7d973eb2253f30ed6838573dcf8"],"kql":[{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Presence of Idunno.AntiCsrf.dll across the estate","description":"The inventory query that decides whether this entry applies to you. Searches for the vulnerable assembly anywhere on disk. Run it first and run it broadly - this library is in no software inventory because nobody procured it.","query":"DeviceFileEvents\n| where Timestamp > ago(180d)\n| where FileName =~ \"Idunno.AntiCsrf.dll\"\n| summarize FirstSeen = min(Timestamp), LastSeen = max(Timestamp), Paths = make_set(FolderPath, 20) by DeviceName, DeviceId\n| order by DeviceName asc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Child processes spawned by the IIS worker process on web servers","description":"The highest-confidence evidence of exploitation that exists, given no indicators have been published. Code execution from CVE-2026-131914 lands in w3wp.exe, so any shell or interpreter it spawns needs an explanation.","query":"DeviceProcessEvents\n| where Timestamp > ago(90d)\n| where InitiatingProcessFileName =~ \"w3wp.exe\"\n| where FileName has_any (\"cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\", \"rundll32.exe\", \"regsvr32.exe\", \"certutil.exe\", \"bitsadmin.exe\", \"curl.exe\", \"net.exe\", \"whoami.exe\", \"nltest.exe\")\n| project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessCommandLine, AccountName, InitiatingProcessAccountName\n| order by Timestamp desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Published hunting pattern - anomalous POSTs to .aspx with 302 or 500 and large request size","description":"This is the only hunting guidance Mandiant published for this CVE. Tune the byte threshold to your own baseline; a serialized gadget payload is substantially larger than a normal form post.","query":"W3CIISLog\n| where TimeGenerated > ago(45d)\n| where csMethod == \"POST\"\n| where csUriStem endswith \".aspx\"\n| where scStatus in (302, 500)\n| extend RequestBytes = toint(csBytes)\n| summarize Requests = count(), AvgBytes = avg(RequestBytes), MaxBytes = max(RequestBytes), Statuses = make_set(scStatus, 5), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Computer, sSiteName, csUriStem, cIP, cUserAgent\n| where MaxBytes > 4000\n| order by MaxBytes desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Web.config modifications and new assemblies in IIS bin directories","description":"Two purposes. Finding Web.config files that register the AntiCsrf module is part of the inventory, and new files appearing in bin or the web root after 18 November is the post-exploitation artefact.","query":"DeviceFileEvents\n| where Timestamp > ago(90d)\n| where (FileName =~ \"Web.config\" and ActionType == \"FileModified\")\n   or (FolderPath has_any (\"\\\\bin\\\\\", \"inetpub\\\\wwwroot\") and FileName endswith_cs \".dll\" and ActionType == \"FileCreated\")\n   or (FolderPath has \"inetpub\\\\wwwroot\" and FileName has_any (\".aspx\", \".ashx\", \".asmx\") and ActionType == \"FileCreated\")\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, InitiatingProcessFileName, InitiatingProcessAccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connections initiated by w3wp.exe to external destinations","description":"Catches the second stage. An IIS worker process making outbound connections to the internet is abnormal in most estates and is the natural follow-on from deserialization code execution.","query":"DeviceNetworkEvents\n| where Timestamp > ago(90d)\n| where InitiatingProcessFileName =~ \"w3wp.exe\"\n| where isnotempty(RemoteIP) and not(ipv4_is_private(RemoteIP))\n| summarize Connections = count(), Ports = make_set(RemotePort, 15), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, RemoteIP, RemoteUrl\n| order by FirstSeen desc"},{"platform":"sentinel","table":"W3CIISLog","name":"KEV compliance evidence - which IIS sites carried the module and when requests stopped","description":"Produces the audit trail for a 27 November deadline that cannot be met with a patch. Use it to evidence that affected endpoints were removed from service or blocked, since there is no patch version number to record.","query":"W3CIISLog\n| where TimeGenerated > ago(30d)\n| where csUriQuery has_any (\"__AntiCsrfToken\", \"AntiCsrf\", \"__RequestVerificationToken\")\n   or csUriStem has \"AntiCsrf\"\n| summarize Requests = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Clients = dcount(cIP) by Computer, sSiteName, csUriStem\n| order by LastSeen desc"}],"iocs":[{"type":"filename","value":"Idunno.AntiCsrf.dll","context":"The vulnerable assembly. Its presence on an IIS server is the inventory indicator for this entry, and deleting it is the remediation. Search bin directories and the GAC.","confidence":"high","source":"Mandiant MNDT-2026-0048 via secondary reporting"},{"type":"ttp","value":"Single unauthenticated HTTP POST with a non-empty CSRF cookie and a crafted serialized payload in the matching form field, yielding insecure deserialization and code execution as w3wp.exe","context":"The complete exploit. No authentication, no valid token, one request. There is no authentication control to harden and no rate limit that helps.","confidence":"high","source":"Mandiant MNDT-2026-0048 via multiple secondary reports"},{"type":"behaviour","value":"Anomalous POST requests to .aspx endpoints returning HTTP 302 or 500 with unusually large cs-bytes","context":"The only hunting guidance Mandiant published. Tune the size threshold to your own baseline, because a serialized gadget payload is much larger than a normal form post.","confidence":"medium","source":"Mandiant MNDT-2026-0048 via secondary reporting"},{"type":"behaviour","value":"Process creation where the parent is w3wp.exe","context":"Highest-confidence available evidence of compromise. Code execution lands in the IIS worker process, so any shell, interpreter or encoded command it spawns needs an explanation.","confidence":"high","source":"Analyst assessment"},{"type":"behaviour","value":"Outbound internet connections initiated by w3wp.exe","context":"Abnormal in most estates and the natural second stage after deserialization code execution.","confidence":"medium","source":"Analyst assessment"},{"type":"filepath","value":"Web.config containing the AntiCsrf module registration","context":"Part of the inventory search and part of the remediation - the module registration must be removed alongside the DLL, or the application will fail rather than be fixed.","confidence":"high","source":"Mandiant MNDT-2026-0048 via secondary reporting"},{"type":"note","value":"CHANGE SINCE YESTERDAY: CVE-2026-131914 was added to CISA KEV on 2026-11-24 with remediation due 2026-11-27. This feed previously recorded kev_listed as false.","context":"The correction this entry exists to carry. If the absence of a KEV listing informed a decision to schedule rather than act, that decision needs revisiting.","confidence":"high","source":"CISA alert of 2026-11-24 via secondary reporting"},{"type":"note","value":"Affected versions: Idunno.AntiCsrf 0.9.1.0 and 0.9.1 Beta. No fixed version exists and none will be released - the project is abandoned.","context":"The defining fact. CISA has set a dated remediation deadline for a vulnerability with no patch, which means the only compliant remediation is removal of the component.","confidence":"high","source":"Mandiant MNDT-2026-0048 via secondary reporting"},{"type":"note","value":"Rotating ASP.NET machine keys does NOT address this vulnerability","context":"Explicit in the reporting. The deserialization occurs with no integrity check, so there is no key involved. Reopen any incident record closed on this basis.","confidence":"high","source":"Multiple secondary reports"},{"type":"note","value":"Mandiant has published NO indicators for this vulnerability - no hashes, IP addresses, domains or YARA rules","context":"Hunting is necessarily structural. A clean indicator search proves nothing here.","confidence":"high","source":"Analyst assessment across reviewed sources"},{"type":"note","value":"A reported NVD SSVC exploitation rating of 'none' contradicts both Mandiant's active-exploitation finding and the CISA KEV listing","context":"If your pipeline ingests the SSVC exploitation field it is scoring an exploited, unpatchable, critical RCE as unexploited. Override manually and audit what else that logic suppresses.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"The applications most likely to carry this library are the ones that were security reviewed, because a reviewer recommended adding CSRF protection","context":"The governance inversion in this entry, and the reason the search has to cover applications you consider well-managed rather than only neglected ones.","confidence":"high","source":"Analyst assessment"},{"type":"note","value":"Mandiant advisory MNDT-2026-0048, dated 2026-11-18, is the origin of the exploitation finding; the CISA KEV listing of 2026-11-24 is now an independent second authority","context":"Evidence quality has improved since yesterday. Two independent authorities now assert exploitation, which removes the single-source caveat this entry previously carried.","confidence":"high","source":"Analyst assessment"}]},{"rank":5,"id":"TI-2026-11-25-005","title":"THE UK GOVERNMENT PUBLICATION OF THIS WINDOW: The NCSC Published 'Familiar Weaknesses, Exploited Faster' on 24 November, Confirming a Marked Rise in AI-Assisted Attacks Since September and NAMING SIX AGENTIC OFFENSIVE FRAMEWORKS - ARTEX, Cairn, PentAGI, RedAmon, Xalgorix and Darkmoon - and Its Central Finding Is That Nothing New Is Being Exploited, Only Faster","cve_ids":[],"vendor":"UK National Cyber Security Centre","affected_products":["All internet-facing systems - the NCSC's finding is about attack tempo, not a specific product","Unauthenticated signup, registration and account creation flows","Public API endpoints without per-account or per-token rate limiting","Source code repositories containing committed secrets"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-24","last_updated":"2026-11-25","confidence":"high","summary":"On 24 November 2026 the NCSC published a blog titled 'Familiar weaknesses, exploited faster: defending against agentic cyber attacks'. For a UK government reader this is the most important item in this report after the two KEV entries, because it is the UK's own national technical authority stating its assessment on the record, and because it names tooling.\n\nWHAT THE NCSC SAID. The NCSC assesses that it has seen a marked rise in AI-assisted cyber attacks since September 2026. The driver is what it calls agentic offensive frameworks: red-teaming software, originally built for authorised testing, which lets an AI model plan and execute an attack using common security tools. The NCSC named ARTEX, and reporting of the publication also lists Cairn, PentAGI, RedAmon, Xalgorix and Darkmoon. Cairn is the framework Amazon Threat Intelligence attributed the eleven-minute MONAI Label compromise to, at rank 3 of this report - so one of the named frameworks already has a documented UK-relevant victim profile attached to it.\n\nTHE CENTRAL FINDING, WHICH IS REASSURING AND UNCOMFORTABLE AT THE SAME TIME. The NCSC's assessment is that these frameworks accelerate exploitation of longstanding weaknesses rather than introduce novel capabilities. Nothing new is being exploited. What has changed is the rate. That is reassuring because it means the control set you already know is the correct control set - there is no new category of defence to procure. It is uncomfortable because it removes the excuse: every weakness being exploited faster is a weakness someone already knew about and had not closed. The NCSC's own Annual Review 2026, published on 3 November and covering 1 September 2025 to 31 August 2026, makes the same point from the other direction - 1,831 reports received, 337 incidents requiring Incident Management Team support, 80 assessed as nationally significant, and an explicit statement that many successful attacks still exploit established weaknesses.\n\nTHE ECONOMICS, WHICH IS THE PART MOST DEFENDERS HAVE NOT PRICED IN. The NCSC notes these campaigns frequently run on cheap open models or on illegal API resellers. The consequence is that the cost of an attacker enumerating your endpoints, testing your parameters and probing your input validation has collapsed. Controls that worked because attacker attention was expensive - obscurity, unusual parameter names, multi-step flows that were tedious to reverse-engineer - no longer work. This is the single most actionable idea in the publication.\n\nTHE DEFENSIVE ADVICE, AND WHY IT IS SPECIFIC RATHER THAN GENERIC. The recommendations reported are: rate limits bound to accounts and tokens rather than to source addresses; behavioural checks; throttled sign-ups; secrets scanning; and deception techniques such as honeytokens and tarpits. Alongside that, keep an accurate inventory of public-facing systems and patch known weaknesses promptly. Two of those map directly onto other entries in today's report, and that is not coincidence. 'Throttled sign-ups' is precisely the control whose absence let the Optimizely attacker at rank 2 abuse an account signup flow to reach other tenants' JavaScript. 'An accurate inventory of public-facing systems' is precisely the control whose absence meant nobody knew the MONAI Label server at rank 3 existed. The NCSC is describing, in general terms, two specific incidents in this report.\n\nAND THE INVERSION AT RANK 1. Drupal core CVE-2026-132165 - unauthenticated remote code execution in the installer of the most widely deployed CMS in the world - was found by Anthropic's OSS Scanner, an AI-based tool, and was exploited on live sites about twenty-four hours after the fix shipped. The acceleration the NCSC describes operates on both sides. Defenders get earlier discovery; attackers get a shorter window between a published fix and a working attack. The net effect is that the patch window has moved from weeks to roughly one day for internet-facing software, and no UK public sector change process this feed is aware of is built for that.\n\nWIDER CONTEXT IN THE SAME WEEK. The Annual Review 2026 assesses it as almost certain that AI will act as a force multiplier for capable attackers, expects nation states including China and Russia to use AI cyber capability routinely for geopolitical ends by 2028, and judges it highly likely that AI-powered malware will feature in a ransomware attack against UK critical national infrastructure between now and 2028 - a forecast, not a report of something that has happened. The NCSC also still assesses AI as a net positive for cyber security overall. Separately, on 23 November the UK publicly confirmed offensive cyber operations against Russia, China, Iran and North Korea, in comments from the commander of the Cyber and Specialist Operations Command reported via Sky News. That is a single-source attribution chain and is recorded here as context, not as a technical finding.\n\nEVIDENCE QUALITY. The NCSC blog could not be read directly in this run - ncsc.gov.uk did not resolve, as in previous runs - so the title, date and content are cited from search-surfaced summaries and press coverage. The framework names beyond ARTEX come from secondary reporting of the publication rather than confirmed quotation of it, and two of the sources carrying the full list are low-quality aggregator pages. Verify the framework list against the NCSC page before using it in a briefing. The Annual Review figures are better evidenced and consistent across sources, with one exception: the reported 61 percent fall from 204 nationally significant incidents the previous year is an external analyst calculation, not an NCSC statement, and the NCSC does not explain the change.","recommended_actions":["Read the NCSC blog directly at ncsc.gov.uk and verify the framework list before quoting it. This report could not fetch the page, and the names beyond ARTEX come from secondary coverage. If you brief a board on six named frameworks, confirm the names at source first.","Rebase your patch window assumption on one day, not one week, for internet-facing software. Rank 1 of this report is a pre-authentication RCE exploited on live sites about twenty-four hours after the fix shipped. Identify which of your change processes cannot deliver an emergency internet-facing patch inside twenty-four hours and treat that as the finding.","Move rate limiting from source-address-based to account-based and token-based. This is the NCSC's first recommendation and it is the one most organisations have implemented in the wrong dimension - agentic tooling running through residential proxies or cheap API resellers defeats IP-based limits entirely.","Throttle and monitor unauthenticated signup and registration flows, and specifically review what a newly created account can reach before any verification step. This is not a theoretical control: it is the exact gap that produced rank 2 of this report, where abuse of a product signup flow gave an attacker write access to other tenants' JavaScript served to 178 organisations.","Build or refresh an accurate inventory of public-facing systems, and treat the gaps as the priority rather than the inventory as the deliverable. Rank 3 of this report is a server nobody knew existed, compromised to root in about eleven minutes. Asset discovery, not patch velocity, is the control that would have prevented it.","Deploy secrets scanning across source repositories and CI pipelines. The NCSC lists it explicitly, and rank 8 of this report shows why: post-intrusion tooling in the Cisco Expressway case searched internal GitLab repositories for credentials, which is exactly the task an agent does well and cheaply.","Deploy deception - honeytokens and tarpits. This is the most under-used recommendation in the list and the best suited to the threat: automated enumeration does not distinguish a real credential from a planted one, and a tarpit imposes cost on an attacker whose entire advantage is cheap iteration. A honeytoken in a repository or a fake administrative endpoint is a day of work and a high-fidelity alert.","Stop relying on obscurity as a control. The NCSC's point about cheap models and illegal API resellers means the cost of enumerating your endpoints and testing your parameters has collapsed. Any control that works because an attacker would not bother should be reclassified as no control.","Add behavioural detection on the tempo of interaction, not only the content. The distinguishing characteristic of agent-driven activity in the reported cases is speed and systematic coverage - full API enumeration followed immediately by targeted exploitation. That shape is detectable in application logs even when each individual request looks legitimate.","Use the Annual Review 2026 figures when making the resourcing case rather than this blog: 1,831 reports, 337 incidents requiring Incident Management Team support and 80 nationally significant incidents in the year to 31 August 2026 are the NCSC's own published numbers and are better evidenced than any framework name."],"references":["https://www.ncsc.gov.uk/blogs/familiar-weaknesses-exploited-faster-defending-against-agentic-cyber-attacks","https://techcrunch.com/2026/11/24/uk-warns-ai-driven-cyberattacks-are-exposing-years-of-weak-security","https://www.mobileworldlive.com/ai-cloud/uk-cybersecurity-body-flags-increase-in-ai-aided-attacks/","https://theintelligent.co.uk/technology/2026/ncsc-records-marked-rise-ai-assisted-cyberattacks-september","https://www.techbooky.com/uk-cyber-agency-warns-ai-agents-are-speeding-up-attacks-on-familiar-flaws/","https://www.ncsc.gov.uk/section/keep-up-to-date","https://www.intelligentciso.com/2026/11/03/ncsc-warns-uk-cyber-resilience-is-falling-behind-as-80-nationally-significant-incidents-recorded/","https://industrialcyber.co/critical-infrastructure/ncsc-annual-review-2026-warns-ai-powered-malware-could-target-uk-critical-infrastructure-by-2028/","https://thenextweb.com/news/ncsc-annual-review-2026-ai-malware-critical-infrastructure","https://www.byteseu.com/2541309/"],"kql":[{"platform":"sentinel","table":"SigninLogs","name":"High-tempo authentication activity across many accounts from few sources","description":"Detects the shape rather than the content. Agent-driven credential work is distinguished by rate and systematic coverage, and this query surfaces it even when each individual attempt looks ordinary.","query":"SigninLogs\n| where TimeGenerated > ago(30d)\n| summarize Attempts = count(), DistinctUsers = dcount(UserPrincipalName), Failures = countif(ResultType != 0), Successes = countif(ResultType == 0), Apps = make_set(AppDisplayName, 10) by IPAddress, bin(TimeGenerated, 10m)\n| where DistinctUsers >= 15 and Attempts >= 40\n| extend SuccessRate = round(todouble(Successes) / Attempts, 3)\n| order by DistinctUsers desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Systematic API enumeration followed by focused exploitation attempts","description":"The documented agent behaviour pattern: map the whole API surface, then attack one endpoint. Broad coverage of distinct paths in a short window from one source is the signal, and it is the tempo-based detection the NCSC's findings imply.","query":"W3CIISLog\n| where TimeGenerated > ago(14d)\n| summarize DistinctPaths = dcount(csUriStem), Requests = count(), Paths = make_set(csUriStem, 40), Statuses = make_set(scStatus, 10), Methods = make_set(csMethod, 6) by cIP, cUserAgent, bin(TimeGenerated, 5m)\n| where DistinctPaths >= 25 and Requests >= 60\n| order by DistinctPaths desc"},{"platform":"sentinel","table":"AuditLogs","name":"Unauthenticated or unverified account creation at abnormal rate","description":"Directly implements the NCSC's 'throttled sign-ups' recommendation as a detection. This is the control gap that produced rank 2 of this report, where abuse of a product signup flow reached other tenants' served JavaScript.","query":"AuditLogs\n| where TimeGenerated > ago(30d)\n| where OperationName has_any (\"Add user\", \"Create user\", \"Invite external user\", \"Add member to group\", \"Consent to application\")\n| extend Initiator = tostring(InitiatedBy.user.userPrincipalName), InitiatorIP = tostring(InitiatedBy.user.ipAddress)\n| summarize Operations = count(), Ops = make_set(OperationName, 10), Targets = dcount(tostring(TargetResources[0].displayName)) by Initiator, InitiatorIP, bin(TimeGenerated, 1h)\n| where Operations >= 5\n| order by Operations desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Honeytoken and deception artefact access","description":"The detection half of the NCSC's deception recommendation. Once you have planted honeytokens in repositories, configuration files and fake administrative endpoints, this is where the alert comes from - and it is high-fidelity by construction, since no legitimate process has a reason to touch them.","query":"let Honeytokens = dynamic([\"svc-legacy-backup\", \"api-deploy-token\", \"admin-recovery\", \"canary-sa\", \"decoy-readonly\"]);\nCloudAppEvents\n| where Timestamp > ago(90d)\n| where AccountDisplayName has_any (Honeytokens) or RawEventData has_any (Honeytokens)\n| project Timestamp, Application, ActionType, AccountDisplayName, AccountObjectId, IPAddress, CountryCode, ISP, ObjectName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound traffic to AI model API endpoints and low-cost resellers from server infrastructure","description":"Not a detection of attack, but of agentic tooling running inside your estate - whether that is an attacker's framework operating from a foothold, or shadow AI usage. The NCSC notes these campaigns often run through illegal API resellers, so unexpected destinations matter as much as known ones.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemoteUrl has_any (\"api.openai.com\", \"api.anthropic.com\", \"generativelanguage.googleapis.com\", \"api.together.xyz\", \"openrouter.ai\", \"api.deepseek.com\", \"api.groq.com\", \"huggingface.co\", \"ollama\")\n| summarize Connections = count(), Urls = make_set(RemoteUrl, 20), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName\n| order by Connections desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Named agentic offensive framework artefacts on endpoints and servers","description":"Low expected yield but very high value if it hits. Searches process command lines for the frameworks named in the NCSC publication. Verify the name list against the NCSC page before relying on it - the list beyond ARTEX comes from secondary reporting.","query":"let Frameworks = dynamic([\"artex\", \"cairn\", \"pentagi\", \"redamon\", \"xalgorix\", \"darkmoon\"]);\nDeviceProcessEvents\n| where Timestamp > ago(120d)\n| where ProcessCommandLine has_any (Frameworks) or InitiatingProcessCommandLine has_any (Frameworks) or FolderPath has_any (Frameworks)\n| project Timestamp, DeviceName, FileName, FolderPath, ProcessCommandLine, InitiatingProcessFileName, AccountName\n| order by Timestamp desc"}],"iocs":[{"type":"malware","value":"ARTEX","context":"The agentic offensive framework explicitly named by the NCSC in its 24 November 2026 publication. A red-teaming tool repurposed for unauthorised use, in which an AI model plans and executes an attack using common security tooling.","confidence":"high","source":"NCSC blog of 2026-11-24 via secondary reporting"},{"type":"malware","value":"Cairn","context":"Named alongside ARTEX. This is the framework Amazon Threat Intelligence attributed the eleven-minute MONAI Label compromise to at rank 3, so it is the one named framework with a documented, UK-relevant victim profile.","confidence":"high","source":"NCSC blog via secondary reporting; Amazon Threat Intelligence"},{"type":"malware","value":"PentAGI","context":"Agentic offensive framework named in coverage of the NCSC publication. Name is from secondary reporting rather than confirmed quotation - verify at source.","confidence":"medium","source":"Secondary reporting of NCSC blog"},{"type":"malware","value":"RedAmon","context":"Agentic offensive framework named in coverage of the NCSC publication. Name is from secondary reporting - verify at source before use in a briefing.","confidence":"medium","source":"Secondary reporting of NCSC blog"},{"type":"malware","value":"Xalgorix","context":"Agentic offensive framework named in coverage of the NCSC publication. Name is from secondary reporting - verify at source.","confidence":"medium","source":"Secondary reporting of NCSC blog"},{"type":"malware","value":"Darkmoon","context":"Agentic offensive framework named in coverage of the NCSC publication. Name is from secondary reporting - verify at source.","confidence":"medium","source":"Secondary reporting of NCSC blog"},{"type":"ttp","value":"Agentic offensive framework in which an AI model plans and executes an intrusion using commodity security tooling, accelerating exploitation of long-known weaknesses rather than introducing novel techniques","context":"The NCSC's central assessment. It means the correct control set is the one you already know, and that every weakness being exploited faster is one somebody had already identified and not closed.","confidence":"high","source":"NCSC blog of 2026-11-24 via secondary reporting"},{"type":"ttp","value":"Campaigns operated on cheap open-weight models or via illegal API resellers, collapsing the cost of endpoint and parameter enumeration","context":"The economic finding, and the most actionable idea in the publication: any control that worked because attacker attention was expensive should be reclassified as no control.","confidence":"high","source":"NCSC blog via secondary reporting"},{"type":"behaviour","value":"Full API surface enumeration immediately followed by targeted exploitation of a single endpoint, within minutes","context":"The tempo signature of agent-driven activity, detectable in application logs even when each individual request appears legitimate. See the MONAI Label timeline at rank 3 for the documented instance.","confidence":"medium","source":"Analyst assessment based on Amazon Threat Intelligence and NCSC reporting"},{"type":"behaviour","value":"Authentication and signup attempts at high rate across many accounts from few sources, or distributed across residential proxies to defeat address-based limits","context":"Why the NCSC recommends rate limits bound to accounts and tokens rather than to source addresses. Most organisations have implemented the control in the wrong dimension.","confidence":"medium","source":"Analyst assessment based on NCSC recommendations"},{"type":"note","value":"NCSC publication: 'Familiar weaknesses, exploited faster: defending against agentic cyber attacks', 24 November 2026","context":"The source document for this entry. It could not be fetched in this run - ncsc.gov.uk did not resolve - so all content here is cited from search-surfaced summaries and press coverage.","confidence":"high","source":"Multiple secondary reports"},{"type":"note","value":"NCSC assessment: a marked rise in AI-assisted cyber attacks since September 2026","context":"The headline finding, and a statement by the UK's national technical authority rather than a vendor. The NCSC has not published incident counts for the period.","confidence":"high","source":"NCSC blog via multiple secondary reports"},{"type":"note","value":"NCSC defensive recommendations: rate limits bound to accounts and tokens, behavioural checks, throttled sign-ups, secrets scanning, and deception such as honeytokens and tarpits","context":"The actionable list. Two of these map directly onto ranks 2 and 3 of this report, which is the clearest demonstration available that the advice is not generic.","confidence":"medium","source":"Secondary reporting of NCSC blog"},{"type":"note","value":"NCSC Annual Review 2026 (published 3 November 2026, covering 1 September 2025 to 31 August 2026): 1,831 reports received, 337 incidents requiring Incident Management Team support, 80 assessed as nationally significant","context":"The best-evidenced figures in this entry and the right numbers to use when making a resourcing case. Consistent across sources.","confidence":"high","source":"NCSC Annual Review 2026 via multiple secondary reports"},{"type":"note","value":"NCSC Annual Review 2026 forecasts: almost certain that AI will act as a force multiplier for capable attackers; nation states expected to use AI cyber capability routinely for geopolitical ends by 2028; highly likely that AI-powered malware features in a ransomware attack on UK critical national infrastructure between now and 2028","context":"These are forecasts, not reports of events. Quote them as such. The NCSC also still assesses AI as a net positive for cyber security overall.","confidence":"high","source":"NCSC Annual Review 2026 via multiple secondary reports"},{"type":"note","value":"The reported 61 per cent fall from 204 nationally significant incidents in the previous year is an external analyst calculation, not an NCSC statement, and the NCSC does not explain the change","context":"Do not present the decline as an NCSC finding. It may reflect classification changes rather than a reduction in activity.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"Drupal CVE-2026-132165 at rank 1 was discovered by Anthropic's OSS Scanner, an AI-based tool, and exploited on live sites about 24 hours after the fix shipped","context":"The inversion that completes this entry: the same acceleration gives defenders earlier discovery and attackers a shorter window after a published fix. The net effect is a one-day patch window for internet-facing software.","confidence":"high","source":"Drupal advisory credit and Drupal security team reporting"},{"type":"note","value":"Separately, on 23 November 2026 the UK publicly confirmed offensive cyber operations against Russia, China, Iran and North Korea, in comments from the commander of Cyber and Specialist Operations Command reported via Sky News","context":"Recorded as context, not as a technical finding. Single-source attribution chain and no operational detail. Relevant to threat-model discussions about retaliation risk for UK organisations.","confidence":"low","source":"Sky News via secondary reporting"}]},{"rank":6,"id":"TI-2026-11-25-006","title":"NEW YESTERDAY AND YOU HAVE TO PATCH vCENTER AGAIN: Broadcom's VMSA-2026-0011 Fixes 23 VMware Flaws Led by CVE-2026-123903, a CVSS 9.8 Authentication Bypass in the SAME Directory Service Component That the Armory Castle Zero-Day Chain Abused - and Anyone Who Patched for VMSA-2026-0009 Last Week Is Not Covered","cve_ids":["CVE-2026-123903","CVE-2026-123905","CVE-2026-123906","CVE-2026-123907","CVE-2026-123910","CVE-2026-123911","CVE-2026-123890"],"vendor":"Broadcom / VMware","affected_products":["VMware vCenter Server - fixed in 9.1.2, 9.0.2.0300 and 8.0 U3m","VMware Cloud Foundation 5.x - fixed in VCF 5.2.5","VMware ESX","VMware Workstation","VMware Fusion","VMware Tools","VMware Avi Load Balancer"],"category":"vulnerability_bundle","cvss_v3":9.8,"severity":"critical","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-24","last_updated":"2026-11-25","confidence":"medium","summary":"Broadcom published VMSA-2026-0011 on 24 November 2026, addressing 23 vulnerabilities across vCenter Server, ESX, Workstation, Fusion, VMware Tools and Avi Load Balancer. The headline is CVE-2026-123903: an authentication bypass in the VMware Directory Service, vmdir, rated CVSS 3.1 9.8, with a network attack vector, low complexity, no privileges required and no user interaction. That combination describes a flaw an unauthenticated attacker who can reach vCenter on the network can use directly.\n\nTHE OPERATIONALLY IMPORTANT POINT, AND IT IS NOT THE SCORE. This is a SECOND advisory. Many UK organisations patched vCenter within the last ten days in response to VMSA-2026-0009 and its revision, which covered CVE-2026-123890 - the authentication bypass exploited as a zero-day by the suspected China-nexus espionage group tracked as Armory Castle, whose KEV deadline was 23 November and has now passed. Patching for 0009 does not cover 0011. If your change record says 'vCenter patched, VMSA-2026-0009 remediated' and closes the item, you have an open CVSS 9.8 authentication bypass and a ticket that says you do not. Expect to meet resistance to a second emergency vCenter change in a fortnight; the argument that carries it is the component.\n\nTHE COMPONENT ARGUMENT. CVE-2026-123903 is in vmdir. So was the mechanism that made the Armory Castle intrusions so damaging: vmdir holds the vsphere.local single sign-on directory and the SAML signing material, which is why that campaign's remediation guidance centred on enumerating SSO administrators, checking access to the directory database at /storage/db/vmware-vmdir/data.mdb, and making a decision about rotating the SAML Security Token Service signing key - because an attacker who obtains that material can mint valid assertions indefinitely and no password reset revokes it. The same component is now the subject of a fresh unauthenticated authentication bypass. Whatever position you reached on SAML STS signing key rotation after the Armory Castle advisory, this is the week to close it, because a second independent authentication bypass in the directory service substantially weakens any argument that the first one definitely was not reached.\n\nTHE REST OF THE ADVISORY. CVE-2026-123910 and CVE-2026-123911 are reported as ESX code execution issues - a flaw that lets code run on the hypervisor host crosses the tenancy boundary and is the most consequential class of VMware bug for any shared or multi-tenant estate, which includes most UK government hosting arrangements. CVE-2026-123905, CVE-2026-123906 and CVE-2026-123907 are network-triggered denial-of-service flaws in the directory service, rated 7.5. A DoS in vmdir is worse than a DoS usually is: it does not just affect a service, it can remove your ability to authenticate to the management plane during an incident.\n\nFIXED VERSIONS AND WORKAROUNDS. Fixed builds reported are vCenter 9.1.2, 9.0.2.0300 and 8.0 U3m, with VMware Cloud Foundation 5.2.5 for VCF 5.x. Sources CONFLICT on workarounds: one states Broadcom lists no workaround for CVE-2026-123903 or the other vCenter issues, another describes the advisory as shipping fixes with limited workarounds. Treat 'no workaround' as the planning assumption and verify against the Broadcom advisory, because if it is correct then network restriction of access to vCenter is the only available compensating control before the patch.\n\nEXPLOITATION STATUS, STATED CAREFULLY. This entry is recorded as no known exploitation, and that is deliberate. The majority of sources state there is no confirmed exploitation, and CVE-2026-123903 is not in the CISA KEV catalogue. One aggregator entry claims a proof of concept has been released for CVE-2026-123903, but it is a second-hand item sourced from social media that could not be corroborated against any primary source, so this report does not carry it as a public PoC. That distinction matters for prioritisation: this is a patch-urgently item on the strength of its score, its component and its reachability, not an incident-response item. If the PoC claim is confirmed, it becomes the latter, and given rank 1's twenty-four-hour fix-to-exploitation window the gap between those two states should be assumed to be short.\n\nCARRY-FORWARD ON THE EXPLOITED ONE. CVE-2026-123890's KEV deadline fell on 23 November and has passed. Armory Castle is reported to have held access from early September until the 19 November fix. The hunting actions from that entry remain open and are repeated below, because the deadline passing does not close them.","recommended_actions":["Check whether your vCenter change record from the last ten days referenced VMSA-2026-0009 or VMSA-2026-0011. If it says 0009, you are not covered for CVE-2026-123903 and the item needs reopening today. This is the single most likely way this entry is missed.","Patch vCenter to 9.1.2, 9.0.2.0300 or 8.0 U3m as applicable, and VMware Cloud Foundation 5.x to VCF 5.2.5. Verify the build numbers against Broadcom's VMSA-2026-0011 advisory directly - they are cited here from search-surfaced summaries and this report could not read the advisory.","Assume there is no workaround for CVE-2026-123903 and plan accordingly. Sources conflict on this point; if it is correct, restricting network access to the vCenter management interface to a defined administrative network is the only compensating control available before the patch, and it is worth doing regardless of this CVE.","Close out the SAML Security Token Service signing key rotation decision this week. A second independent authentication bypass in vmdir materially weakens any argument that the Armory Castle chain definitely did not reach the directory's signing material. An attacker holding it can mint valid assertions indefinitely and no password reset revokes that.","Enumerate vsphere.local single sign-on administrators against your change records and remove anything unaccounted for. This action carries over from CVE-2026-123890 and remains open now that its 23 November KEV deadline has passed.","Review access to the vmdir database at /storage/db/vmware-vmdir/data.mdb for the period from early September to 19 November 2026. That is the reported window of Armory Castle access, and it is the period in which directory material could have been copied.","Prioritise the ESX code execution flaws, CVE-2026-123910 and CVE-2026-123911, in any shared or multi-tenant hosting environment. Code execution on the hypervisor crosses the tenancy boundary, which makes it the most consequential class in this advisory for UK government hosting arrangements where multiple bodies share infrastructure.","Treat the vmdir denial-of-service flaws, CVE-2026-123905 through CVE-2026-123907, as availability risks to your incident response capability rather than as ordinary DoS. If the directory service is down you cannot authenticate to the management plane, which is exactly when you need to.","Resolve the vCenter 7.0 decision if it is still open. No public patch exists for that branch and none will. Record the accepted risk and the migration date, or remove the exposure.","Watch for confirmation of the unverified proof-of-concept claim for CVE-2026-123903 and have the escalation path ready. The claim is currently single-source and uncorroborated, so this is a patch-urgently item today rather than an incident item - but rank 1 of this report shows exploitation can follow a public fix by about a day."],"references":["https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md","https://thehackernews.com/2026/11/vmware-vcenter-hit-by-another-critical.html","https://thehackernews.com/2026/11/critical-vmware-vcenter-flaw-cvss-98.html","https://www.rescana.com/post/vmware-vcenter-cve-2026-123903-auth-bypass-and-esx-code-execution-patch-now","https://thecyberexpress.com/cve-2026-123903-esx-cve-2026-123910/","https://thelaymansecurity.com/vmsa-2026-0011-cve-2026-123903-vcenter-esx/","https://dev.to/anoymask/vmsa-2026-0011-23-vulnerabilities-include-vcenter-authentication-bypass-and-esx-host-code-execution-42ag","https://que.com/vmware-patches-another-9-8-vcenter-flaw-days-after-a-zero-day-and-the-rest-of-todays-malware-threats/","https://www.cisa.gov/known-exploited-vulnerabilities-catalog"],"kql":[{"platform":"sentinel","table":"Syslog","name":"vCenter and vmdir authentication anomalies","description":"vCenter forwards vpxd and vmdir events by syslog. Authentication bypass leaves anomalous success events without a preceding credential validation, so look at the sequence rather than at any single line.","query":"Syslog\n| where TimeGenerated > datetime(2026-09-01)\n| where ProcessName has_any (\"vpxd\", \"vmdird\", \"vmafdd\", \"sso\", \"vmware-stsd\")\n   or SyslogMessage has_any (\"vmdir\", \"vsphere.local\", \"SSO\", \"SAML\", \"authentication\")\n| where SyslogMessage has_any (\"success\", \"authenticated\", \"token issued\", \"login\")\n| summarize Events = count(), Samples = make_set(SyslogMessage, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Computer, ProcessName\n| order by Events desc"},{"platform":"sentinel","table":"Syslog","name":"Access to the vmdir directory database file","description":"The specific post-exploitation artefact from the Armory Castle campaign and the thing that determines whether SAML signing material could have been copied. Carries over from CVE-2026-123890 and remains open.","query":"Syslog\n| where TimeGenerated > datetime(2026-08-15)\n| where SyslogMessage has_any (\"vmware-vmdir\", \"data.mdb\", \"/storage/db/vmware-vmdir\")\n| project TimeGenerated, Computer, Facility, ProcessName, SeverityLevel, SyslogMessage\n| order by TimeGenerated asc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Sources reaching the vCenter management interface","description":"If there is no workaround for CVE-2026-123903, network restriction is the only available compensating control. This query produces the list of sources you would be restricting, and surfaces anything reaching vCenter from outside an administrative network.","query":"let VCenters = dynamic([]);  // populate with your vCenter IP addresses or FQDNs\nDeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemoteUrl has_any (\"vcenter\", \"vsphere\") or RemoteIP in (VCenters)\n| where RemotePort in (443, 902, 5480, 389, 636, 7444)\n| summarize Connections = count(), Ports = make_set(RemotePort, 10), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName, RemoteIP, RemoteUrl\n| order by Connections desc"},{"platform":"sentinel","table":"SigninLogs","name":"Federated sign-ins that could be backed by minted SAML assertions","description":"The reason the SAML STS signing key rotation decision matters. An attacker holding the signing material produces assertions that look valid, so look for sign-ins whose characteristics - unusual location, unusual client, absent MFA claim - do not match the user's pattern rather than for failures.","query":"SigninLogs\n| where TimeGenerated > datetime(2026-09-01)\n| where ResultType == 0\n| where AuthenticationRequirement == \"singleFactorAuthentication\" or isempty(tostring(MfaDetail))\n| extend Federated = tostring(parse_json(tostring(AuthenticationDetails))[0].authenticationMethod)\n| summarize Signins = count(), IPs = make_set(IPAddress, 20), Locations = make_set(Location, 10), Apps = make_set(AppDisplayName, 15), Methods = make_set(Federated, 10) by UserPrincipalName\n| where array_length(Locations) > 2\n| order by Signins desc"},{"platform":"sentinel","table":"Syslog","name":"ESX host inventory and build verification across the estate","description":"Produces the evidence that both VMSA-2026-0009 and VMSA-2026-0011 are remediated, which is the specific failure mode this entry warns about. Cross-check the output against the fixed build list rather than against your change tickets.","query":"Syslog\n| where TimeGenerated > ago(14d)\n| where SyslogMessage has_any (\"VMware ESXi\", \"ESX\", \"build-\", \"vCenter Server\")\n| extend Build = extract(@\"build-(\\d+)\", 1, SyslogMessage)\n| extend Version = extract(@\"(\\d+\\.\\d+\\.\\d+(\\.\\d+)?)\", 1, SyslogMessage)\n| where isnotempty(Build) or isnotempty(Version)\n| summarize LastSeen = max(TimeGenerated), Builds = make_set(Build, 5), Versions = make_set(Version, 5) by Computer\n| order by Computer asc"}],"iocs":[{"type":"note","value":"VMSA-2026-0011, published 2026-11-24, addresses 23 vulnerabilities across vCenter Server, ESX, Workstation, Fusion, VMware Tools and Avi Load Balancer","context":"The advisory identifier to quote in change records. It is a SECOND advisory - VMSA-2026-0009 and its revision do not cover these flaws.","confidence":"high","source":"Broadcom VMSA-2026-0011 via multiple secondary reports"},{"type":"note","value":"CVE-2026-123903: authentication bypass in VMware Directory Service (vmdir), CVSS 3.1 9.8, network vector, low complexity, no privileges required, no user interaction","context":"The headline flaw. The metric combination describes something an unauthenticated attacker with network reachability to vCenter can use directly.","confidence":"high","source":"Multiple secondary reports of VMSA-2026-0011"},{"type":"note","value":"Fixed builds: vCenter Server 9.1.2, 9.0.2.0300 and 8.0 U3m; VMware Cloud Foundation 5.2.5 for VCF 5.x","context":"The remediation targets. Verify against Broadcom's advisory before using for audit evidence - cited here from search-surfaced summaries only.","confidence":"medium","source":"Multiple secondary reports of VMSA-2026-0011"},{"type":"note","value":"CVE-2026-123910 and CVE-2026-123911: reported ESX code execution flaws","context":"Code execution on the hypervisor crosses the tenancy boundary, which makes these the most consequential flaws in the advisory for shared or multi-tenant UK government hosting.","confidence":"medium","source":"Secondary reporting of VMSA-2026-0011"},{"type":"note","value":"CVE-2026-123905, CVE-2026-123906, CVE-2026-123907: network-triggered denial-of-service flaws in the directory service, rated 7.5","context":"Worse than an ordinary DoS: if vmdir is down you cannot authenticate to the management plane, which is precisely when you need to during an incident.","confidence":"medium","source":"Secondary reporting of VMSA-2026-0011"},{"type":"note","value":"WORKAROUND STATUS CONFLICTS: one source states Broadcom lists no workaround for CVE-2026-123903 or the other vCenter issues; another describes the advisory as providing fixes with limited workarounds","context":"Plan on 'no workaround'. If that is correct, restricting network access to the vCenter management interface is the only compensating control available before the patch.","confidence":"low","source":"Conflicting secondary reports"},{"type":"note","value":"EXPLOITATION: most sources report no confirmed exploitation and CVE-2026-123903 is not in CISA KEV. One aggregator entry claims a proof of concept was released, sourced from social media and uncorroborated against any primary source.","context":"Why this entry is recorded as no known exploitation. It is a patch-urgently item today, not an incident item - but see rank 1 for how short the gap between those states can be.","confidence":"medium","source":"Conflicting secondary reports"},{"type":"note","value":"CVE-2026-123890 (VMSA-2026-0009): the authentication bypass exploited as a zero-day by Armory Castle. KEV deadline was 2026-11-23 and has PASSED. Reported access held from early September until the 19 November fix.","context":"The carry-forward. The deadline passing does not close the hunting actions, and the long access window is why directory material must be assumed reachable until checked.","confidence":"high","source":"Google/Mandiant via secondary reporting; CISA KEV catalogue"},{"type":"filepath","value":"/storage/db/vmware-vmdir/data.mdb","context":"The vmdir directory database. Holds the vsphere.local SSO directory and SAML signing material. Access to this file during the Armory Castle window is the determinant of whether assertions can be minted against you indefinitely.","confidence":"high","source":"Google/Mandiant remediation guidance via secondary reporting"},{"type":"account","value":"vsphere.local SSO administrators","context":"Enumerate against change records and remove anything unaccounted for. Carries over from CVE-2026-123890 and remains open after the 23 November deadline.","confidence":"high","source":"Google/Mandiant remediation guidance via secondary reporting"},{"type":"ttp","value":"Authentication bypass against the VMware Directory Service, yielding management-plane access without valid credentials","context":"The attack. Because it targets the directory rather than an application, it reaches the identity material that underpins everything else authenticating against vCenter.","confidence":"high","source":"Multiple secondary reports of VMSA-2026-0011"},{"type":"ttp","value":"Minting of valid SAML assertio
