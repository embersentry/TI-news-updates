<!doctype html>
<html lang="en" data-palette="#FF5A1F,#FF8C1A,#9A958C">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat Intelligence Brief</title>
<meta name="description" content="Daily threat intelligence brief: ranked vulnerabilities with analyst summaries, KQL hunting queries and IOCs.">
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --raised:#1C1C1A;
    --border:#2E2E2B;
    --border-strong:#403F3A;
    --ink:#F4F0E6;
    --ink-dim:#C9C4B8;
    --muted:#9A958C;
    --accent:#FF6A1A;
    --accent-hot:#FF5A1F;
    --accent-soft:rgba(255,106,26,.12);
    --accent-line:rgba(255,106,26,.32);
    --bar:rgba(255,106,26,.5);
    --radius:4px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- masthead ---------- */
  header.mast{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#121211 0%,var(--bg) 100%)}
  .mast-in{max-width:var(--maxw);margin:0 auto;padding:28px 16px 24px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{width:30px;height:30px;flex:none}
  .brand-txt h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .brand-txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .stamp{display:flex;flex-wrap:wrap;gap:22px}
  .stamp div{min-width:0}
  .stamp dt{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .stamp dd{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap}
  .stamp dd b{color:var(--accent);font-weight:600}

  /* ---------- priority banner ---------- */
  .alert{margin:22px 0 0;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-left:3px solid var(--accent-hot);border-radius:var(--radius);padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start}
  .alert svg{flex:none;margin-top:2px}
  .alert .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
    font-weight:650;margin:0 0 3px}
  .alert p{margin:0;font-size:14px;color:var(--ink)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:var(--radius);margin:22px 0 0;overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .tile{background:var(--surface);padding:14px 16px 13px}
  .tile .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;display:block}
  .tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
  .tile.hot .n{color:var(--accent-hot)}
  .tile.warn .n{color:var(--accent)}

  /* ---------- posture bar ---------- */
  .posture{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 14px}
  .posture h2{margin:0 0 11px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .pbar{display:flex;gap:2px;height:12px;border-radius:2px;overflow:hidden;background:var(--bg)}
  .pseg{min-width:3px}
  .pseg.s-exploited{background:var(--accent-hot)}
  .pseg.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .pseg.s-none{background:var(--muted)}
  .plegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px}
  .plegend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-dim)}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none}
  .swatch.s-exploited{background:var(--accent-hot)}
  .swatch.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .swatch.s-none{background:var(--muted)}
  .plegend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 0;
    padding-bottom:18px;border-bottom:1px solid var(--border)}
  .search{position:relative;flex:1 1 230px;min-width:0}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:var(--radius);padding:9px 11px 9px 34px;font-size:14px;font-family:var(--sans)}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);
    border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
    transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
  .chip:hover{border-color:var(--border-strong);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A;font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{background:transparent;border:1px solid var(--border);color:var(--ink-dim);border-radius:var(--radius);
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

  /* ---------- entry cards ---------- */
  .entries{margin:0;padding:0;list-style:none}
  .card{border-bottom:1px solid var(--border)}
  .card.is-open{background:var(--surface)}
  .chead{display:flex;gap:16px;padding:20px 4px;cursor:pointer;align-items:flex-start;
    width:100%;background:none;border:0;text-align:left;font-family:inherit;color:inherit}
  .chead:hover .ctitle{color:var(--accent)}
  .chead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{flex:none;width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;
    font-family:var(--mono);font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
    background:var(--raised);border:1px solid var(--border);color:var(--muted)}
  .card[data-status="exploited_in_the_wild"] .rank{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .cbody{flex:1;min-width:0}
  .ctitle{margin:0;font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;
    transition:color .12s}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
  .teaser{margin:10px 0 0;font-size:14px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.is-open .teaser{display:none}
  .caret{flex:none;color:var(--muted);transition:transform .15s;margin-top:7px}
  .card.is-open .caret{transform:rotate(90deg);color:var(--accent)}

  /* pills: status differentiated by WEIGHT + always a text label, never hue alone */
  .pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
    padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;
    align-items:center;gap:5px;line-height:1.5}
  .pill.st-exploited{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.st-attempts{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.st-none{background:transparent;border-color:var(--border-strong);color:var(--muted)}
  .pill.kev{background:transparent;border-color:var(--accent-line);color:var(--accent)}
  .pill.nopatch{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.partial{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.plain{background:transparent;border-color:var(--border);color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:500;
    white-space:normal;max-width:100%;overflow-wrap:anywhere}
  .cve{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);background:var(--raised);
    border:1px solid var(--border);border-radius:3px;padding:2px 7px;white-space:nowrap}
  .cve.more{color:var(--muted);background:transparent}

  /* ---------- detail ---------- */
  .detail{display:none;padding:0 4px 30px 54px}
  .card.is-open .detail{display:block}
  .sec{margin-top:26px}
  .sec:first-child{margin-top:6px}
  .sec > h3{margin:0 0 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:650;display:flex;align-items:center;gap:9px}
  .sec > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .prose{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.72;max-width:76ch}
  .facts{display:flex;flex-wrap:wrap;border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden}
  .facts div{flex:1 1 168px;background:var(--bg);padding:10px 13px;
    border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .card.is-open .facts div{background:var(--raised)}
  .facts dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .facts dd{margin:0;font-size:13px;font-family:var(--mono);color:var(--ink-dim)}
  ul.list{margin:0;padding-left:0;list-style:none}
  ul.list li{position:relative;padding-left:20px;margin-bottom:8px;font-size:14px;color:var(--ink-dim);max-width:78ch}
  ul.list li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;
    background:var(--accent);border-radius:1px}
  ul.list.num{counter-reset:a}
  ul.list.num li{counter-increment:a;padding-left:26px}
  ul.list.num li::before{content:counter(a);background:none;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);top:0;left:2px;width:auto;height:auto;font-weight:600}

  /* KQL */
  .kql{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;background:var(--bg);overflow:hidden}
  .kql-head{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
    border-bottom:1px solid var(--border);background:var(--raised);flex-wrap:wrap}
  .kql-head .kn{flex:1;min-width:140px}
  .kql-head h4{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .kql-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}
  .plat{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:3px;padding:2px 7px;
    white-space:nowrap;flex:none}
  .kql pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:var(--ink-dim);tab-size:2}
  .kql pre .k{color:var(--accent)}
  .kql pre .s{color:#C9C4B8}
  .kql pre .c{color:#6E6A63;font-style:italic}
  .copy{flex:none;background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:3px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.ok{border-color:var(--accent-hot);color:var(--accent-hot)}

  /* IOC table */
  .tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:9px 13px;background:var(--raised);color:var(--muted);
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-dim)}
  tbody tr:last-child td{border-bottom:0}
  td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere;min-width:120px}
  td.t{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
  td.ctx{min-width:220px;line-height:1.55}
  td.src{font-size:12px;color:var(--muted);min-width:130px}
  .cf{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;padding:2px 7px;
    border-radius:999px;border:1px solid;white-space:nowrap}
  .cf.high{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .cf.medium{background:transparent;border-color:var(--border-strong);color:var(--ink-dim)}
  .cf.low{background:transparent;border-color:var(--border);color:var(--muted)}
  tr.is-note td{background:rgba(255,106,26,.05)}
  .note-row{font-size:12.5px;color:var(--muted);font-style:italic}
  .refs{margin:0;padding:0;list-style:none}
  .refs li{margin-bottom:7px}
  .refs a{color:var(--accent);text-decoration:none;font-size:13px;font-family:var(--mono);
    overflow-wrap:anywhere;border-bottom:1px solid transparent}
  .refs a:hover{border-bottom-color:var(--accent)}

  /* ---------- provenance ---------- */
  .prov{margin:40px 0 0;border:1px solid var(--border);border-left:3px solid var(--border-strong);
    border-radius:var(--radius);background:var(--surface)}
  .prov > summary{cursor:pointer;padding:15px 18px;font-size:13px;font-weight:600;color:var(--ink);
    list-style:none;display:flex;align-items:center;gap:10px}
  .prov > summary::-webkit-details-marker{display:none}
  .prov > summary:hover{color:var(--accent)}
  .prov > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .prov[open] > summary{border-bottom:1px solid var(--border)}
  .prov-body{padding:18px}
  .prov-body h4{margin:20px 0 9px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .prov-body h4:first-child{margin-top:0}
  .prov-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}
  .prov-body dt{font-weight:650;color:var(--accent);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding-top:3px}
  .prov-body dd{margin:0;color:var(--ink-dim)}

  footer.foot{margin:44px 0 0;border-top:1px solid var(--border);padding:20px 0 50px;
    display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  footer.foot p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .drop-hint{font-size:12px;color:var(--muted)}

  .empty{padding:60px 4px;text-align:center;color:var(--muted);font-size:14px}
  body.dragging::after{content:"Drop a TI JSON file to load it";position:fixed;inset:14px;
    border:2px dashed var(--accent);border-radius:8px;background:rgba(10,10,10,.9);color:var(--accent);
    display:grid;place-items:center;font-size:17px;font-weight:600;z-index:99;pointer-events:none}

  @media (max-width:720px){
    .brand{align-items:flex-start}
    .detail{padding-left:4px}
    .stamp{gap:16px}
    .mast-in{padding-top:22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- report archive timeline ---------- */
  .timeline{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 16px}
  .tl-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;
    justify-content:space-between;margin-bottom:14px}
  .tl-head h2{margin:0;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .tl-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-meta b{color:var(--ink);font-weight:600}
  .tl-latest{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;
    border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .tl-latest:hover{background:var(--accent-soft)}
  .tl-chart{position:relative}
  .tl-bars{display:flex;align-items:flex-end;gap:3px;height:62px;overflow-x:auto;
    overflow-y:hidden;padding-bottom:1px}
  .tl-bar{flex:1 1 0;min-width:5px;height:100%;background:none;border:0;
    padding:0;cursor:pointer;display:flex;align-items:flex-end}
  .tl-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tl-fill{width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--bar);
    transition:background .12s}
  .tl-bar:hover .tl-fill,.tl-bar:focus-visible .tl-fill{background:var(--accent)}
  .tl-bar.is-current .tl-fill{background:var(--accent-hot)}
  .tl-axis{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tl-tip{position:absolute;top:calc(100% + 8px);z-index:5;pointer-events:none;
    background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:9px 11px;min-width:190px;max-width:330px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .tl-tip[hidden]{display:none}
  .tl-tip .t-d{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 5px}
  .tl-tip .t-h{margin:0 0 7px;font-size:12.5px;color:var(--ink);line-height:1.45}
  .tl-tip .t-c{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tl-list{list-style:none;margin:17px 0 0;padding:0;border-top:1px solid var(--border)}
  .tl-list li{margin:0}
  .tl-row{display:flex;gap:14px;align-items:baseline;padding:9px 4px;
    border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
  .tl-row:hover{background:var(--raised)}
  .tl-row:hover .tl-h{color:var(--accent)}
  .tl-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tl-d{flex:none;width:86px;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .tl-h{flex:1;min-width:0;font-size:13.5px;color:var(--ink-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tl-c{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .tl-now{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:1px 7px}
  .tl-more{margin-top:13px}
  @media (max-width:720px){
    .tl-c{display:none}
    .tl-d{width:72px}
    /* Keep the caption - it is what names the series - but give it its own
       line instead of letting it wrap between the two date labels. */
    .tl-axis{flex-wrap:wrap}
    .tl-axis span:nth-child(2){order:3;flex:1 0 100%;text-align:center;margin-top:4px}
  }

  /* ---------- print ---------- */
  @media print{
    :root{--bg:#fff;--surface:#fff;--raised:#f4f2ee;--border:#d5d2cb;--border-strong:#b5b1a8;
          --ink:#111;--ink-dim:#2a2a28;--muted:#5d5a54;--accent:#B83F00;--accent-hot:#B83F00;
          --accent-soft:#faeee6;--accent-line:#e0b79e}
    body{font-size:10.5pt}
    .controls,.caret,.copy,footer.foot,.drop-hint{display:none!important}
    .detail{display:block!important;padding-left:0;page-break-inside:avoid}
    .teaser{display:none!important}
    .card{page-break-inside:avoid;border-bottom:1px solid var(--border)}
    .chead{cursor:default;padding:14px 0}
    .card[data-status="exploited_in_the_wild"] .rank{background:#B83F00;color:#fff}
    .pill.st-exploited,.pill.nopatch{background:#B83F00;color:#fff}
    .kql pre{white-space:pre-wrap;word-break:break-word}
    .tl-row[hidden]{display:flex!important}
    .tl-more,.tl-tip{display:none!important}
    .tl-bars{overflow:visible}

sses, hashes, domains or payload names could be retrieved, so all detection content is constructed from the described mechanism rather than from a published indicator list; CVSS conflicts (CISA 9.8 against 9.3 on a PoC page); affected-version scope conflicts (one tracker lists Confluence 1.x-9.x against Rapid7's 9.2.28-or-current-10.x guidance); the N-central privilege escalation second stage still has no CVE; and KEV status is recorded as 'not listed' on the basis of absence, which is weak evidence given CISA has already assigned the CVSS. Rank 3 (UK government): neither the Lords report, nor Hansard, nor the Parliament bills page was read - all dates and quotations are relayed from press summaries and a third-party Bill tracker, secondary accounts of the Commons report stage conflict (passed without division against three amendments defeated on division), and it could not be established whether The Record's 'appears complacent' line refers to the same National Resilience Committee report or a separate committee. Rank 4: the claim that a firmware update had been available since August 2026 for the controllers the affected British suppliers were running is single-sourced and is the most consequential unverified fact in this run. Rank 5: every KEV date and due date is relayed; the Chrome CVE-2026-125350 KEV addition is in direct conflict between sources (SecurityWeek reporting no addition as of 10 November against other coverage giving a 24 November deadline) and this feed carries 24 November unconfirmed. Rank 10: ransomware.live, redpacketsecurity.com and breachsense.com were not fetchable, so all listings, file counts and byte counts are relayed from search summaries.","2026-11-17 run - corrections to earlier runs, carried in-entry. (1) The N-able N-central entry carried at rank 8 on 16 November is SUPERSEDED by rank 2 of this run and rotated out. The mechanism is now named as CVE-2026-90436 in a bundled end-of-life Apache Axis 1.x library rather than N-able's own code, exploitation is vendor-confirmed, the chain to root is named '4EverAble2Shell', and the oscillation this feed reported between N-able's 'no signs of compromise' position and statically-derived indicators is resolved. (2) SonicWall CVE-2026-19868 was added to CISA KEV on 6 November 2026, not 13 November - a CISA alert of that date records one addition and names this CVE - which resolves the stale-KEV-flag uncertainty this feed recorded on 16 November and confirms the 20 November due date. (3) The Cyber Security and Resilience Bill stage this feed recorded on 14 November as 'awaiting Commons consideration of Lords amendments with no date set' now has a date: 24 November 2026, with Lords third reading completed 2 November and carry-over extended on 4 November to 29 April 2027. (4) The ScreenConnect SCKit initial access attribution has firmed: Huntress now attributes entry to the RMM+ extension's blank shared access key in versions 1.0.31 and 1.0.32, and the earlier compromised-credentials hypothesis this feed carried was not confirmed by later analysis and should be dropped. (5) The Copeland XWEB EVO (TI-2026-11-16-002) and Danfoss AK-SM800A (TI-2026-11-16-003) entries are merged into TI-2026-11-17-004 at rank 8 with no technical content dropped.","2026-11-17 run - scope precision to preserve when re-using this data. OPTIMJACK: the approximately 7,040 US dollars in attacker wallets is not a measure of impact - card, cookie and session theft volumes are unknown and unquantified; blocking the attacker domain is only partial mitigation because one observed variant inlines the whole payload and runs it through eval precisely when the domain is unreachable; and the exposure window should be treated as beginning 04:21 UTC on 16 November until a vendor timeline supersedes it. CVE-2026-90436: Censys's approximately 1.2 million internet-exposed Confluence web properties is an exposure count and Censys says so explicitly - it must never be reported as 1.2 million vulnerable systems. Rank 3 is rated informational with no indicators and must not be escalated through an operational channel. ScreenConnect: the 688,000 guest 'run file' requests across 42 servers from 29 IP addresses and the 288 endpoints across 48 organisations are one vendor's telemetry and visibility, not global figures, and must not be added to ConnectWise's separately-reported approximately 400 partner environments, which is an exposure count; Huntress has observed no successful console takeover, so MSP consoles must not be described as taken over; and Huntress's file hashes vary by host, so hash blocking will under-detect. Rank 8: the six Danfoss AK-SM800A flaws have no known exploitation and must not be reported as actively exploited. Rank 10: 'CARRINGTON' is still not resolved to a named UK company and Vortex separately lists a US mortgage servicer of a similar name, so a country-tagging error is live; aggregator totals of 45 GB-tagged victims in 30 days and 1,202 cumulative are third-party leak-site post counts, not UK national statistics, and the movement from roughly 1,153-1,173 in the 15-16 November runs is partly tracker re-counting rather than real growth; and the Computacenter listing names North American subsidiaries with UK scope disputed.","2026-11-18 run: search-result summaries only. EVERY direct page fetch failed in this environment - cisa.gov, cvebrief.com, whatgotpwned.com, computing.co.uk, digital.nhs.uk and ransomware.live did not resolve - so no primary source was read, including the CISA Java4Shell alert, the CISA KEV catalogue, the HMRC press release, the CSA Singapore alert, UK Parliament's bills pages and the n0n leak-site listings. All dates, version numbers, CVSS scores and deadlines are relayed and must be verified before use as compliance evidence.","2026-11-18 run: rank 1 (Java4Shell CVE-2026-114938) is NOT confirmed exploited. It is ranked first on the basis of a CISA and Canadian Cyber Centre 'patch immediately' alert, a public proof of concept, and reported pre-auth reach in default Confluence, Jira, Jenkins and Keycloak configurations. The product-specific pre-auth claims come from the discovering researchers (Calif) and have not been independently reproduced in public; the CVE record was reported as still reserved on 18 November and the mapping to OpenJDK change JDK-8393212 is unconfirmed.","2026-11-18 run: rank 5 (Apache mod_http2 CVE-2026-119618) carries LOW confidence because the exploitation evidence conflicts - Singapore's CSA says 'reportedly' exploited on 17 November, while Wiz Research reported no known exploitation on 11 November and F5 Labs is reported to see no major activity. No victims, actors or indicators are published by anyone.","2026-11-18 run: rank 8's UK corporate incidents are unverified leak-site claims only. Neither Debenhams nor Bensons for Beds has been quoted confirming an incident, no ICO statement was found, and the record counts (15,708 email addresses, 8,530 password-recovery codes) are the 'n0n' group's own. Bitdefender's research into n0n's own file server indicated just over 20 real victims with probable duplicate and false listings, against tracker figures of 122 victims in 30 days - the group's victim accounting is unreliable in both directions.","2026-11-18 run: rank 9's exploitation statements are vendor advisory claims relayed second-hand and conflict. One outlet quotes Apache stating Roller CVE-2026-129448 is actively exploited while an aggregator records no evidence and notes absence from CISA KEV; Roller's fixed version is given as both 6.1.5 and 6.1.6. TYPO3 CVE-2026-119623 (reported CVSS 9.4, RCE) is poorly characterised in the sources reviewed.","2026-11-18 run: CORRECTION. The 17 November run stated that 24 November 2026 was confirmed on UK Parliament's own bills pages as the date for Commons consideration of Lords amendments to the Cyber Security and Resilience Bill. It is not. The date is traceable only to a commercial Bill-tracking site which labels it a position 'as at 13 November'. No official Parliament page confirming it was located. Rank 10's confidence is downgraded to low. This is the second correction this feed has made to its account of this Bill's progress.","2026-11-18 run: the Zyxel item inside rank 7 records that CISA's KEV entry for the GS1900 campaign names CVE-2026-7273, while Binarly's research shows the exploited flaw is CVE-2026-107441. The 996-device and 48-country figures and the 'Kapibala' attribution come from GreyNoise via trade press and were not read at source; the firmware release date differs between sources (22 or 23 October 2026).","2026-11-19 run: search-result summaries only - every direct page fetch was blocked in this environment, and cvebrief.com additionally failed DNS resolution, so every version number, deadline and figure below is relayed from search summaries and requires verification against the primary source. Specific unresolved items: the NHS England Java4Shell cyber alert of 18 November and its NCSOC 'exploitation likely' assessment are single-sourced and the NHS England page itself was not retrieved; the BOD 26-04 forensic-triage instruction for Apache Axis is single-sourced; GreyNoise's position on CVE-2026-114938 is internally inconsistent across sources (one reports classifications downgraded with no block candidates, while its live page reportedly still shows observed infrastructure); the NGINX Plus fixed build numbers and the claim that trains R34-R36 have no fix are secondary, and the identity and count of the other three 'NGINX2Root' flaws were not established; LiteLLM CVE-2026-40217 CVSS is reported variously as 8.8, 7.5 and 5.9; Wellington IT figures conflict between outlets (40 to 50 credit unions, 1.4 million vs 5 million malicious requests, and 1.8 million is an Irish Times estimate of potential reach rather than a confirmed count of affected individuals); the three UK retail entries on the n0n leak site are unnamed in all available sources and Bitdefender's assessment puts roughly two-thirds of that site's listings in doubt; no file hashes or exfiltration infrastructure were captured for the agent-framework compromise; and the composition of the 24 November KEV deadline group is carried forward from earlier runs in this feed and was not re-verified against CISA's catalogue.","2026-11-20 run: search-result summaries only - every direct page fetch failed with DNS resolution errors (secarma.com and www.cisa.gov both confirmed blocked), so no primary source was retrieved. Verify all details against primary sources before acting externally.","2026-11-20 run: the NHS England Digital cyber alert for the F5 NGINX vulnerabilities is evidenced only by its title and 19 November date appearing in the alerts listing surfaced via search; the alert text, severity rating and recommended actions were NOT retrieved.","2026-11-20 run: NO new CISA KEV additions were identified for 19 or 20 November 2026. Because cisa.gov could not be fetched, this negative finding may be an indexing artefact rather than a fact - verify against the catalogue.","2026-11-20 run: the RDM refrigeration controller flaw has no CVE identifier and no official NCSC statement was retrieved; the weak-password characterisation is Pen Test Partners' description, and RDM disputes the severity. Device counts vary between 'thousands of controllers' and 'tens of thousands of fridges', which are different measures.","2026-11-20 run: the extent of BitLocker impact from the FastUnlock Windows 11 zero-day is genuinely disputed between outlets and is recorded as disputed; the USB-stick execution stage is unconfirmed and the researcher's identification rests on their own claim.","2026-11-20 run: the named-senior-manager expectation in PRA CP17/26 / FCA GC26/9 is reported by a single commentator summarising the draft and should be confirmed against Annex 1 before any firm acts on it.","2026-11-20 run: the Sky News interview with the commander of the UK's military cyber force was not retrieved; all detail comes from syndicated republication and outlets differ on whether the UK 'is conducting' operations or is 'actively targeting threats'. No operational specifics were given.","2026-11-20 run: Optimizely's account-signup-flow entry point is a single-source unverified claim; the Gleneagles (Scotland) incident rests on one Scottish outlet with no hotel statement; Wellington IT figures are carried from earlier runs and remain secondary-source; all UK retail extortion claims are explicitly low confidence.","2026-11-20 run: PHP source conflict recorded - one outlet reports eight fixed vulnerabilities against 18 from the majority of sources, and sources differ on fixed-in versions for individual CVEs. Check the official PHP advisories before mapping a CVE to a release.","2026-11-21 run: search-result summaries only - every direct page fetch failed with DNS resolution errors (www.cisa.gov and www.helpnetsecurity.com both confirmed blocked), with the single exception of github.com, which resolved and was used to retrieve an aggregated KEV/threat-intel feed mirror. No vendor, government or regulator primary page was retrieved. Verify all details against primary sources before acting externally.","2026-11-21 run: the Google Threat Intelligence / Mandiant ARMORY CASTLE publication was NOT retrieved. File hashes and YARA rule contents for BONESAW, SAWSNAKE, BEARBONES, LAZYBONES, SLIMSAVAGE and CAGEMATCH are therefore absent from this report; only behavioural indicators and family names are recorded. Pull the full indicator set from the Mandiant blog before relying on rank 1 for hunting.","2026-11-21 run: the claim that VMware vCenter 7.0 has no public patch for CVE-2026-123890 is single-source and must be checked against Broadcom's VMSA-2026-0009 version matrix before any isolation or migration decision is taken on it.","2026-11-21 run: the NHS England Digital alert CC-4899 (VMware vCenter) is evidenced by its title, 19 November 16:29 publication timestamp and High severity rating as surfaced via search; the alert body and recommended actions were NOT retrieved. A GitHub mirror of the alert labels it 'Critical' while the NHS page states 'High'.","2026-11-21 run: CISA KEV content was taken from an aggregated feed mirror on github.com rather than from cisa.gov. Secondary sources disagree on both dateAdded and due dates for the 18 and 20 November additions - SC World dates the Axis/REDCap/LiteLLM/Synology group to 20 November while the catalogue mirror dates it 18 November. Verify deadline dates against the catalogue before using them in any compliance record.","2026-11-21 run: Apache Roller fixed-version reporting conflicts (6.1.5 vs 6.1.6 vs 6.1.7) and at least one source states CVE-2026-129448 is not in CISA KEV, contradicted by the 20 November listing. Confirm the fixed version against the Apache advisory.","2026-11-21 run: Cisco Expressway details are secondary-source. The 'wombat@' hard-coded node identity, the TCP 4372 cluster port, the X15.5.3-and-earlier affected range and the claim that X15.5.20 does not close PHP2Shell all come from third-party analyses rather than from cisco-sa-vcs-static-cred-hr7EWZ8t itself. The report of root access obtained on four clustered gateways at a Russian organisation is single-source and unverified.","2026-11-21 run: SAP NetWeaver CVE-2025-42884 has the thinnest open reporting of the KEV batch - affected version 7.50 and SAP Note 3660969 are secondary-source only and were not confirmed against SAP Security Patch Day notes.","2026-11-21 run: TfL field-list reporting remains inconsistent between outlets (narrow version: names, phone numbers, email addresses; broad version adds home addresses, dates of birth and security questions with answers). Both are recorded. The revised figure of approximately 265,000 and TfL's statement that it may rise are consistent across outlets. No TfL or ICO primary page was retrieved.","2026-11-21 run: the RDM refrigeration flaw still has no CVE identifier, so no CVE-keyed scanner or remediation record can evidence it. No NCSC, Defra, FSA or RDM primary statement was retrieved; the discovering consultancy appears as both 'Omega Solutions' and 'Omega Systems'; RDM continues to dispute the severity; and device counts ('thousands of controllers' vs 'tens of thousands of units') are different measures of the same estate and must not be combined.","2026-11-21 run: N-able restoration state is genuinely unresolved and conflicts with this feed's own 20 November entry, which recorded HF3 shipping while sources in this window describe hosted N-central still offline with MSPs awaiting a hotfix. The N-central CVE identifier CVE-2026-125883 cited by some vendor blogs is contradicted by Huntress-sourced material stating no CVEs have been assigned - treat it as unverified. The Mail Assure credential-theft claim is single-source.","2026-11-21 run: the identifier CVE-2026-129182, carried in this feed for the NGINX2Root issue, could not be confirmed against ANY source in this run and appears in none of the retrieved material. It is recorded as unverified and F5 advisories K000163925-K000163931 plus K000164058 are given as the authoritative mapping instead. This is a correction to earlier runs in this feed.","2026-11-21 run: NGINX2Root public-exploit availability is reported inconsistently (some sources state public exploit code exists, others state none has been released); the conflict is most plausibly explained by publication timing relative to the Rapid7 and Censys PoC releases, but it is not resolved. The Censys figure of approximately 9 million exposed services was not retrieved from Censys directly.","2026-11-21 run: the European Commission entry is included for UK relevance, not UK jurisdiction. The ARTEX tool identification is Politico's reporting of a CERT-EU detection and was explicitly not named by the Commission's spokesperson - recorded as low confidence. Data impact is disputed between SecurityWeek (no evidence of a breach) and Infosecurity/Politico (employee personal information may have been breached), and one source dates the public confirmation to 26 October rather than 19 November.","2026-11-21 run: every UK item in the corporate exposure board at rank 9 is an unverified criminal leak-site claim with no victim statement. RedPacket Security warns that N0N listings have included fabricated victims, and the Halfords post dates conflict between trackers (9 November vs 20 November). No primary leak-site content was examined. No source links the N0n financial-sector leak to the SitusAMC breach and the two must not be merged. Ransomware claim counts are claims, not confirmed breaches, and trackers define 'UK victim' differently.","2026-11-21 run: phpAfterShell CVE-2026-126714 public PoC availability is disputed - Italy's national CSIRT and the Ubuntu security tracker state PoC code is public, while Wiz reports no observed exploitation and notes that GitHub repositories merely naming a CVE do not prove a working exploit. It was not in CISA KEV as at 20 November.","2026-11-21 run: no UK government incident FIRST reported inside this window was identified. The UK government entries at ranks 2, 4 and 6 are continuations or corroborations of items first reported on 18-19 November. Searches for 21 November UK incidents, NCSC advisories dated 20-21 November, ICO November 2026 enforcement actions and UK council/NHS incidents dated 20 November all returned nothing dated in the window."],"confidence_legend":{"high":"Corroborated by the vendor advisory or by multiple independent reputable sources.","medium":"Reported by a single reputable source, or by secondary coverage of a primary source not directly accessible.","low":"Single-sourced and uncorroborated; treat as an investigative lead only."},"exploitation_status_values":["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed","public_poc_available","no_known_exploitation"],"kql_platform_values":["sentinel","defender_xdr"],"ioc_types_present":["account","behaviour","filename","filepath","malware","note","port","service_name","ttp","uri_path"]},"vulnerabilities":[{"rank":1,"id":"TI-2026-11-21-001","title":"VMware vCenter CVE-2026-123890 Confirmed Exploited as a Zero-Day Since Early September by ARMORY CASTLE (ex-UNC5221) - Added to CISA KEV on 20 November with a 23 November Deadline, and NHS England Digital Has Issued Its Own Cyber Alert CC-4899","cve_ids":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"vendor":"Broadcom / VMware","affected_products":["VMware vCenter Server 8.0 - patched 19 November 2026 under VMSA-2026-0009","VMware vCenter Server 7.0 - reached end of general support in October 2025; at least one report states no public patch is available for this branch","vCenter components bundled in VMware Cloud Foundation","vCenter components bundled in VMware vSphere Foundation","vCenter components bundled in VMware Telco Cloud products","Same advisory (VMSA-2026-0009) also fixes four further issues in VMware SDDC Manager and VMware Tools for Windows","Vulnerable component: VMware Directory Service (vmdir) - authentication bypass using an alternate path or channel"],"category":"vulnerability","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-23","patch_available":"partial","first_reported":"2026-11-19","last_updated":"2026-11-21","confidence":"high","summary":"This is the most consequential item in the window and it is not a patching job. It is a compromise hunt with a three-day federal deadline attached, and the UK government hook is already in place: NHS England Digital published its own cyber alert, CC-4899, on 19 November at 16:29, rating the threat severity High and stating that security researchers have observed exploitation in the wild.\n\nThe mechanism. CVE-2026-123890 is a critical authentication bypass in the VMware Directory Service, the component that underpins vCenter Single Sign-On. It is classed as authentication bypass using an alternate path or channel, carries CVSS 9.8, and is reachable by a remote, unauthenticated attacker who can obtain an administrator session on vCenter Server. Broadcom shipped the fix on 19 November 2026 in VMSA-2026-0009, alongside four other issues in SDDC Manager and VMware Tools for Windows. Reporting states there is no workaround.\n\nWhat makes this different from a normal critical CVE. Broadcom's advisory credits Mandiant with reporting the flaw but, according to multiple outlets, does not mention that it was already being exploited. Google Threat Intelligence Group and Mandiant published separately and attribute the activity to ARMORY CASTLE, formerly tracked as UNC5221 and also referenced as Warp Panda, a suspected PRC-nexus espionage actor. Exploitation began in early September 2026 - more than two months before a fix existed. Mandiant further reports evidence that the group knew of the flaw before 29 July, the date CVE-2026-59309, a separate vCenter authentication bypass, was disclosed. The practical consequence: if you run vCenter 7.x or 8.x and it was reachable from anywhere an attacker had a foothold, the question for this week is not whether you are patched. It is whether you were already compromised between early September and 19 November, and patching does not answer that question.\n\nThe attack chain, which is the part worth reading twice. In the intrusion Mandiant describes, initial access did not come through vCenter at all - it came through a separate BeyondTrust zero-day, CVE-2026-102764, after which the actor moved laterally to internal Linux appliances that lacked EDR coverage. Against vCenter the group used BONESAW, a custom Go utility with a build timestamp of 13 July 2026, capable of fully compromising vCenter 7.x and 8.x appliances. BONESAW was observed extracting /storage/db/vmware-vmdir/data.mdb - the vmdir database - obtaining SAML Security Token Service signing material, and creating an SSO administrator account. Possession of STS signing material is the detail that should set the severity of your response: an attacker who can sign their own SAML assertions can mint authenticated sessions across everything that trusts that identity provider, and rotating a password does not revoke that. Reconnaissance preceding exploitation used nmap against ports associated with vCenter and adjacent services, including 443, 2012, 5480 and 9080. Follow-on tooling observed in successful intrusions includes SAWSNAKE, BEARBONES, LAZYBONES, SLIMSAVAGE and CAGEMATCH. Google has published YARA rules for all six families along with detection coverage in Google Security Operations.\n\nWhy the UK public sector should treat this as a priority over the weekend. vCenter is the management plane for a very large share of UK government, NHS trust, local authority and university virtualisation estates, and it is frequently reachable from the internal corporate network rather than isolated on an out-of-band management segment. The three elements combine badly: a management-plane authentication bypass, an espionage actor with two and a half months of undetected access, and a reported initial-access route through appliances that were outside EDR coverage. The appliance-with-no-EDR problem is the one most UK estates share. Note also the vCenter 7.0 position - end of general support since October 2025, with at least one report stating no public patch is available - which for anyone still on that branch converts this from a patch into a migration or an isolation decision taken this week.\n\nCISA added CVE-2026-123890 to the Known Exploited Vulnerabilities catalogue on 20 November 2026, in the same batch as Apache Roller, Cisco Expressway and SAP NetWeaver (rank 3), with a remediation deadline of 23 November 2026 under Binding Operational Directive 26-04. A three-day deadline is itself a signal about CISA's confidence in the exploitation evidence. UK bodies are not bound by BOD 26-04, but the deadline is a reasonable proxy for how fast the US government believes this needs to move.\n\nConfidence and caveats. Confidence is high on the identifier, the CVSS score, the vmdir component, the 19 November patch date and advisory number, the KEV addition on 20 November, the ARMORY CASTLE attribution and the BONESAW tradecraft - these are consistent across SecurityWeek, Help Net Security, BleepingComputer, SOC Prime, Cyber Kendra and the Google Cloud threat intelligence blog listing. The NHS England Digital alert CC-4899 is evidenced by its title, publication timestamp and severity rating as surfaced through search; the alert body was not retrieved because all direct page fetches failed in this run. The Google/Mandiant IOC tables, file hashes and YARA rule contents were NOT retrieved - only the behavioural indicators and family names are recorded below, and you should pull the full indicator set from the Mandiant blog directly. The number of compromised organisations has not been stated publicly. The vCenter 7.0 no-patch claim is single-source and should be checked against Broadcom's advisory matrix before you act on it.","recommended_actions":["Patch vCenter to the VMSA-2026-0009 fixed releases as an emergency change, not a scheduled one. CISA's deadline for US federal bodies is 23 November. If you are on the 7.0 branch, verify Broadcom's advisory matrix directly - one report states no public patch is available for that end-of-general-support branch, which makes isolation or migration the decision instead.","Then treat the estate as potentially compromised since early September and run a hunt, because patching does not evict an actor who has already been inside for ten weeks. Scope the hunt to vCenter, ESXi and the adjacent Linux appliances, not vCenter alone.","Enumerate every vCenter SSO administrator account and compare against your change records. BONESAW was observed creating an SSO administrator account; an account you cannot tie to an approved change is an incident, not a finding.","Assume SAML Security Token Service signing material is compromised on any host you cannot clear, and rotate it. An attacker holding STS signing keys can mint valid assertions for every service that trusts that identity provider, and a password reset does not revoke that capability. Rotating signing material is disruptive, which is exactly why it needs deciding this week rather than discovering later.","Check for access to /storage/db/vmware-vmdir/data.mdb and for any copy of that file outside its normal path. Exfiltration of the vmdir database is the observed objective.","Pull the full indicator set and YARA rules from the Google Cloud / Mandiant ARMORY CASTLE publication and load the rules for BONESAW, SAWSNAKE, BEARBONES, LAZYBONES, SLIMSAVAGE and CAGEMATCH. The indicators below are behavioural only; the hashes were not retrieved in this run.","Close the gap the attack chain actually used: inventory every appliance - virtualisation, backup, identity, remote access, refrigeration, anything shipped as a sealed Linux image - and record whether it carries EDR. The reported intrusion moved laterally through internal Linux appliances that had no EDR coverage. That inventory is worth more than this single patch.","Check your BeyondTrust estate against CVE-2026-102764, the reported initial-access leg. This feed recorded a vendor/product dispute on that identifier on 17 October; resolve the dispute against the vendor advisory rather than against a scanner's product string.","Remove vCenter, ESXi and SDDC Manager management interfaces from any network segment reachable by ordinary user endpoints, and verify by scanning from a user VLAN rather than by reading the firewall policy.","NHS organisations: action CC-4899 through your normal cyber alert process and record the response. The alert is dated 19 November with a High severity rating and explicitly references observed in-the-wild exploitation."],"kql":[{"platform":"sentinel","table":"Syslog","name":"vCenter SSO administrator account creation - ARMORY CASTLE / BONESAW","description":"Primary detection. BONESAW was observed creating an SSO administrator account on compromised vCenter appliances. Any such creation outside an approved change is an incident. Requires vCenter appliance syslog forwarding.","query":"let lookback = 120d;\nSyslog\n| where TimeGenerated > ago(lookback)\n| where Computer has_any (\"vcenter\", \"vcsa\", \"vsphere\")\n| where SyslogMessage has_any (\"vmdird\", \"vmdir\", \"sso\", \"vmware-sts\", \"vmafd\")\n| where SyslogMessage has_any (\"Add entry\", \"CreateUser\", \"user created\", \"added to group\", \"Administrators@vsphere.local\", \"member add\")\n| extend Principal = extract(@\"(?:cn=|user[ =:])([A-Za-z0-9._\\\\-]+)\", 1, SyslogMessage)\n| project TimeGenerated, Computer, Facility, SeverityLevel, Principal, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"Syslog","name":"Access to or copy of the vmdir database file data.mdb","description":"BONESAW extracted /storage/db/vmware-vmdir/data.mdb to obtain directory contents and SAML STS signing material. Any read, copy or archive of that path by a process other than vmdird is suspicious.","query":"let lookback = 120d;\nSyslog\n| where TimeGenerated > ago(lookback)\n| where SyslogMessage has \"data.mdb\" or SyslogMessage has \"vmware-vmdir\"\n| where SyslogMessage has_any (\"cp \", \"tar\", \"scp\", \"curl\", \"wget\", \"gzip\", \"base64\", \"dd if=\", \"cat \")\n| project TimeGenerated, Computer, Facility, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Reconnaissance against the vCenter management port set (443, 2012, 5480, 9080)","description":"ARMORY CASTLE conducted nmap reconnaissance against ports associated with vCenter and related services before exploitation. Distinct-port fan-out from a single internal source is the signal, not the individual connection.","query":"let lookback = 120d;\nlet vcPorts = dynamic([443, 2012, 5480, 9080, 8089, 7444]);\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where DestinationPort in (vcPorts)\n| summarize DistinctPorts = dcount(DestinationPort), PortList = make_set(DestinationPort, 10), DistinctTargets = dcount(DestinationIP), Attempts = count()\n    by SourceIP, bin(TimeGenerated, 1h)\n| where DistinctPorts >= 3 or DistinctTargets >= 5\n| order by Attempts desc"},{"platform":"sentinel","table":"AADNonInteractiveUserSignInLogs","name":"Unexpected SAML assertion issuance after suspected STS signing material theft","description":"If STS signing material was stolen, the attacker can mint valid assertions. Hunt for federated sign-ins that do not correspond to a known device or location. Tune heavily - this is a hunting query, not a rule.","query":"let lookback = 90d;\nAADNonInteractiveUserSignInLogs\n| where TimeGenerated > ago(lookback)\n| where AuthenticationProtocol has_any (\"saml\", \"wsFederation\")\n| extend Dev = tostring(DeviceDetail.deviceId), Loc = tostring(LocationDetails.countryOrRegion)\n| summarize SignIns = count(), Countries = make_set(Loc, 10), Devices = dcount(Dev) by UserPrincipalName, AppDisplayName\n| where Devices == 0 or array_length(Countries) > 2\n| order by SignIns desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Go binaries and archive staging on virtualisation management hosts","description":"BONESAW is a Go utility (build timestamp 13 July 2026). Hunt for unexpected statically linked binaries and staging activity on or adjacent to virtualisation management infrastructure.","query":"let lookback = 90d;\nDeviceProcessEvents\n| where Timestamp > ago(lookback)\n| where DeviceName has_any (\"vcenter\", \"vcsa\", \"esxi\", \"vsphere\", \"sddc\")\n    or InitiatingProcessFolderPath has_any (\"/tmp/\", \"/var/tmp/\", \"/dev/shm/\")\n| where FileName in~ (\"tar\", \"gzip\", \"zip\", \"base64\", \"openssl\", \"curl\", \"wget\", \"nc\", \"socat\")\n    or ProcessCommandLine has_any (\"data.mdb\", \"vmware-vmdir\", \"/storage/db/\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, FolderPath\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connections from virtualisation appliances","description":"Appliances should not initiate arbitrary outbound connections. This query surfaces egress from management-plane hosts, which is where the EDR coverage gap in the reported intrusion would have shown.","query":"let lookback = 90d;\nDeviceNetworkEvents\n| where Timestamp > ago(lookback)\n| where DeviceName has_any (\"vcenter\", \"vcsa\", \"esxi\", \"vsphere\", \"sddc\", \"nsx\")\n| where ActionType == \"ConnectionSuccess\"\n| where RemoteIPType == \"Public\"\n| summarize Connections = count(), Ports = make_set(RemotePort, 10), FirstSeen = min(Timestamp), LastSeen = max(Timestamp)\n    by DeviceName, RemoteIP\n| order by Connections desc"}],"iocs":[{"type":"malware","value":"BONESAW","context":"Custom Go utility used by ARMORY CASTLE to exploit CVE-2026-123890 and fully compromise vCenter 7.x and 8.x appliances. Build timestamp reported as 13 July 2026. Also deployed against appliances already patched for CVE-2026-59309.","confidence":"high","source":"Google Threat Intelligence Group / Mandiant via secondary coverage"},{"type":"malware","value":"SAWSNAKE","context":"Follow-on tooling observed by Mandiant in successful ARMORY CASTLE intrusions. YARA rule published by Google Threat Intelligence.","confidence":"medium","source":"Mandiant via secondary coverage"},{"type":"malware","value":"BEARBONES","context":"Follow-on ARMORY CASTLE tooling; YARA rule published by Google Threat Intelligence.","confidence":"medium","source":"Mandiant via secondary coverage"},{"type":"malware","value":"LAZYBONES","context":"Follow-on ARMORY CASTLE tooling; YARA rule published by Google Threat Intelligence.","confidence":"medium","source":"Mandiant via secondary coverage"},{"type":"malware","value":"SLIMSAVAGE","context":"Follow-on ARMORY CASTLE tooling; YARA rule published by Google Threat Intelligence.","confidence":"medium","source":"Mandiant via secondary coverage"},{"type":"malware","value":"CAGEMATCH","context":"Follow-on ARMORY CASTLE tooling; YARA rule published by Google Threat Intelligence.","confidence":"medium","source":"Mandiant via secondary coverage"},{"type":"filepath","value":"/storage/db/vmware-vmdir/data.mdb","context":"vCenter directory service database. BONESAW was observed extracting this file to obtain directory contents and SAML Security Token Service signing material.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"account","value":"unexpected SSO administrator account in vsphere.local","context":"BONESAW was observed creating an SSO administrator account. Compare the full administrator list against approved change records.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"behaviour","value":"theft of SAML STS signing material from vCenter","context":"Allows the attacker to mint valid SAML assertions for any service trusting that identity provider. Password rotation does not revoke this; signing material must be rotated.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"port","value":"443","context":"Scanned during pre-exploitation reconnaissance against vCenter and related services.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"port","value":"2012","context":"vCenter SSO / STS-associated port scanned during ARMORY CASTLE reconnaissance.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"port","value":"5480","context":"vCenter Server Appliance management interface port scanned during reconnaissance.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"port","value":"9080","context":"vCenter-associated service port scanned during reconnaissance.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"ttp","value":"nmap reconnaissance preceding exploitation","context":"ARMORY CASTLE scanned for vCenter and related service ports before deploying BONESAW.","confidence":"high","source":"Mandiant via secondary coverage"},{"type":"ttp","value":"lateral movement to internal Linux appliances lacking EDR coverage","context":"The reported intrusion chain reached vCenter via appliances that were outside EDR coverage, after initial access through BeyondTrust zero-day CVE-2026-102764.","confidence":"medium","source":"Mandiant via secondary coverage"},{"type":"note","value":"Google/Mandiant file hashes and YARA rule contents were NOT retrieved in this run - all direct page fetches failed with DNS resolution errors. Pull the full indicator set from the Mandiant ARMORY CASTLE publication before relying on this entry for hunting.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"},{"type":"note","value":"Broadcom's VMSA-2026-0009 advisory reportedly does not mention in-the-wild exploitation, so a vendor-advisory-only review of this CVE would understate it. The exploitation evidence is Mandiant's and CISA's.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"SecurityWeek / Help Net Security via search summaries"}],"references":["https://www.securityweek.com/newly-patched-vmware-vcenter-flaw-exploited-as-zero-day-by-chinese-apt/","https://www.helpnetsecurity.com/2026/11/20/vmware-vcenter-zero-day-cve-2026-123890-exploited/","https://www.bleepingcomputer.com/news/security/vmware-patches-vcenter-zero-day-exploited-in-attacks-since-september/","https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere","https://socprime.com/blog/cve-2026-123890-critical-vmware-vcenter-zero-day-exploited-by-china-linked-hackers/","https://digital.nhs.uk/cyber-alerts/2026/cc-4899","https://securityonline.info/cisa-kev-catalog-vcenter-cisco-expressway/","https://www.cisa.gov/known-exploited-vulnerabilities-catalog"]},{"rank":2,"id":"TI-2026-11-21-002","title":"UK Government: Transport for London Revised the Oyster Photocard Breach Up to Around 265,000 Customers and Says the Figure May Rise Again - Security Question Answers Are in Scope, the ICO Is Notified, and the Entry Point Is Still Undisclosed","cve_ids":[],"vendor":"Transport for London","affected_products":["TfL Oyster photocard website and account platform (taken offline; restoration date not announced)","Affected card types include Zip photocards for children and young people, 18+ Student Oyster, Apprentice Oyster, Care Leaver Oyster, 60+ London Oyster and Veterans Oyster","Approximately 265,000 photocard customers, revised up from an earlier estimate of around 250,000; TfL says the investigation is incomplete and the figure may increase further"],"category":"incident","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-19","last_updated":"2026-11-21","confidence":"high","summary":"Carried forward from yesterday at rank 1 and retained at rank 2 because the window contains a material change: the number of affected customers has been revised upward from around 250,000 to around 265,000, and TfL says the investigation is not complete and the figure may increase again. A breach whose scope is still growing five days after detection is not a closed incident, and the coverage dated 20 November - Help Net Security and Computer Weekly among them - is the first reporting to carry the revised number.\n\nWhat happened, restated for completeness. TfL detected the compromise on 16 November when existing customers began receiving account-creation emails they had not requested. That is the detail worth dwelling on: the attacker drove a legitimate TfL workflow at scale from inside TfL's own platform, and the detection path was customer complaint, not telemetry. TfL took the Oyster photocard website offline, notified customers on 18 November, notified the Information Commissioner's Office, and the story broke publicly on 19 November. The entry point remains undisclosed, and no actor has been named.\n\nThe data. Reporting differs on the exact field list and that difference matters, so both versions are recorded. The narrower account is full names, phone numbers and email addresses. The broader and more commonly reported account is names, email addresses, home addresses, phone numbers, dates of birth and security questions together with their answers. TfL's own position is consistent across outlets on what was NOT taken: passwords, bank and payment details, and journey data were not compromised, and photographs were not exposed. Oyster photocards continue to work.\n\nWhy the security answers are the whole story. Passwords get rotated and the exposure ends. A date of birth, a home address and the answer to a static security question cannot be rotated, and they are precisely the three things UK call centres - at TfL and at every bank, utility, local authority and NHS trust those same Londoners deal with - accept as telephone identity proof. The consequence of TfL's loss therefore lands on organisations that had nothing to do with it. TfL's remediation is correct as far as it goes: once the portal is restored, all photocard customers will be prompted to change their password, security question and answer. But it only protects TfL.\n\nThe second-order exposure is the card types. The affected products are not generic travel accounts; they disclose status. A Zip photocard identifies a child, an 18+ Student Oyster identifies a student, an Apprentice Oyster identifies an apprentice, a Care Leaver Oyster identifies a care leaver and a Veterans Oyster identifies a veteran. A dataset that pairs a name, home address, date of birth and 'is a care leaver' or 'is a child' is materially more useful for targeted social engineering than a dataset of 265,000 generic customer records, and the London Assembly has published its own statement on the exposure.\n\nRegulatory context. TfL reported the incident to the ICO and says it has found no evidence that the compromised data has been used. Whether the ICO opens a formal investigation is not yet known; one outlet notes it is unclear whether the ICO will investigate or take action. The relevant precedent is TfL's own 2024 cyber attack, after which the ICO investigated and chose not to take enforcement action, having judged TfL's response proportionate. No compensation scheme has been announced, and the ICO cannot award compensation in any event.\n\nConfidence and caveats. Confidence is high on the 16 November detection date, the website being taken offline, the 18 November customer notification, the ICO notification, the revised figure of approximately 265,000 and TfL's statement that the figure may rise - these are consistent across BleepingComputer, Computer Weekly, ITPro, The Register, Help Net Security and Neowin. The exact exposed field list is reported inconsistently between outlets and both versions are recorded above. The attacker's entry point, the actor identity and the restoration date are all undisclosed. No TfL or ICO primary page was retrieved in this run because all direct page fetches failed.","recommended_actions":["If you have not already done it after yesterday's report: put a rate alert on your own transactional email volume today. TfL's compromise surfaced because customers received account-creation emails they had not asked for, generated by the attacker driving a legitimate workflow inside TfL's own platform. If your platform can send a large volume of account emails without anything internal flagging it, you have the same gap, and closing it is a configuration change rather than a project.","Stop accepting static security answers, dates of birth and home addresses as telephone identity proof. Around 265,000 Londoners' answers are now in circulation and cannot be rotated. This is the control that protects your organisation from someone else's breach, and the TfL dataset is a good enough reason to make the change this quarter.","Treat any inbound contact referencing a London travel concession - Zip, 18+ Student, Apprentice, Care Leaver, 60+ or Veterans Oyster - as a fraud indicator in your contact-centre scripts for the next several months. The card types disclose age, student, apprentice, care-leaver and veteran status, which is what makes this dataset useful for targeted approaches.","If you are a local authority, NHS trust, school, college or charity serving London: expect your service users to be in this dataset and brief frontline staff accordingly. Your organisation can be defrauded using data TfL lost.","Monitor account-creation and password-reset workflows for volume anomalies as a standing control, not a one-off check, and alert on the ratio of account-creation emails to actual completed registrations. A high send volume with a low completion rate is the signature of what happened here.","Re-read your own breach detection assumptions against this case. The detection path was a customer complaint. Ask honestly which of your own platforms would surface this class of abuse from telemetry alone, and write the answer down.","Where you hold static security answers, plan their removal. Replace them with one-time codes to a verified channel or with knowledge the organisation can itself invalidate. Static answers are a liability whose exposure you cannot remediate.","Do not treat the 265,000 figure as final. TfL has stated the investigation is incomplete and the number may increase. If you are tracking exposure for your own service users, revisit it."],"kql":[{"platform":"sentinel","table":"AuditLogs","name":"Account creation volume anomaly - the TfL detection gap","description":"The cheapest control in this report. Alerts when account-creation events in an hour exceed a multiple of the rolling baseline. TfL's attacker generated account emails at scale and nothing internal flagged it.","query":"let baselineWindow = 30d;\nlet detectWindow = 7d;\nlet creations = AuditLogs\n    | where TimeGenerated > ago(baselineWindow)\n    | where OperationName has_any (\"Add user\", \"Create user\", \"Invite external user\", \"Register user\")\n    | summarize Creations = count() by bin(TimeGenerated, 1h);\nlet stats = creations | where TimeGenerated \u003c ago(detectWindow) | summarize Avg = avg(Creations), Sd = stdev(Creations);\ncreations\n| where TimeGenerated > ago(detectWindow)\n| extend Avg = toscalar(stats | project Avg), Sd = toscalar(stats | project Sd)\n| extend Threshold = Avg + (3 * Sd)\n| where Creations > Threshold and Creations > 20\n| project TimeGenerated, Creations, Avg = round(Avg, 1), Threshold = round(Threshold, 1)\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"SigninLogs","name":"Credential-stuffing pattern against customer-facing authentication","description":"Security answers, dates of birth and addresses from this breach feed account-recovery abuse elsewhere. Surfaces single sources attempting many distinct accounts.","query":"let lookback = 14d;\nSigninLogs\n| where TimeGenerated > ago(lookback)\n| where ResultType != 0\n| summarize DistinctAccounts = dcount(UserPrincipalName), Attempts = count(), Failures = make_set(ResultDescription, 5)\n    by IPAddress, bin(TimeGenerated, 1h)\n| where DistinctAccounts >= 15\n| order by DistinctAccounts desc"},{"platform":"sentinel","table":"AuditLogs","name":"Password and security-answer reset spikes per actor","description":"Detects an identity or service principal driving reset or recovery workflows at scale, the pattern reported inside TfL's platform.","query":"let lookback = 30d;\nAuditLogs\n| where TimeGenerated > ago(lookback)\n| where OperationName has_any (\"Reset password\", \"Change password\", \"Update user\", \"Reset user password\", \"Self-service password reset\")\n| extend Actor = tostring(InitiatedBy.user.userPrincipalName), App = tostring(InitiatedBy.app.displayName)\n| summarize Operations = count(), Targets = dcount(tostring(TargetResources[0].id)) by coalesce(Actor, App), bin(TimeGenerated, 1h)\n| where Operations > 25 or Targets > 25\n| order by Operations desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Phishing referencing TfL, Oyster or London travel concessions","description":"Follow-on fraud against a dataset containing names, addresses, dates of birth and concession status. Tune the sender allowlist to your own legitimate TfL correspondence.","query":"let lookback = 30d;\nEmailEvents\n| where Timestamp > ago(lookback)\n| where Subject has_any (\"Oyster\", \"photocard\", \"Transport for London\", \"TfL\", \"Zip card\", \"Veterans Oyster\", \"Care Leaver\")\n| where SenderFromDomain !endswith \"tfl.gov.uk\"\n| project Timestamp, SenderFromAddress, SenderFromDomain, RecipientEmailAddress, Subject, DeliveryAction, ThreatTypes\n| order by Timestamp desc"}],"iocs":[{"type":"behaviour","value":"unsolicited account-creation emails sent to existing customers","context":"The detection signal at TfL on 16 November. The attacker drove a legitimate account-creation workflow at scale from inside TfL's own platform; customers complaining was the detection path, not telemetry.","confidence":"high","source":"TfL statements via multiple outlets"},{"type":"behaviour","value":"exposure of static security questions together with their answers","context":"Non-rotatable identity proof for approximately 265,000 people. Defeats telephone identity verification at any organisation accepting the same answers, not just TfL.","confidence":"medium","source":"Majority of secondary coverage; narrower field lists appear in some outlets"},{"type":"ttp","value":"abuse of a legitimate application workflow at scale rather than malware","context":"No malware stage is reported. The abuse is of TfL's own account functionality, which is why endpoint telemetry would not have surfaced it.","confidence":"high","source":"Secondary coverage"},{"type":"note","value":"Scope is still expanding: the estimate moved from approximately 250,000 to approximately 265,000 inside this window and TfL states the investigation is incomplete and the figure may rise further.","context":"Provenance statement, not an indicator.","confidence":"high","source":"Computer Weekly / Help Net Security, 20 November 2026"},{"type":"note","value":"The exposed field list differs between outlets. Narrow version: names, phone numbers, email addresses. Broad version: names, email and home addresses, phone numbers, dates of birth, security questions and answers. TfL consistently states passwords, bank and payment details and journey data were not compromised.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"Comparison across BleepingComputer, ITPro, The Register, Computer Weekly, Neowin"},{"type":"note","value":"Entry point, actor identity and portal restoration date are all undisclosed as at 21 November 2026. No TfL or ICO primary page was retrieved in this run.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"}],"references":["https://www.bleepingcomputer.com/news/security/transport-for-london-breach-exposes-265-000-oyster-card-users-data/","https://www.helpnetsecurity.com/2026/11/20/transport-for-london-oyster-photocard-data-breach/","https://www.computerweekly.com/news/366654973/Over-250000-Londoners-affected-by-latest-TfL-breach","https://www.itpro.com/cyber-resilience/data-breaches/oyster-photocard-breach-tfl-takes-system-offline-after-260-000-customers-affected-by-attack","https://www.theregister.com/security/2026/11/19/tfl-takes-oyster-photocard-website-offline-after-attackers-compromise-customer-accounts/5310985","https://www.london.gov.uk/press-releases/assembly/we-have-your-details","https://www.neowin.net/news/transport-for-london-cyberattack-exposes-data-of-265000-oyster-photocard-users/"]},{"rank":3,"id":"TI-2026-11-21-003","title":"CISA Added Four Exploited Flaws to KEV on 20 November With a Three-Day Deadline of 23 November: Apache Roller CVE-2026-129448 (Pre-Auth XML-RPC RCE, Now Confirmed Exploited and Disabling XML-RPC Does NOT Mitigate It), Cisco Expressway CVE-2026-76466 (Hard-Coded Erlang Cluster Cookie, Root) and SAP NetWeaver CVE-2025-42884","cve_ids":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"vendor":"Apache Software Foundation / Cisco / SAP","affected_products":["Apache Roller 4.0.0 through 6.1.4 - unauthenticated deserialization via /roller-services/xmlrpc; fixed in 6.1.6 (some sources say 6.1.7); the earlier 6.1.5 release fixed only the CVE-2026-82384 identifier for the same underlying bug","Cisco Expressway-C (Core) and Expressway-E (Edge), virtual and appliance, clustered deployments - advisory cisco-sa-vcs-static-cred-hr7EWZ8t; affected clusters reported as X15.5.3 and earlier; fixed in X15.5.20","SAP NetWeaver 7.50 - improper neutralization of special elements in data query logic; fix delivered via SAP Note 3660969","Fourth member of the same KEV batch: VMware vCenter CVE-2026-123890 - see rank 1"],"category":"vulnerability_bundle","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-23","patch_available":"yes","first_reported":"2026-11-17","last_updated":"2026-11-21","confidence":"high","summary":"CISA added four vulnerabilities to the Known Exploited Vulnerabilities catalogue on 20 November 2026 and set a single remediation deadline of 23 November 2026 under Binding Operational Directive 26-04. Three days is unusually short and is itself the finding: it indicates CISA is confident in the exploitation evidence for all four. The fourth member of the batch is the VMware vCenter zero-day at rank 1; the other three are bundled here.\n\nApache Roller CVE-2026-129448 - the one with the trap in it. CVSS 9.8, published 17 November 2026, deserialization of untrusted data in Apache Roller versions 4.0.0 through 6.1.4, allowing an unauthenticated remote attacker to execute arbitrary code. The mechanism is an unauthenticated POST to /roller-services/xmlrpc carrying an ex:serializable Java object, which the server deserialises before any authentication or feature check. Apache has acknowledged that the issue is being actively exploited but has not published payload details, attribution or the stages of successful exploitation.\n\nTwo things about this one will catch people out. First, it is the same underlying bug as CVE-2026-82384, which was patched in September for 6.1.5 only - so an organisation that patched in September against the old identifier may still be exposed, and an identifier-matching scanner will agree with the September remediation record. This feed flagged exactly this pattern yesterday in the PHP advisory (rank 9 today) and the week before in the Zyxel wrong-KEV-CVE case. That is now four reissued-or-incomplete-fix cases in three weeks, and it is the single most important governance finding in this feed: a closed remediation ticket is no longer evidence that the bug is closed. Second, and worse: disabling XML-RPC in the Roller admin interface is NOT a mitigation. Apache states that affected versions deserialise the request before checking whether the XML-RPC feature is enabled. Anyone who 'mitigated' by turning the feature off in the UI has not mitigated anything. The real workarounds, if you cannot upgrade immediately, are to set enabledForExtensions to false in WEB-INF/web.xml, or to remove the /roller-services/xmlrpc servlet mapping, then restart Roller. The fix is 6.1.6 or later.\n\nCisco Expressway CVE-2026-76466 - hard-coded credentials, root, no workaround. CVSS 9.8, CWE-798, covered by Cisco advisory cisco-sa-vcs-static-cred-hr7EWZ8t published 21 October 2026, affecting Expressway-C and Expressway-E in both virtual and appliance form. The flaw lives in the cluster database service, which runs on Erlang and listens on TCP 4372. A maintenance node identity - reported as 'wombat@' - and a matching Erlang cookie are compiled into the software, meaning they are identical on every installation. An unauthenticated attacker with network access to that port on a clustered device can execute OS commands as root. Cisco's position is that an attacker must possess the cookie; since the cookie ships in the binary, that is not a meaningful barrier, and Cisco lists no workaround. Fix is X15.5.20. Two further details matter: reporting indicates X15.5.20 does NOT close PHP2Shell, so plan a second hop to 15.5.21 or later rather than treating X15.5.20 as done; and one report describes an attacker using public exploit code to obtain root on four clustered gateways at a Russian organisation. Cisco's PSIRT was not aware of exploitation as at 21 October - the KEV addition on 20 November is the change.\n\nSAP NetWeaver CVE-2025-42884. Listed in KEV as improper neutralisation of special elements in data query logic. Reporting cites SAP NetWeaver 7.50 as affected and SAP Note 3660969 as the fix. This is the thinnest of the three in open reporting - note the 2025 identifier year, which means it has been available for exploitation for some time - and it needs checking against the SAP Security Patch Day notes rather than against secondary coverage.\n\nUK relevance. Expressway is the edge component of Cisco Unified Communications and is common in NHS trusts, local authorities and universities for external video and mobile-and-remote-access collaboration - it is by design internet-facing, which is the worst possible pairing with a hard-coded root credential. Apache Roller is a smaller UK footprint but appears in university and research-institute blog estates. SAP NetWeaver sits under finance and HR systems in central government and large UK corporates, where patch windows are long and change control
