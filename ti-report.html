rability becoming known and being probed at scale shrinks - which is exactly the pattern visible at ranks 1, 3 and 7 of this report, and precisely what the NCSC's annual review told UK organisations to plan for when it urged them to prepare for a rush of security updates.\n\nUK relevance, concretely. UK central government, devolved administrations and arm's-length bodies run the same classes of system as the ones hit - HR platforms, occupational health and reimbursement systems, translation services - usually from SaaS suppliers, often with the same supplier serving many bodies. Those systems are rarely on the critical-systems list because they are not service-delivery systems, which means they attract less monitoring and longer patch windows while holding staff personal and medical data. The ten-day outage is the part to plan for.\n\nConfidence and caveats. Confidence is medium. High on the 22 October detection date, the 19 November public confirmation by spokesperson Thomas Regnier, the affected systems Sysper, MyPMO and translation, the ten-day-plus duration, the absence of attribution and the absence of a known ransom demand - these are consistent across SecurityWeek, The Record, Help Net Security, Infosecurity Magazine and Brussels Times. Medium on the ARTEX identification, which is Politico's reporting of CERT-EU's detection and was not confirmed by the Commission's spokesperson, who declined to name the tool. Disputed on data impact: SecurityWeek reports no evidence of a data breach, while Infosecurity, citing Politico, reports that the attack may have breached employee personal information - both are recorded, unresolved. One source dates the confirmation to 26 October rather than 19 November, which conflicts with the majority account. No primary Commission or CERT-EU statement was retrieved in this run. The investigation remains open.","recommended_actions":["Decide now what you would say on day three of a prolonged outage in a system holding staff personal or medical data, and who has authority to say it. The transferable lesson here is the four-week gap between detection and public confirmation, not the AI tooling.","Add HR, occupational health, payroll and reimbursement systems to your critical-systems list if they are not already on it. They hold staff personal and medical data, they are usually SaaS, and they typically attract less monitoring and longer patch windows than service-delivery systems precisely because they are not service-delivery systems.","Plan for a ten-day outage of those systems specifically, not just for a breach of them. Document the manual fallback for payroll, expenses, absence recording and medical reimbursement, and confirm somebody owns it.","Ask your HR and occupational health SaaS suppliers for their incident notification commitments in writing, including how quickly they will tell you the cause and not merely that there is an outage.","Shorten your own patch cycle for internet-facing systems rather than adding an AI-specific control. AI-assisted vulnerability discovery compresses the time between a weakness existing and someone finding it; it does not create a new vulnerability class. The defence is existing hygiene applied faster.","Re-read the NCSC's November annual review guidance to plan for a rush of security updates, and check that your emergency change process can actually absorb several out-of-cycle criticals in one week. This report alone contains four.","Monitor for automated, broad reconnaissance against your external estate - high-rate, wide-surface, low-noise scanning - as a standing signal rather than a one-off hunt. That is what tooling of this class produces.","Do not record this as an AI incident in your risk register and leave it there. Record it as a prolonged outage of staff-data systems with delayed cause attribution, because that is the risk you can actually manage."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"Automated broad-surface reconnaissance against the external estate","description":"Detects the signature of accelerated, tool-driven vulnerability discovery: a single source touching many distinct hosts and ports in a short period with low per-target noise.","query":"let lookback = 45d;\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where isnotempty(SourceIP) and not(ipv4_is_private(SourceIP))\n| summarize DistinctHosts = dcount(DestinationIP), DistinctPorts = dcount(DestinationPort), Requests = count(), Paths = dcount(RequestURL)\n    by SourceIP, bin(TimeGenerated, 1h)\n| where (DistinctHosts >= 10 and DistinctPorts >= 5) or Paths >= 100\n| order by DistinctHosts desc"},{"platform":"sentinel","table":"SigninLogs","name":"Anomalous access to HR, occupational health and reimbursement applications","description":"Covers the system classes affected at the Commission. Replace the application name list with your own HR, payroll, occupational health and expenses applications.","query":"let lookback = 45d;\nlet hrApps = dynamic([\"HR\", \"Payroll\", \"Occupational\", \"Expenses\", \"Workday\", \"SuccessFactors\", \"iTrent\", \"Oracle HCM\"]);\nSigninLogs\n| where TimeGenerated > ago(lookback)\n| where AppDisplayName has_any (hrApps)\n| summarize SignIns = count(), Countries = make_set(tostring(LocationDetails.countryOrRegion), 10), IPs = dcount(IPAddress)\n    by UserPrincipalName, AppDisplayName\n| where array_length(Countries) > 2 or IPs > 10\n| order by SignIns desc"},{"platform":"sentinel","table":"OfficeActivity","name":"Bulk export or download from HR and staff-data systems","description":"Exfiltration detection for the data classes involved: employment records and medical reimbursement data.","query":"let lookback = 45d;\nOfficeActivity\n| where TimeGenerated > ago(lookback)\n| where Operation has_any (\"FileDownloaded\", \"FileSyncDownloadedFull\", \"ExportList\", \"SearchExported\", \"FileAccessed\")\n| where OfficeObjectId has_any (\"hr\", \"payroll\", \"personnel\", \"occupational\", \"medical\", \"reimburse\", \"staff\")\n| summarize Events = count(), Files = dcount(OfficeObjectId) by UserId, ClientIP, bin(TimeGenerated, 1h)\n| where Events > 50 or Files > 30\n| order by Events desc"},{"platform":"sentinel","table":"Heartbeat","name":"Prolonged availability loss across a business system group","description":"The operational signal that defines this incident: a correlated multi-day availability loss. Surfaces hosts that stopped reporting and did not return, which is what a ten-day outage looks like in telemetry.","query":"let lookback = 45d;\nHeartbeat\n| where TimeGenerated > ago(lookback)\n| summarize LastSeen = max(TimeGenerated), FirstSeen = min(TimeGenerated) by Computer\n| extend HoursSinceSeen = datetime_diff(\"hour\", now(), LastSeen)\n| where HoursSinceSeen > 48\n| project Computer, FirstSeen, LastSeen, HoursSinceSeen\n| order by HoursSinceSeen desc"}],"iocs":[{"type":"malware","value":"ARTEX","context":"Reported by Politico as the publicly available AI tool for finding weaknesses in IT systems that CERT-EU detected in use. The Commission's spokesperson confirmed a publicly available AI tool was involved but declined to name it.","confidence":"low","source":"Politico via secondary coverage"},{"type":"ttp","value":"AI-assisted vulnerability discovery and reconnaissance acceleration","context":"Compresses the interval between a weakness existing and being found, and widens the set of actors capable of finding it. Does not introduce a new vulnerability class; the defence is existing hygiene applied faster.","confidence":"medium","source":"Analytic assessment based on the reported tool description"},{"type":"behaviour","value":"prolonged multi-day outage of HR, medical reimbursement and translation systems","context":"Personnel systems reported unavailable for more than ten days. The operational, not data, impact is the primary consequence recorded.","confidence":"high","source":"Multiple outlets"},{"type":"behaviour","value":"four-week gap between detection and public confirmation of cause","context":"Detected 22 October; publicly confirmed 19 November. The transferable governance lesson for any public body operating staff-data systems.","confidence":"high","source":"Multiple outlets"},{"type":"note","value":"Data impact is disputed: SecurityWeek reports the Commission has no evidence of a data breach; Infosecurity Magazine, citing Politico, reports the attack may have breached employee personal information. Both recorded, unresolved.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"SecurityWeek vs Infosecurity Magazine"},{"type":"note","value":"No attribution to a known group has been made and the spokesperson said he was not aware of any ransom demand. The investigation remains open.","context":"Provenance statement, not an indicator.","confidence":"high","source":"The Record / SecurityWeek via search summaries"},{"type":"note","value":"One source dates the confirmation to 26 October rather than 19 November, conflicting with the majority account. No primary Commission or CERT-EU statement was retrieved in this run.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"},{"type":"note","value":"Included for UK relevance rather than UK jurisdiction: it is the first public confirmation by a major European government body of an AI-assisted attack taking internal systems down, three weeks after the NCSC assessed AI-powered malware in CNI ransomware attacks as highly likely by 2028.","context":"Editorial provenance statement, not an indicator.","confidence":"high","source":"This run"}],"references":["https://www.securityweek.com/european-commission-confirms-ai-assisted-cyberattack-disrupted-services","https://therecord.media/european-commission-confirms-cyberattack-using-ai","https://www.helpnetsecurity.com/2026/11/20/european-commission-ai-generated-cyberattack-publicly-available-tool/","https://www.infosecurity-magazine.com/news/commission-ai-attack-systems/","https://www.brusselstimes.com/2414026/european-commission-confirms-ai-assisted-cyberattack-on-internal-systems-tbtb","https://thenextweb.com/news/ncsc-annual-review-2026-ai-malware-critical-infrastructure"]},{"rank":9,"id":"TI-2026-11-21-009","title":"UK Corporate Exposure Board as at 21 November 2026: Aurora Claims 1.1 TB From Sheffield Engineering Group William Cook Holdings, N0n Publishes Alleged Visa, Mastercard and JPMorgan Customer Data From Unnamed Third Parties, and The Gentlemen Names Nvidia - Almost None of It Is Confirmed, and That Is the Finding","cve_ids":[],"vendor":"Multiple (UK and multinational victim organisations)","affected_products":["William Cook Holdings Limited (Sheffield-based industrial castings group) - Aurora leak-site claim logged 20 November 2026; 1.1 TB claimed exfiltrated from the Stanhope site file server including employee personal data and payroll records","Boutinot Limited (UK wine importer) - Aurora leak-site post dated 19 November 2026; approximately 384 GB claimed from a corporate file server","Halfords Group plc - N0n listing; RedPacket Security dates the post 9 November while Ransomware.live logged it 20 November; RedPacket warns N0N listings have included unverified or fabricated victim claims","Audio Note UK Ltd (high-end audio manufacturer) - Osiris leak-site claim, 11 November 2026, unconfirmed","Visa, Mastercard and JPMorgan Chase - customer data published by N0n, obtained from unnamed third-party service providers rather than the companies' own systems","Nvidia - named by The Gentlemen; Nvidia investigating a possible third-party partner incident and reports no indication its own systems or networks were affected"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"medium","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-19","last_updated":"2026-11-21","confidence":"low","summary":"This entry consolidates the UK corporate extortion picture in the window and is deliberately marked low confidence throughout. Every item in it is a criminal group's claim on a leak site. None has a victim statement confirming it, and one of the groups involved has a documented record of publishing claims that do not hold up. Read it as a watchlist, not as a list of breaches.\n\nThe largest and most sensitive UK claim. Ransomware.live logged an Aurora claim against William Cook Holdings Limited, the Sheffield-based industrial castings group, on 20 November. The claimed dataset is 1.1 TB exfiltrated from a file server at the Stanhope site, said to include employee personal data and payroll records. If accurate, the sensitive element is the employee data rather than the volume: payroll records carry names, addresses, national insurance numbers, bank details and salary, which is the combination that enables both identity fraud and convincing payroll-diversion approaches to the employer itself. There is no company statement.\n\nThe second Aurora claim. Aurora posted a claim against Boutinot Limited, the UK wine importer, on 19 November, asserting approximately 384 GB taken from a corporate file server. The post describes data theft and does not state whether systems were encrypted. Two UK manufacturing and distribution businesses claimed by the same group within 48 hours is the pattern worth noting - it suggests either a shared access route, a shared supplier, or simply that Aurora is working a UK mid-market seam. Nothing in the reporting distinguishes between those.\n\nThe one to be most careful with. Halfords Group plc appears on an N0n listing. The dates do not agree: RedPacket Security dates the post 9 November, Ransomware.live logged it on 20 November. More importantly, RedPacket explicitly warns that listings attributed to N0N have included unverified or fabricated victim claims and advises treating the post as unconfirmed. This feed recorded the same caution about N0n's UK retail listings on 20 November and downgraded them to a low-confidence note; that assessment is retained. Do not brief a board on a Halfords breach on this evidence.\n\nAnd yet N0n has now published something substantive. The same group claimed responsibility for publishing customer data belonging to Visa, Mastercard and JPMorgan Chase - obtained, all three companies say, from third-party service providers rather than from their own systems. The responses are notably measured and worth reading as a template. Visa says the incident involved a third-party service provider in the Asia-Pacific region and that card numbers were not affected. Mastercard acknowledges exposure of a limited quantity of email addresses - non-payment information - from a small subset of cardholders enrolled in a specific benefit programme. JPMorgan says attackers accessed marketing data that could include customer names and email addresses. None of the three named the third parties. Cybernews notes the published records may be test data and that the origin and authenticity have not been independently verified. The analytic point: a group with a record of fabricated claims has also produced a real third-party incident, which means the correct posture toward N0n is neither dismissal nor acceptance but verification, case by case.\n\nThe lesson the financial-sector response actually teaches. Three of the largest payment and banking brands in the world were exposed through suppliers and none of them would name the supplier. For a UK organisation that is not a reassurance, it is a warning about your own position: if a shared marketing, benefits or loyalty platform is breached, you will learn about it from a leak site, your public statement will be constrained by what the supplier will let you say, and your customers will not accept 'a third party' as an answer. The control is knowing, now, which suppliers hold your customer contact data and what your notification obligations and communications position are for each.\n\nNvidia, for completeness. Nvidia is investigating a possible third-party partner incident after The Gentlemen named it as a victim. Nvidia says it has no indication its own systems or networks were affected, and the group has neither published files nor identified the data it claims to hold, leaving the claim unsubstantiated. The Gentlemen is among the highest-volume groups of 2026 by leak-site count, and high volume plus unsubstantiated naming is a known pattern for pressure-building.\n\nContext on the counts, since they will be quoted at you. Qilin leads UK leak-site claims in 2026 at 73 published claims, ahead of The Gentlemen at 49, DragonForce at 26 and Akira at 15, on one tally. A separate H1 2026 analysis counts up to 37 British organisations, which means the two sources define 'UK victim' differently. Overall, Qilin has around 1,165 listings or 12.1% of all 2026 leak-site victims as at 11 November, with The Gentlemen at 1,084 and Akira at 439. Treat all of these as claim counts, not breach counts - Bitdefender itself notes it cannot independently verify them.\n\nConfidence and caveats. Confidence is low by design. The leak-site claims are corroborated only in the sense that multiple trackers logged the same posts; no victim statement confirms any UK claim in this entry. The Visa, Mastercard and JPMorgan statements are the one well-sourced element and are reported consistently across several outlets. Dates for the Halfords listing conflict between trackers. No link between the N0n financial-sector leak and the SitusAMC breach was established in any source, despite the two being adjacent in coverage - do not merge them. No primary leak-site content was examined in this run and no direct page fetch succeeded.","recommended_actions":["Do not brief anyone on these as confirmed breaches. Every UK item here is an unverified criminal claim, and one of the groups involved has a documented record of fabricated listings. Record them as monitoring items with named owners and a review date.","If you are a supplier to, customer of, or in the same group as William Cook Holdings or Boutinot: treat the claims as a prompt to check your own shared-access paths, shared file transfer, and any credentials either organisation holds for you.","William Cook Holdings specifically - if the payroll claim is accurate, the follow-on risk is payroll-diversion fraud against the employer and identity fraud against staff. Any organisation that processes payroll changes on the strength of an email should treat employee bank detail changes as requiring out-of-band verification, which is good practice regardless of this claim.","Identify today which of your suppliers hold your customer contact data - marketing platforms, benefits and loyalty programmes, mailing houses, CRM integrators - and record your notification obligation and communications position for each. The Visa/Mastercard/JPMorgan pattern is that you learn from a leak site and then cannot name the supplier.","Decide in advance what you will say when the breached party is a third party you cannot name. All three financial institutions here gave minimal, carefully scoped statements, and their customers still had to accept 'a third party' as the answer. Draft yours before you need it.","Monitor leak sites for your own organisation, your parent, your subsidiaries and your major suppliers, and route hits to a named owner rather than to a mailbox. A listing is often the first notification a UK organisation receives.","Treat any N0n listing as requiring independent verification before action, in either direction. The group has produced both fabricated claims and a substantive third-party financial-sector leak in the same month.","Use claim counts as trend data only. Qilin leads UK leak-site claims in 2026; the trackers disagree on totals because they define 'UK victim' differently, and none of the counts are confirmed breaches.","Do not link the N0n financial-sector leak to the SitusAMC breach. No source established a connection, and the two appear adjacent in coverage only."],"kql":[{"platform":"sentinel","table":"OfficeActivity","name":"Bulk exfiltration from file servers - the Aurora claim pattern","description":"Both UK Aurora claims describe large volumes taken from a single corporate file server. Detects a single account reading or downloading at a volume inconsistent with its baseline.","query":"let lookback = 45d;\nOfficeActivity\n| where TimeGenerated > ago(lookback)\n| where Operation has_any (\"FileDownloaded\", \"FileSyncDownloadedFull\", \"FileCopied\", \"FileAccessed\")\n| summarize Events = count(), Files = dcount(OfficeObjectId), Sites = dcount(Site_Url) by UserId, ClientIP, bin(TimeGenerated, 1h)\n| where Files > 500 or Events > 1000\n| order by Files desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Archive staging before exfiltration","description":"A 1.1 TB claim implies staging. Hunt for large archive creation on or adjacent to file servers, which is the step before transfer.","query":"let lookback = 45d;\nDeviceFileEvents\n| where Timestamp > ago(lookback)\n| where FileName endswith_cs \".7z\" or FileName endswith_cs \".rar\" or FileName endswith_cs \".zip\" or FileName endswith_cs \".tar.gz\"\n| where FolderPath has_any (\"\\\\Users\\\\Public\", \"\\\\Windows\\\\Temp\", \"\\\\ProgramData\", \"\\\\$Recycle\", \"/tmp/\", \"/var/tmp/\")\n    or InitiatingProcessFileName in~ (\"7z.exe\", \"rar.exe\", \"winrar.exe\", \"tar.exe\")\n| project Timestamp, DeviceName, InitiatingProcessAccountName, FileName, FolderPath, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"sentinel","table":"AuditLogs","name":"Employee bank detail and payroll change events","description":"The follow-on fraud path if the William Cook payroll claim is accurate. Every such change should have out-of-band verification; this surfaces the population to check.","query":"let lookback = 90d;\nAuditLogs\n| where TimeGenerated > ago(lookback)\n| where OperationName has_any (\"Update user\", \"Update bank\", \"Change payment\", \"Update payroll\", \"Update employee\")\n| extend Actor = tostring(InitiatedBy.user.userPrincipalName)\n| project TimeGenerated, Actor, OperationName, Result, TargetResources\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Supplier-breach themed phishing and extortion correspondence","description":"Detects follow-on social engineering referencing a third-party breach, including direct extortion contact, which is often how a UK organisation first learns it is listed.","query":"let lookback = 45d;\nEmailEvents\n| where Timestamp > ago(lookback)\n| where Subject has_any (\"data breach\", \"your data\", \"leak\", \"we have your\", \"published\", \"ransom\", \"negotiat\", \"deadline\", \"third party\", \"third-party\")\n| where isnotempty(SenderFromDomain)\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 5) by SenderFromDomain, SenderFromAddress\n| order by Messages desc"},{"platform":"sentinel","table":"SigninLogs","name":"Supplier and partner account access anomalies","description":"All six organisations in this entry were reportedly reached through suppliers or partners. Surfaces guest and partner identity activity that does not match their baseline.","query":"let lookback = 45d;\nSigninLogs\n| where TimeGenerated > ago(lookback)\n| where UserPrincipalName has \"#EXT#\" or UserType == \"Guest\"\n| summarize SignIns = count(), Apps = make_set(AppDisplayName, 10), Countries = make_set(tostring(LocationDetails.countryOrRegion), 10), IPs = dcount(IPAddress)\n    by UserPrincipalName\n| where IPs > 5 or array_length(Countries) > 2\n| order by SignIns desc"}],"iocs":[{"type":"ttp","value":"leak-site claim as the first notification of a breach","context":"The common feature of every item in this entry. For most UK organisations the leak-site listing arrives before any supplier notification, which makes leak-site monitoring an operational control rather than a research activity.","confidence":"high","source":"Analytic assessment"},{"type":"behaviour","value":"bulk exfiltration from a single corporate file server","context":"Pattern described in both UK Aurora claims: 1.1 TB from the William Cook Stanhope site file server, approximately 384 GB from Boutinot's corporate file server.","confidence":"low","source":"Ransomware.live / RedPacket Security leak-site logs"},{"type":"behaviour","value":"compromise of a shared third-party service provider to reach multiple large customers","context":"The route by which Visa, Mastercard and JPMorgan customer data was exposed, per all three companies. None named the provider.","confidence":"high","source":"Company statements via multiple outlets"},{"type":"behaviour","value":"unsubstantiated victim naming as extortion pressure","context":"The Gentlemen named Nvidia without publishing files or identifying the data. Nvidia reports no indication its own systems were affected and is investigating a possible third-party partner incident.","confidence":"medium","source":"The Register / SecurityWeek via cisoseries roundup"},{"type":"note","value":"RedPacket Security warns that listings attributed to N0N have included unverified or fabricated victim claims. The Halfords Group listing should be treated as unconfirmed, and the post dates conflict between trackers (9 November per RedPacket, 20 November per Ransomware.live).","context":"Provenance statement, not an indicator.","confidence":"medium","source":"RedPacket Security / Ransomware.live"},{"type":"note","value":"The same group, N0n, also produced the substantive Visa/Mastercard/JPMorgan third-party leak. The correct posture toward N0n listings is therefore case-by-case verification, not blanket dismissal or acceptance.","context":"Analytic statement, not an indicator.","confidence":"medium","source":"This run"},{"type":"note","value":"Cybernews notes the published financial-sector records may be test data and that origin and authenticity have not been independently verified.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"Cybernews via search summaries"},{"type":"note","value":"No source linked the N0n financial-sector leak to the SitusAMC breach, which appears adjacent in coverage only. Do not merge the two.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"},{"type":"note","value":"2026 UK leak-site claim counts (claims, not confirmed breaches): Qilin 73, The Gentlemen 49, DragonForce 26, Akira 15 on one tally; a separate H1 2026 analysis counts up to 37 British organisations, so the two define 'UK victim' differently. Overall 2026: Qilin approximately 1,165 listings (12.1% of all victims) as at 11 November, The Gentlemen 1,084, Akira 439.","context":"Context statistics, not indicators.","confidence":"medium","source":"ThreatWatch / Bitdefender Threat Debrief / ransomnews via search summaries"},{"type":"note","value":"No victim statement confirms any UK claim in this entry. No primary leak-site content was examined in this run and no direct page fetch succeeded. Audio Note UK Ltd (Osiris, 11 November) remains unconfirmed and outside this window.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"}],"references":["https://www.ransomware.live/id/V2lsbGlhbSBDb29rIEhvbGRpbmdzIExpbWl0ZWRAYXVyb3Jh","https://www.redpacketsecurity.com/aurora-ransomware-victim-boutinot-limited/","https://www.ransomware.live/id/SGFsZm9yZHMgR3JvdXAgcGxjQE4wbg","https://www.redpacketsecurity.com/n0n-ransomware-victim-halfords-group-plc/","https://www.pymnts.com/cybersecurity/2026/visa-mastercard-and-jpmorgan-customer-data-leaked/","https://cybernews.com/security/n0n-ransomware-leaks-alleged-mastercard-customers-data/","https://cisoseries.com/cybersecurity-news-november-20-2026/","https://www.bitdefender.com/en-us/blog/businessinsights/bitdefender-threat-debrief-november-2026","https://socradar.io/data-breach/audio-note-uk-osiris-ransomware-2026/"]},{"rank":10,"id":"TI-2026-11-21-010","title":"Deadline and Patch-Completeness Board as at 21 November 2026: Apache Axis, REDCap, LiteLLM and Synology KEV Deadlines Fall Today With No Vendor Fix at All for Axis - and phpAfterShell CVE-2026-126714 Is Still Not in KEV While Public PoC Availability Is Disputed","cve_ids":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"vendor":"Multiple (Apache, Vanderbilt, BerriAI, Synology, PHP)","affected_products":["Apache Axis CVE-2026-90436 (unsafe reflection) - KEV dateAdded 2026-11-18 per the catalogue; no vendor fix available at all","Vanderbilt REDCap CVE-2026-90817 (code injection) - KEV dateAdded 2026-11-18 per the catalogue","BerriAI LiteLLM CVE-2026-40217 (unprotected alternate channel) - KEV dateAdded 2026-11-18 per the catalogue","Synology DiskStation Manager CVE-2024-10441 (improper encoding or escaping of output) - KEV dateAdded 2026-11-18 per the catalogue","PHP - phpAfterShell CVE-2026-126714, session-file corruption to RCE in the default file-based session handler; fixed in 8.2.36, 8.3.37, 8.4.28, 8.5.13 and 8.6.0","PHP CVE-2026-129481 - listed by PHP as an INCOMPLETE FIX for CVE-2026-109619 (PHP2Shell), the confirmed initial-access leg of in-the-wild attacks on Check Point gateways","Shadowserver flagged CVE-2025-11141 as confirmed exploited on 19 November 2026"],"category":"vulnerability_bundle","cvss_v3":null,"severity":"high","exploitation_status":"public_poc_available","kev_listed":true,"kev_due_date":"2026-11-21","patch_available":"partial","first_reported":"2026-11-17","last_updated":"2026-11-21","confidence":"medium","summary":"The housekeeping entry, and it carries the governance finding this feed now considers its most important recurring theme.\n\nDeadlines falling today. Four KEV entries reach their remediation deadline on 21 November: Apache Axis CVE-2026-90436 (unsafe reflection), Vanderbilt REDCap CVE-2026-90817 (code injection), BerriAI LiteLLM CVE-2026-40217 (unprotected alternate channel) and Synology DiskStation Manager CVE-2024-10441 (improper encoding or escaping of output). A dating discrepancy is worth recording: SC World reported this group as added on 20 November, while the catalogue dates them 18 November, with deadlines of 21 November or 2 December depending on the entry. The catalogue date is the one to work from.\n\nThe one with no fix. Apache Axis CVE-2026-90436 has no vendor fix available at all. A KEV deadline against a vulnerability with no patch means the only available remediation is removal, isolation or replacement, and the deadline arriving today does not change that. Axis appears in UK estates mostly as an embedded dependency inside older Java integration middleware rather than as a product anyone chose, which means the hard part is finding it. Search your build artefacts and deployed WAR/EAR files for axis jars rather than looking in your software inventory.\n\nThe UK relevance of REDCap, which is easy to miss. REDCap is research data capture software, widely deployed across UK universities, NHS research units and clinical trial teams, and it holds research participant data including health data. It is also frequently operated by a research group rather than by central IT, which means it may not be in the patch pipeline at all and may not have an owner who reads KEV. If your institution does research, someone needs to ask the question today.\n\nThe patch-completeness finding, which is the real content of this entry. Three cases are now live simultaneously. PHP lists CVE-2026-129481 as an INCOMPLETE FIX for CVE-2026-109619 - PHP2Shell, already confirmed as the initial-access leg of in-the-wild attacks on Check Point gateways. Apache Roller's CVE-2026-129448 is the same bug as CVE-2026-82384, patched in September for 6.1.5 only and now confirmed exploited (rank 3). And Cisco Expressway X15.5.20 reportedly fixes CVE-2026-76466 while leaving PHP2Shell open (also rank 3). Add the Zyxel wrong-KEV-CVE case from earlier this month and that is four instances in three weeks where a correct remediation record describes an exposure that is still open. The operational consequence is specific and uncomfortable: an identifier-matching vulnerability scanner will agree with the wrong record, so neither your ticket nor your scanner can be trusted as evidence of closure on a reissued or incompletely fixed CVE. The only reliable check is the vendor's own release notes for the specific version you are running. This is worth raising at whatever forum owns vulnerability management in your organisation, because it is a process finding rather than a technical one.\n\nphpAfterShell status. CVE-2026-126714 corrupts PHP session files to achieve remote code execution through the default file-based session handler, discovered by Depthfirst. As at 19-20 November, neither the PHP maintainers nor the researchers had reported attacks, and it is not in CISA's KEV catalogue. PoC availability is genuinely disputed: Italy's national CSIRT and the Ubuntu security tracker both state that proof-of-concept code is publicly available, while Wiz reports no observed exploitation and notes that six GitHub repositories merely naming the CVE do not prove a working exploit exists. Exploitation is not automatic - it requires file-based sessions, which is the PHP default, plus an exploitable gadget chain in the application's own code, which is not. The fix is PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13 or 8.6.0; where patching is delayed, setting session.upload_progress.enabled to 0 in php.ini closes the primary attack path and is a configuration change you can make this afternoon.\n\nOne additional exploitation signal from the window. Shadowserver flagged CVE-2025-11141 as confirmed exploited on 19 November, alongside a batch of older CVEs from 2017 through 2023 re-flagged on the same day. Old CVEs being actively re-exploited is the ordinary background condition of the internet and a useful reminder that this report's newest entries are not the only thing hitting your perimeter.\n\nConfidence and caveats. Confidence is medium. High on the four KEV entries and their catalogue dateAdded of 18 November, the absence of any Apache Axis vendor fix, the PHP fixed versions, the php.ini mitigation, the requirement for file-based sessions plus a gadget chain, phpAfterShell's absence from KEV, and the PHP INCOMPLETE FIX relationship between CVE-2026-129481 and CVE-2026-109619. Disputed and recorded as such: public PoC availability for phpAfterShell. Conflicting: the KEV dateAdded for this group between SC World (20 November) and the catalogue (18 November), and the due dates between 21 November and 2 December by entry. CISA's catalogue pages could not be fetched directly in this run; the KEV listing used here came from an aggregated feed mirror. Verify your own deadline dates against the catalogue before using them in a compliance record.","recommended_actions":["Apache Axis CVE-2026-90436 - accept that there is no patch and decide today between removal, network isolation and replacement. Find it by searching build artefacts and deployed WAR/EAR files for axis jars, not by looking in your software inventory; it is almost always an embedded dependency in older Java middleware rather than a product anyone installed.","REDCap CVE-2026-90817 - ask your research computing function, research governance lead or individual research groups today whether they run REDCap. It holds participant health data and is frequently operated outside central IT, so it may have no owner in your patch pipeline.","BerriAI LiteLLM CVE-2026-40217 and Synology DSM CVE-2024-10441 - confirm your versions and patch. LiteLLM in particular tends to appear in AI proof-of-concept deployments that were never formally onboarded, so check with whoever is experimenting rather than only with the asset database.","Raise patch completeness as a process item with whoever owns vulnerability management. Four cases in three weeks - PHP CVE-2026-129481 as an incomplete fix for PHP2Shell, Apache Roller CVE-2026-129448 reissuing CVE-2026-82384, Cisco X15.5.20 leaving PHP2Shell open, and the Zyxel wrong-KEV-CVE case - mean a closed ticket and a clean scanner result are no longer sufficient evidence of closure.","For any CVE marked as an incomplete fix or a reissued identifier, verify against the vendor's release notes for the exact version you run. Do not accept an identifier-matching scanner result, because it will agree with the wrong record.","Re-open any PHP remediation closed in October against CVE-2026-109619 and check it against CVE-2026-129481. PHP2Shell is a confirmed in-the-wild initial-access vector on Check Point gateways, so this is the highest-consequence of the incomplete-fix cases.","phpAfterShell CVE-2026-126714 - patch to PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13 or 8.6.0. If the change window is further out, set session.upload_progress.enabled to 0 in php.ini today; it closes the primary attack path and takes minutes.","Check whether your PHP applications use file-based sessions, which is the default. Moving sessions to Redis or another non-file handler removes the precondition for this vulnerability class entirely and is worth considering as a standing hardening decision rather than a one-off fix.","Verify your own KEV deadline dates against CISA's catalogue rather than against press coverage. Secondary sources disagree on both the dateAdded and the due dates for this group, and a compliance record built on a press date is wrong.","Do not let the newest CVEs crowd out the old ones. Shadowserver re-flagged CVE-2025-11141 and a batch of 2017-2023 CVEs as actively exploited on 19 November; those are hitting your perimeter alongside everything at ranks 1 through 3."],"kql":[{"platform":"sentinel","table":"DeviceTvmSoftwareVulnerabilities","name":"KEV deadline board - exposure for the 21 November deadline group","description":"Quantifies remaining exposure for the four CVEs whose deadline falls today, plus the phpAfterShell and PHP2Shell identifiers.","query":"let kevToday = dynamic([\"CVE-2026-90436\", \"CVE-2026-90817\", \"CVE-2026-40217\", \"CVE-2024-10441\"]);\nlet phpSet = dynamic([\"CVE-2026-126714\", \"CVE-2026-109619\", \"CVE-2026-129481\"]);\nDeviceTvmSoftwareVulnerabilities\n| where CveId in (kevToday) or CveId in (phpSet)\n| extend Group = iff(CveId in (kevToday), \"KEV deadline 21 Nov\", \"PHP patch completeness\")\n| summarize Devices = dcount(DeviceId), DeviceList = make_set(DeviceName, 25) by Group, CveId, SoftwareVendor, SoftwareName, VulnerabilitySeverityLevel\n| order by Group asc, Devices desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Locate embedded Apache Axis jars - the no-patch CVE","description":"Apache Axis has no vendor fix, so finding it is the whole task. It is almost always an embedded dependency rather than an installed product, which means the file system is the inventory.","query":"let lookback = 30d;\nDeviceFileEvents\n| where Timestamp > ago(lookback)\n| where FileName matches regex @\"(?i)^axis(2)?[-_].*\\.jar$\" or FileName matches regex @\"(?i)^axis\\.jar$\"\n| summarize FirstSeen = min(Timestamp), LastSeen = max(Timestamp), Paths = make_set(FolderPath, 10) by DeviceName, FileName\n| order by DeviceName asc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"PHP session handler abuse - phpAfterShell exploitation attempt","description":"The exploitation path corrupts session files to achieve code execution. Hunt for the PHP process spawning child processes, and for writes to session storage by anything other than PHP.","query":"let lookback = 45d;\nDeviceProcessEvents\n| where Timestamp > ago(lookback)\n| where InitiatingProcessFileName has_any (\"php\", \"php-fpm\", \"php-cgi\")\n| where FileName in~ (\"sh\", \"bash\", \"cmd.exe\", \"powershell.exe\", \"python\", \"python3\", \"perl\", \"curl\", \"wget\", \"nc\")\n| project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine, FolderPath\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Writes to PHP session storage by non-PHP processes","description":"The precondition for phpAfterShell is file-based sessions. Anything other than PHP writing into the session directory is anomalous.","query":"let lookback = 45d;\nDeviceFileEvents\n| where Timestamp > ago(lookback)\n| where FolderPath has_any (\"/var/lib/php/sessions\", \"/tmp/sess_\", \"/var/lib/php/session\", \"\\\\Temp\\\\sess_\")\n    or FileName startswith \"sess_\"\n| where InitiatingProcessFileName !has \"php\"\n| project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, FileName, FolderPath, ActionType\n| order by Timestamp desc"},{"platform":"sentinel","table":"W3CIISLog","name":"REDCap and research platform anomalous access","description":"REDCap holds research participant health data and is often run outside central IT. Surfaces bulk access and injection-shaped requests against research data capture paths.","query":"let lookback = 60d;\nW3CIISLog\n| where TimeGenerated > ago(lookback)\n| where csUriStem has_any (\"/redcap\", \"/api/\", \"/DataEntry/\", \"/DataExport/\", \"/surveys/\")\n| where csUriQuery has_any (\"%3Cscript\", \"';\", \"--\", \"UNION\", \"eval(\", \"system(\", \"passthru\", \"base64_decode\")\n    or csUriStem has \"DataExport\"\n| summarize Requests = count(), Paths = make_set(csUriStem, 10), Statuses = make_set(scStatus, 5) by cIP, csUserAgent, bin(TimeGenerated, 1h)\n| order by Requests desc"},{"platform":"sentinel","table":"DeviceTvmSoftwareInventory","name":"PHP version inventory against the phpAfterShell fixed releases","description":"Establishes which PHP installations remain below the fixed versions 8.2.36, 8.3.37, 8.4.28, 8.5.13 and 8.6.0.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has \"php\"\n| summarize Devices = dcount(DeviceId), DeviceList = make_set(DeviceName, 25) by SoftwareName, SoftwareVersion\n| order by SoftwareVersion asc"}],"iocs":[{"type":"note","value":"KEV deadlines falling 21 November 2026: Apache Axis CVE-2026-90436, Vanderbilt REDCap CVE-2026-90817, BerriAI LiteLLM CVE-2026-40217, Synology DSM CVE-2024-10441. The catalogue dates all four as added 18 November; SC World reported 20 November. Use the catalogue date.","context":"Deadline fact, not an indicator.","confidence":"medium","source":"CISA KEV listing via aggregated feed mirror; SC World"},{"type":"note","value":"Apache Axis CVE-2026-90436 has no vendor fix available at all. The only remediations are removal, isolation or replacement, and the deadline arriving does not change that.","context":"Remediation fact, not an indicator.","confidence":"high","source":"Multiple secondary sources, carried forward in this feed"},{"type":"note","value":"PHP lists CVE-2026-129481 as an INCOMPLETE FIX for CVE-2026-109619 (PHP2Shell), the confirmed initial-access leg of in-the-wild attacks on Check Point gateways. Any October remediation record against the original identifier is affirmatively wrong, and an identifier-matching scanner will agree with it.","context":"Governance finding, not an indicator.","confidence":"high","source":"PHP advisories via secondary coverage, carried forward in this feed"},{"type":"behaviour","value":"PHP process spawning a shell or interpreter","context":"The post-exploitation signature for phpAfterShell CVE-2026-126714 and for PHP RCE generally.","confidence":"high","source":"Analytic assessment"},{"type":"filepath","value":"/var/lib/php/sessions/sess_*","context":"Default file-based PHP session storage. phpAfterShell requires file-based sessions, which is the PHP default; writes here by a non-PHP process are anomalous.","confidence":"high","source":"Depthfirst / Wiz analyses via secondary coverage"},{"type":"filename","value":"axis.jar / axis2-*.jar","context":"Apache Axis embedded dependency. Finding it is the remediation task because there is no vendor fix and it rarely appears in a software inventory.","confidence":"high","source":"Analytic assessment"},{"type":"note","value":"phpAfterShell mitigation where patching is delayed: set session.upload_progress.enabled to 0 in php.ini. Per Wiz this closes the primary attack path. Fixed versions: PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, 8.6.0.","context":"Remediation fact, not an indicator.","confidence":"high","source":"Wiz / SOCRadar via search summaries"},{"type":"note","value":"phpAfterShell PoC availability is disputed: Italy's national CSIRT and the Ubuntu security tracker state public PoC code exists; Wiz reports no observed exploitation and notes that six GitHub repositories naming the CVE do not prove a working exploit. Not in CISA KEV as at 20 November.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"Precursor Security / Wiz / Ostorlab / SOCRadar via search summaries"},{"type":"note","value":"Four patch-completeness cases are live simultaneously: PHP CVE-2026-129481 (incomplete fix for PHP2Shell), Apache Roller CVE-2026-129448 (reissue of CVE-2026-82384, now exploited), Cisco Expressway X15.5.20 (fixes CVE-2026-76466 but reportedly not PHP2Shell) and the earlier Zyxel wrong-KEV-CVE case. Neither a closed ticket nor a clean identifier-matching scan is evidence of closure.","context":"Governance finding, not an indicator.","confidence":"high","source":"This run, consolidating across entries and prior runs"},{"type":"note","value":"Shadowserver flagged CVE-2025-11141 as confirmed exploited on 19 November 2026, alongside a batch of 2017-2023 CVEs re-flagged the same day.","context":"Exploitation signal, not an indicator of a specific host.","confidence":"medium","source":"CIRCL vulnerability-lookup -2026-102764"],"confidence":"medium"},{"value":"BEARBONES","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"medium"},{"value":"LAZYBONES","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"medium"},{"value":"SLIMSAVAGE","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"medium"},{"value":"CAGEMATCH","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"medium"},{"value":"Able2Shell","related_entry":"TI-2026-11-21-005","related_cves":[],"confidence":"medium"},{"value":"ARTEX","related_entry":"TI-2026-11-21-008","related_cves":[],"confidence":"low"}],"note":[{"value":"Google/Mandiant file hashes and YARA rule contents were NOT retrieved in this run - all direct page fetches failed with DNS resolution errors. Pull the full indicator set from the Mandiant ARMORY CASTLE publication before relying on this entry for hunting.","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"high"},{"value":"Broadcom's VMSA-2026-0009 advisory reportedly does not mention in-the-wild exploitation, so a vendor-advisory-only review of this CVE would understate it. The exploitation evidence is Mandiant's and CISA's.","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"medium"},{"value":"Scope is still expanding: the estimate moved from approximately 250,000 to approximately 265,000 inside this window and TfL states the investigation is incomplete and the figure may rise further.","related_entry":"TI-2026-11-21-002","related_cves":[],"confidence":"high"},{"value":"The exposed field list differs between outlets. Narrow version: names, phone numbers, email addresses. Broad version: names, email and home addresses, phone numbers, dates of birth, security questions and answers. TfL consistently states passwords, bank and payment details and journey data were not compromised.","related_entry":"TI-2026-11-21-002","related_cves":[],"confidence":"medium"},{"value":"Entry point, actor identity and portal restoration date are all undisclosed as at 21 November 2026. No TfL or ICO primary page was retrieved in this run.","related_entry":"TI-2026-11-21-002","related_cves":[],"confidence":"high"},{"value":"CVE-2026-129448 is the same underlying bug as CVE-2026-82384, which was patched in September for Roller 6.1.5 only. Hosts remediated in September against the old identifier may still be exposed, and an identifier-matching scanner will agree with the September record. Fourth incomplete-fix or reissued-identifier case in this feed in three weeks.","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"high"},{"value":"Reporting indicates Cisco Expressway X15.5.20 resolves CVE-2026-76466 but does not close PHP2Shell; plan a further upgrade to 15.5.21 or later rather than closing the ticket at X15.5.20.","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"medium"},{"value":"Sources conflict on the Apache Roller fixed version (6.1.5 vs 6.1.6 vs 6.1.7) and at least one source states CVE-2026-129448 is not in CISA KEV, contradicted by the 20 November catalogue listing. SAP NetWeaver CVE-2025-42884 details are secondary-source only. CISA's catalogue pages could not be fetched in this run.","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"high"},{"value":"One report describes an attacker using public exploit code for CVE-2026-76466 to obtain root on four clustered gateways at a Russian organisation. Single-source and unverified.","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"low"},{"value":"New in this window: Pen Test Partners independently verified and expanded the Omega Solutions finding; RDM has released initial security updates; the NCSC has published explicit operator guidance (apply updates, change default credentials, keep devices off the public internet).","related_entry":"TI-2026-11-21-004","related_cves":[],"confidence":"medium"},{"value":"RDM disputes the severity of the findings and reports no evidence of malicious activity. The government ran a three-week national disconnection programme. Both positions are on the record and are recorded here unresolved; the remediation advice is identical under either reading.","related_entry":"TI-2026-11-21-004","related_cves":[],"confidence":"high"},{"value":"No CVE identifier exists for this flaw, so vulnerability scanners keyed on CVE identifiers will not report it and a CVE-based remediation record cannot evidence that it is closed.","related_entry":"TI-2026-11-21-004","related_cves":[],"confidence":"high"},{"value":"Device counts vary between 'thousands of controllers' and 'tens of thousands of refrigeration units'. These are different measures of the same estate and should not be combined. The discovering consultancy appears as both 'Omega Solutions' and 'Omega Systems' across outlets. No supermarket has been named. The total number of exposed controllers is unknown.","related_entry":"TI-2026-11-21-004","related_cves":[],"confidence":"high"},{"value":"No NCSC, Defra, FSA or RDM primary page was retrieved in this run; all direct page fetches failed with DNS resolution errors. Verify the vendor update availability and the NCSC guidance wording against primary sources before external communication.","related_entry":"TI-2026-11-21-004","related_cves":[],"confidence":"high"},{"value":"N-able states these are two separate incidents and that no evidence of customer data compromise has been found in the Mail Assure/SpamExperts intrusion.","related_entry":"TI-2026-11-21-005","related_cves":[],"confidence":"high"},{"value":"Credential theft in the Mail Assure/SpamExperts intrusion is reported by a single outlet and is not confirmed by N-able. Rotate anyway - rotation is cheap and does not require the claim to be verified.","related_entry":"TI-2026-11-21-005","related_cves":[],"confidence":"low"},{"value":"Some vendor blogs cite CVE-2026-125883 for the N-central flaws; Huntress-sourced material states no CVE identifiers have been assigned. Treat that identifier as unverified and do not use it as the basis of a remediation record.","related_entry":"TI-2026-11-21-005","related_cves":[],"confidence":"medium"},{"value":"Restoration state conflict: this feed's 20 November entry recorded N-able shipping HF3 (removing the Legacy API and patching 17 further zero-days), while sources in this window describe hosted N-central environments still offline with MSPs awaiting a hotfix. Unresolved - confirm your own instance's state with your MSP.","related_entry":"TI-2026-11-21-005","related_cves":[],"confidence":"medium"},{"value":"A ChannelDive article describing an 'N-able RMM platform breach' refers to a July release date and appears to be a separate, older matter. Do not merge it into this incident.","related_entry":"TI-2026-11-21-005","related_cves":[],"confidence":"medium"},{"value":"FCA GC26/9 and PRA CP17/26 published jointly on 19 November 2026; consultation responses due 26 February 2027.","related_entry":"TI-2026-11-21-006","related_cves":[],"confidence":"high"},{"value":"The guidance introduces no new rules; the regulators will use it when supervising and enforcing compliance with existing rules. This makes it operative on finalisation with no implementation period.","related_entry":"TI-2026-11-21-006","related_cves":[],"confidence":"high"},{"value":"The guidance aligns with recognised cyber frameworks including the gainst any source in this run and appears in none of the retrieved material. Treat it as unverified and use F5 advisories K000163925-K000163931 and K000164058 as the authoritative mapping.","related_entry":"TI-2026-11-21-007","related_cves":[],"confidence":"high"},{"value":"'NGINX2Root' is not F5's or nginx.org's terminology; some coverage calls the HTTP/2 pair 'nginx2shell'. Expect naming confusion in change tickets and vulnerability reports.","related_entry":"TI-2026-11-21-007","related_cves":[],"confidence":"high"},{"value":"NHS England Digital issued its own cyber alert for the F5 NGINX vulnerabilities dated 19 November 2026; the alert body was not retrieved in this run or the previous one.","related_entry":"TI-2026-11-21-007","related_cves":[],"confidence":"medium"},{"value":"Data impact is disputed: SecurityWeek reports the Commission has no evidence of a data breach; Infosecurity Magazine, citing Politico, reports the attack may have breached employee personal information. Both recorded, unresolved.","related_entry":"TI-2026-11-21-008","related_cves":[],"confidence":"medium"},{"value":"No attribution to a known group has been made and the spokesperson said he was not aware of any ransom demand. The investigation remains open.","related_entry":"TI-2026-11-21-008","related_cves":[],"confidence":"high"},{"value":"One source dates the confirmation to 26 October rather than 19 November, conflicting with the majority account. No primary Commission or CERT-EU statement was retrieved in this run.","related_entry":"TI-2026-11-21-008","related_cves":[],"confidence":"high"},{"value":"Included for UK relevance rather than UK jurisdiction: it is the first public confirmation by a major European government body of an AI-assisted attack taking internal systems down, three weeks after the NCSC assessed AI-powered malware in CNI ransomware attacks as highly likely by 2028.","related_entry":"TI-2026-11-21-008","related_cves":[],"confidence":"high"},{"value":"RedPacket Security 7, Synology DSM CVE-2024-10441. The catalogue dates all four as added 18 November; SC World reported 20 November. Use the catalogue date.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"medium"},{"value":"Apache Axis CVE-2026-90436 has no vendor fix available at all. The only remediations are removal, isolation or replacement, and the deadline arriving does not change that.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"high"},{"value":"PHP lists CVE-2026-129481 as an INCOMPLETE FIX for CVE-2026-109619 (PHP2Shell), the confirmed initial-access leg of in-the-wild attacks on Check Point gateways. Any October remediation record against the original identifier is affirmatively wrong, and an identifier-matching scanner will agree with it.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"high"},{"value":"phpAfterShell mitigation where patching is delayed: set session.upload_progress.enabled to 0 in php.ini. Per Wiz this closes the primary attack path. Fixed versions: PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, 8.6.0.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"high"},{"value":"phpAfterShell PoC availability is disputed: Italy's national CSIRT and the Ubuntu security tracker state public PoC code exists; Wiz reports no observed exploitation and notes that six GitHub repositories naming the CVE do not prove a working exploit. Not in CISA KEV as at 20 November.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"medium"},{"value":"Four patch-completeness cases are live simultaneously: PHP CVE-2026-129481 (incomplete fix for PHP2Shell), Apache Roller CVE-2026-129448 (reissue of CVE-2026-82384, now exploited), Cisco Expressway X15.5.20 (fixes CVE-2026-76466 but reportedly not PHP2Shell) and the earlier Zyxel wrong-KEV-CVE case. Neither a closed ticket nor a clean identifier-matching scan is evidence of closure.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"high"},{"value":"Shadowserver flagged CVE-2025-11141 as confirmed exploited on 19 November 2026, alongside a batch of 2017-2023 CVEs re-flagged the same day.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"medium"},{"value":"CISA's catalogue pages could not be fetched in this run; the KEV listing used here came from an aggregated feed mirror. Verify deadline dates against the catalogue before using them in a compliance record.","related_entry":"TI-2026-11-21-010","related_cves":["CVE-2026-90436","CVE-2026-90817","CVE-2026-40217","CVE-2024-10441","CVE-2026-126714","CVE-2026-109619","CVE-2026-129481","CVE-2025-11141"],"confidence":"high"}],"port":[{"value":"443","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"high"},{"value":"2012","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"high"},{"value":"5480","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"high"},{"value":"9080","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"high"},{"value":"4372/tcp","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"high"}],"service_name":[{"value":"cm_server (Cisco Expressway cluster database service)","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"medium"}],"ttp":[{"value":"nmap reconnaissance preceding exploitation","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"high"},{"value":"lateral movement to internal Linux appliances lacking EDR coverage","related_entry":"TI-2026-11-21-001","related_cves":["CVE-2026-123890","CVE-2026-59309","CVE-2026-102764"],"confidence":"medium"},{"value":"abuse of a legitimate application workflow at scale rather than malware","related_entry":"TI-2026-11-21-002","related_cves":[],"confidence":"high"},{"value":"unauthenticated root OS command execution on clustered Expressway devices","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"high"},{"value":"unauthorised change of refrigeration setpoints, defrost cycles or alarm thresholds","related_entry":"TI-2026-11-21-004","related_cves":[],"confidence":"medium"},{"value":"abuse of a legitimate RMM agent for script execution and software deployment on managed endpoints","related_entry":"TI-2026-11-21-005","related_cves":[],"confidence":"high"},{"value":"AI-assisted vulnerability discovery and reconnaissance acceleration","related_entry":"TI-2026-11-21-008","related_cves":[],"confidence":"medium"},{"value":"leak-site claim as the first notification of a breach","related_entry":"TI-2026-11-21-009","related_cves":[],"confidence":"high"}],"uri_path":[{"value":"/roller-services/xmlrpc","related_entry":"TI-2026-11-21-003","related_cves":["CVE-2026-129448","CVE-2026-82384","CVE-2026-76466","CVE-2025-42884"],"confidence":"high"}]},"summary_statistics":{"total_entries":10,"actively_exploited":5,"public_poc_available":2,"exploitation_reported_unconfirmed":1,"no_known_exploitation":2,"kev_listed":3,"no_patch_available":4,"partial_patch_available":5,"total_cves_referenced":15,"cves_referenced":["CVE-2024-10441","CVE-2025-11141","CVE-2025-42884","CVE-2026-102764","CVE-2026-109619","CVE-2026-123890","CVE-2026-126714","CVE-2026-129448","CVE-2026-129481","CVE-2026-40217","CVE-2026-59309","CVE-2026-76466","CVE-2026-82384","CVE-2026-90436","CVE-2026-90817"],"total_kql_queries":49,"total_iocs":98,"kev_deadlines_passed_or_due":["2026-11-21","2026-11-23","2026-12-02"],"new_entries_this_run":6,"carry_over_entries":4,"uk_government_entries":4,"uk_corporate_entries":2,"corrections_this_run":3,"highest_priority_action":"Six things, and the first two are the only ones that cannot wait for Monday. (1) TREAT VCENTER AS A COMPROMISE HUNT, NOT A PATCH. CVE-2026-123890 was exploited as a zero-day from early September until Broadcom shipped a fix on 19 November, by ARMORY CASTLE (formerly UNC5221), and CISA gave it a three-day KEV deadline of 23 November. Patching closes the door on an actor who may have been inside for ten weeks; it does not evict them. Enumerate every vCenter SSO administrator account against your change records, look for access to or copies of /storage/db/vmware-vmdir/data.mdb, and decide this week whether to rotate SAML Security Token Service signing material - because an attacker holding it can mint valid assertions for everything that trusts your identity provider and no password reset revokes that. Scope the hunt to vCenter, ESXi and the adjacent Linux appliances, because the reported intrusion reached vCenter through appliances with no EDR coverage. If you are on the 7.0 branch, check Broadcom's matrix directly: one report states no public patch exists for that end-of-general-support line, which makes this an isolation decision rather than a patching one. NHS organisations: CC-4899 is already in your queue, dated 19 November. (2) IF YOU RUN APACHE ROLLER, DO NOT TRUST THE MITIGATION YOU PROBABLY APPLIED. Disabling XML-RPC in the Roller admin interface does NOT mitigate CVE-2026-129448, because affected versions deserialise the request before checking whether the feature is enabled. Upgrade to 6.1.6 or later, block POST requests to /roller-services/xmlrpc at the proxy, and specifically re-check anything you patched in September under CVE-2026-82384 - that release fixed 6.1.5 only and the same bug is now confirmed exploited. For Cisco Expressway, block TCP 4372 at the boundary today: the Erlang cookie is compiled into the software and identical on every install, so port reachability is the entire exposure. (3) BLACKLIST THE SCTP KERNEL MODULE ON YOUR WEB SERVERS. It takes five minutes and it removes the escalation stage of the NGINX2Root chain, which has no CVE and no upstream patch. While you are there, understand that this vulnerability class is invisible in access logs - the HTTP/2 control frames it uses are not logged as requests - so 'we checked the logs and saw nothing' is not an answer. The detection is processes spawned by the nginx worker user. Censys counts roughly 9 million affected services with HTTP/2 enabled. (4) ASK YOUR MSP, IN WRITING, WHETHER THEY RUN N-ABLE N-CENTRAL OR MAIL ASSURE, AND WHAT STATE IT IS IN. A researcher published 33 working exploits against N-central, N-able took hosted platforms offline worldwide and told on-premises customers to shut servers down, and separately confirmed that the Mail Assure and SpamExperts outage - initially blamed on 'platform configuration' for three days - was a cyberattack. If your email security ran through Mail Assure between 16 and 20 November, record a forensic coverage gap for those days: mail flowed while logging, quarantine and mailbox sync were offline, so an absence of alerts is not an absence of events. The durable question underneath this is the one worth answering properly: who can reach your endpoints with SYSTEM privilege, through what tool, and what happens to your security posture when that tool is switched off? (5) ASK YOUR REFRIGERATION AND BUILDING CONTRACTORS, IN WRITING, WHETHER ANY CONTROLLER THEY INSTALLED IS REACHABLE FROM THE INTERNET. RDM has now shipped initial security updates and the NCSC's guidance is explicit: apply them, change default credentials, keep the devices off the public internet. The government programme covered the major grocers. Convenience retail, wholesale, hospitality, catering, pharmacy and vaccine cold chain and food manufacturing were not covered, and most of them cannot answer this from their own records because a contractor commissioned the equipment and it never entered the IT asset inventory. Scan your own external address space rather than querying a database that was never going to contain the answer, and extend the same question to HVAC, CCTV, door entry and energy metering. (6) RAISE PATCH COMPLETENESS AT WHATEVER FORUM OWNS VULNERABILITY MANAGEMENT. Four cases are live at once: PHP lists CVE-2026-129481 as an INCOMPLETE FIX for PHP2Shell CVE-2026-109619, which is confirmed in-the-wild initial access on Check Point gateways; Apache Roller's new CVE is a reissue of a September fix that only covered 6.1.5; Cisco X15.5.20 reportedly closes CVE-2026-76466 but not PHP2Shell; and Zyxel published the wrong KEV CVE earlier this month. The consequence is not technical, it is evidential: an identifier-matching scanner agrees with a wrong remediation record, so neither your ticket nor your scan proves a bug is closed. Only the vendor's release notes for the exact version you run do that. And today's KEV deadlines - Apache Axis, REDCap, LiteLLM, Synology - include one with no vendor fix at all, so for Axis the decision is removal, isolation or replacement, and the search is in your build artefacts rather than your software inventory. If your institution does research, ask someone today whether a research group runs REDCap: it holds participant health data and it is usually outside central IT's patch pipeline."}}</script>

  /* ---------- dom helpers (textContent only - no HTML injection) ---------- */
  function el(tag, cls, text){
    var n = document.createElement(tag);

    return n;
  }

    d.appendChild(dt); d.appendChild(dd); dl.appendChild(d); return d;
  }
  function sec(title){
    var s = el("section","sec"); s.appendChild(el("h3", null, title)); return s;
  }
  function fmtDate(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var day = String(d.getUTCDate()).padStart(2,"0");
    var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    var out = day + " " + mon + " " + d.getUTCFullYear();
    if (String(iso).indexOf("T") > -1){
      out += " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0") + "Z";
    }
    return out;
  }
  function label(s){
    if (!s) return "—";
    return String(s).replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
  }

  /* ---------- minimal KQL highlighter (safe: builds text nodes only) ---------- */
  var KQL_KW = ("let|where|project|summarize|extend|sort|order|by|join|union|take|limit|distinct|"
    + "count|dcount|countif|sum|make_set|make_list|min|max|any|avg|bin|ago|now|datetime|dynamic|"
    + "todouble|tostring|toint|tolong|strcat|strlen|extract|extract_all|parse_json|coalesce|"
    + "set_intersection|isnotempty|isempty|has|has_any|has_all|has_cs|contains|startswith|"
    + "endswith|in|and|or|not|asc|desc|on|datetime_part|dayofweek|column_ifexists|"
    + "ipv4_is_in_any_range|iff|case|print|top").split("|");
  var KQL_RE = new RegExp("(//[^\\n]*)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*')|\\b("
    + KQL_KW.join("|") + ")\\b", "g");
  function highlight(code){
    var frag = document.createDocumentFragment(), last = 0, m;
    KQL_RE.lastIndex = 0;
    while ((m = KQL_RE.exec(code)) !== null){
      if (m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
      var span = el("span", m[1] ? "c" : (m[2] ? "s" : "k"), m[0]);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
    return frag;
  }

  function copyBtn(getText, labelText){
    var b = el("button","copy", labelText || "Copy");
    b.type = "button";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = getText();
      function done(){
        var old = b.textContent;
        b.textContent = "Copied"; b.classList.add("ok");
        setTimeout(function(){ b.textContent = old; b.classList.remove("ok"); }, 1400);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt, done); });
      } else { fallback(txt, done); }
    });
    return b;
  }
  function fallback(txt, done){
    var ta = el("textarea"); ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* clipboard unavailable */ }
    document.body.removeChild(ta);
