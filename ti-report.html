<!doctype html>
<html lang="en" data-palette="#FF5A1F,#FF8C1A,#9A958C">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat Intelligence Brief</title>
<meta name="description" content="Daily threat intelligence brief: ranked vulnerabilities with analyst summaries, KQL hunting queries and IOCs.">
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --raised:#1C1C1A;
    --border:#2E2E2B;
    --border-strong:#403F3A;
    --ink:#F4F0E6;
    --ink-dim:#C9C4B8;
    --muted:#9A958C;
    --accent:#FF6A1A;
    --accent-hot:#FF5A1F;
    --accent-soft:rgba(255,106,26,.12);
    --accent-line:rgba(255,106,26,.32);
    --bar:rgba(255,106,26,.5);
    --radius:4px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- masthead ---------- */
  header.mast{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#121211 0%,var(--bg) 100%)}
  .mast-in{max-width:var(--maxw);margin:0 auto;padding:28px 16px 24px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{width:30px;height:30px;flex:none}
  .brand-txt h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .brand-txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .stamp{display:flex;flex-wrap:wrap;gap:22px}
  .stamp div{min-width:0}
  .stamp dt{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .stamp dd{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap}
  .stamp dd b{color:var(--accent);font-weight:600}

  /* ---------- priority banner ---------- */
  .alert{margin:22px 0 0;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-left:3px solid var(--accent-hot);border-radius:var(--radius);padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start}
  .alert svg{flex:none;margin-top:2px}
  .alert .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
    font-weight:650;margin:0 0 3px}
  .alert p{margin:0;font-size:14px;color:var(--ink)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:var(--radius);margin:22px 0 0;overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .tile{background:var(--surface);padding:14px 16px 13px}
  .tile .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;display:block}
  .tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
  .tile.hot .n{color:var(--accent-hot)}
  .tile.warn .n{color:var(--accent)}

  /* ---------- posture bar ---------- */
  .posture{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 14px}
  .posture h2{margin:0 0 11px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .pbar{display:flex;gap:2px;height:12px;border-radius:2px;overflow:hidden;background:var(--bg)}
  .pseg{min-width:3px}
  .pseg.s-exploited{background:var(--accent-hot)}
  .pseg.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .pseg.s-none{background:var(--muted)}
  .plegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px}
  .plegend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-dim)}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none}
  .swatch.s-exploited{background:var(--accent-hot)}
  .swatch.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .swatch.s-none{background:var(--muted)}
  .plegend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 0;
    padding-bottom:18px;border-bottom:1px solid var(--border)}
  .search{position:relative;flex:1 1 230px;min-width:0}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:var(--radius);padding:9px 11px 9px 34px;font-size:14px;font-family:var(--sans)}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);
    border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
    transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
  .chip:hover{border-color:var(--border-strong);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A;font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{background:transparent;border:1px solid var(--border);color:var(--ink-dim);border-radius:var(--radius);
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

  /* ---------- entry cards ---------- */
  .entries{margin:0;padding:0;list-style:none}
  .card{border-bottom:1px solid var(--border)}
  .card.is-open{background:var(--surface)}
  .chead{display:flex;gap:16px;padding:20px 4px;cursor:pointer;align-items:flex-start;
    width:100%;background:none;border:0;text-align:left;font-family:inherit;color:inherit}
  .chead:hover .ctitle{color:var(--accent)}
  .chead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{flex:none;width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;
    font-family:var(--mono);font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
    background:var(--raised);border:1px solid var(--border);color:var(--muted)}
  .card[data-status="exploited_in_the_wild"] .rank{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .cbody{flex:1;min-width:0}
  .ctitle{margin:0;font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;
    transition:color .12s}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
  .teaser{margin:10px 0 0;font-size:14px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.is-open .teaser{display:none}
  .caret{flex:none;color:var(--muted);transition:transform .15s;margin-top:7px}
  .card.is-open .caret{transform:rotate(90deg);color:var(--accent)}

  /* pills: status differentiated by WEIGHT + always a text label, never hue alone */
  .pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
    padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;
    align-items:center;gap:5px;line-height:1.5}
  .pill.st-exploited{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.st-attempts{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.st-none{background:transparent;border-color:var(--border-strong);color:var(--muted)}
  .pill.kev{background:transparent;border-color:var(--accent-line);color:var(--accent)}
  .pill.nopatch{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.partial{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.plain{background:transparent;border-color:var(--border);color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:500;
    white-space:normal;max-width:100%;overflow-wrap:anywhere}
  .cve{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);background:var(--raised);
    border:1px solid var(--border);border-radius:3px;padding:2px 7px;white-space:nowrap}
  .cve.more{color:var(--muted);background:transparent}

  /* ---------- detail ---------- */
  .detail{display:none;padding:0 4px 30px 54px}
  .card.is-open .detail{display:block}
  .sec{margin-top:26px}
  .sec:first-child{margin-top:6px}
  .sec > h3{margin:0 0 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:650;display:flex;align-items:center;gap:9px}
  .sec > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .prose{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.72;max-width:76ch}
  .facts{display:flex;flex-wrap:wrap;border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden}
  .facts div{flex:1 1 168px;background:var(--bg);padding:10px 13px;
    border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .card.is-open .facts div{background:var(--raised)}
  .facts dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .facts dd{margin:0;font-size:13px;font-family:var(--mono);color:var(--ink-dim)}
  ul.list{margin:0;padding-left:0;list-style:none}
  ul.list li{position:relative;padding-left:20px;margin-bottom:8px;font-size:14px;color:var(--ink-dim);max-width:78ch}
  ul.list li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;
    background:var(--accent);border-radius:1px}
  ul.list.num{counter-reset:a}
  ul.list.num li{counter-increment:a;padding-left:26px}
  ul.list.num li::before{content:counter(a);background:none;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);top:0;left:2px;width:auto;height:auto;font-weight:600}

  /* KQL */
  .kql{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;background:var(--bg);overflow:hidden}
  .kql-head{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
    border-bottom:1px solid var(--border);background:var(--raised);flex-wrap:wrap}
  .kql-head .kn{flex:1;min-width:140px}
  .kql-head h4{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .kql-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}
  .plat{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:3px;padding:2px 7px;
    white-space:nowrap;flex:none}
  .kql pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:var(--ink-dim);tab-size:2}
  .kql pre .k{color:var(--accent)}
  .kql pre .s{color:#C9C4B8}
  .kql pre .c{color:#6E6A63;font-style:italic}
  .copy{flex:none;background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:3px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.ok{border-color:var(--accent-hot);color:var(--accent-hot)}

  /* IOC table */
  .tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:9px 13px;background:var(--raised);color:var(--muted);
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-dim)}
  tbody tr:last-child td{border-bottom:0}
  td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere;min-width:120px}
  td.t{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
  td.ctx{min-width:220px;line-height:1.55}
  td.src{font-size:12px;color:var(--muted);min-width:130px}
  .cf{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;padding:2px 7px;
    border-radius:999px;border:1px solid;white-space:nowrap}
  .cf.high{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .cf.medium{background:transparent;border-color:var(--border-strong);color:var(--ink-dim)}
  .cf.low{background:transparent;border-color:var(--border);color:var(--muted)}
  tr.is-note td{background:rgba(255,106,26,.05)}
  .note-row{font-size:12.5px;color:var(--muted);font-style:italic}
  .refs{margin:0;padding:0;list-style:none}
  .refs li{margin-bottom:7px}
  .refs a{color:var(--accent);text-decoration:none;font-size:13px;font-family:var(--mono);
    overflow-wrap:anywhere;border-bottom:1px solid transparent}
  .refs a:hover{border-bottom-color:var(--accent)}

  /* ---------- provenance ---------- */
  .prov{margin:40px 0 0;border:1px solid var(--border);border-left:3px solid var(--border-strong);
    border-radius:var(--radius);background:var(--surface)}
  .prov > summary{cursor:pointer;padding:15px 18px;font-size:13px;font-weight:600;color:var(--ink);
    list-style:none;display:flex;align-items:center;gap:10px}
  .prov > summary::-webkit-details-marker{display:none}
  .prov > summary:hover{color:var(--accent)}
  .prov > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .prov[open] > summary{border-bottom:1px solid var(--border)}
  .prov-body{padding:18px}
  .prov-body h4{margin:20px 0 9px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .prov-body h4:first-child{margin-top:0}
  .prov-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}
  .prov-body dt{font-weight:650;color:var(--accent);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding-top:3px}
  .prov-body dd{margin:0;color:var(--ink-dim)}

  footer.foot{margin:44px 0 0;border-top:1px solid var(--border);padding:20px 0 50px;
    display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  footer.foot p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .drop-hint{font-size:12px;color:var(--muted)}

  .empty{padding:60px 4px;text-align:center;color:var(--muted);font-size:14px}
  body.dragging::after{content:"Drop a TI JSON file to load it";position:fixed;inset:14px;
    border:2px dashed var(--accent);border-radius:8px;background:rgba(10,10,10,.9);color:var(--accent);
    display:grid;place-items:center;font-size:17px;font-weight:600;z-index:99;pointer-events:none}

  @media (max-width:720px){
    .brand{align-items:flex-start}
    .detail{padding-left:4px}
    .stamp{gap:16px}
    .mast-in{padding-top:22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- report archive timeline ---------- */
  .timeline{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 16px}
  .tl-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;
    justify-content:space-between;margin-bottom:14px}
  .tl-head h2{margin:0;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .tl-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-meta b{color:var(--ink);font-weight:600}
  .tl-latest{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;
    border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .tl-latest:hover{background:var(--accent-soft)}
  .tl-chart{position:relative}
  .tl-bars{display:flex;align-items:flex-end;gap:3px;height:62px;overflow-x:auto;
    overflow-y:hidden;padding-bottom:1px}
  .tl-bar{flex:1 1 0;min-width:5px;height:100%;background:none;border:0;
    padding:0;cursor:pointer;display:flex;align-items:flex-end}
  .tl-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tl-fill{width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--bar);
    transition:background .12s}
  .tl-bar:hover .tl-fill,.tl-bar:focus-visible .tl-fill{background:var(--accent)}
  .tl-bar.is-current .tl-fill{background:var(--accent-hot)}
  .tl-axis{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tl-tip{position:absolute;top:calc(100% + 8px);z-index:5;pointer-events:none;
    background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:9px 11px;min-width:190px;max-width:330px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .tl-tip[hidden]{display:none}
  .tl-tip .t-d{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 5px}
  .tl-tip .t-h{margin:0 0 7px;font-size:12.5px;color:var(--ink);line-height:1.45}
  .tl-tip .t-c{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tl-list{list-style:none;margin:17px 0 0;padding:0;border-top:1px solid var(--border)}
  .tl-list li{margin:0}
  .tl-row{display:flex;gap:14px;align-items:baseline;padding:9px 4px;
    border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
  .tl-row:hover{background:var(--raised)}
  .tl-row:hover .tl-h{color:var(--accent)}
  .tl-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tl-d{flex:none;width:86px;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .tl-h{flex:1;min-width:0;font-size:13.5px;color:var(--ink-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tl-c{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .tl-now{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:1px 7px}
  .tl-more{margin-top:13px}
  @media (max-width:720px){
    .tl-c{display:none}
    .tl-d{width:72px}
    /* Keep the caption - it is what names the series - but give it its own
       line instead of letting it wrap between the two date labels. */
    .tl-axis{flex-wrap:wrap}
    .tl-axis span:nth-child(2){order:3;flex:1 0 100%;text-align:center;margin-top:4px}
  }

  /* ---------- print ---------- */
  @media print{
    :root{--bg:#fff;--surface:#fff;--raised:#f4f2ee;--border:#d5d2cb;--border-strong:#b5b1a8;
          --ink:#111;--ink-dim:#2a2a28;--muted:#5d5a54;--accent:#B83F00;--accent-hot:#B83F00;
          --accent-soft:#faeee6;--accent-line:#e0b79e}
    body{font-size:10.5pt}
    .controls,.caret,.copy,footer.foot,.drop-hint{display:none!important}
    .detail{display:block!important;padding-left:0;page-break-inside:avoid}
    .teaser{display:none!important}
    .card{page-break-inside:avoid;border-bottom:1px solid var(--border)}
    .chead{cursor:default;padding:14px 0}
    .card[data-status="exploited_in_the_wild"] .rank{background:#B83F00;color:#fff}
    .pill.st-exploited,.pill.nopatch{background:#B83F00;color:#fff}
    .kql pre{white-space:pre-wrap;word-break:break-word}
    .tl-row[hidden]{display:flex!important}
    .tl-more,.tl-tip{display:none!important}
    .tl-bars{overflow:visible}

<script id="ti-data" type="application/json">{"schema_version":"1.0","feed_id":"ti-daily-top10","feed_name":"Daily Threat Intelligence Output - Top 10 Vulnerabilities and Cyber Incidents","report":{"check_performed_at":"2026-11-28T11:00:00Z","check_performed_at_local":"2026-11-28","timezone":"UTC","coverage_window":{"start":"2026-11-27T11:30:00Z","end":"2026-11-28T11:00:00Z","duration_hours":23.5,"note":"UK-focused run covering Friday 27 November and the morning of Saturday 28 November. THE UK GOVERNMENT INCIDENT IS STILL LIVE AND THE LANGUAGE AROUND IT HARDENED OVERNIGHT: the DEPARTMENT FOR WORK AND PENSIONS outage has entered its third calendar day, Downing Street now calls it a 'LIVE AND ONGOING INCIDENT' and will NOT RULE OUT a malicious actor, Work and Pensions Secretary PAT MCFADDEN calls it a 'SERIOUS CYBER INCIDENT' and says he cannot yet describe the cause, the INFORMATION COMMISSIONER'S OFFICE is ENGAGING with the department (though at least one report states DWP has NOT notified a personal data breach), Downing Street says there is 'currently no evidence of customer data loss', and the outage has now SPREAD BEYOND DWP'S OWN BRANDED ESTATE to the NHS-RUN HEALTHY START application portal. Two facts are operationally new and belong in any front-line brief today: DWP has WAIVED SANCTIONS for missed Universal Credit journal entries during the outage, and The Times is reported to expect disruption to last MOST OF THE WEEKEND - the first duration estimate from any source, and press reporting rather than a departmental commitment. Yesterday's contested scope question is now effectively settled by enumeration against DWP's 'some services' wording. There are STILL no vector, no actor, no CVE, no data-access finding and NO NETWORK INDICATORS; the only hunting available to third parties remains the downstream fraud wave, and the journal waiver is itself the sharpest new phishing hook. THE SECOND MAJOR DEVELOPMENT IS A NEW KEV BATCH THAT LANDS SQUARELY ON THE UK PUBLIC SECTOR WEB AND GEOSPATIAL ESTATE. CISA added THREE CVEs on 27 November with a 30 NOVEMBER (MONDAY) deadline: two exploited OSGeo GEOSERVER flaws - CVE-2026-120705 (XML injection in unauthenticated WFS GetFeatureById) and CVE-2026-129243 (authorization bypass via a PREFIXED SERVICE NAME such as 'x/WFS') - and DRUPAL CORE CVE-2026-136716, which CLOSES THE OPEN QUESTION this feed carried for two days about whether that CVE would be catalogued. GeoServer is rank 2 because UK public bodies have documented INSPIRE geospatial publication obligations, Defra published official how-to guidance for standing up INSPIRE services IN GEOSERVER, and commercial shared services exist whose stated job is maintaining GeoServer for councils - so it is probable that this software sits unmonitored inside UK local government, while NO current UK deployment census exists. The flaws are links in a FIVE-STAGE unauthenticated RCE chain including a PREDICTABLE REMEMBER-ME SIGNING KEY (CVE-2026-129245) that allows ADMINISTRATOR SESSION FORGERY SURVIVING AN UPGRADE, more than 3,000 instances were reported internet-facing, and the attacker behaviour watchTowr observed - CREATE a stored query, VERIFY it exists, DELETE it - is the most specific and highest-yield indicator in this entire report. DRUPAL IS RANK 3 AND CARRIES THE WORST SINGLE SENTENCE IN THE WINDOW: Drupal's own testing is reported to show ATTACKER ADMIN ACCOUNTS AND BACKDOORS SURVIVE THE UPGRADE, so any site with a reachable installer since 18 November needs a COMPROMISE ASSESSMENT rather than a patch - a site running 11.4.14 can be a site a stranger administers. THE THIRD FEATURE IS THAT THE DEADLINE WALL HAS ARRIVED. EIGHT exploited CVEs are due TODAY - four Mitel MiCollab AWV flaws, Juniper Session Smart CVE-2026-103406 and Vates Xen Orchestra CVE-2026-133469 (BOTH with mandatory forensic triage), and the two 2023-dated Danfoss flaws - SEVEN are now OVERDUE including CVE-2026-131914 which has NO PATCH AND NEVER WILL, and THREE land on Monday. That is EIGHTEEN exploited CVEs across TWELVE unrelated product families in one week, with no common owner inside most organisations, on a SATURDAY: if today's eight are not actioned today, ELEVEN land on one team on Monday morning. The Mitel detail that matters most is Accenture's timeline - web shell planted 15 NOVEMBER, the DAY BEFORE THE PATCH, root in 30 minutes, and authentication to a DOMAIN CONTROLLER using MICOLLAB'S OWN STORED LDAP CREDENTIALS AT 32 MINUTES. Patching MiCollab without rotating that service account leaves the attacker's best asset in place. FOURTH, A NEW UNPATCHED ZERO-DAY WITH A PUBLIC EXPLOIT: the CACTI '4HTTP2SHELL' flaw was released on THANKSGIVING DAY without disclosure to the project - no CVE, no patch, no vendor lead time - giving unauthenticated command execution where the GUEST ACCOUNT IS ENABLED. Disabling the guest account removes the attack entirely, and the recommended check is unusually precise: look for NON-NUMERIC VALUES IN GRAPH DISPLAY SETTINGS, which is the stored payload itself. ON THE UK CORPORATE SIDE, FINANCIAL SERVICES APPEARS FOR THE FIRST TIME IN RECENT WINDOWS: INC RANSOM listed BRIT LTD / BRIT INSURANCE, a Fairfax-owned LLOYD'S SPECIALTY INSURER, on 27 November with a ~33-day countdown - unverified, with sources DIRECTLY CONTRADICTING each other on whether any proof images were posted, and with the group's listings documented as sometimes fabricated. The UNIVERSITY OF LIVERPOOL entry moves from low to MEDIUM confidence on a genuinely new fact: the university ordered ALL STAFF AND STUDENTS TO RESET PASSWORDS BY 1PM ON 25 NOVEMBER citing a 'potential threat to our systems', after EMERGENCY SYSTEM RESETS on 24 November. An institution does not do that for a hypothetical - it corroborates that an EVENT occurred, while the patient-data claim remains entirely unverified and the leak clock runs out around 1-2 DECEMBER. TWO CONFIRMED INCIDENTS IN 48 HOURS BEGAN AT A DEVELOPER'S SOURCE-CONTROL ACCOUNT: 1PASSWORD (hijacked employee GitHub account used to PUSH MALICIOUS CODE TO BACKEND SERVICES; vaults NOT accessed, but sources conflict on whether SRP VERIFIERS were taken) and SAP, which confirmed an incident reportedly handled internally as 'PROJECT GRANITE' after reports of stolen employee GitHub tokens and ALTERED SOURCE CODE, and which has reportedly PAUSED BUILD PIPELINES and ROTATED CODE-SIGNING KEYS - actions that say more than its single confirmed sentence, though NOTHING indicates tampered code reached customers. AND THE MONTH'S UK PATTERN HOLDS FOR THE SIXTH CONSECUTIVE TIME: not one UK consumer-facing compromise disclosed this month began at the named brand's own perimeter. N0n's countdown on hmv, Next plc and 20+ others expires AROUND 2 DECEMBER, with the Next claim now including 320,000 LINES OF AI SHOPPING ASSISTANT CHATS CONTAINING BODY MEASUREMENTS - the first time in this feed that an AI customer-service feature is itself the claimed breach payload - and Gatwick's chain is now confirmed THREE DEEP: AutoPay, operated by PARKPARK, used by TIMES24 UK LIMITED, with HASHED PASSWORDS reportedly exposed and the ICO assessing. One cross-cutting observation worth acting on: FIVE separate entries in this report show an organisation's OWN INCIDENT RESPONSE becoming the pretext for the next attack - DWP's outage and journal waiver, Liverpool's mandatory password reset, 1Password's breach notification, SAP's reported signing-key rotation, and Gatwick's supplier scam warning. Build the counter-message into the incident communications plan, not after it."},"entry_count":10,"generated_by":"Automated UK-focused open-source threat intelligence collection run, analyst-structured output","next_check_due":"2026-11-29T11:00:00Z"},"collection_metadata":{"collection_method":"Open-source search aggregation across UK national and broadcast press, UK trade and civil service press, vendor advisories, national cyber authority alerts and advisories (CISA KEV and CISA alerts, UK NCSC, ICO statements), vendor and researcher threat intelligence (Accenture Apex Labs, watchTowr, Eye Security, Bitdefender, Hudson Rock, Amazon Threat Intelligence, GeoServer Security Team, Drupal Security Team, Mitel, Juniper SIRT, Vates, Danfoss, F5, 1Password, SAP), German business press reporting on SAP (Der Spiegel, Handelsblatt, via secondary summaries), security press, vulnerability trackers, ransomware and extortion leak-site aggregators, UK regulatory and London Stock Exchange disclosures, and UK Parliament publications. UK government relevance was the primary ranking axis, UK corporate relevance secondary. Entries are ranked by ACTIONABILITY WITHIN THE COMING 72 HOURS rather than by CVSS score, because a live UK government incident, eight KEV deadlines falling today, three more falling Monday, an unpatched zero-day with a public exploit, and two extortion leak clocks expiring within five days all sit inside that period.","limitations":["EVERY DIRECT PAGE FETCH FAILED AGAIN - EIGHT CONSECUTIVE DAYS. DNS resolution errors were returned for www.cisa.gov, thehackernews.com and ctoatncsc.substack.com in this run, in addition to the hosts that have failed in every run since 21 November (www.itpro.com, cvebrief.com, hansard.parliament.uk, bills.parliament.uk, www.ncsc.gov.uk and digital.nhs.uk). The CISA alert of 27 November announcing the three new KEV entries - the single most important primary source in this window - COULD NOT BE READ DIRECTLY. These hosts need to be allowed in the session's network settings if direct retrieval is wanted in future runs. Collection was therefore entirely search-surfaced for the eighth day running.","NO PRIMARY SOURCE WAS READ DIRECTLY. The DWP statement and Downing Street briefing, the ICO statement, the CISA KEV catalogue and its 27 November alert, the GeoServer advisory of 23 November, Drupal advisories SA-CORE-2026-017 and SA-CORE-2026-019, the watchTowr and Eye Security research on GeoServer exploitation, the Accenture Apex Labs report on Mitel, Mitel MISA-2026-0012, the Vates advisory, the 1Password incident blog and community forum statements, SAP's statement, the Der Spiegel and Handelsblatt reporting on SAP, the University of Liverpool password reset notice, Gatwick's customer notification, the N0n / ScarlettGroup / INC Ransom leak-site listings, the Cacti exploit disclosure, and the UK Parliament Bill 4035 pages are ALL cited from search-surfaced summaries. Verify against the primary source before relying on any date, build number, CVE identifier or version range for audit evidence.","DWP INCIDENT (rank 1): this remains an ACTIVE, UNCHARACTERISED incident in its third calendar day. The affirmative public claims are narrow - precautionary takedown, payments unaffected, 'currently no evidence of customer data loss', sanctions waived for missed journal entries - and everything else is absent. There is NO vector, NO actor, NO CVE, NO malware, NO infrastructure and NO confirmed data-access finding, which means there are NO network indicators and any source offering DWP incident IOCs is inventing them. The 'most of the weekend' duration estimate is PRESS REPORTING attributed to The Times, NOT a departmental commitment. The assessment that a multi-day takedown of this scale implies an investigation that has not established scope is ANALYST INFERENCE and is labelled as such. David Knott's 'strong suspicion' of an attack is a named former official's view, not evidence, and the government has not confirmed it. Everything in that entry should be dated and revisited Monday 30 November.","GEOSERVER (rank 2): the UK public sector relevance argument rests on DOCUMENTED HISTORICAL material - Defra INSPIRE how-to guidance for GeoServer, LGA local authority case studies, Defra-funded compliance work, a commercial shared INSPIRE service that maintains GeoServer for councils, and the Environment Agency's listed publisher role - all of which dates from approximately 2014-2020. NO CURRENT CENSUS of UK authorities running GeoServer, or of their versions, was found in any source. The entry states this explicitly and frames UK exposure as probable rather than measured. Source counts for the November advisory set vary between five and six CVEs, and a separate NCSC-NL advisory on a GeoServer feed is reported to count seventeen - different scopes, not a contradiction. CVSS figures diverge slightly across sources (CVE-2026-120705 around 8.6, CVE-2026-129243 around 8.8, with one listing giving 8.6 for the former). Exploitation evidence is LAYERED rather than uniform: watchTowr observed PROBING and has NOT reported successful code execution; Eye Security is reported to have observed in-the-wild exploitation of CVE-2026-120705 on 25 November; CISA's 27 November KEV listing is the authoritative confirmation. One source also cites CVE-2026-129244 rather than CVE-2026-129243 as part of the exploited activity, and at least one write-up's CVE reference appears to be a typographical error.","DRUPAL (rank 3): the KEV listing of CVE-2026-136716 on 27 November is recorded as a STATUS CHANGE, not as a correction of an error - the 26 November tracker record showing it absent from catalogue snapshot 2026.11.25 at 07:43 GMT was accurate when made. The claim that ATTACKER ADMIN ACCOUNTS AND BACKDOORS SURVIVE AN UPGRADE, and the derived requirement for a compromise check on any site with a reachable installer since 18 November, come from Drupal's own reported testing via a briefing aggregator and have NOT been read in Drupal's own words. This is the most consequential single claim in the entry and it should be verified against the Drupal Security Team's advisory before being relied on for audit evidence. The BOD 26-04 forensic triage flag attaches to CVE-2026-132165 and NO source reviewed attaches it to CVE-2026-136716. A commercial extended-support vendor's claim that Drupal 7 is affected remains single-sourced and vendor-interested and is not carried as established.","KEV DEADLINE DATES (rank 4 and throughout): dates are reconstructed from secondary reporting and tracker records because the KEV catalogue itself could not be retrieved. Where sources conflict the EARLIEST date is used as the planning assumption. One source did not give a CVE-specific due date for CVE-2026-103406 and reported 28 November for the batch overall. Verify against the catalogue directly before using any date as audit evidence. Note also that KEV deadlines are binding on US federal civilian agencies under BOD 26-04 and are used in this report as a RISK PRIORITISATION SIGNAL for UK organisations, not as a UK legal obligation.","MITEL AI ATTRIBUTION (rank 4): Accenture observed the attacker's systems contacting TWO UNNAMED COMMERCIAL AI API SERVICES, states its telemetry is SAMPLED, and says it CANNOT determine how those services were used. API CONTACTS ARE TIMING EVIDENCE, NOT PROOF of an automated attack, and NO group has been named. This is recorded as SUSPECTED AI-assisted and the stronger framing circulating elsewhere is not adopted. Mitel's own advisory, last updated 24 November, does NOT mention in-the-wild exploitation; CISA lists all five CVEs as actively exploited. Version strings for MiCollab remain mutually incompatible across sources ('10.3 (10.3.0.18) and earlier affected' versus '10.3 and earlier, fixed in 10.3.0.18 or later').","CACTI ZERO-DAY (rank 5): there is NO CVE, NO official severity rating and NO vendor advisory, so the entry carries a null CVSS and exploitation_status 'public_poc_available'. As of 27 November NO exploitation had been reported and it is correctly absent from CISA KEV. VERSION SCOPE IS UNKNOWN - the researcher tested only Cacti Core 1.2.31 and no source establishes whether earlier versions are affected. The root-privilege demonstration occurred in a LAB WHERE CACTI ALREADY RAN AS ROOT; the realistic default outcome is execution as the web server user, and the 'unauthenticated root' framing in some coverage is an overstatement. All detail derives from BleepingComputer's report and rewrites of it plus one threat-intelligence page; the exploit code itself was not examined and no Cacti project statement was found.","BRIT INSURANCE (rank 6): EVERYTHING in this entry derives from an attacker's leak-site listing and the trackers indexing it - the weakest evidence class this feed carries, and the entry is marked LOW confidence accordingly. Brit has published NOTHING. SOURCES DIRECTLY CONTRADICT EACH OTHER ON PROOF: one tracker reports 22 proof images, another reports explicitly that no screenshots, images, data volume or ransom demand are included. These accounts are mutually exclusive and this report does NOT resolve them. At least one tracker explicitly warns that INCRANSOM listings have been reported as including unverified or fabricated victim claims. The assessment of what data class a Lloyd's specialty insurer typically holds is ANALYST INFERENCE about the business model, NOT a statement about what the attacker has - no data categories, volumes or samples have been established.","UNIVERSITY OF LIVERPOOL (rank 7): confidence rises from LOW to MEDIUM in this window solely because of the newly surfaced 25 November mandatory password reset and the 24 November emergency system resets, which corroborate that a SECURITY EVENT occurred. They do NOT corroborate ScarlettGroup's claims about what was taken. The university has NOT linked its action to ScarlettGroup, has NOT confirmed data theft, and has published NO substantive statement; no ICO notification has been reported. The patient, student, staff, financial and research data categories are ATTACKER ASSERTIONS with no samples and no volume. The reported 6-7 day publication intent (approximately 1-2 December) is SINGLE-SOURCED from one threat intelligence feed and is indicative only. The cited Hudson Rock infostealer figures (535 employees, 774 users) are unverified and measure general credential hygiene over time, NOT this intrusion's entry vector.","1PASSWORD (rank 8): there is a DIRECT AND UNRESOLVED SOURCE CONFLICT on the most security-relevant question. One report states that stolen SRP parameters CANNOT be used to access an account, attributed to 1Password; another, citing a company representative on 1Password's community forum, states the stolen data INCLUDED Secure Remote Password verifiers derived from user account passwords and Secret Keys. These are materially different claims and this report does NOT resolve them. The observation that 1Password's design combines the account password with a device-held Secret Key, raising the cost of offline attack, is an ARCHITECTURAL assessment, not a statement about what was taken. The vault-contents claim is 1Password's own and has NOT been independently verified by anyone.","SAP (rank 9): SAP has CONFIRMED only that a security incident exists and that it has found no evidence of unauthorised access to customer business data. EVERYTHING ELSE IS REPORTED, NOT CONFIRMED - the stolen employee tokens and altered source code come from a Der Spiegel insider account, the 'Project Granite' codename, the GitHub access restriction, the paused build pipelines and the rotated code-signing keys come via Handelsblatt, and the agentic AI element is explicitly unverified. The inference that pausing pipelines and rotating signing keys implies the vendor cannot yet prove pipeline integrity is ANALYST ASSESSMENT, labelled as such in the entry and carried at LOW confidence. CRITICALLY: NOTHING in any report indicates that tampered code was incorporated into software delivered to SAP customers. Two aggregator pages claiming the incident was 'confined to source code management' and that private repositories were cloned CONTRADICT other outlets' statements that affected repositories are unknown, and are discarded rather than averaged. One write-up's '300 million subscribers' figure is unsourced speculation. Low-quality aggregators are circulating in this reporting cluster - one misnames the UK prime minister in adjacent DWP coverage.","N0n CAMPAIGN AND GATWICK (rank 10): N0n's credibility is DOCUMENTED as poor - Bitdefender found an exposed group file server showing just over 20 victims against a leak site listing more than 100, and called its threat image 'a false depiction'. No samples exist for the 166 million Gannett / USA Today claim and USA Today has not confirmed a breach. The Next plc figures (3.5m+ rows, 320,000+ AI assistant chat lines with body measurements, 293 named staff) are ATTACKER CLAIMS ONLY and are carried at LOW confidence; they stand in unresolved conflict with Next's own LSE-filed characterisation of 'benign data' and its statement that no customer personal data was compromised. Next has NOT named the supplier and has NOT linked the two events. The shared-e-commerce-search-provider conclusion is an INFERENCE from identical listing wording across five retail entries and NO provider has been named by anyone. No live N0n countdown timer was observable, so the ~2 December date is from reporting rather than direct observation. For Gatwick, the scope conflict between the airport's stated partial card metadata and several outlets' assertion of stolen bank details remains UNRESOLVED on day four; the reported exposure of HASHED PASSWORDS appears in only one of the reports reviewed; and no customer count, record date range or vector has been published by Gatwick, Times24 UK Limited or ParkPark.","ATTACKER NETWORK INDICATORS REMAIN ALMOST ENTIRELY ABSENT. NO attacker IP address, domain, URL, file hash or YARA rule was published for ANY entry in this report - not for the DWP incident, the GeoServer activity, either Drupal CVE, the Mitel flaws, the Cacti zero-day, the Brit Insurance or Liverpool claims, the 1Password or SAP incidents, or the Gatwick breach. All detection content is mechanism-based or behavioural. The three closest things to exploit signatures this window are the GEOSERVER CREATE-VERIFY-DELETE STORED QUERY SEQUENCE, the GEOSERVER PREFIXED SERVICE NAME ('x/WFS'), and the carried-forward XEN ORCHESTRA EMPTY TOKEN.","ALL KQL IS UNTESTED. Queries were written against documented table schemas and have NOT been executed against a live workspace. Table availability, column names and parser functions vary by tenant, connector and ingestion configuration - in particular the GitHub audit log schema in ranks 8 and 9 varies substantially by connector, and the W3CIISLog queries in ranks 2, 3, 4, 5 and 7 assume IIS-shaped web logs that most GeoServer, Drupal and Cacti deployments will NOT produce, so the table must be swapped for your own web, proxy or WAF log source. Validate and tune every query before using it as an analytics rule, and expect to adjust the brand, supplier, service-account and term lists in ranks 1, 4, 6, 7, 8, 9 and 10 to your own environment."],"confidence_legend":{"high":"Corroborated by two or more independent sources, or stated by a national authority or the affected vendor.","medium":"Reported consistently but from secondary sources only, or stated by a single authoritative source without corroboration.","low":"Single source, attacker self-reporting, analyst inference, or sources in conflict."},"exploitation_status_values":["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed","public_poc_available","no_known_exploitation"],"kql_platform_values":["sentinel","defender_xdr"],"ioc_types_present":["account","behaviour","filepath","malware","note","port","ttp","uri_path"]},"vulnerabilities":[{"rank":1,"id":"TI-2026-11-28-001","title":"DAY TWO OF THE UK GOVERNMENT INCIDENT, AND THE LANGUAGE HAS HARDENED: Downing Street Now Calls the DWP Compromise 'LIVE AND ONGOING' and Will NOT Rule Out a Malicious Actor, Pat McFadden Calls It a 'SERIOUS CYBER INCIDENT', the ICO Is Engaging, the NHS Healthy Start Portal Is Also Down, Claimants Will NOT Be Sanctioned for Missed Journal Entries - and The Times Reports the Outage Is Expected To Last MOST OF THE WEEKEND","cve_ids":[],"vendor":"UK Department for Work and Pensions (DWP)","affected_products":["Universal Credit online account, sign-in, journal, change-of-circumstance reporting and caseworker messaging","State Pension online services","Pension Credit online services and the Pension Credit Checker","Personal Independence Payment (PIP) applications","Tell Us Once service","Employment and Support Allowance fit note submission","NHS Healthy Start online application portal (NEW in this window)","New benefit claim journeys"],"category":"incident","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-26","last_updated":"2026-11-28","confidence":"high","summary":"THIS REMAINS THE UK GOVERNMENT ITEM OF THE WINDOW, IT IS NOW IN ITS THIRD CALENDAR DAY, AND IT IS NOT FIXED. Yesterday this entry recorded a department that had said almost nothing. In the twenty-four hours since, the facts have not been replaced - they have been ADDED TO, and every addition points the same way. The entry below separates what is now ON THE RECORD from what is still absent, because the gap between those two lists is the whole assessment.\n\nWHAT IS NEW SINCE YESTERDAY - SIX ADDITIONS, IN ORDER OF WEIGHT.\n\nFIRST, THE GOVERNMENT'S OWN CHARACTERISATION HAS CHANGED. The Prime Minister's spokesperson described this as a 'LIVE AND ONGOING INCIDENT' and explicitly DID NOT RULE OUT a malicious actor. Yesterday the department's word was 'precaution'. Today Downing Street's word is 'live and ongoing'. That is not a reassurance; it is a statement that the investigation has not closed and that the hostile-action hypothesis remains open at the centre of government.\n\nSECOND, A CABINET MINISTER HAS PUT A SEVERITY LABEL ON IT. Work and Pensions Secretary Pat McFadden called it a 'SERIOUS CYBER INCIDENT' and said he could not say more about the cause at this stage. A Secretary of State using the word 'serious' on the record, while declining to describe the cause, is the strongest signal available in the absence of a technical statement.\n\nTHIRD, THE REGULATOR IS NOW INVOLVED. The Information Commissioner's Office has confirmed it is AWARE of the incident and is ENGAGING WITH DWP to establish the circumstances. Note carefully what this is and is not: at least one report states DWP has NOT reported a personal data breach to the ICO. Regulatory engagement is not the same as a notified breach. Both facts should be recorded, and neither should be used to imply the other.\n\nFOURTH, DOWNING STREET HAS MADE A DATA CLAIM, AND IT IS A NARROW ONE. The spokesperson said there is 'CURRENTLY NO EVIDENCE OF CUSTOMER DATA LOSS' and added 'the investigation is ongoing so I'm not going to get ahead of that process'. Read the construction exactly: 'no evidence' on day two of a live investigation is a statement about the state of the evidence, not about what happened. It is entirely compatible with a later finding of data access. Do not let it be reported internally as 'no data was taken'.\n\nFIFTH, THE BLAST RADIUS NOW REACHES THE NHS. The NHS-run HEALTHY START scheme - the prepaid-card scheme for pregnant women and families with young children on low incomes - has had its ONLINE APPLICATION PORTAL taken offline as part of this incident. A spokesperson confirmed existing payments continue without interruption but the online service remains unavailable. This is the first confirmed spread of the outage BEYOND DWP's own service estate into an NHS-branded citizen service, and it is the single most important new fact for anyone mapping dependency. If your organisation consumes a DWP-fronted or DWP-authenticated service under someone else's brand, you may be affected without having been told.\n\nSIXTH, AND MOST USEFUL OPERATIONALLY: THE DEPARTMENT HAS WAIVED A CONSEQUENCE AND THE PRESS HAS A DURATION. DWP has said claimants will NOT BE PENALISED over missing journal entries during the outage - a conditionality waiver that matters enormously to the people affected and that front-line advice services should be repeating today. And The Times is reported to have said the disruption is EXPECTED TO LAST FOR MOST OF THE WEEKEND. That is the first duration estimate attached to this incident from any source. It is PRESS REPORTING, NOT A DEPARTMENTAL COMMITMENT, and it should be labelled as such - but it is the only planning number available, and planning to it is more honest than planning to nothing.\n\nWHAT IS STILL ABSENT, AND THE LIST HAS BARELY SHORTENED. There is still NO vector. NO actor. NO exploited CVE. NO malware family. NO third-party supplier named. NO attacker infrastructure. NO confirmed data-access finding. NO official restoration timeline. NO ministerial statement to Parliament identified in this window - the Commons rose for the weekend and the department has briefed through spokespeople rather than the chamber. Officials have added one useful negative: there is currently NO EVIDENCE that a malicious actor has targeted OTHER GOVERNMENT DEPARTMENTS. That is worth recording because it bounds the incident, but it is a day-two statement about evidence, not a conclusion.\n\nONE NAMED OUTSIDE VOICE IS NOW ON THE RECORD, AND IT MATTERS WHO IT IS. David Knott, the FORMER GOVERNMENT CHIEF TECHNOLOGY OFFICER, is reported to have a 'STRONG SUSPICION' that this was an attack. A former government CTO is not a random commentator - he is someone who knows how these estates are built and who no longer has a departmental line to hold. His view is not evidence and the government has not confirmed it, but it is the most credible external assessment published so far and it points the same direction as Downing Street's refusal to rule out a malicious actor.\n\nSCOPE: YESTERDAY'S CONTESTED POSITION IS NOW EFFECTIVELY RESOLVED AGAINST THE DEPARTMENT. Yesterday this report recorded a genuine conflict between DWP's 'SOME online services' and press claims of 'all major benefits' or 'nearly all'. This window's reporting substantially settles it in favour of the broader account: the enumerated list of affected services now runs to Universal Credit sign-in AND journals AND change reporting AND caseworker messaging, State Pension, Pension Credit online, the Pension Credit Checker, PIP applications, Tell Us Once, ESA fit note submission, new claim journeys, and the NHS Healthy Start portal. That is not 'some services'. A department can be technically accurate in saying 'some' while the practical answer for a claimant is 'everything I would use'. RECORD THE ENUMERATED LIST, not the adjective.\n\nWHAT HAS NOT CHANGED, AND IS STILL THE ONLY THING THIRD PARTIES CAN ACT ON: THE FRAUD WAVE. There are STILL no network indicators for this incident, because none exist. Any feed offering DWP incident IOCs today is inventing them. The actionable surface is unchanged and now more urgent, because the outage has run into a weekend with a publicised duration estimate and a known population of anxious claimants. The pretexts write themselves: 'your Universal Credit account could not be verified', 'your journal entry failed - reconfirm your details', 'claim your emergency payment while services are down', 'Healthy Start application resubmission required'. The journal waiver is itself a phishing hook, because it tells attackers exactly which anxiety to exploit. Yesterday's recommendation to publish a scam warning BEFORE the weekend is now a recommendation to publish one DURING it.\n\nTHE GOVERNANCE CONTEXT HAS SHARPENED TOO. The Cyber Security and Resilience (Network and Information Systems) Bill is in ping-pong: the Commons is reported to have rejected BOTH Lords amendments on 24 November - including a division reported as 260 to 98 against the register of foreign powers - and the Bill has returned to the Lords for consideration of Commons reasons, with no date set and a carry-over backstop reported as the end of 29 April 2027. A live, uncharacterised compromise of the department that pays the nation's benefits, four days into that stage, will be raised. Expect written and oral parliamentary questions, expect this incident named in Lords debate on the Bill, and expect the 'why is central government exempt from the standards it is imposing' argument to be made with this incident as its example.","recommended_actions":["IF YOU ARE DWP OR A DWP SUPPLIER: follow your incident management process and NCSC direction. Everything below is for the UK organisations sitting downstream of this outage.","THE SINGLE MOST VALUABLE THING TO DO TODAY, AND IT IS NEW SINCE YESTERDAY: amplify the JOURNAL SANCTION WAIVER. DWP has said claimants will NOT be penalised for missing journal entries during the outage. Front-line advisers, housing officers, welfare rights teams and contact centres should be saying this out loud, because the fear of sanction is precisely the anxiety phishing will target. Pair it with the scam warning in the same message.","PUBLISH OR REPUBLISH A SCAM WARNING NOW, with the specific pretexts in it: account verification failures, journal entry failures, emergency payment offers, and Healthy Start resubmission requests. Include that DWP and the NHS will NEVER text or email asking for bank details or asking users to click a link to restore access. Give the reporting routes: scam texts to 7726, scam emails to report@phishing.gov.uk.","ADD HEALTHY START TO YOUR DEPENDENCY MAP TODAY. The outage has reached an NHS-branded service. If you are an NHS trust, a health visiting service, a midwifery service, a children's centre or a local authority early-years team, check whether anything you tell families to use is DWP-fronted or DWP-authenticated. This is the new fact in this window and it is the one most likely to catch an organisation that thought it had no DWP exposure.","EXTEND BRAND-PROTECTION MONITORING TO THE NEW TERMS. Add healthy-start, healthystart, nhs-healthy-start, uc-journal, universal-credit-journal, fit-note, fitnote and esa- to yesterday's list of dwp, universal-credit, universalcredit, uc-account, state-pension, pension-credit, gov-uk and benefit or claim strings. Newly registered domains against these terms this weekend should be treated as hostile until proven otherwise.","WRITE DOWN THE DISTINCTION BETWEEN 'ICO ENGAGING' AND 'BREACH NOTIFIED', and brief whoever answers questions in your organisation on it. The ICO is engaging with DWP to establish circumstances; at least one report states DWP has not reported a personal data breach. Conflating the two will embarrass you later, in either direction.","DO NOT RESTATE 'NO EVIDENCE OF DATA LOSS' AS 'NO DATA WAS LOST' in any internal or external communication. Downing Street's wording is a statement about the current state of evidence in a live investigation. If you are briefing a board, quote it verbatim and date it.","PLAN TO THE WEEKEND, FLAG IT AS PRESS-SOURCED. The Times is reported to expect disruption for most of the weekend. There is NO departmental timeline. If you need a planning assumption for staffing an advice line or a contact centre through Saturday and Sunday, use the weekend estimate and label it clearly as journalism rather than commitment.","IF YOU EXCHANGE DATA WITH DWP - Tell Us Once feeds, Housing Benefit and Council Tax Reduction interfaces, Searchlight, ATLAS, verification APIs - log every degradation with timestamps now, while it is happening. Nobody will broadcast this to you, and the evidence is only collectable in real time. Local authority benefits teams remain the group most likely to be materially affected after claimants themselves.","ANSWER THE SEPARATION QUESTION FOR YOUR OWN ESTATE, HONESTLY, IN WRITING. DWP's payments-unaffected claim implies a real separation between citizen-facing online services and payment scheduling. If you could not take your own citizen-facing authentication offline tonight and still pay people tomorrow, that is a finding to escalate out of this incident, independent of its cause.","SET A HARD REVIEW POINT FOR MONDAY 30 NOVEMBER, and note that Monday is ALSO the KEV deadline for the three CVEs in ranks 2 and 3 of this report. Monday is going to be busy. Allocate the time now rather than discovering the collision on the day.","RECORD THE EVENT IN YOUR RISK REGISTER with today's date and today's wording: a major UK government department suffered a live, uncharacterised cyber incident requiring a multi-day shutdown of citizen-facing services, with NCSC and the Government Cyber Coordination Centre engaged, the ICO engaging, a Secretary of State describing it as serious, and Downing Street declining to rule out a malicious actor. If you are regulated or heading into Cyber Assessment Framework or Cyber Essentials work, this is the reference event your board will cite."],"references":["https://www.computerweekly.com/news/366655538/Investigation-underway-into-DWP-cyber-security-incident-as-services-taken-offline","https://www.euronews.com/2026/11/27/live-and-ongoing-cyber-incident-takes-down-uk-department-for-work-and-pensions-online-serv","https://www.civilserviceworld.com/news/article/cyber-incident-at-dwp-forces-some-services-offline","https://www.personneltoday.com/hr/cyber-incident-at-dwp-affects-benefit-and-state-pension-services/","https://www.infosecurity-magazine.com/news/uk-welfare-services-offline/","https://www.newshub.co.uk/politics/2026/11/28/uk-benefits-and-pensions-services-down-after-cyber-incident/","https://www.itv.com/news/2026-11-27/dwp-removes-some-online-services-amid-cyber-incident","https://www.cityam.com/dwp-takes-services-offline-after-cyber-incident/","https://www.itpro.com/cybersecurity/dwp-cyber-attack-everything-we-know-so-far-as-government-department-takes-systems-offline","https://skintdad.co.uk/dwp-cyber-incident-benefit-payments/","https://bills.parliament.uk/bills/4035/news","https://commonslibrary.parliament.uk/research-briefings/cbp-10442/"],"kql":[{"platform":"sentinel","table":"_Im_Dns","name":"DNS lookups to DWP, Universal Credit, Healthy Start and GOV.UK lookalike domains","description":"The highest-value query in this entry for anyone who is not DWP, updated for this window with Healthy Start, journal and fit-note terms. A multi-day benefit-service outage with a published duration estimate is a near-perfect phishing pretext. Tune the term list to your own tenant before use.","query":"let BrandTerms = dynamic([\"dwp\",\"universal-credit\",\"universalcredit\",\"uc-account\",\"uc-journal\",\"universal-credit-journal\",\"state-pension\",\"statepension\",\"pension-credit\",\"pensioncredit\",\"healthy-start\",\"healthystart\",\"nhs-healthy-start\",\"fit-note\",\"fitnote\",\"benefit-claim\",\"benefitclaim\",\"tell-us-once\",\"gov-uk\",\"govuk-\",\"hmrc-\"]);\n_Im_Dns\n| where TimeGenerated > datetime(2026-11-26)\n| where DnsQuery has_any (BrandTerms)\n| extend RootIsLegit = DnsQuery endswith_cs \"gov.uk\" or DnsQuery endswith_cs \"nhs.uk\"\n| where not(RootIsLegit)\n| summarize Lookups = count(), Users = dcount(SrcIpAddr), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Clients = make_set(SrcIpAddr, 25) by DnsQuery\n| order by FirstSeen desc, Lookups desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Inbound mail impersonating DWP, Healthy Start or benefit services","description":"The delivery side. Display-name impersonation of a government department or NHS scheme from a non-gov.uk, non-nhs.uk sending domain is the dominant pattern in UK benefit fraud campaigns. Healthy Start and journal terms are new for this window.","query":"let BrandTerms = dynamic([\"dwp\",\"department for work\",\"universal credit\",\"uc journal\",\"state pension\",\"pension credit\",\"healthy start\",\"tell us once\",\"fit note\",\"benefit payment\",\"benefit claim\",\"emergency payment\"]);\nEmailEvents\n| where Timestamp > datetime(2026-11-26)\n| where (Subject has_any (BrandTerms)) or (SenderFromName has_any (BrandTerms)) or (SenderDisplayName has_any (BrandTerms))\n| where not(SenderFromDomain endswith \".gov.uk\") and not(SenderFromDomain endswith \".nhs.uk\")\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 15), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderFromAddress, SenderIPv4\n| order by Messages desc"},{"platform":"defender_xdr","table":"UrlClickEvents","name":"Users clicking DWP, journal or Healthy Start themed links","description":"Click-through converts a phishing wave into an incident. Covers Safe Links telemetry across mail and Teams, including clicks allowed through an override.","query":"let BrandTerms = dynamic([\"dwp\",\"universal-credit\",\"universalcredit\",\"uc-journal\",\"state-pension\",\"pension-credit\",\"healthy-start\",\"healthystart\",\"fit-note\",\"benefit\",\"tell-us-once\",\"gov-uk\",\"hmrc\"]);\nUrlClickEvents\n| where Timestamp > datetime(2026-11-26)\n| where Url has_any (BrandTerms)\n| where not(Url has_cs \".gov.uk/\") and not(Url has_cs \".nhs.uk/\")\n| project Timestamp, AccountUpn, Url, ActionType, IsClickedThrough, Workload, NetworkMessageId, ThreatTypes\n| order by Timestamp desc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"Timestamped evidence of degradation on your own DWP-facing integrations","description":"For local authority benefits teams, housing providers and NHS early-years services. This evidence is only collectable while the outage is live. Run it now, export the result, and attach it to your incident record.","query":"AzureDiagnostics\n| where TimeGenerated > datetime(2026-11-25)\n| where Category in (\"ApplicationGatewayAccessLog\", \"FrontdoorAccessLog\", \"AzureFirewallApplicationRule\")\n| where tostring(requestUri_s) has_any (\"dwp\", \"tellusonce\", \"searchlight\", \"atlas\", \"healthystart\") or tostring(msg_s) has_any (\"dwp.gov.uk\", \"dwpgov\", \"healthystart\")\n| summarize Requests = count(), Failures = countif(toint(httpStatus_d) >= 500 or toint(httpStatus_d) == 0), Statuses = make_set(httpStatus_d, 10) by bin(TimeGenerated, 1h), Resource\n| extend FailureRate = round(todouble(Failures) * 100 / Requests, 1)\n| order by TimeGenerated asc"},{"platform":"defender_xdr","table":"IdentityLogonEvents","name":"Credential-stuffing pressure following a publicised multi-day outage","description":"Secondary effect. Published outages are followed by credential replay against adjacent services, because harvested benefit-portal credentials get reused everywhere. A multi-day outage extends the window.","query":"IdentityLogonEvents\n| where Timestamp > datetime(2026-11-26)\n| where ActionType == \"LogonFailed\"\n| summarize Failures = count(), TargetedAccounts = dcount(AccountUpn), Accounts = make_set(AccountUpn, 20), FirstSeen = min(Timestamp) by IPAddress, Application, Protocol\n| where TargetedAccounts >= 10\n| order by TargetedAccounts desc"}],"iocs":[{"type":"behaviour","value":"Newly registered or newly resolved domains combining dwp, universal-credit, uc-journal, state-pension, pension-credit, healthy-start, fit-note, benefit or tell-us-once with gov-uk, govuk or nhs lookalike strings","context":"The concrete actionable artefact of this incident for every UK organisation that is not DWP. Healthy Start, journal and fit-note terms are NEW for this window because those services are now confirmed affected.","confidence":"medium","source":"Analyst assessment based on DWP's own scam warning and the newly enumerated affected services"},{"type":"ttp","value":"Pretexting on the journal sanction waiver - 'your journal entry failed, reconfirm your details to avoid a sanction'","context":"DWP has said claimants will NOT be penalised for missed journal entries. That waiver tells attackers exactly which anxiety to exploit, and makes this the highest-conversion pretext available this weekend.","confidence":"medium","source":"Analyst assessment based on the DWP conditionality waiver reported 27-28 November 2026"},{"type":"ttp","value":"Pretexting on a publicised multi-day government outage - 'your Universal Credit account could not be verified', 'claim your emergency payment while services are down', 'Healthy Start application resubmission required'","context":"DWP has explicitly warned claimants it will never message them asking for bank details or to click links. A published weekend duration estimate extends the exploitable window.","confidence":"high","source":"DWP scam warning via multiple UK outlets; duration estimate reported from The Times"},{"type":"account","value":"report@phishing.gov.uk and SMS short code 7726","context":"Reporting routes to put in front of service users and front-line staff today. Not an indicator - an operational detail that belongs in the same brief as the sanction waiver.","confidence":"high","source":"UK government reporting guidance via secondary reporting"},{"type":"behaviour","value":"Degradation or failure on DWP data interfaces - Tell Us Once feeds, Housing Benefit and Council Tax Reduction interfaces, Searchlight, ATLAS, verification APIs - and on NHS Healthy Start application paths","context":"Only collectable while the outage is live. Healthy Start is the NEW dependency in this window and the first confirmed spread beyond DWP's own branded estate.","confidence":"medium","source":"Analyst assessment based on the services reported offline, including the NHS Healthy Start portal"},{"type":"note","value":"GOVERNMENT LANGUAGE CHANGED IN THIS WINDOW: the Prime Minister's spokesperson called this a 'live and ongoing incident' and did NOT rule out a malicious actor; Work and Pensions Secretary Pat McFadden called it a 'serious cyber incident' and said he could not say more about the cause","context":"Yesterday the department's word was 'precaution'. Today the centre of government's words are 'live and ongoing' and 'serious'. This is the most significant change in the window.","confidence":"high","source":"Downing Street and DWP statements via Computer Weekly, Euronews, Civil Service World and Personnel Today, 27-28 November 2026"},{"type":"note","value":"DATA POSITION: Downing Street says there is 'currently no evidence of customer data loss' and that 'the investigation is ongoing'; at least one report states DWP has NOT reported a personal data breach; the ICO confirms it is AWARE and ENGAGING with DWP to establish the circumstances","context":"'No evidence' on day two of a live investigation is a statement about the evidence, not about what happened. ICO engagement is NOT the same as a notified breach. Record both, imply neither.","confidence":"high","source":"Downing Street, ICO and DWP positions via multiple UK outlets, 27-28 November 2026"},{"type":"note","value":"NEW AFFECTED SERVICE: the NHS-run HEALTHY START online application portal has been taken offline as part of this incident; existing payments continue","context":"The first confirmed spread of the outage beyond DWP's own branded service estate into an NHS-branded citizen service. The most important new fact for dependency mapping.","confidence":"high","source":"Healthy Start spokesperson via UK reporting, 27-28 November 2026"},{"type":"note","value":"CONDITIONALITY WAIVED: DWP has said claimants will NOT be penalised over missing journal entries during the outage","context":"Operationally the most useful new fact for front-line advice services, and simultaneously the most exploitable phishing hook in the incident. Amplify the waiver; expect it to be impersonated.","confidence":"high","source":"DWP position via UK reporting, 27-28 November 2026"},{"type":"note","value":"DURATION: The Times is reported to say disruption is expected to last MOST OF THE WEEKEND; DWP has given NO official restoration timeline","context":"PRESS REPORTING, NOT A DEPARTMENTAL COMMITMENT. It is the only duration number available anywhere. Use it as a labelled planning assumption, never as a commitment.","confidence":"medium","source":"The Times via secondary reporting, 27-28 November 2026"},{"type":"note","value":"SCOPE NOW EFFECTIVELY RESOLVED AGAINST 'SOME SERVICES': the enumerated affected list runs to Universal Credit sign-in, journals, change reporting and caseworker messaging, State Pension, Pension Credit online, the Pension Credit Checker, PIP applications, Tell Us Once, ESA fit note submission, new claim journeys and the NHS Healthy Start portal","context":"Yesterday's contested position between DWP's 'some' and the press's 'nearly all' is substantially settled by enumeration. Record the LIST, not the adjective.","confidence":"high","source":"Aggregated enumeration across UK outlets, 27-28 November 2026"},{"type":"note","value":"BOUNDING STATEMENT: officials say there is currently NO EVIDENCE that a malicious actor has targeted other government departments","context":"Worth recording because it bounds the incident, but it is a day-two statement about the state of evidence rather than a conclusion. Do not treat it as clearance for the wider government estate.","confidence":"medium","source":"Officials via UK reporting, 27-28 November 2026"},{"type":"note","value":"NAMED EXTERNAL ASSESSMENT: David Knott, the FORMER GOVERNMENT CHIEF TECHNOLOGY OFFICER, is reported to have a 'strong suspicion' that the incident was an attack; the government has not confirmed this","context":"Not evidence, but the most credible external assessment published so far, from someone who knows these estates and has no departmental line to hold. Points the same direction as Downing Street's refusal to rule out a malicious actor.","confidence":"medium","source":"David Knott via UK reporting, 27-28 November 2026"},{"type":"note","value":"STILL ABSENT AFTER THREE CALENDAR DAYS: NO vector, NO actor, NO CVE, NO malware, NO attacker infrastructure, NO named third-party supplier, NO confirmed data-access finding, NO official restoration timeline, NO ministerial statement to Parliament identified in this window","context":"There are still NO network indicators for this incident because none exist publicly. Any feed, vendor or post offering DWP incident IOCs today is inventing them. Hunting remains limited to the downstream fraud wave.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"note","value":"GOVERNANCE: the Cyber Security and Resilience (NIS) Bill is in ping-pong - the Commons is reported to have rejected BOTH Lords amendments on 24 November, with one division reported as 260 to 98 against the register of foreign powers, and the Bill has returned to the Lords with no date set and a carry-over backstop reported as end of 29 April 2027","context":"Expect this incident cited in Lords debate on the Bill, and expect the 'why is central government exempt from the standards it is imposing' argument to be made with DWP as its example.","confidence":"medium","source":"UK Parliament Bill 4035 pages and secondary status trackers, via search-surfaced summaries"}]},{"rank":2,"id":"TI-2026-11-28-002","title":"NEW IN KEV LAST NIGHT, DUE MONDAY, AND SITTING UNDER THE UK PUBLIC SECTOR'S MAPS: CISA Added TWO Exploited OSGeo GeoServer Flaws on 27 November (CVE-2026-120705 XML Injection and CVE-2026-129243 Incorrect Authorization) With a 30 NOVEMBER Deadline - Both Unauthenticated, Both Links in a FIVE-STAGE Unauthenticated RCE Chain, 3,000+ Instances Exposed, and the Attacker Behaviour Is a CREATE-VERIFY-DELETE Stored Query That Is Trivially Searchable","cve_ids":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"],"vendor":"OSGeo / GeoServer","affected_products":["GeoServer up to and including 2.27.6","GeoServer 2.28.0 through 2.28.5","GeoServer 3.0.0 through 3.0.1","GeoServer WFS GetFeatureById operation (CVE-2026-120705)","GeoServer service security rules / prefixed service names (CVE-2026-129243)","GeoServer remember-me authentication signing key (CVE-2026-129245)","GeoServer stored query handling (CVE-2026-129244)","GeoServer JDBC / SQLite JDBC extension paths (CVE-2026-129242, CVE-2026-120704)"],"category":"vulnerability_bundle","cvss_v3":8.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-30","patch_available":"yes","first_reported":"2026-11-23","last_updated":"2026-11-28","confidence":"high","summary":"THIS IS THE SINGLE MOST IMPORTANT NEW TECHNICAL ITEM IN THE WINDOW AND IT IS RANKED SECOND ONLY BECAUSE AN ACTIVE GOVERNMENT INCIDENT OUTRANKS IT. On 27 November 2026 CISA added THREE entries to the Known Exploited Vulnerabilities catalogue. Two of them are OSGeo GeoServer: CVE-2026-120705, catalogued as an XML Injection Vulnerability, and CVE-2026-129243, catalogued as an Incorrect Authorization Vulnerability. Both carry a remediation due date of 30 NOVEMBER 2026 - MONDAY. Neither is flagged as requiring forensic triage under BOD 26-04. Ransomware use is recorded as unknown for both.\n\nWHY THIS BELONGS AT THE TOP OF A UK GOVERNMENT-FOCUSED REPORT. GeoServer is the open-source OGC map and feature server. It is not niche in the UK public sector - it is structural. UK public bodies carry statutory geospatial publication obligations under the INSPIRE regime, Defra has published official 'how to' guidance specifically for standing up INSPIRE Web Feature Services IN GEOSERVER, the Local Government Association published case studies on how councils implemented their INSPIRE services, Defra funded local authorities to achieve compliance, and at least one commercial supplier sells a SHARED INSPIRE SERVICE whose stated job is upgrading and maintaining GeoServer and GeoNetwork on councils' behalf. The Environment Agency is a listed publisher across flooding, hydrography and ecology themes. That history is documented and is not in dispute. What IS unknown - and this report states it plainly rather than guessing - is how many UK authorities are running GeoServer TODAY and at what versions; no current census was found. The honest formulation is this: if your organisation publishes map or feature services, planning constraint layers, flood or environmental data, asset or highways layers, or anything that a browser renders as a map, THERE IS A REAL CHANCE GEOSERVER IS IN THAT PATH, and quite possibly a chance nobody in your security team has ever inventoried it because it was delivered as a compliance project or by a managed supplier.\n\nAND THAT IS THE EXACT SHAPE OF ASSET THE NCSC WARNED ABOUT ON 24 NOVEMBER. Its finding was that AI-assisted attacks since September have exploited NOTHING NEW - only longstanding gaps, faster - and its first recommendation was AN ACCURATE INVENTORY OF PUBLIC-FACING SYSTEMS. A compliance-driven, supplier-maintained, internet-facing Java application that answers unauthenticated WFS requests and is absent from the security team's asset list is the archetype. This entry is that warning made concrete, four days later, with a Monday deadline attached.\n\nWHAT THE TWO KEV FLAWS ACTUALLY DO. CVE-2026-120705 sits in the WFS GetFeatureById operation and is reachable WITHOUT AUTHENTICATION. CISA's catalogue title is XML injection; vulnerability lists describe the practical effect variously as arbitrary file read and as the ability to make the server fetch attacker-chosen URLs, which is server-side request forgery in effect. Those descriptions are not contradictory in the way they look - they describe the same unauthenticated WFS request abused in two directions, and both matter: file read gets an attacker configuration and credentials, URL fetch gets them cloud instance metadata. It is scored around 8.6. CVE-2026-129243 is an authorization bypass: PREFIXING A SERVICE NAME - the published example is literally 'x/WFS' - lets an unauthenticated attacker reach operations that GeoServer's service security rules are supposed to restrict to administrators. It is scored around 8.8 by most sources. A one-character-class trick that defeats an access control rule is the kind of flaw that gets mass-scanned within hours, and that is what happened.\n\nTHE CHAIN IS THE REAL STORY, AND IT IS WORSE THAN EITHER CVE ALONE. The GeoServer maintainers describe a FIVE-STAGE UNAUTHENTICATED REMOTE CODE EXECUTION CHAIN across the November advisory set. The CVEs identified in that cluster beyond the two in KEV are: CVE-2026-129245, a PREDICTABLE REMEMBER-ME SIGNING KEY that permits ADMINISTRATOR SESSION FORGERY; CVE-2026-129244, a stored-query exception that DISCLOSES THE DATA DIRECTORY PATH; CVE-2026-129242, JDBC deserialisation; and, per at least one write-up, CVE-2026-120704, SQLite JDBC extension loading leading to RCE. Eye Security is reported to describe a shorter THREE-FLAW variant of the same chain. Read in order, the chain is coherent and cheap: bypass the service rules, disclose where the data directory is, forge an administrator session using a key you can predict, then convert administrative access into code execution through a JDBC path. PATCHING ONLY THE TWO KEV CVES LEAVES THE CHAIN'S MIDDLE AND END INTACT. Patch the RELEASE, not the two identifiers.\n\nEXPOSURE AND EXPLOITATION, SEPARATED CAREFULLY BECAUSE THE SOURCES DIFFER. Eye Security is reported to have counted MORE THAN 3,000 INTERNET-FACING GEOSERVER INSTANCES. watchTowr observed PROBING from multiple IP addresses within roughly two days of disclosure, and has NOT reported successful code execution from that activity. Eye Security is separately reported to have observed IN-THE-WILD EXPLOITATION of CVE-2026-120705 on 25 NOVEMBER. CISA's KEV listing of both CVEs on 27 November is the authoritative confirmation that exploitation is occurring, and it supersedes the earlier tracker checks - including one explicit negative against catalogue snapshot 2026-11-25 - that correctly recorded these CVEs as absent from KEV before last night. If your vulnerability management tooling pulled KEV before 27 November, IT IS WRONG ABOUT THESE TWO. Refresh it.\n\nTHE DETECTION OPPORTUNITY HERE IS UNUSUALLY GOOD, AND IT IS THE MOST VALUABLE PARAGRAPH IN THIS ENTRY. watchTowr's honeypots recorded a distinctive sequence: the probe CREATES A STORED QUERY on the GeoServer instance, CHECKS THAT IT EXISTS, AND THEN DELETES IT. That is a vulnerability confirmation technique - it proves the server is exploitable without delivering a payload - and it is a GIFT to defenders, because a create-verify-delete cycle against stored queries from an unauthenticated source is not something a legitimate map client ever does. Combine that with two more free searches: unauthenticated requests whose path or body contains a PREFIXED SERVICE NAME such as 'x/WFS' (the CVE-2026-129243 signature), and GetFeatureById requests containing file:// , http:// to internal addresses, 169.254.169.254 or external hosts (the CVE-2026-120705 signature). Those three searches cover the front of the chain and cost nothing but a WAF or proxy log query. NO ATTACKER IP ADDRESSES, DOMAINS OR HASHES HAVE BEEN PUBLISHED - watchTowr's original post is the place such a list would appear and none of the available summaries reproduces one - so behaviour is what you have, and in this case behaviour is enough.\n\nREMEDIATION IS UNAMBIGUOUS, WHICH IS RARE IN THIS REPORT. Upgrade to 2.27.7, 2.28.6 or 3.0.2 depending on your branch. Every source agrees on those three numbers, which is notable given how often version strings conflict in this feed. AND THEN DO THE THING MOST ORGANISATIONS WILL SKIP: because CVE-2026-129245 is a PREDICTABLE REMEMBER-ME SIGNING KEY, an attacker who touched a vulnerable instance may hold forgeable administrator sessions that SURVIVE THE UPGRADE. The advisory guidance is to CHANGE ADMINISTRATOR PASSWORDS where exposure is suspected. Upgrading without rotating administrator credentials and invalidating remember-me tokens is not remediation; it is a version number.\n\nONE FINAL NOTE ON COUNTING, BECAUSE IT WILL CONFUSE ANYONE READING MULTIPLE SOURCES THIS WEEKEND. The November GeoServer advisory set is described as five CVEs by
