ealistically deploy firmware.","Treat the 2023 CVE identifiers as the governance finding. Two of these were fixable for roughly three years before exploitation was recorded. If your OT estate has no patch cycle and no owner, that is the item to escalate - the specific CVEs are a symptom."],"references":["https://www.cisa.gov/news-events/alerts/2026/11/25/cisa-adds-10-known-exploited-vulnerabilities-catalog","https://cybersecuritynews.com/danfoss-refrigeration-controller-flaw","https://www.cisa.gov/news-events/ics-advisories","https://thehackernews.com/2026/11/hackers-exploit-10-vulnerabilities.html","https://www.it-connect.tech/cisa-flags-10-exploited-flaws-in-danfoss-mitel-juniper-and-xen-orchestra/","https://securityonline.info/cisa-kev-catalog-micollab-juniper-danfoss/","https://cyberscoop.com/uk-ncsc-ai-assisted-cyberattacks/","https://www.infosecurity-magazine.com/news/ncsc-warning-severe-cyberattacks/","https://www.cisa.gov/known-exploited-vulnerabilities-catalog"],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"Find the refrigeration controllers nobody told IT about","description":"The inventory question first, because most organisations with these devices cannot answer it. Looks for OT-style management traffic and HTTP services on segments that should not have them.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where DestinationHostName has_any (\"ak-sm\", \"danfoss\", \"refrig\", \"chiller\", \"coldroom\", \"hvac\", \"bms\") \n   or DeviceCustomString1 has_any (\"danfoss\", \"ak-sm\")\n   or (DestinationPort in (80, 443, 502, 1025, 5000, 8080) and SourceIP startswith \"10.\" and DestinationHostName has_any (\"plant\", \"store\", \"site\", \"facil\"))\n| summarize Sessions = count(), Ports = make_set(DestinationPort, 10), Sources = dcount(SourceIP), ExternalSources = dcountif(SourceIP, not(ipv4_is_private(SourceIP))) by DestinationIP, DestinationHostName\n| order by ExternalSources desc, Sessions desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Internet-reachable OT and building management devices - the only control that works here","description":"CVE-2026-129713 has NO PATCH. Internet reachability is therefore the whole risk. This finds inbound sessions from public addresses to internal OT-style hosts.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where not(ipv4_is_private(SourceIP)) and ipv4_is_private(DestinationIP)\n| where DestinationPort in (80, 443, 502, 102, 1911, 4911, 44818, 20000, 5000, 8080, 8443)\n| summarize InboundSessions = count(), SourceCountries = dcount(SourceIP), Sources = make_set(SourceIP, 30), Ports = make_set(DestinationPort, 10), Actions = make_set(DeviceAction, 5), FirstSeen = min(TimeGenerated) by DestinationIP, DestinationHostName\n| where InboundSessions > 0\n| order by SourceCountries desc"},{"platform":"sentinel","table":"Syslog","name":"Refrigeration setpoint and alarm configuration changes outside maintenance windows","description":"The impact detection. The damage pattern is changed setpoints WITH suppressed alarms, so a configuration change outside a maintenance window is the signal - and alarm suppression is the part that matters most.","query":"Syslog\n| where TimeGenerated > ago(30d)\n| where SyslogMessage has_any (\"setpoint\", \"set point\", \"defrost\", \"alarm\", \"threshold\", \"temperature\", \"ak-sm\", \"danfoss\")\n| where SyslogMessage has_any (\"changed\", \"modified\", \"updated\", \"disabled\", \"suppressed\", \"acknowledged\", \"configuration\", \"write\", \"login\")\n| extend HourUTC = datetime_part(\"hour\", TimeGenerated), DayOfWeek = dayofweek(TimeGenerated)\n| extend OutsideMaintenanceWindow = HourUTC \u003c 6 or HourUTC > 19 or DayOfWeek in (0d, 6d)\n| project TimeGenerated, Computer, OutsideMaintenanceWindow, SyslogMessage\n| order by OutsideMaintenanceWindow desc, TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"First-seen outbound destinations from OT devices - high fidelity because OT is predictable","description":"An office endpoint contacting a new destination means nothing. An OT controller doing it means a great deal, because its traffic profile should be almost static. This is the easiest high-quality detection in the OT space.","query":"let OTHosts = CommonSecurityLog\n  | where TimeGenerated > ago(60d)\n  | where DestinationHostName has_any (\"ak-sm\", \"danfoss\", \"refrig\", \"chiller\", \"bms\", \"hvac\")\n  | distinct Host = DestinationIP;\nlet Baseline = CommonSecurityLog\n  | where TimeGenerated between (ago(60d) .. ago(14d))\n  | where SourceIP in (OTHosts)\n  | distinct SourceIP, DestinationIP;\nCommonSecurityLog\n| where TimeGenerated > ago(14d)\n| where SourceIP in (OTHosts)\n| where not(ipv4_is_private(DestinationIP))\n| join kind=leftanti Baseline on SourceIP, DestinationIP\n| summarize Sessions = count(), Ports = make_set(DestinationPort, 10), FirstSeen = min(TimeGenerated), Bytes = sum(toreal(SentBytes)) by SourceIP, DestinationIP\n| order by FirstSeen desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Corporate endpoints reaching refrigeration or building management segments","description":"The pivot question in reverse. If an unauthenticated RCE on a controller is the foothold, this finds the lateral movement into or out of the OT segment that segmentation should prevent.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemotePort in (502, 102, 1911, 4911, 44818, 20000, 8080, 8443)\n| where ipv4_is_private(RemoteIP)\n| summarize Connections = count(), Targets = dcount(RemoteIP), TargetList = make_set(RemoteIP, 25), Ports = make_set(RemotePort, 10) by DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName\n| order by Targets desc"}],"iocs":[{"type":"behaviour","value":"A Danfoss AK-SM 800A or AK-SM 8xxA refrigeration system manager reachable from a public IP address","context":"The entire risk for CVE-2026-129713, because there is NO PATCH. Internet reachability is the control to remove today; there is no alternative available.","confidence":"high","source":"Analyst assessment based on CISA ICSA-26-328-03 and the absence of a fix"},{"type":"behaviour","value":"Refrigeration setpoint, defrost cycle or alarm threshold changes outside a maintenance window, especially combined with alarm suppression or disablement","context":"The real damage pattern. Changed setpoints alone are detectable by any operator; changed setpoints with suppressed alarms are not, which is why alarm integrity is the thing to verify out of band.","confidence":"high","source":"Analyst assessment based on AK-SM functionality"},{"type":"behaviour","value":"An OT or building management controller contacting an external destination it has never contacted before","context":"High fidelity precisely because OT traffic profiles are almost static. The same event on an office endpoint means nothing; here it means a great deal.","confidence":"high","source":"Analyst assessment"},{"type":"ttp","value":"Unauthenticated remote code execution against an internet-reachable refrigeration system manager, enabling setpoint manipulation with alarm suppression and providing a pivot into a flat site network","context":"The complete attack. The pivot is the part most defenders miss, because the device gets classified as 'just the fridges' and the network was never segmented.","confidence":"high","source":"CISA ICSA-26-328-03 and analyst assessment"},{"type":"note","value":"CVE-2026-129713: CVSS 9.8, unauthenticated RCE on AK-SM 8xxA versions 5.4.0 and earlier, NO PATCH - fix only 'planned' for version 5.5.x with NO RELEASE DATE","context":"The worst flaw in the family is the one that cannot be patched. Network control is the only available answer, and it needs a formal risk acceptance with a named owner.","confidence":"high","source":"CISA ICSA-26-328-03 via secondary reporting"},{"type":"note","value":"TWO OF THE THREE KEV-LISTED FLAWS HAVE 2023 CVE IDENTIFIERS: CVE-2023-25914 and CVE-2023-25915","context":"Fixable for roughly three years before exploitation was recorded. This is the NCSC's 24 November finding in concrete form: nothing new is being exploited, only faster.","confidence":"high","source":"CISA KEV, 25 November 2026"},{"type":"note","value":"DEADLINE SPLIT: CVE-2023-25914 and CVE-2023-25915 fall under 28 NOVEMBER; CVE-2025-41450 is reported due 9 DECEMBER","context":"Do not let the later date on one CVE become the planning date for all three.","confidence":"medium","source":"Secondary reporting of the 25 November KEV batch"},{"type":"note","value":"THE NCSC HAS CONFIRMED that a small number of UK organisations may have been affected and that vulnerable technology was exploited in a small number of cases; Pen Test Partners ran a covert three-week operation to patch British refrigeration estates","context":"A UK national authority confirming exploitation against UK targets. This is why a refrigeration controller flaw sits in a UK-focused threat intelligence report.","confidence":"high","source":"NCSC statements and Pen Test Partners reporting via secondary sources"},{"type":"note","value":"CISA ICS advisories ICSA-26-328-02 (AK-SM 8xxA Series) and ICSA-26-328-03 (CVE-2026-129713) were published 24 November 2026","context":"The ICS advisory track is separate from KEV. CVE-2026-129713 is documented in an advisory but is NOT in KEV and has no confirmed exploitation.","confidence":"high","source":"CISA ICS advisories index"},{"type":"note","value":"Impact extends beyond food: NHS and public sector pharmacy cold storage, vaccine fridges and laboratory refrigeration commonly use the same controller families and the same contractor model","context":"Loss of a vaccine or research sample batch is the worst realistic outcome, and it is a different conversation from food spoilage.","confidence":"medium","source":"Analyst assessment"},{"type":"note","value":"NO attacker IP, domain, hash or YARA rule published and NO actor attributed for any of the four Danfoss CVEs","context":"Detection is exposure-based and behavioural. The inventory question - do you even have these devices - is the one that blocks everything else.","confidence":"high","source":"Analyst assessment across reviewed sources"}]},{"rank":8,"id":"TI-2026-11-27-008","title":"THE LEAK CLOCK RUNS OUT NEXT WEDNESDAY: N0n Has Listed hmv, Next plc and 20+ Others Including Mattel and USA Today Publisher Gannett as 'NOT PAID, EXPOSED' With a Countdown to Roughly 2 DECEMBER - and Five Retail Listings Share IDENTICAL Wording About Shopper SEARCH SESSIONS, Which Points at an Unnamed Shared E-Commerce Search Provider Nobody Has Identified","cve_ids":[],"vendor":"N0n (extortion group); hmv; Next plc; Torrid; Mattel; Gannett / USA Today","affected_products":["hmv - claimed shopper search session and navigation data","Next plc - claimed data; Next separately disclosed an incident at an unnamed online supplier on 23 November","Torrid and two further unnamed retailers carrying identical listing wording","Mattel, Gannett / USA Today (166 million records claimed) and approximately 17 other organisations","INFERRED AND UNNAMED: a shared e-commerce search, site-search or merchandising provider common to the five retailers"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-18","last_updated":"2026-11-27","confidence":"medium","summary":"THE DATE TO PUT IN YOUR DIARY IS WEDNESDAY 2 DECEMBER. BreachNews reviewed the N0n leak site on 25 November and found the new entries marked 'NOT PAID, EXPOSED' with a countdown to publication around 2 December 2026. The listing names more than twenty organisations including UK retailers hmv and Next plc, US retailer Torrid, Mattel, and Gannett - publisher of USA Today - against which N0n claims 166 MILLION RECORDS. Nothing has been independently verified, no sample data has been released, and no listed company has confirmed a breach.\n\nTHE ANALYTICAL FINDING IN THIS ENTRY IS THE IDENTICAL WORDING, AND IT IS THE MOST USEFUL THING IN IT. Five retail listings - hmv and Torrid among them - use IDENTICAL WORDING describing SHOPPER SEARCH SESSIONS, SEARCH QUERIES, and REVENUE AND CONVERSION FIGURES TIED TO THOSE SEARCHES. That is not a description of a retailer's own customer database. It is a description of the output of an e-commerce SITE-SEARCH, SEARCH-MERCHANDISING OR SEARCH-ANALYTICS PLATFORM: the kind of SaaS product that sits inside a retailer's product listing pages, records what shoppers type into the search box, and reports back on which queries converted. Two independent write-ups reach the same inference - that the matching wording points to a shared outside provider that N0n has NOT NAMED. If that inference is right, this is not twenty-plus separate intrusions. It is ONE supplier compromise being monetised as twenty-plus listings, and every retailer using that provider is affected whether or not it appears on the leak site today.\n\nWHICH IS WHY THE ACTION HERE IS A SUPPLIER QUESTION, NOT AN INCIDENT RESPONSE. If you are a UK retailer, the useful thing to do before 2 December is not to watch the leak site. It is to list every third-party service embedded in your product search and product listing pages - site search, search merchandising, personalisation, recommendations, search analytics, A/B testing on search results - identify who the provider is, and ask them directly and in writing whether they have had an incident. The organisations that will be surprised next Wednesday are the ones that cannot produce that list today.\n\nDO NOT CONFLATE THE NEXT PLC THREADS, BECAUSE THE PUBLIC RECORD DOES NOT. Next plc disclosed on 23 November 2026 that one of its ONLINE SUPPLIERS had suffered a cyber incident, said investigations were ongoing, said current evidence indicated NO CUSTOMER PERSONAL DATA had been compromised, said its own systems were unaffected, and declined to name the supplier or specify what data was accessed. Next told the market the data was 'benign' and unusable for fraud. Separately, N0n listed Next plc on 25 November. NEXT HAS NOT NAMED THE SUPPLIER AND HAS NOT LINKED ITS DISCLOSURE TO N0n. The two accounts may describe the same files or they may not, and at least one write-up says so explicitly. Record them as two threads with a plausible but unestablished connection.\n\nTHE ACTOR'S CREDIBILITY IS GENUINELY IN QUESTION, AND THE DIRECTION OF THE DOUBT MATTERS. Bitdefender reported that the N0n leak site listed FAR MORE VICTIMS than the group's own exposed file server showed it had actually targeted. For the headline Gannett claim, no sample data has been released and USA Today has not confirmed a breach. So the base rate for inflation in this group's listings is documented, not assumed. The honest reading: the 166 million figure and some of the twenty-plus listings are likely overstated, while the identical-wording cluster is the part of the claim that looks structurally credible, because inventing five separate listings that happen to share a precise and unusual data description would be a strange thing to do.\n\nA SECOND UK EXTORTION LISTING IN THE SAME WINDOW, WITH THE SAME DEADLINE. The Silentvault group listed THE NEIL JONES FOOD COMPANY, a UK firm, on 25 November 2026, claiming 94.8 GB exfiltrated with a stated deadline of 2 DECEMBER 2026 - the same date as the N0n countdown. The aggregator notes Silentvault is an emerging group and that the claim should be treated with caution. Two unrelated groups with UK victims and the same deadline is coincidence rather than coordination, but it means next Wednesday is a date on which multiple UK organisations may be publicly leaked.\n\nAND THE UK PATTERN THIS CONFIRMS FOR THE SIXTH TIME THIS MONTH. Every confirmed UK consumer-facing compromise disclosed in November 2026 originated at a THIRD PARTY, not at the named brand: Optimizely's signup flow serving malicious JavaScript from its own CDN to at least 178 organisations including the BBC, HSBC, TalkTalk, Zoom, IKEA, Salesforce and CNN; ASOS via third-party communications platforms; Next plc via an unnamed online supplier; TfL Oyster; London Gatwick Airport via Times24 UK Limited (rank 9 of this report); and Halfords, which stated the breach hit a third-party digital service and was limited to product information and some employee usernames, not its own systems. Not one of these organisations was breached at its own perimeter. In at least three the supplier was never named publicly - which is the difference between a scopable incident and an unscopable one.","recommended_actions":["IF YOU ARE A UK RETAILER, DO THIS BEFORE WEDNESDAY 2 DECEMBER: produce a written list of every third-party service embedded in your product search and product listing pages - site search, search merchandising, personalisation, recommendations, search analytics, A/B testing on search results. Identify the provider behind each. The organisations that get surprised next week are the ones that cannot produce this list today.","Then ask those providers directly and in writing whether they have suffered an incident affecting shopper search session data, search queries, or revenue and conversion data. The identical wording across five retail listings is the strongest available signal that one unnamed provider is the common point, and you will not be told proactively.","Diarise 2 December 2026. Two separate extortion groups - N0n and Silentvault - have countdowns to roughly that date covering UK organisations. Have your communications, legal and ICO notification positions prepared in advance rather than drafted on the day.","Do NOT conflate the Next plc threads in any internal or external record. Next disclosed a supplier incident on 23 November and called the data benign; N0n listed Next on 25 November; Next has not named the supplier and has not linked the two. A plausible connection is not an established one.","Weight the claims honestly. Bitdefender found N0n's leak site listed far more victims than its own exposed file server showed it had targeted, and no sample data has been published for the 166 million Gannett claim. Treat volumes as marketing and the identical-wording cluster as the structurally credible part.","Assess what shopper search data actually is for your organisation before deciding it is low impact. Search queries can contain names, addresses, order numbers, email addresses and - for pharmacy, health and specialist retail - inferences about medical conditions. 'Just search data' and 'benign' are assessments that need testing against your own field-level reality, not accepting.","Review your contractual position with any identified provider now: breach notification clauses, audit rights, sub-processor lists, data retention and whether their logs would even let you establish what was taken. The notification clause is the thing that determines whether you learn from them or from a leak site.","Check whether the same provider appears in your corporate sites, your mobile apps and your partner or franchise estates, not only your main web storefront. Embedded SaaS is typically deployed per-property, and the property nobody owns is the one that stays on an old integration.","Brief your customer service and fraud teams before 2 December. If data is published, you will see an immediate rise in customers asking whether they are affected, and a parallel rise in fraudsters using the publication as a pretext.","Record in your risk register that the November 2026 UK pattern is SIX FOR SIX on third-party origin - Optimizely, ASOS, Next, TfL, Gatwick and Halfords - and that in at least three cases the supplier was never named. If your supplier assurance process cannot enumerate who is embedded in your customer-facing pages, that is the finding, not any individual listing."],"references":["https://breachnews.com/breaches/n0n-mattel-gannett-leak-site-claims/","https://startupfortune.com/n0n-says-it-holds-166-million-usa-today-records-and-sets-a-leak-deadline/","https://www.forbes.com/sites/larsdaniel/2026/11/26/usa-today-data-breach-claim-hackers-say-they-have-166-million-records/","https://www.2-spyware.com/usa-today-n0n-166-million-records-claim","https://www.ransomware.live/group/N0n","https://www.provendata.com/blog/n0n-ransomware","https://www.ransomware.live/id/VEhFIE5FSUwgSk9ORVMgRk9PRCBDT01QQU5ZQFNpbGVudFZhdWx0","https://hackread.com/uk-retailer-next-cyber-incident-online-supplier/","https://www.insurancejournal.com/news/international/2026/11/23/893480.htm","https://ww.fashionnetwork.com/news/Uk-s-next-flags-cyber-breach-at-online-supplier-says-no-customer-data-compromised,1887412.html","https://road.cc/news/halfords-hacked-by-international-extortion-gang-but-retailer-insists-no-customer-data-was-stolen"],"kql":[{"platform":"sentinel","table":"AzureDiagnostics","name":"Enumerate third-party scripts embedded in your product search and listing pages","description":"The inventory query that underpins everything else in this entry. Surfaces the external script origins loaded by your storefront - site search, merchandising, personalisation and analytics providers - including ones added by a tag manager without a change ticket.","query":"AzureDiagnostics\n| where TimeGenerated > ago(30d)\n| where Category in (\"ApplicationGatewayAccessLog\", \"FrontdoorAccessLog\")\n| where requestUri_s has_any (\"/search\", \"/catalogsearch\", \"/s?\", \"q=\", \"/products\", \"/plp\")\n| extend Referer = tostring(parse_json(tostring(requestHeaders_s)).Referer)\n| summarize Requests = count(), Clients = dcount(clientIp_s), Paths = make_set(requestUri_s, 20) by host_s, Referer\n| order by Requests desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connections from storefront and CMS hosts to third-party SaaS","description":"Server-side integrations are invisible in page source. If your platform calls a search or merchandising API server to server, this is where the provider shows up - and it is the integration most likely to be undocumented.","query":"let Storefront = DeviceInfo\n  | where Timestamp > ago(30d)\n  | where DeviceName has_any (\"web\", \"www\", \"shop\", \"store\", \"ecom\", \"commerce\", \"cms\", \"magento\", \"sfcc\")\n  | distinct DeviceId;\nDeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where DeviceId in (Storefront)\n| where isnotempty(RemoteUrl) and not(ipv4_is_private(RemoteIP))\n| summarize Connections = count(), BytesSent = sum(toreal(coalesce(RemotePort, 0))), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by RemoteUrl, InitiatingProcessFileName\n| order by Connections desc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"Bulk extraction against search and product APIs","description":"If the compromise was at the provider, nothing fires in your logs. If it was at your own search API, it looks like this: one client, enormous query volume, high result counts.","query":"AzureDiagnostics\n| where TimeGenerated > ago(45d)\n| where Category in (\"ApplicationGatewayAccessLog\", \"FrontdoorAccessLog\")\n| where requestUri_s has_any (\"/api/search\", \"/search\", \"/catalogsearch\", \"/graphql\", \"/rest/\", \"/autocomplete\", \"/suggest\")\n| summarize Requests = count(), DistinctQueries = dcount(requestUri_s), BytesOut = sum(toreal(sentBytes_d)), UserAgents = make_set(userAgent_s, 5) by clientIp_s, bin(TimeGenerated, 1h)\n| where Requests > 2000 or BytesOut > 536870912\n| order by Requests desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Extortion and breach-notification pretexts aimed at your staff and customers","description":"Run before 2 December. A publicised leak deadline is followed by both direct extortion mail to executives and 'was your data affected' phishing to customers.","query":"let Themes = dynamic([\"n0n\",\"leak site\",\"your data has been\",\"we have your data\",\"data will be published\",\"ransom\",\"deadline\",\"was your data affected\",\"breach notification\"]);\nEmailEvents\n| where Timestamp > datetime(2026-11-24)\n| where Subject has_any (Themes)\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 15), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderFromAddress\n| order by Messages desc"},{"platform":"sentinel","table":"SigninLogs","name":"Third-party and service principal access to commerce platforms","description":"Supplier compromise reaches you through the integration credential. This surfaces service principals and external identities authenticating into your commerce estate, with anomalous source addresses highlighted.","query":"SigninLogs\n| where TimeGenerated > ago(60d)\n| where AppDisplayName has_any (\"commerce\", \"search\", \"merchand\", \"personal\", \"recommend\", \"analytics\", \"optimiz\", \"tag manager\")\n   or ServicePrincipalName != \"\"\n| summarize Signins = count(), Successes = countif(ResultType == \"0\"), IPs = make_set(IPAddress, 25), Countries = make_set(tostring(LocationDetails.countryOrRegion), 10), FirstSeen = min(TimeGenerated) by AppDisplayName, ServicePrincipalName, UserPrincipalName\n| order by Signins desc"}],"iocs":[{"type":"behaviour","value":"Third-party site-search, search-merchandising, personalisation, recommendation or search-analytics scripts and server-side API integrations embedded in product search and product listing pages","context":"The thing to enumerate before 2 December. The identical wording across five retail listings points at one unnamed shared provider, and every retailer using it is affected whether or not it is listed today.","confidence":"medium","source":"Analyst assessment based on the identical listing wording identified by BreachNews and Startup Fortune"},{"type":"ttp","value":"Single upstream supplier compromise monetised as twenty-plus separate leak-site listings, with the supplier deliberately unnamed to prevent downstream victims from scoping their exposure","context":"If the shared-provider inference is right, this is one intrusion sold as twenty. Keeping the supplier unnamed is what makes it unscopable for the listed brands.","confidence":"medium","source":"Analyst assessment"},{"type":"ttp","value":"Leak-site listings marked 'NOT PAID, EXPOSED' with a publication countdown used as the pressure mechanism","context":"N0n's stated status for the new entries as reviewed on 25 November, counting down to roughly 2 December 2026.","confidence":"high","source":"BreachNews review of the N0n leak site, 25 November 2026"},{"type":"behaviour","value":"Bulk extraction against your own search, autocomplete, suggest or GraphQL product APIs - one client, very high query volume, large response volume","context":"What it looks like if the compromise was at YOUR search API rather than at the provider. If it was at the provider, nothing fires in your logs at all - which is the problem.","confidence":"medium","source":"Analyst assessment"},{"type":"note","value":"DEADLINE: approximately 2 DECEMBER 2026 for the N0n batch including hmv and Next plc","context":"The date to prepare for. Have communications, legal and ICO notification positions ready in advance rather than drafted on the day.","confidence":"medium","source":"BreachNews review of the N0n leak site, 25 November 2026"},{"type":"note","value":"FIVE RETAIL LISTINGS SHARE IDENTICAL WORDING describing shopper search sessions, search queries, and revenue and conversion figures tied to those searches - hmv and Torrid among them","context":"The strongest analytical finding in this entry. That is the output of an e-commerce site-search or search-analytics platform, not a retailer's own customer database. Two independent write-ups reach the same inference.","confidence":"medium","source":"BreachNews and Startup Fortune"},{"type":"note","value":"N0n HAS NOT NAMED THE SHARED PROVIDER, and no provider has been publicly identified in any source reviewed","context":"This is what makes the incident unscopable for the listed brands and is precisely why retailers must enumerate their own search-stack suppliers rather than wait.","confidence":"high","source":"Analyst assessment across reviewed sources"},{"type":"note","value":"DO NOT CONFLATE: Next plc disclosed an incident at an unnamed ONLINE SUPPLIER on 23 November, said no customer personal data was compromised, said its own systems were unaffected and told the market the data was 'benign'; N0n separately listed Next on 25 November. Next has NOT named the supplier and has NOT linked the two.","context":"A plausible connection is not an established one, and at least one write-up says so explicitly. Record them as two threads.","confidence":"high","source":"Next plc disclosure via multiple outlets, and BreachNews/Startup Fortune"},{"type":"note","value":"ACTOR CREDIBILITY IS DOCUMENTED AS QUESTIONABLE: Bitdefender reported that N0n's leak site listed far more victims than the group's own exposed file server showed it had targeted; no sample data has been released for the 166 million Gannett / USA Today claim and USA Today has not confirmed a breach","context":"The base rate for inflation in this group's listings is documented, not assumed. Volumes are marketing; the identical-wording cluster is the structurally credible part.","confidence":"high","source":"Bitdefender reporting via secondary sources, Forbes and 2-Spyware"},{"type":"note","value":"SECOND UK LISTING, SAME DEADLINE: the Silentvault group listed THE NEIL JONES FOOD COMPANY (UK) on 25 November 2026 claiming 94.8 GB exfiltrated, with a stated deadline of 2 DECEMBER 2026","context":"Two unrelated groups with UK victims and the same date. Coincidence rather than coordination, but it means next Wednesday is a date on which multiple UK organisations may be leaked.","confidence":"medium","source":"Ransomware.live listing; the aggregator notes Silentvault is an emerging group and the claim needs caution"},{"type":"note","value":"SIX FOR SIX: every confirmed UK consumer-facing compromise disclosed in November 2026 originated at a THIRD PARTY - Optimizely (178+ organisations including the BBC, HSBC, TalkTalk, Zoom, IKEA, Salesforce and CNN), ASOS, Next plc, TfL Oyster, London Gatwick Airport via Times24 UK Limited, and Halfords. In at least three the supplier was never named publicly.","context":"Not one was breached at its own perimeter, and not one could have prevented it by hardening its own estate. The unnamed-supplier cases are the difference between a scopable incident and an unscopable one.","confidence":"high","source":"Analyst assessment across November 2026 UK disclosures"},{"type":"note","value":"Halfords stated the breach hit a THIRD-PARTY DIGITAL SERVICE, not its own systems, and was limited to product information and some employee usernames; its leak-site listing date is reported as both 20 and 23 November","context":"The listing-date conflict from earlier in the month remains unresolved. Halfords' own characterisation is the reliable part.","confidence":"medium","source":"road.cc reporting and leak-site aggregators"},{"type":"note","value":"Search queries are not automatically low-impact data: they can contain names, addresses, order numbers and email addresses, and for pharmacy, health and specialist retail they support inferences about medical conditions","context":"Test 'just search data' and 'benign' against your own field-level reality before accepting either as an assessment.","confidence":"medium","source":"Analyst assessment"}]},{"rank":9,"id":"TI-2026-11-27-009","title":"UK CRITICAL TRANSPORT, BREACHED THROUGH THE DROP-OFF BARRIER: London Gatwick Has DISABLED Its Automatic Drop-Off Payment System After Unauthorised Access at Supplier Times24 UK Limited's AutoPay Platform - Login Credentials, Contact Details, Vehicle and Drop-Off Records Exposed, Partial Card Data in 'Very Limited Cases', ALL Affected Customers Emailed, and the Full Extent STILL Not Established","cve_ids":[],"vendor":"London Gatwick Airport; Times24 UK Limited","affected_products":["Times24 UK Limited AutoPay - third-party payment platform operating Gatwick's drop-off zones","Gatwick automatic drop-off payment system (DISABLED as a precaution)","Exposed categories: login details, contact information, vehicle records, drop-off records","Partial payment card data in 'very limited cases': card brand, last four digits, expiry date","Gatwick main car parks - reported operating normally"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-24","last_updated":"2026-11-27","confidence":"high","summary":"WHAT HAPPENED AND WHAT HAS CHANGED SINCE YESTERDAY. Times24 UK Limited, the operator of London Gatwick Airport's drop-off zones, reported unauthorised access to AutoPay, a third-party payment system. Gatwick has notified customers, and in this window the operational response has firmed up: GATWICK HAS DISABLED ITS AUTOMATIC DROP-OFF PAYMENT SYSTEM as a precaution to help protect affected accounts. Drop-off zones still function with other payment methods and the main car parks are reported operating normally. ALL AFFECTED CUSTOMERS HAVE BEEN EMAILED. The airport says the investigation has yet to establish the full extent of the unauthorised access, and it cannot say how many customers were affected or how far back the records go.\n\nTHE DATA, STATED PRECISELY, BECAUSE THE PRECISION IS WHERE THE DISPUTE IS. Gatwick's position is that login details, contact information, and vehicle and drop-off records may have been reached, and that PARTIAL CARD PAYMENT INFORMATION was potentially accessed IN SOME VERY LIMITED CASES. The card-related fields are reported as CARD BRAND, LAST FOUR DIGITS AND EXPIRY DATE. That combination is not sufficient on its own to make a card payment. Several UK outlets have nonetheless asserted that bank details were stolen, which Gatwick has not confirmed, and The Register's framing of payment data affected only in 'very limited cases' is closer to the airport's own wording. This conflict carried over from yesterday and remains unresolved. Record the airport's wording; treat the stronger claims as unverified.\n\nBUT DO NOT DISMISS THE DATA SET AS LOW VALUE, BECAUSE THE COMBINATION IS THE PROBLEM. Take the categories together: login credentials for an account, contact details, vehicle registration, drop-off records with timestamps, and partial card data. That is a near-ideal phishing and vishing kit against a specific individual. 'We're calling from Gatwick about your drop-off on the 14th, vehicle REG, the card ending 4512 was declined' is a conversation that defeats most people's scepticism because every verifiable detail in it is true. The last four digits and expiry exist precisely to let a caller prove they are legitimate. Add vehicle registration and journey timestamps and you have a pretext with corroboration built in. The realistic harm from this breach is social engineering, not card-not-present fraud, and the advice given to customers - follow Gatwick's published payment instructions, do not click unsolicited links, do not share full card details - is exactly right for that threat model.\n\nWHY IT IS A UK PUBLIC SECTOR-RELEVANT ENTRY. Gatwick is UK critical national infrastructure in the transport sector. The incident did not touch aviation operations, flight systems or the airport's own core estate - it touched a parking payment supplier. That is the point. The November 2026 UK pattern this feed has tracked all month is that consumer harm arrives through the peripheral supplier that nobody classified as critical, and a drop-off barrier payment platform is about as peripheral as a supplier gets while still holding identity, vehicle and payment data for a very large number of people. Every UK airport, port, rail operator, local authority and NHS trust runs an equivalent: car park payment, visitor management, barrier control, cashless catering, room booking. These are procured by estates and facilities teams, integrated with payment flows, and almost never inside the security assurance perimeter.\n\nWHAT IS STILL UNKNOWN AND WHY IT MATTERS. Gatwick and Times24 have NOT publicly explained how the access happened, how long it lasted, or whether a software flaw or a compromised account was involved. There is no CVE, no actor, no malware family, no infrastructure and no extortion listing. No customer count and no record date range has been published. The absence of a date range is the most operationally significant gap: a customer cannot assess their own exposure without knowing whether the breach covers last month or the last five years, and neither can any organisation whose staff used Gatwick drop-off on expenses.\n\nTHE ONE THING THAT DESERVES CREDIT, BECAUSE IT IS RARE. Gatwick disabled the affected payment system rather than leaving it running while investigating, and emailed all affected customers rather than publishing a notice and waiting. Compare that to the three November cases in rank 8 where the supplier was never named at all. Taking the service down is a real operational and revenue cost at a major airport in the run-up to December, and it is the correct decision.","recommended_actions":["IF YOUR STAFF USE GATWICK DROP-OFF ON EXPENSES, tell them today: Gatwick has emailed affected customers, the automatic drop-off payment system is disabled, and they should expect targeted phone calls and messages referencing their real vehicle registration, real drop-off dates and the real last four digits of their card. Those details being correct is NOT evidence the caller is genuine.","Warn specifically about the vishing pattern, because it is the realistic harm. A caller who can quote your vehicle registration, a drop-off date and your card's last four digits and expiry will be believed. Tell people to hang up and call back on a published number, and never to give full card details or a one-time passcode to an inbound caller.","Anyone who reused their Times24 or AutoPay account password elsewhere should change it now. Login details are among the categories Gatwick says may have been reached, and credential reuse is how a parking platform breach becomes an account takeover somewhere that matters.","Do not restate the 'bank details stolen' framing. Gatwick's position is partial card data - brand, last four digits, expiry - in very limited cases, which is not sufficient to make a payment. Several outlets have gone further than the airport has, and repeating that creates unnecessary alarm and undermines your own credibility.","NOW THE PART THAT APPLIES TO EVERY UK PUBLIC BODY REGARDLESS OF GATWICK: list your own peripheral payment and access suppliers. Car park payment, visitor management, barrier control, cashless catering, room and desk booking, EV charging. Name the provider, name the data, name the internal owner. These are procured by estates and facilities and are almost never inside the security assurance perimeter.","For each of those suppliers, establish three things in writing: what personal and payment data they hold on your behalf, what their breach notification clause actually commits them to and within what timeframe, and whether their logs would let you establish a date range if asked. Gatwick still cannot publish a date range, which is the gap that stops customers assessing their own exposure.","Check whether any of those suppliers can reach your internal network or identity provider. A parking platform holding data is one risk; a parking platform with a VPN tunnel or a federated identity trust into your estate is a different and larger one.","If you operate a similar public-facing payment service, decide NOW what your threshold is for taking it offline during an investigation. Gatwick took the revenue hit at a major airport going into December. Making that decision under pressure without a pre-agreed threshold is how services stay up when they should not.","Monitor for Gatwick, Times24 and AutoPay-themed phishing domains and inbound mail, and for the same pattern against your own brand if you run an equivalent service. Named incidents produce impersonation waves within days.","Add this to your record of the November 2026 UK third-party pattern alongside Optimizely, ASOS, Next, TfL and Halfords. Six confirmed UK consumer-facing compromises this month, all originating at a third party, none at the named brand's own perimeter. That is the governance argument for extending supplier assurance to the peripheral estate."],"references":["https://www.theregister.com/security/2026/11/25/gatwick-drop-off-customers-personal-data-exposed-in-supplier-breach/5312060","https://www.lbc.co.uk/article/gatwick-airport-drop-off-payment-system-disabled-after-customer-data-breach-5HjdnWY_2/","https://uk.news.yahoo.com/gatwick-customers-personal-data-potentially-202335225.html","https://www.ibtimes.co.uk/gatwick-autopay-unauthorised-access-customer-data-1834732","https://travelradar.aero/gatwick-airport-cyberattack-affects-customers/","https://uk.headtopics.com/news/gatwick-drop-off-customers-personal-data-exposed-in-90173731"],"kql":[{"platform":"defender_xdr","table":"EmailEvents","name":"Gatwick, Times24 and AutoPay-themed phishing reaching your staff","description":"The realistic harm from this breach is social engineering, so this is the detection that matters. Named incidents produce brand-impersonation waves within days of disclosure.","query":"let Themes = dynamic([\"gatwick\",\"times24\",\"autopay\",\"drop-off\",\"drop off charge\",\"airport parking\",\"parking payment\",\"unpaid charge\"]);\nEmailEvents\n| where Timestamp > datetime(2026-11-24)\n| where Subject has_any (Themes) or SenderFromDomain has_any (\"gatwick\",\"times24\",\"autopay\",\"parking\")\n| where not(SenderFromDomain in~ (\"gatwickairport.com\", \"times24.co.uk\"))\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 15), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderFromAddress, SenderIPv4\n| order by Messages desc"},{"platform":"sentinel","table":"_Im_Dns","name":"Lookups to Gatwick, Times24 and AutoPay lookalike domains","description":"Catches the infrastructure side before the mail side fires, and catches links delivered by SMS or messaging apps that never touch your mail gateway.","query":"let Terms = dynamic([\"gatwick\",\"times24\",\"autopay\",\"auto-pay\",\"dropoff\",\"drop-off\",\"airportparking\"]);\n_Im_Dns\n| where TimeGenerated > datetime(2026-11-24)\n| where DnsQuery has_any (Terms)\n| where not(DnsQuery has_any (\"gatwickairport.com\", \"times24.co.uk\"))\n| summarize Lookups = count(), Clients = dcount(SrcIpAddr), ClientList = make_set(SrcIpAddr, 25), FirstSeen = min(TimeGenerated) by DnsQuery\n| order by FirstSeen desc"},{"platform":"sentinel","table":"SigninLogs","name":"Credential reuse fallout - password spray and anomalous sign-ins after a supplier credential breach","description":"Login details were among the exposed categories. Credential reuse is how a parking platform breach becomes an account takeover somewhere that matters.","query":"SigninLogs\n| where TimeGenerated > datetime(2026-11-24)\n| where ResultType in (\"50126\", \"50053\", \"50055\", \"50056\", \"0\")\n| summarize Attempts = count(), Failures = countif(ResultType != \"0\"), Successes = countif(ResultType == \"0\"), TargetedAccounts = dcount(UserPrincipalName), Accounts = make_set(UserPrincipalName, 20) by IPAddress, AppDisplayName, tostring(LocationDetails.countryOrRegion)\n| where TargetedAccounts >= 5\n| extend SuccessAfterFailures = Successes > 0 and Failures > 10\n| order by SuccessAfterFailures desc, TargetedAccounts desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Inventory your own peripheral payment and access suppliers","description":"The transferable action from this incident. Surfaces network connections to car park payment, visitor management, barrier control, cashless catering and EV charging platforms - the estate-and-facilities suppliers that sit outside the security assurance perimeter.","query":"let SupplierTerms = dynamic([\"parking\",\"autopay\",\"barrier\",\"anpr\",\"visitor\",\"catering\",\"cashless\",\"evcharg\",\"ev-charg\",\"booking\",\"access-control\",\"intercom\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(45d)\n| where DestinationHostName has_any (SupplierTerms) or RequestURL has_any (SupplierTerms)\n| summarize Sessions = count(), BytesOut = sum(toreal(SentBytes)), Sources = dcount(SourceIP), Ports = make_set(DestinationPort, 10), FirstSeen = min(TimeGenerated) by DestinationHostName, DestinationIP\n| order by BytesOut desc"},{"platform":"sentinel","table":"AuditLogs","name":"Supplier service principals and guest identities with tenant access","description":"The escalation question. A supplier holding your data is one risk; a supplier with a federated trust or service principal in your tenant is a different and larger one.","query":"AuditLogs\n| where TimeGenerated > ago(180d)\n| where OperationName has_any (\"Add service principal\", \"Add OAuth2PermissionGrant\", \"Consent to application\", \"Add app role assignment\", \"Invite external user\")\n| extend Target = tostring(TargetResources[0].displayName)\n| project TimeGenerated, OperationName, Target, InitiatedBy = tostring(InitiatedBy.user.userPrincipalName), Result\n| order by TimeGenerated desc"}],"iocs":[{"type":"ttp","value":"Vishing and phishing using genuine breach data as corroboration - quoting a real vehicle registration, a real drop-off date and timestamp, and the real last four digits and expiry of the victim's card","context":"The realistic harm from this breach. The exposed field combination exists precisely to let a caller prove legitimacy, so every verifiable detail in the pretext is true. This is why the data set is not low-value despite the card data being insufficient for payment.","confidence":"high","source":"Analyst assessment based on the data categories Gatwick has disclosed"},{"type":"behaviour","value":"Inbound mail or DNS lookups for Gatwick, Times24, AutoPay, drop-off or airport-parking themed domains that are not gatwickairport.com or times24.co.uk","context":"Named incidents produce brand-impersonation waves within days. DNS catches links delivered by SMS or messaging apps that never reach the mail gateway.","confidence":"medium","source":"Analyst assessment"},{"type":"behaviour","value":"Password spray or anomalous successful sign-ins following a supplier credential exposure","context":"Login details were among the exposed categories. Credential reuse turns a parking platform breach into an account takeover somewhere consequential.","confidence":"medium","source":"Analyst assessment"},{"type":"note","value":"GATWICK HAS DISABLED its automatic drop-off payment system as a precaution; drop-off zones still work with other payment methods and the main car parks are reported operating normally","context":"The firmest operational development in this window, and it deserves credit - taking the revenue hit at a major airport going into December is the correct decision and a rare one.","confidence":"high","source":"LBC, The Register and other UK outlets, 24-25 November 2026"},{"type":"note","value":"ALL AFFECTED CUSTOMERS HAVE BEEN EMAILED, but the investigation has NOT established the full extent of the unauthorised access","context":"Direct notification without waiting for full scope. Compare with the three November UK cases where the supplier was never named at all.","confidence":"high","source":"Gatwick statements via multiple UK outlets"},{"type":"note","value":"EXPOSED CATEGORIES per Gatwick: login details, contact information, vehicle records and drop-off records; PARTIAL card payment information in 'some very limited cases' - card brand, last four digits and expiry date","context":"That card combination is NOT sufficient on its own to make a payment. Record this wording rather than the stronger press framing.","confidence":"high","source":"Gatwick statements and Travel Radar reporting"},{"type":"note","value":"CONFLICT UNRESOLVED: several UK outlets assert bank details were stolen; Gatwick has NOT confirmed this and The Register's 'very limited cases' framing is closer to the airport's own wording","context":"Carried over from yesterday. Do not restate the stronger claim - it causes unnecessary alarm and undermines your own credibility.","confidence":"high","source":"Analyst assessment across UK reporting"},{"type":"note","value":"NO customer count and NO record date range has been published, and Gatwick says it cannot say how far back the records go","context":"The most operationally significant gap. Without a date range a customer cannot assess their own exposure, and neither can an employer whose staff used Gatwick drop-off on expenses.","confidence":"high","source":"Gatwick statements via multiple UK outlets"},{"type":"note","value":"NO vector published: Gatwick and Times24 have not explained how the access happened, how long it lasted, or whether a software flaw or a compromised account was involved. No CVE, no actor, no malware, no infrastructure, no extortion listing.","context":"There is nothing to hunt on the intrusion side. All available action is on the customer-protection and supplier-inventory side.","confidence":"high","source":"Analyst assessment across reviewed sources"},{"type":"note","value":"THE TRANSFERABLE FINDING: Gatwick is UK critical national infrastructure, and the breach reached it through a drop-off barrier payment supplier - not aviation operations, not flight systems, not its own core estate","context":"Every UK airport, port, rail operator, local authority and NHS trust runs an equivalent: car park payment, visitor management, barrier control, cashless catering, room booking. Procured by estates and facilities, integrated with payment flows, almost never inside the security assurance perimeter.","confidence":"high","source":"Analyst assessment"}]},{"rank":10,"id":"TI-2026-11-27-010","title":"THE DEADLINE WALL: ELEVEN EXPLOITED FLAWS ACROSS SEVEN UNRELATED PRODUCT FAMILIES ARE DUE TODAY OR TOMORROW, FOUR ARE ALREADY OVERDUE, AND ONE OF TODAY'S - Idunno.AntiCsrf CVE-2026-131914 - CANNOT BE MET BY PATCHING BECAUSE THERE IS NO PATCH AND THERE NEVER WILL BE. A Nine-Line Checklist You Can Answer Yes or No To Before Monday","cve_ids":["CVE-2026-131914","CVE-2026-132165","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-103406","CVE-2026-133469","CVE-2026-133323","CVE-2023-25914","CVE-2023-25915","CVE-2026-123890","CVE-2026-76466"],"vendor":"Multiple - Drupal, Idunno, Optimizely, Project MONAI, N-able, HPE Juniper, Vates, Mitel, Danfoss, Broadcom VMware, Cisco","affected_products":["Drupal core (CVE-2026-132165) - due 27 November, forensic triage required","Idunno.AntiCsrf for ASP.NET (CVE-2026-131914) - due 27 November, NO PATCH, NO FIX EVER","Optimizely Web Experimentation (CVE-2026-132224) - due 27 November","Project MONAI Label (CVE-2026-133968) - path traversal, KEV added 23 November, OVERDUE","N-able Mail Assure / MailAssure (CVE-2026-134624) - SSRF, KEV added 23 November, OVERDUE","HPE Juniper Session Smart Conductor and Router (CVE-2026-103406) - due 28 November","Vates Xen Orchestra (CVE-2026-133469) - due 28 November","Mitel MiCollab AWV, four of five CVEs (CVE-2026-133323 and others) - due 28 November","Danfoss AK-SM 800A (CVE-2023-25914, CVE-2023-25915) - due 28 November","Broadcom VMware vCenter (CVE-2026-123890) and Cisco Expressway (CVE-2026-76466) - OVERDUE"],"category":"vulnerability_bundle","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-27","patch_available":"partial","first_reported":"2026-11-20","last_updated":"2026-11-27","confidence":"high","summary":"THIS ENTRY EXISTS BECAUSE THE CALENDAR IS NOW THE THREAT. Three KEV deadlines bracket today and tomorrow. Three CVEs are due TODAY, 27 NOVEMBER. Eight are due TOMORROW, 28 NOVEMBER. At least four are already OVERDUE. The affected product families have nothing in common - a PHP CMS, an ASP.NET anti-CSRF library, an A/B testing platform, a medical imaging annotation tool, an email security gateway, an SD-WAN controller, a hypervisor management console, a unified communications platform, a refrigeration controller, a virtualisation platform and a video conferencing gateway. No common vendor, no common technology, no common owner inside most organisations. That is the real problem: there is no single team that can be told to fix this, which is precisely how deadline collisions produce silent misses.\n\nDUE TODAY, 27 NOVEMBER:\n- CVE-2026-132165, Drupal core, anonymous pre-auth RCE through the installer. KEV added 24 November. The entry is reported to require FORENSIC TRIAGE, not patching alone. See rank 2, and note that the related CVE-2026-136716 still needs 10.6.23 / 11.3.23 / 11.4.14 PLUS the update hook.\n- CVE-2026-131914, Idunno.AntiCsrf, a critical deserialisation flaw in an ASP.NET anti-CSRF library. KEV added 24 November. THIS DEADLINE CANNOT BE MET BY PATCHING. There is no patch and there will not be one. The only remediation is to REMOVE OR REPLACE THE DEPENDENCY, which means finding every application that references it - including transitively, through packages you did not choose. This is the hardest item on today's list and the one most likely to be silently skipped, because it requires a dependency-graph search rather than a patch deployment.\n- CVE-2026-132224, Optimizely Web Experimentation. KEV added 24 November. Same incident family as the Optimizely signup-flow compromise that served malicious JavaScript from its own CDN to at least 178 organisations including the BBC, HSBC, TalkTalk, Zoom, IKEA, Salesforce and CNN.\n\nDUE TOMORROW, 28 NOVEMBER - the eight from the 25 November batch of ten:\n- Four of five Mitel MiCollab AWV flaws including CVE-2026-133323 at CVSS 10.0 (rank 3). CVE-2026-133311 is due 9 December.\n- CVE-2026-103406, HPE Juniper Session Smart, three-day deadline with mandatory forensic triage (rank 6).\n- CVE-2026-133469, Vates Xen Orchestra authentication bypass, public exploit details already available (rank 6). The empty-token search is the cheapest detection in this report.\n- CVE-2023-25914 and CVE-2023-25915, Danfoss AK-SM 800A (rank 7). CVE-2025-41450 is due 9 December.\n\nALREADY OVERDUE AND STILL EXPLOITED - these do not stop mattering because a date passed:\n- CVE-2026-133968, Project MONAI Label path traversal, KEV added 23 November. Found and exploited BY AI AGENTS per Amazon Threat Intelligence, reaching a root shell on university servers in East Asia in ELEVEN MINUTES. Directly relevant to UK universities and NHS research computing.\n- CVE-2026-134624, N-able Mail Assure SSRF, KEV added 23 November. An email security gateway, which means a high-trust position in the mail path.\n- CVE-2026-123890, Broadcom VMware vCenter authentication bypass at CVSS 9.8, exploited by a Chinese threat actor for months and reported as a zero-day by Google on 20 November. Broadcom has still not confirmed exploitation itself. A second vCenter flaw, CVE-2026-123903, has a public PoC and no confirmed in-the-wild exploitation.\n- CVE-2026-76466, Cisco Expressway, KEV added 20 November: an attacker with network access and the relevant persistent cookies can execute OS commands AS ROOT on an affected clustered device.\n\nAND THE THING THAT SHOULD CHANGE HOW YOU READ ALL OF IT. The NCSC published on 24 November that it has seen a MARKED RISE IN AI-ASSISTED ATTACKS SINCE SEPTEMBER across multiple sectors, knocking some services offline and compromising systems - and found that NOT ONE of the weaknesses exploited was new. Its recommendations were basic hygiene, zero trust, Cyber Essentials, the Cyber Assessment Framework for essential services, throttled sign-ups, and AN ACCURATE INVENTORY OF PUBLIC-FACING SYSTEMS. Set that beside this list: two of the Danfoss flaws have 2023 CVE identifiers; the MONAI Label flaw was found and exploited by AI agents in eleven minutes; the Drupal installer subsystem produced two exploited flaws in seven days; and the NCSC separately judges an AI-powered ransomware attack on UK critical infrastructure 'highly likely' by 2028, having handled more than 200 incidents affecting CNI and its supporting networks in the year to May 2026, around three-quarters linked to state actors. The compression is not in the vulnerabilities. It is in the interval between a vulnerability becoming known and becoming exploited - and a monthly patch cycle no longer fits inside that interval.\n\nONE CORRECTION TO YESTERDAY'S REPORT, STATED PLAINLY. Yesterday's entry recorded the Mitel deadline split as 'genuinely contested' across three mutually exclusive accounts. This window's reporting converges: four of the five Mitel CVEs are due 28 November and CVE-2026-133311 is due 9 December. The contested position is resolved in favour of 28 November for the majority.","recommended_actions":["ANSWER THESE NINE LINES YES OR NO BEFORE YOU GO HOME, AND WRITE DOWN WHO ANSWERED EACH ONE. 1) Drupal patched to 10.6.23 / 11.3.23 / 11.4.14 AND the update hook run AND the installer unreachable externally - DUE TODAY. 2) Idunno.AntiCsrf removed or replaced everywhere, including transitive references - DUE TODAY, NO PATCH EXISTS. 3) Optimizely Web Experimentation remediated - DUE TODAY. 4) Mitel MiCollab patched (KB000129195 on 10.3.0.18+) or AWV external access restricted - DUE TOMORROW. 5) Juniper Session Smart on 7.0.5 / 7.1.7 / 7.2.3 - DUE TOMORROW. 6) Xen Orchestra patched, empty token blocked, off the internet - DUE TOMORROW. 7) Danfoss AK-SM off the internet - DUE TOMORROW, worst flaw unpatchable. 8) MONAI Label and N-able Mail Assure - OVERDUE. 9) vCenter CVE-2026-123890 and Cisco Expressway CVE-2026-76466 - OVERDUE.","START WITH NUMBER 2, BECAUSE IT IS THE ONE THAT WILL BE SKIPPED. CVE-2026-131914 in Idunno.AntiCsrf has NO PATCH and never will. Search your dependency manifests, lock files and build outputs for AntiCsrf - including transitive references pulled in by packages you did not choose. A patch-deployment process will not find this; only a dependency-graph search will.","Treat 'forensic triage required' as a distinct obligation from patching. It is reported on both the Drupal and Juniper KEV entries. Patching the asset does not discharge it. If you cannot triage by the deadline, record what you checked, what you did not, and who decided.","For anything already overdue, stop treating the date as the objective. CVE-2026-133968, CVE-2026-134624, CVE-2026-123890 and CVE-2026-76466 are all still actively exploited. An overdue exploited CVE is a higher risk than a due-tomorrow one, not a lower one, because the exposure has lasted longer.","If you are a UK university or run NHS research computing, prioritise MONAI Label. CVE-2026-133968 was found AND exploited by AI agents, reaching root shell on university servers in East Asia in eleven minutes. It is a medical imaging annotation tool, which means it lives in exactly the research environments that sit outside central IT governance.","Prioritise by exposure and reachability, not by CVSS. Of the four overdue items, the Cisco Expressway flaw gives OS command execution AS ROOT on a clustered device, and the vCenter flaw is an authentication bypass on the virtualisation control plane. Both are higher-leverage than several of the items with closer deadlines.","Where a deadline genuinely cannot be met, write the risk acceptance TODAY with a named owner, the compensating controls actually deployed, and a review date. An unpatchable exploited CVE with a passed federal deadline and no documented acceptance is the single worst position to be in during an audit or an incident.","Use the two-deadline collision as the evidence for a process change, not just a sprint. Three deadlines inside 72 hours across seven unrelated product families is not an unlucky week - it is the new baseline. If your organisation cannot run concurrent emergency changes across CMS, .NET dependencies, UC, SD-WAN, virtualisation management, email security and OT in the same week, that capacity gap is the finding to escalate.","Act on the NCSC's two specific control recommendations from 24 November, because they are free and they are the gaps behind several items on this list: throttle sign-up and account-recovery flows, and build an accurate inventory of public-facing systems. The second one is what makes every other item on this checklist answerable.","Re-check the KEV catalogue directly on Monday 30 November. There were no additions on 26 November and none identified on 27 November, which given the volume of the preceding week is more likely a pause than a trend. Watch particularly for Drupal CVE-2026-136716 and NGINX CVE-2026-123007 (rank 4), either of which would add a new deadline."],"references":["https://www.cisa.gov/news-events/alerts/2026/11/24/cisa-adds-three-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/news-events/alerts/2026/11/25/cisa-adds-10-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/news-events/alerts/2026/11/23/cisa-adds-two-known-exploited-vulnerabilities-catalog","https://www.sophos.com/en-us/vulnerability-advisories/tpc_01m87e6g57mfn2seqcbfbtvnt5","https://www.xalgorix.com/blog/weekly-appsec-threat-digest-nov-20-27-2026","https://cyberdaily.au/security/14507-patch-now-broadcom-discloses-pair-of-critical-vmware-vcenter-vulnerabilities","https://www.neoteo.com/en/cisa-lists-cisco-expressway-cve-2026-76466-as-exploited","https://cyberscoop.com/uk-ncsc-ai-assisted-cyberattacks/","https://www.infosecurity-magazine.com/news/ncsc-warning-severe-cyberattacks/","https://firecompass.com/blog-weekly-cve-hacking-techniques-16-22-nov-2026/","https://www.cisa.gov/known-exploited-vulnerabilities-catalog"],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerability","name":"THE DEADLINE WALL - every CVE on this checklist, across your whole estate, in one query","description":"Run this first. It answers the nine-line checklist against Defender Vulnerability Management data and sorts by deadline so overdue and due-today items surface at the top. The one query that tells you where you actually stand.","query":"let Wall = datatable(CveId:string, Due:datetime, Product:string, Note:string)\n[\n  \"CVE-2026-132165\", datetime(2026-11-27), \"Drupal core\", \"Forensic triage required; also needs update hook\",\n  \"CVE-2026-131914\", datetime(2026-11-27), \"Idunno.AntiCsrf\", \"NO PATCH EVER - remove or replace the dependency\",\n  \"CVE-2026-132224\", datetime(2026-11-27), \"Optimizely Web Experimentation\", \"Same family as the CDN JavaScript compromise\",\n  \"CVE-2026-133968\", datetime(2026-11-26), \"Project MONAI Label\", \"OVERDUE - found and exploited by AI agents\",\n  \"CVE-2026-134624\", datetime(2026-11-26), \"N-able Mail Assure\", \"OVERDUE - SSRF on an email security gateway\",\n  \"CVE-2026-103406\", datetime(2026-11-28), \"Juniper Session Smart\", \"Forensic triage required\",\n  \"CVE-2026-133469\", datetime(2026-11-28), \"Vates Xen Orchestra\", \"Public exploit details exist; empty-token signature\",\n  \"CVE-2026-133323\", datetime(2026-11-28), \"Mitel MiCollab AWV\", \"CVSS 10.0 unauthenticated command injection\",\n  \"CVE-2023-25914\", datetime(2026-11-28), \"Danfoss AK-SM 800A\", \"2023 CVE id - exploited three years later\",\n  \"CVE-2023-25915\", datetime(2026-11-28), \"Danfoss AK-SM 800A\", \"2023 CVE id - exploited three years later\",\n  \"CVE-2026-123890\", datetime(2026-11-24), \"VMware vCenter\", \"OVERDUE - CVSS 9.8 auth bypass, state actor\",\n  \"CVE-2026-76466\", datetime(2026-11-23), \"Cisco Expressway\", \"OVERDUE - OS commands as root on clustered device\"\n];\nDeviceTvmSoftwareVulnerability\n| join kind=inner (Wall) on $left.CveId == $right.CveId\n| summarize AffectedDevices = dcount(DeviceId), Devices = make_set(DeviceName, 40), Software = make_set(strcat(SoftwareVendor, \" \", SoftwareName, \" \", SoftwareVersion), 10) by CveId, Due, Product, Note\n| extend DaysUntilDue = datetime_diff(\"day\", Due, now()), Status = iff(Due \u003c now(), \"OVERDUE\", iff(Due \u003c= now() + 1d, \"DUE NOW\", \"DUE SOON\"))\n| order by Due asc, AffectedDevices desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Find Idunno.AntiCsrf - the deadline that cannot be met by patching","description":"CVE-2026-131914 has no patch and never will. The only remediation is removing or replacing the dependency, so the first job is finding every place it is referenced, including transitively.","query":"DeviceFileEvents\n| where Timestamp > ago(90d)\n| where FileName has \"AntiCsrf\" or FileName has_cs \"Idunno\"\n   or (FileName in~ (\"packages.config\",\"packages.lock.json\",\"project.assets.json\") )\n| project Timestamp, DeviceName, FolderPath, FileName, ActionType, InitiatingProcessFileName, SHA256\n| order by DeviceName asc, Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Deserialisation exploitation on ASP.NET application hosts","description":"Behavioural detection for CVE-2026-131914 while you hunt the dependency. A deserialisation flaw in an anti-CSRF library executes inside the IIS worker, so w3wp.exe spawning anything is the signal.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-11-20)\n| where InitiatingProcessFileName in~ (\"w3wp.exe\", \"dotnet.exe\", \"iisexpress.exe\")\n| where FileName in~ (\"cmd.exe\",\"powershell.exe\",\"pwsh.exe\",\"certutil.exe\",\"bitsadmin.exe\",\"mshta.exe\",\"rundll32.exe\",\"regsvr32.exe\",\"curl.exe\",\"net.exe\",\"whoami.exe\",\"nltest.exe\")\n| project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, AccountName\n| order by Timestamp desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Path traversal against MONAI Label endpoints - OVERDUE and AI-exploited","description":"For UK universities and NHS research computing. CVE-2026-133968 was found and exploited by AI agents, reaching root shell in eleven minutes. Medical imaging tooling lives outside central IT governance in most institutions.","query":"W3CIISLog\n| where TimeGenerated > datetime(2026-11-18)\n| where csUriStem has_any (\"/datastore\", \"/upload\", \"/annotation\", \"/infer\", \"/train\", \"/session\")\n| where csUriStem has_any (\"..\", \"%2e%2e\", \"%252e\", \"..%2f\", \"%2f..\") or csUriQuery has_any (\"..\", \"%2e%2e\", \"%252e\")\n| project TimeGenerated, Computer, sSiteName, cIP, csMethod, csUriStem, csUriQuery, scStatus, cUserAgent\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"Server-side request forgery patterns against mail security and web gateways","description":"For the overdue N-able Mail Assure SSRF (CVE-2026-134624). SSRF on an email security gateway is a high-trust position in the mail path, which is why an overdue date here matters more than the date suggests.","query":"AzureDiagnostics\n| where TimeGenerated > datetime(2026-11-18)\n| where Category in (\"ApplicationGatewayAccessLog\", \"FrontdoorAccessLog\", \"AzureFirewallApplicationRule\")\n| where tostring(requestUri_s) has_any (\"169.254.169.254\", \"metadata.google\", \"localhost\", \"127.0.0.1\", \"0.0.0.0\", \"[::1]\", \"file://\", \"gopher://\", \"dict://\", \"%6c%6f%63%61%6c\")\n   or tostring(msg_s) has_any (\"169.254.169.254\", \"metadata.google.internal\")\n| project TimeGenerated, Resource, clientIp_s, requestUri_s, httpStatus_d, msg_s\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Virtualisation and conferencing control planes reaching the internet","description":"Covers the overdue vCenter and Cisco Expressway items plus Xen Orchestra. These management planes should have near-static, internal-only traffic profiles; anything else is worth an explanation.","query":"let ControlPlane = DeviceInfo\n  | where Timestamp > ago(30d)\n  | where DeviceName has_any (\"vcenter\", \"vcsa\", \"expressway\", \"xoa\", \"xen-orchestra\", \"conductor\", \"micollab\")\n  | distinct DeviceId;\nDeviceNetworkEvents\n| where Timestamp > datetime(2026-11-18)\n| where DeviceId in (ControlPlane)\n| where isnotempty(RemoteIP) and not(ipv4_is_private(RemoteIP))\n| summarize Connections = count(), Ports = make_set(RemotePort, 10), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, RemoteIP, RemoteUrl, InitiatingProcessFileName\n| order by FirstSeen desc"}],"iocs":[{"type":"note","value":"DUE TODAY, 27 NOVEMBER 2026: CVE-2026-132165 (Drupal core, forensic triage required), CVE-2026-131914 (Idunno.AntiCsrf, NO PATCH), CVE-2026-132224 (Optimizely Web Experimentation)","context":"Three deadlines expiring in this window. One of them cannot be met by patching at all.","confidence":"high","source":"CISA KEV additions of 24 November 2026"},{"type":"note","value":"DUE TOMORROW, 28 NOVEMBER 2026: four of five Mitel MiCollab CVEs including CVE-2026-133323 (CVSS 10.0), CVE-2026-103406 (Juniper Session Smart, forensic triage required), CVE-2026-133469 (Vates Xen Orchestra), CVE-2023-25914 and CVE-2023-25915 (Danfoss AK-SM 800A)","context":"Eight of the ten from the 25 November KEV batch. CVE-2026-133311 (Mitel) and CVE-2025-41450 (Danfoss) are due 9 December.","confidence":"medium","source":"Secondary reporting of the 25 November KEV batch"},{"type":"note","value":"ALREADY OVERDUE AND STILL EXPLOITED: CVE-2026-133968 (Project MONAI Label), CVE-2026-134624 (N-able Mail Assure), CVE-2026-123890 (VMware vCenter), CVE-2026-76466 (Cisco Expressway)","context":"An overdue exploited CVE is a HIGHER risk than a due-tomorrow one, not a lower one, because the exposure has lasted longer. These do not stop mattering because a date passed.","confidence":"high","source":"CISA KEV via secondary reporting"},{"type":"note","value":"CVE-2026-131914 (Idunno.AntiCsrf, ASP.NET) HAS NO PATCH AND NEVER WILL - the only remediation is removing or replacing the dependency, including transitive references pulled in by packages you did not choose","context":"The hardest item on today's list and the one most likely to be silently skipped, because it requires a dependency-graph search rather than a patch deployment.","confidence":"high","source":"Sophos vulnerability advisory and CISA KEV"},{"type":"note","value":"'FORENSIC TRIAGE REQUIRED' is reported on BOTH the Drupal (CVE-2026-132165) and Juniper (CVE-2026-103406) KEV entries - a distinct obligation from patching","context":"Patching the asset does not discharge it. If you cannot triage by the deadline, record what you checked, what you did not, and who decided.","confidence":"medium","source":"Secondary reporting of the KEV entries"},{"type":"note","value":"CVE-2026-76466 (Cisco Expressway, KEV added 20 November, OVERDUE): an attacker with network access and the relevant persistent cookies can execute OS commands AS ROOT on an affected clustered device","context":"Higher leverage than several items with closer deadlines. Prioritise by exposure and reachability, not by deadline proximity.","confidence":"high","source":"CISA KEV via secondary reporting"},{"type":"note","value":"CVE-2026-123890 (VMware vCenter, CVSS 9.8 authentication bypass, OVERDUE): exploited by a Chinese threat actor for months, reported as a zero-day by Google on 20 November; Broadcom has still NOT confirmed exploitation itself. Second flaw CVE-2026-123903 has a public PoC and no confirmed in-the-wild exploitation.","context":"An authentication bypass on the virtualisation control plane, overdue. Vendor silence on exploitation does not reduce the risk.","confidence":"high","source":"Broadcom VMSA-2026-0009 and Google reporting via secondary sources"},{"type":"note","value":"CVE-2026-133968 (Project MONAI Label, OVERDUE) was found AND exploited BY AI AGENTS per Amazon Threat Intelligence, reaching a root shell on university servers in East Asia in ELEVEN MINUTES","context":"Directly relevant to UK universities and NHS research computing. Medical imaging tooling lives outside central IT governance in most institutions.","confidence":"medium","source":"Amazon Threat Intelligence via secondary reporting"},{"type":"uri_path","value":"Traversal sequences (.., %2e%2e, %252e) against MONAI Label /datastore, /upload, /annotation, /infer and /train endpoints","context":"The one hard path-based indicator on the overdue list. Everything else in this entry is a deadline rather than an artefact.","confidence":"medium","source":"Analyst assessment based on the reported vulnerability class"},{"type":"behaviour","value":"SSRF probe targets in requests to mail security or web gateways - 169.254.169.254, metadata.google.internal, localhost, 127.0.0.1, file://, gopher://, dict://","context":"For the overdue N-able Mail Assure SSRF (CVE-2026-134624). An email security gateway holds a high-trust position in the mail path.","confidence":"medium","source":"Analyst assessment based on the reported vulnerability class"},{"type":"behaviour","value":"w3wp.exe, dotnet.exe or iisexpress.exe spawning cmd, PowerShell, certutil, bitsadmin, mshta, rundll32, regsvr32, net or whoami","context":"Behavioural detection for the unpatchable Idunno.AntiCsrf deserialisation flaw while you hunt the dependency. A deserialisation flaw in an anti-CSRF library executes inside the IIS worker.","confidence":"high","source":"Analyst assessment based on the reported vulnerability class"},{"type":"note","value":"NO KEV ADDITIONS ON 26 NOVEMBER and none identified on 27 NOVEMBER, after 2 on 23 November, 3 on 24 November and 10 on 25 November","context":"Given the preceding week's volume this is more likely
