he attacker.' Vault data, the items in vaults, and the keys protecting them were not affected","context":"The load-bearing claim, made unambiguously. Architecturally credible because a correct zero-knowledge design means the provider cannot decrypt vaults at all - but credible is NOT independently verified, and nobody outside 1Password has verified it.","confidence":"high","source":"1Password statement via multiple outlets"},{"type":"note","value":"UNRESOLVED SOURCE CONFLICT ON THE MOST SECURITY-RELEVANT QUESTION: one report states stolen SRP PARAMETERS CANNOT BE USED to access an account, attributed to 1Password; another, citing a company representative on 1Password's community forum, states the stolen data INCLUDED SECURE REMOTE PASSWORD VERIFIERS DERIVED FROM USER ACCOUNT PASSWORDS AND SECRET KEYS","context":"Materially different statements. An SRP verifier cannot be replayed against the service but is a value against which an offline attack can in principle be attempted. THIS REPORT DOES NOT RESOLVE IT - it is the single thing to get clarified from 1Password in writing before deciding on a rotation campaign.","confidence":"medium","source":"Help Net Security versus SecurityWeek, 26-27 November 2026"},{"type":"note","value":"ARCHITECTURAL CONTEXT, NOT A STATEMENT ABOUT WHAT WAS TAKEN: 1Password's design combines the account password with a SECRET KEY held only on the user's own devices, which materially raises the cost of any offline attack against a verifier compared with a conventional password hash","context":"Relevant to assessing the SRP conflict above. It is a reason not to panic-rotate on secondary reporting alone; it is not a reason to skip asking the question.","confidence":"medium","source":"Analyst assessment based on documented 1Password architecture"},{"type":"note","value":"VENDOR NEGATIVE FINDING: 1Password says it validated NO INTERNAL EVIDENCE OF USER ACCOUNT TAKEOVERS OR COMPROMISE USING ANY EXPOSED ACCOUNT PROVISIONING TOKENS","context":"Specific and useful - it addresses the invitation and recovery tokens directly. It is also a statement about what their telemetry shows, which is the appropriate limit of such a claim. Check your own tenant log rather than relying on it.","confidence":"high","source":"1Password statement via secondary reporting"},{"type":"note","value":"PATTERN ACROSS THIS REPORT: this is the THIRD entry in which an organisation's own incident response creates the phishing pretext against its users - DWP's outage and journal waiver (rank 1), Liverpool's mandatory password reset (rank 7), and now a password manager's breach notification","context":"Consistent enough to be a planning assumption: WHATEVER AN ORGANISATION TELLS ITS USERS TO DO DURING AN INCIDENT WILL BE IMPERSONATED WITHIN DAYS. Build the counter-message into the incident comms plan rather than after.","confidence":"high","source":"Analyst assessment across ranks 1, 7 and 8 of this report"}]},{"rank":9,"id":"TI-2026-11-28-009","title":"THE SECOND SOURCE-CONTROL COMPROMISE IN 48 HOURS, AND THIS ONE IS THE ERP THAT RUNS UK GOVERNMENT AND ENTERPRISE FINANCE: SAP Has CONFIRMED a Security Incident It Reportedly Handles Internally as 'PROJECT GRANITE' After Reports That Attackers STOLE EMPLOYEE GITHUB TOKENS and COPIED AND ALTERED SOURCE CODE - SAP Says No Evidence of Unauthorised Access to Customer Business Data, and Has Reportedly PAUSED BUILD PIPELINES and ROTATED CODE-SIGNING KEYS","cve_ids":[],"vendor":"SAP SE","affected_products":["SAP source code repositories on GitHub (reported)","SAP employee authentication tokens (reported)","SAP automated build and delivery pipelines (reportedly paused)","SAP code-signing keys (reportedly rotated)"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-26","last_updated":"2026-11-28","confidence":"medium","summary":"READ THIS DIRECTLY AFTER RANK 8, BECAUSE THE TWO ENTRIES ARE THE SAME STORY TOLD AT DIFFERENT SCALES. Two confirmed incidents inside one 48-hour window began at a developer's source-control credentials. One was a password manager. This one is the enterprise resource planning vendor whose software runs finance, HR, procurement and payroll for a very large share of UK central government, local government, NHS bodies, utilities, manufacturers and FTSE constituents. The potential supply-chain reach is categorically different, which is why it is in this report despite SAP having confirmed comparatively little.\n\nSEPARATE WHAT SAP HAS CONFIRMED FROM WHAT IS REPORTED, BECAUSE THE GAP IS LARGE AND MOST COVERAGE BLURS IT.\n\nSAP HAS CONFIRMED: that there is a security incident. And one substantive negative - 'Based on our investigation to date, we have found no evidence of unauthorized access to customer business data.' That is the entirety of SAP's affirmative public position in the sources reviewed.\n\nREPORTED BUT NOT CONFIRMED BY SAP: that attackers OBTAINED SAP EMPLOYEES' AUTHENTICATION TOKENS and used them to COPY AND CHANGE SOURCE CODE ON GITHUB; that SAP handles the matter internally under the codename 'PROJECT GRANITE'; that SAP RESTRICTED ACCESS TO GITHUB, PAUSED AUTOMATED BUILD AND DELIVERY PIPELINES and ROTATED CODE-SIGNING KEYS; and that the attackers may have used AGENTIC AI. The token theft and code alteration come from a Der Spiegel insider account. The containment actions come via Handelsblatt. The AI element is explicitly unverified.\n\nTHE REPORTED RESPONSE IS THE MOST INFORMATIVE THING IN THIS ENTRY, AND IT IS WORTH DWELLING ON. If SAP genuinely paused automated build and delivery pipelines and rotated code-signing keys, those are not precautionary gestures - they are expensive, disruptive actions that a software vendor takes when it cannot yet prove that the code leaving its pipeline is the code its engineers wrote. Rotating code-signing keys in particular is a statement about trust in the signing chain itself. A company that was confident the tampering was contained to a repository would not need to do either. THAT IS AN INFERENCE FROM REPORTED ACTIONS, NOT A FINDING, and it is offered as such - but it is the inference a customer should plan against rather than the reassurance in SAP's single confirmed sentence.\n\nWHAT NOBODY HAS ESTABLISHED, AND THE LIST IS LONG. SAP has not confirmed HOW the tokens were stolen. It has not said HOW MANY REPOSITORIES were touched. It has not said WHETHER PROPRIETARY PRODUCT CODE was involved as opposed to samples, tooling or documentation. It has not said WHEN the activity started. And critically: NONE OF THE REPORTS INDICATES THAT TAMPERED CODE WAS INCORPORATED INTO SOFTWARE DELIVERED TO SAP CUSTOMERS. That last negative is important and should be stated every time this incident is described, because the distance between 'source code was altered in a repository' and 'malicious code shipped to customers' is the entire difference between an embarrassing internal incident and a supply-chain compromise. Nothing published supports the latter.\n\nTWO SOURCES SHOULD BE TREATED WITH EXPLICIT CAUTION AND THIS REPORT NAMES THEM. Two aggregator pages state that the stolen credentials were used to clone PRIVATE REPOSITORIES and that the incident was CONFINED TO SOURCE CODE MANAGEMENT. Other outlets state that the affected repositories are UNKNOWN. A claim of confinement that contradicts every other account's statement of ignorance is a claim to discard, not to average. Separately, one write-up's reference to '300 million subscribers' is unsourced speculation and should be ignored entirely. A third source names a UK prime minister incorrectly in adjacent DWP coverage, which is a useful reminder that low-quality aggregators are circulating in this story's reporting cluster.\n\nWHY THIS MATTERS SPECIFICALLY TO UK ORGANISATIONS, STATED WITHOUT INFLATION. SAP is deeply embedded in UK public sector and large enterprise finance and HR. An SAP landscape is typically the system of record for payments, payroll and procurement - the highest-trust application estate most organisations own, frequently integrated with banking, and frequently maintained by a specialist partner rather than by internal IT. The relevant question for a UK SAP customer today is NOT 'has SAP shipped me malicious code' - nothing supports that - but the two questions a customer can actually answer: FIRST, would you detect an unexpected change in an SAP transport or patch if one arrived; and SECOND, do you verify the signatures on SAP-delivered artefacts, given that SAP has reportedly rotated its code-signing keys. If the answer to either is no or unknown, that is the finding, and it is a finding about your own controls rather than about SAP's.\n\nONE MORE ANGLE WORTH FLAGGING FOR THE WEEK AHEAD. A reported code-signing key rotation means SAP-delivered artefacts will begin to be signed with new keys. That is exactly the condition under which a phishing or supply-chain fraud campaign becomes easy: 'SAP has rotated its signing keys, import this new trust certificate', or 'your SAP notes must be re-applied with updated signatures'. Expect that pretext at SAP customers and SAP partners, and treat any unsolicited instruction to install a new SAP trust certificate as hostile until verified through SAP's own support channel. Note that this is the FOURTH entry in this report where an organisation's incident response creates the pretext for the next attack - after DWP's outage, Liverpool's password reset and 1Password's breach notification.\n\nAND THE SAME CONTROL LESSON AS RANK 8, NOW WITH TWO DATA POINTS IN TWO DAYS. Both incidents began with developer source-control credentials. Neither was fundamentally about secrets accidentally committed to a repository. Both were about an identity with write access and a path from that write access toward something that ships. The controls are: phishing-resistant MFA on source control, short-lived narrowly scoped tokens, branch protection and mandatory review on anything that can reach a build, signed commits, separation between the identity that writes code and the identity that releases it, and alerting on changes to pipeline and signing configuration. If your organisation builds and ships software - and most UK government departments and large corporates now do, even if they would not describe themselves as software companies - this weekend is the right time to answer those questions.","recommended_actions":["DO NOT ACT AS THOUGH A SUPPLY-CHAIN COMPROMISE HAS OCCURRED, AND SAY SO CLEARLY INTERNALLY. None of the reports indicates that tampered code was incorporated into software delivered to SAP customers. State that negative every time this incident is described, because the distance between 'repository code altered' and 'malicious code shipped' is the whole difference between an internal incident and a supply-chain event.","DO ASK SAP, OR YOUR SAP PARTNER, THE FOUR QUESTIONS SAP HAS NOT PUBLICLY ANSWERED: how were the tokens stolen, how many repositories were affected, was proprietary product code involved, and when did the activity start. Ask in writing through your account or support channel and keep the response. Your answer will be more specific than anything in the press.","VERIFY SIGNATURES ON SAP-DELIVERED ARTEFACTS AS A MATTER OF ROUTINE, AND CHECK THAT YOU ACTUALLY DO. SAP has reportedly ROTATED ITS CODE-SIGNING KEYS. If your process imports transports, notes or patches without signature verification, you would not detect a substituted artefact - and that is a gap in your controls regardless of what happened at SAP.","TREAT ANY UNSOLICITED INSTRUCTION TO INSTALL A NEW SAP TRUST CERTIFICATE OR RE-APPLY NOTES WITH UPDATED SIGNATURES AS HOSTILE UNTIL VERIFIED THROUGH SAP'S OWN SUPPORT CHANNEL. A reported signing-key rotation is a near-perfect pretext - 'SAP has rotated its keys, import this certificate' - and this is the fourth entry in this report where an organisation's own incident response hands attackers the next pretext.","REVIEW YOUR SAP CHANGE AND TRANSPORT LOGS FOR THE LAST SIXTY DAYS for transports you cannot attribute to a change record, imports outside change windows, and modifications to standard objects. This is worth doing on its own merits and it is the only direct check available to a customer.","BRIEF YOUR SAP BASIS AND FINANCE SYSTEMS TEAMS, WHO MAY NOT READ SECURITY FEEDS. An SAP landscape is usually maintained by a specialist team or an external partner and sits outside the security function's normal visibility, while being the system of record for payments, payroll and procurement. They need to know about this before a partner or a supplier raises it with them.","NOW THE PART THAT APPLIES WHETHER OR NOT YOU RUN SAP: AUDIT YOUR SOURCE-CONTROL-TO-RELEASE PATH THIS WEEKEND. Two confirmed incidents in two days began with developer source-control credentials. Enforce phishing-resistant MFA on source control, inventory and shorten personal access tokens, apply branch protection and mandatory review to anything that can reach a build, require signed commits, and separate the identity that writes code from the identity that releases it.","ALERT ON CHANGES TO PIPELINE AND SIGNING CONFIGURATION, not just on code changes. SAP's reported response - pausing build pipelines and rotating signing keys - tells you where the real risk sat. Modifications to CI workflow definitions, build runners, artefact repositories and signing configuration should generate an alert rather than appear in a quarterly review.","DISCARD THE TWO AGGREGATOR CLAIMS THAT THE INCIDENT WAS 'CONFINED TO SOURCE CODE MANAGEMENT' and that private repositories were cloned. Other outlets state the affected repositories are UNKNOWN. A claim of confinement that contradicts every other account's statement of ignorance is to be discarded, not averaged. Likewise ignore the unsourced '300 million subscribers' figure.","RECORD THE AI ELEMENT AS UNVERIFIED. Der Spiegel reported the attackers MAY have used agentic AI. That is reported speculation, not a finding, and it should not be repeated as established - particularly alongside the Mitel entry in rank 4, where the AI evidence is also only timing-based."],"references":["https://www.securityweek.com/sap-confirms-cyberattack-source-code-reportedly-compromised/","https://cybersecuritynews.com/sap-security-incident/","https://breachnews.com/cyber-attacks/sap-security-incident-github-source-code-project-granite/","https://thenextweb.com/news/sap-security-incident-github-breach","https://dealroom.co/news/176343-sap-hit-by-project-granite-cyberattack-as-hackers-reportedly-steal-githu/","https://cyberpress.org/hackers-breach-sap-github-systems/","https://aviatrix.ai/threat-research-center/sap-confirms-security-incident-after-suspicious-github-activity/","https://news.lavx.hu/article/sap-confirms-cyberattack-as-reports-say-source-code-on-github-was-compromised"],"kql":[{"platform":"sentinel","table":"GitHubAuditData","name":"Repository clone and export activity at abnormal volume","description":"The reported SAP mechanism was stolen employee tokens used to copy and alter code. Bulk clone or archive-download activity by a single actor is the collection signal. Table and column names vary by GitHub connector - adapt before use.","query":"GitHubAuditData\n| where TimeGenerated > ago(60d)\n| where Action has_any (\"git.clone\", \"git.fetch\", \"repo.download_zip\", \"repo.create_archive\", \"repo.transfer\", \"repo.change_visibility\")\n| summarize Events = count(), Repos = dcount(column_ifexists(\"Repo\", \"\")), RepoList = make_set(column_ifexists(\"Repo\", \"\"), 40), IPs = make_set(column_ifexists(\"ActorIp\", \"\"), 15), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Actor = column_ifexists(\"Actor\", \"\")\n| where Repos >= 10\n| order by Repos desc"},{"platform":"sentinel","table":"GitHubAuditData","name":"Changes to build pipelines, workflow permissions and artefact publishing","description":"SAP reportedly PAUSED BUILD PIPELINES and ROTATED CODE-SIGNING KEYS, which tells you where the real risk sat. Changes to CI workflow definitions, runners and publishing configuration are the events that convert repository access into shipped code.","query":"GitHubAuditData\n| where TimeGenerated > ago(60d)\n| where Action has_any (\"workflows.updated_workflow_run_permissions\", \"workflows.approve_workflow_job\", \"repo.actions_enabled\", \"self_hosted_runner.created\", \"self_hosted_runner.registered\", \"packages.package_published\", \"environment.create\", \"secret_scanning.disable\", \"repo.add_secret\", \"org.add_secret\")\n| project TimeGenerated, Action, Actor = column_ifexists(\"Actor\", \"\"), Repository = column_ifexists(\"Repo\", \"\"), ActorIp = column_ifexists(\"ActorIp\", \"\"), AdditionalFields\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"GitHubAuditData","name":"Personal access token and OAuth grant creation on developer accounts","description":"The reported entry mechanism. Long-lived, broadly scoped tokens held by individual developers are what turn an account compromise into infrastructure access. Alert on creation; do not audit quarterly.","query":"GitHubAuditData\n| where TimeGenerated > ago(60d)\n| where Action has_any (\"personal_access_token.create\", \"personal_access_token.access_granted\", \"personal_access_token.request_created\", \"oauth_authorization.create\", \"oauth_application.create\", \"integration_installation.create\")\n| summarize Grants = count(), Actions = make_set(Action, 10), IPs = make_set(column_ifexists(\"ActorIp\", \"\"), 10), FirstSeen = min(TimeGenerated) by Actor = column_ifexists(\"Actor\", \"\")\n| order by Grants desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"SAP-themed phishing exploiting the reported code-signing key rotation","description":"A reported signing-key rotation is a near-perfect pretext: 'import this new SAP trust certificate', 'your SAP notes must be re-applied with updated signatures'. Expect this at SAP customers and partners this week.","query":"let Terms = dynamic([\"sap\",\"s/4hana\",\"s4hana\",\"sap note\",\"sap transport\",\"code signing\",\"signing certificate\",\"trust certificate\",\"sap support portal\",\"sap marketplace\"]);\nEmailEvents\n| where Timestamp > datetime(2026-11-25)\n| where (Subject has_any (Terms)) or (SenderDisplayName has_any (Terms)) or (SenderFromName has_any (Terms))\n| where not(SenderFromDomain endswith \"sap.com\")\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 15), Attachments = make_set(AttachmentCount, 5), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderFromAddress, SenderIPv4\n| order by Messages desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Certificate and trust store files arriving on SAP administration workstations","description":"The delivery end of the certificate-import pretext. A .cer, .crt, .pse or .p12 file arriving on a Basis administrator's workstation from mail or a download, rather than from SAP's support portal through your normal process, is worth a same-day question.","query":"DeviceFileEvents\n| where Timestamp > datetime(2026-11-25)\n| where FileName endswith \".cer\" or FileName endswith \".crt\" or FileName endswith \".pse\" or FileName endswith \".p12\" or FileName endswith \".pfx\" or FileName endswith \".sar\" or FileName endswith \".car\"\n| where ActionType in (\"FileCreated\", \"FileModified\")\n| where InitiatingProcessFileName has_any (\"outlook\", \"chrome\", \"msedge\", \"firefox\", \"teams\", \"winrar\", \"7z\", \"explorer\")\n| project Timestamp, DeviceName, AccountName, FolderPath, FileName, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"}],"iocs":[{"type":"ttp","value":"Stolen employee authentication tokens used to COPY AND ALTER SOURCE CODE on GitHub (reported, NOT confirmed by SAP)","context":"The SECOND incident in this report with developer source-control credentials as the entry point, 48 hours after 1Password (rank 8). Neither incident was fundamentally about secrets committed to a repository - both were about an identity with write access and a path toward something that ships.","confidence":"medium","source":"Der Spiegel insider account via SecurityWeek and secondary reporting"},{"type":"ttp","value":"Phishing pretexting on a code-signing key rotation - 'import this new SAP trust certificate', 'your SAP notes must be re-applied with updated signatures'","context":"A reported signing-key rotation hands attackers a near-perfect pretext at SAP customers and partners. FOURTH entry in this report where an organisation's incident response creates the next attack's pretext, after DWP, Liverpool and 1Password.","confidence":"medium","source":"Analyst assessment based on the reported containment actions"},{"type":"behaviour","value":"Bulk repository clone, fetch or archive-download activity by a single source-control identity across many repositories","context":"The collection signal for the reported mechanism. Worth building as a standing detection in any organisation that develops software, not only in response to this incident.","confidence":"medium","source":"Analyst assessment based on the reported mechanism"},{"type":"behaviour","value":"Changes to CI workflow definitions, workflow run permissions, self-hosted runner registration, artefact publishing, repository secrets or secret-scanning configuration","context":"SAP reportedly PAUSED BUILD PIPELINES and ROTATED CODE-SIGNING KEYS, which indicates where the real risk sat. These are the events that convert repository access into shipped code and they should alert, not appear in a quarterly review.","confidence":"high","source":"Analyst assessment based on the reported containment actions"},{"type":"filepath","value":"New .cer, .crt, .pse, .p12, .pfx, .sar or .car files arriving on SAP Basis administration workstations from mail or a browser download","context":"The delivery end of the certificate-import pretext. SAP artefacts should arrive through SAP's support portal and your normal change process, not as an email attachment.","confidence":"medium","source":"Analyst assessment based on the reported signing-key rotation"},{"type":"note","value":"SAP'S ENTIRE CONFIRMED PUBLIC POSITION: that a security incident exists, and that 'Based on our investigation to date, we have found no evidence of unauthorized access to customer business data'","context":"Everything else in this entry is reported rather than confirmed. Most coverage blurs that line; this entry does not.","confidence":"high","source":"SAP statement to SecurityWeek"},{"type":"note","value":"REPORTED BUT NOT CONFIRMED BY SAP: stolen employee authentication tokens; source code copied and changed on GitHub; internal codename 'PROJECT GRANITE'; GitHub access restricted; AUTOMATED BUILD AND DELIVERY PIPELINES PAUSED; CODE-SIGNING KEYS ROTATED; possible use of agentic AI","context":"Token theft and code alteration come from a Der Spiegel insider account; the containment actions via Handelsblatt; the AI element is explicitly unverified. Record the attribution, not just the claim.","confidence":"medium","source":"Der Spiegel and Handelsblatt via SecurityWeek, CyberSecurityNews, BreachNews and others"},{"type":"note","value":"ANALYST INFERENCE, LABELLED AS SUCH: pausing automated build and delivery pipelines and rotating code-signing keys are expensive, disruptive actions a software vendor takes when it cannot yet prove the code leaving its pipeline is the code its engineers wrote. A company confident the tampering was contained to a repository would need neither","context":"This is the inference a customer should plan against rather than the reassurance in SAP's single confirmed sentence. It is NOT a finding and nothing published supports a conclusion that customer deliveries were affected.","confidence":"low","source":"Analyst assessment based on the reported containment actions"},{"type":"note","value":"THE CRITICAL NEGATIVE, TO BE STATED EVERY TIME THIS INCIDENT IS DESCRIBED: NONE of the reports indicates that tampered code was incorporated into software delivered to SAP customers","context":"The distance between 'source code altered in a repository' and 'malicious code shipped to customers' is the entire difference between an embarrassing internal incident and a supply-chain compromise. Nothing published supports the latter.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"note","value":"NOT ESTABLISHED BY ANYONE: how the tokens were stolen, how many repositories were touched, whether proprietary product code was involved as opposed to samples or tooling, and when the activity started","context":"These are the four questions to put to SAP or your SAP partner in writing. A customer's answer will be more specific than anything in the press.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"note","value":"SOURCES TO DISCARD RATHER THAN AVERAGE: two aggregator pages state the stolen credentials were used to clone PRIVATE REPOSITORIES and that the incident was CONFINED TO SOURCE CODE MANAGEMENT, while other outlets state the affected repositories are UNKNOWN. One write-up's '300 million subscribers' figure is unsourced speculation","context":"A claim of confinement that contradicts every other account's statement of ignorance is to be discarded. Low-quality aggregators are circulating in this story's reporting cluster - one also misnames a UK prime minister in adjacent DWP coverage.","confidence":"high","source":"Analyst assessment comparing FinExus and Aviatrix pages against SecurityWeek and other outlets"},{"type":"note","value":"UK RELEVANCE: SAP is deeply embedded in UK public sector and large enterprise finance, HR, procurement and payroll - typically the system of record for payments, frequently integrated with banking, and frequently maintained by a specialist partner rather than internal IT","context":"The relevant question for a UK SAP customer is not 'has SAP shipped me malicious code' - nothing supports that - but whether you would detect an unexpected transport, and whether you verify signatures on SAP-delivered artefacts. Both are findings about your own controls.","confidence":"high","source":"Analyst assessment"}]},{"rank":10,"id":"TI-2026-11-28-010","title":"FOUR DAYS TO THE LEAK CLOCK, AND NOT ONE OF THESE UK BREACHES STARTED AT THE NAMED BRAND: N0n's Countdown on hmv, Next plc and 20+ Others Expires AROUND 2 DECEMBER - With Next Data Claimed To Include 320,000 LINES OF AI SHOPPING ASSISTANT CHATS CONTAINING BODY MEASUREMENTS - While Gatwick's AutoPay Breach Is Now Confirmed To Sit at ParkPark via Times24, With HASHED PASSWORDS Reportedly Exposed and the ICO Assessing","cve_ids":[],"vendor":"N0n (extortion group); hmv; Next plc; Torrid; Mattel; Gannett / USA Today; London Gatwick Airport; Times24 UK Limited; ParkPark","affected_products":["hmv customer and staff data (claimed by N0n, unverified)","Next plc - claimed 3.5m+ rows of search query and revenue data, 320,000+ lines of AI shopping assistant chats including body measurements and sizing, records for 293 named staff (claimed by N0n, unverified)","An unnamed shared e-commerce search provider (inferred from identical listing wording across five retail entries)","Gatwick AutoPay drop-off payment system - operated by ParkPark, used by Times24 UK Limited","AutoPay login information, customer contact and personal details, vehicle and drop-off information, payment records"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-23","last_updated":"2026-11-28","confidence":"medium","summary":"THIS ENTRY EXISTS TO MAKE ONE ARGUMENT WITH TWO SETS OF EVIDENCE, AND THE ARGUMENT HAS NOW HELD FOR SIX CONSECUTIVE WEEKS IN THIS FEED: NOT ONE UK CONSUMER-FACING COMPROMISE DISCLOSED THIS MONTH BEGAN AT THE NAMED BRAND'S OWN PERIMETER. Optimizely, ASOS, Next plc, TfL, Halfords, and now Gatwick. Every one started at a supplier. The brand took the headline; the supplier had the vulnerability.\n\nPART ONE: THE N0n CLOCK, WHICH EXPIRES IN FOUR DAYS.\n\nEvery new listing N0n posted on 25 NOVEMBER carries a countdown to a publication deadline of APPROXIMATELY 2 DECEMBER 2026, and the entries are marked 'NOT PAID'. The named set includes Mattel, Gannett, NEXT, HMV, Torrid and seventeen others - twenty-plus victims claiming customer and staff data. No live countdown timer was observable, so the exact hour is unconfirmed, but the date is consistent across outlets. That is NEXT WEDNESDAY.\n\nTHE NEXT PLC CLAIM HAS ACQUIRED SPECIFIC AND UNUSUALLY INTERESTING DETAIL IN THIS WINDOW, AND ONE PART OF IT DESERVES SEPARATE ATTENTION. N0n claims to hold, for Next: MORE THAN 3.5 MILLION ROWS of search query and revenue data; MORE THAN 320,000 LINES OF SHOPPER CHATS WITH AN AI SHOPPING ASSISTANT THAT INCLUDE BODY MEASUREMENTS AND SIZING DETAILS; and records for 293 NAMED STAFF MEMBERS. Read that middle item again. If it is accurate, it is a category of data most organisations have not yet thought about at all: CONVERSATIONAL LOGS FROM A CUSTOMER-FACING AI ASSISTANT, containing physical measurements volunteered by shoppers who were buying clothes. Nobody treated those chats as a sensitive data store when the assistant was deployed, because the assistant was a conversion tool. This is the first item in this feed where an AI customer-service feature is itself the claimed breach payload, and it is a question every UK retailer with a chat assistant should ask this weekend: WHERE DO OUR ASSISTANT TRANSCRIPTS GO, WHO ELSE HOLDS THEM, HOW LONG ARE THEY KEPT, AND WOULD WE KNOW IF THEY LEFT? That question is worth more than the rest of this entry.\n\nTHE TWO NEXT THREADS MUST NOT BE CONFLATED, AND REPORTING IS ALREADY CONFLATING THEM. Next disclosed on 23 NOVEMBER - via a London Stock Exchange filing - that an UNNAMED THIRD-PARTY ONLINE SUPPLIER suffered a cyber incident resulting in unauthorised access to 'certain BENIGN data relating to NEXT'. Next says current evidence indicates NO CUSTOMER PERSONAL DATA has been compromised, and is working with the supplier, the police and regulators. N0n listed Next separately on 25 NOVEMBER. NEXT HAS NOT NAMED THE SUPPLIER AND HAS NOT LINKED THE TWO EVENTS. The gap between 'benign data' and '320,000 lines of body measurements' is enormous, and it is unresolved. One of those characterisations is wrong, or they describe different data sets, or the N0n claim is inflated. This report does not resolve it and nobody reading secondary sources can.\n\nTHE SHARED-PROVIDER INFERENCE REMAINS THE MOST USEFUL ANALYTICAL POINT IN THE N0n CAMPAIGN. FIVE RETAIL LISTINGS - including hmv and Torrid - carry IDENTICAL WORDING about shopper search sessions. That points at ONE UNNAMED SHARED E-COMMERCE SEARCH PROVIDER rather than twenty-plus separate intrusions. The inference has been reached independently by more than one write-up. NO PROVIDER HAS BEEN NAMED BY ANYONE. If you are a UK retailer, the practical consequence is concrete: identify who supplies your on-site search and product discovery, and ask them directly whether they have been affected. The provider's other customers are the undisclosed victim population here, and they will find out from a leak site rather than from a notification.\n\nTHE ACTOR'S CREDIBILITY PROBLEM IS DOCUMENTED AND SEVERE, WHICH IS WHY THIS IS RANKED TENTH RATHER THAN HIGHER. Bitdefender reported that an EXPOSED FILE SERVER belonging to N0n showed it had targeted JUST OVER 20 VICTIMS while its leak site listed MORE THAN 100. Bitdefender called the group's image as a potentially significant threat 'A FALSE DEPICTION'. No sample data has been released for the headline 166 MILLION GANNETT / USA TODAY records claim, and USA Today has not confirmed a breach. Treat every N0n volume figure as an advertisement until samples appear.\n\nPART TWO: GATWICK, WHERE THE SUPPLIER CHAIN IS NOW THREE DEEP AND THE SCOPE CONFLICT IS STILL UNRESOLVED.\n\nThe supplier structure is now clearer than in yesterday's report, and it is worth stating precisely because it is the whole lesson: the affected system is AUTOPAY, which is OPERATED BY PARKPARK, and USED BY TIMES24 UK LIMITED, which is Gatwick's DROP-OFF ZONE MANAGER. That is THREE ORGANISATIONS BETWEEN THE AIRPORT BRAND AND THE VULNERABILITY. A customer paying a drop-off charge at Gatwick had no way to know any of those names existed. Gatwick has DISABLED the AutoPay system; drop-off zones remain open with other payment methods; the ICO IS ASSESSING the incident; and Gatwick's investigation is ongoing.\n\nGATWICK'S STATED SCOPE VERSUS THE PRESS CLAIM, UNRESOLVED FOR A FOURTH DAY. Gatwick says only a SMALL NUMBER of accounts were affected, and that exposed data MAY include card brand, LAST FOUR DIGITS and EXPIRY DATE in isolated cases, plus payment records such as amounts and transaction IDs, AutoPay login information, customer contact and personal details, and vehicle and drop-off information. Full card numbers, security codes and bank account numbers DO NOT APPEAR in any report reviewed. Several UK outlets nonetheless assert stolen BANK DETAILS, which Gatwick has not confirmed. NEW IN THIS WINDOW: one report describes HASHED PASSWORDS as exposed - which is consistent with 'AutoPay login information' and is a credential-reuse problem rather than a payment problem, and should be communicated as such. Gatwick has still not published a CUSTOMER COUNT, a RECORD DATE RANGE, or a VECTOR, and neither has Times24 or ParkPark.\n\nGATWICK HAS DONE ONE THING WELL AND IT IS WORTH COPYING. It issued a specific scam warning telling customers to treat messages claiming to come from GATWICK, TIMES24, AUTOPAY OR PARKPARK with caution, especially any asking for payment or bank details. Naming all four entities is better practice than most breach notifications manage, because it tells customers which unfamiliar names to distrust - and unfamiliar supplier names are exactly what fraudsters exploit after a third-party breach. Which, inevitably, is the FIFTH instance in this report of an organisation's own incident response becoming the pretext for the next attack.\n\nTHE CONCLUSION, WHICH IS A GOVERNANCE FINDING RATHER THAN A TECHNICAL ONE. Across this month's UK consumer-facing disclosures, the named brand's own perimeter was never the entry point. The attack surface that actually matters is the set of third parties with access to customer data: payment operators, zone managers, search and discovery providers, AI assistant vendors, booking platforms. Most UK organisations' third-party risk registers do not reach three layers deep, do not include the operator behind the supplier, and do not include the AI feature bolted onto the website last year. If your register would not have told you, before this month, that a company called ParkPark held your customers' partial card data, then your register is a list of contracts rather than a map of risk - and that is the thing to fix out of this entry.","recommended_actions":["UK RETAILERS - THE SINGLE HIGHEST-VALUE QUESTION THIS WEEKEND: where do your AI shopping assistant or chatbot transcripts go, who else holds them, how long are they retained, and would you know if they left? N0n claims 320,000+ lines of Next shopper chats including BODY MEASUREMENTS. Conversational logs from a customer-facing AI feature are a sensitive data store that almost nobody classified as one when the feature shipped.","IDENTIFY YOUR ON-SITE SEARCH AND PRODUCT DISCOVERY PROVIDER TODAY AND ASK THEM DIRECTLY WHETHER THEY HAVE BEEN AFFECTED. Five N0n retail listings carry IDENTICAL wording about shopper search sessions, which points at one unnamed shared provider rather than twenty-plus separate intrusions. That provider's other customers are the undisclosed victim population and they will learn from a leak site, not a notification.","SET A REVIEW POINT FOR 2 DECEMBER, which is when the N0n countdown on the 25 November listings expires. Decide in advance what you would do if data attributed to you or your supplier is published: who is notified, who speaks publicly, and what regulatory position you take.","DO NOT CONFLATE THE TWO NEXT THREADS IN ANY COMMUNICATION. Next disclosed on 23 November, via an LSE filing, an incident at an UNNAMED third-party online supplier involving 'certain benign data', and says no customer personal data was compromised. N0n listed Next separately on 25 November with very different claims. Next has NOT named the supplier and has NOT linked the two. The gap between 'benign data' and '320,000 lines of body measurements' is unresolved.","TREAT EVERY N0n VOLUME FIGURE AS AN ADVERTISEMENT UNTIL SAMPLES APPEAR. Bitdefender found an exposed N0n file server showing just over 20 victims against a leak site listing more than 100, and called the group's threat image 'a false depiction'. No samples have been released for the headline 166 million Gannett / USA Today claim and USA Today has not confirmed a breach.","IF YOU USED GATWICK'S AUTOPAY DROP-OFF SERVICE: assume your AutoPay password is compromised and change it anywhere you reused it. One report describes HASHED PASSWORDS as exposed, which makes this a credential-reuse problem rather than a payment problem. Monitor card statements as a secondary precaution, but the reuse risk is the more likely harm.","COPY GATWICK'S SCAM WARNING PRACTICE AND NAME EVERY ENTITY IN THE CHAIN. Gatwick told customers to distrust messages claiming to come from Gatwick, TIMES24, AUTOPAY OR PARKPARK. Naming all four is better than most breach notifications manage, because unfamiliar supplier names are precisely what fraudsters exploit after a third-party breach. If you disclose a supplier incident, name the supplier in your scam warning.","MAP YOUR THIRD PARTIES THREE LAYERS DEEP FOR ANYTHING THAT TOUCHES CUSTOMER DATA OR PAYMENTS. The Gatwick chain is airport, then zone manager (Times24 UK Limited), then payment system operator (ParkPark). If your risk register would not have told you before this month that a company called ParkPark held your customers' partial card data, your register is a list of contracts rather than a map of risk.","RECORD THE UNRESOLVED GATWICK SCOPE CONFLICT RATHER THAN PICKING A SIDE. Gatwick's stated scope is card brand, last four digits and expiry in isolated cases, plus payment records, login information, contact details and vehicle data, affecting a small number of accounts. Several UK outlets assert stolen BANK DETAILS, which Gatwick has not confirmed. No customer count, record date range or vector has been published by Gatwick, Times24 or ParkPark.","ADD THE SUPPLIER NAMES FROM THIS ENTRY TO YOUR BRAND-PROTECTION AND PHISHING MONITORING: autopay, parkpark, times24, gatwick-dropoff and equivalents, alongside hmv and next terms. Lookalike domains against unfamiliar supplier names are more effective than lookalikes of well-known brands, precisely because customers have no baseline for what the real one looks like.","BRING THIS TO WHOEVER OWNS THIRD-PARTY RISK, WITH THE SIX-NAME LIST. Optimizely, ASOS, Next plc, TfL, Halfords and Gatwick - every UK consumer-facing compromise disclosed this month began at a supplier, not at the named brand's own perimeter. Six consecutive instances is a pattern, not a run of bad luck, and it is a governance finding rather than a technical one."],"references":["https://breachnews.com/breaches/n0n-mattel-gannett-leak-site-claims/","https://www.ransomware.live/group/N0n","https://threatcluster.io/dark-web/group/n0n","https://www.dexpose.io/n0n-ransomware-attack-on-next-plc/","https://www.forbes.com/sites/larsdaniel/2026/11/26/usa-today-data-breach-claim-hackers-say-they-have-166-million-records/","https://www.just-style.com/news/next-supplier-cyber-attack/","https://bmmagazine.co.uk/news/next-cyber-breach-third-party-supplier/","https://www.claimsjournal.com/news/national/2026/11/24/341510.htm","https://www.theregister.com/security/2026/11/25/gatwick-drop-off-customers-personal-data-exposed-in-supplier-breach/5312060","https://www.internationalairportreview.com/in-depth-gatwick-investigates-data-breach-at-third-party-autopay-drop-off-payment-system/2137092.article","https://www.ibtimes.co.uk/gatwick-autopay-unauthorised-access-customer-data-1834732","https://www.itv.com/news/london/2026-11-24/gatwick-airport-customers-data-potentially-accessed-in-payment-system-breach","https://www.lbc.co.uk/article/gatwick-airport-drop-off-payment-system-disabled-after-customer-data-breach-5HjdnWY_2/","https://cybermagazine.com/news/next-data-breach-shows-why-supplier-security-matters"],"kql":[{"platform":"sentinel","table":"_Im_Dns","name":"Lookalike domains for the UNFAMILIAR supplier names in this entry","description":"More effective than monitoring the well-known brands, because customers and staff have no baseline for what 'parkpark' or 'times24' should look like. That absence of familiarity is exactly what makes supplier-name lookalikes work after a third-party breach.","query":"let SupplierTerms = dynamic([\"autopay\",\"auto-pay\",\"parkpark\",\"park-park\",\"times24\",\"times-24\",\"gatwick-dropoff\",\"gatwick-drop-off\",\"gatwickpay\",\"dropoff-pay\",\"hmv-\",\"next-account\",\"nextplc\"]);\nlet Legit = dynamic([\"gatwickairport.com\",\"parkpark.com\",\"times24.co.uk\",\"hmv.com\",\"next.co.uk\"]);\n_Im_Dns\n| where TimeGenerated > datetime(2026-11-23)\n| where DnsQuery has_any (SupplierTerms)\n| where not(DnsQuery has_any (Legit))\n| summarize Lookups = count(), Clients = dcount(SrcIpAddr), ClientList = make_set(SrcIpAddr, 20), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by DnsQuery\n| order by FirstSeen desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Inbound mail impersonating Gatwick, AutoPay, ParkPark, Times24, hmv or Next","description":"Gatwick's own scam warning named all four entities in its supply chain. This query operationalises that warning. Note that mail impersonating a supplier nobody has heard of is harder for recipients to reject than mail impersonating a bank.","query":"let Terms = dynamic([\"gatwick\",\"autopay\",\"auto pay\",\"parkpark\",\"times24\",\"drop-off charge\",\"dropoff charge\",\"drop off payment\",\"hmv\",\"next plc\",\"your next order\"]);\nlet LegitDomains = dynamic([\"gatwickairport.com\",\"parkpark.com\",\"times24.co.uk\",\"hmv.com\",\"next.co.uk\"]);\nEmailEvents\n| where Timestamp > datetime(2026-11-23)\n| where (Subject has_any (Terms)) or (SenderDisplayName has_any (Terms)) or (SenderFromName has_any (Terms))\n| where not(SenderFromDomain has_any (LegitDomains))\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 15), Urls = make_set(UrlCount, 5), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderFromAddress, SenderIPv4\n| order by Messages desc"},{"platform":"sentinel","table":"SigninLogs","name":"Credential stuffing against your own services using reused AutoPay passwords","description":"The realistic harm from the Gatwick breach is credential reuse, not card fraud: one report describes HASHED PASSWORDS as exposed. A customer who used the same password at AutoPay and at your service is the exposure, and spray patterns are how it manifests.","query":"SigninLogs\n| where TimeGenerated > datetime(2026-11-23)\n| where ResultType != 0\n| summarize Attempts = count(), TargetedAccounts = dcount(UserPrincipalName), Accounts = make_set(UserPrincipalName, 25), Apps = make_set(AppDisplayName, 10), Errors = make_set(ResultType, 10), FirstSeen = min(TimeGenerated) by IPAddress, UserAgent\n| where TargetedAccounts >= 10\n| order by TargetedAccounts desc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"Unexpected data egress to third-party e-commerce search, discovery and AI assistant providers","description":"Addresses the shared-provider inference and the AI assistant question together. Identify who your site calls out to for search, product discovery and chat, then verify the volume and direction of that traffic. Adapt the term list to your own suppliers once you know who they are.","query":"let ProviderTerms = dynamic([\"search\",\"discovery\",\"recommend\",\"personaliz\",\"personalis\",\"chatbot\",\"assistant\",\"conversational\",\"nlp\",\"relevance\"]);\nAzureDiagnostics\n| where TimeGenerated > ago(45d)\n| where Category in (\"ApplicationGatewayAccessLog\", \"FrontdoorAccessLog\", \"AzureFirewallNetworkRule\", \"AzureFirewallApplicationRule\")\n| extend Target = coalesce(tostring(column_ifexists(\"host_s\", \"\")), tostring(column_ifexists(\"msg_s\", \"\")))\n| where Target has_any (ProviderTerms)\n| summarize Requests = count(), BytesOut = sum(todouble(column_ifexists(\"sentBytes_d\", 0))), FirstSeen = min(TimeGenerated) by Target, Resource, bin(TimeGenerated, 1d)\n| order by BytesOut desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Bulk access to chat transcript, conversation log and customer interaction stores","description":"The query that follows from the 320,000-line AI assistant chat claim. If your organisation stores assistant or chatbot transcripts, they are a sensitive data store that almost certainly has no access monitoring on it. This establishes a baseline so an anomaly is visible later.","query":"CloudAppEvents\n| where Timestamp > ago(45d)\n| where ActionType has_any (\"FileDownloaded\", \"FileAccessed\", \"FileSyncDownloadedFull\", \"TableExported\", \"QueryExecuted\")\n| where ObjectName has_any (\"chat\", \"transcript\", \"conversation\", \"assistant\", \"chatbot\", \"session-log\", \"interaction\", \"measurement\", \"sizing\")\n| summarize Events = count(), Objects = dcount(ObjectName), Samples = make_set(ObjectName, 25), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by AccountDisplayName, IPAddress, Application\n| order by Objects desc"}],"iocs":[{"type":"note","value":"LEAK CLOCK: every N0n listing posted on 25 NOVEMBER carries a countdown to a publication deadline of APPROXIMATELY 2 DECEMBER 2026 and is marked 'NOT PAID'. The named set includes Mattel, Gannett, NEXT, HMV, Torrid and seventeen others","context":"Next Wednesday. No live countdown timer was observable so the exact hour is unconfirmed, but the date is consistent across outlets.","confidence":"medium","source":"N0n leak site via BreachNews, Ransomware.live and ThreatCluster"},{"type":"note","value":"THE MOST INTERESTING CLAIM IN THIS ENTRY: N0n claims to hold, for Next plc, more than 3.5 MILLION ROWS of search query and revenue data, more than 320,000 LINES OF SHOPPER CHATS WITH AN AI SHOPPING ASSISTANT INCLUDING BODY MEASUREMENTS AND SIZING DETAILS, and records for 293 NAMED STAFF","context":"UNVERIFIED attacker claim. If accurate it is the first item in this feed where a customer-facing AI assistant's conversational logs are themselves the claimed breach payload - a sensitive data store almost nobody classified as one when the feature shipped. Every UK retailer with a chat assistant should ask where those transcripts go.","confidence":"low","source":"N0n leak site claims via BreachNews and secondary reporting"},{"type":"note","value":"DO NOT CONFLATE THE TWO NEXT THREADS: Next disclosed on 23 NOVEMBER via a London Stock Exchange filing that an UNNAMED third-party online supplier suffered a cyber incident resulting in unauthorised access to 'certain BENIGN data relating to NEXT', and says current evidence indicates NO customer personal data was compromised. N0n listed Next SEPARATELY on 25 November. Next has NOT named the supplier and has NOT linked the two","context":"The gap between 'benign data' and '320,000 lines of body measurements' is enormous and UNRESOLVED. One characterisation is wrong, or they describe different data sets, or the N0n claim is inflated.","confidence":"high","source":"Next plc LSE filing via just-style, BM Magazine, Claims Journal and Cyber Magazine"},{"type":"note","value":"SHARED-PROVIDER INFERENCE: FIVE retail listings including hmv and Torrid carry IDENTICAL WORDING about shopper search sessions, pointing at ONE UNNAMED SHARED E-COMMERCE SEARCH PROVIDER rather than twenty-plus separate intrusions. NO provider has been named by anyone","context":"The most useful analytical point in the N0n campaign and reached independently by more than one write-up. The provider's other customers are the undisclosed victim population and will learn from a leak site rather than a notification.","confidence":"medium","source":"BreachNews analysis of identical listing wording, corroborated by a second independent write-up"},{"type":"note","value":"ACTOR CREDIBILITY IS DOCUMENTED AS POOR: Bitdefender reported an EXPOSED N0n FILE SERVER showing it had targeted JUST OVER 20 VICTIMS while its leak site listed MORE THAN 100, and called the group's threat image 'A FALSE DEPICTION'. No samples released for the headline 166 MILLION Gannett / USA Today claim; USA Today has not confirmed a breach","context":"Why this entry ranks tenth rather than higher. Treat every N0n volume figure as an advertisement until samples appear.","confidence":"high","source":"Bitdefender research via secondary reporting; Forbes coverage of the USA Today claim"},{"type":"note","value":"GATWICK SUPPLIER CHAIN IS NOW THREE DEEP AND CONFIRMED: the affected system is AUTOPAY, OPERATED BY PARKPARK, USED BY TIMES24 UK LIMITED, which is Gatwick's DROP-OFF ZONE MANAGER","context":"THE WHOLE LESSON OF THIS ENTRY IN ONE SENTENCE. A customer paying a drop-off charge had no way to know any of those names existed. Clarified in this window compared with earlier reports naming only Times24.","confidence":"high","source":"Gatwick customer notification seen by The Register, and International Airport Review"},{"type":"note","value":"NEW IN THIS WINDOW: one report describes HASHED PASSWORDS as exposed in the Gatwick AutoPay breach, consistent with the 'AutoPay login information' category Gatwick itself names","context":"This makes the realistic harm CREDENTIAL REUSE rather than card fraud, and it should be communicated to customers that way. Anyone who reused their AutoPay password elsewhere should change it.","confidence":"medium","source":"Single report among the Gatwick coverage reviewed, 25-28 November 2026"},{"type":"note","value":"GATWICK SCOPE CONFLICT STILL UNRESOLVED ON DAY FOUR: Gatwick says a SMALL NUMBER of accounts were affected and exposed data MAY include card brand, LAST FOUR DIGITS and EXPIRY DATE in isolated cases, plus payment records, AutoPay login information, customer contact and personal details, and vehicle and drop-off information. Full card numbers, security codes and bank account numbers appear in NO report reviewed. Several UK outlets nonetheless assert stolen BANK DETAILS, which Gatwick has not confirmed","context":"Record both positions. Gatwick has still published NO customer count, NO record date range and NO vector, and neither has Times24 UK Limited or ParkPark. The ICO is assessing the incident and Gatwick's investigation is ongoing.","confidence":"high","source":"Gatwick statements via The Register, ITV News, LBC, IBTimes UK and International Airport Review"},{"type":"ttp","value":"Phishing impersonating UNFAMILIAR supplier names after a third-party breach - Gatwick, Times24, AutoPay, ParkPark","context":"Gatwick's own scam warning named all four entities, which is better practice than most breach notifications manage. Supplier-name lookalikes work BECAUSE customers have no baseline for what the real one looks like. FIFTH instance in this report of an incident response becoming the next attack's pretext.","confidence":"high","source":"Gatwick customer scam warning via UK outlets; Which? consumer warning"},{"type":"behaviour","value":"Newly registered domains combining autopay, parkpark, times24, gatwick-dropoff, hmv or next-account terms","context":"Brand-protection monitoring for the supplier names rather than the headline brands. Add these to the DWP and Healthy Start terms from rank 1 and the password-reset terms from rank 7.","confidence":"medium","source":"Analyst assessment based on the named entities and established post-breach fraud patterns"},{"type":"behaviour","value":"Bulk access to chat transcript, conversation log, assistant session or customer interaction data stores","context":"Follows directly from the 320,000-line AI assistant chat claim. If your organisation stores assistant transcripts, they are a sensitive data store that almost certainly has no access monitoring. Establish a baseline now so an anomaly is visible later.","confidence":"medium","source":"Analyst assessment based on the N0n claim regarding Next plc"},{"type":"note","value":"THE PATTERN, SIX CONSECUTIVE INSTANCES: NOT ONE UK consumer-facing compromise disclosed this month began at the named brand's own perimeter - Optimizely, ASOS, Next plc, TfL, Halfords and now Gatwick all started at a supplier","context":"A GOVERNANCE finding, not a technical one. Most UK third-party risk registers do not reach three layers deep, do not include the operator behind the supplier, and do not include the AI feature bolted onto the website last year. Six instances is a pattern, not bad luck.","confidence":"high","source":"Analyst aggregation across this and prior windows of this feed"}]}],"ioc_index":{"account":[{"value":"report@phishing.gov.uk and SMS short code 7726","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"MiCollab LDAP connector service account authenticating from any host other than the MiCollab servers themselves","related_entry":"TI-2026-11-28-004","confidence":"high","related_cves":["CVE-2026-13327 ick-dropoff, hmv or next-account terms","related_entry":"TI-2026-11-28-010","confidence":"medium"},{"value":"Bulk access to chat transcript, conversation log, assistant session or customer interaction data stores","related_entry":"TI-2026-11-28-010","confidence":"medium"}],"filepath":[{"value":"settings.php and settings.local.php modified outside a deployment window","related_entry":"TI-2026-11-28-003","confidence":"high","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"New .php, .phtml, .phar or .inc files under sites/default/files, /modules/, /themes/ or /libraries/ not written by git, composer, rsync or drush","related_entry":"TI-2026-11-28-003","confidence":"medium","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"New .cer, .crt, .pse, .p12, .pfx, .sar or .car files arriving on SAP Basis administration workstations from mail or a browser download","related_entry":"TI-2026-11-28-009","confidence":"medium"}],"malware":[{"value":"4HTTP2SHELL (earlier named 4HTTP2ROOT) - the public exploit name","related_entry":"TI-2026-11-28-005","confidence":"high"}],"note":[{"value":"GOVERNMENT LANGUAGE CHANGED IN THIS WINDOW: the Prime Minister's spokesperson called this a 'live and ongoing incident' and did NOT rule out a malicious actor; Work and Pensions Secretary Pat McFadden called it a 'serious cyber incident' and said he could not say more about the cause","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"DATA POSITION: Downing Street says there is 'currently no evidence of customer data loss' and that 'the investigation is ongoing'; at least one report states DWP has NOT reported a personal data breach; the ICO confirms it is AWARE and ENGAGING with DWP to establish the circumstances","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"NEW AFFECTED SERVICE: the NHS-run HEALTHY START online application portal has been taken offline as part of this incident; existing payments continue","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"CONDITIONALITY WAIVED: DWP has said claimants will NOT be penalised over missing journal entries during the outage","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"DURATION: The Times is reported to say disruption is expected to last MOST OF THE WEEKEND; DWP has given NO official restoration timeline","related_entry":"TI-2026-11-28-001","confidence":"medium"},{"value":"SCOPE NOW EFFECTIVELY RESOLVED AGAINST 'SOME SERVICES': the enumerated affected list runs to Universal Credit sign-in, journals, change reporting and caseworker messaging, State Pension, Pension Credit online, the Pension Credit Checker, PIP applications, Tell Us Once, ESA fit note submission, new claim journeys and the NHS Healthy Start portal","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"BOUNDING STATEMENT: officials say there is currently NO EVIDENCE that a malicious actor has targeted other government departments","related_entry":"TI-2026-11-28-001","confidence":"medium"},{"value":"NAMED EXTERNAL ASSESSMENT: David Knott, the FORMER GOVERNMENT CHIEF TECHNOLOGY OFFICER, is reported to have a 'strong suspicion' that the incident was an attack; the government has not confirmed this","related_entry":"TI-2026-11-28-001","confidence":"medium"},{"value":"STILL ABSENT AFTER THREE CALENDAR DAYS: NO vector, NO actor, NO CVE, NO malware, NO attacker infrastructure, NO named third-party supplier, NO confirmed data-access finding, NO official restoration timeline, NO ministerial statement to Parliament identified in this window","related_entry":"TI-2026-11-28-001","confidence":"high"},{"value":"GOVERNANCE: the Cyber Security and Resilience (NIS) Bill is in ping-pong - the Commons is reported to have rejected BOTH Lords amendments on 24 November, with one division reported as 260 to 98 against the register of foreign powers, and the Bill has returned to the Lords with no date set and a carry-over backstop reported as end of 29 April 2027","related_entry":"TI-2026-11-28-001","confidence":"medium"},{"value":"KEV STATUS CHANGED LAST NIGHT: CISA added CVE-2026-120705 (XML Injection) and CVE-2026-129243 (Incorrect Authorization) on 27 NOVEMBER 2026 with a due date of 30 NOVEMBER 2026; neither is flagged as requiring forensic triage under BOD 26-04; ransomware use is recorded as unknown for both","related_entry":"TI-2026-11-28-002","confidence":"high","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"FIXED VERSIONS - UNUSUALLY UNCONTESTED: 2.27.7, 2.28.6 and 3.0.2. Affected: up to and including 2.27.6, 2.28.0 through 2.28.5, and 3.0.0 through 3.0.1","related_entry":"TI-2026-11-28-002","confidence":"high","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"UPGRADING IS NOT SUFFICIENT: because CVE-2026-129245 is a predictable remember-me signing key allowing ADMINISTRATOR SESSION FORGERY, advisory guidance is to CHANGE ADMINISTRATOR PASSWORDS where exposure is suspected","related_entry":"TI-2026-11-28-002","confidence":"high","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"THE CHAIN: maintainers describe a FIVE-STAGE unauthenticated RCE chain; Eye Security is reported to describe a shorter THREE-FLAW variant. Beyond the two KEV CVEs the cluster includes CVE-2026-129245 (predictable remember-me signing key, admin session forgery), CVE-2026-129244 (stored-query exception disclosing the data directory path), CVE-2026-129242 (JDBC deserialisation) and, per one write-up, CVE-2026-120704 (SQLite JDBC extension loading RCE)","related_entry":"TI-2026-11-28-002","confidence":"medium","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"EXPOSURE: Eye Security is reported to have counted MORE THAN 3,000 internet-facing GeoServer instances","related_entry":"TI-2026-11-28-002","confidence":"medium","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"EXPLOITATION EVIDENCE IS LAYERED, NOT UNIFORM: watchTowr observed PROBING from multiple IPs within ~2 days of disclosure and has NOT reported successful code execution; Eye Security is reported to have observed in-the-wild exploitation of CVE-2026-120705 on 25 NOVEMBER; CISA's 27 November KEV listing is the authoritative exploitation confirmation","related_entry":"TI-2026-11-28-002","confidence":"high","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"NO ATTACKER IP ADDRESSES, DOMAINS, URLS OR FILE HASHES HAVE BEEN PUBLISHED for this activity in any source reviewed","related_entry":"TI-2026-11-28-002","confidence":"high","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"UK PUBLIC SECTOR RELEVANCE IS DOCUMENTED HISTORICALLY BUT NOT CURRENTLY CENSUSED: Defra published official how-to guidance for standing up INSPIRE Web Feature Services in GeoServer, the LGA published local authority INSPIRE implementation case studies, Defra funded local authority compliance, at least one commercial supplier sells a shared INSPIRE service that maintains GeoServer and GeoNetwork for councils, and the Environment Agency is a listed publisher for flooding, hydrography and ecology themes","related_entry":"TI-2026-11-28-002","confidence":"medium","related_cves":["CVE-2026-120705","CVE-2026-129243","CVE-2026-129242","CVE-2026-129244","CVE-2026-129245","CVE-2026-120704"]},{"value":"KEV STATUS CHANGED: CISA added CVE-2026-136716 on 27 NOVEMBER 2026 with a due date of 30 NOVEMBER 2026. This supersedes the 26 November tracker record showing it absent from catalogue snapshot 2026.11.25 at 07:43 GMT, and the 26-27 November entries in this feed that recorded exploitation as resting solely on the Drupal Security Team's own statement","related_entry":"TI-2026-11-28-003","confidence":"high","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"THE PATCH PROVES NOTHING ON ITS OWN: Drupal's reported testing shows attacker admin accounts and backdoors SURVIVE the upgrade, and the administrative interface does not show whether a site is already compromised. The reported consequence is that ANY SITE WITH A REACHABLE INSTALLER SINCE 18 NOVEMBER NEEDS A COMPROMISE CHECK","related_entry":"TI-2026-11-28-003","confidence":"high","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"CATALOGUE DISTINCTION: the BOD 26-04 FORENSIC TRIAGE requirement attaches to CVE-2026-132165 (SA-CORE-2026-017, due 27 November). No source reviewed attaches a forensic triage flag to CVE-2026-136716 (due 30 November)","related_entry":"TI-2026-11-28-003","confidence":"high","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"TIMELINE: CVE-2026-132165 (CVSS 9.8) patched 18 NOVEMBER, reported exploited from 19 NOVEMBER, reportedly found by Anthropic's open-source scanner; it lets an unauthenticated attacker REINSTALL a live site, CREATE AN ADMINISTRATOR ACCOUNT and sometimes EXECUTE CODE. CVE-2026-136716 is a DISTINCT bypass of that fix, published in SA-CORE-2026-019 roughly seven days later and reported abused the same day it was disclosed","related_entry":"TI-2026-11-28-003","confidence":"high","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"REMEDIATION HAS THREE PARTS: (1) upgrade to 10.6.23 / 11.3.23 / 11.4.14, (2) RUN THE UPDATE HOOK, (3) conduct a COMPROMISE ASSESSMENT if the installer was reachable since 18 November. The earlier stray reference to 'update to Drupal 11.4.13' does not recur and 11.4.14 is treated as the required 11.4 build","related_entry":"TI-2026-11-28-003","confidence":"high","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"DEADLINE COLLISION: all three CVEs in the 27 November KEV batch - CVE-2026-136716, CVE-2026-120705 and CVE-2026-129243 - are due 30 NOVEMBER. In many UK councils the Drupal website estate and the GeoServer map service estate belong to the SAME small web and digital team","related_entry":"TI-2026-11-28-003","confidence":"medium","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"A commercial extended-support vendor's claim that Drupal 7 is affected remains single-sourced and vendor-interested and is NOT carried as established in this report","related_entry":"TI-2026-11-28-003","confidence":"low","related_cves":["CVE-2026-136716","CVE-2026-132165"]},{"value":"DUE TODAY 28 NOVEMBER - EIGHT CVES: CVE-2026-133275, CVE-2026-133303, CVE-2026-133323 (CVSS 10.0) and CVE-2026-133324 (Mitel MiCollab AWV); CVE-2026-103406 (HPE Juniper Session Smart, FORENSIC TRIAGE); CVE-2026-133469 (Vates Xen Orchestra, CVSS 9.8, FORENSIC TRIAGE); CVE-2023-25914 and CVE-2023-25915 (Danfoss AK-SM 800A)","related_entry":"TI-2026-11-28-004","confidence":"high","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"]},{"value":"OVERDUE AS OF TODAY - SEVEN CVES: CVE-2026-132165 (Drupal, FORENSIC TRIAGE, due 27 Nov), CVE-2026-131914 (Idunno.AntiCsrf, NO PATCH EXISTS, due 27 Nov), CVE-2026-132224 (Optimizely, due 27 Nov), CVE-2026-133968 (MONAI Label), CVE-2026-134624 (N-able Mail Assure), CVE-2026-123890 (VMware vCenter, CVSS 9.8), CVE-2026-76466 (Cisco Expressway)","related_entry":"TI-2026-11-28-004","confidence":"high","related_cves":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-13
