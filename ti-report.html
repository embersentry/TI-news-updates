","Treat the Puppet Server as a tier-zero asset in your own classification if it is not already. It configures everything else, so it warrants the monitoring, change control and administrative access model you apply to domain controllers rather than the one you apply to application servers.","Hunt for post-exploitation on the Puppet Server itself over the period since 3 November: child processes of the Puppet Server JVM, new or modified manifests and modules, unexpected catalogue compilations, and changes to the Hiera or eyaml secret stores. A compromise here is most likely to be used to modify what gets pushed, not to stay on the server.","Check whether any configuration change was pushed to the fleet that you cannot trace to a change record. If the Puppet Server were compromised, the highest-value action for an attacker is a malicious catalogue distributed to every node, which looks like legitimate configuration management in every log that records it.","Rotate secrets held by or accessible to the Puppet Server if you find any evidence of compromise, and treat that as including the agent CA if the CA is co-located. Re-signing an estate's agent certificates is painful and is the correct response to a compromised CA.","Do not wait for indicators of compromise to be published. CISA names no actor and lists ransomware use as unknown, so there is nothing to match on; the available controls are patch state, certificate hygiene and network reachability."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Puppet Enterprise and Puppet Server exposure to CVE-2026-115731","description":"Exposure check against the 3 November fixed versions. Falls back to software inventory names where the CVE is not yet mapped by the vulnerability feed.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId == \"CVE-2026-115731\" or (SoftwareName has \"puppet\")\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion, CveId, VulnerabilitySeverityLevel\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by SoftwareName, SoftwareVersion, CveId\n| order by Hosts desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Code execution as the Puppet service user (child processes of the Puppet Server JVM)","description":"The direct consequence of successful exploitation: arbitrary code running as the Puppet Server service user. Baseline first - Puppet legitimately runs some commands - then alert on the deviations.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-11-01)\n| where InitiatingProcessCommandLine has_any (\"puppetserver\", \"puppet-server\", \"pe-puppetserver\") or InitiatingProcessAccountName has_any (\"pe-puppet\", \"puppet\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"nc\", \"ncat\", \"socat\", \"python\", \"python3\", \"perl\", \"ruby\", \"base64\", \"chmod\", \"crontab\", \"useradd\", \"ssh-keygen\")\n| project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"sentinel","table":"Syslog","name":"Puppet Server deserialization and unexpected request errors","description":"Application-log view. Deserialization exploitation frequently leaves Java deserialization or class-loading errors even when it succeeds.","query":"Syslog\n| where TimeGenerated > datetime(2026-11-01)\n| where ProcessName has_any (\"puppetserver\", \"puppet\", \"pe-puppetserver\") or SyslogMessage has \"puppetserver\"\n| where SyslogMessage has_any (\"ObjectInputStream\", \"readObject\", \"deserializ\", \"ClassNotFoundException\", \"InvalidClassException\", \"java.lang.Runtime\", \"ProcessBuilder\", \"unexpected end of stream\")\n| project TimeGenerated, Computer, ProcessName, SeverityLevel, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"Syslog","name":"Puppet CA certificate signing activity - new agent certificates","description":"Exploitation needs any CA-signed agent certificate. A certificate signed for a host you do not recognise is both an exposure and a possible attacker action.","query":"Syslog\n| where TimeGenerated > ago(90d)\n| where SyslogMessage has_any (\"Signed certificate request for\", \"puppet cert sign\", \"puppetserver ca sign\", \"certificate_status\", \"CSR\")\n| extend SignedFor = extract(@\"Signed certificate request for ([A-Za-z0-9._-]+)\", 1, SyslogMessage)\n| where isnotempty(SignedFor)\n| summarize Signings = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Computer, SignedFor\n| order by LastSeen desc"},{"platform":"sentinel","table":"Syslog","name":"Unexpected catalogue compilations and manifest changes (fleet-wide push detection)","description":"The highest-value attacker action after compromising a Puppet Server is modifying what it pushes. This looks for compilation and manifest activity outside change windows.","query":"Syslog\n| where TimeGenerated > datetime(2026-11-01)\n| where SyslogMessage has_any (\"Compiled catalog for\", \"Applied catalog\", \"environment production\", \"code deployed\", \"r10k deploy\", \"Code Manager\")\n| extend NodeName = extract(@\"Compiled catalog for ([A-Za-z0-9._-]+)\", 1, SyslogMessage)\n| summarize Compilations = count(), Nodes = dcount(NodeName) by bin(TimeGenerated, 1h), Computer\n| order by Compilations desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Manifest, module and secret-store modification on the Puppet Server","description":"Persistence and fleet-poisoning detection. Changes here propagate to every managed node, which is why they deserve their own hunt.","query":"DeviceFileEvents\n| where Timestamp > datetime(2026-11-01)\n| where FolderPath has_any (\"/etc/puppetlabs\", \"/opt/puppetlabs\", \"environments/production\", \"/manifests\", \"/modules\", \"hiera\", \"eyaml\")\n| where ActionType in (\"FileCreated\", \"FileModified\", \"FileDeleted\")\n| where not(InitiatingProcessFileName in~ (\"r10k\", \"git\", \"puppet\"))\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Who can reach the Puppet Server on 8140 (reachability audit)","description":"Supports the network-restriction action. Any source outside the expected agent population is both an exposure and an exploitation prerequisite that you can remove.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemotePort == 8140 or LocalPort == 8140\n| summarize Connections = count(), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, RemoteIP, RemoteIPType, LocalPort, RemotePort, InitiatingProcessFileName\n| order by Connections desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Puppet Server exposed beyond the agent estate, including to the internet","description":"Perimeter view of the same question. A Puppet Server that answers from the internet should be remediated as a finding in its own right.","query":"CommonSecurityLog\n| where TimeGenerated > ago(30d)\n| where DestinationPort == 8140\n| extend ExternalSource = not(ipv4_is_private(SourceIP))\n| summarize Connections = count(), Sources = dcount(SourceIP) by DestinationIP, DestinationHostName, ExternalSource, DeviceAction\n| order by ExternalSource desc, Connections desc"}],"iocs":[{"type":"note","value":"NO PUBLISHED INDICATORS OF COMPROMISE","context":"CISA's KEV entry names no actor and no victim, lists ransomware use as unknown, and no vendor has published attacker infrastructure or payload detail. The items below are exposure conditions, prerequisites and detection behaviours, not indicators.","confidence":"high","source":"CISA KEV entry via secondary reporting"},{"type":"ttp","value":"Deserialization of untrusted data on a configuration-management control plane, authenticated by any CA-signed agent certificate","context":"The exploitation prerequisite is the key fact: in a normal Puppet deployment every managed node already holds such a certificate, so the authentication requirement is met by design across the estate.","confidence":"high","source":"CVE record description via secondary reporting"},{"type":"ttp","value":"Trust inversion - a managed agent executing code on the server that is supposed to manage it","context":"Why this outranks higher-scoring application vulnerabilities. One compromised or rogue node becomes authority over every node the server configures.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Code execution as the Puppet Server service user (commonly pe-puppet or puppet)","context":"The stated impact. Detect it as unexpected child processes of the Puppet Server JVM; baseline first, because Puppet legitimately executes some commands.","confidence":"medium","source":"CVE record and analyst assessment"},{"type":"behaviour","value":"Unrevoked CA-signed agent certificates belonging to decommissioned or unrecognised hosts","context":"A standing exploitation credential that patching does not remove. Long-lived estates usually hold several. Revoke and clean them as a second task after patching.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Modification of manifests, modules, Hiera data or eyaml secrets outside a change record","context":"The highest-consequence attacker action after compromising a Puppet Server: a malicious catalogue pushed to the fleet looks like legitimate configuration management in every log that records it.","confidence":"medium","source":"analyst assessment"},{"type":"port","value":"8140","context":"Default Puppet Server port. Reachability from outside the legitimate agent population is an exploitation prerequisite you can remove with a firewall rule; exposure to the internet is a finding in its own right.","confidence":"high","source":"product documentation and analyst assessment"},{"type":"note","value":"FIXED VERSIONS (released 3 November 2026): Puppet Enterprise 2026.0.1, 2025.12.1, 2023.8.13; Puppet Core 9.1.3, 8.22.2","context":"Available two weeks before CISA recorded exploitation. The fortnight between fix and observed exploitation is the pattern the NCSC's 3 November annual review highlighted.","confidence":"medium","source":"Perforce advisory via secondary reporting"},{"type":"note","value":"CISA KEV ADDED 17 November 2026, REMEDIATION DUE 1 December 2026","context":"UK organisations carry no CISA obligation but have no better public deadline; use 1 December as the internal date for a control-plane asset.","confidence":"high","source":"CISA alert of 17 November 2026"},{"type":"note","value":"SCORING CONFLICT: CVSS 4.0 of 9.4 reported; one aggregator lists 9.9; no agreed v3.1 score identified","context":"The cvss_v3 field for this entry is deliberately null rather than populated with a v4.0 number. Mixing CVSS versions in a risk register is how a critical gets triaged as a high.","confidence":"medium","source":"conflicting secondary sources"},{"type":"note","value":"PUBLIC PROOF OF CONCEPT: a PoC scanner is publicly listed; no Metasploit or Exploit-DB module identified as at 18 November 2026","context":"Lowers the barrier to opportunistic exploitation attempts against reachable servers, and raises the value of the network-restriction control.","confidence":"medium","source":"Sploitus listing via search-result summaries"}],"references":["https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog","https://blog.netmanageit.com/hackers-exploiting-critical-puppet-rce-flaw-affecting-enterprise-management-servers/","https://nflo.tech/knowledge-base/2026-11-17-cve-2026-115731-en/","https://windowsforum.com/news/cve-2026-115731-cisa-warns-of-active-exploitation-of-puppet-server-code-execution-flaw.452778/","https://shattered.io/puppet-enterprise-cve-2026-115731-cisa-kev-cvss-9-4-dec-1-deadline/","https://mallory.ai/stories/01a1ec31-2346-787f-91e8-235192221f7c","https://vulners.com/cisa/CISA:EA6F2B8840D0EB0687A5117F9807732E"]},{"rank":4,"id":"TI-2026-11-18-003","title":"UK Government: HMRC's 17 November Figures Record 95,340 Suspected Scam Reports in Twelve Months, 1,024 Brand-Infringement Cases and 8,713 Fraudulent Sites Taken Down - and a Self Assessment Phishing Season That Has Already Started, Including GOV.UK-Branded Refund Lures and Microsoft-Outage-Themed Credential Theft","cve_ids":[],"vendor":"HM Revenue & Customs (HMRC); GOV.UK brand; UK taxpayers and their agents","affected_products":["HMRC Online Services and the Government Gateway credential, which is the credential being phished","The GOV.UK brand and HMRC's email, SMS and telephone channels, impersonated at scale","UK taxpayers inside Self Assessment, and the accountancy and payroll firms that act as their agents","UK employers' finance and payroll inboxes, which receive the same lures with an invoice or repayment framing"],"category":"threat_actor_campaign","cvss_v3":null,"severity":"medium","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-17","last_updated":"2026-11-18","confidence":"medium","summary":"This is the UK government item dated inside the window, and unlike most of this feed's UK government entries it concerns an active campaign rather than a policy document. On 17 November 2026 HMRC published figures for the twelve months to 31 October 2026: a total of 95,340 reports of suspected scams, 1,024 cases of HMRC brand infringement, and 8,713 fraudulent websites removed. The publication is a seasonal warning as much as a statistic - the Self Assessment deadline of 31 January 2027 is the single largest driver of HMRC-themed phishing in the UK calendar, and the volume climbs from mid-November through January as taxpayers start to expect messages about their return.\n\nThe specific lure to brief people on. HMRC describes a campaign from August 2026 that generated around 900 scam reports on its own and used malicious attachments together with a fake GOV.UK page, telling recipients they had an unclaimed tax repayment. That combination is worth noting precisely: the attachment carries the payload or the credential-harvesting form, and the fake GOV.UK page provides the trust. The 'unclaimed repayment' framing is effective because it is plausible at this point in the tax year and because it prompts the recipient to act quickly and quietly rather than to ask a colleague.\n\nThe second lure is the one most relevant to corporate security teams, and it is a clean example of incident-chaining. Reporting dated 13 November states that following the Microsoft outage of 12-13 November 2026, HMRC received reports of messages posing as Microsoft and asking for HMRC login details. That is two trust brands stacked in a single message: a genuine, widely-known service disruption as the pretext, Microsoft as the sender, and the Government Gateway credential as the target. The pattern to take from it is general rather than specific - any well-publicised outage or incident becomes a phishing pretext within about 24 hours, and the credential requested is often unrelated to the service that failed. This feed carried a Microsoft 365 outage phishing entry on 16 November and rotated it out; the HMRC-targeted variant is the reason it is worth recording again.\n\nWhy it is ranked fourth rather than higher. There is no vulnerability, no patch and no exploitation here, and the severity is medium rather than critical. It is ranked fourth because the brief this feed serves is UK government first, this is the only UK government item with activity inside the window, and - unlike a parliamentary report - it is directly actionable by a corporate security team this week. It is ranked below the three technical entries because those are either actively exploited at scale or carry a national-agency 'patch immediately' alert.\n\nWhat a UK corporate security team should actually do with HMRC phishing data. Three things. First, the agent angle: accountancy, payroll and bookkeeping firms hold Government Gateway agent credentials that reach many clients' tax affairs, which makes them a higher-value target than any individual taxpayer and makes them a supply-chain risk to their clients. If you outsource payroll or tax, the credential that matters may not be yours. Second, the finance-inbox angle: the same lures arrive with an invoice or repayment framing at accounts payable, where the control is process - no payment or bank-detail change on the strength of an inbound message - rather than filtering. Third, the reporting angle: HMRC's phishing reporting address and the NCSC Suspicious Email Reporting Service are the mechanisms that produced the 8,713 takedowns, so forwarding is not a formality; it is how the infrastructure gets removed.\n\nThe figures conflict and the conflict is worth knowing. HMRC's own 17 November figure is 95,340 reports over the twelve months to 31 October. A separate outlet reports 48,119 reports in a headline about the same warning, and another reports 'nearly 2,000 Self Assessment scams'. These are almost certainly different measures over different periods - all reports versus a subset, or a quarter versus a year - rather than contradictions, but do not mix them in a briefing. Cite 95,340 against 'twelve months to 31 October 2026' and nothing else.\n\nConfidence and caveats. Confidence is medium. The 17 November HMRC press release is the primary source for the headline figures and is consistently reported, but it was not fetched directly in this environment - gov.uk was not retrieved. The Microsoft-outage-themed HMRC credential phishing is from a secondary source dated 13 November and is the lowest-confidence item in this entry. No attacker infrastructure, sender addresses or domains are published in the sources reviewed, so this entry carries behavioural indicators and detection logic rather than blockable values. Treat the detection queries as starting points that will need tuning against your own mail flow, because HMRC-keyword matching produces legitimate hits in any UK organisation that handles tax.","recommended_actions":["Send a short internal notice this week, before the Self Assessment season peaks, naming the two live lures specifically: an 'unclaimed tax repayment' message with an attachment and a fake GOV.UK page, and messages posing as Microsoft that ask for HMRC login details. Naming the lure works; generic 'be vigilant' messaging does not.","Tell staff the one durable rule about this brand: HMRC does not notify tax repayments by email or text with a link or an attachment, and never asks for Government Gateway credentials in a message. Anyone expecting a repayment should navigate to GOV.UK themselves. That single sentence defeats both current lures.","Harden the finance and payroll inboxes with process rather than filtering. No payment, no bank-detail change and no credential entry on the strength of an inbound message, regardless of branding, with an out-of-band verification step using a known-good number. These lures land at accounts payable with a repayment or invoice framing.","Treat your accountancy, payroll and bookkeeping providers as a credential supply-chain risk and ask them directly what protects their Government Gateway agent credentials: phishing-resistant MFA, conditional access, named individuals rather than shared logins. An agent credential reaches many clients' tax affairs, which makes it worth more to an attacker than yours.","Hunt your own mail telemetry for the lure patterns rather than waiting for a report: HMRC and GOV.UK branding from non-gov.uk sending domains, lookalike display names, 'tax repayment' and 'refund' subject lines with attachments, and credential-harvesting pages that imitate GOV.UK. The queries in this entry are starting points and will need tuning.","Add the general rule to your incident playbook: when a major service outage is publicised, expect themed phishing within 24 hours, and expect the credential requested to be unrelated to the service that failed. The 12-13 November Microsoft outage producing requests for HMRC credentials is the cleanest recent example.","Make reporting routine, because it is what produced the 8,713 takedowns. Ensure staff know to forward suspicious HMRC messages to HMRC's phishing reporting address and to the NCSC Suspicious Email Reporting Service, and that doing so is expected rather than optional.","If you cite the numbers, cite them precisely: 95,340 suspected scam reports, 1,024 brand-infringement cases and 8,713 fraudulent sites removed, all for the twelve months to 31 October 2026. Other figures in circulation (48,119; 'nearly 2,000') measure different things over different periods and should not be mixed in."],"kql":[{"platform":"defender_xdr","table":"EmailEvents","name":"HMRC and GOV.UK branding from senders outside gov.uk","description":"The core detection for this campaign. Expect legitimate hits from accountants and payroll providers - tune by excluding your known agents rather than by weakening the pattern.","query":"let GovDomains = dynamic([\"gov.uk\", \"hmrc.gov.uk\", \"tax.service.gov.uk\", \"notifications.service.gov.uk\"]);\nEmailEvents\n| where Timestamp > ago(30d)\n| where Subject has_any (\"HMRC\", \"HM Revenue\", \"tax refund\", \"tax repayment\", \"self assessment\", \"Self Assessment\", \"unclaimed repayment\", \"Government Gateway\", \"UTR\")\n   or SenderFromDisplayName has_any (\"HMRC\", \"HM Revenue\", \"GOV.UK\", \"Gov.uk\")\n| extend SenderDomain = tostring(split(SenderFromAddress, \"@\")[1])\n| where not(SenderDomain has_any (GovDomains))\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 10), Verdicts = make_set(DeliveryAction, 5) by SenderDomain, SenderFromAddress, SenderFromDisplayName\n| order by Messages desc"},{"platform":"defender_xdr","table":"EmailAttachmentInfo","name":"The August 2026 lure shape: HMRC-themed message carrying an attachment","description":"HMRC does not send repayment notifications with attachments, so this combination is close to a definitive indicator in a UK mailbox.","query":"EmailAttachmentInfo\n| where Timestamp > ago(30d)\n| join kind=inner (EmailEvents | where Timestamp > ago(30d) | project NetworkMessageId, Subject, SenderFromAddress, SenderFromDisplayName, RecipientEmailAddress, DeliveryAction) on NetworkMessageId\n| where Subject has_any (\"HMRC\", \"HM Revenue\", \"tax refund\", \"tax repayment\", \"self assessment\", \"repayment\", \"rebate\") or SenderFromDisplayName has_any (\"HMRC\", \"HM Revenue\", \"GOV.UK\")\n| where isnotempty(FileName)\n| project Timestamp, SenderFromAddress, SenderFromDisplayName, Subject, FileName, FileType, SHA256, RecipientEmailAddress, DeliveryAction\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"UrlClickEvents","name":"Clicks on GOV.UK lookalike destinations","description":"Catches the fake GOV.UK page described in the August 2026 campaign. Excludes the genuine service domains so that only impersonations surface.","query":"UrlClickEvents\n| where Timestamp > ago(30d)\n| where Url has_any (\"hmrc\", \"gov-uk\", \"govuk\", \"gov.uk-\", \"taxrefund\", \"tax-refund\", \"taxrepayment\", \"gateway-login\", \"selfassessment\", \"self-assessment\")\n| extend UrlHost = tostring(parse_url(Url).Host)\n| where not(UrlHost endswith \".gov.uk\" or UrlHost == \"gov.uk\")\n| project Timestamp, AccountUpn, Url, UrlHost, ActionType, IsClickedThrough, ThreatTypes, NetworkMessageId\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Outage-themed credential phishing: Microsoft branding asking for third-party credentials","description":"Detects the 12-13 November pattern, where a genuine outage was the pretext, Microsoft the apparent sender, and an unrelated credential the target.","query":"EmailEvents\n| where Timestamp > datetime(2026-11-10)\n| where (Subject has_any (\"outage\", \"service disruption\", \"service incident\", \"restore access\", \"re-verify\", \"reverify\", \"account verification\", \"sign-in required\", \"unusual activity\"))\n| where Subject has_any (\"Microsoft\", \"Office 365\", \"Microsoft 365\", \"Outlook\", \"Teams\") or SenderFromDisplayName has_any (\"Microsoft\", \"Office 365\", \"Microsoft 365\")\n| extend SenderDomain = tostring(split(SenderFromAddress, \"@\")[1])\n| where not(SenderDomain has_any (\"microsoft.com\", \"office.com\", \"microsoftonline.com\", \"office365.com\", \"azure.com\"))\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 10) by SenderDomain, SenderFromAddress, SenderFromDisplayName\n| order by Messages desc"},{"platform":"sentinel","table":"SigninLogs","name":"Credential-phishing outcome: sign-ins from new infrastructure for finance and payroll staff","description":"Detects the consequence rather than the lure. Scope the user list to finance, payroll and tax roles, which are the targeted population.","query":"let FinanceUsers = dynamic([]); // populate with finance, payroll and tax UPNs\nSigninLogs\n| where TimeGenerated > ago(30d)\n| where array_length(FinanceUsers) == 0 or UserPrincipalName in~ (FinanceUsers)\n| where ResultType == 0\n| summarize Signins = count(), Countries = make_set(tostring(LocationDetails.countryOrRegion), 10), ASNs = make_set(tostring(parse_json(tostring(DeviceDetail)).browser), 5), IPs = dcount(IPAddress) by UserPrincipalName, AppDisplayName\n| where IPs > 3\n| order by IPs desc"},{"platform":"sentinel","table":"OfficeActivity","name":"Post-phishing mailbox manipulation in finance mailboxes","description":"After a successful credential theft the common next step is an inbox rule that hides the follow-up correspondence. This is high-fidelity and worth alerting on outright.","query":"OfficeActivity\n| where TimeGenerated > ago(30d)\n| where Operation in (\"New-InboxRule\", \"Set-InboxRule\", \"UpdateInboxRules\", \"Set-Mailbox\", \"Add-MailboxPermission\")\n| extend RuleDetail = tostring(Parameters)\n| where RuleDetail has_any (\"HMRC\", \"tax\", \"refund\", \"invoice\", \"payment\", \"bank\", \"DeleteMessage\", \"MoveToFolder\", \"Junk\", \"RSS\", \"Archive\")\n| project TimeGenerated, UserId, Operation, ClientIP, OfficeWorkload, RuleDetail\n| order by TimeGenerated desc"}],"iocs":[{"type":"note","value":"NO ATTACKER DOMAINS, SENDER ADDRESSES OR HASHES ARE PUBLISHED IN THE SOURCES REVIEWED","context":"HMRC's publication is statistical and does not release indicators. Everything below is a lure pattern, a figure or a behaviour. There is nothing here to put in a blocklist, which is why this entry's value is in the staff notice and the mail-flow hunt rather than in ingestion.","confidence":"high","source":"analyst assessment"},{"type":"ttp","value":"'Unclaimed tax repayment' lure combining a malicious attachment with a fake GOV.UK page","context":"The specific campaign HMRC describes from August 2026, which generated around 900 reports on its own. The attachment carries the payload or harvesting form; the fake GOV.UK page supplies the trust. Plausible at this point in the tax year, which is what makes it work.","confidence":"medium","source":"HMRC press release of 17 November 2026 via secondary reporting"},{"type":"ttp","value":"Outage-chained credential phishing: messages posing as Microsoft, prompted by the 12-13 November 2026 Microsoft outage, asking for HMRC login details","context":"Two trust brands stacked in one message, with the requested credential unrelated to the service that failed. The general rule to take from it is that any publicised outage becomes a phishing pretext within about 24 hours.","confidence":"low","source":"secondary reporting dated 13 November 2026"},{"type":"behaviour","value":"HMRC or GOV.UK branding sent from a domain that is not gov.uk","context":"The highest-value mail-flow hunt for this campaign. Expect legitimate hits from accountants and payroll providers; tune by excluding your known agents rather than by weakening the pattern.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"An HMRC-themed message that carries an attachment","context":"Close to definitive in a UK mailbox: HMRC does not notify repayments by email with an attachment. A cheap, high-fidelity rule.","confidence":"high","source":"analyst assessment based on HMRC's own guidance"},{"type":"behaviour","value":"Targeting of accountancy, payroll and bookkeeping firms holding Government Gateway agent credentials","context":"An agent credential reaches many clients' tax affairs, so these firms are worth more to an attacker than any individual taxpayer and constitute a credential supply-chain risk to their clients.","confidence":"medium","source":"analyst assessment"},{"type":"account","value":"Government Gateway credential","context":"The asset being phished. Protect it with phishing-resistant MFA where available and never enter it from a link in a message; navigate to GOV.UK directly.","confidence":"high","source":"HMRC guidance"},{"type":"note","value":"HMRC FIGURES FOR THE TWELVE MONTHS TO 31 OCTOBER 2026: 95,340 suspected scam reports; 1,024 brand-infringement cases; 8,713 fraudulent websites removed","context":"Cite these three against that period and nothing else. Other figures in circulation (48,119 reports; 'nearly 2,000 Self Assessment scams'; ~900 reports for the August campaign) measure different things over different periods and must not be mixed into one claim.","confidence":"medium","source":"HMRC press release of 17 November 2026 via secondary reporting"},{"type":"note","value":"SEASONAL DRIVER: Self Assessment deadline 31 January 2027","context":"The reason this is published now. HMRC-themed phishing volume climbs from mid-November through January because taxpayers begin to expect messages about their return, which raises the success rate of every lure above.","confidence":"high","source":"HMRC publication and analyst assessment"},{"type":"note","value":"REPORTING ROUTES: HMRC's phishing reporting address and the NCSC Suspicious Email Reporting Service","context":"These are the mechanisms that produced the 8,713 takedowns. Forwarding a suspicious message is how the infrastructure gets removed, so it is worth making routine rather than optional.","confidence":"high","source":"HMRC and NCSC guidance"}],"references":["https://britbrief.co.uk/crime/fraud/hmrc-warns-of-scams-after-48119-reports.html","https://midlothianview.com/news/hmrc-warns-taxpayers-over-fake-refund-scams-ahead-of-self-assessment-deadline","https://www.aberdareonline.co.uk/2026/11/17/nearly-2000-self-assessment-scams-reported/","https://perrysaccountants.co.uk/news/hmrc-phishing-scams","https://britbrief.co.uk/crime/fraud/royal-mail-customers-warned-over-christmas-text-scams.html","https://securityjournaluk.com/phishing-attack-alert-2026/"]},{"rank":5,"id":"TI-2026-11-18-004","title":"Apache HTTP Server mod_http2 CVE-2026-119618: Singapore's CSA Warned on 17 November That It Is Reportedly Being Exploited With a Public Proof of Concept, Seven Days After the Fix - and Earlier Analyses Had Found No Exploitation, So the Claim Is Unconfirmed","cve_ids":["CVE-2026-119618"],"vendor":"Apache Software Foundation","affected_products":["Apache HTTP Server 2.4.55 through 2.4.70 with mod_http2 enabled","Standalone mod_h2 releases 2.0.8 through 2.0.42","Fixed in Apache HTTP Server 2.4.71, released 11 November 2026","Not affected: servers serving HTTP/1.1 only, and builds without mod_http2 loaded"],"category":"vulnerability","cvss_v3":8.1,"severity":"critical","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"yes","first_reported":"2026-11-11","last_updated":"2026-11-18","confidence":"low","summary":"On 17 November 2026 Singapore's Cyber Security Agency published alert AL-2026-164, 'Active Exploitation of Vulnerability in Apache HTTP Server's mod_http2'. The alert's own wording is that the vulnerability is reportedly being actively exploited and that a proof-of-concept exploit is publicly available, and it instructs administrators to patch immediately. The honest reading of this entry is that a national cyber agency has escalated a remote code execution flaw in the most widely deployed web server software in the world to 'active exploitation', while the evidence for exploitation remains second-hand - and that is why it sits at rank 5 with low confidence rather than higher.\n\nThe technical facts are not in dispute. The flaw is in mod_http2, the HTTP/2 module. Apache HTTP Server 2.4.55 through 2.4.70 are affected when mod_http2 is enabled, as are standalone mod_h2 releases 2.0.8 through 2.0.42. Apache released 2.4.71 on 11 November 2026 to fix it. Servers that serve only HTTP/1.1, or that do not load mod_http2, are not affected - which is the first thing to check, because it is a module-level condition rather than a version-level one and a great many internal Apache instances never had HTTP/2 enabled.\n\nThe exploitation evidence conflicts, and the conflict is the point of this entry. CSA says 'reportedly'. Wiz Research reported no known exploitation when it published its analysis on 11 November. F5 Labs is reported to see no major exploit activity. One check found the CVE absent from CISA's KEV catalogue, though that check was dated 15 November, before the CSA alert. No vendor has published indicators, victims, or attacker infrastructure. What exists is a public proof of concept against a remote code execution flaw in Apache httpd, which is enough to justify emergency patching regardless of whether the first confirmed victim has been found.\n\nThe severity scores diverge more than usual and both are defensible. Apache and Red Hat rate the flaw critical, with Red Hat reportedly assigning CVSS 9.8 under v3.1; CSA and the CISA-held record give 8.1, judging the attack harder to carry out. The gap is about exploit complexity, not about impact - everyone agrees the impact is remote code execution. This entry records 8.1 as the v3.1 figure from the alerting agency and flags the 9.8 so that neither number surprises anyone in a change-approval meeting.\n\nUK government and corporate relevance. Apache httpd sits in front of a very large amount of UK public sector and corporate web estate: legacy departmental applications, university services, reverse proxies in front of Java application servers, appliance management interfaces, and the embedded web servers inside products that nobody thinks of as 'an Apache instance'. The last category is the exposure that persists: an Apache build inside a vendor appliance or a container base image is patched by the vendor's release cycle, not by yours. The useful question for a UK security team today is narrower than 'do we run Apache': it is 'which of our Apache instances have mod_http2 enabled, are internet-reachable, and are below 2.4.71'.\n\nThe HTTP/2 detection problem, stated so nobody wastes a day on it. Hunting for exploitation of an HTTP/2 framing or stream-handling bug in ordinary web logs is largely futile: the malicious content lives in binary HTTP/2 frames and header compression state, not in a request line that appears in an access log. Access logs will show, at best, an unusual pattern of connection resets or protocol errors. The realistic detections are the consequences - the httpd process crashing or segfaulting, httpd spawning a shell or a download utility, new files appearing in document roots, and new outbound connections from web servers - and those are what the queries in this entry target.\n\nConfidence and caveats. Confidence is low, which is the lowest this feed has assigned to a ranked entry in this window, and the reason is the exploitation claim alone rather than the vulnerability. The CSA alert number and date (AL-2026-164, 17 November 2026) and the affected and fixed versions are consistently reported. One outlet dates the Singapore warning to 16 November while the alert itself is dated 17 November. CSA publishes no detail on who is being attacked or how. Nothing in this window ties any exploitation to UK targets, and no UK advisory on this CVE was identified. The CSA alert page was not fetched directly in this environment.","recommended_actions":["Answer the narrow question first, because it may remove most of your estate from scope: which Apache HTTP Server instances have mod_http2 loaded and enabled? Check the loaded modules (apachectl -M, or the LoadModule and Protocols directives) rather than the version alone. HTTP/1.1-only servers are not affected.","Patch every affected instance to Apache HTTP Server 2.4.71 or your distribution's equivalent package, prioritising internet-reachable servers and reverse proxies. The fix has been available since 11 November, so this is deployment work.","Where patching cannot happen immediately on an internet-facing instance, consider disabling HTTP/2 as a temporary control - remove h2 and h2c from the Protocols directive, or unload mod_http2 - and accept the performance regression. It removes the vulnerable code path entirely, which no filtering rule can do.","Find the Apache instances that are not yours: inside vendor appliances, inside container base images, inside products with an embedded web server. These are patched on the vendor's cycle rather than yours, and they are the instances that stay vulnerable for months. Raise supplier tickets now rather than at the next review.","Do not spend the day writing access-log detections for this. The malicious content lives in binary HTTP/2 frames and header-compression state, not in a loggable request line. Hunt the consequences instead: httpd crashes and segfaults, httpd spawning shells or download tools, new files in document roots, new outbound connections from web servers.","Add httpd crash monitoring if you do not have it. A memory-corruption exploit that fails crashes the worker process; a cluster of segfaults on one internet-facing web server is an incident signal, not a capacity problem.","Record both severity figures in your risk entry - 8.1 under CVSS v3.1 from CSA and the CVE record, and the critical rating with a reported 9.8 from Apache and Red Hat - and state the version alongside each. The gap is about exploit complexity, not impact; every source agrees the impact is remote code execution.","Treat the exploitation status honestly in internal communications: a national agency says 'reportedly exploited', a public proof of concept exists, and earlier analyses found no exploitation. That is sufficient grounds for emergency patching and insufficient grounds for declaring an active campaign."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Apache HTTP Server exposure to CVE-2026-119618","description":"Exposure list by version. Remember that version alone overstates exposure: mod_http2 must also be enabled.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId == \"CVE-2026-119618\" or (SoftwareName has_any (\"apache http\", \"httpd\", \"apache2\"))\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion, CveId, VulnerabilitySeverityLevel\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by SoftwareName, SoftwareVersion, CveId\n| order by Hosts desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"httpd spawning shells or download utilities (post-exploitation)","description":"The realistic detection for a successful RCE against httpd. A web server has almost no legitimate reason to spawn an interactive shell.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-11-10)\n| where InitiatingProcessFileName in~ (\"httpd\", \"httpd.exe\", \"apache2\", \"apache.exe\", \"httpd-prefork\", \"httpd-worker\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"zsh\", \"cmd.exe\", \"powershell.exe\", \"curl\", \"wget\", \"python\", \"python3\", \"perl\", \"php\", \"nc\", \"ncat\", \"socat\", \"base64\", \"chmod\", \"id\", \"whoami\")\n| project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"sentinel","table":"Syslog","name":"httpd segmentation faults and child-process crashes","description":"Memory-corruption attempts that fail crash the worker. Clusters on one internet-facing host are an incident signal rather than a stability issue.","query":"Syslog\n| where TimeGenerated > datetime(2026-11-10)\n| where SyslogMessage has_any (\"segfault\", \"Segmentation fault\", \"child pid\", \"exit signal\", \"caught SIGSEGV\", \"core dumped\", \"AH00052\", \"AH00051\")\n| where SyslogMessage has_any (\"httpd\", \"apache2\") or ProcessName has_any (\"httpd\", \"apache2\", \"kernel\")\n| summarize Crashes = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Sample = any(SyslogMessage) by Computer, ProcessName\n| where Crashes > 2\n| order by Crashes desc"},{"platform":"sentinel","table":"Syslog","name":"HTTP/2 protocol errors and stream resets in Apache error logs","description":"The closest thing to a direct detection available. Treat volume anomalies as suspicious rather than individual events, and baseline before alerting.","query":"Syslog\n| where TimeGenerated > datetime(2026-11-10)\n| where SyslogMessage has_any (\"mod_http2\", \"h2_session\", \"h2_stream\", \"HTTP/2\", \"PROTOCOL_ERROR\", \"COMPRESSION_ERROR\", \"FRAME_SIZE_ERROR\", \"ENHANCE_YOUR_CALM\", \"h2_mplx\")\n| summarize Events = count(), Hosts = dcount(Computer), Sample = any(SyslogMessage) by bin(TimeGenerated, 1h)\n| order by Events desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"New web-accessible content written under Apache document roots","description":"Web shell drop detection. Tune the folder list to your own document roots before use.","query":"DeviceFileEvents\n| where Timestamp > datetime(2026-11-10)\n| where FolderPath has_any (\"/var/www\", \"/srv/www\", \"htdocs\", \"/usr/share/nginx\", \"public_html\", \"cgi-bin\")\n| where ActionType in (\"FileCreated\", \"FileModified\")\n| where FileName endswith \".php\" or FileName endswith \".jsp\" or FileName endswith \".cgi\" or FileName endswith \".pl\" or FileName endswith \".py\" or FileName endswith \".sh\" or FileName endswith \".elf\"\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, SHA256, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connections initiated by web server processes","description":"Second-stage signal. A reverse proxy has a predictable set of upstreams; anything else from httpd is worth a look.","query":"DeviceNetworkEvents\n| where Timestamp > datetime(2026-11-10)\n| where InitiatingProcessFileName in~ (\"httpd\", \"apache2\", \"httpd.exe\", \"curl\", \"wget\")\n| where RemoteIPType == \"Public\"\n| summarize Connections = count(), Ports = make_set(RemotePort, 15), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName, RemoteIP, RemoteUrl, InitiatingProcessFileName\n| order by Connections desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Which Apache instances negotiate HTTP/2 from the internet (scope reduction)","description":"Supports the first recommended action by identifying externally reachable HTTP/2 endpoints, which is where patching should start.","query":"CommonSecurityLog\n| where TimeGenerated > ago(14d)\n| where isnotempty(DestinationPort)\n| where DestinationPort in (443, 8443, 80, 8080)\n| extend ExternalSource = not(ipv4_is_private(SourceIP))\n| where ExternalSource\n| summarize Sessions = count(), Sources = dcount(SourceIP), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by DestinationIP, DestinationHostName, DestinationPort, ApplicationProtocol\n| order by Sessions desc"}],"iocs":[{"type":"note","value":"NO INDICATORS PUBLISHED; EXPLOITATION IS REPORTED BUT UNCONFIRMED","context":"CSA's alert says 'reportedly' and publishes no victims, actors or infrastructure. Wiz Research reported no known exploitation on 11 November and F5 Labs is reported to see no major activity. There is nothing to ingest; the controls are patch state and module configuration.","confidence":"high","source":"CSA AL-2026-164 and vendor analyses via secondary reporting"},{"type":"note","value":"EXPOSURE CONDITION: mod_http2 enabled on Apache HTTP Server 2.4.55-2.4.70, or standalone mod_h2 2.0.8-2.0.42","context":"A module-level condition, not just a version. Check apachectl -M and the Protocols directive. Many internal Apache instances never had HTTP/2 enabled and are out of scope, which can cut the remediation list substantially.","confidence":"high","source":"CSA advisory and Apache via secondary reporting"},{"type":"note","value":"FIX: Apache HTTP Server 2.4.71, released 11 November 2026","context":"Available six days before the CSA alert. Distribution packages may lag; check your own vendor rather than the upstream release date.","confidence":"high","source":"Apache release via secondary reporting"},{"type":"note","value":"TEMPORARY CONTROL: remove h2 and h2c from the Protocols directive, or unload mod_http2","context":"Removes the vulnerable code path entirely at the cost of HTTP/2 performance. For an internet-facing instance that cannot be patched today, this is stronger than any filtering rule.","confidence":"medium","source":"analyst assessment based on the module-level exposure condition"},{"type":"behaviour","value":"httpd or apache2 worker segmentation faults, SIGSEGV, or 'child pid ... exit signal' clusters","context":"The best available signal for a failed memory-corruption attempt. Alert on clusters on a single internet-facing host rather than on individual events.","confidence":"medium","source":"analyst assessment"},{"type":"behaviour","value":"httpd or apache2 spawning a shell, curl, wget or an interpreter","context":"The post-exploitation signal for a successful RCE. High fidelity on a dedicated web server; tune where CGI or PHP-CLI workloads legitimately spawn processes.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Anomalous volumes of HTTP/2 PROTOCOL_ERROR, COMPRESSION_ERROR or FRAME_SIZE_ERROR in mod_http2 error logging","context":"The only log evidence close to the exploitation itself, because the malicious content lives in binary frames and header-compression state rather than in a loggable request line. Baseline before alerting.","confidence":"low","source":"analyst assessment"},{"type":"note","value":"SCORING CONFLICT: 8.1 (CVSS v3.1, CSA and the CVE record) vs critical with a reported 9.8 (Apache, Red Hat)","context":"The disagreement is about exploit complexity, not impact - all parties agree the impact is remote code execution. Record both with their versions so neither figure surprises a change-approval meeting.","confidence":"high","source":"CSA, Red Hat and Apache via secondary reporting"},{"type":"note","value":"DATE CONFLICT: one outlet dates the Singapore warning to 16 November; the CSA alert itself is dated 17 November 2026 (AL-2026-164)","context":"Use 17 November and the alert number when citing it.","confidence":"medium","source":"CSA alert page versus secondary reporting"},{"type":"note","value":"EXPOSURE SURFACE TO REMEMBER: Apache builds embedded in vendor appliances and container base images","context":"These are patched on the vendor's cycle rather than yours and are the instances that remain vulnerable longest. They rarely appear in an asset register as 'Apache'.","confidence":"high","source":"analyst assessment"}],"references":["https://www.csa.gov.sg/alerts-and-advisories/alerts/al-2026-164/","https://securityonline.info/cve-2026-119618-apache-rce-exploited/","https://cybersecuritynews.com/apache-http-server-rce-exploitation/","https://access.redhat.com/security/cve/cve-2026-119618","https://threatdefence.com/article/apache-http-server-cve-2026-119618-http2-rce-patching-hunting","https://gbhackers.com/critical-apache-http-server-vulnerability/","https://recatools.com/news/csa-apache-http-server-mod-http2-flaw-exploited-2026/","https://cipherssecurity.com/apache-cve-2026-119618-http2-rce/"]},{"rank":6,"id":"TI-2026-11-17-001","title":"'OPTIMJACK' Day Two: Optimizely Confirmed the Incident at 19:55 UTC on 17 November and Named Its Experimentation Account Signup Flow as the Entry Point - but How Signing Up Produced Write Access to 178 Other Tenants' Projects Is Still Unexplained, and the Incident Remains in Monitoring","cve_ids":[],"vendor":"Optimizely (Experimentation platform); 178 customer organisations including the BBC and HSBC","affected_products":["Optimizely Experimentation snippets served from cdn.optimizely.com, embedded in customers' own pages","Reported affected brands include the BBC, HSBC, Zoom, CNN, IKEA, Equifax, Salesforce, Fox News and Peacock, within a cohort reported to include 32 banking and finance brands","Any UK website that loads an Optimizely Experimentation snippet, whether or not the owning organisation knows it does","Visitors' browsers: card data at payment pages, cryptocurrency addresses in the DOM, session cookies, screenshots, and iOS devices targeted by an exploit-kit loader"],"category":"incident","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-16","last_updated":"2026-11-18","confidence":"medium","summary":"Yesterday this was rank 1 of this feed. It drops to rank 6 today not because it got smaller but because the acute phase ended: Report URI's 17 November update states that all the infected files it was monitoring had been cleaned by late on Monday, and Optimizely published an incident confirmation at 19:55 UTC on 17 November saying it had fixed the flaw, removed the injected code, ended active sessions, revoked tokens, reset access for affected accounts and notified affected customers. What remains is an unanswered question of some consequence, plus two days of exposure that UK organisations still have to account for.\n\nThe new fact is the entry vector, and it raises more than it settles. Optimizely attributes the intrusion to a vulnerability in its Experimentation account signup flow - an unauthorised party exploited that flow to add malicious JavaScript to some customer projects. That is a meaningful disclosure and it is also incomplete in the way that matters most. Scott Helme of Report URI, who found and tracked the campaign, states the open question directly: it is not known how the attacker obtained write access to so many unrelated customer projects. A signup flow creates a new tenant; it should not confer write access to existing ones. Until that mechanism is described, no Optimizely customer can establish whether their own project was reachable, whether anything other than the injected script was changed, or whether the access path is genuinely closed. Optimizely's incident record remained in 'Monitoring' status on Tuesday evening, and the company has not said how many projects were altered.\n\nThe scale figures have firmed up slightly and still differ between measures. Report URI counted 188 infected script files across 186 affected sites belonging to 178 organisations; the organisation count is the one in general use. Exposure duration is reported as roughly 16 to 19 hours, with one account giving nearly 19 hours. The BBC's snippet was the first observed infected, at 04:21 UTC on 16 November. These are exposure counts, not counts of visitors affected or devices compromised - a distinction worth keeping in any internal briefing, because the visitor number is unknown and is certainly large.\n\nThe HSBC detail is the single most instructive technical point in this incident and is worth re-stating on day two. At HSBC the Content Security Policy blocked the remote script - the control worked - but an inline fallback copy of the payload still executed, reportedly because 'unsafe-eval' was permitted. The attacker shipped three injection variants: a plain script tag, a base64-obfuscated URL, and a full inline copy executed via eval as a fallback for exactly the case where the attacker's domain is blocked. The lesson for every UK organisation with a CSP is specific and actionable: a policy that blocks third-party script sources but permits unsafe-inline or unsafe-eval is not a defence against this class of attack, because the attacker anticipated the block. Blocking the domain and leaving eval enabled is the configuration the attacker built the third variant for.\n\nTwo developments to watch rather than act on. First, Salesforce - itself among the named brands - is reported to be investigating and to have disabled Optimizely scripts in preview and production as a precaution. For a UK organisation, that is the template for a proportionate response: disable the snippet while you establish what it did, rather than reasoning about it. Second, and more significant if it holds, one research outlet reports malicious scripts traced across four web services, which would mean Optimizely was one target of a broader campaign against web-delivery and experimentation platforms rather than the whole of it. That is a single-source claim at this stage and should not be repeated as established; it is included here because, if confirmed, it changes the inventory question from 'do we load Optimizely' to 'what third-party JavaScript do we load at all'.\n\nWhat a UK organisation still has to do on day two. The cleanup being complete does not discharge the obligation. If one of your properties loaded an infected snippet during the 16 November window, visitors' card data, session cookies and cryptocurrency addresses were exposed through your origin, on a page your organisation served. That carries UK GDPR assessment duties, a possible ICO notification decision, and a PCI DSS question if the affected page handled cardholder data. The evidence you need is the browsing and proxy telemetry from that window, and it ages out: default proxy and endpoint retention will begin losing 16 November within weeks. Pull and preserve it now, even if the decision about notification comes later.\n\nConfidence and caveats. Confidence is medium. The 17 November Optimizely confirmation, the signup-flow attribution, the cleanup status and the unresolved cross-tenant access question are consistently reported across multiple outlets. The brand list, the 32-finance-brand cohort and the HSBC CSP detail remain secondary-source and were not verified with the named organisations; the BBC and HSBC have not been quoted confirming their own exposure in the sources reviewed. Counts differ between measures (178 organisations, 186 sites, 188 files) and duration is given as both 16 and 19 hours. The 'four web services' widening is single-source. The indicator values below are relayed from secondary reporting rather than from a vendor IoC feed, and whether the attacker retains any access is explicitly unestablished. No pages were fetched directly in this environment.","recommended_actions":["If you have not yet answered it, answer this today: does any website your organisation operates load an Optimizely Experimentation snippet, and who owns it? Check the live page HTML and the tag manager, not the asset register - these snippets are added by digital and marketing teams and do not appear in security inventories.","Preserve the 16 November telemetry now, before retention removes the ability to answer the question later. Export proxy, DNS, endpoint network and web-analytics data covering 16 November 2026 for any property that loaded the snippet. The regulatory decision can come later; the evidence cannot be recreated.","Fix the CSP lesson across the whole estate, not just for Optimizely. Audit every Content Security Policy for 'unsafe-eval' and 'unsafe-inline'. The HSBC case shows a correctly blocked remote script defeated by an inline fallback that eval permitted - the attacker built that variant specifically for defenders who block the domain.","Follow the Salesforce template where you cannot yet establish what the snippet did: disable the third-party script in production as a precaution while you investigate, rather than reasoning about whether it was affected. A disabled experimentation snippet costs a marketing feature; an undisabled one cost 178 organisations their visitors' card data.","Press your Optimizely account team in writing for the specific unanswered question: by what mechanism did a signup-flow vulnerability yield write access to existing customer projects, was our project among those with altered content, and what else in our project could have been modified? 'The flaw is fixed' is not an answer to any of those, and the incident is still in monitoring.","Make the UK regulatory assessment deliberately rather than by default. If an affected page handled personal data, run the UK GDPR assessment and record the ICO notification decision with its reasoning. If it handled cardholder data, treat the PCI DSS question as live. Document the decision either way, including a decision not to notify.","Block and monitor the known indicator domains - 1688360.cc, 5vobauua3ojpklx.icu, eil786npto9u5bq.icu, webshell.lol - at DNS, proxy and egress, and search historic logs for them across the whole estate rather than only for the window. Blocking is necessary and insufficient: the inline variant exists precisely to survive it.","Treat the 'four web services' report as a reason to inventory third-party JavaScript generally, not as a confirmed fact. If a broader campaign against web-delivery platforms is confirmed, the useful question becomes 'what third-party script do we load on every page' - and that inventory takes longer than an incident allows, so starting it now is the point."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"OPTIMJACK attacker infrastructure in proxy and firewall logs","description":"Primary retrospective hunt. Search the full retention period, not just the 16 November window, and treat any hit as a browser that executed the payload.","query":"let OptimjackHosts = dynamic([\"1688360.cc\", \"5vobauua3ojpklx.icu\", \"eil786npto9u5bq.icu\", \"webshell.lol\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(90d)\n| where RequestURL has_any (OptimjackHosts) or DestinationHostName has_any (OptimjackHosts)\n| project TimeGenerated, SourceIP, SourceUserName, DestinationHostName, RequestURL, RequestMethod, DeviceAction, DeviceProduct\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"OPTIMJACK exfiltration paths (a hit here means data left the browser)","description":"/card.php is the card-exfiltration endpoint: a request to it indicates card details were submitted, not merely that the script loaded. Escalate these ahead of generic domain hits.","query":"CommonSecurityLog\n| where TimeGenerated > ago(90d)\n| where RequestURL has_any (\"/card.php\", \"/hit.php\", \"/track.js\")\n| extend Severity = case(RequestURL has \"/card.php\", \"CRITICAL - card data submitted\", RequestURL has \"/hit.php\", \"HIGH - beacon\", \"MEDIUM - payload load\")\n| project TimeGenerated, Severity, SourceIP, SourceUserName, DestinationHostName, RequestURL, DeviceAction\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Managed endpoints that contacted OPTIMJACK hosts","description":"Identifies which of your own users' browsers executed the payload, which is the population for credential and session resets.","query":"let OptimjackHosts = dynamic([\"1688360.cc\", \"5vobauua3ojpklx.icu\", \"eil786npto9u5bq.icu\", \"webshell.lol\"]);\nDeviceNetworkEvents\n| where Timestamp > ago(90d)\n| where RemoteUrl has_any (OptimjackHosts)\n| project Timestamp, DeviceName, InitiatingProcessAccountUpn, InitiatingProcessFileName, RemoteUrl, RemoteIP, RemotePort, ActionType\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Inventory: which endpoints and properties load Optimizely snippets at all","description":"Answers the inventory question from telemetry when the asset register cannot. Also reveals third-party properties your staff use that load the snippet.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemoteUrl has_any (\"cdn.optimizely.com\", \"optimizely.com\", \"logx.optimizely.com\")\n| summarize Requests = count(), Endpoints = dcount(DeviceName), FirstSeen = min(Timestamp), LastSeen = max(Timestamp), SampleUrls = make_set(RemoteUrl, 20) by InitiatingProcessFileName\n| order by Requests desc"},{"platform":"sentinel","table":"SigninLogs","name":"Session anomalies for users who browsed affected properties during the window","description":"The payload stole cookies, so the consequence to hunt is session reuse from new infrastructure. Baseline over 30 days before alerting.","query":"SigninLogs\n| where TimeGenerated between (datetime(2026-11-16) .. datetime(2026-11-25))\n| where ResultType == 0\n| summarize Signins = count(), IPs = dcount(IPAddress), Countries = make_set(tostring(LocationDetails.countryOrRegion), 10), Apps = make_set(AppDisplayName, 10) by UserPrincipalName\n| where IPs > 4 or array_length(Countries) > 2\n| order by IPs desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Base64-obfuscated script injection pattern (the second variant)","description":"Looks for the obfuscated-URL variant rather than the plain script tag. Expect false positives; use it to find candidate pages, not to alert.","query":"CommonSecurityLog\n| where TimeGenerated > ago(90d)\n| where RequestURL has_any (\"atob(\", \"base64,\", \"eval(\", \"fromCharCode\")\n| summarize Hits = count(), Sources = dcount(SourceIP), Samples = make_set(RequestURL, 10) by DestinationHostName\n| order by Hits desc"},{"platform":"defender_xdr","table":"DeviceEvents","name":"Browser credential and cookie access following exposure","description":"Secondary check for endpoints that visited affected properties: evidence of cookie or credential store access by non-browser processes during and after the window.","query":"DeviceEvents\n| where Timestamp between (datetime(2026-11-16) .. datetime(2026-11-25))\n| where ActionType in (\"SensitiveFileRead\", \"ProcessCreatedUsingWmiQuery\", \"BrowserLaunchedToOpenUrl\")\n   or FileName has_any (\"Cookies\", \"Login Data\", \"Local State\")\n| project Timestamp, DeviceName, ActionType, FileName, FolderPath, InitiatingProcessFileName, InitiatingProcessAccountName, InitiatingProcessCommandLine\n| order by Timestamp desc"}],"iocs":[{"type":"domain","value":"1688360.cc","context":"Primary OPTIMJACK payload delivery and card-exfiltration host. Block at DNS, proxy and egress, and search historic logs across the whole estate.","confidence":"medium","source":"StepSecurity / Report URI via secondary reporting"},{"type":"uri_path","value":"/track.js","context":"Payload script path on 1688360.cc.","confidence":"medium","source":"StepSecurity via secondary reporting"},{"type":"uri_path","value":"/card.php","context":"Card-data exfiltration endpoint on 1688360.cc. A request to this path means card details were submitted, not merely that the script loaded - escalate these ahead of generic domain hits.","confidence":"medium","source":"StepSecurity via secondary reporting"},{"type":"uri_path","value":"/hit.php","context":"Beacon or telemetry endpoint on 1688360.cc.","confidence":"medium","source":"StepSecurity via secondary reporting"},{"type":"domain","value":"5vobauua3ojpklx.icu","context":"Reported iOS exploit-kit staging host.","confidence":"medium","source":"StepSecurity via secondary reporting"},{"type":"domain","value":"eil786npto9u5bq.icu","context":"Reported iOS exploit-kit staging host.","confidence":"medium","source":"StepSecurity via secondary reporting"},{"type":"domain","value":"webshell.lol","context":"Reported injector host loaded by the first-stage injection.","confidence":"medium","source":"StepSecurity via secondary reporting"},{"type":"malware","value":"OPTIMJACK","context":"Researcher name for the injected JavaScript implant: card skimmer, crypto clipper, cookie and screenshot stealer, and iOS exploit-kit loader in one payload.","confidence":"medium","source":"StepSecurity, Report URI via secondary reporting"},{"type":"ttp","value":"Malicious JavaScript written into a SaaS experimentation platform's per-customer project field, served from the vendor CDN inside the customer's own trusted snippet","context":"The core technique. The code inherits the victim site's origin and therefore sees every form field, cookie and DOM element on the page. No vulnerability in the victim's own estate is required, and no control the victim owns would have stopped the delivery.","confidence":"high","source":"Optimizely statement and Report URI analysis via secondary reporting"},{"type":"ttp","value":"Abuse of a SaaS account signup flow to obtain write access to other tenants' projects","context":"Optimizely's stated entry vector as at 17 November: an unauthorised party exploited a vulnerability in the Experimentation account signup flow. The mechanism by which signing up produced cross-tenant write access has NOT been described, and Report URI's Scott Helme states it is still unknown. Until it is, no customer can establish whether their project was reachable or whether anything other than the script was altered.","confidence":"medium","source":"Optimizely statement and Report URI via secondary reporting"},{"type":"behaviour","value":"Three injection variants: plain script tag, base64-obfuscated URL, and a full inline copy of the payload executed via eval as a fallback when the attacker domain is blocked","context":"This is why domain blocking alone is insufficient and why the CSP audit is the durable action. The inline variant activates precisely under the condition most defenders will create.","confidence":"medium","source":"Report URI via secondary reporting"},{"type":"behaviour","value":"At HSBC the Content Security Policy blocked the remote script, but the inline fallback still executed, reportedly because 'unsafe-eval' was permitted","context":"The most instructive technical detail of the incident: a working CSP defeated by one permissive directive. Audit every CSP in the estate for unsafe-eval and unsafe-inline, because the attacker built variant three for defenders who block the domain.","confidence":"medium","source":"Report URI and secondary analyses"},{"type":"behaviour","value":"Interception of form submissions and of every fetch/XHR POST, matching a Luhn-valid card number plus expiry plus CVV before exfiltration","context":"The skimmer waits until it holds a complete card triplet, which defeats detection approaches that look for single-field exfiltration.","confidence":"medium","source":"Report URI via secondary reporting"},{"type":"note","value":"VENDOR TIMELINE: Optimizely incident confirmation published 19:55 UTC on 17 November 2026; status still 'Monitoring' on Tuesday evening","context":"Optimizely states it fixed the flaw, removed the injected code, ended active sessions, revoked tokens, reset access for affected accounts and notified affected customers. It has not said how many projects were altered or confirmed that the attacker retains no access.","confidence":"medium","source":"Optimizely incident notice via secondary reporting"},{"type":"note","value":"CLEANUP STATUS: Report URI's 17 November update states all infected files it was monitoring had been cleaned by late Monday","context":"The acute phase is over, which is why this entry dropped from rank 1 to rank 6. One source notes complete removal has not been independently confirmed.","confidence":"medium","source":"Report URI via secondary reporting"},{"type":"note","value":"SCALE MEASURES THAT DIFFER: 178 organisations, 186 affected sites, 188 infected script files; exposure duration reported as 16 to 19 hours; BBC snippet first infected at 04:21 UTC on 16 November","context":"These are exposure counts, not counts of visitors affected or devices compromised. The visitor number is unknown and is certainly large - do not let the three organisation-level figures stand in for it in a briefing.","confidence":"medium","source":"Report URI via secondary reporting"},{"type":"note","value":"UNVERIFIED WIDENING: one research outlet reports malicious scripts traced across four web services","context":"Single-source as at this run. If confirmed, Optimizely was one target of a broader campaign against web-delivery and experimentation platforms, and the inventory question becomes 'what third-party JavaScript do we load at all'. Do not repeat as established.","confidence":"low","source":"infostealers.com via search-result summaries"},{"type":"note","value":"PROPORTIONATE RESPONSE TEMPLATE: Salesforce is reported to have disabled Optimizely scripts in preview and production as a precaution while investigating","context":"The model for a UK organisation that cannot yet establish what its snippet did: disable the third-party script and investigate afterwards, rather than reasoning about whether it was affected.","confidence":"medium","source":"secondary reporting"}],"references":["https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/","https://www.theregister.com/cyber-crime/2026/11/17/optimizely_hack_turns_worlds_biggest_websites_into_malware_dispensers/5310448","https://www.stepsecurity.io/blog/optimjack-optimizely-hosted-scripts-crypto-clipper-card-skimmer","https://socradar.io/blog/optimizely-attack-hits-zoom-bbc-cnn-with-skimmer-ios-kits/","https://www.infostealers.com/article/beyond-optimizely-malicious-scripts-traced-across-four-web-services/","https://thehackernews.com/2026/11/hijacked-optimizely-scripts-served-card.html","https://dailysecurityreview.com/cyber-security/optimizely-supply-chain-attack-hits-178-sites-with-card-skimmer/","https://breachhistory.com/blog/optimizely-optimjack-skimmer-november-2026","https://nationalcioreview.com/articles-insights/extra-bytes/zoom-cnn-salesforce-among-178-websites-exposed-in-cyberattack/","https://businesscloud.co.uk/news/zoom-hsbc-bbc-hit-in-optimizely-malware-attack/"]},{"rank":7,"id":"TI-2026-11-11-004","title":"CISA KEV Status Board as at 18 November 2026: Puppet Added With a 1 December Deadline, SonicWall Falls This Friday, Four Fall on 24 November, Four Are Already Overdue - and a KEV Entry for Zyxel Names the Wrong CVE, So Patching to the Catalogue Did Not Remediate It","cve_ids":["CVE-2026-102895","CVE-2026-107441","CVE-2026-111560","CVE-2026-114713","CVE-2026-115731","CVE-2026-116606","CVE-2026-118527","CVE-2026-123039","CVE-2026-123158","CVE-2026-124194","CVE-2026-125350","CVE-2026-19868","CVE-2026-20320","CVE-2026-7273"],"vendor":"CISA (KEV catalogue); Perforce; SonicWall; Google; Microsoft; Cisco; Openwave; Check Point; UnrealIRCd; OpenSSH; Ivanti; Barracuda; Zyxel","affected_products":["Perforce Puppet Enterprise and Puppet Core - CVE-2026-115731, added 17 November, due 1 December 2026","SonicWall SonicOS SSLVPN with SAML enabled - CVE-2026-19868, due Friday 20 November 2026","Google Chrome - CVE-2026-125350, due 24 November 2026","Microsoft Outlook - CVE-2026-124194, due 24 November 2026","Cisco BroadWorks - CVE-2026-20320, and Openwave Webtop Media Transcoder - CVE-2026-102895, both due 24 November 2026","Check Point - CVE-2026-123039, and UnrealIRCd - CVE-2026-114713, both OVERDUE since 16 November 2026","OpenSSH 'SSHole' - CVE-2026-123158, OVERDUE since 12 November; Ivanti Connect Secure - CVE-2026-118527, OVERDUE since 13 November","Barracuda ESG - CVE-2026-116606 and CVE-2026-111560, overdue","Zyxel GS1900 switches - CVE-2026-7273 is the KEV entry; CVE-2026-107441 is the flaw actually exploited"],"category":"vulnerability_bundle","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-20","patch_available":"yes","first_reported":"2026-11-11","last_updated":"2026-11-18","confidence":"medium","summary":"This entry exists so that one person can hold the whole deadline board in their head. Two things changed in this window: CISA added one vulnerability, and a piece of research published earlier this month means one existing KEV entry names the wrong CVE.\n\nThe addition. On 17 November CISA added CVE-2026-115731 (Perforce Puppet Enterprise, deserialization, code execution on the Puppet Server from any CA-signed agent certificate) with a remediation date of 1 December 2026. It is covered in full at rank 3 of this run, because a control-plane vulnerability deserves its own entry rather than a line on a board.\n\nThe deadline board as at 18 November 2026. Due in two days, on Friday 20 November: CVE-2026-19868, the SonicWall SonicOS SSLVPN SAML and MFA bypass, which affects SSLVPN only where SAML is enabled for SSLVPN logins and allows an attacker with valid credentials for an alternate authentication method to bypass SAML-enforced MFA. SonicWall has shipped SonicOS 7.3.4-7013 and 8.2.3-8015 and states there is no workaround, so Friday is a patching deadline rather than a mitigation one. Due on Monday 24 November: four - Google Chrome CVE-2026-125350 (XML use-after-free), Microsoft Outlook CVE-2026-124194 (the NTLM-hash-stealing zero-day from the November Patch Tuesday), Cisco BroadWorks CVE-2026-20320, and Openwave Webtop Media Transcoder CVE-2026-102895. Due 1 December: Puppet CVE-2026-115731. Already overdue: Check Point CVE-2026-123039 and UnrealIRCd CVE-2026-114713 (both 16 November, which has now passed), OpenSSH 'SSHole' CVE-2026-123158 (since 12 November), Ivanti Connect Secure CVE-2026-118527 (since 13 November), and the two Barracuda ESG entries CVE-2026-116606 and CVE-2026-111560.\n\nThe new and more interesting item is a governance failure in the catalogue itself, and it is the reason this entry is worth reading rather than skimming. In September 2026 CISA added CVE-2026-7273 (Zyxel) to KEV on the strength of GreyNoise's attribution of a campaign against Zyxel GS1900 switches. Binarly subsequently demonstrated that the exploit worked against switches already running the June updates - that is, the attacks were not exploiting CVE-2026-7273 at all. The flaw actually used is CVE-2026-107441, an out-of-bounds write in the GS1900 web management interface, which Zyxel rates 8.8 and Binarly rates 9.8, affecting ten GS1900 models on firmware 2.90(xxx.2)C0 or earlier, with Zyxel's advisory published on 3 November and firmware (2.90 Patch 3) released in late October. GreyNoise reported 996 switches compromised across 48 countries - most affected being Italy, the United States and Taiwan - by an actor it tracks as Kapibala, assessed as Chinese-speaking, with activity from around 17 August, exfiltrating device configurations, hashed root credentials and network information.\n\nWhat that means operationally, for any organisation that treats KEV as its work queue. An organisation that did exactly the right thing - saw CVE-2026-7273 in KEV, patched to the June firmware, closed the ticket - is still vulnerable, and its remediation record says otherwise. This is the one case on the board where compliance and security point in different directions, and the only fix is to patch GS1900 switches to firmware 2.90 Patch 3, restrict web management interfaces to an isolated administration network, and rotate device passwords, because the stolen material reportedly includes hashed root credentials. Zyxel's advisory lists no workarounds. Note also the access assumption: Zyxel characterises the attacker as LAN-based or adjacent, so the realistic UK exposure is a switch whose management interface is reachable from a user or guest network, not one exposed to the internet.\n\nUK relevance. UK organisations are not bound by CISA's Binding Operational Directive deadlines; the dates are the best public prioritisation signal available and most UK security teams use them that way. The items that matter most for a UK estate this week are SonicWall on Friday (SSLVPN with SAML is a common UK mid-market and public sector remote access configuration, and VPN appliance bypasses are the initial access route behind a large share of UK ransomware), Outlook by Monday (a zero-day exploited before patching, with NHS England Digital rating further exploitation highly likely in cyber alert CC-4889), and the Zyxel correction for anyone with GS1900 switches in a branch, school or small-site network.\n\nConfidence and caveats. Confidence is medium. The 17 November Puppet addition and the 20 and 24 November deadlines are consistently reported. The Zyxel misattribution, the 996-device figure, the Kapibala attribution and the 48-country spread come from GreyNoise and Binarly via trade press and were not read at source; the firmware release date differs between sources (22 or 23 October). Sources also disagree on which Binding Operational Directive the SonicWall deadline is set under (22-01 versus 26-04). CISA's own pages did not resolve in this environment, so every date here is relayed and should be verified against the live KEV catalogue before being used in a compliance return.","recommended_actions":["Patch SonicWall SonicOS to 7.3.4-7013 or 8.2.3-8015 before Friday 20 November. SonicWall states there is no workaround, so the deadline cannot be met by mitigation. If SAML is enabled for SSLVPN logins, assume MFA is bypassable until the patch is applied.","Clear the four 24 November items over the weekend: Chrome CVE-2026-125350 (verify browser version enforcement actually applied rather than trusting policy), Outlook CVE-2026-124194, Cisco BroadWorks CVE-2026-20320 and Openwave Webtop Media Transcoder CVE-2026-102895.","Re-open the Zyxel ticket you already closed. If you patched GS1900 switches because CVE-2026-7273 appeared in KEV, that patch did not remediate the exploited flaw. Upgrade to firmware 2.90 Patch 3 for CVE-2026-107441, restrict the web management interface to an isolated administration network, and rotate device passwords - exfiltrated data reportedly includes hashed root credentials.","Take the general lesson from the Zyxel case into how you use KEV: the catalogue is an authoritative statement that exploitation was observed, not an authoritative statement about which flaw was used. Where a vendor or researcher later contradicts the attribution, the research wins and your remediation record needs re-checking.","Deal with the four overdue items this week rather than rolling them forward again: Check Point CVE-2026-123039 and UnrealIRCd CVE-2026-114713 (deadline passed 16 November), OpenSSH SSHole CVE-2026-123158 (12 November) and Ivanti Connect Secure CVE-2026-118527 (13 November). An overdue KEV item on an edge appliance is the most reliable predictor of an incident on this whole board.","For Ivanti specifically, do not treat a version check as assurance. The Integrity Checker Tool can return clean on a compromised appliance because attacker commands execute in memory. Hunt for post-exploitation independently of patch state.","For OpenSSH SSHole, remember where the exposure actually is: musl libc with PAM disabled, which is the default shape of an Alpine container image. Your container estate is the population least likely to be covered by an appliance-focused patching report.","Verify every date in this entry against the live CISA KEV catalogue before using it in a compliance return or a board paper. All of th
