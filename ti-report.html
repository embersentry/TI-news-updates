<!doctype html>
<html lang="en" data-palette="#FF5A1F,#FF8C1A,#9A958C">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat Intelligence Brief</title>
<meta name="description" content="Daily threat intelligence brief: ranked vulnerabilities with analyst summaries, KQL hunting queries and IOCs.">
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --raised:#1C1C1A;
    --border:#2E2E2B;
    --border-strong:#403F3A;
    --ink:#F4F0E6;
    --ink-dim:#C9C4B8;
    --muted:#9A958C;
    --accent:#FF6A1A;
    --accent-hot:#FF5A1F;
    --accent-soft:rgba(255,106,26,.12);
    --accent-line:rgba(255,106,26,.32);
    --bar:rgba(255,106,26,.5);
    --radius:4px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- masthead ---------- */
  header.mast{border-bottom:1px solid var(--border);background:linear-gradient(180deg,#121211 0%,var(--bg) 100%)}
  .mast-in{max-width:var(--maxw);margin:0 auto;padding:28px 16px 24px;
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{width:30px;height:30px;flex:none}
  .brand-txt h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .brand-txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .stamp{display:flex;flex-wrap:wrap;gap:22px}
  .stamp div{min-width:0}
  .stamp dt{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .stamp dd{margin:0;font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap}
  .stamp dd b{color:var(--accent);font-weight:600}

  /* ---------- priority banner ---------- */
  .alert{margin:22px 0 0;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-left:3px solid var(--accent-hot);border-radius:var(--radius);padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start}
  .alert svg{flex:none;margin-top:2px}
  .alert .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
    font-weight:650;margin:0 0 3px}
  .alert p{margin:0;font-size:14px;color:var(--ink)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:var(--radius);margin:22px 0 0;overflow:hidden;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .tile{background:var(--surface);padding:14px 16px 13px}
  .tile .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;display:block}
  .tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
  .tile.hot .n{color:var(--accent-hot)}
  .tile.warn .n{color:var(--accent)}

  /* ---------- posture bar ---------- */
  .posture{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 14px}
  .posture h2{margin:0 0 11px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .pbar{display:flex;gap:2px;height:12px;border-radius:2px;overflow:hidden;background:var(--bg)}
  .pseg{min-width:3px}
  .pseg.s-exploited{background:var(--accent-hot)}
  .pseg.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .pseg.s-none{background:var(--muted)}
  .plegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px}
  .plegend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-dim)}
  .swatch{width:11px;height:11px;border-radius:2px;flex:none}
  .swatch.s-exploited{background:var(--accent-hot)}
  .swatch.s-attempts{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,#8f3a0f 3px 6px)}
  .swatch.s-none{background:var(--muted)}
  .plegend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}

  /* ---------- controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 0;
    padding-bottom:18px;border-bottom:1px solid var(--border)}
  .search{position:relative;flex:1 1 230px;min-width:0}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:var(--radius);padding:9px 11px 9px 34px;font-size:14px;font-family:var(--sans)}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);
    border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
    transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
  .chip:hover{border-color:var(--border-strong);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A;font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{background:transparent;border:1px solid var(--border);color:var(--ink-dim);border-radius:var(--radius);
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

  /* ---------- entry cards ---------- */
  .entries{margin:0;padding:0;list-style:none}
  .card{border-bottom:1px solid var(--border)}
  .card.is-open{background:var(--surface)}
  .chead{display:flex;gap:16px;padding:20px 4px;cursor:pointer;align-items:flex-start;
    width:100%;background:none;border:0;text-align:left;font-family:inherit;color:inherit}
  .chead:hover .ctitle{color:var(--accent)}
  .chead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{flex:none;width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;
    font-family:var(--mono);font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
    background:var(--raised);border:1px solid var(--border);color:var(--muted)}
  .card[data-status="exploited_in_the_wild"] .rank{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .cbody{flex:1;min-width:0}
  .ctitle{margin:0;font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;
    transition:color .12s}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
  .teaser{margin:10px 0 0;font-size:14px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.is-open .teaser{display:none}
  .caret{flex:none;color:var(--muted);transition:transform .15s;margin-top:7px}
  .card.is-open .caret{transform:rotate(90deg);color:var(--accent)}

  /* pills: status differentiated by WEIGHT + always a text label, never hue alone */
  .pill{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
    padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-flex;
    align-items:center;gap:5px;line-height:1.5}
  .pill.st-exploited{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.st-attempts{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.st-none{background:transparent;border-color:var(--border-strong);color:var(--muted)}
  .pill.kev{background:transparent;border-color:var(--accent-line);color:var(--accent)}
  .pill.nopatch{background:var(--accent-hot);border-color:var(--accent-hot);color:#0A0A0A}
  .pill.partial{background:transparent;border-color:var(--accent);color:var(--accent)}
  .pill.plain{background:transparent;border-color:var(--border);color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:500;
    white-space:normal;max-width:100%;overflow-wrap:anywhere}
  .cve{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);background:var(--raised);
    border:1px solid var(--border);border-radius:3px;padding:2px 7px;white-space:nowrap}
  .cve.more{color:var(--muted);background:transparent}

  /* ---------- detail ---------- */
  .detail{display:none;padding:0 4px 30px 54px}
  .card.is-open .detail{display:block}
  .sec{margin-top:26px}
  .sec:first-child{margin-top:6px}
  .sec > h3{margin:0 0 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:650;display:flex;align-items:center;gap:9px}
  .sec > h3::after{content:"";flex:1;height:1px;background:var(--border)}
  .prose{margin:0;font-size:14.5px;color:var(--ink-dim);line-height:1.72;max-width:76ch}
  .facts{display:flex;flex-wrap:wrap;border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden}
  .facts div{flex:1 1 168px;background:var(--bg);padding:10px 13px;
    border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .card.is-open .facts div{background:var(--raised)}
  .facts dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .facts dd{margin:0;font-size:13px;font-family:var(--mono);color:var(--ink-dim)}
  ul.list{margin:0;padding-left:0;list-style:none}
  ul.list li{position:relative;padding-left:20px;margin-bottom:8px;font-size:14px;color:var(--ink-dim);max-width:78ch}
  ul.list li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;
    background:var(--accent);border-radius:1px}
  ul.list.num{counter-reset:a}
  ul.list.num li{counter-increment:a;padding-left:26px}
  ul.list.num li::before{content:counter(a);background:none;font-family:var(--mono);font-size:11.5px;
    color:var(--accent);top:0;left:2px;width:auto;height:auto;font-weight:600}

  /* KQL */
  .kql{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;background:var(--bg);overflow:hidden}
  .kql-head{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
    border-bottom:1px solid var(--border);background:var(--raised);flex-wrap:wrap}
  .kql-head .kn{flex:1;min-width:140px}
  .kql-head h4{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .kql-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55;max-width:74ch}
  .plat{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:3px;padding:2px 7px;
    white-space:nowrap;flex:none}
  .kql pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:var(--ink-dim);tab-size:2}
  .kql pre .k{color:var(--accent)}
  .kql pre .s{color:#C9C4B8}
  .kql pre .c{color:#6E6A63;font-style:italic}
  .copy{flex:none;background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:3px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.ok{border-color:var(--accent-hot);color:var(--accent-hot)}

  /* IOC table */
  .tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:9px 13px;background:var(--raised);color:var(--muted);
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;
    border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-dim)}
  tbody tr:last-child td{border-bottom:0}
  td.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere;min-width:120px}
  td.t{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
  td.ctx{min-width:220px;line-height:1.55}
  td.src{font-size:12px;color:var(--muted);min-width:130px}
  .cf{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;padding:2px 7px;
    border-radius:999px;border:1px solid;white-space:nowrap}
  .cf.high{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .cf.medium{background:transparent;border-color:var(--border-strong);color:var(--ink-dim)}
  .cf.low{background:transparent;border-color:var(--border);color:var(--muted)}
  tr.is-note td{background:rgba(255,106,26,.05)}
  .note-row{font-size:12.5px;color:var(--muted);font-style:italic}
  .refs{margin:0;padding:0;list-style:none}
  .refs li{margin-bottom:7px}
  .refs a{color:var(--accent);text-decoration:none;font-size:13px;font-family:var(--mono);
    overflow-wrap:anywhere;border-bottom:1px solid transparent}
  .refs a:hover{border-bottom-color:var(--accent)}

  /* ---------- provenance ---------- */
  .prov{margin:40px 0 0;border:1px solid var(--border);border-left:3px solid var(--border-strong);
    border-radius:var(--radius);background:var(--surface)}
  .prov > summary{cursor:pointer;padding:15px 18px;font-size:13px;font-weight:600;color:var(--ink);
    list-style:none;display:flex;align-items:center;gap:10px}
  .prov > summary::-webkit-details-marker{display:none}
  .prov > summary:hover{color:var(--accent)}
  .prov > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .prov[open] > summary{border-bottom:1px solid var(--border)}
  .prov-body{padding:18px}
  .prov-body h4{margin:20px 0 9px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .prov-body h4:first-child{margin-top:0}
  .prov-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}
  .prov-body dt{font-weight:650;color:var(--accent);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding-top:3px}
  .prov-body dd{margin:0;color:var(--ink-dim)}

  footer.foot{margin:44px 0 0;border-top:1px solid var(--border);padding:20px 0 50px;
    display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  footer.foot p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .drop-hint{font-size:12px;color:var(--muted)}

  .empty{padding:60px 4px;text-align:center;color:var(--muted);font-size:14px}
  body.dragging::after{content:"Drop a TI JSON file to load it";position:fixed;inset:14px;
    border:2px dashed var(--accent);border-radius:8px;background:rgba(10,10,10,.9);color:var(--accent);
    display:grid;place-items:center;font-size:17px;font-weight:600;z-index:99;pointer-events:none}

  @media (max-width:720px){
    .brand{align-items:flex-start}
    .detail{padding-left:4px}
    .stamp{gap:16px}
    .mast-in{padding-top:22px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- report archive timeline ---------- */
  .timeline{margin:22px 0 0;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:15px 16px 16px}
  .tl-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;
    justify-content:space-between;margin-bottom:14px}
  .tl-head h2{margin:0;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);font-weight:650}
  .tl-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tl-meta b{color:var(--ink);font-weight:600}
  .tl-latest{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;
    border:1px solid var(--accent-line);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .tl-latest:hover{background:var(--accent-soft)}
  .tl-chart{position:relative}
  .tl-bars{display:flex;align-items:flex-end;gap:3px;height:62px;overflow-x:auto;
    overflow-y:hidden;padding-bottom:1px}
  .tl-bar{flex:1 1 0;min-width:5px;height:100%;background:none;border:0;
    padding:0;cursor:pointer;display:flex;align-items:flex-end}
  .tl-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tl-fill{width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--bar);
    transition:background .12s}
  .tl-bar:hover .tl-fill,.tl-bar:focus-visible .tl-fill{background:var(--accent)}
  .tl-bar.is-current .tl-fill{background:var(--accent-hot)}
  .tl-axis{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tl-tip{position:absolute;top:calc(100% + 8px);z-index:5;pointer-events:none;
    background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:9px 11px;min-width:190px;max-width:330px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .tl-tip[hidden]{display:none}
  .tl-tip .t-d{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 5px}
  .tl-tip .t-h{margin:0 0 7px;font-size:12.5px;color:var(--ink);line-height:1.45}
  .tl-tip .t-c{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tl-list{list-style:none;margin:17px 0 0;padding:0;border-top:1px solid var(--border)}
  .tl-list li{margin:0}
  .tl-row{display:flex;gap:14px;align-items:baseline;padding:9px 4px;
    border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
  .tl-row:hover{background:var(--raised)}
  .tl-row:hover .tl-h{color:var(--accent)}
  .tl-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tl-d{flex:none;width:86px;font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .tl-h{flex:1;min-width:0;font-size:13.5px;color:var(--ink-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tl-c{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .tl-now{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
    border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:1px 7px}
  .tl-more{margin-top:13px}
  @media (max-width:720px){
    .tl-c{display:none}
    .tl-d{width:72px}
    /* Keep the caption - it is what names the series - but give it its own
       line instead of letting it wrap between the two date labels. */
    .tl-axis{flex-wrap:wrap}
    .tl-axis span:nth-child(2){order:3;flex:1 0 100%;text-align:center;margin-top:4px}
  }

  /* ---------- print ---------- */
  @media print{
    :root{--bg:#fff;--surface:#fff;--raised:#f4f2ee;--border:#d5d2cb;--border-strong:#b5b1a8;
          --ink:#111;--ink-dim:#2a2a28;--muted:#5d5a54;--accent:#B83F00;--accent-hot:#B83F00;
          --accent-soft:#faeee6;--accent-line:#e0b79e}
    body{font-size:10.5pt}
    .controls,.caret,.copy,footer.foot,.drop-hint{display:none!important}
    .detail{display:block!important;padding-left:0;page-break-inside:avoid}
    .teaser{display:none!important}
    .card{page-break-inside:avoid;border-bottom:1px solid var(--border)}
    .chead{cursor:default;padding:14px 0}
    .card[data-status="exploited_in_the_wild"] .rank{background:#B83F00;color:#fff}
    .pill.st-exploited,.pill.nopatch{background:#B83F00;color:#fff}
    .kql pre{white-space:pre-wrap;word-break:break-word}
    .tl-row[hidden]{display:flex!important}
    .tl-more,.tl-tip{display:none!important}
    .tl-bars{overflow:visible}

d to rank 1 are not stated anywhere to be the method used against the named UK victims; the six Danfoss flaws at rank 3 have no known exploitation and must not be reported as actively exploited; ConnectWise's ~400 partner environments (rank 9) is an exposure count and must not be added to Huntress victim totals; 'CARRINGTON' at rank 10 is not resolved to a named company in any source and is a lead only; and the Computacenter listing names North American subsidiaries, with sources disagreeing on whether UK systems are in scope.","2026-11-17 run: search-result summaries only - every direct page fetch failed DNS resolution in this environment (blog.report-uri.com, www.stepsecurity.io, www.rapid7.com, cvetodo.com) and a direct curl of the CISA KEV JSON feed was refused by the agent proxy with HTTP 403, so no primary researcher post, vendor advisory, CISA catalogue record, parliamentary report or leak-site page was read. Specific consequences by entry. Rank 1 (OPTIMJACK): the entire technical account traces to one researcher, Scott Helme at Report URI, relayed through secondary coverage; the IoC set (1688360.cc with /track.js, /card.php, /hit.php; 5vobauua3ojpklx.icu and eil786npto9u5bq.icu; webshell.lol) is relayed and was not read from StepSecurity's or Report URI's own tables, and should be validated before a hard block. Counts conflict: 188 infected snippets versus 186 'confirmed infected sites' versus 178 organisations, and Report URI states its figure is a floor. The affected-brand list including BBC, BBC Earth and HSBC properties is third-party research, not a victim or vendor disclosure - no BBC or HSBC statement was located, and presence in that table indicates a compromised shared dependency, not a breach of that organisation's own infrastructure. The initial access mechanism beyond 'a vulnerability in the Experimentation account signup flow' is undescribed, one write-up states it does not know how write permission was obtained, no wallet addresses were published, and no actor has been named. Rank 2 (CVE-2026-90436): no attacker IP addresses, hashes, domains or payload names could be retrieved, so all detection content is constructed from the described mechanism rather than from a published indicator list; CVSS conflicts (CISA 9.8 against 9.3 on a PoC page); affected-version scope conflicts (one tracker lists Confluence 1.x-9.x against Rapid7's 9.2.28-or-current-10.x guidance); the N-central privilege escalation second stage still has no CVE; and KEV status is recorded as 'not listed' on the basis of absence, which is weak evidence given CISA has already assigned the CVSS. Rank 3 (UK government): neither the Lords report, nor Hansard, nor the Parliament bills page was read - all dates and quotations are relayed from press summaries and a third-party Bill tracker, secondary accounts of the Commons report stage conflict (passed without division against three amendments defeated on division), and it could not be established whether The Record's 'appears complacent' line refers to the same National Resilience Committee report or a separate committee. Rank 4: the claim that a firmware update had been available since August 2026 for the controllers the affected British suppliers were running is single-sourced and is the most consequential unverified fact in this run. Rank 5: every KEV date and due date is relayed; the Chrome CVE-2026-125350 KEV addition is in direct conflict between sources (SecurityWeek reporting no addition as of 10 November against other coverage giving a 24 November deadline) and this feed carries 24 November unconfirmed. Rank 10: ransomware.live, redpacketsecurity.com and breachsense.com were not fetchable, so all listings, file counts and byte counts are relayed from search summaries.","2026-11-17 run - corrections to earlier runs, carried in-entry. (1) The N-able N-central entry carried at rank 8 on 16 November is SUPERSEDED by rank 2 of this run and rotated out. The mechanism is now named as CVE-2026-90436 in a bundled end-of-life Apache Axis 1.x library rather than N-able's own code, exploitation is vendor-confirmed, the chain to root is named '4EverAble2Shell', and the oscillation this feed reported between N-able's 'no signs of compromise' position and statically-derived indicators is resolved. (2) SonicWall CVE-2026-19868 was added to CISA KEV on 6 November 2026, not 13 November - a CISA alert of that date records one addition and names this CVE - which resolves the stale-KEV-flag uncertainty this feed recorded on 16 November and confirms the 20 November due date. (3) The Cyber Security and Resilience Bill stage this feed recorded on 14 November as 'awaiting Commons consideration of Lords amendments with no date set' now has a date: 24 November 2026, with Lords third reading completed 2 November and carry-over extended on 4 November to 29 April 2027. (4) The ScreenConnect SCKit initial access attribution has firmed: Huntress now attributes entry to the RMM+ extension's blank shared access key in versions 1.0.31 and 1.0.32, and the earlier compromised-credentials hypothesis this feed carried was not confirmed by later analysis and should be dropped. (5) The Copeland XWEB EVO (TI-2026-11-16-002) and Danfoss AK-SM800A (TI-2026-11-16-003) entries are merged into TI-2026-11-17-004 at rank 8 with no technical content dropped.","2026-11-17 run - scope precision to preserve when re-using this data. OPTIMJACK: the approximately 7,040 US dollars in attacker wallets is not a measure of impact - card, cookie and session theft volumes are unknown and unquantified; blocking the attacker domain is only partial mitigation because one observed variant inlines the whole payload and runs it through eval precisely when the domain is unreachable; and the exposure window should be treated as beginning 04:21 UTC on 16 November until a vendor timeline supersedes it. CVE-2026-90436: Censys's approximately 1.2 million internet-exposed Confluence web properties is an exposure count and Censys says so explicitly - it must never be reported as 1.2 million vulnerable systems. Rank 3 is rated informational with no indicators and must not be escalated through an operational channel. ScreenConnect: the 688,000 guest 'run file' requests across 42 servers from 29 IP addresses and the 288 endpoints across 48 organisations are one vendor's telemetry and visibility, not global figures, and must not be added to ConnectWise's separately-reported approximately 400 partner environments, which is an exposure count; Huntress has observed no successful console takeover, so MSP consoles must not be described as taken over; and Huntress's file hashes vary by host, so hash blocking will under-detect. Rank 8: the six Danfoss AK-SM800A flaws have no known exploitation and must not be reported as actively exploited. Rank 10: 'CARRINGTON' is still not resolved to a named UK company and Vortex separately lists a US mortgage servicer of a similar name, so a country-tagging error is live; aggregator totals of 45 GB-tagged victims in 30 days and 1,202 cumulative are third-party leak-site post counts, not UK national statistics, and the movement from roughly 1,153-1,173 in the 15-16 November runs is partly tracker re-counting rather than real growth; and the Computacenter listing names North American subsidiaries with UK scope disputed.","2026-11-18 run: search-result summaries only. EVERY direct page fetch failed in this environment - cisa.gov, cvebrief.com, whatgotpwned.com, computing.co.uk, digital.nhs.uk and ransomware.live did not resolve - so no primary source was read, including the CISA Java4Shell alert, the CISA KEV catalogue, the HMRC press release, the CSA Singapore alert, UK Parliament's bills pages and the n0n leak-site listings. All dates, version numbers, CVSS scores and deadlines are relayed and must be verified before use as compliance evidence.","2026-11-18 run: rank 1 (Java4Shell CVE-2026-114938) is NOT confirmed exploited. It is ranked first on the basis of a CISA and Canadian Cyber Centre 'patch immediately' alert, a public proof of concept, and reported pre-auth reach in default Confluence, Jira, Jenkins and Keycloak configurations. The product-specific pre-auth claims come from the discovering researchers (Calif) and have not been independently reproduced in public; the CVE record was reported as still reserved on 18 November and the mapping to OpenJDK change JDK-8393212 is unconfirmed.","2026-11-18 run: rank 5 (Apache mod_http2 CVE-2026-119618) carries LOW confidence because the exploitation evidence conflicts - Singapore's CSA says 'reportedly' exploited on 17 November, while Wiz Research reported no known exploitation on 11 November and F5 Labs is reported to see no major activity. No victims, actors or indicators are published by anyone.","2026-11-18 run: rank 8's UK corporate incidents are unverified leak-site claims only. Neither Debenhams nor Bensons for Beds has been quoted confirming an incident, no ICO statement was found, and the record counts (15,708 email addresses, 8,530 password-recovery codes) are the 'n0n' group's own. Bitdefender's research into n0n's own file server indicated just over 20 real victims with probable duplicate and false listings, against tracker figures of 122 victims in 30 days - the group's victim accounting is unreliable in both directions.","2026-11-18 run: rank 9's exploitation statements are vendor advisory claims relayed second-hand and conflict. One outlet quotes Apache stating Roller CVE-2026-129448 is actively exploited while an aggregator records no evidence and notes absence from CISA KEV; Roller's fixed version is given as both 6.1.5 and 6.1.6. TYPO3 CVE-2026-119623 (reported CVSS 9.4, RCE) is poorly characterised in the sources reviewed.","2026-11-18 run: CORRECTION. The 17 November run stated that 24 November 2026 was confirmed on UK Parliament's own bills pages as the date for Commons consideration of Lords amendments to the Cyber Security and Resilience Bill. It is not. The date is traceable only to a commercial Bill-tracking site which labels it a position 'as at 13 November'. No official Parliament page confirming it was located. Rank 10's confidence is downgraded to low. This is the second correction this feed has made to its account of this Bill's progress.","2026-11-18 run: the Zyxel item inside rank 7 records that CISA's KEV entry for the GS1900 campaign names CVE-2026-7273, while Binarly's research shows the exploited flaw is CVE-2026-107441. The 996-device and 48-country figures and the 'Kapibala' attribution come from GreyNoise via trade press and were not read at source; the firmware release date differs between sources (22 or 23 October 2026).","2026-11-19 run: search-result summaries only - every direct page fetch was blocked in this environment, and cvebrief.com additionally failed DNS resolution, so every version number, deadline and figure below is relayed from search summaries and requires verification against the primary source. Specific unresolved items: the NHS England Java4Shell cyber alert of 18 November and its NCSOC 'exploitation likely' assessment are single-sourced and the NHS England page itself was not retrieved; the BOD 26-04 forensic-triage instruction for Apache Axis is single-sourced; GreyNoise's position on CVE-2026-114938 is internally inconsistent across sources (one reports classifications downgraded with no block candidates, while its live page reportedly still shows observed infrastructure); the NGINX Plus fixed build numbers and the claim that trains R34-R36 have no fix are secondary, and the identity and count of the other three 'NGINX2Root' flaws were not established; LiteLLM CVE-2026-40217 CVSS is reported variously as 8.8, 7.5 and 5.9; Wellington IT figures conflict between outlets (40 to 50 credit unions, 1.4 million vs 5 million malicious requests, and 1.8 million is an Irish Times estimate of potential reach rather than a confirmed count of affected individuals); the three UK retail entries on the n0n leak site are unnamed in all available sources and Bitdefender's assessment puts roughly two-thirds of that site's listings in doubt; no file hashes or exfiltration infrastructure were captured for the agent-framework compromise; and the composition of the 24 November KEV deadline group is carried forward from earlier runs in this feed and was not re-verified against CISA's catalogue."],"confidence_legend":{"high":"Corroborated by the vendor advisory or by multiple independent reputable sources.","medium":"Reported by a single reputable source, or by secondary coverage of a primary source not directly accessible.","low":"Single-sourced and uncorroborated; treat as an investigative lead only."},"exploitation_status_values":["exploited_in_the_wild","exploitation_attempts_reported_unconfirmed","public_poc_available","no_known_exploitation"],"kql_platform_values":["sentinel","defender_xdr"],"ioc_types_present":["account","behaviour","domain","filename","filepath","malware","note","port","service_name","ttp","uri_path"]},"vulnerabilities":[{"rank":1,"id":"TI-2026-11-19-001","title":"'NGINX2Root' CVE-2026-123007 Disclosed 18 November: A Ten-Year-Old HTTP/2 Flow-Control Integer Underflow Gives Unauthenticated Remote Code Execution on the Web Server Layer That Fronts Most of the UK Government and Corporate Web Estate, and a Public Proof of Concept Is Already Out","cve_ids":["CVE-2026-123007","CVE-2026-123633"],"vendor":"F5 (NGINX Open Source, NGINX Plus)","affected_products":["NGINX Open Source 1.9.5 through 1.31.8 with HTTP/2 enabled - fixed in 1.31.9 (mainline) and 1.30.7 (stable)","NGINX Plus - fixed builds reported as R37 P1 equivalents 37.3.0.1 and 37.0.8.1; R34 to R36 reported as having no fix listed at disclosure","Any reverse proxy, ingress controller, load balancer, WAF or appliance that embeds NGINX - including Kubernetes ingress-nginx, API gateways and vendor appliances that do not carry the NGINX name"],"category":"vulnerability_bundle","cvss_v3":8.1,"severity":"critical","exploitation_status":"public_poc_available","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-18","last_updated":"2026-11-19","confidence":"medium","summary":"F5 disclosed five NGINX vulnerabilities on 18 November 2026, led by CVE-2026-123007, an integer underflow in the HTTP/2 flow-control implementation that can be driven to unauthenticated remote code execution as the NGINX worker process. F5 scores it 9.2 under CVSS v4.0 and 8.1 under CVSS v3.1. Researchers at Rapid7 reported it, Wiz published analysis alongside a second identifier (CVE-2026-123633), and the set has been named 'NGINX2Root' in trade coverage. The affected range runs from NGINX 1.9.5 - released in 2015, when HTTP/2 support was added - through 1.31.8, which is to say essentially every NGINX build with HTTP/2 enabled for the last decade.\n\nWhy this is rank 1 for a UK-focused feed, on a day when CISA added four exploited vulnerabilities to KEV. NGINX is the layer in front of things. It terminates TLS and proxies for a very large share of UK central government digital services, local authority portals, NHS trust web front ends, university estates and corporate web applications, usually as a reverse proxy sitting in a DMZ with unauthenticated reach from the internet by design. That is the exposure profile that makes a pre-authentication flaw in it a different class of problem from a pre-authentication flaw in an application: there is no login page in front of it, there is frequently no WAF in front of it because it IS the WAF, and the hosts are often the ones not in the patch cycle because they are 'just the proxy'. Rank 2's Apache Axis flaw is being actively exploited and rank 2 is where it belongs; this one is first because the installed base is larger by orders of magnitude, the patch state is worse, and the window between a public proof of concept and mass scanning has been measured in hours twice this month already - the N-able N-central chain at rank 2 was exploited roughly five hours after its PoC was published on 12 November.\n\nExploitation status, stated precisely. There is no confirmed in-the-wild exploitation as at the morning of 19 November. A public proof of concept exists and has been reported as released. F5 states that code execution is possible where ASLR is disabled or bypassed, and the reporting researchers say they bypassed ASLR in their own testing. GreyNoise has no tag for any of the five CVEs yet and none of them is in CISA's KEV catalogue. Read that as the pre-exploitation window rather than as reassurance: the preconditions for mass exploitation - enormous installed base, trivially reachable service, working public PoC - are all present, and the only missing element is a weaponised chain, which the PoC shortens considerably.\n\nThe mitigation that actually works today, and its cost. Disabling HTTP/2 removes exposure to CVE-2026-123007 specifically. On a reverse proxy this is a one-line change (remove 'http2' from the listen directive, or set 'http2 off;' on 1.25.1 and later) and a reload, with no restart of upstream services. The cost is real but usually tolerable: HTTP/2 multiplexing improves page load on connection-heavy sites, so expect a measurable latency regression on front ends serving many small assets, and expect gRPC-over-HTTP/2 upstreams to break outright - check for grpc_pass before touching anything. It does not cover the other four flaws in the set, so it is a bridge to patching rather than a substitute for it.\n\nThe patch problem for UK organisations is not the NGINX package, it is everything that embeds it. The fixed open-source versions are 1.31.9 and 1.30.7. NGINX Plus subscribers have fixed builds, but R34 to R36 were reported at disclosure as having no fix listed, which leaves organisations on older supported Plus trains with disabling HTTP/2 as the only option. More significantly, most organisations do not run NGINX as a package they chose; they run it inside a Kubernetes ingress-nginx controller image, inside an API gateway, inside a vendor appliance, or inside a container base image three layers down from anything in the software register. Those are patched by the vendor or the image maintainer, on the vendor's timetable, and they are the instances that will still be vulnerable in February. The useful action today is an inventory question rather than a patching question: which of our internet-facing listeners speak HTTP/2, and what is actually terminating them?\n\nUK relevance and the honest limit of it. No UK organisation has been named, no UK-specific advisory had been published as at the time of writing, and nothing ties this to UK targeting. The relevance is structural and it is strong: this is the single most widely deployed piece of software in the UK public sector's internet-facing perimeter after the operating system itself, and the vulnerability is pre-authentication on the listening socket. Treat it as a perimeter inventory exercise with a 72-hour clock, not as a CVE to triage in the next sprint.\n\nConfidence and caveats. Confidence is medium. The CVE identifier, the HTTP/2 flow-control mechanism, the 1.9.5-to-1.31.8 range and the 1.31.9 / 1.30.7 fixed versions are consistently reported across Rapid7, Wiz, Tenable, Qualys and trade press. The CVSS figures differ by version (9.2 v4.0, 8.1 v3.1) and the v3.1 figure is recorded here to keep the register consistent. The NGINX Plus fixed build numbers and the claim that R34-R36 have no fix are relayed from secondary coverage and should be confirmed against F5's own advisory. The identity and count of the other three flaws in the 'NGINX2Root' set were not established in this run. No pages were fetched directly in this environment.","recommended_actions":["Today, inventory rather than patch: enumerate every internet-facing listener that negotiates HTTP/2 and record what terminates it. Include Kubernetes ingress-nginx controllers, API gateways, WAF appliances, CDN origin shields and anything embedding NGINX without the name on it - 'nginx -v' on the hosts you know about will not find those.","Where the front end is not patched within 72 hours, disable HTTP/2 as a bridging control: remove 'http2' from the listen directive or set 'http2 off;' and reload. Check for grpc_pass first - gRPC upstreams require HTTP/2 and will break - and expect a latency regression on asset-heavy pages. This mitigates CVE-2026-123007 only, not the rest of the set.","Patch NGINX Open Source to 1.31.9 (mainline) or 1.30.7 (stable). For NGINX Plus, confirm the fixed build against F5's own advisory rather than press summaries; if you are on R34 to R36 and no fix is listed for your train, plan the upgrade and run with HTTP/2 disabled until it lands.","Push the question to your suppliers in writing today, because the embedded instances are the ones that will linger: ask each vendor of an internet-facing appliance, ingress controller or managed gateway which NGINX version it ships and when the fixed build arrives. Record the answers - under the incoming Cyber Security and Resilience regime this is the sort of supplier assurance you will be expected to evidence.","Baseline and then alert on NGINX worker process behaviour: a worker spawning a shell, resolving an unexpected domain, writing to a web root, or crashing repeatedly. A worker segfault loop is the cheapest available signal of an attempted exploit of a memory-corruption bug, and on a production proxy it is also rare enough to alert on without tuning.","Confirm ASLR is enabled on every host running NGINX (kernel.randomize_va_space = 2 on Linux). F5's own statement conditions code execution on ASLR being disabled or bypassed, so this is the difference between a crash and a compromise on the hosts where it has been turned off for a legacy reason nobody remembers.","Do not treat 'no confirmed exploitation' as the decision input. A working public PoC against a ten-year installed base is the condition under which the Apache Axis flaw at rank 2 went from PoC to roughly 40,000 exploitation attempts in under a week."],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"NGINX version inventory against the 1.31.9 / 1.30.7 fixed builds","description":"Exposure baseline. NGINX is frequently absent from software inventory when it ships inside an appliance or container image, so treat an empty result as an inventory gap rather than as a clean estate.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has \"nginx\" or SoftwareVendor has_any (\"nginx\", \"f5\")\n| extend VersionParts = split(SoftwareVersion, \".\")\n| extend Major = toint(VersionParts[0]), Minor = toint(VersionParts[1]), Patch = toint(VersionParts[2])\n| extend LikelyVulnerable = case(\n    Major == 1 and Minor between (9 .. 29), true,\n    Major == 1 and Minor == 30 and Patch \u003c 7, true,\n    Major == 1 and Minor == 31 and Patch \u003c 9, true,\n    false)\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion, LikelyVulnerable\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by SoftwareName, SoftwareVersion, LikelyVulnerable\n| order by LikelyVulnerable desc, Hosts desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Child process of an NGINX worker - the consequence of successful exploitation","description":"Code execution lands as the NGINX worker user (www-data, nginx, http). A reverse proxy worker should essentially never spawn an interpreter or a network tool. Baseline for a week before alerting, because some configurations legitimately invoke helpers.","query":"DeviceProcessEvents\n| where Timestamp > ago(14d)\n| where InitiatingProcessFileName in~ (\"nginx\", \"nginx.exe\") or InitiatingProcessAccountName in~ (\"www-data\", \"nginx\", \"http\", \"nobody\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"zsh\", \"curl\", \"wget\", \"nc\", \"ncat\", \"socat\", \"python\", \"python3\", \"perl\", \"ruby\", \"php\", \"base64\", \"chmod\", \"crontab\", \"useradd\", \"ssh-keygen\", \"systemctl\", \"powershell.exe\", \"cmd.exe\")\n| project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"sentinel","table":"Syslog","name":"NGINX worker process crash loop - cheapest signal of an attempted memory-corruption exploit","description":"Exploiting an integer underflow unreliably produces worker segfaults before it produces a shell. On a production proxy, repeated worker exits are rare enough to alert on directly.","query":"Syslog\n| where TimeGenerated > ago(7d)\n| where ProcessName has \"nginx\" or SyslogMessage has \"nginx\"\n| where SyslogMessage has_any (\"worker process\", \"signal 11\", \"SIGSEGV\", \"segfault\", \"exited on signal\", \"core dumped\", \"worker process exited\")\n| summarize Crashes = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Sample = any(SyslogMessage) by Computer, bin(TimeGenerated, 1h)\n| where Crashes > 3\n| order by Crashes desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"HTTP/2 negotiation to internet-facing listeners - scoping the attack surface","description":"Scoping query rather than a detection. Identifies which perimeter listeners actually negotiate h2, which is the set that disabling HTTP/2 would change and the set exposed to CVE-2026-123007.","query":"CommonSecurityLog\n| where TimeGenerated > ago(7d)\n| where DeviceVendor has_any (\"nginx\", \"F5\", \"Palo Alto\", \"Fortinet\", \"Zscaler\")\n| where AdditionalExtensions has_any (\"h2\", \"HTTP/2\", \"http2\") or RequestMethod has \"PRI\"\n| summarize Requests = count(), SourceIPs = dcount(SourceIP) by DestinationIP, DestinationPort, DeviceVendor, DeviceProduct\n| order by Requests desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Unexpected writes into NGINX configuration or web root by the worker account","description":"Post-exploitation persistence on an NGINX host is usually a config rewrite (traffic hijack, as seen in the February 2026 malicious-configuration campaign) or a webshell dropped in the served root.","query":"DeviceFileEvents\n| where Timestamp > ago(14d)\n| where FolderPath has_any (\"/etc/nginx\", \"/usr/share/nginx\", \"/var/www\", \"/usr/local/nginx\", \"conf.d\", \"sites-enabled\")\n| where InitiatingProcessAccountName in~ (\"www-data\", \"nginx\", \"http\", \"nobody\") or InitiatingProcessFileName has \"nginx\"\n| where ActionType in (\"FileCreated\", \"FileModified\", \"FileRenamed\")\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, InitiatingProcessAccountName, InitiatingProcessCommandLine, SHA256\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connection initiated by the NGINX worker to a non-upstream destination","description":"A reverse proxy connects to its defined upstreams. An outbound connection from the worker to an address outside that set, especially on a non-HTTP port, is either a misconfiguration or a callback. Replace the upstream list with your own.","query":"let KnownUpstreams = dynamic([\"10.\", \"172.16.\", \"172.17.\", \"192.168.\"]);\nDeviceNetworkEvents\n| where Timestamp > ago(7d)\n| where InitiatingProcessFileName in~ (\"nginx\", \"nginx.exe\") or InitiatingProcessAccountName in~ (\"www-data\", \"nginx\", \"http\")\n| where ActionType == \"ConnectionSuccess\"\n| where not(RemoteIP has_any (KnownUpstreams))\n| where RemotePort !in (80, 443, 8080, 8443)\n| project Timestamp, DeviceName, InitiatingProcessAccountName, RemoteIP, RemotePort, RemoteUrl, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Anomalous HTTP/2 request volume or stream-reset patterns from single sources","description":"Flow-control abuse presents as abnormal stream and window behaviour rather than as a recognisable URI. Where the proxy logs protocol version, hunt for sources generating disproportionate h2 request volume. Expect noise from legitimate API clients; tune on the top talkers.","query":"W3CIISLog\n| where TimeGenerated > ago(3d)\n| where csProtocol has \"2\" or csProtocol has \"HTTP/2\"\n| summarize Requests = count(), DistinctUris = dcount(csUriStem), Resets = countif(scStatus in (0, 408, 499, 500)) by cIP, Computer, bin(TimeGenerated, 10m)\n| extend ResetRatio = todouble(Resets) / todouble(Requests)\n| where Requests > 500 and ResetRatio > 0.3\n| order by Requests desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"CVE-mapped exposure for the NGINX2Root set","description":"Run once the vulnerability feed has mapped the 18 November identifiers. Until then rely on the version-inventory query above, because new CVEs take days to appear in exposure data.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId in (\"CVE-2026-123007\", \"CVE-2026-123633\")\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion, CveId, VulnerabilitySeverityLevel\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by CveId, SoftwareName, SoftwareVersion\n| order by Hosts desc"}],"iocs":[{"type":"note","value":"NO ATTACKER INFRASTRUCTURE PUBLISHED - PRE-EXPLOITATION WINDOW","context":"As at 19 November 2026 there is no confirmed in-the-wild exploitation, no GreyNoise tag for any of the five NGINX2Root CVEs and no KEV listing. The entries below are exposure conditions and detection behaviours derived from the described mechanism, not observed indicators.","confidence":"high","source":"GreyNoise and Precursor Security via secondary reporting"},{"type":"ttp","value":"HTTP/2 flow-control integer underflow driven to heap corruption in the NGINX worker process","context":"The mechanism. Exploitation happens during protocol framing, before any application-layer authentication, so no account and no valid session are required.","confidence":"high","source":"Rapid7 and Wiz analysis via secondary reporting"},{"type":"ttp","value":"Code execution as the NGINX worker user on a DMZ reverse proxy with unauthenticated internet reach by design","context":"Why this outranks higher-CVSS application flaws for a UK public-sector estate: the asset class has no authentication boundary in front of it and frequently is the WAF.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Repeated NGINX worker process exits on signal 11 / SIGSEGV on an internet-facing proxy","context":"Unreliable exploitation of a memory-corruption bug crashes workers before it yields execution. The cheapest available signal, and rare enough on production proxies to alert on without tuning.","confidence":"medium","source":"analyst assessment"},{"type":"behaviour","value":"Shell, curl, wget, python or base64 executing as a child of an nginx worker, or as www-data / nginx / http","context":"The consequence of successful exploitation. A reverse proxy worker should not spawn interpreters; baseline for a week first because some configurations invoke helpers legitimately.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Modification of files under /etc/nginx, conf.d or sites-enabled by the worker account rather than by a configuration-management agent","context":"Config rewriting is the established post-exploitation pattern on NGINX hosts - the February 2026 malicious-configuration campaign hijacked traffic this way with no new malware on disk.","confidence":"medium","source":"Datadog Security Labs February 2026 campaign, applied by analogy"},{"type":"behaviour","value":"Outbound connection from the NGINX worker to a destination outside the configured upstream set","context":"A reverse proxy's egress is enumerable from its own configuration, which makes this one of the few places where an allowlist-shaped detection is practical.","confidence":"medium","source":"analyst assessment"},{"type":"port","value":"443/tcp and 80/tcp with h2 or h2c negotiated","context":"The exposure condition. HTTP/2 must be enabled on the listener; HTTP/1.1-only listeners are not exposed to CVE-2026-123007.","confidence":"high","source":"F5 advisory via secondary reporting"},{"type":"behaviour","value":"kernel.randomize_va_space set to 0 or 1 on a host running NGINX","context":"F5 conditions code execution on ASLR being disabled or bypassed. On hosts where ASLR was turned off for a legacy application, the same bug is a compromise rather than a crash.","confidence":"high","source":"F5 advisory via secondary reporting"},{"type":"behaviour","value":"Kubernetes ingress-nginx controller image not rebuilt since 18 November 2026","context":"The instances that will still be vulnerable in three months are the embedded ones. Container-image NGINX is patched by the image maintainer, not by your package manager.","confidence":"high","source":"analyst assessment"},{"type":"ttp","value":"Public proof-of-concept release preceding mass exploitation by hours","context":"Pattern established twice this month: the N-able N-central chain at rank 2 was exploited roughly five hours after its PoC appeared on 12 November. Use it to set the patch clock, not to wait for indicators.","confidence":"high","source":"Lupovis and Huntback telemetry via secondary reporting"},{"type":"behaviour","value":"NGINX Plus deployment on release train R34 to R36","context":"Reported at disclosure as having no fixed build listed, which leaves disabling HTTP/2 as the only available control until an upgrade. Verify against F5's advisory.","confidence":"low","source":"secondary reporting"}],"references":["https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities","https://www.tenable.com/blog/nginx2root-cve-2026-123007-frequently-asked-questions-about-five-critical-nginx","https://blog.qualys.com/product-tech/patch-management/2026/11/18/nginx2root-five-nginx-flaws-led-by-cve-2026-123007-how-to-find-mitigate-and-patch-now","https://thehackernews.com/2026/11/10-year-old-nginx-http2-flaw-lets.html","https://securityonline.info/nginx-remote-code-execution-cve-2026-123007-poc/","https://www.precursorsecurity.com/blog/nginx2root-critical-nginx-rce-vulnerabilities","https://www.ncsc.nl/alerts/kwetsbaarheden-in-f5-networks-nginx-update-nu","https://securitylabs.datadoghq.com/articles/web-traffic-hijacking-nginx-configuration-malicious/"]},{"rank":2,"id":"TI-2026-11-19-002","title":"Apache Axis CVE-2026-90436 Added to CISA KEV on 18 November With a Three-Day Remediation Deadline of 21 November and Forensic Triage Ordered Under BOD 26-04: There Is No Fixed Axis Release, and the Same Flaw Is the Entry Point of the N-able N-central MSP Chain","cve_ids":["CVE-2026-90436"],"vendor":"Apache Software Foundation (Axis 1.x, end of life) - reached through Atlassian Confluence Data Center and N-able N-central","affected_products":["Apache Axis 1.x, all versions through 1.4 - no fixed release will be published; Axis 1.x is end of life","Atlassian Confluence Data Center and Server with the Remote API (XML-RPC and SOAP) enabled - mitigated by disabling Remote API, upgrade path reported as Confluence Data Center 9.2.28","N-able N-central on-premises with the non-default Legacy API enabled and internet-exposed - chained with a local privilege escalation to root ('4EverAble2Shell'); hosted N-central reported not vulnerable to this chain","Any Java application that bundles Axis 1.x - the component is frequently present as a transitive dependency and absent from the software register"],"category":"vulnerability","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-21","patch_available":"no","first_reported":"2026-11-13","last_updated":"2026-11-19","confidence":"high","summary":"CISA added CVE-2026-90436 to the Known Exploited Vulnerabilities catalogue on 18 November 2026 with a remediation due date of 21 November - three days, which is as short a KEV deadline as this feed has recorded and a marker of how CISA reads the exploitation evidence. Reporting also states that CISA ordered forensic triage for the Axis flaw under Binding Operational Directive 26-04, meaning federal agencies are not only told to remediate but to look for evidence that they already have been compromised. That is the distinction worth carrying into a UK risk conversation: the instruction is not 'patch this', it is 'assume this may already have happened and go and check'.\n\nWhat changed since yesterday. This entry was rank 2 in the 18 November run as an actively exploited vulnerability without a KEV listing. The facts of the vulnerability are unchanged - an unsafe reflection / unsafe deserialization flaw in the end-of-life Apache Axis 1.x SOAP engine, CVSS 9.8, reachable without authentication through Confluence Data Center's Remote API endpoint, with approximately 40,000 exploitation attempts from more than 600 unique IPs reported in three days and Censys measuring roughly 1.2 million internet-exposed Confluence properties. What changed is the formal status and the deadline, plus the clearer picture of the second exploitation path.\n\nThe second path is the MSP one, and for UK organisations it may matter more than the Confluence one. The same Axis flaw is the first link in the chain disclosed as '4EverAble2Shell' against N-able N-central, the remote monitoring and management platform used by managed service providers. Independent researcher Sean Bales published proof-of-concept code on 12 November; exploitation followed within approximately five hours according to Lupovis and Huntback telemetry. Attackers chained the Axis flaw with a separate N-central privilege escalation to reach root and installed XMRig Monero miners on at least 21 production servers - nineteen of which were already running Hotfix 2. That last detail is the one to take to a supplier conversation: patch level did not protect those servers, because the precondition is the non-default Legacy API being enabled and exposed, not the patch state. Cryptomining is the payload observed so far, which is the cheapest thing an attacker can do with root on an RMM platform that reaches every one of that MSP's customer endpoints. UK SMEs and mid-market organisations overwhelmingly consume IT through MSPs, which makes this a supply-chain exposure for organisations that have never heard of N-central.\n\nThere is no patch for Axis and there will not be one. Axis 1.x is end of life; the Apache Software Foundation is not shipping a fixed release. The remediation options are to stop reaching the vulnerable code (disable Confluence's Remote API; disable N-central's Legacy API), to migrate to a maintained SOAP engine such as Axis2/Java, or to rebuild from source with the patch commit referenced as 41f3b4e8. For most organisations the first option is the only one available this week. Disabling Confluence's Remote API requires no restart and the verification is concrete: confirm that /plugins/servlet/soap-axis1/confluenceservice-v2 returns 403.\n\nUK relevance. Confluence is close to ubiquitous in UK government departments, NHS trusts, universities and corporates as the wiki that holds runbooks, architecture diagrams, joiner-leaver processes and - routinely, despite every policy forbidding it - credentials in plain text. That is why the instruction for any instance that was internet-reachable between 13 and 19 November is assume compromise rather than assume exposure, and why the first post-exploitation action is to search page content and attachments for stored secrets before anything else. An attacker who read your Confluence does not need a second vulnerability.\n\nConfidence and caveats. Confidence is high on the KEV addition, the 21 November deadline, the CVSS 9.8 rating, the absence of a fixed Axis release and the Confluence mitigation. The BOD 26-04 forensic triage instruction is reported by a single secondary source and should be confirmed against CISA's own text before it is quoted to a board. Reports conflict on whether a public PoC exists for the Axis flaw itself - one tracker lists a PoC as available, another finds none - while the N-central chain PoC is confirmed published on 12 November. Atlassian's own advisory reportedly does not discuss exploitation, so the Confluence exploitation picture rests on third-party telemetry. The 40,000-attempt and 600-IP figures are relayed from Shadowserver and The DFIR Report via trade press and were not read at source. No pages were fetched directly in this environment.","recommended_actions":["Treat 21 November as your deadline too. Disable Confluence's Remote API (XML-RPC and SOAP) now - Administration, General Configuration, Further Configuration, clear 'Remote API (XML-RPC & SOAP)'. No restart is needed. Then verify by requesting /plugins/servlet/soap-axis1/confluenceservice-v2 and confirming a 403.","For any Confluence instance that was internet-reachable at any point between 13 and 19 November, run an assume-compromise review rather than an exposure check: CISA has ordered forensic triage for this flaw under BOD 26-04, and the exploitation volume reported is not consistent with targeted use.","Before anything else in that review, search Confluence page content and attachments for stored credentials, API keys, connection strings and private keys, and rotate everything you find. This is the step that determines whether a Confluence compromise stays a Confluence compromise.","Ask your managed service provider, in writing and today, whether they run N-able N-central on premises, whether the Legacy API is enabled, and whether it is internet-exposed. Nineteen of the twenty-one compromised servers were on the current hotfix, so 'we are fully patched' is not an answer to this question.","Hunt for the 4EverAble2Shell host indicators on any N-central server: an unexpected xvd.service systemd unit, files under /tmp/.xvd or /var/tmp/.xvd, a shell script named jup.sh, and XMRig or other miner processes. Cryptomining was the observed payload; root on an RMM platform permits considerably worse.","Inventory Axis 1.x as a dependency rather than as a product. Search build manifests and deployed JARs for axis-1.*.jar and org.apache.axis classes; it arrives as a transitive dependency in Java applications whose owners do not know it is there, and there will be no vendor advisory for those.","Plan the migration off Axis 1.x on a quarterly horizon, not a weekly one, but start the planning now. The component is end of life, this is the second serious flaw in it this month, and there is no maintainer to ship the third fix."],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Requests to the Confluence Axis SOAP endpoint","description":"The exploitation path. Any hit from an external source should be investigated; after the Remote API is disabled these should all return 403, and a 200 means the mitigation is not applied.","query":"W3CIISLog\n| where TimeGenerated > ago(14d)\n| where csUriStem has_any (\"soap-axis1\", \"confluenceservice-v2\", \"/services/\", \"axis\", \"servlet/axis\")\n| project TimeGenerated, Computer, cIP, csMethod, csUriStem, csUriQuery, scStatus, csUserAgent, csBytes\n| summarize Requests = count(), Statuses = make_set(scStatus), Agents = make_set(csUserAgent, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by cIP, csUriStem, Computer\n| order by Requests desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Perimeter requests carrying serialized Java or SOAP payloads to Confluence or N-central","description":"Deserialization payloads contain recognisable markers. Base64-encoded Java serialization begins rO0AB; raw streams begin with the hex magic aced0005.","query":"CommonSecurityLog\n| where TimeGenerated > ago(14d)\n| where RequestURL has_any (\"soap-axis1\", \"confluenceservice\", \"/services/\", \"/dms/\", \"n-central\", \"legacy\")\n   or AdditionalExtensions has_any (\"rO0AB\", \"aced0005\", \"java.lang.Runtime\", \"ProcessBuilder\", \"xsi:type\")\n| project TimeGenerated, DeviceVendor, SourceIP, DestinationIP, DestinationPort, RequestMethod, RequestURL, DeviceAction, AdditionalExtensions\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Child process of the Confluence or Tomcat JVM - code execution as the service account","description":"Successful exploitation runs commands as the Confluence service user. On a wiki server there is no legitimate reason for the JVM to spawn a shell, an interpreter or a download tool.","query":"DeviceProcessEvents\n| where Timestamp > ago(21d)\n| where InitiatingProcessCommandLine has_any (\"confluence\", \"catalina\", \"tomcat\", \"n-central\", \"nable\") or InitiatingProcessFileName in~ (\"java\", \"java.exe\", \"javaw.exe\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"nc\", \"ncat\", \"socat\", \"python\", \"python3\", \"perl\", \"base64\", \"chmod\", \"crontab\", \"xmrig\", \"cmd.exe\", \"powershell.exe\", \"certutil.exe\")\n| project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"4EverAble2Shell host indicators on N-able N-central servers","description":"Named indicators from the N-central campaign: the xvd.service unit, the .xvd staging directories, the jup.sh installer and miner processes. These are specific enough to alert on without tuning.","query":"DeviceProcessEvents\n| where Timestamp > ago(30d)\n| where ProcessCommandLine has_any (\"xvd.service\", \"/tmp/.xvd\", \"/var/tmp/.xvd\", \"jup.sh\", \"xmrig\", \"stratum+tcp\", \"--donate-level\", \"minerd\")\n   or FileName in~ (\"xmrig\", \"jup.sh\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, ReportId\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Webshell or miner artefacts written into Confluence or N-central installation paths","description":"Post-exploitation persistence. JSP webshells in a Confluence install path, or hidden directories under /tmp, are the two patterns reported in this campaign.","query":"DeviceFileEvents\n| where Timestamp > ago(21d)\n| where FolderPath has_any (\"confluence\", \"tomcat\", \"n-central\", \"nable\", \"/tmp/.\", \"/var/tmp/.\")\n| where FileName endswith \".jsp\" or FileName endswith \".jspx\" or FileName endswith \".sh\" or FileName in~ (\"jup.sh\", \"xmrig\")\n| where ActionType in (\"FileCreated\", \"FileModified\", \"FileRenamed\")\n| project Timestamp, DeviceName, ActionType, FolderPath, FileName, SHA256, InitiatingProcessAccountName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Mining pool and stratum egress from server estate","description":"The observed payload is XMRig. Stratum connections from a server are close to unambiguous, and this detection is worth keeping permanently regardless of this CVE.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemotePort in (3333, 4444, 5555, 7777, 8888, 14444, 45700) or RemoteUrl has_any (\"pool\", \"xmr\", \"monero\", \"minexmr\", \"nanopool\", \"supportxmr\", \"stratum\")\n| where ActionType == \"ConnectionSuccess\"\n| summarize Connections = count(), FirstSeen = min(Timestamp), LastSeen = max(Timestamp), Ports = make_set(RemotePort) by DeviceName, RemoteIP, RemoteUrl, InitiatingProcessFileName\n| order by Connections desc"},{"platform":"sentinel","table":"ConfluenceAudit_CL","name":"Credential and secret harvesting from Confluence content after suspected compromise","description":"Assumes Confluence audit or access logs are ingested to a custom table; rename to match your own. The purpose is to find bulk reading or export of pages following the suspected intrusion window, which is how a wiki compromise becomes a credential compromise.","query":"ConfluenceAudit_CL\n| where TimeGenerated between (datetime(2026-11-13) .. now())\n| where Action_s has_any (\"page viewed\", \"attachment downloaded\", \"export\", \"space exported\", \"search\")\n| summarize Events = count(), Pages = dcount(Object_s), Spaces = dcount(Space_s) by User_s, SourceIP_s, bin(TimeGenerated, 1h)\n| where Pages > 100 or Events > 500\n| order by Pages desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareVulnerabilities","name":"Confluence and Axis 1.x exposure inventory","description":"Exposure check. Axis 1.x usually arrives as a transitive dependency, so an empty result should be read as an inventory limitation rather than as absence.","query":"DeviceTvmSoftwareVulnerabilities\n| where CveId == \"CVE-2026-90436\" or SoftwareName has_any (\"confluence\", \"axis\", \"n-central\")\n| project DeviceName, SoftwareVendor, SoftwareName, SoftwareVersion, CveId, VulnerabilitySeverityLevel\n| summarize Hosts = dcount(DeviceName), SampleHosts = make_set(DeviceName, 25) by SoftwareName, SoftwareVersion, CveId\n| order by Hosts desc"}],"iocs":[{"type":"uri_path","value":"/plugins/servlet/soap-axis1/confluenceservice-v2","context":"The exploitation path through Confluence Data Center. After the Remote API is disabled this must return 403; a 200 means the mitigation is not in place.","confidence":"high","source":"Atlassian mitigation guidance via secondary reporting"},{"type":"ttp","value":"Unsafe reflection / deserialization in end-of-life Apache Axis 1.x reached pre-authentication through a SOAP endpoint","context":"CVSS 9.8, no fixed release will be published. Remediation is to remove reachability, migrate to Axis2/Java, or rebuild from source with patch commit 41f3b4e8.","confidence":"high","source":"CVE record and Apache guidance via secondary reporting"},{"type":"ttp","value":"Axis flaw chained with an N-able N-central local privilege escalation to root ('4EverAble2Shell')","context":"Requires the non-default Legacy API enabled and internet-exposed. Nineteen of twenty-one compromised servers were already on Hotfix 2, so patch level is not the control.","confidence":"high","source":"Lupovis, Huntback and Huntress reporting via trade press"},{"type":"malware","value":"XMRig","context":"The observed payload on compromised N-central servers. Cryptomining is the cheapest use of root on an RMM platform that reaches every customer endpoint; assume capability beyond what was used.","confidence":"high","source":"Huntback and trade press"},{"type":"filename","value":"jup.sh","context":"Installer script served by the attacker host in the N-central campaign, traced by Huntback to a single staging host.","confidence":"medium","source":"Huntback via trade press"},{"type":"service_name","value":"xvd.service","context":"Unexpected systemd unit used for miner persistence on compromised N-central servers. Specific enough to alert on directly.","confidence":"medium","source":"Huntback via trade press"},{"type":"filepath","value":"/tmp/.xvd and /var/tmp/.xvd","context":"Hidden staging directories for the miner payload on compromised N-central hosts.","confidence":"medium","source":"Huntback via trade press"},{"type":"behaviour","value":"Approximately 40,000 exploitation attempts from more than 600 unique source IPs in three days","context":"Volume reported against the Confluence path. Not consistent with targeted exploitation; the correct posture for an exposed instance is assume compromise.","confidence":"medium","source":"Shadowserver and The DFIR Report via trade press"},{"type":"behaviour","value":"Approximately 1,212,568 internet-exposed Confluence properties measured by Censys","context":"Scale of the exposed population, not a count of compromised hosts. Use it to explain why the KEV deadline is three days.","confidence":"medium","source":"Censys via trade press"},{"type":"ttp","value":"Public exploitation within approximately five hours of PoC publication (12 November)","context":"The window between disclosure and exploitation for this component class. Relevant to rank 1's NGINX PoC, which is now in the same position.","confidence":"high","source":"Lupovis and Huntback via trade press"},{"type":"behaviour","value":"Shell, curl, wget or chmod executing as a child of the Confluence or Tomcat JVM","context":"The consequence of successful exploitation. A wiki server's JVM has no legitimate reason to spawn these.","confidence":"high","source":"analyst assessment"},{"type":"behaviour","value":"Bulk page view, search or space export activity in Confluence audit logs after 13 November","context":"How a Confluence compromise becomes a credential compromise. Runbooks and architecture pages routinely hold secrets in plain text.","confidence":"medium","source":"analyst assessment"},{"type":"note","value":"BOD 26-04 FORENSIC TRIAGE INSTRUCTION IS SINGLE-SOURCED","context":"The report that CISA ordered forensic triage for the Axis flaw under Binding Operational Directive 26-04 comes from one secondary source. Confirm against CISA's own text before quoting it to a board.","confidence":"low","source":"secondary reporting"}],"references":["https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog","https://thehackernews.com/2026/11/cisa-warns-of-4-exploited-flaws-linked.html","https://securityonline.info/cisa-adds-4-exploited-flaws-kev-synology-litellm/","https://www.rescana.com/post/apache-axis-cve-2026-90436-confluence-data-center-rce-prepare-now","https://www.tuskira.ai/advisories/cve-2026-90436","https://cipherssecurity.com/apache-axis-cve-2026-90436-confluence-rce/","https://thebackroomtech.com/n-able-n-central-zero-day-4everable2shell-updated-systems-compromised/","https://otecosystem.com/n-able-n-central-4everable2shell-attacks-2026-21-servers-hacked-despite-latest-hotfix/","https://www.decryptiondigest.com/blog/n-central-4everable2shell-zero-day-rmm","https://heise.de/news/Angriffe-auf-Luecken-in-Apache-Axis-und-Roller-LiteLLM-Synology-und-mehr-11530429.html"]},{"rank":3,"id":"TI-2026-11-19-003","title":"UK Government: NHS England Issued Its Own Java4Shell Cyber Alert on 18 November Assessing Future Exploitation as Likely, as GreyNoise Records Exploitation Attempts Against CVE-2026-114938 and a Full RCE Exploit Reaches Commercial Subscribers - While Two Independent Analyses Put the Genuinely Exploitable Population Below 0.12% of JVMs","cve_ids":["CVE-2026-114938"],"vendor":"Oracle / OpenJDK (and every downstream JDK distributor)","affected_products":["OpenJDK and Oracle Java SE 17, 21, 25 and 27 trains - Oracle fixed builds 17.0.21.1, 21.0.13.1, 25.0.5.1 and 27.0.1.1 (17 November); affected range reported from 17.0.6 onwards but not confirmed by Oracle or OpenJDK","Reported pre-authentication in default configurations of Keycloak, Jira, Confluence, Jenkins, JFrog Artifactory and PingFederate","Cisco published an advisory on 18 November covering products potentially affected; downstream JDK coverage reported as uneven, with no Red Hat errata and no fixed Temurin 17 build at the time of checking","Exploitable path reported as limited to CPUs providing AVX-512 VBMI and BW instruction features - ARM64 and older x86-64 reported out of scope for RCE"],"category":"vulnerability","cvss_v3":8.1,"severity":"critical","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-17","last_updated":"2026-11-19","confidence":"medium","summary":"This is the UK government item dated inside the window, and it is a defensive action rather than an incident: on 18 November 2026 NHS England published a cyber alert on CVE-2026-114938 ('Java4Shell'), warning that successful exploitation could allow unauthenticated remote code execution and recording its National Cyber Security Operations Centre's assessment that future exploitation is likely. The alert does not report any compromise of NHS systems. For a UK-focused feed that matters in two ways. First, it is the UK's largest single public-sector technology estate formally raising the item to its own suppliers and trusts - NHS England's cyber alerts are consumed as instructions across hundreds of organisations, which makes this the closest thing in the window to a UK national tasking. Second, the NHS estate is a worked example of the exposure: Java application servers in front of clinical and administrative systems, a large population of appliances with embedded JDKs, and identity infrastructure that frequently includes Keycloak.\n\nWhat changed in the 24 hours since this feed ranked Java4Shell first. The direction of travel is, on balance, downward, and this entry records that honestly rather than keeping the alarm at yesterday's level.\n\nExploitation. GreyNoise reports exploitation attempts against CVE-2026-114938, with scanning concentrated almost entirely on ports 80 and 8080, and states that it has not confirmed any successful exploitation against its sensors. One report says GreyNoise has since downgraded its classifications and currently lists no block candidates, while its live tracking page still shows observed infrastructure entries - the two statements are not reconcilable from search results alone and the discrepancy is recorded rather than resolved. Censys describes probing and exploit-shaped requests without confirmed success. There is still no confirmed successful exploitation anywhere, and the flaw is not in CISA's KEV catalogue.\n\nExploit availability. VulnCheck states that a full RCE exploit was available to its Initial Access Intelligence customers from 18:00 EST on 17 November. The original researchers are deliberately withholding product-specific exploits until organisations have had time to upgrade. So: a working commercial exploit exists, a public one does not, and the gap between those two states is measured in weeks at best.\n\nExploitability, which is the genuinely new information. Two independent analyses argue the practical blast radius is far smaller than the initial framing implied. OX Security estimates that less than 0.12% of JVMs are at risk of RCE. VulnCheck notes that the vulnerable code path executes only on CPUs providing the AVX-512 VBMI and BW instruction features, and researchers broadly agree that denial of service is readily achievable while reliable remote code execution requires per-application work. Oracle's own CVSS v3.1 score is 8.1 - high, not critical - which is the number NHS England's alert carries.\n\nHow to hold both of those truths at once. The correct reading is not 'the panic was unjustified' and it is not 'patch everything by Friday'. It is that the triage input is CPU features and reachability, not the CVE number. Check /proc/cpuinfo for avx512_vbmi on your internet-facing Java hosts; where the flag is absent, the RCE case is reported to fall away and you are left with a denial-of-service exposure that belongs in the normal patch cycle. Where it is present and the host is internet-facing - cloud instances on recent Intel server silicon are the likely population - treat it as the 72-hour item it was yesterday. That single check will reclassify most of the estate, and it is the reason this entry sits at rank 3 rather than rank 1.\n\nThe patching problem remains the downstream one. Oracle shipped fixed builds on 17 November. Red Hat's packages reportedly had no errata at the time of checking and Temurin for Java 17 had no fixed build, which leaves organisations on those distributions with the mitigation rather than the fix. The reported mitigation where no patch exists is to disable the Base64 intrinsics with -XX:-UseBASE64Intrinsics on x86-64, which is an ac
