ns using signing material obtained from the vCenter directory, which no password reset revokes","context":"The persistence mechanism that makes the signing key rotation decision urgent. A second independent vmdir authentication bypass weakens any argument that the material was not reached.","confidence":"high","source":"Google/Mandiant via secondary reporting"},{"type":"behaviour","value":"A change record stating 'vCenter patched - VMSA-2026-0009 remediated' and closed","context":"Recorded as an indicator because it is the most likely reason this entry is missed. 0009 does not cover 0011; a closed ticket reading like this means an open CVSS 9.8 authentication bypass.","confidence":"high","source":"Analyst assessment"},{"type":"note","value":"vCenter 7.0: no public patch exists for the Armory Castle flaw and none will be issued","context":"An open decision carried from previous runs. Record the accepted risk and migration date, or remove the exposure.","confidence":"medium","source":"Secondary reporting"}]},{"rank":7,"id":"TI-2026-11-25-007","title":"DAY SEVEN AND NOTHING HAS CHANGED, WHICH IS THE UPDATE: Azure API Management Classic Still Has No CVE, No Public Advisory, No Customer-Visible Log and No Way to Prove You Were Not Accessed - Microsoft's Fix Explicitly Does Not Invalidate Credentials Already Stolen, So the Only Measurable Thing Is How Far Through Rotation You Have Got","cve_ids":[],"vendor":"Microsoft","affected_products":["Azure API Management Classic - Developer tier","Azure API Management Classic - Basic tier","Azure API Management Classic - Standard tier","Azure API Management Classic - Premium tier","NOT affected: Consumption Classic and all v2 tiers"],"category":"incident","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-19","last_updated":"2026-11-25","confidence":"medium","summary":"This was rank 1 yesterday. It is rank 7 today not because it has become less serious but because two items with dated KEV deadlines and one with a near-universal reachable attack surface arrived above it. Nothing about the exposure has improved, and the specific update after a week is that nothing has been published: still no CVE, still no publicly readable advisory, still no customer-visible log, and no new detection path from Microsoft or from any third party in this window. For an item of this consequence, a week of silence is itself the finding.\n\nWHAT HAPPENED. Attackers exploited a flaw in the Azure API Management management plane to read customer secrets out of APIM Classic instances. The reported exposure list is specific and bad: Named Values, including the ones holding database credentials, service account passwords and signing keys; identity provider and OpenID Connect client secrets; subscription keys; and direct management API tokens. Microsoft identified the issue on 18 November 2026 and closed the path on 19 November 2026. Affected tiers are Developer, Basic, Standard and Premium Classic. Consumption Classic and all v2 tiers are not affected.\n\nTHE THREE FACTS THAT LEAVE NO WAY OUT, AND THEY HAVE NOT CHANGED. First, Microsoft has stated plainly that the fix does NOT invalidate credentials already stolen. The path is closed; whatever left through it is still valid until you rotate it. Second, the exploited API produced no customer-visible logging, so you cannot confirm access and you cannot rule it out - there is no query in this report or anywhere else that answers 'were we accessed'. Third, the advisory, reportedly identified as MZK9-GH0, is not public: it is visible only in your own Azure Service Health blade, which means you cannot read your neighbour's copy, your auditor cannot read yours, and no amount of searching substitutes for logging into the portal and looking.\n\nTHE UK GOVERNMENT ANGLE. Norway's national cyber security authority NSM has publicly tied this flaw to attacks on its energy sector, and its guidance is to assume exposure and rotate. That is a NATO ally's national authority treating this as a critical national infrastructure matter, which is the strongest external signal available to a UK public body weighing whether rotation is proportionate. There is no equivalent UK publication: no NCSC alert on this specific issue surfaced in this run. APIM sits in front of a great many UK government and NHS integration layers precisely because it is the component that holds the credentials for everything behind it, which is what makes the Named Values exposure the serious part - it is not one secret, it is the index of secrets.\n\nWHAT TO DO, AND IT IS STILL ONLY ONE THING. Rotate. In order: Named Values holding database credentials, service account passwords and signing keys first; then identity provider and OpenID Connect client secrets; then subscription keys; then management API tokens. There is no detection-based alternative and no partial measure that reduces the risk, because the credentials are either still valid or they are not.\n\nTHE ONE THING THAT WILL OUTLAST THIS INCIDENT. Rotation forces you to build a map of which Named Value feeds which backend dependency. Almost no organisation has that map, and its absence is why rotation is slow and frightening rather than routine. Keep it. It is the most valuable artefact that will come out of this incident, and it is the thing that will make the next credential exposure a day of work instead of a week.\n\nEVIDENCE QUALITY, UNCHANGED AND IMPORTANT. Everything in this entry derives from secondary reporting of a non-public Microsoft advisory and of NSM's advisory. No primary source has been read. The exposed-secret list and the statement that the fix does not invalidate stolen credentials are consistently reported across sources but could not be verified at origin. There is no CVE, so this item will not appear in your vulnerability scanner, your patch compliance report or your KEV tracker - which means that if your process only acts on things with CVE identifiers, this one is invisible to it by construction. That is the structural lesson worth taking from a week of this entry sitting in the report.","recommended_actions":["If you have not already, establish today whether you run Azure API Management Classic in Developer, Basic, Standard or Premium tier. Consumption Classic and all v2 tiers are not affected. This is a five-minute check in the portal or via the resource SKU, and it is the only question that decides whether the rest of this applies.","Open the Azure Service Health blade in each affected subscription and read the advisory, reportedly MZK9-GH0, for yourself. It is not published anywhere else. Searching the web for it, including reading this report, is not a substitute - and your auditor will need the portal screenshot, not a news article.","Rotate in this order: Named Values holding database credentials, service account passwords and signing keys; then identity provider and OpenID Connect client secrets; then subscription keys; then management API tokens. There is no detection-based alternative, because Microsoft has stated the fix does not invalidate credentials already stolen.","Track rotation completion as a percentage and report it weekly. This is the only measurable thing in this entry. There is no scan result, no patch level and no log query that produces a status, so rotation progress is the status.","Build and KEEP the map of which Named Value feeds which backend dependency. Rotation forces you to construct it; almost no organisation has it in advance, and its absence is the entire reason rotation is slow. It is the most valuable durable output of this incident.","Do not wait for a CVE. There is none, and the absence means this item will never appear in your vulnerability scanner, your patch compliance report or your KEV tracker. If your remediation process only acts on CVE identifiers, add a route for vendor incidents that do not carry one.","Review which identities held APIM management API tokens and reduce that set while you rotate. A management token is the broadest credential in the exposed list and the one least likely to have a documented owner.","Where you cannot rotate a credential quickly - a signing key with downstream dependencies, a database credential in a legacy integration - document the exposure and the date, and put compensating monitoring on the backend it protects. An undocumented un-rotated credential is the one that will still be valid in six months.","Cite Norway's NSM guidance when making the case internally. A NATO ally's national authority has tied this flaw to attacks on its energy sector and advises assuming exposure and rotating. No equivalent UK publication surfaced in this run, so NSM is the strongest external authority available.","Record explicitly that you cannot determine whether you were accessed, and get that accepted at the right level rather than leaving it implicit. The exploited API produced no customer-visible logging. 'We found no evidence of access' is a misleading statement here, because no evidence of access could exist either way."],"references":["https://techzine.eu/news/security/146028/microsoft-patches-actively-exploited-vulnerability-in-azure-api-management","https://www.bleepingcomputer.com/news/security/","https://thehackernews.com/2026/11/cisa-warns-of-active-exploitation-of.html","https://www.cisa.gov/news-events/cybersecurity-advisories","https://www.ncsc.gov.uk/section/keep-up-to-date"],"kql":[{"platform":"sentinel","table":"AzureDiagnostics","name":"Azure API Management gateway activity baseline and anomalies","description":"This does NOT detect the management-plane exploitation, which produced no customer-visible logging. It establishes what normal looks like on the data plane so that use of a stolen subscription key has something to stand out against.","query":"AzureDiagnostics\n| where TimeGenerated > datetime(2026-11-01)\n| where ResourceProvider == \"MICROSOFT.APIMANAGEMENT\"\n| where Category in (\"GatewayLogs\", \"WebSocketConnectionLogs\")\n| summarize Requests = count(), DistinctCallers = dcount(CallerIpAddress), Apis = make_set(apiId_s, 20), Operations = make_set(operationId_s, 20), Statuses = make_set(responseCode_d, 10) by Resource, bin(TimeGenerated, 1d)\n| order by TimeGenerated asc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"API Management calls from source addresses never seen before the incident","description":"The practical detection for use of a stolen subscription key. If a key left through the management plane, its use shows up as the same key from a new place. Compares callers after 18 November against the prior baseline.","query":"let Baseline = AzureDiagnostics\n  | where TimeGenerated between (datetime(2026-08-01) .. datetime(2026-11-18))\n  | where ResourceProvider == \"MICROSOFT.APIMANAGEMENT\" and Category == \"GatewayLogs\"\n  | distinct CallerIpAddress;\nAzureDiagnostics\n| where TimeGenerated > datetime(2026-11-18)\n| where ResourceProvider == \"MICROSOFT.APIMANAGEMENT\" and Category == \"GatewayLogs\"\n| where CallerIpAddress !in (Baseline)\n| summarize Requests = count(), Apis = make_set(apiId_s, 20), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by Resource, CallerIpAddress\n| order by FirstSeen asc"},{"platform":"sentinel","table":"AzureActivity","name":"Management-plane operations against API Management resources","description":"Control-plane audit view. Will not show the exploited read path, but will show legitimate and illegitimate configuration changes - and it is where your own rotation activity will appear, which makes it the evidence trail for completion.","query":"AzureActivity\n| where TimeGenerated > datetime(2026-11-01)\n| where ResourceProviderValue =~ \"MICROSOFT.APIMANAGEMENT\" or OperationNameValue has \"apimanagement\"\n| project TimeGenerated, Caller, CallerIpAddress, OperationNameValue, ActivityStatusValue, ResourceGroup, _ResourceId, Properties\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"SigninLogs","name":"Use of identity provider client secrets that APIM held","description":"Stolen OpenID Connect and identity provider client secrets are used to obtain tokens. This surfaces service principal and application authentication that could be backed by a secret taken from APIM Named Values.","query":"SigninLogs\n| where TimeGenerated > datetime(2026-11-18)\n| where ResultType == 0\n| where AppDisplayName has_any (\"API Management\", \"apim\") or ResourceDisplayName has_any (\"API Management\", \"apim\")\n| summarize Signins = count(), IPs = make_set(IPAddress, 30), Locations = make_set(Location, 15), Agents = make_set(UserAgent, 10) by UserPrincipalName, AppDisplayName, ServicePrincipalName\n| order by Signins desc"},{"platform":"sentinel","table":"AzureDiagnostics","name":"Key Vault and secret access from the backends APIM Named Values pointed at","description":"The downstream question. If a Named Value held a database credential or a Key Vault reference, the consequence is at the backend, not at APIM. This is where to look for the use of what was taken.","query":"AzureDiagnostics\n| where TimeGenerated > datetime(2026-11-18)\n| where ResourceProvider == \"MICROSOFT.KEYVAULT\"\n| where OperationName has_any (\"SecretGet\", \"KeyGet\", \"CertificateGet\", \"SecretList\")\n| summarize Accesses = count(), Secrets = make_set(id_s, 30), Callers = make_set(identity_claim_appid_g, 20), IPs = make_set(CallerIPAddress, 20) by Resource, bin(TimeGenerated, 1d)\n| order by TimeGenerated asc"}],"iocs":[{"type":"note","value":"No CVE has been assigned to this incident, and none is expected","context":"The structural problem with this entry. It will never appear in a vulnerability scanner, a patch compliance report or a KEV tracker, so any remediation process that only acts on CVE identifiers cannot see it.","confidence":"high","source":"Analyst assessment across reviewed sources"},{"type":"note","value":"Microsoft advisory reportedly identified as MZK9-GH0, visible only in the customer's own Azure Service Health blade and not published publicly","context":"You must log into the portal to read it. No web source substitutes, and your auditor needs the portal record rather than a news article.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"Microsoft has stated the fix does NOT invalidate credentials already stolen","context":"The single most important sentence in this entry. The path is closed; whatever left through it remains valid until rotated. This is why rotation is the only action.","confidence":"medium","source":"Secondary reporting of non-public Microsoft advisory"},{"type":"note","value":"The exploited management-plane API produced no customer-visible logging","context":"You cannot confirm access and you cannot rule it out. 'We found no evidence of access' is a misleading statement here, because no such evidence could exist either way.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"Exposed secret types: Named Values (including database credentials, service account passwords and signing keys), identity provider and OpenID Connect client secrets, subscription keys, and management API tokens","context":"The rotation order follows this list. Named Values matter most because APIM holds the credentials for everything behind it - it is not one secret, it is the index of secrets.","confidence":"medium","source":"Consistently reported across secondary sources, unverified at origin"},{"type":"note","value":"Affected tiers: Developer, Basic, Standard and Premium Classic. NOT affected: Consumption Classic and all v2 tiers.","context":"The scoping question, answerable in five minutes from the resource SKU. Decides whether anything else in this entry applies to you.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"Timeline: Microsoft identified the issue 2026-11-18 and closed the path 2026-11-19","context":"Exposure predates 18 November by an unknown period. No start date has been published, which means no bounded window can be given for the credential exposure.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"Norway's NSM has publicly tied this flaw to attacks on its energy sector and advises assuming exposure and rotating","context":"The strongest external authority available. A NATO ally's national authority treating this as a critical national infrastructure matter. No equivalent UK NCSC publication on this specific issue surfaced in this run.","confidence":"medium","source":"NSM advisory via secondary reporting"},{"type":"note","value":"DAY SEVEN STATUS: no CVE, no public advisory, no customer-visible log, and no new detection path published by Microsoft or any third party in this window","context":"The update for this run. For an item of this consequence a week of silence is itself the finding, and it means the position has not improved since the first report.","confidence":"high","source":"Analyst assessment across reviewed sources"},{"type":"behaviour","value":"Use of an API Management subscription key from a source address not seen in the pre-18 November baseline","context":"The practical detection for a stolen key. The management-plane theft left no trace, but the use of what was taken can still surface on the data plane.","confidence":"medium","source":"Analyst assessment"},{"type":"behaviour","value":"Service principal or application authentication backed by an identity provider client secret that APIM held","context":"How a stolen OpenID Connect secret is used. Look at token acquisition for the applications APIM fronted, not at APIM itself.","confidence":"medium","source":"Analyst assessment"},{"type":"note","value":"Everything in this entry derives from secondary reporting of a non-public Microsoft advisory and of NSM's advisory; no primary source has been read in any run","context":"Stated for the seventh consecutive day. Verify at source before using any date or scoping statement here as audit evidence.","confidence":"high","source":"Analyst assessment - collection limitation"},{"type":"note","value":"The Named Value to backend dependency map that rotation forces you to build is the most valuable durable artefact of this incident","context":"Keep it. Its absence is why rotation is slow and frightening; its existence makes the next credential exposure a day of work rather than a week.","confidence":"high","source":"Analyst assessment"}]},{"rank":8,"id":"TI-2026-11-25-008","title":"BOTH DEADLINES HAVE NOW EXPIRED AND THE HUNTING HAS NOT: Cisco Expressway CVE-2026-76466 and BroadWorks CVE-2026-20320 - One Command Against erlang.log Is Still the Hardest Indicator in This Report, the Expressway Intrusion Reached Internal GitLab Repositories, and Patching Neither Appliance Undoes What Was Disclosed","cve_ids":["CVE-2026-76466","CVE-2026-20320"],"vendor":"Cisco","affected_products":["Cisco Expressway - clustered nodes, fixed in X15.5.20","Cisco BroadWorks Open Client Interface - fixed in RI.2026.07","Cisco TelePresence Video Communication Server deployments sharing the Expressway code base"],"category":"vulnerability_bundle","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-24","patch_available":"yes","first_reported":"2026-11-20","last_updated":"2026-11-25","confidence":"medium","summary":"Both KEV deadlines in this entry have now passed - BroadWorks CVE-2026-20320 expired on 24 November and the Expressway item earlier. Nothing in the remediation closes with the deadline, and the two actions that matter most are still outstanding in most estates: one log search, and one credential audit that has nothing to do with the appliance.\n\nTHE ONE COMMAND. Search erlang.log on every Cisco Expressway node for a nodeup event from wombat@127.0.0.1. That string remains the single hardest indicator in this report - the only concrete, searchable, non-behavioural artefact across ten entries. It comes from F6's account of a real intrusion and it is reported consistently across multiple secondary accounts, though no primary source could be read. If you do nothing else from this entry, do that, because it takes one command and it either finds something or it does not.\n\nWHAT THE EXPRESSWAY INTRUSION ACTUALLY DID, AND WHY THE APPLIANCE IS THE SMALL PART. F6's account, now corroborated across multiple secondary reports, describes four devices compromised and then post-intrusion activity that moved immediately off the appliance: custom Python scripts scanning for SMB, SQL Server and WinRM, and searching internal GitLab repositories for credentials. Read that last clause again, because it determines the scope of your response. An attacker who reaches a video conferencing appliance and then harvests credentials out of internal source control has acquired something that survives every patch you apply to the appliance. If you upgrade Expressway to X15.5.20, block TCP 4371 to 4372, treat every cluster peer as compromised where any node was reachable - all correct - and do not audit internal GitLab and rotate what you find there, you have closed the door and left the keys outside it.\n\nF6 additionally assessed that the post-intrusion Python tooling was likely written with an AI assistant. That is an inference from code characteristics, it is single-source, and it is recorded here as such - but it is also one of the five AI-agent-adjacent reports that drove last week's analysis and that the NCSC publication at rank 5 now describes in general terms.\n\nBROADWORKS, WHERE THE DEADLINE EXPIRED YESTERDAY. CVE-2026-20320 is an unauthenticated XML external entity flaw in the BroadWorks Open Client Interface on TCP 2208. It reads arbitrary files from the server, including configuration files containing keys. Cisco disclosed it on 19 August 2026, so the fix - RI.2026.07 - has existed for three months. Malbear Labs reported that an AI agent exploited this flaw against a telecommunications provider; that is a single-source claim and is labelled as such. Two actions: block TCP 2208 at the perimeter and upgrade; and rotate the keys that were in the configuration files, because file disclosure is not undone by a patch. The practical obstacle in most organisations is ownership - BroadWorks is a carrier voice platform, it is usually run by a voice or unified communications team, and that team is frequently outside the security patching process entirely. Find out today who owns it. In a number of UK public bodies the answer will be a managed service provider, which turns this into the same written-question exercise as rank 3.\n\nTHE VENDOR-VERSUS-AUTHORITY SPLIT, WHICH IS NOW A STANDING FEATURE. Cisco's PSIRT position is that it is not aware of active exploitation in the wild for CVE-2026-76466, and that it lacks direct evidence of exploitation for CVE-2026-20320. CISA has both in KEV. F6 reports first-hand incident response on the Expressway flaw. This is not a contradiction to resolve so much as a structural characteristic of vendor advisories: a PSIRT states what it has verified itself, and an incident responder states what it saw at a customer. Prioritise on the KEV listing and the first-hand account, and expect your vulnerability management tooling - which usually ingests the vendor statement - to disagree. That disagreement appeared five times in a single day last week and twice more in today's report.\n\nWHAT IS STILL MISSING. No file hashes, no YARA rules, no malware sample references and no command-and-control infrastructure have been published for either flaw. Everything except wombat@127.0.0.1 and the port numbers is behavioural or structural. Neither Cisco advisory nor F6's report could be read directly in this run.","recommended_actions":["Run the one command today: search erlang.log on every Cisco Expressway node for a nodeup event from wombat@127.0.0.1. It is the hardest indicator in this report, it takes one command, and it is the highest value-per-minute action available across all ten entries.","Audit internal GitLab and other source control for committed credentials, and rotate everything you find. This is the action most likely to be skipped and the one that determines whether the intrusion is actually closed, because post-intrusion tooling in the Expressway case specifically searched repositories for credentials - and those credentials survive every appliance patch.","Upgrade clustered Expressway nodes to X15.5.20 and block TCP 4371 to 4372 at the perimeter. Treat every cluster peer as compromised if any node in the cluster was externally reachable, rather than only the node you have evidence for.","Block TCP 2208 at the perimeter and upgrade BroadWorks to RI.2026.07. Cisco disclosed CVE-2026-20320 on 19 August 2026, so the fix has been available for three months and the KEV deadline expired yesterday - record the date you act, because the compliance position is already overdue.","Rotate every key that was present in BroadWorks configuration files. The flaw reads arbitrary files including configuration containing keys. Patching stops further disclosure; it does not un-disclose what was already read.","Find out today who owns your BroadWorks estate, and expect the answer to be a voice or unified communications team outside the security patching process, or a managed service provider. This ownership gap, not the technical difficulty, is why a three-month-old fix is still unapplied in most organisations.","Hunt for internal reconnaissance from the appliances themselves: SMB, SQL Server and WinRM scanning originating from Expressway or BroadWorks hosts. That is the documented post-intrusion behaviour and it is detectable in network telemetry even without indicators.","Expect your vulnerability management tooling to disagree with this entry and override it. Cisco PSIRT states it is not aware of exploitation for CVE-2026-76466 and lacks direct evidence for CVE-2026-20320, while CISA lists both in KEV and F6 reports first-hand incident response. Prioritise on KEV and the first-hand account.","Record the expired deadlines explicitly rather than letting them drop off the tracker. Both are now overdue, and an item that silently disappears from a KEV report when its date passes is the most common way overdue remediation becomes invisible.","Review which other appliances in your estate hold credentials for internal systems in their configuration, and whether anyone has ever audited what an attacker reading those files would obtain. Expressway and BroadWorks are instances of a category: network appliances trusted enough to hold keys and excluded from the patching process that protects them."],"references":["https://bleepingcomputer.com/news/security/cisa-flags-critical-cisco-expressway-rce-flaw-as-actively-exploited","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://thehackernews.com/2026/11/cisa-warns-of-active-exploitation-of.html","https://www.ncsc.gov.uk/blogs/familiar-weaknesses-exploited-faster-defending-against-agentic-cyber-attacks","https://www.cisa.gov/news-events/cybersecurity-advisories","https://www.fortiguard.com/threat-signal-report/6533/citrix-netscaler-rce-zero-day-vulnerabilities"],"kql":[{"platform":"sentinel","table":"Syslog","name":"THE ONE COMMAND - wombat@127.0.0.1 nodeup in Cisco Expressway erlang.log","description":"The hardest indicator in this report and the highest value-per-minute query across all ten entries. If Expressway forwards logs to Sentinel this finds it centrally; if not, grep erlang.log on each node directly.","query":"Syslog\n| where TimeGenerated > datetime(2026-08-01)\n| where SyslogMessage has \"wombat@127.0.0.1\" or (SyslogMessage has \"nodeup\" and SyslogMessage has \"wombat\")\n| project TimeGenerated, Computer, Facility, ProcessName, SeverityLevel, SyslogMessage\n| order by TimeGenerated asc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Internal reconnaissance originating from voice and conferencing appliances","description":"The documented post-intrusion behaviour: SMB, SQL Server and WinRM scanning from the compromised appliance. Detectable from the target side even with no indicators, by looking for one source touching many destinations on those ports.","query":"DeviceNetworkEvents\n| where Timestamp > datetime(2026-08-01)\n| where RemotePort in (445, 139, 1433, 1434, 5985, 5986, 3389)\n| where ActionType == \"InboundConnectionAccepted\"\n| summarize Targets = dcount(DeviceName), Attempts = count(), Ports = make_set(RemotePort, 10), Hosts = make_set(DeviceName, 40) by RemoteIP, bin(Timestamp, 1h)\n| where Targets >= 10\n| order by Targets desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Exposure of TCP 2208, 4371 and 4372 at the perimeter","description":"Confirms whether the two blocking controls are actually in place. Do not take the firewall rule's existence as evidence; look for traffic that was permitted.","query":"CommonSecurityLog\n| where TimeGenerated > datetime(2026-08-01)\n| where DestinationPort in (2208, 4371, 4372)\n| summarize Events = count(), Sources = dcount(SourceIP), TopSources = make_set(SourceIP, 30), Actions = make_set(DeviceAction, 10) by DestinationIP, DestinationPort, bin(TimeGenerated, 1d)\n| order by TimeGenerated asc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Internal source control access and repository enumeration","description":"The action most likely to be skipped. Post-intrusion tooling searched internal GitLab for credentials, so this looks for the enumeration pattern - one identity reading many repositories in a short window.","query":"CloudAppEvents\n| where Timestamp > datetime(2026-08-01)\n| where Application has_any (\"GitLab\", \"GitHub\", \"Bitbucket\", \"Azure DevOps\")\n| where ActionType has_any (\"Read\", \"Clone\", \"Download\", \"Search\", \"FileAccessed\", \"RepositoryAccessed\")\n| summarize Actions = count(), Objects = dcount(ObjectName), Repos = make_set(ObjectName, 40) by AccountDisplayName, IPAddress, bin(Timestamp, 1h)\n| where Objects >= 15\n| order by Objects desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Credential search patterns in source trees and configuration","description":"The tooling behaviour rather than the tool. An attacker or an agent searching for credentials uses recognisable patterns, and these are cheap to detect because legitimate use is rare on servers.","query":"DeviceProcessEvents\n| where Timestamp > datetime(2026-08-01)\n| where ProcessCommandLine has_any (\"grep -r\", \"findstr /s\", \"Select-String\", \"rg \")\n| where ProcessCommandLine has_any (\"password\", \"passwd\", \"secret\", \"api_key\", \"apikey\", \"token\", \"BEGIN RSA\", \"BEGIN PRIVATE\", \"connectionstring\", \".env\", \"credentials\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"sentinel","table":"Syslog","name":"Cisco Expressway and BroadWorks build verification","description":"Produces the remediation evidence for two expired KEV deadlines. Cross-check against X15.5.20 for Expressway and RI.2026.07 for BroadWorks rather than against change tickets.","query":"Syslog\n| where TimeGenerated > ago(14d)\n| where SyslogMessage has_any (\"Expressway\", \"BroadWorks\", \"VCS\", \"X15.\", \"RI.2026\", \"Open Client Interface\")\n| extend ExpresswayVersion = extract(@\"(X\\d+\\.\\d+\\.\\d+)\", 1, SyslogMessage)\n| extend BroadWorksRelease = extract(@\"(RI\\.\\d{4}\\.\\d{2})\", 1, SyslogMessage)\n| where isnotempty(ExpresswayVersion) or isnotempty(BroadWorksRelease)\n| summarize LastSeen = max(TimeGenerated), Versions = make_set(ExpresswayVersion, 5), Releases = make_set(BroadWorksRelease, 5) by Computer\n| order by Computer asc"}],"iocs":[{"type":"account","value":"wombat@127.0.0.1","context":"A nodeup event from this identity in Cisco Expressway erlang.log. The single hardest indicator across all ten entries in this report and the only concrete searchable artefact. One command finds it.","confidence":"medium","source":"F6 incident response account via multiple secondary reports"},{"type":"filepath","value":"erlang.log","context":"The Expressway log file to search. If logs are not centralised, grep this file directly on every node including cluster peers.","confidence":"medium","source":"F6 incident response account via secondary reporting"},{"type":"port","value":"2208/tcp","context":"Cisco BroadWorks Open Client Interface. The attack surface for CVE-2026-20320, an unauthenticated XXE that reads arbitrary files including configuration containing keys. Block at the perimeter.","confidence":"high","source":"Cisco advisory via secondary reporting"},{"type":"port","value":"4371/tcp","context":"Cisco Expressway clustering port associated with the CVE-2026-76466 attack path. Block at the perimeter alongside 4372.","confidence":"medium","source":"F6 and secondary reporting of Cisco advisory"},{"type":"port","value":"4372/tcp","context":"Second Cisco Expressway clustering port in the same range. Block alongside 4371.","confidence":"medium","source":"F6 and secondary reporting of Cisco advisory"},{"type":"ttp","value":"Unauthenticated XML external entity injection against the BroadWorks Open Client Interface on TCP 2208, reading arbitrary server files including configuration containing keys","context":"The BroadWorks exploit. File disclosure is not undone by a patch, which is why key rotation is a separate required action.","confidence":"high","source":"Cisco advisory via secondary reporting"},{"type":"ttp","value":"Post-intrusion custom Python scripts scanning for SMB, SQL Server and WinRM, and searching internal GitLab repositories for credentials","context":"The scope-defining behaviour. Credentials harvested from internal source control survive every patch applied to the appliance, which makes the GitLab audit the action that actually closes the intrusion.","confidence":"medium","source":"F6 via multiple secondary reports"},{"type":"ttp","value":"An AI agent reported to have exploited BroadWorks CVE-2026-20320 against a telecommunications provider","context":"Single-source claim from Malbear Labs, recorded as such. One of the reports underpinning the agentic-attack picture the NCSC describes at rank 5.","confidence":"low","source":"Malbear Labs via secondary reporting - single source"},{"type":"behaviour","value":"A single internal source connecting to many hosts on 445, 1433 and 5985 within a short window","context":"The reconnaissance signature, detectable from the target side without any indicators. A compromised appliance is an unusual source for this pattern, which makes it high-fidelity.","confidence":"medium","source":"Analyst assessment based on F6 reporting"},{"type":"behaviour","value":"One identity reading or cloning an unusually large number of source repositories in a short period","context":"Credential harvesting from internal source control. Worth a standing detection regardless of this entry, because it is the step that converts a single appliance compromise into estate-wide credential exposure.","confidence":"medium","source":"Analyst assessment based on F6 reporting"},{"type":"note","value":"Fixed versions: Cisco Expressway X15.5.20; Cisco BroadWorks RI.2026.07","context":"The remediation targets. Verify against Cisco advisories before using for audit evidence; neither could be read directly in this run.","confidence":"medium","source":"Secondary reporting of Cisco advisories"},{"type":"note","value":"BOTH KEV DEADLINES HAVE NOW EXPIRED: CVE-2026-20320 was due 2026-11-24; the Expressway item earlier. Both are overdue.","context":"Record the overdue position explicitly. An item that silently drops off a KEV tracker when its date passes is the most common route to invisible overdue remediation.","confidence":"high","source":"CISA KEV catalogue via secondary reporting"},{"type":"note","value":"Cisco disclosed CVE-2026-20320 on 2026-08-19 - the fix has existed for three months","context":"The delay is an ownership problem, not a technical one. BroadWorks is usually run by a voice or unified communications team outside the security patching process, or by a managed service provider.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"VENDOR VERSUS AUTHORITY: Cisco PSIRT states it is not aware of exploitation in the wild for CVE-2026-76466 and lacks direct evidence for CVE-2026-20320; CISA lists both in KEV and F6 reports first-hand incident response","context":"Not a contradiction to resolve. A PSIRT states what it verified; a responder states what it saw. Prioritise on KEV and the first-hand account, and expect your tooling to disagree.","confidence":"high","source":"Cisco PSIRT statements and CISA KEV catalogue via secondary reporting"},{"type":"note","value":"F6 assessed that the post-intrusion Python tooling was likely written with an AI assistant, inferred from code characteristics","context":"Single-source inference, not evidence of an agentic framework. Recorded because it is one of the reports underpinning the picture the NCSC published on 24 November.","confidence":"low","source":"F6 via secondary reporting - single source"},{"type":"note","value":"Treat every Expressway cluster peer as compromised if any node in the cluster was externally reachable","context":"Four devices were compromised in the reported intrusion. Scoping to the one node you have evidence for is the predictable under-response.","confidence":"medium","source":"F6 remediation guidance via secondary reporting"},{"type":"note","value":"No file hashes, YARA rules, malware samples or command-and-control infrastructure have been published for either CVE","context":"Everything except wombat@127.0.0.1 and the port numbers is behavioural or structural. A clean indicator search means very little here.","confidence":"high","source":"Analyst assessment across reviewed sources"}]},{"rank":9,"id":"TI-2026-11-25-009","title":"THE UK CORPORATE PATTERN THIS MONTH, AND IT IS NOT ABOUT ANY ONE COMPANY: Next, ASOS, Optimizely and Five Leak-Site Listings - in EVERY Confirmed UK Retail and Consumer Disclosure This Month the Compromise Was at a Third Party, Not at the Named Brand, Which Means the Control That Would Have Prevented Them Is Supplier Assurance Rather Than Anything in Your Own Estate","cve_ids":[],"vendor":"Multiple - UK retail, consumer and healthcare supply chain","affected_products":["Third-party online suppliers to UK retailers","Third-party customer communication and marketing platforms","Third-party experimentation and analytics JavaScript","Managed service providers supplying UK public sector and SME organisations"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploitation_attempts_reported_unconfirmed","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-23","last_updated":"2026-11-25","confidence":"medium","summary":"Taken individually these are small items. Taken together they are the clearest finding in this report about UK corporate risk, and it is a finding about architecture rather than about any of the companies named.\n\nNEXT PLC, 23 NOVEMBER, COVERAGE CONTINUING THROUGH 24 NOVEMBER. Next disclosed that a third-party online supplier suffered a cyber incident in which an unauthorised party gained access to some data relating to Next. Next's position is that its own systems were not compromised, that current evidence indicates no customer personal data was compromised, and that the affected information is benign and cannot be used to facilitate fraud against customers or the company. The supplier has not been named and the data has not been described. Next is working with the supplier, law enforcement and regulatory authorities. The share price dipped on the news and recovered the same day to trade slightly up. This is a well-handled disclosure - prompt, specific about what is and is not known, and clear about the limits of current evidence - and it should be read as the benchmark rather than as a failure.\n\nASOS, DISCLOSED OCTOBER, INVESTIGATION CONCLUDED EARLY NOVEMBER. ASOS told the London Stock Exchange that a third-party platform used for customer communication was compromised, and that users consequently received unauthorised push notifications - one of which read as a ransom demand claiming the attackers had fully compromised a Snowflake instance and threatening to leak it. Snowflake has stated that its own systems were not breached. ASOS's conclusion was that basic customer data including names and contact details was accessed, and that payment card information and account passwords were not. BBC reporting, relayed via TechCrunch, indicates the exposed data may also include home addresses, telephone numbers, email addresses and notes in customer profiles including website search queries - that broader list is NOT confirmed by ASOS and should not be treated as established. The actor self-identifies as Xuanye Group. The NCSC advised ASOS customers to assume they were affected even if they received no notification, which is the right default and worth borrowing as a communications pattern. One account links the compromised platform to a marketing product running on Snowflake Cortex AI; that is single-source and unconfirmed. Accounts also differ on whether the entry was a vendor compromise or an employee account, and that is unresolved.\n\nAND RANK 2 OF THIS REPORT IS THE SAME SHAPE. The Optimizely compromise reached at least 178 organisations through attacker-controlled JavaScript served from the vendor's own CDN. Nobody's own estate was breached. The script was authorised, allowlisted, served over TLS from the expected host.\n\nLEAK-SITE AND TRACKER ACTIVITY, WITH THE APPROPRIATE SCEPTICISM. UK names appearing on leak sites and breach trackers this month include Bensons for Beds Retail, listed by N0n on 17 November; Audio Note UK Ltd, listed by Osiris on 11 November; Fittleworth, a UK healthcare company providing home delivery of medical supplies, recorded with a discovery date of 20 November; and Simply UK, Ion Asset Architecture and William Cook. Gnosis Pay, a London payments firm, reported a breach on 3 November. N0n claimed three further anonymised UK entries on 23 November, and the BYOD group posted its most recent victim on 24 November with the country not visible in available sources. Ransomware.live's running UK total stands at 1,209 victims. The Fittleworth listing is the one to watch from a UK government perspective: medical supply home delivery sits in the NHS supply chain and holds patient-identifiable data by necessity.\n\nTHE CAVEATS ARE NOT DECORATIVE. Every leak-site item above is attacker self-reporting and none of the named organisations has confirmed an incident in the sources reviewed. Bitdefender has documented N0n inflating its victim count by roughly a factor of five, and tracker totals vary by around seventy victims depending on collection method. RedPacket Security has specifically warned that listings attributed to Aurora have included unverified or fabricated victim claims. Treat these as leads for supplier enquiry, not as facts about those companies.\n\nTHE FINDING. Across every confirmed UK retail and consumer disclosure this month, the compromise was at a third party and not at the named brand. Next: a supplier. ASOS: a communications platform. Optimizely: a vendor's CDN. N-able Mail Assure at rank 3: a vendor's hosted platform, reaching UK organisations through MSPs. That is four for four. No amount of hardening inside your own perimeter addresses any of them. The controls that do are an inventory of which third parties can reach your data or execute code in your users' browsers, contractual notification obligations with hours attached, and the ability to answer 'what would we lose if this vendor were compromised' before rather than after. And that is the same inventory the Cyber Security and Resilience Bill's vendor-direction powers at rank 10 will require of regulated bodies - which makes building it now the one action in this report that satisfies both an immediate risk and a known future obligation.","recommended_actions":["Build the third-party inventory that four out of four incidents this month point at: every vendor that holds your customer data, that can send messages to your customers in your name, or that executes JavaScript in your users' browsers. Most organisations have the first list, few have the second, and almost none have the third - which is the one that produced rank 2 of this report.","For each third party on that list, answer in writing what you would lose if it were compromised, and do it before the incident. The question is unanswerable in the first forty-eight hours of a real event, which is exactly when it gets asked.","Review your contractual notification obligations with suppliers and attach hours to them. Next learned of its supplier's incident in time to disclose promptly; that is the outcome the contract should guarantee rather than something to hope for.","Borrow the NCSC's communications pattern from the ASOS incident: advise customers to assume they were affected even if they received no notification. It is the honest default when a third-party platform's logs cannot establish which individuals were reached, and it avoids the position of having to broaden the statement later.","Ask your marketing and digital teams directly which third-party scripts run on your public web properties, and specifically which run on authentication and payment pages. Do not ask IT - these products are procured by marketing, which is precisely why they are absent from the asset register.","Treat the Fittleworth listing as a supply-chain enquiry if you are an NHS body. Medical supply home delivery holds patient-identifiable data by necessity and sits in the NHS supply chain. The listing is unconfirmed attacker self-reporting, which makes it a reason to ask, not a reason to conclude.","Do not act on leak-site listings as established fact about any named company. Bitdefender has documented N0n inflating victim counts roughly fivefold, tracker totals vary by about seventy victims by collection method, and RedPacket Security warns that Aurora-attributed listings have included fabricated claims. Use them to open a conversation with a supplier, not to make a determination.","Specifically do not repeat the broader ASOS data list as established. ASOS confirmed names and contact details. The additional items - home addresses, telephone numbers, email addresses and profile notes including search queries - come from BBC reporting and are not confirmed by ASOS. Mixing them produces a statement you may have to retract.","Add a question to your supplier assurance process that none of these incidents would have survived: can you tell us not only when your systems were accessed, but what was taken or captured? Optimizely's honest answer - that it can see when the injected code loaded but not what it captured - is the answer most vendors would have to give and almost none volunteer.","Start the third-party criticality inventory now rather than after the Cyber Security and Resilience Bill completes its passage. The vendor-direction powers in clauses 44 to 47 are already settled, most UK public bodies cannot currently state which suppliers sit in their critical path, and this is the one action in this report that addresses both a present risk and a known future obligation."],"references":["https://live.euronext.com/en/financial-news/uks-next-flags-cyber-breach-online-supplier-says-no-customer-data-compromised","https://www.bloomberg.com/news/articles/2026-11-23/next-supplier-hit-by-cyberattack-in-latest-uk-retail-breach","https://www.claimsjournal.com/news/national/2026/11/24/341510.htm","https://hackread.com/uk-retailer-next-cyber-incident-online-supplier/","https://www.ibtimes.co.uk/next-supplier-cyber-incident-no-customer-data-compromised-1834448","https://www.securityweek.com/asos-confirms-cyberattack-data-breach/","https://finance.yahoo.com/technology/articles/asos-confirms-breach-customer-data-150115828.html","https://cyber.thomasmurray.com/insights/asos-breach-when-customer-messaging-platform-becomes-attack-surface","https://www.ransomware.live/map/GB","https://www.breachsense.com/ransomware-groups/n0n/","https://socradar.io/data-breach/audio-note-uk-osiris-ransomware-2026/","https://cybermagazine.com/news/next-data-breach-shows-why-supplier-security-matters"],"kql":[{"platform":"defender_xdr","table":"CloudAppEvents","name":"Third-party OAuth applications and service principals with access to your data","description":"Produces the inventory that four out of four incidents this month point at. Every entry is a vendor that can reach your data without compromising your perimeter, and the ones nobody recognises are the finding.","query":"CloudAppEvents\n| where Timestamp > ago(90d)\n| where ActionType has_any (\"Consent to application\", \"Add service principal\", \"Add app role assignment\", \"Add OAuth2PermissionGrant\", \"Update application\")\n| extend App = tostring(RawEventData.Target[0].ID), Actor = tostring(RawEventData.UserId)\n| project Timestamp, Application, ActionType, Actor, App, IPAddress, ObjectName, RawEventData\n| order by Timestamp desc"},{"platform":"sentinel","table":"SigninLogs","name":"Supplier, partner and MSP identities authenticating into your tenant","description":"The access path that supplier compromise actually uses. Review the list for accounts belonging to engagements that have ended, which are the ones nobody will notice being used.","query":"SigninLogs\n| where TimeGenerated > ago(90d)\n| where UserType == \"Guest\" or UserPrincipalName has_any (\"#EXT#\", \"supplier\", \"partner\", \"vendor\", \"msp\", \"contractor\", \"consult\")\n| summarize Signins = count(), Successes = countif(ResultType == 0), Apps = make_set(AppDisplayName, 20), IPs = make_set(IPAddress, 20), Countries = make_set(Location, 10), LastSeen = max(TimeGenerated) by UserPrincipalName\n| order by Signins desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Supplier-breach-themed phishing and brand impersonation against your users","description":"The predictable second wave. A public supplier-breach disclosure is immediately reused as a pretext, and the ASOS incident shows the pattern already includes messages that appear to come from the brand's own channels.","query":"EmailEvents\n| where Timestamp > datetime(2026-11-01)\n| where Subject has_any (\"data breach\", \"security incident\", \"your account\", \"unauthorised access\", \"unauthorized access\", \"supplier\", \"reset your password\", \"verify your account\")\n   or SenderFromDomain has_any (\"next\", \"asos\", \"optimizely\")\n| where EmailDirection == \"Inbound\"\n| summarize Messages = count(), Recipients = dcount(RecipientEmailAddress), Subjects = make_set(Subject, 20), Verdicts = make_set(DeliveryAction, 5) by SenderFromDomain, SenderMailFromDomain\n| order by Messages desc"},{"platform":"defender_xdr","table":"EmailUrlInfo","name":"Lookalike domains in inbound mail targeting affected brands","description":"Complements the subject-based query. Credential harvesting after a consumer breach runs through lookalike domains, and staff who are also customers are targeted on corporate mail.","query":"let Brands = dynamic([\"next\", \"asos\", \"optimizely\", \"bensons\", \"fittleworth\", \"gnosis\"]);\nEmailUrlInfo\n| where Timestamp > datetime(2026-11-01)\n| where UrlDomain has_any (Brands)\n| where not(UrlDomain in~ (\"next.co.uk\", \"www.next.co.uk\", \"asos.com\", \"www.asos.com\", \"optimizely.com\", \"cdn.optimizely.com\"))\n| summarize Messages = dcount(NetworkMessageId), Urls = make_set(Url, 20), FirstSeen = min(Timestamp) by UrlDomain\n| order by Messages desc"},{"platform":"defender_xdr","table":"CloudAppEvents","name":"Bulk data egress to third-party platforms","description":"Looks for the shape of a supplier integration pulling more than it should. Useful before an incident, because it tells you which third parties actually move volume rather than which ones your contracts say do.","query":"CloudAppEvents\n| where Timestamp > ago(60d)\n| where ActionType has_any (\"FileDownloaded\", \"FileSyncDownloadedFull\", \"Export\", \"BulkDownload\", \"MailItemsAccessed\")\n| summarize Operations = count(), Objects = dcount(ObjectName), Users = dcount(AccountDisplayName) by Application, IPAddress, bin(Timestamp, 1d)\n| where Objects >= 100\n| order by Objects desc"}],"iocs":[{"type":"note","value":"Next plc, 23 November 2026: third-party online supplier compromised; unauthorised access to some data relating to Next; Next states its own systems were not compromised and current evidence indicates no customer personal data was compromised; supplier not named and data not described","context":"The best-handled disclosure in this entry - prompt, specific about the limits of current evidence. Read as a benchmark rather than as a failure.","confidence":"high","source":"Next plc statement via multiple secondary reports"},{"type":"note","value":"ASOS, disclosed October 2026, investigation concluded around 5 November: third-party customer communication platform compromised; unauthorised push notifications sent to users; ASOS confirmed names and contact details accessed, and that payment card data and account passwords were not","context":"The confirmed scope. Use only this list in any statement you make.","confidence":"high","source":"ASOS statement to the London Stock Exchange via multiple secondary reports"},{"type":"note","value":"NOT CONFIRMED BY ASOS: BBC reporting relayed via TechCrunch indicates the exposed data may also include home addresses, telephone numbers, email addresses and notes in customer profiles including website search queries","context":"Explicitly separated from the confirmed list. Mixing the two produces a statement you may have to retract.","confidence":"low","source":"BBC via TechCrunch - not confirmed by ASOS"},{"type":"malware","value":"Xuanye Group","context":"The actor self-identification in the ASOS incident. The group has not stated how much data it holds. Attribution is from the attacker's own messages, which is the weakest form available.","confidence":"low","source":"Secondary reporting"},{"type":"ttp","value":"Ransom message delivered through a brand's own customer push notification channel, claiming full compromise of a Snowflake instance","context":"The delivery method is the notable part: the extortion arrived through the victim brand's trusted channel to its own customers. Snowflake has stated its own systems were not breached.","confidence":"high","source":"ASOS statement and multiple secondary reports"},{"type":"note","value":"UK names on leak sites and breach trackers this month: Bensons for Beds Retail (N0n, 17 November), Audio Note UK Ltd (Osiris, 11 November), Fittleworth (healthcare home delivery, discovery date 20 November), Simply UK, Ion Asset Architecture, William Cook; Gnosis Pay (London payments) reported 3 November","context":"Leads for supplier enquiry, not facts. None of the named organisations has confirmed an incident in the sources reviewed.","confidence":"low","source":"ransomware.live, Breachsense, SOCRadar and breach trackers - attacker self-reporting"},{"type":"note","value":"Fittleworth, a UK healthcare company providing home delivery of medical supplies, recorded with a discovery date of 20 November 2026","context":"The listing most relevant to UK government. Medical supply home delivery sits in the NHS supply chain and holds patient-identifiable data by necessity. Unconfirmed - a reason to ask, not to conclude.","confidence":"low","source":"ransomware.live via secondary reporting"},{"type":"note","value":"N0n claimed three further anonymised UK entries on 23 November 2026; BYOD posted its most recent victim on 24 November 2026 with country not visible in available sources; ransomware.live UK running total 1,209 victims","context":"Window activity. Anonymised listings cannot be acted on, and are recorded only to show the tempo.","confidence":"low","source":"ransomware.live and Breachsense"},{"type":"note","value":"Bitdefender has documented N0n inflating its victim count by roughly a factor of five, and tracker totals vary by around seventy victims depending on collection method","context":"Why leak-site counts must not be used as a metric. The inflation is documented, not suspected.","confidence":"medium","source":"Bitdefender via secondary reporting"},{"type":"note","value":"RedPacket Security warns that listings attributed to Aurora have included unverified or fabricated victim claims","context":"A specific, named caution against treating one group's listings as evidence. Applies to any Aurora-attributed UK name.","confidence":"medium","source":"RedPacket Security via secondary reporting"},{"type":"note","value":"THE PATTERN: in every confirmed UK retail and consumer disclosure this month the compromise was at a third party, not at the named brand - Next (a supplier), ASOS (a communications platform), Optimizely (a vendor CDN, rank 2), N-able Mail Assure (a vendor platform reaching UK organisations via MSPs, rank 3). Four for four.","context":"The finding of this entry. No amount of hardening inside your own perimeter addresses any of them; the controls that do are supplier inventory, contractual notification and pre-incident impact assessment.","confidence":"high","source":"Analyst assessment"},{"type":"note","value":"NCSC advised ASOS customers to assume they were affected even if they received no notification","context":"The right default when a third-party platform's logs cannot establish which individuals were reached, and a communications pattern worth borrowing. It also avoids having to broaden a statement later.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"Accounts CONFLICT on the ASOS entry vector: some describe a vendor platform compromise, one describes access through an employee account, and one single source links the platform to a marketing product running on Snowflake Cortex AI","context":"Unresolved. Do not state an entry vector for the ASOS incident in internal reporting.","confidence":"low","source":"Conflicting secondary reports"},{"type":"behaviour","value":"Guest, partner or MSP identities authenticating into your tenant for engagements that have ended","context":"The access path supplier compromise actually uses, and the one least likely to be noticed. Reviewing it is cheap and does not depend on any of the incidents above.","confidence":"medium","source":"Analyst assessment"},{"type":"behaviour","value":"Inbound mail using supplier-breach pretexts or lookalike domains for affected brands","context":"The predictable second wave after a public consumer breach. Staff who are also customers are targeted on corporate mail.","confidence":"medium","source":"Analyst assessment"}]},{"rank":10,"id":"TI-2026-11-25-010","title":"UK GOVERNANCE AND THE EXPIRED-DEADLINE BOARD: The Commons Reportedly Disagreed With Both Lords Amendments to the Cyber Security and Resilience Bill Yesterday, Sending It Back to the Lords With No Royal Assent and a Carry-Over to April 2027 - and One Month On, Nobody Has Published Whether the 32 UK Government Services Taken Offline for the PHP Flaw Are Back","cve_ids":[],"vendor":"UK Government / UK Parliament","affected_products":["UK organisations in scope of the Network and Information Systems regime","UK public bodies and their third-party suppliers","Managed service providers supplying UK essential and digital services","UK government digital services affected by the October 2026 PHP vulnerability"],"category":"incident","cvss_v3":null,"severity":"informational","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-24","last_updated":"2026-11-25","confidence":"low","summary":"Two governance items, one legislative and one that is a month old and has gone quiet, plus the board of expired deadlines this report is now carrying.\n\nTHE CYBER SECURITY AND RESILIENCE BILL. The Commons was due to consider the Lords amendments on 24 November 2026. A single non-official source - a Bill-tracking website - records that the Commons disagreed with both Lords defeats: the register of foreign powers by 260 votes to 98, and the NIS review amendment without a division. If that is accurate, the Bill returns to the Lords and ping-pong continues. Royal Assent has NOT been given. The Commons has agreed a carry-over motion giving the Bill until the end of 29 April 2027 to complete its remaining stages and receive Royal Assent, which means there is no near-term commencement date to plan against.\n\nTHE EVIDENCE CAVEAT MATTERS HERE MORE THAN USUAL, SO IT IS STATED FIRST. The report of yesterday's outcome rests on ONE non-official website, and that site's own page metadata is internally inconsistent with a 24 November event. No Hansard record and no parliament.uk Bill page could be read in this run. Do not brief the vote figures. Verify against Commons Hansard or the Bill's parliament.uk page before stating any outcome, and if your organisation has a parliamentary affairs function, this is a five-minute question for them.\n\nTHE TWO DISPUTED AMENDMENTS, AND WHY THEY MATTER DIFFERENTLY. The Lords added a register of foreign powers, at clause 67, which would require the Secretary of State to establish, within six months of Royal Assent, a register of foreign powers presenting a risk to UK critical systems. For a UK public body this is the amendment with operational consequences: a statutory register of risk-presenting foreign powers would feed directly into procurement decisions and supplier risk assessments, and its absence leaves those judgements where they are now, which is with individual organisations making them inconsistently. Amendment 163 would have required the Government to undertake and publish extensive reviews of the NIS regime within a year of Royal Assent - a transparency and accountability provision rather than an operational one.\n\nWHAT IS ALREADY SETTLED, AND WHAT TO DO ABOUT IT. The vendor-direction powers in clauses 44 to 47 are not in dispute and will be in the Act. They allow direction of regulated entities in relation to their suppliers. The practical consequence is already clear and does not depend on the outcome of ping-pong: regulated bodies will need to know which third-party suppliers sit in their critical path. Most UK public bodies cannot currently state that. Build the inventory now. It is the same inventory that rank 9 of this report concludes is the only control that would have addressed four out of four UK retail and consumer incidents this month, which makes it the single action in this report that satisfies both a present risk and a known future legal obligation. Hold the detailed gap analysis until the final text is settled; do not hold the inventory.\n\nTHE PHP OUTAGES, ONE MONTH ON AND UNRESOLVED IN PUBLIC. On 22 October 2026 a technology minister told the House of Lords that 32 UK government services were unavailable and four partially unavailable as a result of critical PHP vulnerabilities, described as largely resulting from precautionary measures taken while security updates and mitigations were applied. The Government declined to publish a list of affected services on the basis that doing so is not standard practice, and stated in Hansard that it was not aware of any compromises in the UK public sector while acknowledging reports of exploitation activity in international scanning. Downing Street's position was that no large public-facing critical services were affected. Oxfordshire County Council and Hillingdon Council were among the councils that took systems offline to patch. More than 50,000 warnings were reported as sent to UK organisations.\n\nNo restoration update has been published in the month since, and none surfaced in this run. That absence is the finding, for two reasons. First, there is currently no public way to know whether those services are restored, whether they were restored by patching or by remaining offline, or whether any were found to be compromised after all. Second, and more usefully, those estates are the same estates that rank 1 of this report concerns. The organisations that could not quickly determine their PHP exposure in October are the organisations that cannot quickly determine today whether their Drupal installer is reachable. If you were one of the 32, the Drupal check at rank 1 is not a new task - it is the same task, on the same servers, with a KEV deadline on Thursday.\n\nTHE EXPIRED-DEADLINE BOARD. Carried forward so that nothing drops off a tracker silently: CVE-2026-123890, vCenter, deadline 23 November, PASSED - hunting open, SAML signing key decision open. CVE-2026-20320, BroadWorks, deadline 24 November, PASSED - three-month-old fix, key rotation outstanding. CVE-2026-124194, Outlook, deadline 24 November, PASSED - fix ships through the Office channel so Windows patch compliance reports green on a vulnerable estate; block outbound SMB on 445 as the compensating control. Cisco Expressway CVE-2026-76466, PASSED. And due in the next 48 hours: CVE-2026-133968 and CVE-2026-134624 tomorrow; CVE-2026-132165, CVE-2026-132224 and CVE-2026-131914 on Thursday. Five deadlines in two days, and none at all today.","recommended_actions":["Verify yesterday's Cyber Security and Resilience Bill outcome against Commons Hansard or the Bill's page on parliament.uk before briefing anyone. The report that the Commons disagreed with both Lords amendments, including the 260 to 98 figure, rests on one non-official website whose own metadata is inconsistent with the date. Do not quote the vote figures.","Build the third-party supplier criticality inventory now, independent of the Bill's progress. The vendor-direction powers in clauses 44 to 47 are settled and will be in the Act, most UK public bodies cannot currently state which suppliers sit in their critical path, and the same inventory is the only control that addresses the four-for-four third-party pattern at rank 9.","Hold the detailed NIS gap analysis until the final text is settled, but do not hold the inventory. Royal Assent has not been given and the carry-over motion runs to 29 April 2027, so there is no commencement date to plan against - which is an argument for doing the durable preparatory work, not for doing nothing.","If you are a UK public body, ask internally whether you were among the 32 services taken offline in October for the PHP vulnerability, and if so, whether they were restored by patching or by remaining offline. There is no public answer, and the distinction determines whether you still have an exposure or merely an outage.","Treat the Drupal check at rank 1 as the same task on the same servers if you were affected by the PHP outages. The organisations that could not quickly determine their PHP exposure in October are the organisations that cannot determine their Drupal installer exposure today, and that one has a KEV deadline on Thursday.","Keep the expired KEV deadlines on your tracker with an explicit overdue status rather than letting them disappear when the date passes. CVE-2026-123890, CVE-2026-20320, CVE-2026-124194 and CVE-2026-76466 are all now overdue, and a silently dropped item is the most common route to invisible overdue remediation.","Fix the Outlook patch reporting gap permanently, not just for CVE-2026-124194. The fix ships through the Office update channel, so WSUS, Intune Windows rings and SCCM report green while every Outlook client stays vulnerable. Block outbound SMB on 445 as the compensating control and then address the reporting defect, because it will recur with the next Office vulnerability.","Plan for five KEV deadlines inside 48 hours and none today. Two expire tomorrow and three on Thursday. Decide today which you will miss and record the decision with a named owner - the ones that get missed are the ones nobody wrote down.","Note for your own threat model that the UK publicly confirmed offensive cyber operations against Russia, China, Iran and North Korea on 23 November. It is a single-source report with no operational detail, but it is a reasonable input to a discussion about retaliation risk for UK public bodies and critical infrastructure operators.","Where you have a parliamentary affairs or public policy function, give them a standing task to report the Bill's ping-pong outcomes rather than relying on threat intelligence collection for legislative status. This report's weakest evidence every week is the parliamentary item, and that is a sourcing problem with an easy internal fix."],"references":["https://cybersecurityandresiliencebill.com/timeline","https://dig.watch/updates/cyber-security-resilience-bill-commons","https://en.wikipedia.org/wiki/Cyber_Security_and_Resilience_Bill","https://hansard.parliament.uk/Lords/2026-10-26/debates/B413EFAE-E7D4-4742-986D-092884E0D8D1/CyberSecurityAndResilience(NetworkAndInformationSystems)Bill","https://hansard.parliament.uk/Lords/2026-10-22/debates/14CB4C6D-4E16-4377-8FCF-C2CF77BB5CC0/CyberSecurityPHPVulnerability","https://www.gazettelive.co.uk/news/uk-world-news/uk-government-takes-32-services-34802549","https://www.dailypost.co.uk/news/north-wales-news/major-php-cybersecurity-flaw-hits-34802310","https://www.itv.com/news/2026-10-22/more-than-30-government-services-offline-amid-global-php-cybersecurity-threat","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://www.byteseu.com/2541309/"],"kql":[{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"Public-facing software inventory for NIS scope and for the PHP question","description":"Serves both governance items at once. Produces the inventory the vendor-direction powers will require, and answers whether PHP and Drupal versions in your estate are the ones that were in scope in October.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has_any (\"php\", \"drupal\", \"apache\", \"nginx\", \"iis\", \"wordpress\", \"tomcat\")\n| summarize Devices = dcount(DeviceId), DeviceList = make_set(DeviceName, 50), Versions = make_set(SoftwareVersion, 20) by SoftwareVendor, SoftwareName\n| order by Devices desc"},{"platform":"sentinel","table":"DeviceTvmSoftwareVulnerabilities","name":"Estate-wide view of the five KEV CVEs due in the next 48 hours","description":"The deadline tracker as a query. Produces the evidence of where each of the five outstanding items is present, and therefore where a missed deadline actually matters.","query":"let KevNext48 = dynamic([\"CVE-2026-133968\", \"CVE-2026-134624\", \"CVE-2026-132165\", \"CVE-2026-132224\", \"CVE-2026-131914\"]);\nlet KevExpired = dynamic([\"CVE-2026-123890\", \"CVE-2026-20320\", \"CVE-2026-124194\", \"CVE-2026-76466\"]);\nDeviceTvmSoftwareVulnerabilities\n| where CveId in (KevNext48) or CveId in (KevExpired)\n| extend Status = iff(CveId in (KevNext48), \"DUE WITHIN 48H\", \"OVERDUE\")\n| summarize Devices = dcount(DeviceId), DeviceList = make_set(DeviceName, 40) by CveId, Status, SoftwareName, VulnerabilitySeverityLevel\n| order by Status asc, Devices desc"},{"platform":"defender_xdr","table":"DeviceTvmSoftwareInventory","name":"Microsoft Outlook build verification - the patch reporting gap","description":"The specific reason CVE-2026-124194's expired deadline is likely unmet: the fix ships through the Office channel, so Windows patch compliance reports green on a vulnerable estate. Check builds, not compliance.","query":"DeviceTvmSoftwareInventory\n| where SoftwareName has_any (\"outlook\", \"office\", \"microsoft 365 apps\")\n| summarize Devices = dcount(DeviceId), Builds = make_set(SoftwareVersion, 30) by SoftwareName, SoftwareVendor\n| order by Devices desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound SMB on 445 - the Outlook compensating control","description":"Verifies that the compensating control for the overdue Outlook CVE is actually in place. CVE-2026-124194 leaks NTLMv2 hashes, so outbound SMB to the internet is the exposure, and this shows whether it is still possible.","query":"DeviceNetworkEvents\n| where Timestamp > ago(30d)\n| where RemotePort == 445\n| where isnotempty(RemoteIP) and not(ipv4_is_private(RemoteIP))\n| summarize Attempts = count(), Destinations = make_set(RemoteIP, 30), Processes = make_set(InitiatingProcessFileName, 15), FirstSeen = min(Timestamp), LastSeen = max(Timestamp) by DeviceName\n| order by Attempts desc"}],"iocs":[{"type":"note","value":"The Commons was due to consider Lords amendments to the Cyber Security and Resilience Bill on 24 November 2026","context":"The scheduled event. Confirmed across sources as scheduled; the outcome is not.","confidence":"medium","source":"UK Parliament publications via secondary reporting"},{"type":"note","value":"SINGLE-SOURCE AND UNVERIFIED: one non-official Bill-tracking website records that the Commons disagreed with both Lords defeats - the register of foreign powers by 260 votes to 98, and the NIS review amendment without a division - sending the Bill back to the Lords. That site's own page metadata is inconsistent with a 24 November event.","context":"The weakest-evidenced claim in this entire report, labelled as such. Do not brief the vote figures. Verify against Commons Hansard or the Bill's parliament.uk page.","confidence":"low","source":"Single non-official website - metadata internally inconsistent"},{"type":"note","value":"Royal Assent has NOT been given. A carry-over motion gives the Bill until the end of 29 April 2027 to complete its remaining stages and receive Royal Assent.","context":"There is no near-term commencement date to plan against. This is an argument for durable preparatory work, not for inaction.","confidence":"medium","source":"UK Parliament publications via secondary reporting"},{"type":"note","value":"Lords amendment, clause 67: a register of foreign powers presenting a risk to UK critical systems, to be established within six months of Royal Assent","context":"The amendment with operational consequences for UK public bodies. A statutory register would feed procurement and supplier risk assessment; without it those judgements stay with individual organisations, made inconsistently.","confidence":"medium","source":"Secondary reporting of Lords proceedings"},{"type":"note","value":"Lords amendment 163: would require the Government to undertake and publish extensive reviews of the NIS regime within a year of Royal Assent","context":"A transparency and accountability provision rather than an operational one. Lower practical impact than clause 67 for most organisations.","confidence":"medium","source":"Secondary reporting of Lords proceedings"},{"type":"note","value":"SETTLED AND NOT IN DISPUTE: the vendor-direction powers in clauses 44 to 47 will be in the Act","context":"The part to act on now. Regulated bodies will need to know which third-party suppliers sit in their critical path, and most UK public bodies currently cannot state that.","confidence":"medium","source":"Secondary reporting of Bill proceedings and prior runs of this feed"},{"type":"note","value":"PHP outages, 22 October 2026: a technology minister told the Lords that 32 UK government services were unavailable and four partially unavailable, described as largely precautionary while updates and mitigations were applied","context":"The baseline position a month ago. The Government declined to publish a list of affected services on the basis that doing so is not standard practice.","confidence":"high","source":"Hansard via multiple secondary reports"},{"type":"note","value":"NO RESTORATION UPDATE has been published in the month since, and none surfaced in this run","context":"The finding. There is no public way to know whether those services are restored, whether restoration came from patching or from staying offline, or whether any were later found to be compromised.","confidence":"high","source":"Analyst assessment across reviewed sources"},{"type":"note","value":"The Government stated in Hansard that it was not aware of any compromises in the UK public sector, while acknowledging reports of exploitation activity in international scanning; Downing Street stated no large public-facing critical services were affected","context":"The official position as at late October. Note the careful wording: not aware of compromises is not the same as having established that there were none.","confidence":"high","source":"Hansard and Downing Street statements via secondary reporting"},{"type":"note","value":"Oxfordshire County Council and Hillingdon Council were among councils that took systems offline to patch; more than 50,000 warnings were reported as sent to UK organisations","context":"Scope indicators for the October event, and the population most likely to share the Drupal exposure at rank 1.","confidence":"medium","source":"Secondary reporting"},{"type":"note","value":"EXPIRED KEV DEADLINES carried forward: CVE-2026-123890 vCenter (due 2026-11-23), CVE-2026-20320 BroadWorks (due 2026-11-24), CVE-2026-124194 Outlook (due 2026-11-24), CVE-2026-76466 Cisco Expressway","context":"Kept on the board deliberately. An item that silently disappears from a tracker when its date passes is the commonest route to invisible overdue remediation.","confidence":"high","source":"CISA KEV catalogue via secondary reporting"},{"type":"note","value":"CVE-2026-124194 (Outlook): the fix ships through the Office update channel, so WSUS, Intune Windows rings and SCCM report a fully vulnerable estate as green. It leaks NTLMv2 hashes and suppresses the external-content warning.","context":"A reporting defect, not a patching defect, and it will recur with the next Office vulnerability. Block outbound SMB on 445 as the compensating control and fix the reporting gap permanently.","confidence":"high","source":"Prior runs of this feed and secondary reporting"},{"type":"note","value":"FIVE KEV DEADLINES INSIDE 48 HOURS AND NONE TODAY: CVE-2026-133968 and CVE-2026-134624 due 2026-11-26; CVE-2026-132165, CVE-2026-132224 and CVE-2026-131914 due 2026-11-27","context":"The planning fact for this run. Decide today which you will miss and record it with a named owner.","confidence":"high","source":"CISA KEV catalogue via secondary reporting"},{"type":"note","value":"On 23 November 2026 the UK publicly confirmed offensive cyber operations against Russia, China, Iran and North Korea, in comments from the commander of Cyber and Specialist Operations Command reported via Sky News","context":"Single-source, no operational detail. A reasonable input to a retaliation-risk discussion for UK public bodies and critical infrastructure operators, and nothing more.","confidence":"low","source":"Sky News via secondary reporting - single source"},{"type":"note","value":"No Hansard record and no parliament.uk Bill page could be read directly in this run; all parliamentary content is cited from search-surfaced summaries","context":"The standing weakness in this entry every week. If your organisation has a parliamentary affairs function, give them a standing task to report ping-pong outcomes instead.","confidence":"high","source":"Analyst assessment - collection limitation"}]}],"ioc_index":{"account":[{"value":"vsphere.local SSO administrators","related_entry":"TI-2026-11-25-006","related_cves":["CVE-2026-123903","CVE-2026-123905","CVE-2026-123906","CVE-2026-123907","CVE-2026-123910","CVE-2026-123911","CVE-2026-123890"],"confidence":"high"},{"value
