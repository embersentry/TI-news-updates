 is heavy, so the 23 November deadline will not be met by most and the compensating control - restricting network reachability - matters more than the patch date.\n\nConfidence and caveats. Confidence is high on the 20 November KEV addition of all four, the 23 November deadline, the Apache Roller mechanism and affected range, the fact that disabling XML-RPC is not a mitigation, and the Cisco Expressway hard-coded-cookie mechanism and TCP 4372 port - these are corroborated across The Hacker News, securityonline.info, SOC Prime, Corgea, Phoenix Security, OpenCVE and the KEV catalogue listing surfaced via an aggregated feed. CISA's own catalogue pages could not be fetched in this run. Sources disagree on the Roller fixed version (6.1.5 versus 6.1.6 versus 6.1.7) and at least one source states CVE-2026-129448 is not in KEV, which is contradicted by the 20 November listing. The Cisco exploitation report involving four gateways at a Russian organisation is single-source and unverified. The SAP NetWeaver details are secondary-source only.","recommended_actions":["Apache Roller: upgrade to 6.1.6 or later. Do NOT rely on disabling XML-RPC in the admin interface - affected versions deserialise the request before checking whether the feature is enabled, so that control does nothing.","Apache Roller, if you cannot upgrade today: set enabledForExtensions to false in WEB-INF/web.xml, or remove the /roller-services/xmlrpc servlet mapping, then restart Roller. Block POST requests to /roller-services/xmlrpc at the reverse proxy or WAF as well, and leave the block in place after patching.","Apache Roller: specifically re-check any host you patched in September against CVE-2026-82384. That release line fixed 6.1.5 only; the same bug is now CVE-2026-129448 and is confirmed exploited. A closed September ticket is not evidence of safety here, and an identifier-matching scanner will not tell you otherwise.","Apache Roller: hunt retrospectively for POSTs to /roller-services/xmlrpc containing ex:serializable, and for any process spawned by the Roller servlet container. Exploitation is confirmed, so the correct assumption for an internet-facing instance is that it was attempted.","Cisco Expressway: upgrade clustered deployments to X15.5.20. There is no workaround. Then plan the second hop to 15.5.21 or later, because reporting indicates X15.5.20 does not close PHP2Shell.","Cisco Expressway, as the immediate compensating control: block TCP 4372 at the network boundary and restrict it to the cluster peers only. The hard-coded Erlang cookie is identical on every install, so reachability of that port is the whole exposure.","Cisco Expressway: hunt for unexpected root-level command execution and for Erlang distribution connections from non-peer addresses, and verify the cluster peer list against your own records.","SAP NetWeaver: apply SAP Note 3660969 and verify the note against the SAP Security Patch Day listing rather than against press coverage, which is thin on this one. Note the 2025 identifier - this has been exploitable for longer than the KEV date suggests.","SAP NetWeaver, where the change window is weeks away: restrict network reachability of the affected NetWeaver interfaces to known application and integration sources as the interim control, and record the risk acceptance with a date.","Treat 23 November as the planning date for all four, including vCenter at rank 1. UK bodies are not bound by BOD 26-04, but a three-day CISA deadline is a reasonable proxy for confidence in the exploitation evidence."],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Apache Roller XML-RPC deserialization attempts - CVE-2026-129448","description":"Primary detection. Any POST to /roller-services/xmlrpc from an untrusted source is suspicious; one carrying ex:serializable is an exploitation attempt. Substitute your reverse-proxy or Apache access-log table as appropriate.","query":"let lookback = 90d;\nW3CIISLog\n| where TimeGenerated > ago(lookback)\n| where csUriStem has \"/roller-services/xmlrpc\"\n| extend Suspicious = iff(csUriQuery has_any (\"serializable\", \"ex:serializable\") or csMethod == \"POST\", true, false)\n| project TimeGenerated, cIP, csMethod, csUriStem, csUriQuery, scStatus, csUserAgent, Suspicious\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"Syslog","name":"Process execution spawned by the Roller servlet container","description":"Deserialization RCE manifests as the Java process spawning a shell. Any child process of the Roller/Tomcat user is an incident on a blog platform.","query":"let lookback = 90d;\nSyslog\n| where TimeGenerated > ago(lookback)\n| where SyslogMessage has_any (\"tomcat\", \"roller\", \"catalina\")\n| where SyslogMessage has_any (\"/bin/sh\", \"/bin/bash\", \"curl \", \"wget \", \"python\", \"perl\", \"nc \", \"base64 -d\", \"chmod +x\")\n| project TimeGenerated, Computer, Facility, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Cisco Expressway Erlang cluster port 4372 reachable from non-peer addresses","description":"The entire exposure for CVE-2026-76466 is reachability of TCP 4372, because the Erlang cookie is compiled into the software. Replace the peer list with your own cluster members.","query":"let lookback = 90d;\nlet clusterPeers = dynamic([\"10.0.0.0\", \"10.0.0.1\"]);  // replace with your Expressway cluster peer addresses\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where DestinationPort == 4372\n| where SourceIP !in (clusterPeers)\n| summarize Attempts = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Targets = make_set(DestinationIP, 10)\n    by SourceIP\n| order by Attempts desc"},{"platform":"sentinel","table":"Syslog","name":"Root command execution on Cisco Expressway nodes","description":"Successful exploitation yields OS command execution as root via the cluster database service. Hunt for root-level activity not tied to an approved maintenance window.","query":"let lookback = 90d;\nSyslog\n| where TimeGenerated > ago(lookback)\n| where Computer has_any (\"expressway\", \"vcs\", \"expwy\")\n| where SyslogMessage has_any (\"root\", \"sudo\", \"su -\", \"erl_child_setup\", \"beam.smp\")\n| where SyslogMessage has_any (\"/bin/sh\", \"/bin/bash\", \"curl\", \"wget\", \"useradd\", \"ssh-keygen\", \"authorized_keys\", \"crontab\")\n| project TimeGenerated, Computer, Facility, SeverityLevel, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"SAP NetWeaver query-logic injection indicators - CVE-2025-42884","description":"Hunting starting point only; the public detail on this CVE is thin. Surfaces anomalous request patterns against NetWeaver application paths. Tune against your own integration sources.","query":"let lookback = 90d;\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where DestinationPort in (8000, 8001, 44300, 50000, 50001)\n| where RequestURL has_any (\"/sap/bc/\", \"/sap/public/\", \"/irj/\", \"/webdynpro/\")\n| where RequestURL has_any (\"'\", \"--\", \"%27\", \"UNION\", \"union\", \"SELECT\", \"select \", \"..%2f\")\n| project TimeGenerated, SourceIP, DestinationIP, DestinationPort, RequestURL, RequestMethod, DeviceAction\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound egress from collaboration and blog platform hosts","description":"Post-exploitation callback detection across all three products in this bundle. Expressway, Roller and NetWeaver hosts should have narrow, known egress.","query":"let lookback = 90d;\nDeviceNetworkEvents\n| where Timestamp > ago(lookback)\n| where DeviceName has_any (\"expressway\", \"vcs\", \"roller\", \"netweaver\", \"sapnw\")\n| where ActionType == \"ConnectionSuccess\" and RemoteIPType == \"Public\"\n| summarize Connections = count(), Ports = make_set(RemotePort, 10), LastSeen = max(Timestamp) by DeviceName, RemoteIP\n| order by Connections desc"}],"iocs":[{"type":"uri_path","value":"/roller-services/xmlrpc","context":"Apache Roller XML-RPC endpoint. An unauthenticated POST here carrying a serialized Java object is the CVE-2026-129448 exploitation path. Block it at the proxy and keep the block after patching.","confidence":"high","source":"Apache advisory via secondary coverage"},{"type":"behaviour","value":"ex:serializable element in an XML-RPC request body","context":"The serialized Java object carrier for CVE-2026-129448. Deserialised before any authentication or feature check.","confidence":"high","source":"Apache advisory via secondary coverage"},{"type":"behaviour","value":"disabling XML-RPC in the Roller admin UI does not mitigate CVE-2026-129448","context":"Affected versions deserialise the request before checking the feature flag. An organisation that 'mitigated' this way is still exposed. This is the most likely false-assurance in this report.","confidence":"high","source":"Apache advisory via secondary coverage"},{"type":"port","value":"4372/tcp","context":"Cisco Expressway cluster database service (Erlang distribution). Reachability of this port is the entire exposure for CVE-2026-76466 because the authentication cookie is compiled into the software.","confidence":"high","source":"Secondary analyses of cisco-sa-vcs-static-cred-hr7EWZ8t"},{"type":"account","value":"wombat@","context":"Reported hard-coded maintenance node identity added to the allowed-node set in Cisco Expressway's cm_server, with a matching hard-coded Erlang cookie installed at the same time. Identical across every installation.","confidence":"medium","source":"Secondary technical analysis"},{"type":"service_name","value":"cm_server (Cisco Expressway cluster database service)","context":"The component carrying the hard-coded credential. Runs on Erlang.","confidence":"medium","source":"Secondary technical analysis"},{"type":"ttp","value":"unauthenticated root OS command execution on clustered Expressway devices","context":"Impact of CVE-2026-76466. Cisco lists no workaround; upgrade to X15.5.20 is the only supported fix.","confidence":"high","source":"Cisco advisory via secondary coverage"},{"type":"note","value":"CVE-2026-129448 is the same underlying bug as CVE-2026-82384, which was patched in September for Roller 6.1.5 only. Hosts remediated in September against the old identifier may still be exposed, and an identifier-matching scanner will agree with the September record. Fourth incomplete-fix or reissued-identifier case in this feed in three weeks.","context":"Provenance and governance statement, not an indicator.","confidence":"high","source":"Corgea / Phoenix Security / The Hacker News via search summaries"},{"type":"note","value":"Reporting indicates Cisco Expressway X15.5.20 resolves CVE-2026-76466 but does not close PHP2Shell; plan a further upgrade to 15.5.21 or later rather than closing the ticket at X15.5.20.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"heise via secondary coverage"},{"type":"note","value":"Sources conflict on the Apache Roller fixed version (6.1.5 vs 6.1.6 vs 6.1.7) and at least one source states CVE-2026-129448 is not in CISA KEV, contradicted by the 20 November catalogue listing. SAP NetWeaver CVE-2025-42884 details are secondary-source only. CISA's catalogue pages could not be fetched in this run.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"},{"type":"note","value":"One report describes an attacker using public exploit code for CVE-2026-76466 to obtain root on four clustered gateways at a Russian organisation. Single-source and unverified.","context":"Investigative lead, not a confirmed indicator.","confidence":"low","source":"secure.com / Ostorlab via search summaries"}],"references":["https://thehackernews.com/2026/11/critical-apache-roller-rce-flaw-under.html","https://securityonline.info/apache-roller-vulnerability-cve-2026-129448/","https://corgea.com/research/cve-2026-129448-82384-apache-roller-xml-rpc-deserialization-exploited-november-2026","https://phoenix.security/apache-roller-xml-rpc-deserialization-cve-2026-129448-rce/","https://socprime.com/blog/cve-2026-129448-critical-apache-roller-rce-flaw-exploited-in-the-wild/","https://securityonline.info/cisa-kev-catalog-vcenter-cisco-expressway/","https://app.opencve.io/cve/CVE-2026-76466","https://blog.ostorlab.co/cisco-expressway-root-rce-cve-2026-76466.html","https://thehackernews.com/2026/11/hackers-exploit-critical-vmware-cisco.html"]},{"rank":4,"id":"TI-2026-11-21-004","title":"UK Government: the NCSC, Defra and Food Standards Agency Refrigeration Operation Is Now Public in Detail - Pen Test Partners Verified and Expanded the Finding, RDM Has Shipped Initial Security Updates While Disputing the Severity, and the NCSC's Advice to Operators Is Patch, Change Default Credentials, Get Off the Internet","cve_ids":[],"vendor":"Resource Data Management (RDM)","affected_products":["Resource Data Management refrigeration controllers (Intuitive / Data Manager family as deployed in commercial refrigeration) - no CVE identifier assigned","Thousands of controllers governing tens of thousands of commercial refrigeration units across the UK, per government and press accounts","Comparable class of weak-credential flaw previously abused against Danfoss refrigeration controllers in Europe","Out of scope of the government programme: convenience retail, wholesale, hospitality, catering, pharmacy and vaccine cold chain, and food manufacturing"],"category":"vulnerability","cvss_v3":null,"severity":"high","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-20","last_updated":"2026-11-21","confidence":"medium","summary":"Yesterday this was a story about a covert government operation. Today it is an actionable advisory, and the actionable parts arrived inside this window: a named independent verifier, vendor patches, and - for the first time - concrete NCSC guidance addressed to the operators who were never in the programme.\n\nWhat is now established. A weak-password flaw in Resource Data Management refrigeration controllers was first uncovered in late October by staff at refrigeration consultancy Omega Solutions. Pen Test Partners subsequently verified and expanded on the findings, with Ken Munro linking it to the same weak-password class previously abused against Danfoss equipment in Europe. The NCSC, Defra and the Food Standards Agency coordinated an industry-wide response over roughly three weeks from late October: industry briefings, direct contact with affected businesses, and a coordinated disconnection and patching programme. Thousands of controllers governing tens of thousands of refrigeration units were taken off the open internet, and staff at some sites reverted to manual temperature monitoring - unplugging network cables and checking fridge temperatures by hand. No supermarket has been named in any reporting.\n\nWhat is new today and changes what you should do. First, independent verification: Pen Test Partners is a named, credible third party, which moves the technical claim out of 'one consultancy reported it and the vendor disagrees' territory. Second, there is now something to install - RDM has released initial security updates and continues to work with the NCSC. 'Initial' is the operative word and is why patch_available is recorded as partial. Third, the NCSC's advice to operators is explicit and simple: apply the vendor's security updates, change default credentials, and keep the devices off the public internet. Fourth, Pen Test Partners assesses that the issue has been largely mitigated for the organisations inside the programme, while smaller businesses operating refrigeration equipment could still be exposed.\n\nThe disagreement, recorded rather than resolved. RDM says it has seen no sign of malicious activity and disputes the severity of the findings. The government judged the risk serious enough to run a three-week national disconnection programme with two departments and the FSA involved. Both positions are recorded because they are both on the record; an operator does not have to resolve them, because the remediation advice is identical under either reading. Changing a default password and taking an industrial controller off the public internet are correct regardless of whose severity assessment is right, and neither costs anything.\n\nWho is still exposed, and why they do not know it. The programme reached the major grocers. It did not reach convenience retail, wholesale, hospitality, catering, pharmacy and vaccine cold chain, or food manufacturing. The structural reason those operators cannot answer the exposure question from their own records is that a refrigeration contractor commissioned the equipment, often with a remote-monitoring connection as a service feature, and the device never entered the IT asset inventory. There is no asset register entry, no change record, and frequently no awareness that the fridge has an IP address at all. This is the same pattern as building management systems, CCTV and door controllers, and it is why the recommended action below is a written question to the contractor plus an external scan of your own address space, rather than a database query.\n\nThe consequence if it is wrong. A refrigeration controller does not hold data worth stealing. It sets temperature, defrost cycles and alarm thresholds, and the loss event is spoiled stock, a food safety incident, and - at scale, across a national grocery estate in the run-up to Christmas - a supply disruption with no data breach anywhere in it. That is precisely the kind of incident the NCSC's own annual review warned about three weeks ago when it assessed AI-assisted attacks on critical national infrastructure as highly likely by 2028, and it is also the cheapest available retaliation against a soft UK target. It is worth reading this entry alongside the UK's public confirmation of offensive cyber operations against Russia, China, Iran and North Korea, reported on 20 November.\n\nConfidence and caveats. Confidence is medium overall because no NCSC, Defra, FSA or RDM primary page was retrieved in this run - all direct fetches failed with DNS errors. Confidence is higher on the facts that recur across every outlet: the late-October discovery, Omega Solutions as discoverer, Pen Test Partners as verifier, the NCSC/Defra/FSA coordination, the three-week timeframe, thousands of controllers and tens of thousands of units, manual temperature monitoring at some sites, RDM shipping initial updates while disputing severity, and the NCSC's three-point advice. There is no CVE identifier. Device counts vary between 'thousands of controllers' and 'tens of thousands of fridges', which are different measures of the same estate and should not be added together. The discovering consultancy's name appears as both 'Omega Solutions' and 'Omega Systems' across outlets. No supermarket is named, and the total number of exposed controllers in the UK or abroad remains unknown.","recommended_actions":["Ask your refrigeration contractor, in writing, whether any controller they have installed or maintain for you is reachable from the internet, and keep the answer. If you are in convenience retail, wholesale, hospitality, catering, pharmacy or vaccine cold chain, or food manufacturing, you were almost certainly not in the government programme.","Do not rely on your IT asset inventory to answer that question. These devices are commissioned by refrigeration contractors and typically never enter the inventory. Scan your own external address space instead, and look for web interfaces and controller banners on non-standard ports.","Apply RDM's security updates. They are described as initial, so track the vendor for follow-on releases rather than closing the ticket after the first one.","Change default credentials on every refrigeration, building management and environmental controller you own, not just the RDM units. The flaw class here is weak or default passwords, and it is not specific to one vendor - the same class was abused against Danfoss equipment in Europe.","Put the controllers behind a VPN or a dedicated management network and remove them from direct internet exposure. The NCSC's advice is explicit on this point and it is the control that survives the next vulnerability in the same device.","Extend the same question to every other contractor-installed connected device on your sites: building management, HVAC, CCTV, door entry, lighting, energy metering, vending. The refrigeration controllers are an instance of a general gap, which is that contractor-commissioned equipment is not in anyone's asset register.","Add a temperature-excursion alerting path that does not depend on the controller itself, and test it. If the controller is the thing under attack, the controller's own alarm is not a reliable witness.","For food businesses: brief your HACCP or food safety lead that a cyber incident is now a credible route to a temperature excursion, and make sure your food safety incident procedure includes a manual monitoring fallback. Staff at some sites in the government programme were checking temperatures by hand.","If you operate critical cold chain - pharmacy, vaccine storage, pathology, clinical samples - treat this as a resilience item at board level rather than an IT ticket, and record whether you have a tested manual fallback."],"kql":[{"platform":"sentinel","table":"CommonSecurityLog","name":"Inbound access to refrigeration and building controller web interfaces","description":"Detects external reach to OT controller management ports. Replace the controller subnet list with your own site OT ranges. This is the detection that matters because exposure, not exploitation, is the finding.","query":"let lookback = 90d;\nlet otSubnets = dynamic([\"10.50.\", \"10.60.\", \"192.168.90.\"]);  // replace with your OT / plant ranges\nlet controllerPorts = dynamic([80, 443, 8080, 8081, 8443, 502, 1911, 4911, 47808]);\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where DestinationPort in (controllerPorts)\n| where DestinationIP has_any (otSubnets)\n| extend External = not(ipv4_is_private(SourceIP))\n| where External\n| summarize Attempts = count(), Ports = make_set(DestinationPort, 10), Devices = dcount(DestinationIP), FirstSeen = min(TimeGenerated)\n    by SourceIP\n| order by Attempts desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Authentication failures then success against OT controllers - weak password abuse","description":"The flaw class is weak or default credentials, so the exploitation signature is a short brute-force followed by a success, not an exploit payload.","query":"let lookback = 90d;\nlet otSubnets = dynamic([\"10.50.\", \"10.60.\", \"192.168.90.\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where DestinationIP has_any (otSubnets)\n| where Activity has_any (\"login\", \"auth\", \"logon\") or DeviceAction has_any (\"deny\", \"blocked\")\n| summarize Failures = countif(DeviceAction has_any (\"deny\", \"blocked\", \"reset\")), Successes = countif(DeviceAction has_any (\"allow\", \"permit\")), Attempts = count()\n    by SourceIP, DestinationIP, bin(TimeGenerated, 1h)\n| where Failures >= 5 and Successes >= 1\n| order by Failures desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"Outbound connections initiated by OT controllers","description":"A refrigeration controller initiating arbitrary outbound traffic is either a vendor remote-monitoring service you should know about, or a problem. Either way you need the list.","query":"let lookback = 90d;\nlet otSubnets = dynamic([\"10.50.\", \"10.60.\", \"192.168.90.\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where SourceIP has_any (otSubnets)\n| where not(ipv4_is_private(DestinationIP))\n| summarize Connections = count(), Ports = make_set(DestinationPort, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)\n    by SourceIP, DestinationIP\n| order by Connections desc"},{"platform":"sentinel","table":"Syslog","name":"Refrigeration setpoint, defrost and alarm threshold changes","description":"The damage mechanism is configuration change, not data theft. Any setpoint or alarm threshold change outside a maintenance window is the event to investigate. Requires controller or BMS log forwarding.","query":"let lookback = 90d;\nSyslog\n| where TimeGenerated > ago(lookback)\n| where SyslogMessage has_any (\"setpoint\", \"set point\", \"defrost\", \"alarm threshold\", \"temperature limit\", \"config change\", \"parameter change\")\n| extend Hour = datetime_part(\"Hour\", TimeGenerated), DayOfWeek = dayofweek(TimeGenerated)\n| where Hour \u003c 7 or Hour > 19 or DayOfWeek in (0d, 6d)\n| project TimeGenerated, Computer, Facility, SyslogMessage\n| order by TimeGenerated desc"}],"iocs":[{"type":"behaviour","value":"internet-reachable refrigeration controller management interface","context":"The exposure itself. The NCSC's advice is to keep these devices off the public internet; most affected operators do not know they have one because a refrigeration contractor commissioned it.","confidence":"high","source":"NCSC guidance via secondary coverage"},{"type":"behaviour","value":"default or weak credentials on commercial refrigeration controllers","context":"The flaw class, attributed by Pen Test Partners' Ken Munro to the same weak-password problem previously abused against Danfoss controllers in Europe. No CVE assigned.","confidence":"high","source":"Pen Test Partners via secondary coverage"},{"type":"ttp","value":"unauthorised change of refrigeration setpoints, defrost cycles or alarm thresholds","context":"The damage mechanism. Produces spoiled stock, a food safety incident and potential supply disruption with no data breach component.","confidence":"medium","source":"Analytic assessment based on controller function"},{"type":"behaviour","value":"contractor-commissioned connected device absent from the IT asset inventory","context":"The structural gap. Applies equally to building management, HVAC, CCTV, door entry and energy metering, which is why the remediation is a written question to the contractor plus an external scan.","confidence":"high","source":"Analytic assessment, consistent with reporting"},{"type":"note","value":"New in this window: Pen Test Partners independently verified and expanded the Omega Solutions finding; RDM has released initial security updates; the NCSC has published explicit operator guidance (apply updates, change default credentials, keep devices off the public internet).","context":"Provenance statement, not an indicator.","confidence":"medium","source":"Multiple outlets, 20-21 November 2026"},{"type":"note","value":"RDM disputes the severity of the findings and reports no evidence of malicious activity. The government ran a three-week national disconnection programme. Both positions are on the record and are recorded here unresolved; the remediation advice is identical under either reading.","context":"Provenance statement, not an indicator.","confidence":"high","source":"RDM statements and government accounts via secondary coverage"},{"type":"note","value":"No CVE identifier exists for this flaw, so vulnerability scanners keyed on CVE identifiers will not report it and a CVE-based remediation record cannot evidence that it is closed.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"},{"type":"note","value":"Device counts vary between 'thousands of controllers' and 'tens of thousands of refrigeration units'. These are different measures of the same estate and should not be combined. The discovering consultancy appears as both 'Omega Solutions' and 'Omega Systems' across outlets. No supermarket has been named. The total number of exposed controllers is unknown.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"},{"type":"note","value":"No NCSC, Defra, FSA or RDM primary page was retrieved in this run; all direct page fetches failed with DNS resolution errors. Verify the vendor update availability and the NCSC guidance wording against primary sources before external communication.","context":"Provenance statement, not an indicator.","confidence":"high","source":"This run"}],"references":["https://www.nacionale.com/en/articles/who-is-rdm-resource-data-management-fridge-controllers-uk-supermarkets-hack-flaw","https://www.gbnews.com/news/uk-supermarkets-launch-secret-cyber-operation-fridges-and-freezers","https://beinsure.com/news/uk-supermarket-refrigeration-cyber-security-operation-prevents-mass-attacks/","https://www.easterneye.biz/uk-supermarket-fridges-food-supply-risk/","https://londonlovestech.com/britain-launches-secret-cyber-operation-to-protect-thousands-of-supermarket-fridges/","https://world-today-journal.com/uk-authorities-disconnect-commercial-refrigeration-units-from-internet/","https://www.ncsc.gov.uk/section/keep-up-to-date/reports-advisories"]},{"rank":5,"id":"TI-2026-11-21-005","title":"N-able Confirmed a Cyberattack Behind the Mail Assure and SpamExperts Outage After Three Days of Blaming 'Platform Configuration' - a Second, Separate Incident Has N-central Hosted Platforms Offline Worldwide and On-Premises Customers Told to Keep Servers Shut Down","cve_ids":[],"vendor":"N-able","affected_products":["N-able Mail Assure - Hosted Cloud, all regions; disruption began 16 November 2026","N-able SpamExperts - Hosted Cloud, all regions; same incident","Affected sub-services: logging, mailbox synchronisation, management portal and quarantine (mail flow and filtering reported as unaffected)","N-able N-central hosted environments - taken offline across the Americas, Europe and Asia-Pacific (separate incident, per N-able)","N-able N-central on-premises - customers instructed to shut servers down and leave them off until N-able advises otherwise","Trigger for the N-central action: public release of 33 unpatched flaws with working exploit code, reported under the name 'Able2Shell'"],"category":"incident","cvss_v3":null,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-16","last_updated":"2026-11-21","confidence":"medium","summary":"This is the UK corporate item with the widest blast radius, because almost nobody affected by it is an N-able customer. They are customers of a managed service provider that is, and the control plane in question manages their endpoints.\n\nIncident one, and the new fact in this window. N-able's Mail Assure and SpamExperts Hosted Cloud services suffered a multi-day disruption across all regions beginning 16 November. For the first two days N-able attributed it to 'a combination of platform configuration and service dependencies'. On 18 November the company confirmed the cause was a cyberattack in which one of its servers was compromised, and SecurityWeek's reporting on 20 November is what brought the confirmation to wider attention. N-able states it has found no evidence that customer data was compromised, and that the intrusion was unrelated to the separate N-central hosted outage. Mail flow and filtering continued; what went offline was logging, mailbox synchronisation, the management portal and quarantine. At least one outlet reports that credentials may have been stolen.\n\nRead the attribution sequence, not just the outcome. A vendor told its customers for two days that a platform-wide outage was a configuration and dependency problem, then said it was an intrusion. That is not necessarily bad faith - early incident attribution is genuinely hard, and 'configuration' is what a compromised server often looks like from the outside. But for a customer it means the first supplier statement in an outage is a hypothesis, not a finding, and your own incident decisions should not be anchored to it. If you stood down an internal investigation on 16 or 17 November because your supplier said it was a configuration issue, reopen it.\n\nWhy quarantine and logging being offline matters more than it sounds. Those are precisely the components you would need in order to investigate a phishing wave during the outage. Mail continued to flow and filter while the ability to review what was quarantined, synchronise mailboxes and read the logs was unavailable. Any organisation whose email security sat behind Mail Assure or SpamExperts between 16 and 20 November has a gap in its email forensic record for that period, and should treat that gap as a known limitation rather than as an absence of events.\n\nIncident two, which is the supply chain problem. Separately, a researcher publicly released 33 unpatched flaws in N-central - the remote monitoring and management tool many MSPs use to run their clients' computers - with working exploit code, reported under the name Able2Shell. N-able declared a critical security incident, took hosted N-central environments offline across the Americas, Europe and Asia-Pacific, and told on-premises customers to shut their servers down and leave them off until advised otherwise. The practical effect for an MSP is that the console used to manage every customer endpoint went dark, and for the MSP's customers it means patching, monitoring and remote support for their estate stopped. This feed recorded on 20 November that N-able had shipped HF3, permanently removing the Legacy API and patching 17 further zero-days; today's sources describe hosted environments still offline and MSPs awaiting a hotfix, and do not agree on the restoration state. The discrepancy is recorded rather than resolved - confirm the current status with your MSP directly, because that is the only authoritative answer for your estate.\n\nWhat a UK organisation should actually do. The useful question is not about N-able. It is: who can reach my endpoints with SYSTEM-level privilege, through what tool, and what happens to my security posture when that tool is switched off? Most UK mid-market and public sector bodies that outsource IT cannot answer that from their own records, and an RMM agent is the highest-privilege software on the estate. Ask the MSP in writing: do you use N-central or Mail Assure; was your instance affected; is it back; what are you doing to validate that agents were not abused while the console was down; and what is our forensic coverage for the outage period. Get the answer in writing because it is also your Article 28 processor assurance record.\n\nConfidence and caveats. Confidence is medium. High on the existence of both incidents, the 16 November start date, the initial configuration explanation, the 18 November cyberattack confirmation, the sub-services affected, N-able's statement of no evidence of customer data compromise, the public release of 33 N-central flaws with exploit code, and the instruction to shut down on-premises servers - these recur across SecurityWeek, BleepingComputer, Cyberpress, Windows Forum and vendor analyses. Low on the credential-theft claim, which appears in only one account. Some vendor blogs cite CVE-2026-125883 for the N-central flaws, but Huntress-sourced material states no CVE identifiers have been assigned - treat that CVE as unverified. The current restoration state of hosted N-central is genuinely unclear and conflicts with this feed's own 20 November entry. A ChannelDive article describing an 'N-able RMM platform breach' refers to a July release and appears to be a separate, older matter.","recommended_actions":["Ask your managed service provider in writing today whether they use N-able N-central or Mail Assure/SpamExperts, whether their instance was affected, whether it is restored, and what they have done to validate that RMM agents on your estate were not abused while the console was offline. Keep the reply - it is also your processor assurance record.","If your email security ran through Mail Assure or SpamExperts between 16 and 20 November, record a known gap in your email forensic coverage for that period. Logging, mailbox synchronisation, management portal and quarantine were offline while mail continued to flow, so an absence of alerts for those days is not evidence of an absence of events.","If you stood down an internal investigation during 16-17 November on the basis that your supplier called it a configuration issue, reopen it. The cause was later confirmed as an intrusion.","Rotate credentials and API tokens used to integrate with Mail Assure/SpamExperts, and any credentials your MSP holds for your tenant. One account reports possible credential theft; rotation is cheap and the claim does not need to be confirmed first.","Inventory every tool that holds SYSTEM-level or equivalent privilege on your endpoints - RMM, patch management, backup agents, remote support - and record who operates it, how it authenticates, and what your monitoring and patching posture is when it is unavailable. This is the durable finding, not the N-able specifics.","Require multi-factor authentication and IP restriction on your MSP's access to your tenant, and audit the MSP's accounts in your directory for privilege they no longer need. An RMM compromise reaches you through those accounts.","Hunt retrospectively for anomalous RMM agent activity on your endpoints over the last 30 days: unexpected script execution, unexpected software deployment, and agent-initiated process creation outside maintenance windows.","Do not treat a vendor hotfix announcement as confirmation that your instance is patched and online. This feed's own 20 November entry recorded HF3 shipping, while today's sources describe hosted environments still offline. Ask your MSP for your instance's state, in writing.","If you are an MSP: assume your N-central console was reachable by anyone who read the public disclosure, and treat validation of agent integrity across every managed estate as the first task after restoration, ahead of resuming routine patching."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"RMM agent spawning scripting engines or remote tooling","description":"Primary detection for abuse of a managed RMM agent. An RMM agent legitimately runs scripts, so tune to your MSP's known maintenance windows and script set rather than alerting on all of it.","query":"let lookback = 45d;\nlet rmmProcesses = dynamic([\"nablermm.exe\", \"ncentral\", \"agent.exe\", \"BASupSrvc.exe\", \"winagent.exe\", \"takecontrol\"]);\nDeviceProcessEvents\n| where Timestamp > ago(lookback)\n| where InitiatingProcessFileName has_any (rmmProcesses)\n| where FileName in~ (\"powershell.exe\", \"pwsh.exe\", \"cmd.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\", \"rundll32.exe\", \"certutil.exe\", \"bitsadmin.exe\")\n| extend Hour = datetime_part(\"Hour\", Timestamp)\n| project Timestamp, Hour, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Encoded or download-and-execute commands via RMM","description":"Narrows the above to the commands that matter: encoded payloads, downloads and execution-policy bypass driven through the management agent.","query":"let lookback = 45d;\nlet rmmProcesses = dynamic([\"nablermm.exe\", \"ncentral\", \"agent.exe\", \"BASupSrvc.exe\", \"winagent.exe\", \"takecontrol\"]);\nDeviceProcessEvents\n| where Timestamp > ago(lookback)\n| where InitiatingProcessFileName has_any (rmmProcesses)\n| where ProcessCommandLine has_any (\"-enc\", \"-EncodedCommand\", \"FromBase64String\", \"DownloadString\", \"Invoke-WebRequest\", \"iwr \", \"curl \", \"-ExecutionPolicy Bypass\", \"-nop -w hidden\")\n| project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, ProcessCommandLine, FolderPath\n| order by Timestamp desc"},{"platform":"sentinel","table":"SigninLogs","name":"Managed service provider account sign-ins from new locations","description":"An RMM compromise reaches you through the MSP's accounts in your tenant. Replace the domain filter with your MSP's identity domain or guest UPN pattern.","query":"let lookback = 45d;\nlet baseline = 90d;\nlet mspPattern = \"msp\";  // replace with your MSP's identity domain fragment or #EXT# guest pattern\nlet known = SigninLogs\n    | where TimeGenerated between (ago(baseline) .. ago(lookback))\n    | where UserPrincipalName has mspPattern\n    | summarize by IPAddress;\nSigninLogs\n| where TimeGenerated > ago(lookback)\n| where UserPrincipalName has mspPattern\n| where IPAddress !in (known)\n| project TimeGenerated, UserPrincipalName, IPAddress, tostring(LocationDetails.countryOrRegion), AppDisplayName, ResultType, ResultDescription\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"AuditLogs","name":"Privilege and application consent changes by external or MSP identities","description":"Detects an MSP identity being used to grant itself or an application additional privilege in your tenant - the escalation step after an RMM compromise.","query":"let lookback = 45d;\nAuditLogs\n| where TimeGenerated > ago(lookback)\n| where OperationName has_any (\"Add member to role\", \"Add app role assignment\", \"Consent to application\", \"Add service principal\", \"Add owner to application\", \"Update application\")\n| extend Actor = tostring(InitiatedBy.user.userPrincipalName)\n| where Actor has_any (\"#EXT#\", \"msp\")  // tune to your MSP identity pattern\n| project TimeGenerated, Actor, OperationName, Result, TargetResources\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"EmailEvents","name":"Email forensic coverage gap check for the Mail Assure outage window","description":"Quantifies your visibility gap. Compare message volumes and verdict coverage during 16-20 November against your baseline; a sharp drop in verdict or quarantine records with steady delivery volume is the gap, not a quiet period.","query":"let outageStart = datetime(2026-11-16);\nlet outageEnd = datetime(2026-11-21);\nEmailEvents\n| where Timestamp > ago(60d)\n| extend InOutage = Timestamp between (outageStart .. outageEnd)\n| summarize Messages = count(), WithThreatType = countif(isnotempty(ThreatTypes)), Quarantined = countif(DeliveryLocation == \"Quarantine\")\n    by bin(Timestamp, 1d), InOutage\n| order by Timestamp asc"}],"iocs":[{"type":"behaviour","value":"supplier outage initially attributed to 'platform configuration and service dependencies', later confirmed as a cyberattack","context":"N-able's Mail Assure/SpamExperts disruption began 16 November with a configuration explanation; the intrusion was confirmed on 18 November. Treat an early supplier attribution as a hypothesis, not a finding.","confidence":"high","source":"N-able statements via SecurityWeek and other outlets"},{"type":"behaviour","value":"email security logging, mailbox synchronisation, management portal and quarantine offline while mail flow and filtering continued","context":"Creates a forensic coverage gap for 16-20 November 2026 for organisations behind Mail Assure or SpamExperts. An absence of alerts in that period is not evidence of an absence of events.","confidence":"high","source":"N-able status reporting via secondary coverage"},{"type":"behaviour","value":"hosted RMM platform taken offline across all regions and on-premises customers instructed to shut servers down","context":"N-central response to the public release of 33 unpatched flaws with working exploit code. The management console for every managed endpoint went dark, stopping patching, monitoring and remote support.","confidence":"high","source":"BleepingComputer / Windows Forum via secondary coverage"},{"type":"malware","value":"Able2Shell","context":"Name used in reporting for the publicly released N-able N-central exploit set - 33 unpatched flaws with working exploit code. Not a vendor designation.","confidence":"medium","source":"Aviatrix / Windows Forum via secondary coverage"},{"type":"ttp","value":"abuse of a legitimate RMM agent for script execution and software deployment on managed endpoints","context":"The expected post-compromise path from a compromised RMM console into a customer estate. The agent holds SYSTEM-level privilege and its activity resembles normal administration.","confidence":"high","source":"Analytic assessment"},{"type":"note","value":"N-able states these are two separate incidents and that no evidence of customer data compromise has been found in the Mail Assure/SpamExperts intrusion.","context":"Provenance statement, not an indicator.","confidence":"high","source":"N-able statements via secondary coverage"},{"type":"note","value":"Credential theft in the Mail Assure/SpamExperts intrusion is reported by a single outlet and is not confirmed by N-able. Rotate anyway - rotation is cheap and does not require the claim to be verified.","context":"Investigative lead, not a confirmed indicator.","confidence":"low","source":"Single secondary outlet"},{"type":"note","value":"Some vendor blogs cite CVE-2026-125883 for the N-central flaws; Huntress-sourced material states no CVE identifiers have been assigned. Treat that identifier as unverified and do not use it as the basis of a remediation record.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"Comparison of vendor blogs against Huntress-cited material"},{"type":"note","value":"Restoration state conflict: this feed's 20 November entry recorded N-able shipping HF3 (removing the Legacy API and patching 17 further zero-days), while sources in this window describe hosted N-central environments still offline with MSPs awaiting a hotfix. Unresolved - confirm your own instance's state with your MSP.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"This run, compared against the 2026-11-20 run"},{"type":"note","value":"A ChannelDive article describing an 'N-able RMM platform breach' refers to a July release date and appears to be a separate, older matter. Do not merge it into this incident.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"This run"}],"references":["https://www.securityweek.com/n-able-blames-service-disruption-on-cyberattack/","https://cyberpress.org/n-able-confirms-cyberattack/","https://www.bleepingcomputer.com/news/security/n-able-takes-cloud-platform-offline-after-30-plus-zero-days-published/","https://windowsforum.com/news/n-able-takes-n-central-offline-after-able2shell-zero-day-disclosure-msps-await-hotfix.451573/","https://aviatrix.ai/threat-research-center/n-able-n-central-offline-33-flaws/","https://aviatrix.ai/threat-research-center/n-able-n-central-zero-day-rce-able2shell-2026/"]},{"rank":6,"id":"TI-2026-11-21-006","title":"UK Government Regulation: the FCA, PRA and Bank of England Cyber Resilience Guidance Consultation (GC26/9 / CP17/26) Is Confirmed as Published on 19 November and Aligned to the NCSC's Cyber Assessment Framework, With a Separate Bank of England Paper on AI and Quantum - Responses Due 26 February 2027","cve_ids":[],"vendor":"Financial Conduct Authority / Prudential Regulation Authority / Bank of England","affected_products":["FCA Guidance Consultation GC26/9 and PRA Consultation Paper CP17/26 - cyber risk and resilience management","In scope: banks, insurers, financial market infrastructures, and FCA-regulated firms subject to the SYSC 15A operational resilience requirements","Out of scope but encouraged to refer to it: credit unions and several other categories","Separate Bank of England publication on AI and quantum effective practices, including the implications of quantum computing for public-key cryptography","Consultation closes 26 February 2027"],"category":"incident","cvss_v3":null,"severity":"informational","exploitation_status":"no_known_exploitation","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-19","last_updated":"2026-11-21","confidence":"high","summary":"Retained from yesterday at a lower rank because the window contains corroboration and correction rather than a new event, and both are worth recording.\n\nThe correction first. This feed carried the publication date as inside the 19-20 November window; the primary date is now confirmed as 19 November 2026, and Computer Weekly's 20 November coverage ('FCA lines up new cyber guidance for UK financial services sector') is secondary reporting of it rather than a fresh announcement. The documents are FCA Guidance Consultation GC26/9 and PRA Consultation Paper CP17/26, issued jointly, with a separate Bank of England publication on AI and quantum effective practices.\n\nWhat it is, stated precisely, because the framing matters for how firms should respond. The regulators are explicit that this does not introduce new rules. It is guidance that, once finalised, they will use when supervising and enforcing compliance with rules that already exist. Firms sometimes read 'no new rules' as 'no action required'. The opposite is closer to the truth: guidance of this kind tells you the standard against which your existing obligations will be judged, which makes it more immediately operative than a new rule subject to an implementation period. The content covers how firms govern, identify, protect against, detect, respond to and recover from cyber risks and incidents.\n\nThe detail with the most practical consequence. The guidance aligns with recognised cyber frameworks, and the NCSC's Cyber Assessment Framework is named among them. That is the item to act on this week, because it means a UK financial services firm can anticipate the supervisory yardstick by self-assessing against the CAF now, before responding to the consultation. It also quietly extends the CAF's reach: a framework built for critical national infrastructure is becoming the reference point for financial services supervision, which is a reasonable expectation for public bodies to apply to their own suppliers too.\n\nScope, which firms will get wrong. In scope: banks, insurers, financial market infrastructures, and FCA-regulated firms subject to the SYSC 15A operational resilience requirements. Credit unions and several other categories are excluded, but are encouraged to refer to the guidance anyway - and an excluded firm that ignores it will still find the guidance shaping what a supervisor considers reasonable under the rules that do apply to it.\n\nWhy now. October 2026 was the second-highest month for cyber incidents reported to the FCA in five years. That figure, alongside the ICO's record Q3 cyber report volumes recorded in this feed on 20 November, is the evidence base the regulators are acting on. It is also a useful sanity check on the rest of this report: the items at ranks 1, 3 and 5 are exactly the kind of third-party and management-plane exposures that drive those numbers.\n\nThe quantum half, which nobody will prioritise and which has the longest lead time. The Bank of England's separate publication on AI and quantum effective practices includes the implications of quantum computing for public-key cryptography. The honest assessment is that no UK firm will act on this in the next quarter, and that the firms which eventually find it painless will be the ones that started their cryptographic inventory - what algorithms, in what systems, with what certificate lifetimes, under whose ownership - in 2026 rather than in 2029. That inventory is also useful immediately for entirely non-quantum reasons, which is the argument for starting it.\n\nConfidence and caveats. Confidence is high on the 19 November publication date, the document references GC26/9 and CP17/26, the joint FCA/PRA/BoE authorship, the 'no new rules' characterisation, the scope including SYSC 15A firms and excluding credit unions, the CAF alignment, the separate AI and quantum publication, the October 2026 incident statistic and the 26 February 2027 response deadline - these are corroborated across the FCA press release listing, the Bank of England news listing, Regulation Tomorrow, beinsure, ITV News, The Paypers and Crowdfund Insider. No primary document text was retrieved in this run; all direct page fetches failed. The named-senior-manager expectation reported in this feed on 20 November remains single-source from one commentator summarising the draft and should be confirmed against Annex 1 before any firm acts on it.","recommended_actions":["Self-assess against the NCSC Cyber Assessment Framework now, and do not wait for the guidance to be finalised. The CAF is named as an aligned framework, which makes it the best available proxy for the supervisory yardstick.","Establish whether you are in scope. If you are an FCA-regulated firm subject to SYSC 15A, a bank, an insurer or a financial market infrastructure, you are. If you are a credit union or otherwise excluded, read it anyway - it will shape what a supervisor considers reasonable under the rules that do apply to you.","Do not read 'no new rules' as 'no action'. Guidance used in supervising and enforcing existing rules is operative immediately once finalised, with no implementation period to plan around.","Map the guidance's six functions - govern, identify, protect, detect, respond, recover - against your current control set and record the gaps with owners and dates. That gap register is also the raw material for your consultation response.","Diarise 26 February 2027 for the response and start now if you intend to argue any point. Consultation responses written in the final fortnight do not change outcomes.","Start a cryptographic inventory in response to the Bank of England's AI and quantum paper: which algorithms, in which systems, with what certificate lifetimes, under whose ownership. It is the long-lead item and it is immediately useful for ordinary certificate and cipher hygiene regardless of quantum timelines.","Feed your own third-party incident experience into the response. The regulators' stated trigger is rising reported incident volume, and this report's ranks 1, 3 and 5 are the management-plane and supplier exposures that generate it.","Public sector bodies outside financial services: use the CAF alignment as your own supplier assurance reference. Asking a supplier for a CAF self-assessment is now a mainstream request rather than an unusual one."],"kql":[{"platform":"sentinel","table":"SecurityIncident","name":"Regulatory incident reporting clock - incidents by severity and age","description":"Supports the respond function and incident reporting obligations. Surfaces open incidents against their age so a reportable event is not discovered after the window has passed.","query":"let lookback = 180d;\nSecurityIncident\n| where TimeGenerated > ago(lookback)\n| summarize arg_max(TimeGenerated, Status, Severity, Title, Owner) by IncidentNumber\n| extend AgeHours = datetime_diff(\"hour\", now(), TimeGenerated)\n| where Status != \"Closed\"\n| project IncidentNumber, Title, Severity, Status, Owner = tostring(Owner), AgeHours\n| order by Severity asc, AgeHours desc"},{"platform":"sentinel","table":"DeviceTvmSoftwareVulnerabilities","name":"Identify function - critical vulnerability exposure by business criticality","description":"Supports the identify and protect functions by quantifying unremediated critical exposure, which is the evidence a supervisor will ask for.","query":"DeviceTvmSoftwareVulnerabilities\n| where VulnerabilitySeverityLevel in (\"Critical\", \"High\")\n| summarize Devices = dcount(DeviceId), CVEs = dcount(CveId), CveList = make_set(CveId, 25) by SoftwareVendor, SoftwareName, VulnerabilitySeverityLevel\n| order by Devices desc"},{"platform":"sentinel","table":"AuditLogs","name":"Govern function - privileged role changes audit trail","description":"Evidence for the govern function: a complete, reviewable record of who was granted privileged access and by whom.","query":"let lookback = 180d;\nAuditLogs\n| where TimeGenerated > ago(lookback)\n| where OperationName has_any (\"Add member to role\", \"Remove member from role\", \"Add eligible member to role\")\n| extend Actor = tostring(InitiatedBy.user.userPrincipalName), Role = tostring(TargetResources[0].displayName)\n| project TimeGenerated, Actor, OperationName, Role, Result\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceInfo","name":"Detect function - endpoint sensor coverage gaps","description":"The coverage question behind rank 1's EDR gap and behind any detect-function assessment: which assets have no working sensor.","query":"DeviceInfo\n| where Timestamp > ago(14d)\n| summarize arg_max(Timestamp, OnboardingStatus, SensorHealthState, OSPlatform, DeviceType) by DeviceName\n| where OnboardingStatus != \"Onboarded\" or SensorHealthState != \"Active\"\n| project DeviceName, OSPlatform, DeviceType, OnboardingStatus, SensorHealthState, LastSeen = Timestamp\n| order by LastSeen asc"}],"iocs":[{"type":"note","value":"FCA GC26/9 and PRA CP17/26 published jointly on 19 November 2026; consultation responses due 26 February 2027.","context":"Regulatory fact, not an indicator. Correction to this feed's earlier framing of the publication date.","confidence":"high","source":"FCA press release listing and Bank of England news listing via search summaries"},{"type":"note","value":"The guidance introduces no new rules; the regulators will use it when supervising and enforcing compliance with existing rules. This makes it operative on finalisation with no implementation period.","context":"Regulatory fact, not an indicator.","confidence":"high","source":"FCA/PRA statements via multiple outlets"},{"type":"note","value":"The guidance aligns with recognised cyber frameworks including the NCSC's Cyber Assessment Framework, making a CAF self-assessment the best available proxy for the supervisory yardstick.","context":"Regulatory fact, not an indicator.","confidence":"high","source":"Regulation Tomorrow / The Paypers via search summaries"},{"type":"note","value":"Scope: banks, insurers, financial market infrastructures and FCA-regulated firms subject to SYSC 15A. Credit unions and several other categories are excluded but encouraged to refer to it.","context":"Regulatory fact, not an indicator.","confidence":"high","source":"Regulation Tomorrow via search summaries"},{"type":"note","value":"Stated trigger: October 2026 was the second-highest month for cyber incidents reported to the FCA in five years.","context":"Regulatory fact, not an indicator.","confidence":"high","source":"FCA press release via multiple outlets"},{"type":"note","value":"A separate Bank of England publication covers AI and quantum effective practices, including the implications of quantum computing for public-key cryptography.","context":"Regulatory fact, not an indicator.","confidence":"high","source":"Bank of England news listing"},{"type":"note","value":"The named-senior-manager expectation recorded in this feed on 20 November remains single-source from one commentator summarising the draft. Confirm against Annex 1 before any firm acts on it. No primary document text was retrieved in this run.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"This run"}],"references":["https://www.fca.org.uk/news/press-releases/uk-financial-watchdogs-clarify-cyber-expectations-attacks-rise","https://www.bankofengland.co.uk/news/2026/november/cyber-resilience-guidance-consultation-and-ai-and-quantum-effective-practices","https://www.regulationtomorrow.com/2026/11/fca-and-pra-issue-papers-on-cyber-risk/","https://beinsure.com/news/fca-and-pra-propose-new-cyber-risk-guidance-for-uk/","https://thepaypers.com/regulations/news/fca-boe-and-pra-issue-cyber-resilience-guidance-for-financial-firms","https://www.itv.com/news/2026-11-18/financial-regulators-clarify-cyber-resilience-expectations-as-threats-grow","https://www.scworld.com/brief/uk-financial-regulators-issue-new-cybersecurity-guidance","https://www.moneymarketing.co.uk/news/fca-warns-firms-to-strengthen-cyber-defences-as-attacks-hit-five-year-high/"]},{"rank":7,"id":"TI-2026-11-21-007","title":"NGINX2Root: Censys Puts Roughly 9 Million NGINX Services on an Affected Version With HTTP/2 Enabled, Still No Confirmed In-the-Wild Exploitation and Still Not in KEV - but the Linux Kernel SCTP Flaw That Completes the Chain to Root Has No CVE and No Upstream Patch","cve_ids":[],"vendor":"F5 / NGINX","affected_products":["NGINX Open Source - fixed in 1.30.7 (stable) and 1.31.9 (mainline)","NGINX Plus - fixed in 37.0.8.1 and 37.3.0.1","NGINX Ingress Controller - upgrade to 5.8.0","F5 advisories K000163925 through K000163931, plus K000164058 for the out-of-band update, published 18 November 2026","Five CVEs collectively named 'NGINX2Root'; CVSS v4.0 9.2 (critical) / CVSS v3.1 8.1 (high) per F5","Unpatched second stage: a Linux kernel SCTP flaw used to escalate from the worker process to root - no CVE assigned and no upstream patch as at 19-20 November 2026"],"category":"vulnerability_bundle","cvss_v3":8.1,"severity":"high","exploitation_status":"public_poc_available","kev_listed":false,"kev_due_date":null,"patch_available":"partial","first_reported":"2026-11-18","last_updated":"2026-11-21","confidence":"medium","summary":"Held at rank 7 after yesterday's deliberate downgrade from rank 1, and the window supplies the numbers that justify keeping it there rather than higher - plus one detail that argues for keeping it on the list at all.\n\nThe exposure number. Censys reports approximately 9 million NGINX services running an affected version with HTTP/2 enabled. That is the largest reachable population in this report by two orders of magnitude, and it is the reason this cannot be dropped even with no confirmed exploitation. For comparison, the vCenter population at rank 1 is a fraction of that, but it is being actively exploited - which is the right way to read the two entries together. Population size sets the eventual cost; exploitation status sets this week's priority.\n\nExploitation status as at this window. The most recent reporting states no in-the-wild exploitation had been reported as of 19 November, and that CISA had not added the CVEs to KEV, per watchTowr. Public proof-of-concept code exists: Rapid7 and Censys have published PoCs, and the consistent characterisation is that the exploit is not plug-and-play. Sources genuinely conflict here - some say public exploit code is out, others say none has been released, and the latter appear to predate the PoC publications. Yesterday's assessment that a real attempt would be loud and rate-limitable - requiring on the order of 128 GB of HTTP/2 traffic and a specific glibc memcpy build - stands unchallenged in this window.\n\nThe new reason to care, and it is a detection problem rather than a patching one. The HTTP/2 control frames this vulnerability class uses are not logged as requests. Your access logs will not show an attack, successful or otherwise. That is a far more serious property than the CVSS score, because it means the usual reassurance - 'we checked the logs and saw nothing' - is worthless here. The practical detection is the one Xint recommends: processes launched by the nginx worker user. If your nginx worker user has ever spawned a shell, an interpreter or a network client, you have your answer, and if you are not collecting process-creation telemetry from your web tier you cannot answer at all.\n\nThe part that remains unfixed. The chain to root runs through a Linux kernel SCTP flaw. As at 19-20 November it has no CVE identifier and no upstream patch, and Xint is withholding technical details until a fix is available. Patching NGINX therefore closes the entry point while leaving the escalation primitive in place for whatever reaches the worker process next. Two defensive consequences follow, and both are cheap: disable the SCTP kernel module where it is not needed - which on the overwhelming majority of UK web servers is everywhere - and make sure nginx workers run with the minimum privilege and a restricted filesystem view. Blacklisting an unused kernel module is a five-minute change that removes an unpatched escalation path, and it is the single highest-value action in this entry.\n\nUK context. NHS England Digital issued its own cyber alert for the F5 NGINX vulnerabilities dated 19 November, recorded in this feed yesterday. The Cloud Security Alliance published a research note on the chain on 20 November. UK relevance is high simply because of how much of the UK public sector web estate sits behind NGINX, frequently as a reverse proxy in front of applications that are themselves the object of other entries in this report - which is why the Drupal installer deny rule recorded on 20 November and this patch belong in the same change ticket.\n\nNaming, because it causes real confusion in change tickets. 'NGINX2Root' is not F5's or nginx.org's terminology, and some coverage refers to the HTTP/2 pair as 'nginx2shell'. Separately, this run could not confirm the CVE identifier CVE-2026-129182 against any source describing the five NGINX CVEs - it does not appear in any of the retrieved material. That identifier was recorded in this feed previously and should be treated as unverified until checked against F5's advisories; the authoritative mapping is in K000163925 through K000163931.\n\nConfidence and caveats. Confidence is medium. High on the 18 November advisory date, the fixed versions across OSS, Plus and Ingress Controller, the dual CVSS scoring, the worker-crash-to-memory-corruption impact, the HTTP/2 control frames not being logged, the Censys 9-million figure, and the unpatched no-CVE SCTP kernel flaw. Conflicting on public exploit code availability, with the conflict most likely explained by publication timing. Unverified: the CVE-2026-129182 identifier, which appears in none of this run's sources. No F5 advisory, Censys dashboard or Xint write-up was retrieved directly.","recommended_actions":["Patch NGINX Open Source to 1.30.7 or 1.31.9, NGINX Plus to 37.0.8.1 or 37.3.0.1, and NGINX Ingress Controller to 5.8.0. Verify the CVE-to-release mapping against F5 advisories K000163925 through K000163931 and K000164058 rather than against a scanner's identifier list.","Blacklist or disable the SCTP kernel module on every web server that does not need it, which is almost all of them. This is the highest-value action in this entry: the escalation stage of the chain is a kernel SCTP flaw with no CVE and no upstream patch, and removing the module removes the escalation path without waiting for a fix.","Do not conclude from your access logs that you were not attacked. The HTTP/2 control frames used here are not logged as requests. 'We checked the logs' is not a valid answer for this vulnerability class.","Hunt instead for processes launched by the nginx worker user over the last 60 days. Any shell, interpreter or network client spawned by that account is the detection. If you are not collecting process-creation telemetry from your web tier, that gap is the finding.","Confirm whether HTTP/2 is actually enabled on each affected service. Censys's 9 million figure is specifically services on an affected version with HTTP/2 on, and turning HTTP/2 off where it is not needed is a valid interim mitigation.","Rate-limit and cap HTTP/2 connection and frame volumes at the edge. The reported requirement of around 128 GB of HTTP/2 traffic makes a genuine attempt loud, which only helps you if something is counting.","Review the privilege and filesystem view of the nginx worker process. The entry point gives code execution as the worker; everything after that depends on what the worker can reach.","Combine this change with the Drupal /core/install.php deny rule from this feed's 20 November entry if you run Drupal behind NGINX - same hosts, same window, same ticket.","NHS organisations: the NHS England Digital alert for these F5 NGINX vulnerabilities is dated 19 November. Action it through your normal process and record the response.","Correct your records if they carry CVE-2026-129182 for this issue. That identifier could not be confirmed against any source in this run; use F5's advisory numbers as the authoritative reference."],"kql":[{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Processes spawned by the nginx worker user - the only reliable NGINX2Root detection","description":"The primary detection, because HTTP/2 control frames are not logged as requests and access logs will show nothing. Any shell, interpreter or network client under the nginx worker account is an incident.","query":"let lookback = 60d;\nDeviceProcessEvents\n| where Timestamp > ago(lookback)\n| where AccountName in~ (\"nginx\", \"www-data\", \"nobody\", \"http\", \"apache\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"python\", \"python3\", \"perl\", \"ruby\", \"php\", \"nc\", \"ncat\", \"socat\", \"curl\", \"wget\", \"base64\", \"chmod\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, FolderPath\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Privilege escalation attempts from the web tier and SCTP module loading","description":"Covers the unpatched second stage. SCTP module loading on a web server is almost never legitimate; so is a setuid or capability change from the worker account.","query":"let lookback = 60d;\nDeviceProcessEvents\n| where Timestamp > ago(lookback)\n| where ProcessCommandLine has_any (\"modprobe sctp\", \"insmod sctp\", \"sctp_\", \"setcap\", \"chmod u+s\", \"/etc/sudoers\", \"pkexec\", \"unshare -r\")\n    or (AccountName in~ (\"nginx\", \"www-data\", \"nobody\", \"http\") and ProcessCommandLine has_any (\"sudo\", \"su -\", \"id -u\", \"capsh\"))\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName\n| order by Timestamp desc"},{"platform":"sentinel","table":"Syslog","name":"NGINX worker process crashes and signal 11 - exploitation attempt artefacts","description":"The impact F5 describes is worker crash or memory corruption. Repeated worker crashes on an internet-facing host are an exploitation artefact even when nothing succeeded, and they are logged even though the attack requests are not.","query":"let lookback = 60d;\nSyslog\n| where TimeGenerated > ago(lookback)\n| where ProcessName has \"nginx\" or SyslogMessage has \"nginx\"\n| where SyslogMessage has_any (\"worker process\", \"exited on signal\", \"signal 11\", \"SIGSEGV\", \"core dumped\", \"exited with fatal code\")\n| summarize Crashes = count(), Sample = any(SyslogMessage), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)\n    by Computer, bin(TimeGenerated, 1h)\n| where Crashes > 2\n| order by Crashes desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"HTTP/2 volume anomaly - the 128 GB signature","description":"A genuine attempt reportedly needs on the order of 128 GB of HTTP/2 traffic, which is loud if something counts it. Surfaces single sources with abnormal inbound byte volume to web services.","query":"let lookback = 30d;\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where DestinationPort in (443, 8443)\n| summarize TotalBytes = sum(toreal(coalesce(SentBytes, 0)) + toreal(coalesce(ReceivedBytes, 0))), Connections = count()\n    by SourceIP, DestinationIP, bin(TimeGenerated, 1h)\n| extend GB = round(TotalBytes / 1073741824.0, 2)\n| where GB > 5\n| order by GB desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Egress from web tier hosts","description":"Post-exploitation callback detection. A reverse proxy should have a narrow, known egress profile; anything else on the list is worth explaining.","query":"let lookback = 60d;\nDeviceNetworkEvents\n| where Timestamp > ago(lookback)\n| where InitiatingProcessFileName has_any (\"nginx\", \"nginx:\") or InitiatingProcessAccountName in~ (\"nginx\", \"www-data\")\n| where ActionType == \"ConnectionSuccess\" and RemoteIPType == \"Public\"\n| summarize Connections = count(), Ports = make_set(RemotePort, 10), LastSeen = max(Timestamp) by DeviceName, RemoteIP\n| order by Connections desc"}],"iocs":[{"type":"behaviour","value":"process spawned by the nginx worker user","context":"The only reliable detection for this vulnerability class. HTTP/2 control frames are not logged as requests, so access logs will not show the attack. Per Xint, processes launched by the nginx worker user are the clearest sign of success.","confidence":"high","source":"Xint via secondary coverage"},{"type":"behaviour","value":"repeated nginx worker process crashes / exited on signal 11","context":"F5 describes the impact as worker crash or memory corruption. Repeated crashes are an exploitation artefact even where nothing succeeded, and unlike the attack traffic they are logged.","confidence":"medium","source":"F5 advisory characterisation via secondary coverage"},{"type":"behaviour","value":"loading of the Linux kernel SCTP module on a web server","context":"The escalation stage of the chain runs through a kernel SCTP flaw with no CVE and no upstream patch as at 19-20 November. Blacklisting the module removes the escalation path.","confidence":"medium","source":"Xint / Cloud Security Alliance research note via secondary coverage"},{"type":"behaviour","value":"abnormally large HTTP/2 inbound traffic volume from a single source","context":"A real attempt reportedly requires on the order of 128 GB of HTTP/2 traffic and a specific glibc memcpy build, which makes it loud and rate-limitable.","confidence":"medium","source":"This feed's 20 November assessment, unchallenged in this window"},{"type":"note","value":"Censys reports approximately 9 million NGINX services running an affected version with HTTP/2 enabled - the largest reachable population in this report.","context":"Exposure measure, not an indicator.","confidence":"medium","source":"Censys via secondary coverage"},{"type":"note","value":"No in-the-wild exploitation reported as of 19 November and the CVEs were not in CISA KEV, per watchTowr. Public PoCs exist from Rapid7 and Censys and are consistently described as not plug-and-play. Sources conflict on public exploit availability; the conflict is most likely explained by publication timing.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"watchTowr / SecurityWeek / Sophos via search summaries"},{"type":"note","value":"The identifier CVE-2026-129182, recorded in this feed previously for this issue, could not be confirmed against any source in this run and appears in none of the retrieved material. Treat it as unverified and use F5 advisories K000163925-K000163931 and K000164058 as the authoritative mapping.","context":"Correction and provenance statement, not an indicator.","confidence":"high","source":"This run"},{"type":"note","value":"'NGINX2Root' is not F5's or nginx.org's terminology; some coverage calls the HTTP/2 pair 'nginx2shell'. Expect naming confusion in change tickets and vulnerability reports.","context":"Provenance statement, not an indicator.","confidence":"high","source":"Multiple outlets"},{"type":"note","value":"NHS England Digital issued its own cyber alert for the F5 NGINX vulnerabilities dated 19 November 2026; the alert body was not retrieved in this run or the previous one.","context":"Provenance statement, not an indicator.","confidence":"medium","source":"NHS England Digital cyber alerts listing via search"}],"references":["https://www.securityweek.com/f5-patches-critical-nginx2root-flaws-as-poc-exploits-go-public/","https://www.sophos.com/en-us/blog/patches-released-for-critical-nginx2root-vulnerabilities","https://labs.cloudsecurityalliance.org/research/csa-research-note-nginx2root-ai-discovered-rce-20261120-csa/","https://webflow.sysdig.com/blog/nginx2root","https://fieldeffect.com/blog/nginx2root","https://www.prophetsecurity.ai/blog/nginx2root","https://digital.nhs.uk/cyber-alerts/year/2026"]},{"rank":8,"id":"TI-2026-11-21-008","title":"The European Commission Confirmed an AI-Assisted Cyberattack That Took Its HR, Medical Reimbursement and Translation Systems Offline for More Than Ten Days - Detected 22 October, Confirmed Publicly Only on 19 November, With CERT-EU Reportedly Detecting the Use of a Publicly Available AI Tool Called ARTEX","cve_ids":[],"vendor":"European Commission","affected_products":["Sysper - the European Commission's HR platform","MyPMO - the Commission's medical reimbursement system","Commission translation systems","Personnel systems reported as affected for more than ten days; most services since restored","Reported tooling: ARTEX, described as a publicly available AI tool for finding weaknesses in IT systems"],"category":"incident","cvss_v3":null,"severity":"high","exploitation_status":"exploited_in_the_wild","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-19","last_updated":"2026-11-21","confidence":"medium","summary":"Not a UK incident, and included deliberately. Three weeks ago the NCSC's annual review assessed that attackers would highly likely use AI-powered malware in a ransomware attack on UK critical national infrastructure by 2028. This is the first public confirmation by a major European government body that an AI-assisted attack has already taken its internal systems down, and it is the closest available read on what that class of incident actually looks like when it lands on a large public administration.\n\nWhat happened. The first signs were detected on 22 October 2026. Commission spokesperson Thomas Regnier confirmed the incident publicly at a press briefing on Thursday 19 November, after Politico reported it. Affected services include Sysper, the Commission's HR platform, MyPMO, its medical reimbursement system, and its translation systems. Personnel systems were reported as unavailable for more than ten days. Most affected services have since been restored, though the full extent of the damage remains unclear. Regnier described it as an AI-generated cyber campaign involving a publicly available AI tool, which he did not name; Politico reported that CERT-EU detected the attackers using ARTEX, a publicly available AI tool for finding weaknesses in IT systems. No attribution to a known group has been made, and Regnier said he was not aware of any ransom demand.\n\nThe detail worth taking seriously, which is not the AI part. It is the four-week gap between detection on 22 October and public confirmation on 19 November, for an incident that took an HR system and a medical reimbursement system offline for over ten days. Staff of the affected organisation experienced a visible, prolonged outage of systems holding their employment and medical reimbursement data while the cause was not publicly stated. For any UK public body reading this, the transferable question is not 'could AI tooling be used against us' - assume yes - but 'what is our stated position on day three of a ten-day outage in a system holding staff medical data, and who decides it'. That is a communications and governance decision made under pressure, and it is better made in advance.\n\nWhat the AI element does and does not mean. ARTEX, as described, is a publicly available tool for finding weaknesses in IT systems. That is vulnerability discovery and reconnaissance acceleration, not autonomous attack. The practical effect is to compress the time between a weakness existing and someone finding it, and to widen the set of people capable of finding it. It does not introduce a new vulnerability class, and it does not need a new control: the defence is the same hygiene, applied faster. The realistic consequence is that the grace period between a vulne
