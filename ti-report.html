some write-ups and six by others, and a separate NCSC-NL advisory on a GeoServer feed is reported to count SEVENTEEN vulnerabilities. Those are different scopes, not a contradiction. The number that matters for your Monday deadline is TWO IN KEV; the number that matters for your actual risk is the whole release.","recommended_actions":["INVENTORY FIRST, AND DO IT TODAY RATHER THAN MONDAY. Search for GeoServer before you search for versions: look for /geoserver/ paths in reverse-proxy, WAF and load-balancer configuration, for Java processes named geoserver or running a GeoServer WAR under Tomcat or Jetty, for TCP 8080 and 8443 listeners on map or GIS-named hosts, and for WFS, WMS, WMTS, WCS and ows endpoints in your external DNS and certificate inventory. A large share of UK public sector GeoServer deployments arrived as INSPIRE compliance projects or through managed GIS suppliers, which is exactly how an internet-facing Java application ends up absent from the security team's asset list.","ASK YOUR GIS SUPPLIER OR SHARED SERVICE PROVIDER IN WRITING, TODAY, two questions: what GeoServer version are you running on our behalf, and have you applied 2.27.7, 2.28.6 or 3.0.2. Commercial shared INSPIRE services exist whose stated function is maintaining GeoServer for councils. If that is you, the asset is yours and the patching is theirs, and the only way to close that gap is to ask and keep the answer.","UPGRADE TO 2.27.7, 2.28.6 OR 3.0.2 BY MONDAY 30 NOVEMBER. Every source agrees on these three numbers. Do not cherry-pick fixes for the two KEV CVEs: the five-stage chain's middle and end - the predictable remember-me key, the path disclosure and the JDBC paths - are only closed by the release.","ROTATE ADMINISTRATOR CREDENTIALS AND INVALIDATE REMEMBER-ME TOKENS ON ANY INSTANCE THAT WAS INTERNET-FACING AND UNPATCHED. CVE-2026-129245 is a predictable signing key permitting administrator session forgery, so forged sessions can survive an upgrade. The advisory guidance is to change administrator passwords where exposure is suspected. Treat an upgrade without credential rotation as incomplete.","RUN THE CREATE-VERIFY-DELETE STORED QUERY SEARCH FIRST - it is the highest-yield detection in this entry. watchTowr observed probes that create a stored query, confirm it exists, then delete it. Legitimate map clients do not do this. Search your GeoServer access logs and WAF logs for CreateStoredQuery, DescribeStoredQueries, ListStoredQueries and DropStoredQuery activity from unauthenticated sources, especially sequences from a single source within a short interval.","SEARCH FOR THE PREFIXED SERVICE NAME SIGNATURE. Any unauthenticated request whose path or query contains a prefixed service name of the form \u003canything>/WFS, \u003canything>/WMS or \u003canything>/ows - the published example is literally 'x/WFS' - is the CVE-2026-129243 authorization bypass pattern. This is a cheap, specific, high-confidence search.","SEARCH GetFeatureById REQUESTS FOR SSRF AND FILE-READ TARGETS: file://, 169.254.169.254, metadata.google.internal, localhost, 127.0.0.1, internal RFC1918 addresses and unexpected external hosts. That is the CVE-2026-120705 surface in both of its reported directions - arbitrary file read and attacker-chosen URL fetch.","GET GEOSERVER OFF THE OPEN INTERNET WHERE THE PUBLICATION DUTY DOES NOT REQUIRE IT. Some INSPIRE obligations genuinely require public WFS and WMS endpoints. The GeoServer WEB ADMINISTRATION INTERFACE never does. Restrict /geoserver/web to management networks, put the public service behind a reverse proxy that only passes the OGC operations you actually publish, and reject prefixed service names at the proxy.","REFRESH YOUR KEV FEED BEFORE YOU TRUST ANY DASHBOARD THIS WEEKEND. These two CVEs were legitimately absent from KEV snapshot 2026-11-25 and were added on 27 November. Any tooling, report or third-party attestation built on a pre-27-November pull will show these as not known-exploited. That includes anything produced by this feed before today.","IF YOU FIND A VULNERABLE INTERNET-FACING INSTANCE, ASSUME RECONNAISSANCE AT MINIMUM. Exposure has been mass-probed since roughly 25 November and more than 3,000 instances were reported internet-facing. Check for unexpected administrator accounts, unexpected stored queries, unexpected data stores or JDBC connections, modified security rules, and outbound connections from the GeoServer host to addresses it has no business reaching.","PUT THIS ON MONDAY'S LIST ALONGSIDE DRUPAL. The same 27 November KEV batch carries Drupal CVE-2026-136716 with the same 30 November deadline (rank 3). Both are internet-facing content and data publication platforms, both are common in UK local government, and in many councils they are owned by the same small web team. Sequence them deliberately rather than discovering the collision on Monday morning."],"references":["https://www.cisa.gov/news-events/alerts/2026/11/27/cisa-adds-three-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://geoserver.org/vulnerability/2026/11/23/cve-update.html","https://thehackernews.com/2026/11/hackers-exploit-two-geoserver-flaws-as.html","https://www.csoonline.com/article/4253667/new-geoserver-rce-exploit-chain-seen-in-the-wild-two-days-after-disclosure.html","https://www.rescana.com/post/geoserver-cve-2026-120705-and-cve-2026-129243-exploited-patch-the-unauthenticated-rce-chain-now","https://brandefense.io/security-news/geoserver-november-2026-security-update/","https://blog.ostorlab.co/geoserver-unauthenticated-rce-chain-cve-2026-129245.html","https://www.seimless.com/geoserver-vulnerabilities-cve-2026-120705-unauthenticated-rce-chain-defense/","https://guidance.data.gov.uk/publish_and_manage_data/harvest_or_add_data/inspire","https://www.gov.uk/government/publications/list-of-geospatial-data-publishers-by-theme-or-topic/list-of-geospatial-data-publishers-by-theme-or-topic","https://www.ggpsystems.co.uk/products-services/inspire-directive/shared-inspire-service/"],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"GeoServer stored query CREATE-VERIFY-DELETE probe sequence","description":"THE HIGHEST-VALUE QUERY IN THIS ENTRY. watchTowr observed probes that create a stored query, confirm it exists, then delete it - a vulnerability confirmation technique no legitimate map client performs. A single source doing all three verbs inside a short window is a near-certain exploitation attempt. Swap the table for your own web or proxy log source.","query":"let Verbs = dynamic([\"CreateStoredQuery\",\"DescribeStoredQueries\",\"ListStoredQueries\",\"DropStoredQuery\"]);\nW3CIISLog\n| where TimeGenerated > ago(14d)\n| where csUriStem has \"geoserver\" or csUriStem has_any (\"/wfs\",\"/ows\",\"/wms\")\n| extend Payload = strcat(tostring(csUriQuery), \" \", tostring(csUriStem))\n| where Payload has_any (Verbs)\n| extend Verb = tostring(extract(@\"(CreateStoredQuery|DescribeStoredQueries|ListStoredQueries|DropStoredQuery)\", 1, Payload))\n| summarize Requests = count(), Verbs = make_set(Verb, 5), DistinctVerbs = dcount(Verb), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Statuses = make_set(scStatus, 10), Agents = make_set(csUserAgent, 5) by cIP, Computer\n| where DistinctVerbs >= 2\n| order by DistinctVerbs desc, Requests desc"},{"platform":"sentinel","table":"W3CIISLog","name":"GeoServer prefixed service name authorization bypass (CVE-2026-129243)","description":"Cheap and specific. The bypass works by prefixing a service name - the published example is 'x/WFS' - so that GeoServer's service security rules do not match. Any request path containing \u003csomething>/WFS, \u003csomething>/WMS or \u003csomething>/ows where \u003csomething> is not a recognised workspace is the signature.","query":"W3CIISLog\n| where TimeGenerated > ago(14d)\n| where csUriStem has \"geoserver\"\n| where csUriStem matches regex @\"(?i)/[A-Za-z0-9_-]+/(WFS|WMS|WCS|WMTS|ows)\\b\"\n| extend Prefix = tostring(extract(@\"(?i)/([A-Za-z0-9_-]+)/(?:WFS|WMS|WCS|WMTS|ows)\\b\", 1, csUriStem))\n| extend Service = tostring(extract(@\"(?i)/(?:[A-Za-z0-9_-]+)/(WFS|WMS|WCS|WMTS|ows)\\b\", 1, csUriStem))\n| summarize Requests = count(), Paths = make_set(csUriStem, 15), Statuses = make_set(scStatus, 10), FirstSeen = min(TimeGenerated) by cIP, Prefix, Service, Computer\n| order by Requests desc"},{"platform":"sentinel","table":"W3CIISLog","name":"GeoServer GetFeatureById file-read and SSRF targets (CVE-2026-120705)","description":"Covers both reported directions of the unauthenticated WFS flaw: arbitrary file read and server-fetches-attacker-URL. Cloud instance metadata addresses are the highest-value target an attacker would try, so hits here are urgent rather than interesting.","query":"let SsrfTargets = dynamic([\"169.254.169.254\",\"metadata.google.internal\",\"localhost\",\"127.0.0.1\",\"file://\",\"gopher://\",\"dict://\",\"/etc/passwd\",\"web.xml\",\"datastore.xml\",\"security/\"]);\nW3CIISLog\n| where TimeGenerated > ago(14d)\n| where csUriStem has \"geoserver\" or csUriStem has_any (\"/wfs\",\"/ows\")\n| extend Payload = strcat(tostring(csUriQuery), \" \", tostring(csUriStem))\n| where Payload has \"GetFeatureById\" or Payload has \"STOREDQUERY_ID\"\n| where Payload has_any (SsrfTargets)\n| project TimeGenerated, cIP, csUriStem, csUriQuery, scStatus, csUserAgent, Computer\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceNetworkEvents","name":"Outbound connections FROM a GeoServer host that it should never make","description":"Post-exploitation view and the way to catch a successful SSRF or RCE rather than a probe. A map server legitimately talks to its own database and perhaps an upstream tile source. It does not talk to instance metadata endpoints or arbitrary internet hosts on odd ports.","query":"DeviceNetworkEvents\n| where Timestamp > ago(14d)\n| where InitiatingProcessFileName in~ (\"java.exe\", \"java\", \"javaw.exe\", \"catalina.sh\", \"tomcat\")\n| where InitiatingProcessCommandLine has_any (\"geoserver\", \"GEOSERVER_DATA_DIR\", \"jetty\")\n| where ActionType == \"ConnectionSuccess\"\n| where RemoteIP in (\"169.254.169.254\") or RemoteUrl has_any (\"metadata.google.internal\", \"metadata.azure.com\") or (not(ipv4_is_private(RemoteIP)) and RemotePort !in (80, 443, 5432, 3306, 1521))\n| project Timestamp, DeviceName, RemoteIP, RemoteUrl, RemotePort, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Child processes spawned by a GeoServer JVM - the RCE end of the chain","description":"A Java application server that suddenly spawns a shell, PowerShell, curl, wget or a compiler is the end state of the five-stage chain. This is the query that distinguishes 'we were probed' from 'we were compromised'.","query":"DeviceProcessEvents\n| where Timestamp > ago(14d)\n| where InitiatingProcessFileName in~ (\"java.exe\", \"java\", \"javaw.exe\")\n| where InitiatingProcessCommandLine has_any (\"geoserver\", \"GEOSERVER_DATA_DIR\", \"jetty\", \"catalina\")\n| where FileName in~ (\"cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"certutil.exe\", \"python\", \"python3\", \"perl\", \"nc\", \"ncat\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Access to the GeoServer web administration interface from outside management networks","description":"Hardening check rather than detection, and the one that pays off beyond this CVE set. INSPIRE obligations may require public WFS and WMS endpoints; they never require a public /geoserver/web. Replace the RFC1918 test with your own management ranges.","query":"W3CIISLog\n| where TimeGenerated > ago(14d)\n| where csUriStem has_any (\"/geoserver/web\", \"/geoserver/rest\", \"/geoserver/j_spring_security_check\")\n| where not(ipv4_is_private(cIP))\n| summarize Requests = count(), Paths = make_set(csUriStem, 20), Statuses = make_set(scStatus, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by cIP, Computer\n| order by Requests desc"}],"iocs":[{"type":"behaviour","value":"A stored query CREATED, then CONFIRMED to exist, then DELETED against a GeoServer instance by an unauthenticated source within a short interval","context":"THE BEST INDICATOR IN THIS REPORT. watchTowr observed exactly this sequence from multiple IPs - it confirms a server is vulnerable without delivering a payload. No legitimate map client does this. Highest-yield single search available for this CVE set.","confidence":"high","source":"watchTowr honeypot observations via CSO Online and secondary reporting"},{"type":"uri_path","value":"Prefixed service names of the form /x/WFS, /\u003canything>/WFS, /\u003canything>/WMS, /\u003canything>/ows","context":"The CVE-2026-129243 authorization bypass signature. Prefixing the service name causes GeoServer's service security rules not to match, giving an unauthenticated attacker administrator-restricted operations. The published example is literally 'x/WFS'.","confidence":"high","source":"GeoServer advisory and vulnerability write-ups, November 2026"},{"type":"uri_path","value":"WFS GetFeatureById and STOREDQUERY_ID requests containing file://, 169.254.169.254, metadata.google.internal, localhost, 127.0.0.1, /etc/passwd, web.xml or datastore.xml","context":"The CVE-2026-120705 surface in both reported directions - arbitrary file read and attacker-chosen URL fetch. Cloud instance metadata is the highest-value target and makes any hit urgent.","confidence":"high","source":"Vulnerability write-ups describing the WFS GetFeatureById flaw, November 2026"},{"type":"behaviour","value":"Unexpected GeoServer administrator accounts, unexpected stored queries, new data stores or JDBC connections, or modified service security rules","context":"Post-exploitation artefacts. CVE-2026-129245 is a PREDICTABLE REMEMBER-ME SIGNING KEY permitting administrator session forgery, so an attacker may hold valid-looking admin sessions that survive an upgrade.","confidence":"medium","source":"Analyst assessment based on the published five-stage chain mechanics"},{"type":"behaviour","value":"A GeoServer JVM spawning cmd.exe, powershell, sh, bash, curl, wget, certutil or an interpreter","context":"The RCE end of the five-stage chain. This is the artefact that distinguishes reconnaissance from compromise. Note that watchTowr has NOT reported successful code execution from the probing it observed.","confidence":"medium","source":"Analyst assessment based on the published chain and standard Java application server post-exploitation"},{"type":"port","value":"8080/tcp and 8443/tcp on GIS, map, spatial or INSPIRE-named hosts","context":"Default Tomcat and Jetty listeners for GeoServer deployments. Useful for the inventory step, which is the step most likely to be skipped and the step the NCSC named on 24 November.","confidence":"medium","source":"Analyst assessment based on standard GeoServer deployment patterns"},{"type":"note","value":"KEV STATUS CHANGED LAST NIGHT: CISA added CVE-2026-120705 (XML Injection) and CVE-2026-129243 (Incorrect Authorization) on 27 NOVEMBER 2026 with a due date of 30 NOVEMBER 2026; neither is flagged as requiring forensic triage under BOD 26-04; ransomware use is recorded as unknown for both","context":"Any vulnerability management tooling, dashboard or third-party attestation built on a KEV pull from before 27 November is WRONG about these two. Refresh before trusting any dashboard this weekend.","confidence":"high","source":"CISA alert of 27 November 2026 and KEV catalogue, via search-surfaced summaries"},{"type":"note","value":"FIXED VERSIONS - UNUSUALLY UNCONTESTED: 2.27.7, 2.28.6 and 3.0.2. Affected: up to and including 2.27.6, 2.28.0 through 2.28.5, and 3.0.0 through 3.0.1","context":"Every source reviewed agrees on these three fixed releases, which is notable given how often version strings conflict in this feed. Patch the RELEASE, not the two KEV identifiers, or the chain's middle and end stay open.","confidence":"high","source":"GeoServer advisory and multiple independent write-ups, November 2026"},{"type":"note","value":"UPGRADING IS NOT SUFFICIENT: because CVE-2026-129245 is a predictable remember-me signing key allowing ADMINISTRATOR SESSION FORGERY, advisory guidance is to CHANGE ADMINISTRATOR PASSWORDS where exposure is suspected","context":"Forged administrator sessions can survive the upgrade. An upgrade without credential rotation and remember-me token invalidation is a version number, not remediation.","confidence":"high","source":"GeoServer remember-me advisory guidance via secondary reporting"},{"type":"note","value":"THE CHAIN: maintainers describe a FIVE-STAGE unauthenticated RCE chain; Eye Security is reported to describe a shorter THREE-FLAW variant. Beyond the two KEV CVEs the cluster includes CVE-2026-129245 (predictable remember-me signing key, admin session forgery), CVE-2026-129244 (stored-query exception disclosing the data directory path), CVE-2026-129242 (JDBC deserialisation) and, per one write-up, CVE-2026-120704 (SQLite JDBC extension loading RCE)","context":"Patching only the two KEV CVEs leaves the chain's middle and end intact. Source counts vary between five and six CVEs, and a separate NCSC-NL advisory on a GeoServer feed is reported to count seventeen - different scopes, not a contradiction.","confidence":"medium","source":"GeoServer advisory, Eye Security and multiple vulnerability write-ups, November 2026"},{"type":"note","value":"EXPOSURE: Eye Security is reported to have counted MORE THAN 3,000 internet-facing GeoServer instances","context":"Scale figure for prioritisation. No UK-specific count was found in any source reviewed.","confidence":"medium","source":"Eye Security via secondary reporting"},{"type":"note","value":"EXPLOITATION EVIDENCE IS LAYERED, NOT UNIFORM: watchTowr observed PROBING from multiple IPs within ~2 days of disclosure and has NOT reported successful code execution; Eye Security is reported to have observed in-the-wild exploitation of CVE-2026-120705 on 25 NOVEMBER; CISA's 27 November KEV listing is the authoritative exploitation confirmation","context":"Earlier tracker records showing these CVEs absent from KEV (including an explicit negative against snapshot 2026-11-25) were correct at the time and are now superseded.","confidence":"high","source":"watchTowr, Eye Security and CISA KEV, via secondary reporting"},{"type":"note","value":"NO ATTACKER IP ADDRESSES, DOMAINS, URLS OR FILE HASHES HAVE BEEN PUBLISHED for this activity in any source reviewed","context":"watchTowr's original post is where such a list would appear; none of the available summaries reproduces one. Detection here is behavioural, and for once the behaviour is specific enough to be sufficient.","confidence":"high","source":"Analyst assessment across all sources reviewed in this window"},{"type":"note","value":"UK PUBLIC SECTOR RELEVANCE IS DOCUMENTED HISTORICALLY BUT NOT CURRENTLY CENSUSED: Defra published official how-to guidance for standing up INSPIRE Web Feature Services in GeoServer, the LGA published local authority INSPIRE implementation case studies, Defra funded local authority compliance, at least one commercial supplier sells a shared INSPIRE service that maintains GeoServer and GeoNetwork for councils, and the Environment Agency is a listed publisher for flooding, hydrography and ecology themes","context":"NO current figure for UK authorities running GeoServer, or for their versions, was found in any source. The documented history establishes that the technology is embedded in UK public sector geospatial publication; it does NOT establish today's deployment count. Stated as context, not as a measured exposure.","confidence":"medium","source":"data.gov.uk INSPIRE guidance, gov.uk geospatial publisher list, LGA case studies and supplier material - all historical (approximately 2014-2020)"}]},{"rank":3,"id":"TI-2026-11-28-003","title":"THE OPEN QUESTION FROM YESTERDAY IS NOW CLOSED, AND THE ANSWER IS THE BAD ONE: CISA Added Drupal Core CVE-2026-136716 to KEV on 27 November With a 30 NOVEMBER Deadline - and Drupal's Own Testing Reportedly Shows ATTACKER ADMIN ACCOUNTS AND BACKDOORS SURVIVE THE UPGRADE, So Every Site With a Reachable Installer Since 18 November Needs a COMPROMISE ASSESSMENT, Not a Patch","cve_ids":["CVE-2026-136716","CVE-2026-132165"],"vendor":"Drupal","affected_products":["Drupal core 11.4.x (fixed in 11.4.14)","Drupal core 11.3.x (fixed in 11.3.23)","Drupal core 10.6.x (fixed in 10.6.23)","Drupal core installer subsystem - /core/install.php and /install.php"],"category":"vulnerability_bundle","cvss_v3":9.8,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-30","patch_available":"yes","first_reported":"2026-11-18","last_updated":"2026-11-28","confidence":"high","summary":"YESTERDAY THIS FEED FLAGGED AN UNRESOLVED QUESTION AND IT HAS BEEN ANSWERED OVERNIGHT. The 26 and 27 November reports recorded that exploitation of Drupal core CVE-2026-136716 (advisory SA-CORE-2026-019) rested SOLELY on the Drupal Security Team's own statement, was NOT corroborated by a CISA KEV listing, and that one tracker had made an explicit negative check against catalogue snapshot 2026.11.25 at 07:43 GMT on 26 November. That position is now SUPERSEDED. CISA added CVE-2026-136716 to the Known Exploited Vulnerabilities catalogue on 27 NOVEMBER 2026 with a remediation due date of 30 NOVEMBER 2026 - Monday. This is recorded as a status change, not as a correction of an error: the earlier negative checks were accurate when made.\n\nNOTE CAREFULLY WHAT THE KEV ENTRY DOES AND DOES NOT CARRY, BECAUSE THE TWO DRUPAL CVES DIFFER. The FORENSIC TRIAGE requirement under BOD 26-04 attaches to CVE-2026-132165 (SA-CORE-2026-017), whose deadline was YESTERDAY, 27 November. No source reviewed attaches a forensic triage flag to CVE-2026-136716. That is a catalogue distinction and it should be recorded accurately - but it would be a serious misreading to conclude that CVE-2026-136716 therefore needs no compromise assessment, because of what follows.\n\nTHE MOST IMPORTANT SENTENCE IN THIS ENTRY, AND IT IS NEW IN THIS WINDOW. Drupal's own testing is reported to show that ATTACKER-CREATED ADMINISTRATOR ACCOUNTS AND BACKDOORS SURVIVE AN UPGRADE. The reported consequence is stated plainly in the source material: ANY SITE WITH A REACHABLE INSTALLER SINCE 18 NOVEMBER NEEDS A COMPROMISE CHECK. Put the three facts together and the shape of the problem is unmistakable. The installer flaws let an unauthenticated attacker reinstall a live site and create an administrator account. Administrator accounts and backdoors persist through the upgrade. The administrative interface does not show whether a site is already compromised. Therefore THE PATCH PROVES NOTHING. A site running 11.4.14 can be a site a stranger administers. This is the single most consequential operational fact in this report after the DWP incident, and it is the one most likely to be missed, because patching produces a green tick and a compromise assessment produces work.\n\nTHE 18 NOVEMBER DATE IS THE TRIAGE BOUNDARY AND IT IS WORTH BEING PRECISE ABOUT IT. CVE-2026-132165, carried at CVSS 9.8, was patched on 18 NOVEMBER and reported exploited from 19 NOVEMBER. It lets an UNAUTHENTICATED attacker REINSTALL A LIVE DRUPAL SITE, CREATE AN ADMINISTRATOR ACCOUNT and in some circumstances EXECUTE CODE. It is reported to have been found by Anthropic's open-source scanner. CVE-2026-136716 is the SECOND, DISTINCT flaw - a bypass of the first fix, published in SA-CORE-2026-019 roughly seven days later and reported abused the same day it was disclosed. So the exposure window for any Drupal site whose installer was reachable opens on 18 November and has not closed for anyone who has not both upgraded and checked. Ten days is a long time in a mass-scanned installer flaw.\n\nREMEDIATION HAS THREE PARTS AND MOST ORGANISATIONS WILL DO ONE. FIRST, upgrade to 10.6.23, 11.3.23 or 11.4.14 depending on branch. SECOND - and this was flagged in yesterday's report and remains true - you must ALSO RUN THE UPDATE HOOK after deploying the new build. A version string alone is not remediation evidence. THIRD, and new in this window, CONDUCT A COMPROMISE ASSESSMENT if the installer was reachable at any point since 18 November, because the first two steps do not remove what an attacker already left. Note the one internal advisory conflict that has now settled: a stray reference to 'update to Drupal 11.4.13' appeared in earlier material and does not recur; 11.4.14 is treated as the required 11.4 build.\n\nWHY THIS LANDS ESPECIALLY HARD ON UK GOVERNMENT. Drupal is heavily used across UK central and local government web estates and across the wider UK public sector - councils, NHS organisations, universities, arm's-length bodies and charities. It is also exactly the kind of platform that is maintained by a small web team or an external digital agency rather than by a security function, which means the installer may be reachable for reasons nobody currently remembers: a staging site promoted to production, a settings file left writable after a migration, a deployment pipeline that restores a pre-install state, a dormant multisite instance. The vulnerability is not in anything exotic; it is in a path that should never have been reachable and sometimes is.\n\nAND IT COLLIDES WITH RANK 2 ON THE SAME DEADLINE, WHICH IS A PLANNING PROBLEM IN ITS OWN RIGHT. The 27 November KEV batch is three CVEs: this one and the two GeoServer flaws, ALL DUE 30 NOVEMBER. A Drupal website estate and a GeoServer map service estate are, in a great many UK councils, owned by the SAME SMALL TEAM - the web and digital team. Monday is also the first working day after a weekend in which that team's attention was likely elsewhere. Sequence the work deliberately: the GeoServer inventory is the harder discovery problem, the Drupal compromise assessment is the harder evidence problem, and neither is a one-hour job. If you can only start one thing on Monday morning, start the Drupal compromise assessment on any site whose installer was reachable, because that is the one where a wrong assumption leaves an attacker in place.","recommended_actions":["TREAT A PATCHED SITE AS UNPROVEN, NOT AS SAFE. Drupal's own testing is reported to show attacker-created administrator accounts and backdoors SURVIVE the upgrade, and the administrative interface does not reveal prior compromise. If the installer was reachable at any point since 18 NOVEMBER, the required action is a COMPROMISE ASSESSMENT in addition to the upgrade.","UPGRADE TO 10.6.23, 11.3.23 OR 11.4.14 AND THEN RUN THE UPDATE HOOK. The deadline for CVE-2026-136716 is MONDAY 30 NOVEMBER. A version string without the update hook is not remediation evidence, and the stray 'update to 11.4.13' reference seen in earlier material should be disregarded in favour of 11.4.14.","ENUMERATE EVERY DRUPAL INSTANCE INCLUDING THE ONES YOU HAVE FORGOTTEN: multisite instances, staging and UAT sites reachable from the internet, decommissioned-but-still-served microsites, campaign sites built by agencies, and anything behind a vanity domain. Installer reachability is usually an accident of history, so the forgotten instances are the likely ones.","SEARCH YOUR WEB LOGS BACK TO 18 NOVEMBER FOR ANY REQUEST TO /core/install.php OR /install.php, successful or not. That is the triage boundary date. A 200 response to an unauthenticated installer request is a compromise indication, not a curiosity. Preserve those logs before any rotation removes them.","AUDIT DRUPAL ADMINISTRATOR ACCOUNTS AGAINST A KNOWN-GOOD LIST, BY HAND. Look for accounts created since 18 November, accounts with no corresponding joiner record, accounts whose mail domain differs from your organisation's, and role grants that nobody in your change record requested. This is the specific artefact Drupal reports survives the upgrade.","CHECK FOR BACKDOORS IN THE PLACES AN INSTALLER-STAGE ATTACKER CAN WRITE: settings.php and settings.local.php for unexpected includes or database targets, the files and sites directories for PHP files that should not be there, custom and contributed module directories for unexpected additions, and the database for PHP-input-format blocks or suspicious cron and queue entries. File integrity against a clean checkout of your own release is the fastest route to an answer.","ROTATE EVERY SECRET THE SITE HOLDS IF YOU FIND EVIDENCE OF INSTALLER ABUSE: the database credentials in settings.php, the Drupal hash salt, any API keys and SMTP credentials in configuration, and any administrator passwords. A successful reinstall gives an attacker the configuration, and the configuration is where the credentials live.","MAKE THE INSTALLER PERMANENTLY UNREACHABLE AT THE WEB SERVER OR WAF, not just in the application. Deny /core/install.php and /install.php outright for all sources except, if genuinely required, a management network. This single rule removes the attack surface for BOTH CVEs and any future installer flaw, and it costs one line of configuration.","REFRESH YOUR KEV DATA BEFORE YOU REPORT STATUS. CVE-2026-136716 was legitimately absent from KEV snapshot 2026.11.25 and was added on 27 November. Any dashboard, report or attestation built on a pre-27-November pull understates this CVE - including anything this feed published before today.","RECORD THE CATALOGUE DISTINCTION ACCURATELY FOR AUDIT PURPOSES: the BOD 26-04 forensic triage requirement attaches to CVE-2026-132165, whose deadline was 27 November, and no source reviewed attaches it to CVE-2026-136716. Then ignore the comfort that offers, because Drupal's persistence finding makes a compromise assessment necessary on its own merits.","SEQUENCE MONDAY DELIBERATELY. Three CVEs from one KEV batch are due 30 November: this one and the two GeoServer flaws in rank 2. In many UK councils both estates belong to the same small web team. If you can only start one task, start the Drupal compromise assessment on any site whose installer was reachable - that is where a wrong assumption leaves an attacker in place."],"references":["https://www.cisa.gov/news-events/alerts/2026/11/27/cisa-adds-three-known-exploited-vulnerabilities-catalog","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://www.rescana.com/post/drupal-core-cve-2026-136716-exploited-site-takeover-in-unusual-install-states-update-now","https://kudelskisecurity.com/research/drupal-core-access-bypass-allows-site-takeover-via-the-installer","https://www.cybaverse.co.uk/threats/drupal-core-sa-core-2026-019-cve-2026-136716","https://www.pk-sharma.com/briefing/drupal-sa-core-2026-019-cve-2026-136716-active-exploitation","https://www.decryptiondigest.com/blog/drupal-installer-rce-cve-2026-136716-patch-now","https://labs.cloudsecurityalliance.org/research/ciso-daily-briefing-20261127/","https://cybersixt.com/cve/CVE-2026-136716"],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Any request to the Drupal installer since the 18 November triage boundary","description":"THE FIRST QUERY TO RUN. 18 November is the date Drupal's reported guidance uses as the triage boundary. A 200 response to an unauthenticated installer request is a compromise indication. Preserve the results before log rotation removes them.","query":"W3CIISLog\n| where TimeGenerated >= datetime(2026-11-18)\n| where csUriStem has_any (\"/core/install.php\", \"/install.php\")\n| summarize Requests = count(), Successes = countif(scStatus in (200, 302)), Statuses = make_set(scStatus, 10), Methods = make_set(csMethod, 5), Agents = make_set(csUserAgent, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by cIP, csUriStem, Computer, csHost\n| extend CompromiseIndication = Successes > 0\n| order by CompromiseIndication desc, Requests desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Drupal installer step progression - evidence of a completed reinstall, not just a probe","description":"Distinguishes scanning from an actual site takeover. The installer walks through named steps; a single source progressing through several of them, rather than hitting install.php once, indicates the reinstall was driven to completion.","query":"let Steps = dynamic([\"install_configure_form\",\"install_settings_form\",\"install_select_profile\",\"install_select_language\",\"install_verify_requirements\",\"install_bootstrap_database\",\"install_finished\"]);\nW3CIISLog\n| where TimeGenerated >= datetime(2026-11-18)\n| where csUriStem has_any (\"/core/install.php\", \"/install.php\")\n| extend Payload = strcat(tostring(csUriQuery), \" \", tostring(csUriStem))\n| where Payload has_any (Steps)\n| extend Step = tostring(extract(@\"(install_[a-z_]+)\", 1, Payload))\n| summarize Hits = count(), Steps = make_set(Step, 10), DistinctSteps = dcount(Step), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by cIP, csHost, Computer\n| where DistinctSteps >= 2\n| order by DistinctSteps desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Files written into Drupal webroot directories where PHP should never appear","description":"Hunts the backdoor artefact that Drupal reports SURVIVES the upgrade. sites/default/files and the themes, modules and libraries directories should not acquire PHP files outside a deployment. Tune the path filter to your own webroot.","query":"DeviceFileEvents\n| where Timestamp >= datetime(2026-11-18)\n| where FolderPath has_any (\"sites/default/files\", \"sites/default\", \"/modules/\", \"/themes/\", \"/libraries/\", \"\\\\sites\\\\default\\\\files\")\n| where FileName endswith \".php\" or FileName endswith \".phtml\" or FileName endswith \".phar\" or FileName endswith \".inc\"\n| where ActionType in (\"FileCreated\", \"FileModified\")\n| where InitiatingProcessFileName !in~ (\"git\", \"git.exe\", \"composer\", \"composer.phar\", \"rsync\", \"drush\")\n| project Timestamp, DeviceName, FolderPath, FileName, ActionType, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceFileEvents","name":"Modification of Drupal settings.php or settings.local.php","description":"A successful installer abuse rewrites site configuration. An unexpected modification of settings.php outside a deployment window is both a compromise indicator and a credential-exposure event, because the database credentials and hash salt live there.","query":"DeviceFileEvents\n| where Timestamp >= datetime(2026-11-18)\n| where FileName in~ (\"settings.php\", \"settings.local.php\", \"services.yml\")\n| where ActionType in (\"FileCreated\", \"FileModified\", \"FileRenamed\")\n| project Timestamp, DeviceName, FolderPath, FileName, ActionType, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName, PreviousFileName\n| order by Timestamp desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"PHP spawning shells or download utilities on a Drupal host","description":"The code-execution outcome of the installer chain. A php-fpm, php or httpd worker spawning a shell, curl, wget or an interpreter is the end state, and it is the clearest evidence that reconnaissance became compromise.","query":"DeviceProcessEvents\n| where Timestamp >= datetime(2026-11-18)\n| where InitiatingProcessFileName in~ (\"php\", \"php-fpm\", \"php.exe\", \"httpd\", \"apache2\", \"nginx\", \"w3wp.exe\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"curl\", \"wget\", \"python\", \"python3\", \"perl\", \"nc\", \"ncat\", \"certutil.exe\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp desc"},{"platform":"sentinel","table":"W3CIISLog","name":"Successful Drupal administrative logins from unexpected sources since 18 November","description":"Approaches the surviving-admin-account problem from the network side. Drupal administrative routes reached successfully from an unexpected country, ASN or hosting provider since the triage boundary date deserve a manual account review.","query":"W3CIISLog\n| where TimeGenerated >= datetime(2026-11-18)\n| where csUriStem has_any (\"/user/login\", \"/admin/people\", \"/admin/modules\", \"/admin/config\", \"/admin/reports/status\")\n| where scStatus in (200, 302)\n| summarize Requests = count(), Paths = make_set(csUriStem, 20), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Agents = make_set(csUserAgent, 5) by cIP, csHost, Computer\n| order by Requests desc"}],"iocs":[{"type":"uri_path","value":"/core/install.php and /install.php","context":"The attack surface for BOTH Drupal CVEs - not an attacker artefact. Any request since 18 NOVEMBER is in scope; a 200 or 302 response to an unauthenticated request is a compromise indication. Denying these paths at the web server or WAF removes the surface for both CVEs and any future installer flaw.","confidence":"high","source":"Drupal advisories SA-CORE-2026-017 and SA-CORE-2026-019 via secondary reporting"},{"type":"behaviour","value":"Drupal administrator accounts created on or after 18 November 2026 with no corresponding joiner or change record, or with a mail domain outside your organisation","context":"THE ARTEFACT THAT SURVIVES THE UPGRADE. Drupal's own testing is reported to show attacker-created admin accounts and backdoors persist through an upgrade, and the admin interface does not reveal prior compromise. This is the highest-priority manual check in this entry.","confidence":"high","source":"Drupal Security Team testing via secondary reporting, 27 November 2026"},{"type":"behaviour","value":"Installer step progression - install_configure_form, install_settings_form, install_select_profile, install_bootstrap_database, install_finished - from a single unauthenticated source","context":"Distinguishes a scan from a completed reinstall. A source that walks several named installer steps drove the takeover to completion rather than merely probing for it.","confidence":"medium","source":"Analyst assessment based on the Drupal installer flow and the published flaw mechanics"},{"type":"filepath","value":"settings.php and settings.local.php modified outside a deployment window","context":"A successful installer abuse rewrites site configuration. This is simultaneously a compromise indicator and a credential-exposure event: the database credentials, hash salt and often API and SMTP secrets live in these files and must be rotated.","confidence":"high","source":"Analyst assessment based on the reinstall mechanics described in the advisories"},{"type":"filepath","value":"New .php, .phtml, .phar or .inc files under sites/default/files, /modules/, /themes/ or /libraries/ not written by git, composer, rsync or drush","context":"Where an installer-stage attacker plants a web shell. These directories do not acquire PHP files outside a deployment, which makes this a low-noise search.","confidence":"medium","source":"Analyst assessment based on standard Drupal compromise patterns"},{"type":"note","value":"KEV STATUS CHANGED: CISA added CVE-2026-136716 on 27 NOVEMBER 2026 with a due date of 30 NOVEMBER 2026. This supersedes the 26 November tracker record showing it absent from catalogue snapshot 2026.11.25 at 07:43 GMT, and the 26-27 November entries in this feed that recorded exploitation as resting solely on the Drupal Security Team's own statement","context":"Recorded as a STATUS CHANGE, not an error correction - the earlier negative checks were accurate when made. Any tooling built on a pre-27-November KEV pull understates this CVE.","confidence":"high","source":"CISA alert of 27 November 2026 and KEV catalogue, via search-surfaced summaries"},{"type":"note","value":"THE PATCH PROVES NOTHING ON ITS OWN: Drupal's reported testing shows attacker admin accounts and backdoors SURVIVE the upgrade, and the administrative interface does not show whether a site is already compromised. The reported consequence is that ANY SITE WITH A REACHABLE INSTALLER SINCE 18 NOVEMBER NEEDS A COMPROMISE CHECK","context":"The single most consequential operational fact in this entry, and the one most likely to be missed because patching produces a green tick and a compromise assessment produces work. A site running 11.4.14 can be a site a stranger administers.","confidence":"high","source":"Drupal Security Team testing via CISO Daily Briefing and secondary reporting, 27 November 2026"},{"type":"note","value":"CATALOGUE DISTINCTION: the BOD 26-04 FORENSIC TRIAGE requirement attaches to CVE-2026-132165 (SA-CORE-2026-017, due 27 November). No source reviewed attaches a forensic triage flag to CVE-2026-136716 (due 30 November)","context":"Record this accurately for audit purposes, then disregard the comfort it offers: Drupal's persistence finding makes a compromise assessment necessary on its own merits regardless of the catalogue flag.","confidence":"high","source":"CISA KEV catalogue and alerts, via search-surfaced summaries"},{"type":"note","value":"TIMELINE: CVE-2026-132165 (CVSS 9.8) patched 18 NOVEMBER, reported exploited from 19 NOVEMBER, reportedly found by Anthropic's open-source scanner; it lets an unauthenticated attacker REINSTALL a live site, CREATE AN ADMINISTRATOR ACCOUNT and sometimes EXECUTE CODE. CVE-2026-136716 is a DISTINCT bypass of that fix, published in SA-CORE-2026-019 roughly seven days later and reported abused the same day it was disclosed","context":"The exposure window opens 18 November and has not closed for anyone who has not both upgraded and checked. Ten days is a long time in a mass-scanned installer flaw.","confidence":"high","source":"Drupal advisories and multiple write-ups via secondary reporting"},{"type":"note","value":"REMEDIATION HAS THREE PARTS: (1) upgrade to 10.6.23 / 11.3.23 / 11.4.14, (2) RUN THE UPDATE HOOK, (3) conduct a COMPROMISE ASSESSMENT if the installer was reachable since 18 November. The earlier stray reference to 'update to Drupal 11.4.13' does not recur and 11.4.14 is treated as the required 11.4 build","context":"Most organisations will do step one only. A version string without the update hook is not remediation evidence, and neither step removes what an attacker already left behind.","confidence":"high","source":"Drupal advisory guidance via secondary reporting across the 26-28 November window"},{"type":"note","value":"DEADLINE COLLISION: all three CVEs in the 27 November KEV batch - CVE-2026-136716, CVE-2026-120705 and CVE-2026-129243 - are due 30 NOVEMBER. In many UK councils the Drupal website estate and the GeoServer map service estate belong to the SAME small web and digital team","context":"Monday is the first working day after the weekend. If only one task can start, start the Drupal compromise assessment on any site whose installer was reachable - that is where a wrong assumption leaves an attacker in place.","confidence":"medium","source":"Analyst assessment based on the 27 November KEV batch and UK public sector web team structures"},{"type":"note","value":"A commercial extended-support vendor's claim that Drupal 7 is affected remains single-sourced and vendor-interested and is NOT carried as established in this report","context":"Carried forward unresolved from earlier windows. Verify against the Drupal Security Team's own advisories before acting on any Drupal 7 claim.","confidence":"low","source":"Single commercial vendor claim, not corroborated"}]},{"rank":4,"id":"TI-2026-11-28-004","title":"EIGHT EXPLOITED FLAWS ARE DUE TODAY, THREE MORE WENT OVERDUE YESTERDAY, AND THREE NEW ONES LAND ON MONDAY: The Deadline Wall Yesterday's Report Warned About Has ARRIVED - Mitel MiCollab x4, Juniper Session Smart, Vates Xen Orchestra and Danfoss AK-SM 800A x2 Are Due 28 NOVEMBER, With Mandatory Forensic Triage on Two of Them, and SEVEN Separate CVEs Now Sit Past Their Date and Still Exploited","cve_ids":["CVE-2026-133275","CVE-2026-133303","CVE-2026-133323","CVE-2026-133324","CVE-2026-103406","CVE-2026-133469","CVE-2023-25914","CVE-2023-25915","CVE-2026-132165","CVE-2026-131914","CVE-2026-132224","CVE-2026-133968","CVE-2026-134624","CVE-2026-123890","CVE-2026-76466","CVE-2026-133311","CVE-2025-41450","CVE-2026-136716","CVE-2026-120705","CVE-2026-129243"],"vendor":"Multiple - Mitel, HPE Juniper Networks, Vates, Danfoss, Drupal, Idunno, Optimizely, Project MONAI, N-able, Broadcom VMware, Cisco, OSGeo","affected_products":["Mitel MiCollab Audio, Web and Video Conferencing (AWV)","HPE Juniper Session Smart Conductor and Session Smart Router","Vates Xen Orchestra","Danfoss AK-SM 800A refrigeration system manager","Drupal core installer subsystem","Idunno.AntiCsrf (ASP.NET library)","Optimizely Web Experimentation","Project MONAI Label","N-able Mail Assure","Broadcom VMware vCenter Server","Cisco Expressway","OSGeo GeoServer"],"category":"vulnerability_bundle","cvss_v3":10.0,"severity":"critical","exploitation_status":"exploited_in_the_wild","kev_listed":true,"kev_due_date":"2026-11-28","patch_available":"partial","first_reported":"2026-11-20","last_updated":"2026-11-28","confidence":"high","summary":"YESTERDAY'S REPORT CALLED THIS A DEADLINE WALL AND SAID IT WOULD ARRIVE TODAY. IT HAS. This entry is the checklist, written so it can be read top to bottom and acted on without reading anything else in the report.\n\nDUE TODAY, SATURDAY 28 NOVEMBER - EIGHT CVES, FOUR PRODUCT FAMILIES.\n\n- MITEL MICOLLAB AWV: CVE-2026-133275, CVE-2026-133303, CVE-2026-133323 and CVE-2026-133324. Four of the five AWV flaws, including CVE-2026-133323 at CVSS 10.0. Patched by Mitel on 16 November. The fifth, CVE-2026-133311, is due 9 DECEMBER. The exploitation story here hardened in this window and it is worth reading before you decide this is routine patching - see the Accenture timeline below.\n- HPE JUNIPER SESSION SMART: CVE-2026-103406, a command injection flaw. MANDATORY FORENSIC TRIAGE under BOD 26-04 and a three-day deadline from listing. Fixed builds reported as 7.0.5-14-lts, 7.1.7-15-sts or 7.2.3-8r2.\n- VATES XEN ORCHESTRA: CVE-2026-133469, an authentication bypass at CVSS 9.8. KEV added 25 November, due TODAY, and the required action is reported as applying vendor mitigations AND following BOD 26-04 FORENSIC TRIAGE guidance. Vates is reported to have confirmed exploitation as early as 10 NOVEMBER. Patched versions reported as 6.9.2 (stable) and 6.10.1 (latest). This flaw carries the single cheapest detection in this entire report - see the IOC list.\n- DANFOSS AK-SM 800A: CVE-2023-25914 and CVE-2023-25915. Note the YEAR in those identifiers. Two flaws disclosed in 2023 are being exploited in 2026 and are due today. CVE-2025-41450 in the same family is due 9 DECEMBER. Remediation is PARTIAL at best for this product class.\n\nWENT OVERDUE YESTERDAY, 27 NOVEMBER - THREE CVES THAT DO NOT STOP MATTERING BECAUSE A DATE PASSED.\n\n- CVE-2026-132165, Drupal core installer, anonymous pre-auth RCE, WITH MANDATORY FORENSIC TRIAGE. See rank 3: the triage requirement is now backed by Drupal's own finding that attacker admin accounts survive the upgrade.\n- CVE-2026-131914, Idunno.AntiCsrf. THIS DEADLINE COULD NOT BE MET BY PATCHING AND STILL CANNOT. There is no patch and there will not be one. The only remediation is to REMOVE OR REPLACE THE DEPENDENCY, which requires a dependency-graph search across every .NET application you own, including transitive references you never chose. This is the item most likely to have been silently skipped yesterday, because it is the only one that cannot be closed by a deployment.\n- CVE-2026-132224, Optimizely Web Experimentation. Same incident family as the Optimizely signup-flow compromise that served malicious JavaScript from its own CDN to at least 178 organisations including the BBC, HSBC, TalkTalk, Zoom, IKEA, Salesforce and CNN.\n\nSTILL OVERDUE FROM EARLIER BATCHES, STILL EXPLOITED - FOUR MORE.\n\n- CVE-2026-133968, Project MONAI Label path traversal, KEV added 23 November. Reported by Amazon Threat Intelligence as FOUND AND EXPLOITED BY AI AGENTS, reaching a root shell on university servers in East Asia in ELEVEN MINUTES. Directly relevant to UK universities and NHS research computing - and note that rank 7 of this report is a UK Russell Group university with a live extortion clock.\n- CVE-2026-134624, N-able Mail Assure SSRF, KEV added 23 November. An email security gateway, which means a high-trust position in the mail path.\n- CVE-2026-123890, Broadcom VMware vCenter authentication bypass at CVSS 9.8, exploited by a Chinese threat actor for months and reported as a zero-day by Google on 20 November. Broadcom has still not confirmed exploitation itself.\n- CVE-2026-76466, Cisco Expressway, KEV added 20 November: an attacker with network access and the relevant persistent cookies can execute OS commands AS ROOT on an affected clustered device.\n\nAND THREE NEW ONES LAND ON MONDAY 30 NOVEMBER. CVE-2026-136716 (Drupal, rank 3), CVE-2026-120705 and CVE-2026-129243 (GeoServer, rank 2). Added last night. So the sequence is: eight due today, seven already past, three due Monday. EIGHTEEN DISTINCT EXPLOITED CVES ACROSS TWELVE UNRELATED PRODUCT FAMILIES INSIDE A SINGLE WEEK.\n\nTHE MITEL EXPLOITATION TIMELINE IS THE MOST INSTRUCTIVE THING IN THIS ENTRY AND IT IS NEW DETAIL. Accenture's Apex Labs reports that at one victim the attackers planted a WEB SHELL ON 15 NOVEMBER - THE DAY BEFORE MITEL'S PATCH. From there: FIRST COMMAND TWELVE MINUTES after the first request. ROOT ON THE MICOLLAB SERVER WITHIN THIRTY MINUTES. And then the part that should change how you scope your response - the actor used MICOLLAB'S OWN STORED LDAP CONNECTOR CREDENTIALS to authenticate TO A DOMAIN CONTROLLER WITHIN THIRTY-TWO MINUTES. Thirty-two minutes from first contact to authenticated access against Active Directory, using credentials the product stores by design. If you patched MiCollab and did nothing else, YOU HAVE NOT FINISHED: the LDAP service account those boxes hold is a domain credential that an attacker may already have taken, and it survives the patch exactly as Drupal's admin accounts survive the upgrade. Rotate it.\n\nTHE AI DIMENSION, STATED CAREFULLY BECAUSE IT IS BEING OVERSTATED ELSEWHERE. Accenture observed the attacker's systems contacting TWO UNNAMED COMMERCIAL AI API SERVICES, and says its telemetry is SAMPLED so it cannot say how those services were used. Its assessment is that the activity is consistent with data triage, exploitation support, web-shell work or preparing extortion material. API CONTACTS ARE TIMING EVIDENCE, NOT PROOF OF AN AUTOMATED ATTACK, and no group has been named. Record it as suspected AI-assisted, not as AI-driven. Set alongside it the two harder data points: Amazon's MONAI Label finding of AI agents reaching root in eleven minutes, and the NCSC's 24 November publication that AI-assisted attacks have risen markedly since September WHILE EXPLOITING NOTHING NEW.\n\nTHAT LAST FINDING IS THE WHOLE LESSON OF THIS ENTRY. Look at what is on today's list: two Danfoss flaws with 2023 CVE identifiers. A refrigeration controller. An ASP.NET anti-CSRF library with no patch. A conferencing gateway. A CMS installer. An SD-WAN controller. A hypervisor management console. There is no common vendor, no common technology and - critically - NO COMMON OWNER INSIDE MOST ORGANISATIONS. There is no single team that can be told to fix this list. That is precisely how deadline collisions produce silent misses, and it is why this entry exists as a checklist rather than as analysis. The compression is not in the vulnerabilities themselves; the NCSC's finding is that nothing new is being exploited. The compression is in the interval between a flaw becoming known and becoming exploited - the Mitel web shell predated the patch, the Drupal bypass was abused the day it was disclosed, the GeoServer probes started within two days - AND A MONTHLY PATCH CYCLE NO LONGER FITS INSIDE THAT INTERVAL.\n\nONE SCHEDULING NOTE THAT MATTERS MORE THAN IT SOUNDS. Today is a SATURDAY. Eight deadlines fall on a day when most UK organisations have skeleton cover, and three more fall on the first working day after it. If nobody is rostered to act today, the honest position is that today's eight will be handled on Monday alongside Monday's three, which means ELEVEN CVES LAND ON ONE TEAM ON ONE MORNING. Decide now, explicitly, which of those you will do first, and write the decision down - because the alternative is not a prioritisation, it is an accident.","recommended_actions":["START WITH THE XEN ORCHESTRA EMPTY-TOKEN SEARCH. It is the cheapest high-yield action available today: search for authentication cookies or login tokens whose value is empty, {} or %7B%7D. That is effectively an exploit signature for CVE-2026-133469, it takes minutes, and the CVE is due today with forensic triage required.","ROTATE THE MITEL MICOLLAB LDAP SERVICE ACCOUNT CREDENTIALS IF YOU RUN MICOLLAB, PATCHED OR NOT. Accenture reports the actor used MiCollab's own stored LDAP connector credentials to authenticate to a DOMAIN CONTROLLER within 32 minutes of first contact. Those are domain credentials the product stores by design, and they survive the patch. Patching without rotating them leaves the attacker's best asset in place.","TREAT THE TWO FORENSIC TRIAGE ITEMS DUE TODAY AS INVESTIGATIONS, NOT PATCHES: CVE-2026-103406 (Juniper Session Smart) and CVE-2026-133469 (Vates Xen Orchestra) both reportedly require BOD 26-04 forensic triage. A patched appliance that was exposed is an appliance you have not yet cleared.","DEAL WITH CVE-2026-131914 (Idunno.AntiCsrf) TODAY IF YOU SKIPPED IT YESTERDAY. There is no patch and there never will be. Run a dependency-graph search across every .NET application and build pipeline you own - including transitive references - and remove or replace the package. This is the one item on the list that cannot be closed by a deployment, which is exactly why it gets silently skipped.","SEARCH FOR SALT MINION IDS CONTAINING SHELL METACHARACTERS OR COMMAND SUBSTITUTION SYNTAX on Juniper Session Smart Conductor, and watch 4505/tcp and 4506/tcp. That is the most searchable attacker-supplied artefact for CVE-2026-103406.","FOR DANFOSS AK-SM 800A, ACCEPT THAT REMEDIATION IS PARTIAL AND COMPENSATE WITH NETWORK CONTROL. Two of these CVEs date from 2023. Refrigeration system managers in UK supermarkets, cold stores, food manufacturing and hospital catering should not be internet-reachable at all. If you cannot patch, segment and restrict - and record that decision as a compensating control with a review date.","DO NOT DROP THE OVERDUE ITEMS. CVE-2026-132165 (Drupal, forensic triage), CVE-2026-131914 (no patch), CVE-2026-132224 (Optimizely), CVE-2026-133968 (MONAI Label, AI-agent exploited), CVE-2026-134624 (N-able Mail Assure), CVE-2026-123890 (vCenter) and CVE-2026-76466 (Cisco Expressway) are all past their dates and all still exploited. A passed deadline removes the compliance clock, not the attacker.","UK UNIVERSITIES AND NHS RESEARCH COMPUTING: CHECK FOR PROJECT MONAI LABEL SPECIFICALLY. Amazon Threat Intelligence reports AI agents found and exploited CVE-2026-133968 to reach a root shell on university servers in eleven minutes. Rank 7 of this report is a UK Russell Group university with an active extortion clock. Hunt traversal sequences - .., %2e%2e, %252e - against MONAI Label /datastore, /upload, /annotation, /infer and /train endpoints.","PUT TODAY'S EIGHT AND MONDAY'S THREE INTO ONE WRITTEN SEQUENCE BEFORE MONDAY MORNING. Today is a Saturday with skeleton cover. If nobody acts today, eleven exploited CVEs land on one team on Monday alongside the Drupal compromise assessment. Write the order down today; an unwritten priority is not a priority.","CHECK WHETHER YOUR VULNERABILITY MANAGEMENT TOOLING HAS REFRESHED ITS KEV FEED SINCE 27 NOVEMBER. Three CVEs were added last night. Any dashboard, exception report or supplier attestation built on an older pull is understating your position by three known-exploited flaws.","REREAD THE NCSC'S 24 NOVEMBER FINDING AGAINST THIS LIST, AND DRAW THE CONCLUSION IT POINTS TO. AI-assisted attacks have risen markedly since September while exploiting NOTHING NEW. Two items on today's list have 2023 CVE identifiers. The problem this list demonstrates is not novel vulnerabilities; it is the interval between disclosure and exploitation, which is now shorter than a monthly patch cycle. If your change process cannot deploy an internet-facing fix inside 72 hours, that is the finding to take out of this entry."],"references":["https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://www.cisa.gov/news-events/alerts/2026/11/27/cisa-adds-three-known-exploited-vulnerabilities-catalog","https://www.securityweek.com/mitel-micollab-zero-days-exploited-in-suspected-ai-assisted-attacks/","https://www.it-connect.tech/cisa-flags-10-exploited-flaws-in-danfoss-mitel-juniper-and-xen-orchestra/","https://securityonline.info/cisa-kev-catalog-micollab-juniper-danfoss/","https://cybersecuritynews.com/cisa-adds-10-flaws-to-kev/","https://cybersixt.com/cve/CVE-2026-133469","https://techcrunch.com/2026/11/24/uk-warns-ai-driven-cyberattacks-are-exposing-years-of-weak-security/","https://industrialcyber.co/ai/ncsc-warns-agentic-ai-frameworks-boost-cyberattacks-by-exploiting-exposed-credentials-api-flaws-security-gaps/","https://www.infosecurity-magazine.com/news/ncsc-ai-ransomware-threat-uk-cni/"],"kql":[{"platform":"sentinel","table":"W3CIISLog","name":"Xen Orchestra empty authentication token - the cheapest exploit signature available today","description":"RUN THIS FIRST. CVE-2026-133469 is an authentication bypass where an empty or empty-object token is accepted. A cookie or token whose value is empty, {} or %7B%7D is effectively an exploit signature rather than an anomaly. Due today with forensic triage required.","query":"W3CIISLog\n| where TimeGenerated > ago(30d)\n| where csUriStem has_any (\"/rest/\", \"/api/\", \"/signin\", \"/xo\") or csHost has_any (\"xo\", \"xen\", \"orchestra\")\n| extend Cookie = tostring(column_ifexists(\"csCookie\", \"\"))\n| where Cookie matches regex @\"(?i)(authenticationToken|token|session)=(\\s*|\\{\\}|%7B%7D|\\\"\\\"|null)(;|$)\"\n| project TimeGenerated, cIP, csHost, csUriStem, csMethod, scStatus, Cookie, csUserAgent, Computer\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"IdentityLogonEvents","name":"MiCollab LDAP service account authenticating where it should not - the 32-minute problem","description":"The highest-consequence query in this entry. Accenture reports the actor used MiCollab's stored LDAP connector credentials against a DOMAIN CONTROLLER within 32 minutes. Replace the account name list with your own MiCollab LDAP service accounts; any logon from a source other than the MiCollab hosts themselves is an escalation event.","query":"let MiCollabServiceAccounts = dynamic([\"svc_micollab\",\"micollab\",\"svc-mitel\",\"mitel_ldap\",\"svc_awv\"]);\nlet KnownMiCollabHosts = dynamic([\"micollab01\",\"micollab02\",\"awv01\"]);\nIdentityLogonEvents\n| where Timestamp > datetime(2026-11-14)\n| where AccountName has_any (MiCollabServiceAccounts)\n| extend SourceKnown = DeviceName has_any (KnownMiCollabHosts)\n| where not(SourceKnown)\n| project Timestamp, AccountName, AccountDomain, DeviceName, IPAddress, DestinationDeviceName, Protocol, LogonType, ActionType, Application\n| order by Timestamp desc"},{"platform":"sentinel","table":"Syslog","name":"Salt minion IDs containing shell metacharacters on Juniper Session Smart Conductor","description":"The most searchable attacker-supplied artefact for CVE-2026-103406, which is due today with mandatory forensic triage. A minion ID is an identifier; it should never contain a semicolon, pipe, backtick or command substitution syntax.","query":"Syslog\n| where TimeGenerated > ago(30d)\n| where ProcessName has_any (\"salt\", \"salt-master\", \"salt-minion\", \"AutomatedProvisioner\", \"conductor\")\n| where SyslogMessage has_any (\"minion\", \"minion_id\", \"accept_minion\", \"AutomatedProvisioner\")\n| where SyslogMessage matches regex @\"[;|&`$()\u003c>]|\\$\\(|\\x60\"\n| project TimeGenerated, Computer, Facility, SeverityLevel, ProcessName, SyslogMessage\n| order by TimeGenerated desc"},{"platform":"defender_xdr","table":"DeviceProcessEvents","name":"Web shell behaviour on a MiCollab or conferencing gateway host","description":"Accenture reports a web shell planted on 15 November - the DAY BEFORE Mitel's patch - with the first command 12 minutes after the first request and root within 30 minutes. If MiCollab was internet-facing before 16 November, this is the artefact to hunt, and patching does not remove it.","query":"DeviceProcessEvents\n| where Timestamp between (datetime(2026-11-10) .. now())\n| where DeviceName has_any (\"micollab\", \"mitel\", \"awv\", \"conference\")\n| where InitiatingProcessFileName in~ (\"httpd\", \"apache2\", \"nginx\", \"tomcat\", \"java\", \"php\", \"php-fpm\", \"w3wp.exe\")\n| where FileName in~ (\"sh\", \"bash\", \"dash\", \"curl\", \"wget\", \"python\", \"python3\", \"perl\", \"nc\", \"ncat\", \"ldapsearch\", \"cmd.exe\", \"powershell.exe\")\n| project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine\n| order by Timestamp asc"},{"platform":"sentinel","table":"W3CIISLog","name":"Path traversal against Project MONAI Label endpoints","description":"For UK universities and NHS research computing. Amazon Threat Intelligence reports AI agents exploited CVE-2026-133968 to reach a root shell on university servers in eleven minutes. This CVE is overdue and still exploited.","query":"W3CIISLog\n| where TimeGenerated > ago(45d)\n| where csUriStem has_any (\"/datastore\", \"/upload\", \"/annotation\", \"/infer\", \"/train\", \"/model\", \"/session\")\n| extend Payload = strcat(tostring(csUriStem), \" \", tostring(csUriQuery))\n| where Payload has_any (\"..\", \"%2e%2e\", \"%252e\", \"..%2f\", \"..\\\\\", \"%c0%ae\")\n| summarize Requests = count(), Paths = make_set(csUriStem, 20), Statuses = make_set(scStatus, 10), FirstSeen = min(TimeGenerated) by cIP, csHost, Computer\n| order by Requests desc"},{"platform":"sentinel","table":"CommonSecurityLog","name":"SSRF probe targets against mail security gateways (N-able Mail Assure CVE-2026-134624)","description":"An email security gateway occupies a high-trust position in the mail path, which is what makes this overdue SSRF worth hunting. Cloud instance metadata is the target an attacker wants most.","query":"let SsrfTargets = dynamic([\"169.254.169.254\",\"metadata.google.internal\",\"localhost\",\"127.0.0.1\",\"file://\",\"gopher://\",\"dict://\",\"metadata.azure.com\"]);\nCommonSecurityLog\n| where TimeGenerated > ago(45d)\n| where DeviceProduct has_any (\"Mail Assure\", \"N-able\", \"SpamExperts\") or DeviceVendor has \"N-able\"\n| where RequestURL has_any (SsrfTargets) or Message has_any (SsrfTargets)\n| project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, DestinationIP, RequestURL, Activity, Message\n| order by TimeGenerated desc"},{"platform":"sentinel","table":"DeviceTvmSoftwareVulnerabilities","name":"Your own exposure against the full 18-CVE wall, ranked by deadline","description":"The management view. Produces a single list of affected devices for every CVE due today, overdue, or due Monday, so that the eleven-CVE Monday collision can be sequenced from evidence rather than guesswork. Requires Defender Vulnerability Management data in Sentinel.","query":"let DueToday = dynamic([\"CVE-2026-133275\",\"CVE-2026-133303\",\"CVE-2026-133323\",\"CVE-2026-133324\",\"CVE-2026-103406\",\"CVE-2026-133469\",\"CVE-2023-25914\",\"CVE-2023-25915\"]);\nlet Overdue = dynamic([\"CVE-2026-132165\",\"CVE-2026-131914\",\"CVE-2026-132224\",\"CVE-2026-133968\",\"CVE-2026-134624\",\"CVE-2026-123890\",\"CVE-2026-76466\"]);\nlet DueMonday = dynamic([\"CVE-2026-136716\",\"CVE-2026-120705\",\"CVE-2026-129243\"]);\nlet Due9Dec = dynamic([\"CVE-2026-133311\",\"CVE-2025-41450\"]);\nDeviceTvmSoftwareVulnerabilities\n| where CveId in (DueToday) or CveId in (Overdue) or CveId in (DueMonday) or CveId in (Due9Dec)\n| extend Bucket = case(CveId in (Overdue), \"1-OVERDUE\", CveId in (DueToday), \"2-DUE TODAY 28 NOV\", CveId in (DueMonday), \"3-DUE MON 30 NOV\", \"4-DUE 9 DEC\")\n| summarize Devices = dcount(DeviceName), DeviceList = make_set(DeviceName, 50), Software = make_set(SoftwareName, 10) by Bucket, CveId, VulnerabilitySeverityLevel\n| order by Bucket asc, Devices desc"}],"iocs":[{"type":"behaviour","value":"An authentication cookie or login token whose value is empty, {} or %7B%7D (Vates Xen Orchestra CVE-2026-133469)","context":"EFFECTIVELY AN EXPLOIT SIGNATURE AND THE SINGLE HIGHEST-YIELD, LOWEST-COST SEARCH IN THIS REPORT. Carried forward from earlier windows and still the best indicator available. Due today with forensic triage required.","confidence":"high","source":"Vates advisory and vulnerability write-ups via secondary reporting"},{"type":"account","value":"MiCollab LDAP connector service account authenticating from any host other than the MiCollab servers themselves","context":"THE MOST CONSEQUENTIAL NEW INDICATOR IN THIS WINDOW. Accenture reports the actor used MiCollab's own stored LDAP connector credentials to authenticate to a DOMAIN CONTROLLER within 32 minutes of first contact. These are domain credentials the product stores by design and they SURVIVE THE PATCH. Rotate them.","confidence":"high","source":"Accenture Apex Labs via SecurityWeek and secondary reporting"},{"type":"behaviour","value":"A Salt minion ID containing shell metacharacters or command substitution syntax (Juniper Session Smart Conductor AutomatedProvisioner)","context":"The most searchable attacker-supplied artefact for CVE-2026-103406, due today with mandatory forensic triage. A minion ID is an identifier and should never contain a semicolon, pipe, backtick or $( ).","confidence":"high","source":"Juniper SIRT and vulnerability write-ups via secondary reporting"},{"type":"port","value":"4505/tcp and 4506/tcp","context":"SaltStack publish and request ports on Juniper Session Smart Conductor. Exposure of these to anything beyond the management network is the precondition for CVE-2026-103406.","confidence":"high","source":"Vulnerability write-ups via secondary reporting"},{"type":"behaviour","value":"Traversal sequences - .., %2e%2e, %252e, ..%2f - against Project MONAI Label /datastore, /upload, /annotation, /infer and /train endpoints","context":"CVE-2026-133968, overdue since 23 November and still exploited. Amazon Threat Intelligence reports AI agents found and exploited this to reach a root shell on university servers in ELEVEN MINUTES. Directly relevant to UK universities and NHS research computing.","confidence":"high","source":"Amazon Threat Intelligence via secondary reporting"},{"type":"behaviour","value":"SSRF probe targets against mail security gateways - 169.254.169.254, metadata.google.internal, localhost, 127.0.0.1, file://, gopher://, dict:// (N-able Mail Assure CVE-2026-134624)","context":"Overdue since 23 November. An email security gateway holds a high-trust position in the mail path, which is what makes a successful SSRF there disproportionately valuable to an attacker.","confidence":"high","source":"N-able advisory and write-ups via secondary reporting"},{"type":"behaviour","value":"A web shell on a MiCollab or AWV host dated 15 November 2026 or earlier - the day BEFORE Mitel's 16 November patch","context":"Accenture's timeline: web shell planted 15 November, first command 12 minutes after first request, root within 30 minutes, domain controller authentication at 32 minutes. If MiCollab was internet-facing before 16 November, patching does not remove this.","confidence":"high","source":"Accenture Apex Labs via SecurityWeek and secondary reporting"},{"type":"uri_path","value":"/awv","context":"Mitel MiCollab Audio, Web and Video Conferencing component path - the attack surface for all five AWV CVEs, four of which are due today.","confidence":"high","source":"Mitel MISA-2026-0012 and write-ups via secondary reporting"},{"type":"note","value":"DUE TODAY 28 NOVEMBER - EIGHT CVES: CVE-2026-133275, CVE-2026-133303, CVE-2026-133323 (CVSS 10.0) and CVE-2026-133324 (Mitel MiCollab AWV); CVE-2026-103406 (HPE Juniper Session Smart, FORENSIC TRIAGE); CVE-2026-133469 (Vates Xen Orchestra, CVSS 9.8, FORENSIC TRIAGE); CVE-2023-25914 and CVE-2023-25915 (Danfoss AK-SM 800A)","context":"Today is a SATURDAY. Eight deadlines on a skeleton-cover day. Note the 2023 identifiers on the Danfoss pair - these are not new flaws.","confidence":"high","source":"CISA KEV catalogue via search-surfaced summaries and trackers"},{"type":"note","value":"OVERDUE AS OF TODAY - SEVEN CVES: CVE-2026-132165 (Drupal, FORENSIC TRIAGE, due 27 Nov), CVE-2026-131914 (Idunno.AntiCsrf, NO PATCH EXISTS, due 27 Nov), CVE-2026-132224 (Optimizely, due 27 Nov), CVE-2026-133968 (MONAI Label), CVE-2026-134624 (N-able Mail Assure), CVE-2026-123890 (VMware vCenter, CVSS 9.8), CVE-2026-76466 (Cisco Expressway)","context":"A passed deadline removes the compliance clock, not the attacker. CVE-2026-131914 could not be met by patching yesterday and still cannot: the only remediation is removing or replacing the dependency.","confidence":"high","source":"CISA KEV catalogue and prior windows of this feed"},{"type":"note","value":"DUE MONDAY 30 NOVEMBER - THREE NEW CVES added 27 November: CVE-2026-136716 (Drupal, rank 3), CVE-2026-120705 and CVE-2026-129243 (OSGeo GeoServer, rank 2). DUE 9 DECEMBER: CVE-2026-133311 (Mitel) and CVE-2025-41450 (Danfoss)","context":"If today's eight are not actioned today, ELEVEN exploited CVEs land on one team on Monday morning, alongside the Drupal compromise assessment. Write the sequence down before Monday.","confidence":"high","source":"CISA alert of 27 November 2026 and KEV catalogue"},{"type":"note","value":"MITEL EXPLOITATION TIMELINE (Accenture Apex Labs): web shell planted 15 NOVEMBER - the day BEFORE the patch; first command 12 MINUTES after first request; root on the MiCollab server within 30 MINUTES; authentication to a DOMAIN CONTROLLER using MiCollab's stored LDAP connector credentials at 32 MINUTES","context":"The single most instructive timeline in this report. It is also why patching MiCollab is insufficient: the LDAP service account is a domain credential the product stores by design, and it survives the patch.","confidence":"high","source":"Accenture Apex Labs via SecurityWeek and secondary reporting"},{"type":"note","value":"AI DIMENSION - STATED CAREFULLY: Accenture observed the attacker's systems contacting TWO UNNAMED COMMERCIAL AI API SERVICES, says its telemetry is SAMPLED and that it CANNOT say how the services were used; its assessment is consistency with data triage, exploitation support, web-shell work or extortion preparation. No group has been named","context":"API CONTACTS ARE TIMING EVIDENCE, NOT PROOF of an automated attack. Record as SUSPECTED AI-assisted. This is being overstated elsewhere; do not repeat the stronger framing.","confidence":"medium","source":"Accenture Apex Labs via SecurityWeek and secondary reporting"},{"type":"note","value":"Mitel's own advisory, last updated 24 November, does NOT mention in-the-wild exploitation of these vulnerabilities; CISA lists all five as actively exploited and Accenture has published an exploitation timeline","context":"An unresolved vendor-versus-authority discrepancy carried forward. Planning assumption is CISA's and Accenture's.","confidence":"high","source":"Mitel advisory versus CISA KEV and Accenture, via secondary reporting"},{"type":"note","value":"EIGHTEEN distinct exploited CVEs across TWELVE unrelated product families fall due, overdue or newly listed inside a single week - a PHP CMS, a map server, an ASP.NET library, an A/B testing platform, a medical imaging tool, a mail gateway, an SD-WAN controller, a hypervisor console, a UC platform, a refrigeration controller, a virtualisation platform and a video conferencing gateway","context":"No common vendor, no common technology, NO COMMON OWNER inside most organisations. There is no single team that can be told to fix this list - which is precisely how deadline collisions produce silent misses.","confidence":"high","source":"Analyst aggregation across the CISA KEV batches of 20, 23, 24, 25 and 27 November 2026"},{"type":"note","value":"KEV DEADLINE DATES in this entry are reconstructed from secondary reporting and tracker records because the CISA KEV catalogue itself could not be retrieved directly in this session. Where sources conflict the EARLIEST date is used as the planning assumption","context":"Verify against the catalogue directly before using any date as audit evidence. One source did not give a CVE-specific due date for CVE-2026-103406 and reported the 28 November date for the batch overall.","confidence":"medium","source":"Analyst assessment - collection limitation"}]},{"rank":5,"id":"TI-2026-11-28-005","title":"A WORKING EXPLOIT DROPPED ON THANKSGIVING WITH NO PATCH, NO CVE AND NO VENDOR WARNING: The Cacti '4HTTP2SHELL' Zero-Day Gives UNAUTHENTICATED Command Execution Against Cacti Core 1.2.31 Through a Second-Order SQL Injection in the GUEST PROFILE - Released WITHOUT Disclosure to the Project, and the Only Mitigation Today Is to Disable the Guest Account","cve_ids":[],"vendor":"The Cacti Group","affected_products":["Cacti Core 1.2.31 (confirmed tested by the researcher)","Earlier Cacti Core versions - scope UNKNOWN, not established by any source","Cacti guest user account and graph display preferences","Cacti real-time poller command execution path"],"category":"vulnerability","cvss_v3":null,"severity":"critical","exploitation_status":"public_poc_available","kev_listed":false,"kev_due_date":null,"patch_available":"no","first_reported":"2026-11-26","last_updated":"2026-11-28","confidence":"high","summary":"THIS IS THE ONLY ITEM IN THIS REPORT WHERE A WORKING EXPLOIT EXISTS AND A FIX DOES NOT. On THANKSGIVING DAY, 26 NOVEMBER 2026, a researcher using the handle 'ek0ms savi0r', associated with the Church of Malware, published a working exploit for an unpatched flaw in Cacti. The exploit is called 4HTTP2SHELL (earlier 4HTTP2ROOT). It was NOT disclosed to the Cacti project before public release. There is NO CVE identifier, NO official severity rating and NO patch. That combination - full-disclosure drop, holiday timing, no vendor lead time - means the exploitation window opened before anyone could close it, and it is still open today.\n\nWHAT IT DOES AND WHAT IT NEEDS. The flaw is a STORED, SECOND-ORDER SQL INJECTION. The exploit writes malicious SQL into a GUEST USER'S GRAPH DISPLAY PREFERENCES; that stored value is later interpolated unsafely and alters the commands executed by CACTI'S REAL-TIME POLLER, which is the component whose job is to run commands. The result is remote command execution. The preconditions are the crux of the entry: NO CREDENTIALS and NO API KEY ARE REQUIRED, but THE CACTI GUEST ACCOUNT MUST BE ENABLED. That is the whole gate. If the guest account is disabled, this exploit does not work. If it is enabled and the interface is reachable, an unauthenticated attacker can run commands.\n\nTHE PRIVILEGE CLAIM NEEDS DEFLATING, AND HONESTY HERE IS MORE USEFUL THAN ALARM. The researcher demonstrated ROOT-LEVEL execution, but did so IN A LAB WHERE CACTI WAS ALREADY RUNNING AS ROOT. Typical deployments run Cacti as www-data or apache. So the realistic outcome on a normal installation is command execution AS THE WEB SERVER USER, not root. That is still a serious compromise - it is a foothold inside your monitoring infrastructure - but 'unauthenticated root' is an overstatement of the default case and should not be repeated as though it were the baseline.\n\nWHY CACTI IS A DISPROPORTIONATELY BAD PLACE TO LOSE, AND THIS IS THE PART THAT SHOULD DRIVE YOUR PRIORITISATION. Cacti is a network graphing and monitoring platform. To do its job it holds, by design: SNMP community strings and SNMPv3 credentials for your network estate; often SSH or device credentials for data collection; a database of your network topology, device inventory, interface naming and addressing; and a POLLER THAT EXECUTES COMMANDS ON A SCHEDULE. An attacker who reaches command execution on a Cacti host does not get one server - they get a credential store for the network, a map of the network, and a legitimate scheduled execution mechanism to hide in. In UK terms this matters most to the organisations that monitor large estates with open-source tooling: local authorities, universities, NHS trusts, ISPs and managed service providers, water and energy operators, and the long tail of mid-sized enterprises that never bought a commercial NMS. It is also the kind of system that is frequently deployed on a flat management network with broad reach, and frequently forgotten.\n\nEXPLOITATION STATUS, STATED PRECISELY. As of 27 November there were NO REPORTS of this being exploited in attacks. It is NOT in CISA KEV - correctly, because exploitation has not been reported. This entry therefore carries exploitation_status 'public_poc_available' rather than 'exploited_in_the_wild'. DO NOT TREAT THAT AS COMFORT. A public, tested, unauthenticated exploit against an internet-reachable monitoring platform with no patch available is the configuration that produces mass exploitation within days, and the holiday release means the clock started while most defenders were away. The honest statement is: not yet exploited as far as anyone has reported, and there is nothing standing in the way of it being exploited.\n\nVERSION SCOPE IS GENUINELY UNKNOWN AND THAT CUTS BOTH WAYS. The researcher tested against Cacti Core 1.2.31. NO SOURCE establishes whether earlier versions are affected. Do not assume an older version is safe, and do not assert that it is vulnerable either. The guest account check is version-independent and is therefore the right thing to act on while the scope question is unresolved.\n\nMITIGATION IS CHEAP, SPECIFIC AND AVAILABLE RIGHT NOW, WHICH IS WHY THIS ENTRY IS ACTIONABLE DESPITE HAVING NO PATCH. DISABLE THE GUEST ACCOUNT. That removes the precondition. Then RESTRICT THE WEB INTERFACE to trusted management networks, which removes the reachability. Then do the two forensic checks the reporting specifically recommends: REVIEW POLLER CONFIGURATIONS FOR UNEXPECTED COMMANDS, and CHECK LOGS FOR NON-NUMERIC VALUES IN GRAPH DISPLAY SETTINGS. That last one is unusually precise for an item with no CVE - a graph display preference is supposed to hold a number, so a non-numeric value in that field is the stored payload itself. It is a direct search for the artefact.\n\nONE STRUCTURAL OBSERVATION WORTH RECORDING. This is the second item in this single report where the fix is not a patch: CVE-2026-131914 (Idunno.AntiCsrf, rank 4) has no patch and never will, and this Cacti flaw has no patch yet. Both are remediated by configuration or removal rather than deployment. Organisations whose vulnerability management process is fundamentally a patch-deployment pipeline will struggle with both, and will tend to leave both open while reporting green on everything that could be patched. That is a process finding, not a technical one, and it is worth raising with whoever owns the pipeline.","recommended_actions":["DISABLE THE CACTI GUEST ACCOUNT TODAY. This single change removes the precondition for the exploit - no credentials are n
